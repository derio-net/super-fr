bump: patch
summary: "triage batch drive survives disruption: a close-out is recorded before its session starts, so a restarted driver never starts a second one; a failed git fetch, a refused archive merge, a rejected update push or a broken config on main skips that pass (or that PR) instead of ending the loop, and every git call is bounded by a timeout; a repo collect skipped has its batches left out of the pass; an unknown top-level `.fr/triage.yaml` key added by the driver's own merges is ignored with one warning, and a `post_merge` that installs a newer fr restarts the driver on it."
