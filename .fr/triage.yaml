# fr triage batches: repo config (spec 2026-09-25-triage-batches §3.I).
# Read by `fr triage collect` from origin/main; dispatch and merge refuse a
# collected copy that no longer matches origin/main, so re-collect after editing.
defaults:
  launch:
    runner: herdr
    harness: claude
# Run by `fr triage batch drive` once per merged batch, before its close-out, from
# the base clone fast-forwarded to origin/main (wave-driver spec R14), so later
# batches run on the merged plugin, hooks and fr. An argument list, never a shell
# string. `--version main` is what makes it install the merged checkout: with no
# --version, install.sh installs the newest stable release instead. install.sh refuses
# a base clone that is off main or has stray files; that holds the close-out and warns
# each pass until the clone is clean.
post_merge: ["./scripts/install.sh", "--version", "main"]
# After a pass in which post_merge succeeded, the driver restarts the idle sessions of the
# runner once (driver-sessions spec R6), so they load the plugins, hooks and fr it installed.
# The driver's own pane is never restarted. `none` turns it off.
post_merge_restart: idle
# The driver's merge method. A configured method wins over the forge's default, which is only
# the viewer's (#1702). It must be `merge` here: under `queue.land: push` only a merge commit
# makes GitHub mark a pushed PR merged (a squash or rebase push closes it unmerged, #1705), and
# this repo's release attributes PRs by first-parent `Merge pull request #N`, which a rebase
# breaks (#1603). Under `forge.api: rest` fr cannot read a default at all (fr-triage skill,
# "The driver").
merge_method: merge
# No `version:` block, deliberately (spec 2026-09-26-version-bump-churn §3.F):
# super-fr PRs never edit a version, so a batch reserves no number. The worker
# adds a `.changes/` fragment per AGENTS.md and release.yml assigns the number.
# Triage state export to docs/triage on every finished wave (spec R13).
export:
  path: docs/triage
# The wave merge queue (spec 2026-11-19-wave-merge-queue): this repo's workflows that report a
# required check run on pushes to `fr-queue/**`; the driver lands by a direct push (the ruleset
# forbids only force-push and deletion), and the release workflow cuts the wave's release.
queue:
  ci: push
  # Up to three combinations in CI at once: a wave's non-overlapping entries stack and land together.
  depth: 3
  land: push
  release: workflow
  # No `release_workflow:` on purpose: release.yml already runs on the drained `fr-hold/**` push.
# The commands that regenerate this repo's generated files, and the globs of the files they
# write in whole (spec 2026-11-24-ci-economy R13). The wave merge queue takes the combination's
# side of a conflicted generated file (and of a conflicted `<!-- generated:NAME -->` block) and
# runs these, in order, in a copy of the combination's tracked files with no git directory;
# a conflict brief names them too. Each
# runs through `uv run --frozen`, so the combination's own fr is imported and uv.lock is never
# rewritten. README.md and docs/reference/cli.md are not listed: sync-readme.py writes only
# their generated blocks, which the queue resolves by block.
mirrors:
  - [uv, run, --frozen, python, scripts/sync-readme.py]
  - [uv, run, --frozen, python, scripts/sync-opencode.py]
  - [uv, run, --frozen, python, scripts/sync-hermes.py]
  - [uv, run, --frozen, python, scripts/sync-agents-data.py]
  - [uv, run, --frozen, python, scripts/sync-lenses-data.py]
generated:
  - ".opencode/skills/*"         # sync-opencode.py: skill mirrors and their .source notes
  - ".opencode/instructions/*"   # sync-opencode.py: rule mirrors
  - ".opencode/agent/*"          # sync-opencode.py: per-tier subagent files
  - ".opencode/commands/*"       # sync-opencode.py: slash commands
  - ".hermes/skills/fr/*"        # sync-hermes.py: skill mirrors and their .source notes
  - ".hermes/SOUL.d/super-fr-rules.md"           # sync-hermes.py: the rules block
  - "packages/fr/src/fr/agents/*.md"             # sync-agents-data.py: the wheel's agents
  - "packages/fr/src/fr/lens_manifests/*.yaml"   # sync-lenses-data.py: the wheel's lenses
