# fr triage batches: repo config (spec 2026-09-25-triage-batches §3.I).
# Read by `fr triage collect` from origin/main; dispatch and merge refuse a
# collected copy that no longer matches origin/main, so re-collect after editing.
defaults:
  launch:
    runner: herdr
    harness: claude
# No `version:` block, deliberately (spec 2026-09-26-version-bump-churn §3.F):
# super-fr PRs never edit a version, so a batch reserves no number. The worker
# adds a `.changes/` fragment per AGENTS.md and release.yml assigns the number.
