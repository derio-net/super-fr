name: PR spec status (self)
on:
  pull_request:
    types: [closed]

# `pull_request: types: [closed]` triggers on both merged and unmerged
# closures — GitHub doesn't expose a "merged-only" trigger. Filter at
# the job level so unmerged PRs don't queue a reusable-workflow run we
# don't care about.
#
# Reusable workflows can only request permissions up to what the caller
# grants. fr-spec-status.yml needs `pull-requests: write` to post the
# comment, so we declare it here too.
permissions:
  pull-requests: write
  contents: read

jobs:
  status:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/fr-spec-status.yml
