name: acceptance-report

# The acceptance matrix (docs/acceptance/matrix.yaml) rendered + gated.
# - `failing` rows FAIL this workflow (by design — fix or re-classify).
# - debt rows (`unwired` / `walk-owed` / `not-implemented`) surface as warning
#   annotations; the backfill rule (.claude/rules/acceptance-matrix.md) owns their lifecycle.
# - A Markdown summary is written to each Actions run (PR, main).
# - The built report (GitHub-linked at this ref) is uploaded as an artifact.
# - The weekly run (and a dispatch with `debt`) upserts one "super-fr: Technical debt"
#   issue (closed at zero debt) and refreshes a draft PR archiving long-merged plans.
# Sister-repo refs are not verifiable here (no checkout) — `fr acceptance
# check` warns and verifies them on local runs, where siblings exist.
# If PR-time path filters are added later, they must include every own-repo
# path the matrix references — `fr acceptance check` warns when one falls outside them.

# push is scoped to main: `["**"]` overlapped pull_request and ran the gate
# twice on every PR push (#941).
on:
  pull_request: {}
  merge_group: {}  # a merge queue's group branch (merge-train-safety R15)
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * 1" # weekly, Monday 05:47 UTC
  workflow_dispatch:
    inputs:
      debt:
        description: Run the technical-debt steps now
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install fr (from this checkout — super-fr self-hosts)
        # Deviation from the scaffolded template on purpose: installing from
        # @main would gate every PR that changes `fr acceptance` behavior
        # with the PRE-PR fr (version skew — review finding on #352).
        run: uv tool install ./packages/fr
      - name: Check matrix (gate — failing rows fail here)
        run: fr acceptance check
      - name: Write Actions summary (PR / main)
        if: always()
        run: fr acceptance summary >> "$GITHUB_STEP_SUMMARY"
      - name: Build report (GitHub links at this ref)
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: fr acceptance report --link-mode github --ref "$REF"
      - name: Upload report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-report
          path: docs/acceptance/report.html
          retention-days: 90

  # The debt job holds the write permissions and the dedicated token; the matrix
  # job above (which runs a PR's code) holds neither. No `needs:` on matrix: a
  # week with failing rows still updates the issue.
  debt:
    if: github.event_name == 'schedule' || inputs.debt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.FR_DEBT_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install fr (from this checkout — super-fr self-hosts)
        run: uv tool install ./packages/fr
      - name: Technical debt issue (weekly)
        env:
          GH_TOKEN: ${{ github.token }}
        run: fr debt issue --yes
      - name: Archive sweep PR (weekly)
        env:
          GH_TOKEN: ${{ github.token }}
          FR_DEBT_TOKEN: ${{ secrets.FR_DEBT_TOKEN }}
        run: fr debt archive-pr --yes
