name: CI
# push is scoped to main: an unscoped push overlaps pull_request, and every
# push to a PR branch ran the whole workflow twice (#941). `fr-queue/**` are the wave
# merge queue's slot branches (wave-merge-queue R7, R21): it lands only a combination whose
# checks passed there.
on:
  push:
    branches: [main, 'fr-queue/**']
  pull_request:
  # A merge queue builds each group on its own branch (merge-train-safety R15).
  merge_group:

# The floor we declare (`requires-python = ">=3.14"`) is the one interpreter we
# test (#940, #1589), not whatever Python the runner ships. An env var rather
# than a committed `.python-version`, so it does not also pin an operator's
# local runs. Every job inherits it; tests/unit/test_ci_python_floor.py keeps it
# equal to the requires-python floor.
env:
  UV_PYTHON: "3.14"

# Default token is read-only; a job's own permissions block replaces this (classify, scoped-tests, ci-ok).
permissions:
  contents: read

# A newer push to a pull request supersedes its older run (ci-economy R1): only the
# head counts, so the older run is cancelled. A push to main or fr-queue/** and a merge
# group get a group of their own (the run id) and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One lane per run (ci-economy R5, R15), chosen by scripts/ci_lane.py:
  # - landed: a push to main whose sha already passed this workflow on an fr-queue/**
  #   push. Only validate-artifacts (main's strict check) and ci-ok run again.
  # - light: a pull request that changes nothing installable, nothing under tests/ and
  #   nothing under .github/. scoped-tests runs instead of the shards.
  # - full: everything else, a merge group and an fr-queue/** push included, and any
  #   answer the script cannot read for sure.
  # Full history: the merge base of a pull request must be reachable.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      trusted_run: ${{ steps.lane.outputs.trusted_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No uv and no Python install: ci_lane.py is stdlib only, so the runner's own python3
      # runs it, and every job waits on this one (review p2-r3).
      - name: Choose this run's lane
        id: lane
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          REPO: ${{ github.repository }}
          # Only `landed` reads the forge: a pull request's own ci_lane.py gets no token.
          GH_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.token || '' }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            python3 scripts/ci_lane.py landed --sha "$GITHUB_SHA" --run "$GITHUB_RUN_ID" --repo "$REPO"
          elif [ "$EVENT" = pull_request ]; then
            python3 scripts/ci_lane.py classify --base "$BASE_REF"
          else
            echo "lane=full" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: classify
    if: needs.classify.outputs.lane != 'landed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - run: uv run ruff check packages/ tests/
      - run: uv run ruff format --check packages/ tests/

  typecheck:
    needs: classify
    if: needs.classify.outputs.lane != 'landed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - run: uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-cncd/src packages/fr-herdr/src packages/fr-claude-cloud/src

  # Shard weights (spec 2026-11-01-ci-speed §3.B). ONE durations file is chosen
  # per run and uploaded, so a cache save landing mid-run cannot make two
  # shards split differently: the newest `test-durations-*` cache entry (saved
  # by `split-check` from main's own CI measurements), else the committed
  # `.test_durations`.
  plan:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/test-durations.json
          key: test-durations-none
          restore-keys: test-durations-
      - name: Choose the durations file for this run
        run: |
          mkdir -p plan
          if [ -f cache/test-durations.json ]; then
            cp cache/test-durations.json plan/durations-plan.json
          else
            cp .test_durations plan/durations-plan.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-plan
          path: plan/durations-plan.json
          retention-days: 1

  # What the suite collects, with the shards' own addopts and no split or
  # coverage; `split-check` proves the shards ran exactly this set (R5).
  collect:
    needs: classify
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - run: >-
          uv run pytest -o addopts="--strict-markers" --collect-only -q
          > collected.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collected
          path: collected.txt
          retention-days: 1

  test:
    needs: [classify, plan]
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 7, not 6 (gh#1428): runner speed varies x0.72-x1.40 between runs, and
        # at 6 a slow runner's shard alone filled the 360 s budget.
        shard: [1, 2, 3, 4, 5, 6, 7]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test_tripwire_unarchived_plans reads origin/main to scope the
          # merged-but-unarchived check (#334); full history makes the ref
          # available. Kept on every shard, not just one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: durations-plan
      - name: Every shard splits by the plan's one file
        run: cp durations-plan.json shard-durations.json
      # Sharded with pytest-split (spec 2026-09-26 §3.A, 2026-11-01 §3.B).
      # addopts is CLEARED, not patched, and --strict-markers is re-added
      # explicitly: pytest-cov accumulates --cov-report values, so a CLI
      # --cov-report= could not cancel addopts' term-missing, and clearing
      # addopts is what drops it. Every shard measures coverage; --cov-report=
      # asks for no report, since the `coverage` job
      # below holds the --cov-fail-under=75 gate that addopts holds locally.
      # --clean-durations makes shard-durations.json hold exactly the tests
      # this shard ran; `split-check` compares those files to `collect`.
      - run: >-
          uv run pytest -o addopts="--strict-markers" --cov --cov-report=
          -n auto --splits 7 --group $SHARD
          --splitting-algorithm least_duration
          --durations-path shard-durations.json --store-durations --clean-durations
          --durations=25
          --junitxml=junit-shard.xml
        env:
          SHARD: ${{ matrix.shard }}
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
      # A failed test as a check-run annotation, readable through the REST API
      # (`check-runs/{id}/annotations`) where the job log is not: the log is
      # served from a blob host a Claude Code cloud session's proxy refuses, so
      # without this a red shard there says only "exit code 1" (cloud-triage
      # discovery `ci-logs-unreachable`).
      - if: failure()
        run: >-
          uv run --no-project python scripts/junit_annotations.py junit-shard.xml
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: durations-shard-${{ matrix.shard }}
          path: shard-durations.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  # R5: the tests the shards ran are exactly the tests collected, none twice.
  # On a push to main it also saves the shards' measured durations as the next
  # run's plan.
  split-check:
    needs: [classify, test, collect]
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: durations-shard-*
          path: shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: collected
          path: collected
      - name: Shards ran exactly what was collected
        run: >-
          uv run --no-project python scripts/split_check.py check
          --collected collected/collected.txt
          shards/durations-shard-*/shard-durations.json
      - name: Merge the shards' measured durations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          uv run --no-project python scripts/split_check.py merge
          -o cache/test-durations.json
          shards/durations-shard-*/shard-durations.json
      - name: Save them as the next run's plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/test-durations.json
          key: test-durations-${{ github.run_id }}

  # Combines the 7 shards' coverage data and holds the --cov-fail-under=75
  # gate that a single unsharded `test` job used to hold via addopts.
  coverage:
    needs: [classify, test]
    if: needs.classify.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - run: uv run coverage combine .coverage.shard*
      - run: uv run coverage report --fail-under=75

  # The light lane's tests (ci-economy R16): what this pull request's changes reach,
  # plus the smoke set, instead of the shards. Full history: --fr-scope diffs against
  # the merge base with the base branch.
  scoped-tests:
    needs: classify
    if: needs.classify.outputs.lane == 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - name: The tests this change reaches
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run pytest --fr-scope "origin/$BASE_REF" -q --no-cov -n auto

  # Runs in every lane, the landed one included: on main it is the strict check
  # (ci-economy R5), which an fr-queue/** run does not make.
  validate-artifacts:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # placement drift reads origin/fr and the default branch (R28)
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # A CLEAN install, like `acceptance-report.yml` — not `uv sync` + `uv run`
      # (review r5-d4). The validator's own resolution depends on packaging: the
      # shipped workflow manifests now travel INSIDE the `fr` wheel, so a
      # workspace run would validate files the wheel might not actually ship.
      - name: Install fr (from this checkout — super-fr self-hosts)
        run: uv tool install ./packages/fr
      # Spec 2026-08-30 3.F: every version ships a structure validator, and CI
      # runs it over the repo's own artifacts.
      #
      # `fr validate` is EXEMPT from the migration gate (review r5-c5 corrected
      # the note that used to sit here). A stale artifact is therefore reported
      # by the VALIDATOR'S OWN stamp check — "stale: written for version N, this
      # fr writes M — run `fr migrate artifacts --yes`" — not by the gate
      # refusing first. That exemption is deliberate: if the gate ran ahead of
      # this command, a stale artifact would be unobservable to a human, since
      # interactively the gate would have already fixed it. Either way the
      # instruction is the same (`fr migrate artifacts --yes`, committed in the
      # same PR; see .claude/rules/artifact-versioning.md).
      #
      # A pull request and the merge queue's combinations (`fr-queue/**`) accept a stale
      # artifact that a registered migration moves (`--allow-migratable`, wave-merge-queue
      # R21): the next release migrates it, and a live run cursor on the default branch
      # between a feature merge and its close-out read as stale and failed every other PR
      # (#1564). The default branch itself is held to the strict check.
      - name: Every live artifact is structurally valid for this fr (the default branch)
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/heads/fr-queue/')
        run: fr validate artifacts
      - name: Every live artifact is valid, or stale and migratable (pull request, queue)
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/fr-queue/')
        run: fr validate artifacts --allow-migratable

  opencode-plugin-test:
    needs: classify
    if: needs.classify.outputs.lane != 'landed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        opencode: ["2.0.32", "2.1.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        working-directory: packages/fr-opencode-plugin
        run: bun install --frozen-lockfile
      # `bun test` transpiles and never typechecks, so a hook event read through
      # the wrong field name would ship green (found reviewing the V2 port).
      - name: Typecheck the plugin
        working-directory: packages/fr-opencode-plugin
        run: bunx tsc --noEmit
      - name: Run OpenCode plugin tests
        working-directory: packages/fr-opencode-plugin
        run: bun test
      # gh#563: the plugin install.sh DELIVERS must be one the real OpenCode
      # binary loads and runs. Pinned to the version the probe was written
      # against (OpenCode 2 ships as `@opencode/cli`; `opencode-ai` stops at 1.x); FR_REQUIRE_OPENCODE=1 turns a missing binary into a failure,
      # so the probe cannot silently skip here.
      - name: Install OpenCode
        run: npm install -g @opencode/cli@${{ matrix.opencode }}
        # Measured on 2.0.32 (the port) and 2.1.0 (current); both are the same
        # V2 API. A drift in either is what this probe exists to catch.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Live delivery probe (real opencode binary)
        env:
          FR_REQUIRE_OPENCODE: "1"
        run: uv run pytest --no-cov -q tests/integration/test_opencode_plugin_live.py

  version-sync:
    needs: classify
    if: needs.classify.outputs.lane != 'landed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: pyproject.toml / plugin.json / marketplace.json agree
        run: uv run --no-project python scripts/bump-version.py --check

  change-fragment:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && needs.classify.outputs.lane != 'landed'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: User-visible changes add a change fragment; no PR edits a version
        # Through env, never interpolated into the script (gh#1289).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project python scripts/check-change-fragment.py "origin/$BASE_REF"

  # Docs currency (spec 2026-11-11-docs-currency R11): every flow ends in a PR,
  # so this is the gate none can skip. A pull request diffs against its base; a
  # push to main runs the structural checks only, and a merge group diffs
  # against the default branch (R6). No `.fr/docs.yaml`: nothing to check.
  docs-check:
    needs: classify
    if: needs.classify.outputs.lane != 'landed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Pages covering a changed path changed too (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run fr docs check --base "origin/$BASE_REF"
      - name: Pages are well formed and cover what they claim
        if: github.event_name != 'pull_request'
        run: uv run fr docs check

  # A page that does not render (or links to a path git does not track) fails
  # here, before merge, not on the deploy after it (docs-currency R15).
  site-build:
    needs: classify
    if: needs.classify.outputs.lane != 'landed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the renderer pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < .github/blog-craft.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: derio-net/blog-craft
          ref: ${{ steps.pin.outputs.sha }}
          path: .blog-craft
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build the site
        run: uv run --isolated --no-project --with markdown --with pyyaml python scripts/build-site.py _site --ref "$GITHUB_SHA" --blog-craft .blog-craft
      - name: Check the pages against their writing standards
        run: bash scripts/check-writing-standards.sh .blog-craft
      - name: Check the writing-standards script against the real checker
        env:
          BLOG_CRAFT_DIR: .blog-craft
        run: uv run --isolated --no-project --with pytest --with pyyaml pytest -q -o addopts= --noconftest -p no:cacheprovider tests/unit/test_writing_standards_docs.py -k real_checker

  # One stable check name for the required-check rule (#706). It runs in every run,
  # never skipped: a skipped required check reads as passing (ci-economy R2). A
  # superseded run's ci-ok fails on a sha that is no pull request's head any more.
  # scripts/ci_lane.py verdict reads the lane (R17): a failed or cancelled job fails
  # every lane; full needs the shards, light needs scoped-tests and may skip only the
  # shard jobs, landed needs validate-artifacts and names the run it trusts.
  ci-ok:
    if: always()
    needs: [classify, lint, typecheck, plan, collect, test, split-check, coverage,
            scoped-tests, validate-artifacts, opencode-plugin-test, version-sync,
            change-fragment, docs-check, site-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Every CI job did what this run's lane asks
        env:
          LANE: ${{ needs.classify.outputs.lane }}
          TRUSTED_RUN: ${{ needs.classify.outputs.trusted_run }}
          NEEDS: ${{ toJSON(needs) }}
        run: uv run --no-project python scripts/ci_lane.py verdict
