name: CI
# push is scoped to main: an unscoped push overlaps pull_request, and every
# push to a PR branch ran the whole workflow twice (#941).
on:
  push:
    branches: [main]
  pull_request:

# Test the floor we declare (`requires-python = ">=3.11"`), not whatever
# Python the runner ships (#940). An env var rather than a committed
# `.python-version`, so it does not also pin an operator's local runs. The
# test job overrides it per leg; tests/unit/test_ci_python_floor.py keeps it
# equal to the requires-python floor.
env:
  UV_PYTHON: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run ruff check packages/ tests/
      - run: uv run ruff format --check packages/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - run: uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src packages/fr-herdr/src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, and the newest stable Python, so a version-specific
        # break shows up from either end (#940).
        python: ["3.11", "3.14"]
        shard: [1, 2, 3, 4]
    name: test (py${{ matrix.python }}, ${{ matrix.shard }})
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test_tripwire_unarchived_plans reads origin/main to scope the
          # merged-but-unarchived check (#334); full history makes the ref
          # available. Kept on every shard, not just one.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      # Sharded with pytest-split (CI time budget, spec 2026-09-26 §3.A).
      # addopts is CLEARED, not patched, and --strict-markers/--cov are
      # re-added explicitly: pytest-cov accumulates --cov-report values into
      # a dict, so a CLI --cov-report= cannot cancel addopts' term-missing,
      # and each shard would otherwise print a whole-codebase coverage table
      # for a quarter of the tests. The `coverage` job below holds the
      # --cov-fail-under=75 gate that addopts holds for a local run.
      - run: >-
          uv run pytest -o addopts="--strict-markers --cov" --cov-report=
          -n auto --splits 4 --group ${{ matrix.shard }}
          --splitting-algorithm least_duration
          --junitxml=junit-shard.xml
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
      # A failed test as a check-run annotation, readable through the REST API
      # (`check-runs/{id}/annotations`) where the job log is not: the log is
      # served from a blob host a Claude Code cloud session's proxy refuses, so
      # without this a red shard there says only "exit code 1" (cloud-triage
      # discovery `ci-logs-unreachable`).
      - if: failure()
        run: >-
          uv run --no-project python scripts/junit_annotations.py junit-shard.xml
      # Coverage is measured on the floor leg only: both legs would upload the
      # same artifact name, and the gate needs one run of the suite, not two.
      - if: matrix.python == '3.11'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  # Combines the 4 shards' coverage data and holds the --cov-fail-under=75
  # gate that a single unsharded `test` job used to hold via addopts.
  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - run: uv run coverage combine .coverage.shard*
      - run: uv run coverage report --fail-under=75

  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # A CLEAN install, like `acceptance-report.yml` — not `uv sync` + `uv run`
      # (review r5-d4). The validator's own resolution depends on packaging: the
      # shipped workflow manifests now travel INSIDE the `fr` wheel, so a
      # workspace run would validate files the wheel might not actually ship.
      - name: Install fr (from this checkout — super-fr self-hosts)
        run: uv tool install ./packages/fr
      # Spec 2026-08-30 3.F: every version ships a structure validator, and CI
      # runs it over the repo's own artifacts.
      #
      # `fr validate` is EXEMPT from the migration gate (review r5-c5 corrected
      # the note that used to sit here). A stale artifact is therefore reported
      # by the VALIDATOR'S OWN stamp check — "stale: written for version N, this
      # fr writes M — run `fr migrate artifacts --yes`" — not by the gate
      # refusing first. That exemption is deliberate: if the gate ran ahead of
      # this command, a stale artifact would be unobservable to a human, since
      # interactively the gate would have already fixed it. Either way the
      # instruction is the same (`fr migrate artifacts --yes`, committed in the
      # same PR; see .claude/rules/artifact-versioning.md).
      - name: Every live artifact is structurally valid for this fr
        run: fr validate artifacts

  opencode-plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        working-directory: packages/fr-opencode-plugin
        run: bun install --frozen-lockfile
      - name: Run OpenCode plugin tests
        working-directory: packages/fr-opencode-plugin
        run: bun test
      # gh#563: the plugin install.sh DELIVERS must be one the real OpenCode
      # binary loads and runs. Pinned to the version the probe was written
      # against; FR_REQUIRE_OPENCODE=1 turns a missing binary into a failure,
      # so the probe cannot silently skip here.
      - name: Install OpenCode
        run: npm install -g opencode-ai@1.18.32
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Live delivery probe (real opencode binary)
        env:
          FR_REQUIRE_OPENCODE: "1"
        run: uv run pytest --no-cov -q tests/integration/test_opencode_plugin_live.py

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: pyproject.toml / plugin.json / marketplace.json agree
        run: uv run --no-project python scripts/bump-version.py --check

  change-fragment:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: User-visible changes add a change fragment; no PR edits a version
        run: uv run --no-project python scripts/check-change-fragment.py "origin/${{ github.base_ref }}"

  # One stable check name for a future required-check rule (#706).
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, coverage, validate-artifacts,
            opencode-plugin-test, version-sync, change-fragment]
    runs-on: ubuntu-latest
    steps:
      - name: Every CI job succeeded or was skipped by its own condition
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
