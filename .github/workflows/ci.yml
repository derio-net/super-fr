name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check packages/ tests/
      - run: uv run ruff format --check packages/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_tripwire_unarchived_plans reads origin/main to scope the
          # merged-but-unarchived check (#334); full history makes the ref
          # available.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest

  validate-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # A CLEAN install, like `acceptance-report.yml` — not `uv sync` + `uv run`
      # (review r5-d4). The validator's own resolution depends on packaging: the
      # shipped workflow manifests now travel INSIDE the `fr` wheel, so a
      # workspace run would validate files the wheel might not actually ship.
      - name: Install fr (from this checkout — super-fr self-hosts)
        run: uv tool install ./packages/fr
      # Spec 2026-08-30 3.F: every version ships a structure validator, and CI
      # runs it over the repo's own artifacts.
      #
      # `fr validate` is EXEMPT from the migration gate (review r5-c5 corrected
      # the note that used to sit here). A stale artifact is therefore reported
      # by the VALIDATOR'S OWN stamp check — "stale: written for version N, this
      # fr writes M — run `fr migrate artifacts --yes`" — not by the gate
      # refusing first. That exemption is deliberate: if the gate ran ahead of
      # this command, a stale artifact would be unobservable to a human, since
      # interactively the gate would have already fixed it. Either way the
      # instruction is the same (`fr migrate artifacts --yes`, committed in the
      # same PR; see .claude/rules/artifact-versioning.md).
      - name: Every live artifact is structurally valid for this fr
        run: fr validate artifacts

  opencode-plugin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: packages/fr-opencode-plugin
        run: bun install --frozen-lockfile
      - name: Run OpenCode plugin tests
        working-directory: packages/fr-opencode-plugin
        run: bun test

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: pyproject.toml / plugin.json / marketplace.json agree
        run: uv run --no-project python scripts/bump-version.py --check

  version-bump-required:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: User-visible changes include a version bump
        run: python scripts/check-version-bump-needed.py "origin/${{ github.base_ref }}"
