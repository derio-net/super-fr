# One workflow owns the one Pages site: every deploy replaces the whole site, so
# the explainers and the acceptance report must be assembled and published together.
name: Deploy explainers to Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/explainers/**'
      - 'docs/acceptance/**'
      - 'packages/fr/src/fr/acceptance/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install fr
        run: uv tool install ./packages/fr
      - name: Assemble site
        run: mkdir -p _site && cp -R docs/explainers/. _site/
      - name: Render acceptance report
        run: fr acceptance report --link-mode github --ref "$GITHUB_SHA" --out _site/acceptance/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: dep
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
