# One workflow owns the one Pages site: every deploy replaces the whole site, so
# the pages and the acceptance report must be assembled and published together.
# The pages are built from their Markdown sources by scripts/build-site.py with the
# blog-craft renderer pinned in .github/blog-craft.ref (spec 2026-11-11-docs-currency).
# The acceptance report is derived from the folded fragments at deploy time (never
# committed), and the deploy re-reads the site's visibility first: Pages publish only
# where the site is no wider than the repo, and a check that cannot show it refuses (fails) the
# deploy (spec 2026-11-04-repo-feature-settings R20, R21).
name: Deploy explainers to Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/explainers/**'
      - 'docs/*.md'
      - 'docs/reference/**'
      - 'docs/acceptance/**'
      - '.fr/docs.yaml'
      - 'scripts/build-site.py'
      - 'scripts/site/**'
      - '.github/blog-craft.ref'
      - 'packages/fr/src/fr/acceptance/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# A newer push queues behind a running deploy rather than cancelling it halfway
# (only the newest queued run is kept, so the site still converges on main).
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    outputs:
      report: ${{ steps.report.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the renderer pin
        id: pin
        run: echo "sha=$(tr -d '[:space:]' < .github/blog-craft.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: derio-net/blog-craft
          ref: ${{ steps.pin.outputs.sha }}
          path: .blog-craft
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install fr
        run: uv tool install ./packages/fr
      # Re-read before EVERY deploy, never remembered from a scaffold-time answer: the
      # repo's visibility or the site's access setting may have changed since. A check
      # that fails or cannot answer refuses the deploy (R21) and fails the run: a skipped deploy
# cannot unpublish a site that is already live, so a refusal must be loud and name how to
# unpublish by hand. It gates the whole site (docs and report share one deployment).
      - name: Re-check that Pages is no wider than the repo
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if fr acceptance pages-check; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Pages deploy refused: visibility not shown to match the repo."
            echo "A refusal here means visibility changed since this job was scaffolded."
            echo "A skipped deploy does not unpublish a live site: delete the Pages site"
            echo "in the repo settings, or DELETE /repos/$GITHUB_REPOSITORY/pages (admin)."
            exit 1
          fi
      - name: Build site from sources
        if: steps.visibility.outputs.allowed == 'true'
        run: uv run --isolated --no-project --with markdown --with pyyaml python scripts/build-site.py _site --ref "$GITHUB_SHA" --blog-craft .blog-craft
      # The migration gate refuses this render while any artifact on main is stale,
      # and that refusal is wanted: a report over unmigrated artifacts would describe
      # a matrix the shipped fr cannot read. It must not take the explainers with it,
      # so the render fails alone, /acceptance/ says so, and the run goes red after
      # the deploy (super-fr#924).
      - name: Render acceptance report
        id: report
        if: steps.visibility.outputs.allowed == 'true'
        continue-on-error: true
        run: fr acceptance report --link-mode github --ref "$GITHUB_SHA" --out _site/acceptance/index.html
      - name: Publish a placeholder for the unrendered report
        if: steps.report.outcome == 'failure'
        run: |
          mkdir -p _site/acceptance
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          cat > _site/acceptance/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="color-scheme" content="light dark">
          <title>Acceptance report · super-fr</title>
          </head>
          <body style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5">
          <h1>Acceptance report not rendered</h1>
          <p>The acceptance report was not rendered for commit <code>${GITHUB_SHA:0:12}</code>:
          <code>fr</code> refused to read this commit's artifacts (see the
          <a href="$repo/actions/runs/$GITHUB_RUN_ID">deploy run</a>).</p>
          <p>Reports are derived, never committed: the rows at that commit are the
          <a href="$repo/tree/$GITHUB_SHA/docs/acceptance/features">acceptance fragments</a>,
          and <code>fr acceptance report --open</code> renders them locally.</p>
          </body>
          </html>
          HTML
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.visibility.outputs.allowed == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.visibility.outputs.allowed == 'true'
        with:
          path: _site
      - id: dep
        if: steps.visibility.outputs.allowed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  # A separate job, so the github-pages deployment record stays green when the
  # site did go live: a failing step inside `deploy` would mark it failed.
  report-status:
    needs: deploy
    if: needs.deploy.outputs.report == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the run when the report was not rendered
        run: |
          echo "::error::The acceptance report was not rendered (see 'Render acceptance report'); the explainers deployed with a placeholder at /acceptance/."
          exit 1
