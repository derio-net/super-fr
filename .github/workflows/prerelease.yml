name: Prerelease

# On-demand pre-release of a PR branch (spec 2026-10-06-verification-strategies
# §H, R24). Dispatched by `fr verification prerelease --branch <b>`. It tags the
# branch head `rc/<branch-slug>/<sha12>` and publishes a GitHub pre-release at
# that commit, so the `prerelease` verification strategy can install the exact
# candidate (`git+<remote>@<tag>`) before the PR merges. It edits no version,
# makes no commit and pushes nothing to a branch: only the TAG is pushed.
# GitHub dispatches a workflow only once its file is on the default branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "The PR branch to cut a pre-release of"
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Tag the branch head and publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          sha12=${sha:0:12}
          slug=${BRANCH//\//-}
          tag="rc/${slug}/${sha12}"
          pr=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          notes="Pre-release of branch ${BRANCH} at ${sha}."
          if [ -n "$pr" ]; then notes="${notes} PR: ${pr}"; fi
          git tag "$tag" "$sha"
          git push origin "refs/tags/${tag}"
          gh release create "$tag" --prerelease --target "$sha" --title "$tag" --notes "$notes"
