name: Release

# Replaces auto-tag.yml (spec 2026-09-26-version-bump-churn §3.C). PRs never
# edit a version: they add a `.changes/<branch-slug>.yaml` fragment, and this
# workflow turns every pending fragment into one `release: vX.Y.Z` commit on
# `main` (`scripts/release.py`), then tags it and publishes a GitHub Release.
# Idempotent: with no fragments and the version already tagged it is a no-op,
# and a rerun reads its notes from the release commit's body.
#
# No CI runs on the release commit. It is pushed with the GITHUB_TOKEN, and a
# push made with the GITHUB_TOKEN triggers no workflow. So release.py checks it
# twice before the push. The staged diff may carry nothing but
# version_surfaces() lines, the consumed fragments and the live plans'
# fr_version ceilings that `fr migrate artifacts --yes` widens at a major
# (gh#861), and a stale uv.lock is refused rather than re-resolved: that
# proves WHICH lines changed. Then it
# tests the staged tree: the whole suite, with fr installed at the new number,
# which proves how the code BEHAVES there. 5.0.0 passed the first check and
# shipped refusing its own plans (gh#854). A red suite pushes, tags and
# publishes nothing. The suite makes this job long; .github/ci-budget.yaml
# gives it its own budget.
#
# Pushing to main works today because main's ruleset forbids only force-push
# and deletion. If a required-PR or required-checks rule is ever added, the
# release bot needs a bypass actor on that rule; release.py reports a
# protection refusal (GH006) as exactly that, never as a lost race.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release exactly this X.Y.Z (must be above the current version); empty = from fragments"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# The pre-push suite release.py runs is the only test a release gets; it runs
# on the requires-python floor, like CI (#940).
env:
  UV_PYTHON: "3.11"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Release pending change fragments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${RELEASE_VERSION}" ]; then
            uv run --no-project python scripts/release.py --version "${RELEASE_VERSION}"
          else
            uv run --no-project python scripts/release.py
          fi
