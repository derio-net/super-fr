name: Release

# Replaces auto-tag.yml (spec 2026-09-26-version-bump-churn §3.C). PRs never
# edit a version: they add a `.changes/<branch-slug>.yaml` fragment, and this
# workflow turns every pending fragment into one `release: vX.Y.Z` commit on
# `main` (`scripts/release.py`), then tags it and publishes a GitHub Release.
# Idempotent: with no fragments and the version already tagged it is a no-op,
# and a rerun reads its notes from the release commit's body.
#
# Release gating (spec 2026-10-14-exit-gates R20, R21): while a PR merged since
# the last final tag still carries an unpassed post-merge gate label
# (`fr release status --from-json`), a run cuts a release candidate instead,
# `release: vX.Y.Z-rc.N`, tagged and published as a GitHub pre-release and
# consuming no fragment; the final follows once nothing waits. A gate passes
# with no push to main, so the workflow also runs daily (and `fr gate pass`
# prints the dispatch). release.py reads the merged PRs and their labels with
# `gh` and the workflow token (`pull-requests: read`), never the app's, and fr
# decides from those facts with no credential in its environment. When what
# waits is unknown (a failed or capped read, or a PR the git log names that the
# read misses), the run cuts an RC, never a final.
# FR_RELEASE_STATUS_TOKEN is the workflow's github.token, so it also carries
# the prepare job's contents and issues write. It reaches only that one gh read, never
# fr or repo code: the bump, the lock check, the migration, the staged suite and
# fr's decision all run with every token stripped. The token-holding calls are
# the gh read, the gh release and issue writes, and the pushes.
#
# Two modes, by the repo variable FR_AUTOMATION_APP_ID (spec
# 2026-10-11-merge-train-safety §F). Unset: the push uses the GITHUB_TOKEN, and
# a push made with the GITHUB_TOKEN triggers no workflow, so no CI runs on the
# release commit. Set: the app-token step mints a token for the
# derio-fr-automation GitHub App from secret FR_AUTOMATION_APP_KEY and the
# release commit and tag are pushed as the app, so CI runs on the release
# commit and release.yml runs once more on it, as a no-op. The token is scoped to
# this repo with contents and issues write only, checkout persists none, and
# release.py hands it to its git pushes alone, and the jobs that run the staged
# suite never receive it. Either way
# release.py checks it twice before the push. The staged diff may carry nothing but
# version_surfaces() lines, the consumed fragments and the live plans'
# fr_version ceilings that `fr migrate artifacts --yes` widens at a major
# (gh#861), and a stale uv.lock is refused rather than re-resolved: that
# proves WHICH lines changed. Then it
# tests the staged tree: the whole suite, with fr installed at the new number,
# which proves how the code BEHAVES there. 5.0.0 passed the first check and
# shipped refusing its own plans (gh#854). A red suite pushes, tags and
# publishes nothing. The suite makes this workflow long; .github/ci-budget.yaml
# gives it its own budget.
#
# Pushing to main works today because main's ruleset forbids only force-push
# and deletion. If a required-PR or required-checks rule is ever added, the
# release bot needs a bypass actor on that rule (the app, once
# scripts/configure-main-protection.sh --stage bypass has run); release.py reports a
# protection refusal (GH006) as exactly that, never as a lost race.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # daily: the final follows the last gate pass with no push
  workflow_dispatch:
    inputs:
      version:
        description: "Release exactly this X.Y.Z (must be above the current version); empty = from fragments"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pull-requests: read

# The pre-push suite the test shards run is the only test a release gets; it runs
# on the requires-python floor, like CI (#940).
env:
  UV_PYTHON: "3.11"

concurrency:
  group: release
  cancel-in-progress: false

# The release is a job graph (spec 2026-11-01-ci-speed §3.D, R8-R12). `prepare`
# stages the release commit and hands it on as a plan and a git bundle; `collect`
# and six `test` shards each check out exactly that commit, with origin/main
# pinned to the base it was staged on, and run with no token at all (R9);
# `split-check` proves the shards ran the whole suite; `publish` pushes only
# then, and only onto that base. When main moved meanwhile the run is
# superseded: it pushes nothing and exits 0, because the push that moved main
# starts the run that releases (an explicit `version` exits non-zero and names
# the re-dispatch instead, since no later run carries it).
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cut: ${{ steps.prepare.outputs.cut }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - id: app-token
        if: vars.FR_AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.FR_AUTOMATION_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Steps 1-3: sync to the tip, compute, stage the release commit (bump,
      # migration, fragment removal, verify_staged). Nothing to release, or an
      # untagged RC at HEAD to tag, finishes here with cut=false.
      - id: prepare
        name: Stage the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          FR_RELEASE_STATUS_TOKEN: ${{ github.token }}
          RELEASE_OUT: ${{ runner.temp }}/release-out
        run: |
          set -euo pipefail
          args=(prepare --out "${RELEASE_OUT}" --github-output "${GITHUB_OUTPUT}")
          if [ -n "${RELEASE_VERSION}" ]; then
            args+=(--version "${RELEASE_VERSION}")
          fi
          uv run --no-project python scripts/release.py "${args[@]}"

      # The shards split by CI's own measurements on main (§3.B), restored only
      # after the release commit exists, so the untracked file never meets its
      # `git add -A`; the committed .test_durations is the fallback.
      - if: steps.prepare.outputs.cut == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/test-durations.json
          key: test-durations-none
          restore-keys: test-durations-
      - if: steps.prepare.outputs.cut == 'true'
        name: Choose the durations file for this run
        env:
          RELEASE_OUT: ${{ runner.temp }}/release-out
        run: |
          if [ -f cache/test-durations.json ]; then
            cp cache/test-durations.json "${RELEASE_OUT}/durations-plan.json"
          else
            cp .test_durations "${RELEASE_OUT}/durations-plan.json"
          fi
      - if: steps.prepare.outputs.cut == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-out
          retention-days: 1

  # What the release's shards must run between them, on the staged commit.
  collect:
    needs: prepare
    if: needs.prepare.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-out
      - name: Check out the staged commit, origin/main pinned to its base
        env:
          RELEASE_OUT: ${{ runner.temp }}/release-out
        run: >-
          uv run --no-project python scripts/release.py materialise
          --plan "${RELEASE_OUT}/release-plan.json"
          --bundle "${RELEASE_OUT}/staged.bundle" --pin-base
      - name: Collect the suite with the shards' options
        env:
          COLLECTED: ${{ runner.temp }}/collected.txt
        run: uv run --no-project python scripts/release.py collect --out "${COLLECTED}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-collected
          path: ${{ runner.temp }}/collected.txt
          retention-days: 1

  # Step 4, six ways: the version probe, then one split of the whole suite, on
  # exactly the staged commit (R8). No token reaches this job (R9).
  test:
    needs: prepare
    if: needs.prepare.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-out
      - name: Check out the staged commit, origin/main pinned to its base
        env:
          RELEASE_OUT: ${{ runner.temp }}/release-out
        run: >-
          uv run --no-project python scripts/release.py materialise
          --plan "${RELEASE_OUT}/release-plan.json"
          --bundle "${RELEASE_OUT}/staged.bundle" --pin-base
      - name: Test this shard at the new version
        env:
          RELEASE_OUT: ${{ runner.temp }}/release-out
          SHARD: ${{ matrix.shard }}
          SHARD_DURATIONS: ${{ runner.temp }}/shard-durations.json
        run: >-
          uv run --no-project python scripts/release.py test-shard
          --plan "${RELEASE_OUT}/release-plan.json"
          --group "${SHARD}" --splits 6
          --durations "${RELEASE_OUT}/durations-plan.json"
          --out "${SHARD_DURATIONS}"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-durations-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-durations.json
          retention-days: 7

  # R5 for the release's one leg: the shards ran exactly what `collect` listed.
  split-check:
    needs: [prepare, collect, test]
    if: needs.prepare.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-durations-shard-*
          path: shards
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-collected
          path: collected
      - name: Shards ran exactly what the release collects
        run: >-
          uv run --no-project python scripts/split_check.py check
          --collected collected/collected.txt
          shards/release-durations-shard-*/shard-durations.json

  # Steps 5-6: push the staged commit onto the base it was staged on, then tag
  # and release it. Superseded when main moved; a protection refusal fails.
  publish:
    needs: [prepare, split-check]
    if: needs.prepare.outputs.cut == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app-token
        if: vars.FR_AUTOMATION_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.FR_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.FR_AUTOMATION_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-out

      # The override rides in the plan, so a superseded --version run knows to
      # name its re-dispatch.
      - name: Push, tag and publish the staged release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RELEASE_OUT: ${{ runner.temp }}/release-out
        run: >-
          uv run --no-project python scripts/release.py publish
          --plan "${RELEASE_OUT}/release-plan.json"
          --bundle "${RELEASE_OUT}/staged.bundle"
