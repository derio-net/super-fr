# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-07-03-auto-archive-merged-plans
repo: derio-net/super-fr
rows:
  - id: auto-archive-merged-plans
    capability: Lifecycle
    acceptance: Merged-but-unarchived plans are detected by the fr status sweep and
      named by a CI reminder that warns without failing unrelated PRs
    origin:
    - spec:2026-07-03-auto-archive-merged-plans
    levels:
      unit:
      - super-fr:tests/unit/test_completed_unarchived_plans.py
      - super-fr:tests/unit/test_tripwire_unarchived_plans.py
    status: ci
    notes: 'Tripwire checks completeness on origin/main (#334). Since 2026-09-26 it
      warns instead of failing: a plan without a manual phase is complete the moment
      it merges, so a failing check held every unrelated PR and main red until that
      run''s closeout (fr pickup, which can finish a plan at any time) landed, and pushed
      closeouts to fr archive --all (#660/#664). The warning names one fr archive <plan-dir>
      per plan; fr status lists the same plans.'
