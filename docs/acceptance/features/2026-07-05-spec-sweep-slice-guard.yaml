# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-07-05-spec-sweep-slice-guard
repo: derio-net/super-fr
rows:
  - id: spec-sweep-pending-slice-hold
    capability: Archive spec-sweep
    acceptance: A spec with a decided-but-unbuilt slice (a pending-placeholder plan
      row) is held in place — not swept to implemented/specs/ — when unrelated plans
      archive; the hold emits a clear 'pending slice' note, deterministically and without
      a gh probe.
    origin:
    - spec:2026-07-05-spec-sweep-slice-guard
    levels:
      unit:
      - super-fr:tests/unit/test_v2_migrate.py
    status: ci
    notes: 'issue #351; born at brainstorm (fr-goal 2026-07-05). Pinned by the pending-row
      guard tests (hold, clean note, gh-independent determinism) + spec_archive_sweep
      and migrate-dirs integration.'
  - id: archive-no-spec-sweep-flag
    capability: Archive spec-sweep
    acceptance: fr archive --no-spec-sweep archives the plan(s) but skips the spec sweep
      entirely for that invocation, leaving all specs untouched.
    origin:
    - spec:2026-07-05-spec-sweep-slice-guard
    levels:
      unit:
      - super-fr:tests/unit/test_archive_cmd.py
    status: ci
    notes: 'issue #351; manual escape (idea c). Pinned by test_no_spec_sweep_flag_skips_sweep.'
