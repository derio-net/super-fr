# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-07-09-multi-backend-git-host-adapters
repo: derio-net/super-fr
rows:
  - id: multibackend-gitlab-tracking
    capability: Multi-backend git hosting
    acceptance: An operator can run fr apply against a GitLab-backed repo and see phases
      rendered/observed/diffed/applied as GitLab Issues with correctly-shaped GitLab
      labels (color, length)
    origin:
    - spec:2026-07-09-multi-backend-git-host-adapters
    levels:
      unit:
      - super-fr:tests/unit/test_glab.py
      - super-fr:tests/unit/test_real_glabclient.py
      - super-fr:tests/unit/test_hostclient.py
      - super-fr:tests/unit/test__urls.py
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): LIVE-VERIFIED
      2026-09-19 against a self-hosted GitLab (host redacted); unit refs in CI.'
    walks:
    - strategy: live
      harness: unrecorded
      model: unrecorded
      outcome: pass
      at: '2026-09-19T00:00:00Z'
      evidence: 'gh-486 live run against a self-hosted GitLab (host redacted): render,
        observe, diff, apply converged; transcript in the PR'
  - id: multibackend-gitea-tracking
    capability: Multi-backend git hosting
    acceptance: An operator can run fr apply against a Gitea-backed repo and see phases
      rendered/observed/diffed/applied as Gitea Issues with correctly-shaped labels
    origin:
    - spec:2026-07-09-multi-backend-git-host-adapters
    levels:
      unit:
      - super-fr:tests/unit/test_tea.py
      - super-fr:tests/unit/test_real_teaclient.py
      - super-fr:tests/unit/test_hostclient.py
      - super-fr:tests/unit/test_tea_live_shapes.py
    status: ci
    notes: 'RealTeaClient satisfies the GhClient Protocol (mypy-verified) and is reachable
      via client_for; every read now goes through fr.tea.api_json (tea api -i, HTTP
      status checked). 2026-11-01: walked live against a self-hosted Gitea (tea 0.16.0;
      host redacted) — the walk found seven read/label bugs the swagger-modelled doubles
      could not, fixed in fix/gitea-adapter-live-shapes; test_tea_live_shapes.py pins
      each against shapes captured from that instance (tests/fixtures/gitea/).'
  - id: multibackend-isolation-lifecycle
    capability: Multi-backend git hosting
    acceptance: fr isolation up/status/down/gc resolves the default branch and checks
      PR/MR-merge state correctly against a GitLab- or Gitea-backed repo, with zero
      gh-specific calls
    origin:
    - spec:2026-07-09-multi-backend-git-host-adapters
    levels:
      unit:
      - super-fr:tests/unit/test_isolation.py
    status: ci
    notes: _resolve_default_branch and _pr_from both branch on fr._hosts.detect_backend
      (glab/tea equivalents of the gh calls, kept as a lightweight parallel branch on
      the isolation lifecycle's own Runner seam rather than merged into GhClient --
      see the design doc's reasoning). Gitea's _pr_from has no single-shot branch->PR
      query (verified during research) and falls back to a list-and-filter scan -- a
      real, bounded, documented degradation. Not yet proven against a live GitLab/Gitea
      instance -- owed to Phase 9's manual verification.
  - id: multibackend-vk-dispatch
    capability: Multi-backend git hosting
    acceptance: The VK dispatch bridge polls PR/MR status and auto-closes tracking Issues
      correctly for a GitLab- or Gitea-backed phase
    origin:
    - spec:2026-07-09-multi-backend-git-host-adapters
    levels:
      unit:
      - super-fr:tests/unit/test_pr_observe.py
      - super-fr:tests/unit/test_bridge_pr_state.py
      - super-fr:tests/unit/test_done_reconcile.py
      - super-fr:tests/unit/test_cardref.py
      - super-fr:tests/integration/test_bridge_cli.py
    status: ci
    notes: Fixed the two fr-vk gh-bypass call sites (pr_observe.py/pr_state.py shelled
      out to literal gh subprocesses, bypassing GhClient) and bridge_cli.py's hardcoded
      RealGhClient() (now resolved per-repo via hostclient.client_for, since the bridge
      can watch repos on different backends). Consolidated 5 duplicate card-title regexes
      into fr_vk._cardref, backward-compatible with existing gh#-tagged production cards
      (2026-07-09). Not yet proven against a live GitLab/Gitea VK dispatch end-to-end
      -- owed to Phase 9's manual verification.
  - id: multibackend-scaffold
    capability: Multi-backend git hosting
    acceptance: fr init scaffold on a GitLab- or Gitea-backed repo installs the right
      CLI into the devcontainer (not github-cli), and fr acceptance init generates a
      working CI workflow in the right location and schema for that backend
    origin:
    - spec:2026-07-09-multi-backend-git-host-adapters
    levels:
      unit:
      - super-fr:tests/unit/test_init_scaffold.py
      - super-fr:tests/unit/test_acceptance_init.py
      - super-fr:tests/unit/test_acceptance_cmd.py
    status: ci
    notes: 'scaffold_profile() picks the host CLI by backend: HOST_CLI_FEATURE for GitHub,
      and for GitLab/Gitea a postCreate snippet rendered from HOST_CLI_PINS (versioned,
      per-architecture, sha256-verified glab/tea installs; gh#576 replaced the amd64-only
      HOST_CLI_POST_CREATE). fr acceptance init picks WORKFLOW_TEMPLATE_GITEA (.gitea/workflows/,
      same YAML shape as GitHub Actions) or WORKFLOW_TEMPLATE_GITLAB (.gitlab-ci.yml,
      a genuinely different schema) via fr._hosts.detect_backend. This work also fixed
      a real blocker it surfaced: resolve_identity()''s remote-parsing regex was GitHub-only,
      which would have hard-failed fr acceptance init on a fresh GitLab/Gitea repo.
      Residual documented gap: fr acceptance report --link-mode has no gitea/gitlab
      mode yet, so source links in the generated report still point at github.com. The
      CLI install has been proven live in an arm64 container (2026-09-23, glab 1.107.0
      / tea 0.14.2, row scaffold-host-cli-arch; the separate pinned-host-cli-assets-resolve
      row checks the pinned downloads and checksums on a schedule, not a container install).
      Not yet proven against a live GitLab/Gitea instance; that is owed to the multi-backend
      spec''s Phase 9 manual verification.'
