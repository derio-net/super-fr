# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-07-22-fr-goal-subagent-execution
repo: derio-net/super-fr
rows:
  - id: fr-goal-run-journal
    capability: fr-goal subagent execution
    acceptance: An fr-goal run's Q&A decisions, review outcomes, per-phase discoveries,
      and review findings/fixes/refutations persist to docs/superpowers/journals/ (spec-scoped
      and plan-scoped) as the run progresses, via the fr journal CLI
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_journal_cmd.py
      - super-fr:tests/unit/test_journal_lifecycle.py
    status: ci
    notes: Two scopes journals/<spec|plan-slug>.md; add/render/check + plan-create init
      + archive moves unit-pinned per-PR.
  - id: fr-goal-subagent-per-phase
    capability: fr-goal subagent execution
    acceptance: fr-goal implements each plan phase in a sequenced subagent (dependency
      order) that receives a journal+spec+phase brief, builds the single shared branch,
      writes discoveries/findings back to the journal, and returns a structured result
      — no new operator gate
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_fr_goal_journal.py
      - super-fr:tests/unit/test_phase_executor_agent.py
      - super-fr:tests/unit/test_install_allowlists_phase_executor.py
    status: walk-owed
    notes: tracked by derio-net/super-fr#1351
    issues:
    - derio-net/super-fr#1351
  - id: fr-goal-journal-handoff-complete
    capability: fr-goal subagent execution
    acceptance: A fresh subagent given only fr journal render + spec + its phase yaml
      has every input needed to implement the phase; a dropped finding is caught by
      fr journal check
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_fr_goal_journal.py
      - super-fr:tests/unit/test_journal_cmd.py
    status: walk-owed
    notes: tracked by derio-net/super-fr#1349
    issues:
    - derio-net/super-fr#1349
  - id: fr-goal-phase-tiering
    capability: fr-goal subagent execution
    acceptance: fr-plan annotates each phase with a tier; the orchestrator dispatches
      that phase's subagent at the mapped model where per-dispatch override exists (Claude
      confirmed), and falls back to a flat tier where it does not
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_phase_tier.py
      - super-fr:tests/unit/test_models_config.py
      - super-fr:tests/unit/test_models_cmd.py
      - super-fr:tests/unit/test_run_cli.py
      int:
      - super-fr:tests/integration/test_fr_goal_shape.py
    status: ci
    notes: 'Corrected the overclaim (2026-09-20 phases-file-tier-reaches-dispatch spec,
      gh-434): the acceptance text said fr-plan annotates each phase with a tier and
      the orchestrator dispatches at the mapped model, but the unit levels only ever
      pinned PhaseHeader.tier and fr models resolve IN ISOLATION -- nothing pinned that
      a planner''s tier survives --phases-file into a plan, and until this PR it could
      not (tier was silently dropped at ingestion). Adding tests/unit/test_run_cli.py
      and tests/integration/test_fr_goal_shape.py::test_a_phases_file_tier_reaches_the_dispatch_brief
      closes that gap: they pin that a tier written in a --phases-file reaches the dispatch
      brief as resolved_tier. Still NOT claimed: no automated level dispatches a real
      subagent (Claude Code Agent, OpenCode task tool, or Hermes delegate_task) and
      reads back a session row''s model -- that live claim stays with opencode-subagent-dispatch,
      which records its live walks (walked, not in CI).'
  - id: fr-goal-pr-body-derived
    capability: fr-goal subagent execution
    acceptance: The fr-goal PR body findings and decisions sections are generated by
      fr journal render, not composed from conversation memory
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_journal_cmd.py
      - super-fr:tests/unit/test_fr_goal_journal.py
    status: ci
    notes: render section filtering (findings/decisions) + raw-output (bracket-safe)
      unit-pinned per-PR; PR body is generated, not remembered.
  - id: fr-debugging-journal
    capability: fr-goal subagent execution
    acceptance: fr-debugging records its investigation (repro, hypotheses, ruled-out,
      root-cause, fix) to journals/<debug-slug>.md via the fr journal debug scope as
      the investigation proceeds, and derives its PR body via fr journal render --scope
      debug; existing debugging/*.md prose is left untouched
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_fr_debugging_journal.py
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): a live
      debugging walk recorded to the 2026-09-08 session-unbind-hook-cancelled debug
      journal; SKILL.md wiring content-pinned per-PR.'
    walks:
    - strategy: live
      harness: unrecorded
      model: unrecorded
      outcome: pass
      at: '2026-09-08T00:00:00Z'
      evidence: live debugging walk recorded at docs/superpowers/journals/debug/2026-09-08-session-unbind-hook-cancelled.md
  - id: fr-journal-scope-keyed
    capability: fr-goal subagent execution
    acceptance: 'The fr journal primitive is scope-keyed (spec|plan|debug) and pipeline-agnostic:
      the same add/render/check CLI serves fr-goal and fr-debugging with a defined kind
      enum, no fr-goal-specific schema'
    origin:
    - spec:2026-07-22-fr-goal-subagent-execution
    levels:
      unit:
      - super-fr:tests/unit/test_journal_model.py
      - super-fr:tests/unit/test_journal_cmd.py
    status: ci
    notes: Scope enum (spec|plan|debug) + 8-kind enum + add/render/check serve both
      pipelines with no fr-goal-specific schema; unit-pinned per-PR.
