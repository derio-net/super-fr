# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-07-24-acceptance-report-autogen
repo: derio-net/super-fr
rows:
  - id: acceptance-report-tracked
    capability: Acceptance report
    acceptance: The acceptance HTML report is a tracked, version-controlled artifact
      committed alongside matrix.yaml (not gitignored).
    origin:
    - spec:2026-07-24-acceptance-report-autogen
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_acceptance_report_sync.py
    status: ci
    notes: Un-gitignored + generated by scaffold; the report-sync tripwire fails CI
      if the committed report drifts from the matrix.
  - id: acceptance-report-cli-regen
    capability: Acceptance report
    acceptance: Mutating the matrix via 'fr acceptance add' regenerates docs/acceptance/report.html
      in the same working tree.
    origin:
    - spec:2026-07-24-acceptance-report-autogen
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_status_add.py
    status: ci
    notes: Programmatic update path; hand-edits covered by the drift gate.
  - id: acceptance-report-drift-gate
    capability: Acceptance report
    acceptance: 'Report drift from the matrix is caught: ''fr acceptance report --check''
      and the CI tripwire fail when report.html is stale.'
    origin:
    - spec:2026-07-24-acceptance-report-autogen
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_report.py
    status: ci
    notes: Enforces sync for every update path incl. hand-edited status flips.
