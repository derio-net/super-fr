# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-08-30-artifact-migration-framework
repo: derio-net/super-fr
rows:
  - id: artifacts-migrate-on-next-command
    capability: Artifact migration
    acceptance: An operator whose fr version changed under in-flight work has their
      artifacts migrated by the very next fr command, which then completes normally.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_migration_trigger.py
    status: ci
    notes: Spec 3.C. The 'pause, migrate, resume' the operator asked for, where the
      pause is invisible because the typed command still runs. Unit-pinned end to end
      through the real typer app - a stale plan, an interactive context, `fr skills`
      still prints - plus the non-interactive refusal that must never migrate or commit.
      Test Plan item 1 (a live node upgrade) stays operator-driven.
  - id: migration-commit-is-path-scoped
    capability: Artifact migration
    acceptance: The migration commit contains only the artifact paths it rewrote; unrelated
      uncommitted work is left in the working tree, unmodified and uncommitted.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_migration_commit.py
    status: ci
    notes: Spec 3.D. In-flight work IS a dirty tree, so refusing until clean would block
      the case this exists for; stash cycles risk a pop conflict over unsaved work.
      Every fixture therefore starts dirty and the load-bearing assertions are negative
      - an unrelated MODIFIED file stays modified and uncommitted (kills `git add -A`),
      an unrelated STAGED file is not swept in (kills a plain `git commit -m`, which
      records the whole index). Both mutations were run and both fail the suite.
  - id: daemon-refuses-stale-artifacts
    capability: Artifact migration
    acceptance: The bridge and CI refuse loudly and exit non-zero on stale artifacts
      rather than skipping them silently, and never auto-commit.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_vk_bridge_discover.py
    status: ci
    notes: 'Spec 3.C. discover_plans (fr_dispatch/__init__.py) no longer catches PlanSchemaError
      as a quiet warning-and-continue; it logs ERROR, pushes a `stale_artifact` failure
      metric, and reports the failure to bridge_cli.py via a `failures` outparam that
      folds into the tick error total -- one stale plan excludes only itself (I9 boundary),
      the daemon never migrates or commits (the checkout is hard-reset every tick, issue
      #286). The "and CI" half was already covered by Phase 3/4''s `ensure_artifacts_current`
      CLI-entry gate (non-interactive when `CI` is set), unchanged here.'
  - id: in-flight-work-is-adoptable
    capability: Artifact migration
    acceptance: A plan already under way acquires a run cursor reflecting the work actually
      done, instead of being stranded without one.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_run_adopt.py
      - super-fr:tests/unit/test_migration_trigger.py
    status: ci
    notes: 'Spec 3.E. `fr run adopt <plan-dir|spec>` reconstructs a cursor from artifacts
      that already exist, one row of the inference table per test: spec only -> `plan`;
      plan with no phase complete -> `implement`; some phases complete -> `implement`
      with per-phase state in the fan-out step''s `items`; all complete, no PR -> `review`;
      an OBSERVED-open PR -> `deliver`. Adoption records `emitted.spec`/`emitted.plan`,
      so archival-by-emitted.plan still keys correctly — pinned end-to-end by archiving
      the plan and asserting the run follows it into implemented/runs/, with a plan
      slug that deliberately does not resemble the branch-derived run id. The other
      direction is pinned too: a plan whose work is complete is never offered a cursor,
      and the CLI-entry migration gate REPORTS the offer without ever creating a run
      (only `fr run adopt` and `fr migrate artifacts --yes --adopt` write one).'
  - id: every-artifact-declares-its-version
    capability: Artifact migration
    acceptance: Every artifact fr generates declares the version it was written for,
      and a file with no stamp reads as version 1 rather than as an error.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_artifact_registry.py
      - super-fr:tests/unit/test_validate_artifacts.py
    status: not-implemented
    notes: Spec 3.A. Per-artifact stamps chosen over a repo manifest because a manifest
      cannot describe a half-migrated tree. Phase 1 lands the registry and a reader/writer
      per kind, and the unit refs cover the second half of the claim in CI — an absent
      stamp reads as version 1, not an error, for all five kinds, and `fr validate artifacts`
      now fails an unreadable or newer-than-this-fr stamp on every kind. RE-EVALUATED
      IN PHASE 7 AND DELIBERATELY LEFT RED. The FIRST half is still unmet and nothing
      in this plan changed it — only plans carry a stamp in practice, while `fr journal
      add`, `fr run start` / `fr run adopt` (save_run_state) and the spec writer all
      emit unstamped files. Absence READING as 1 is not the same claim as every generated
      artifact DECLARING its version, and flipping this row on that equivalence would
      be exactly the overclaim the row exists to prevent. What closes it — the generators
      write the stamp, which is owed at the moment a kind's current_version first moves
      past 1, in the same PR that must widen that kind's extra=forbid model with an
      optional defaulted schema_version field (finding f-closed-world-models-reject-a-stamp;
      obligation now standing in .claude/rules/artifact-versioning.md).
  - id: migration-is-idempotent
    capability: Artifact migration
    acceptance: Re-running any migration produces no second rewrite and no second commit.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_migration_runner.py
      - super-fr:tests/unit/test_migration_fr_version.py
      - super-fr:tests/unit/test_migration_commit.py
      - super-fr:tests/unit/test_migration_trigger.py
    status: ci
    notes: Spec 3.B. The no-second-REWRITE half is ci-pinned both ways — the stamp guards
      a schema migration, the predicate guards a repair, and both assert bytes AND mtime
      unchanged on the second run. The no-second-COMMIT half landed with Phase 4 and
      is now pinned too, which is what moves this row to ci — test_a_report_whose_paths_are_already_committed_makes_no_empty_commit
      (re-committing the same report leaves HEAD where it was) and, one level up, test_a_current_tree_neither_migrates_nor_commits
      (a tree already current never reaches the runner or the committer at all). Test
      Plan item 7 — the same two commands on a live node — stays operator-driven.
  - id: artifact-structure-validator-per-version
    capability: Artifact migration
    acceptance: Every version ships a structural validator for every artifact kind it
      generates, and CI runs it over the repo's own artifacts.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_validate_artifacts.py
      - super-fr:tests/unit/test_tripwire_artifact_kinds.py
    status: ci
    notes: 'Spec 3.F. `fr validate artifacts [--kind K]` checks the stamp (unreadable,
      stale, and newer-than-this-fr each fail, the last with an upgrade message — spec
      2 forbids downgrades) and then the shape, through `ArtifactKind.validate`. "Every
      KIND" is structural, not vigilance: `validate` is a required field on the frozen
      dataclass, so a kind cannot be registered without a validator, and the tripwire
      keeps the kind list in one module. Both halves of "CI runs it": a `validate-artifacts`
      job in ci.yml, and test_this_repos_own_artifacts_are_structurally_valid, which
      fails locally before CI does. The spec-structure check is the one that earns the
      row — it reproduces commit 7ece5a9''s splice (index() matched an INLINE mention
      of `## Implementation Plans` before the replaced section, so end < start and the
      tail was re-appended) and fires on both signals; run against the real damaged
      blob it reports 15 problems, and 0 against every spec in the tree today.'
  - id: archived-plans-survive-a-major-bump
    capability: Artifact migration
    acceptance: After a major fr bump, archived plans still report their real state
      in spec status instead of reading as missing, while execution paths still refuse
      an incompatible live plan.
    origin:
    - spec:2026-08-30-artifact-migration-framework
    levels:
      unit:
      - super-fr:tests/unit/test_v2_parse.py
      - super-fr:tests/unit/test_v2_spec.py
      - super-fr:tests/unit/test_v2_pickup.py
      - super-fr:tests/unit/test_status_cmd.py
      - super-fr:tests/unit/test_vk_bridge_discover.py
    status: ci
    notes: 'Spec 3.E.1. Excluding archives from migration collides with the parse-time
      gate: spec.py:370 catches PlanSchemaError and degrades the plan to Missing, which
      under 4.0.0 hits all 38 archived plans here. The gate is over-scoped, not the
      archives - it exists to stop an incompatible fr EXECUTING a plan, and reading
      history executes nothing. fr.parser.parse gained enforce_fr_version (keyword-only,
      default True); fr.spec.compute_status is the ONE call site passing False. Every
      execution path keeps the enforcing default and is pinned by its own test: fr pickup
      (test_pickup_still_enforces_fr_version), fr status / fr apply''s shared build_plan_report
      read path (test_build_plan_report_still_enforces_fr_version), and the bridge''s
      discover_plans (test_discover_plans_still_enforces_fr_version), each using a fixture
      whose fr_version ceiling genuinely excludes a monkeypatched installed version.'
