# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-04-worktree-traceability
repo: derio-net/super-fr
rows:
  - id: session-workspace-binding
    capability: isolation-traceability
    acceptance: An operator can ask fr which workspace an agent session is attached
      to, and which sessions hold a workspace, without inspecting the harness.
    origin:
    - spec:2026-09-04-worktree-traceability
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_sessions.py
      - super-fr:tests/unit/test_isolation_sessions_cmd.py
      int:
      - super-fr:tests/unit/test_hooks_session_bind.py
    status: ci
    notes: 'Unit level (phase 1): fr.isolation.sessions attach/detach/detach_all/stale
      index classification, IsolationState.sessions round-trip, and the CLI surface
      (attach, detach, status --session / sessions column, up --session, down unbind
      + warning) pinned per-PR. Hook level (phase 3, filed under int because the matrix
      has no hook level): fr-session-bind.sh (PostToolUse Bash -> attach on up/exec
      with and without a leading cd, detach on down, subagent and non-Bash input ignored)
      and fr-session-unbind.sh (SessionEnd -> detach, resume kept) exercised via subprocess
      against a stub fr that records argv. The unbind additionally pins the SessionEnd
      time budget: against a stub fr that blocks 3s, the hook must return inside 1.5s
      (Claude Code aborts a SessionEnd hook at SESSION_END_HOOK_TIMEOUT_MS_DEFAULT and
      reports "Hook cancelled"; a plugin cannot raise that floor) and the detach must
      still land afterwards, so returning early never degrades into dropping the unbind
      and leaking the binding. LIVE 2026-09-24 (P7): a `claude --worktree demo2` session
      appeared in `fr isolation status` as `wt/demo2 … sessions=<that session''s id>`
      and disappeared when the session exited.'
  - id: native-worktree-sessions-land-in-fr
    capability: isolation-conformity
    acceptance: claude --worktree <name> and EnterWorktree in an fr-enabled repo create
      an fr workspace at the fr location with the session bound; subagent worktrees
      stay plain detached worktrees (out of the repo since gh#1270).
    origin:
    - spec:2026-09-04-worktree-traceability
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_sessions_cmd.py
      int:
      - super-fr:tests/unit/test_hooks_worktree.py
      - super-fr:tests/integration/test_install_worktree_settings_hooks.py
    status: ci
    notes: 'Unit level (phase 4): fr isolation up --print-path (last non-empty stdout
      line is the worktree path, human lines on stderr, idempotent for an existing branch+worktree)
      and fr isolation down --worktree <path> (resolves the workspace by worktree path
      from any cwd; unknown path exits 2). Hook level (filed under int because the matrix
      has no hook level): fr-worktree-create.sh (WorktreeCreate -> fr isolation up --repo
      --branch wt/<name>|<name-with-slash> --session --harness claude --print-path in
      an fr-enabled repo, FR_ISOLATION_TARGET=worktree exported when no devcontainer
      profile; non-fr repos reproduce the Claude default <repo>/.claude/worktrees/<name>
      detached worktree, agent-* names go to ~/.cache/fr/agent-worktrees (row agent-worktrees-reaped-by-fr);
      non-git cwd exits 1) and fr-worktree-remove.sh (WorktreeRemove -> git worktree
      remove for agent-*, else fr isolation down --worktree, refusal reported on stderr
      with exit 0) exercised via subprocess against a stub fr that records argv. LIVE
      2026-09-24 (worktree-traceability P7.T2.S2, Claude Code 2.1.281, fr 4.19.2). On
      a DEFAULT install it FAILED: the plugin-registered WorktreeCreate is never invoked
      for `claude --worktree`, and the session landed in <repo>/.claude/worktrees/demo.
      With the same hooks also registered in ~/.claude/settings.json it PASSED: `claude
      --worktree demo2` landed in ~/.cache/fr/worktrees/super-fr/wt__demo2, bound its
      session, and `exit` removed the workspace and container via WorktreeRemove. install.sh
      now registers them there (tests/integration/test_install_worktree_settings_hooks.py),
      and the create hook is serialized against a double registration. Startup waits
      for a full devcontainer up. EnterWorktree was not walked live.'
  - id: nested-up-files-under-main-checkout
    capability: isolation-conformity
    acceptance: fr isolation up run from inside any worktree of a repo files the workspace
      under the main checkout name.
    origin:
    - spec:2026-09-04-worktree-traceability
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_repo_key.py
    status: ci
    notes: 'Unit level (phase 2): repo_cache_name resolves the main checkout basename
      for the main checkout, a native agent worktree (<repo>/.claude/worktrees/agent-*)
      and a nested worktree elsewhere, falling back to the basename outside git; a host-mode
      `up` launched from inside the agent worktree lands under ~/.cache/fr/worktrees/<main-checkout>/<branch>,
      never under agent-*. Pinned per-PR.'
  - id: gc-reaps-empty-repo-dirs
    capability: isolation-hygiene
    acceptance: fr isolation gc removes empty repo folders and stale session files from
      the fr cache.
    origin:
    - spec:2026-09-04-worktree-traceability
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_gc_hygiene.py
    status: ci
    notes: 'Unit level (phase 2): gc verdicts `empty-repo-dir` (a child of ~/.cache/fr/worktrees
      with no subdirectories is removed; files alone do not make it live; populated
      repo dirs are kept) and `stale-session` (index whose worktree is gone or whose
      state no longer lists the session is unlinked; a healthy index and its state binding
      survive), both with `--dry-run` reporting `would-remove` and mutating nothing.
      Pinned per-PR in host-worktree mode. LIVE 2026-09-24 (P7.T2.S1): gc --dry-run
      then gc on a real machine reaped the merged workspaces and left open, no-PR and
      dirty ones untouched. Squash-merged workspaces whose files main later changed
      are falsely refused (#598).'
  - id: superpowers-worktree-skill-routed-to-fr
    capability: isolation-conformity
    acceptance: In an fr-enabled repo, a request that would invoke using-git-worktrees
      is routed to fr-isolation; no .worktrees directory is created.
    origin:
    - spec:2026-09-04-worktree-traceability
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_worktrees_dir.py
    status: ci
    notes: 'Rule + tripwire (phase 6): the routing claim itself lives in the rule text
      plugins/super-fr/rules/fr-worktree-override.md (installed to ~/.claude/rules by
      install.sh, mirrored to .opencode/instructions and the Hermes SOUL block), and
      a rule is prose the harness follows, not code a test can execute. The unit tripwire
      pins what CAN be checked: the rule exists and carries the claim (using-git-worktrees,
      fr isolation up --branch, never create .worktrees/), git ls-files has no path
      with a .worktrees or .claude/worktrees component, and .gitignore lists both. Pinned
      per-PR.'
