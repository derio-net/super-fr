# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-18-harness-parity-matrix
repo: derio-net/super-fr
rows:
  - id: harness-parity-declared
    capability: Harness parity
    acceptance: Every shipped enforcement and interaction surface declares its state
      on every supported harness, and an undeclared surface fails CI.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_harness_parity.py
    status: ci
    notes: 'Spec 3.A/3.B. Phase 2/6: fr.harness.check.pairing() pairs every shipped
      hooks/*.sh with a matrix row; the tripwire and the operator-facing --check call
      the same function so they cannot disagree.'
  - id: harness-parity-derived-check
    capability: Harness parity
    acceptance: The declared matrix is checked against the real registration files,
      so a hook wired (or unwired) without a matrix update fails.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_harness_check.py
      - super-fr:tests/unit/test_harness_observe.py
    status: ci
    notes: 'Spec 3.B. Both directions: overclaim AND the already-live understatement
      (fr-acceptance-nag on Hermes) both produce findings.'
  - id: harness-tool-neutrality
    capability: Harness parity
    acceptance: No skill, agent or rule — canonical or generated mirror — names a harness-specific
      tool or argument outside an explicitly scoped per-harness clause.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_harness_vocabulary.py
      - super-fr:tests/unit/test_tripwire_skill_tool_neutrality.py
    status: ci
    notes: 'Spec 3.C (2026-09-18): fixed the six live AskUserQuestion occurrences (fr-goal
      §1, fr-init §2, both mirrors); mirrors stay byte-identical, neutrality enforced
      at the canonical source. Widened 2026-09-21 (#497/#532): agent bodies and the
      .opencode/agent mirror scanned. Widened 2026-09-22 (spec 2026-09-22-harness-argument-neutrality):
      rules and their mirrors scanned; harness-specific ARGUMENTS via ARGUMENT_VOCABULARY
      in every spelling; headings outside code fences exempt.'
  - id: harness-gate-degrades-loudly
    capability: Harness parity
    acceptance: On a harness where the operator gate is not enforced, fr run advance
      says so at the gate instead of behaving as though it fired.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_run_cli.py
    status: ci
    notes: Spec 3.D.1. fr.commands.run_cmd._gate_degradation_notice() reads the matrix
      scope_note live (never hardcoded). Live verification on OpenCode/Hermes is Test
      Plan items 1-2, post-merge.
  - id: harness-gate-provenance
    capability: Harness parity
    acceptance: A gate cleared without an operator is recorded as such and reported
      in the delivered PR.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_run_cli.py
      - super-fr:tests/unit/test_run_provenance.py
      - super-fr:tests/unit/test_migration_run_provenance.py
      - super-fr:tests/unit/test_run_resolve_gate_side_effects.py
    status: ci
    notes: 'Spec 3.D.2/3.D.3. Default answered_by=agent so the stronger claim must be
      typed deliberately; fr run gates never renders blank. Incurred a run-kind stamp
      bump (schema_version 2) + migration. gh#632/#690 (2026-09-27): a cleared kind:
      cli gate records unobserved=operator-gate on its flat unit, and a gate''s spec-journal
      decision is written only after every resolve refusal point — pinned in test_run_resolve_gate_side_effects.py.'
  - id: lifecycle-journal-resolve
    capability: Artifact lifecycles
    acceptance: A journal finding can be resolved, and the freshness gate that requires
      no open findings can therefore reach clean.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_journal_cmd.py
      - super-fr:tests/unit/test_journal_model.py
    status: ci
    notes: 'Spec 3.G.1. fr journal resolve appends a resolution record (header token
      resolves=<id>); check and handoff fold records into an effective state, last record
      wins. Proven on this PR''s own journal: 9 open findings to 2, by command, with
      every original entry untouched.'
  - id: lifecycle-acceptance-set-status
    capability: Artifact lifecycles
    acceptance: An acceptance row's status can be moved with a command, so the matrix's
      own lifecycle rule needs no hand-edited YAML.
    origin:
    - spec:2026-09-18-harness-parity-matrix
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_set_status.py
    status: ci
    notes: Spec 3.G.2. fr acceptance set-status moves a row in place, records the reason,
      adds level evidence and regenerates all three committed reports; unknown id or
      status creates nothing. This row was flipped to ci BY that command, and so was
      its sibling -- the hand-edit phase 6 had to perform is gone.
