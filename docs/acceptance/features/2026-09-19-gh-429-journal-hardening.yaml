# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-19-gh-429-journal-hardening
repo: derio-net/super-fr
rows:
  - id: journal-ambiguous-id-protection
    capability: Journal commands refuse ambiguous entry identities
    acceptance: An operator cannot accidentally resolve or validate a journal containing
      two entries with the same id
    origin:
    - spec:2026-09-19-gh-429-journal-hardening
    levels:
      unit:
      - super-fr:tests/unit/test_journal_model.py
      - super-fr:tests/unit/test_journal_cmd.py
    status: ci
    notes: Focused parser and command tests now reject duplicate journal ids before
      mutation.
  - id: journal-loud-duplicate-create
    capability: Journal creates report duplicate ids
    acceptance: An operator receives a failure and resolution guidance instead of a
      silent no-op when reusing a journal id
    origin:
    - spec:2026-09-19-gh-429-journal-hardening
    levels:
      unit:
      - super-fr:tests/unit/test_journal_cmd.py
    status: ci
    notes: Focused command tests verify duplicate adds fail loudly and leave journals
      byte-identical.
  - id: journal-deferred-finding
    capability: Journal
    acceptance: A valid finding that belongs to another change is closed as deferred
      with the issue that carries it — never recorded as refuted — and the gate says
      so rather than hiding it
    origin:
    - spec:2026-09-19-gh-429-journal-hardening
    levels:
      unit:
      - super-fr:tests/unit/test_journal_cmd.py
      - super-fr:tests/unit/test_journal_model.py
    status: ci
    notes: 'Written as an open record plus a tracked_by token so released fr (verified:
      4.13.2) reads it without error and fails closed. Motivated by super-fr#535''s
      finding being mislabelled refuted. LIVE 2026-09-22 (fr 4.14.3) on Claude Code
      and OpenCode: deferred without --tracked-by exits 2; with it the gate passes and
      prints the deferral.'
