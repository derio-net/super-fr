# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-20-bounded-executor-handoff
repo: derio-net/super-fr
rows:
  - id: handoff-closed-entries-bounded
    capability: fr-goal-cost
    acceptance: A closed journal entry (fixed or refuted finding, resolution record)
      contributes a constant amount to an executor handoff regardless of its body size,
      including within dependency phases.
    origin:
    - spec:2026-09-20-bounded-executor-handoff
    levels:
      unit:
      - super-fr:tests/unit/test_handoff_bound.py#test_a_closed_entry_costs_a_constant_regardless_of_its_body_size
      - super-fr:tests/unit/test_handoff_bound.py#test_but_growing_an_open_findings_body_does_grow_the_handoff
      - super-fr:tests/unit/test_handoff_bound.py#test_a_refuted_finding_collapses_and_stays_refuted
      - super-fr:tests/unit/test_handoff_bound.py#test_a_resolution_record_collapses_and_so_does_what_it_closed
    status: ci
    notes: 'Phase-5 review found the evidence narrower than the sentence: the row names
      ''fixed or refuted finding, resolution record'' but the cited tests built journals
      of fixed findings only — nothing asserted a refuted entry collapses, and the resolution-record
      case was covered but uncited. Closed by adding a refuted entry to the collapse
      fixture with its own assertion (it must collapse AND stay labelled refuted, since
      ''we looked and it was not a bug'' is a different fact from ''we fixed it''),
      and by citing the resolution-record test that already existed. All three levels
      now name a test that exercises the state it claims.'
  - id: handoff-entries-always-tagged
    capability: fr-goal-cost
    acceptance: Writing a plan-scope journal entry forces an explicit choice between
      a phase tag and `--global`, so no entry renders in full in every handoff by accident.
    origin:
    - spec:2026-09-20-bounded-executor-handoff
    levels:
      unit:
      - super-fr:tests/unit/test_journal_cmd.py
    status: ci
    notes: 'Phase 3 (2026-09-20-bounded-executor-handoff): fr journal add --scope plan
      now requires --phase N or --global, refusing neither (naming the consequence:
      renders in full in every handoff, at every phase) and refusing both (contradictory).
      --scope spec/debug unaffected. Root-cause prose (fr-phase-executor.md + fr-execute
      skill, mirrored) fixed in the same phase.'
  - id: executor-context-discipline
    capability: fr-goal-cost
    acceptance: The executor contract forbids re-deriving what the handoff already states
      and pasting verbatim tool output into the return, on every harness that mirrors
      the agent.
    origin:
    - spec:2026-09-20-bounded-executor-handoff
    levels:
      unit:
      - super-fr:tests/unit/test_skill_tokens.py#test_fr_phase_executor_and_all_opencode_mirrors_carry_the_context_discipline_norm
      - super-fr:tests/unit/test_skill_tokens.py#test_fr_goal_dispatch_brief_asks_for_a_summary_not_pasted_output
      - super-fr:tests/unit/test_opencode_agent_mirror.py#test_body_is_canonical_body_verbatim
    status: ci
    notes: 'Phase 5 (2026-09-20-bounded-executor-handoff): the sixth contract norm and
      the pre-existing #461 return-only norm are pinned in the canonical agent and all
      four OpenCode mirrors by a dedicated tripwire test, plus fr-goal''s own dispatch-brief
      guidance agreeing with the contract (spec §5.B2).'
  - id: run-telemetry-measured-claude-code
    capability: fr-goal-cost
    acceptance: fr run status reports real per-phase token figures parsed from the Claude
      Code transcript, and degrades loudly to a labeled estimate when it cannot.
    origin:
    - spec:2026-09-20-bounded-executor-handoff
    levels:
      unit:
      - super-fr:tests/unit/test_run_telemetry.py
      - super-fr:tests/unit/test_migration_run_telemetry.py
      - super-fr:tests/unit/test_run_cost_cmd.py#test_an_unobserved_figure_prints_a_dash
    status: ci
    notes: 'Phase 5 (2026-09-20-bounded-executor-handoff): the Claude Code V2 reader/attributor
      (test_run_telemetry.py, 26 tests incl. isSidechain-filter and sessionId/cwd guards),
      the end-to-end advance-then-resolve path, the loud-degradation half of the acceptance
      sentence (measured vs. estimate rendering never conflated, absence said out loud),
      and the run-cursor migration/validator all run in CI. gh#531: three name anchors
      named tests #628 deleted when it moved every cost figure out of the cursor into
      the usage file (`fr run cost`); dropped, and the loud-degradation half re-pointed
      at test_run_cost_cmd (an unobserved figure prints a dash, never a zero). The acceptance
      text still says `fr run status` and predates #628; no verb rewrites it (#522).'
