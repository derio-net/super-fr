# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-20-dispatch-holder-identity
repo: derio-net/super-fr
rows:
  - id: run-dispatch-holder-recorded
    capability: Run cursor
    acceptance: fr run status names the agent holding a phase and since when, and shows
      the dispatched to returned pair once it settles
    origin:
    - spec:2026-09-20-dispatch-holder-identity
    levels:
      unit:
      - super-fr:tests/unit/test_run_cli.py
      - super-fr:tests/unit/test_run_state.py
      - super-fr:tests/unit/test_validate_artifacts.py
    status: ci
    notes: 'Unit level landed in phases 1-5: DispatchRecord round-trips (test_run_state.py),
      fr run advance opens a record with agent_type/model/harness and fr run claim names
      the holder, and fr run status renders both the HELD BY line and the dispatched->returned
      pair (test_status_renders_held_by_and_the_claimed_identity, test_status_renders_a_settled_dispatch,
      test_status_renders_held_by_the_orchestrator, test_status_shows_every_record_of_a_unit_oldest_first).
      fr validate artifacts accepts a cursor carrying dispatch. Verified live against
      this feature''s own run cursor (journal x-p5-status-check-live). The live level
      - a real /fr-goal dispatch on a real subagent id - is Test Plan item 13, post-merge;
      ci here gates the unit half, which is what CI can prove.'
  - id: run-dispatch-refuses-second
    capability: Run cursor
    acceptance: fr run advance refuses to re-brief a phase unit that is already held,
      naming the holder, and --redispatch is the deliberate escape
    origin:
    - spec:2026-09-20-dispatch-holder-identity
    levels:
      unit:
      - super-fr:tests/unit/test_run_cli.py
    status: ci
    notes: 'CANONICAL ROW for "fr run advance will not hand out a second brief for a
      unit somebody is already holding". Closed #499: advance exits 2 on a unit whose
      dispatch record is still open, naming the holder and printing no brief (tests/unit/test_run_cli.py:
      test_advance_refuses_a_held_unit_and_prints_no_brief, test_the_refusal_names_the_holder_agent_type_harness_and_dispatch_time,
      test_the_refusal_says_an_unclaimed_agent_when_nobody_claimed, test_the_refusal_prints_all_three_ways_forward),
      and --redispatch closes the old record abandoned and appends a fresh one (test_redispatch_closes_the_holder_abandoned_and_appends_a_fresh_record).
      Mutation-verified, and verified live against this feature''s own run cursor writing
      nothing (journal x-refusal-live, x-refusal-verified-independently). Test Plan
      item 15 repeats it live post-merge. Phase 4 of the unit-record plan added the
      cross-session arm: the refusal says the holder was dispatched from ANOTHER session
      and that its cost is not observable from here (test_advance_refusing_another_sessions_holder_says_it_cannot_see_it),
      while the ordinary refusal deliberately acquires no such sentence (test_advance_refusing_its_own_sessions_holder_says_nothing_about_sessions).

      MERGE (2026-09-21, unit-record-unification spec section 7): gh#519''s row run-advance-refuses-running
      is ABSORBED HERE - one behaviour, one row. Witness decision u1 (spec journal)
      made them literally the same claim: the witness IS the open attempt, and "the
      unit is running" is lifecycle state everywhere else, so the two rows could only
      ever move together and a reader had no way to tell which one to trust. THIS row
      is canonical. The other is NOT deleted - the matrix ships add / set-status / check
      and no delete or edit verb (checked: fr acceptance --help), and removing a row
      by hand is exactly the hand-edit the acceptance-matrix rule forbids - so it remains
      as a pointer back here. Its evidence is folded in: the grouped-member and flat-step
      arms (test_advance_refuses_a_running_member, test_advance_refuses_a_running_top_level_agent_step,
      test_a_running_member_with_no_dispatch_record_is_still_refused, test_a_running_flat_step_with_no_dispatch_record_is_still_refused,
      test_a_flat_agent_step_is_refused_the_same_way) and the --redispatch escape (test_redispatch_re_emits_the_brief_for_the_outstanding_unit_only,
      test_redispatch_with_nothing_outstanding_is_refused, test_redispatch_is_the_way_out_of_a_recordless_running_unit).'
  - id: run-dispatch-abandon
    capability: Run cursor
    acceptance: An operator can declare a dispatch abandoned, freeing the phase unit
      for re-dispatch without resolving the step
    origin:
    - spec:2026-09-20-dispatch-holder-identity
    levels:
      unit:
      - super-fr:tests/unit/test_run_cli.py
    status: ci
    notes: 'Phase 3 shipped fr run claim --abandoned: it closes the record (returned/outcome
      abandoned) WITHOUT resolving the step, leaving the unit running so the next advance
      briefs it again (test_claim_abandoned_sets_returned_and_outcome, test_claim_abandoned_leaves_the_grouped_members_item_running,
      test_claim_abandoned_leaves_the_flat_steps_state_running, test_advance_after_abandon_briefs_again_and_appends_a_second_record),
      and it refuses a unit with no open record or a stray --agent. Live-verified by
      closing this run''s own bootstrap-era open records (journal x-abandon-live). Unit
      is the whole level the spec asks for on this row.'
  - id: run-dispatch-harness-neutral
    capability: Harness parity
    acceptance: The dispatch holder record is written identically on Claude Code and
      OpenCode, each recording its own harness and agent id
    origin:
    - spec:2026-09-20-dispatch-holder-identity
    levels:
      int:
      - super-fr:docs/acceptance/evidence/2026-09-21-pr508-live-test-plan.md
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): driven
      live post-merge 2026-09-21 on fr 4.12.0, one /fr-goal per harness (Claude Code
      and OpenCode), both walks recorded.'
    walks:
    - strategy: live
      harness: claude-code
      model: unrecorded
      outcome: pass
      at: '2026-09-21T00:00:00Z'
      evidence: docs/acceptance/evidence/2026-09-21-pr508-live-test-plan.md (Claude
        Code run)
    - strategy: live
      harness: opencode
      model: redacted
      outcome: pass
      at: '2026-09-21T00:00:00Z'
      evidence: docs/acceptance/evidence/2026-09-21-pr508-live-test-plan.md (OpenCode
        run, model redacted in the evidence file)
