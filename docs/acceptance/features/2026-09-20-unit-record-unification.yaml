  - id: run-pickup-on-another-host
    capability: Run cursor
    acceptance: A run pushed mid-phase and picked up on another host shows the orphaned
      holder, refuses a double dispatch, and recovers via --abandoned
    origin:
    - spec:2026-09-20-unit-record-unification
    levels: {}
    status: not-implemented
    notes: 'LIVE-ONLY BY NATURE - stays not-implemented, re-confirmed at phase 7. The
      mechanism''s unit half landed in phase 4 and is genuinely covered: the refusal
      now says the holder was dispatched from ANOTHER session and that its cost is not
      observable from here, and names fr run claim --abandoned (tests/unit/test_run_cli.py::test_advance_refusing_another_sessions_holder_says_it_cannot_see_it,
      with test_advance_refusing_its_own_sessions_holder_says_nothing_about_sessions
      pinning that the ORDINARY refusal does not acquire that sentence), and the window
      is refused for an attempt this session did not dispatch (tests/unit/test_run_telemetry.py::test_the_window_is_refused_for_an_attempt_this_session_did_not_dispatch).

      But this row''s claim is TWO REAL HOSTS: a cursor pushed mid-phase and pulled
      on another machine whose transcripts (~/.claude/projects) and session bindings
      (~/.cache/fr/sessions) never travelled with the branch, and whose executor may
      have died with its host. No unit test can be two machines - every such test simulates
      absence by not writing a file, which is the thing being tested. Flipping it on
      the unit evidence would report a live claim as verified.

