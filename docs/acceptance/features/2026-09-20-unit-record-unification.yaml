  - id: run-idle-guard-acts-once-per-position
    capability: Harness parity
    acceptance: The idle guard acts at most once per cursor position, so a failing advance
      cannot trap a session in a loop
    origin:
    - spec:2026-09-20-unit-record-unification
    levels:
      unit:
      - super-fr:tests/unit/test_run_idle.py#test_the_position_moves_when_the_cursor_does_and_only_then
      - super-fr:tests/unit/test_run_idle.py#test_a_failing_advance_does_not_move_the_position
      int:
      - super-fr:tests/integration/test_run_idle_guard.py#test_fails_open_when_it_cannot_remember_having_acted
      - super-fr:tests/integration/test_run_idle_guard.py#test_it_acts_at_most_once_per_cursor_position
      - super-fr:tests/integration/test_run_idle_guard.py#test_it_acts_again_once_the_cursor_has_moved
      - super-fr:tests/integration/test_run_idle_guard.py#test_stop_hook_active_is_an_independent_brake
    status: ci
    notes: 'The loop breaker. fr emits an opaque position (run, cursor, step state,
      gate, each unit''s state and attempt count — no timestamp, so a failing advance
      that only re-stamps a record is not progress). The hook remembers the position
      it last acted on beside the session binding, WRITES AND READS IT BACK before blocking,
      and does not block at all if it cannot: a second stop at the same position passes,
      and it acts again once the cursor moves. Independent brakes: stop_hook_active
      must be literally false (the CAPTURED continuation payload is let through with
      no memory at all; a build that drops the field silences the guard rather than
      un-braking it), and Claude Code''s own CLAUDE_CODE_STOP_HOOK_BLOCK_CAP (default
      8, read from the binary). fr isolation detach deletes the memory with the binding.
      gh#531: line anchors re-pointed to the tests they were recorded for (they had
      slid onto other tests as lines moved).'
