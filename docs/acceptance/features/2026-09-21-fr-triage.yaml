# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-21-fr-triage
repo: derio-net/super-fr
rows:
  - id: triage-repo-local
    capability: Backlog triage
    acceptance: An operator can produce a ranked, filterable backlog board for one repo
      as a local HTML file, with no Artifact tool and no server
    origin:
    - spec:2026-09-21-fr-triage
    levels:
      unit:
      - super-fr:tests/unit/test_triage_render.py
    status: ci
    notes: 'Test Plan items 5 and 7: render groups a repo''s captured-fixture facts
      by tier with Unranked first, carries the filter/sort data attributes, writes triage.html
      via the CLI, and two renders under different patched clocks are byte-identical.
      Collect side proven by test_triage_collect.py (items 1-3).'
  - id: triage-org-scope
    capability: Backlog triage
    acceptance: An operator can triage every non-archived repo of an org into one board,
      and a repo whose issues cannot be read is reported rather than aborting the board
    origin:
    - spec:2026-09-21-fr-triage
    levels:
      unit:
      - super-fr:tests/unit/test_triage_collect.py
    status: ci
    notes: Org-scope collect with a failing repo recorded under skipped, plus cross-repo
      PR links keyed on the reference's repository (spec §3.C, review r2).
  - id: triage-unranked-visible
    capability: Backlog triage
    acceptance: 'An issue with no ranking is never silently absent: it renders first,
      in its own Unranked tier, and fr triage check names it'
    origin:
    - spec:2026-09-21-fr-triage
    levels:
      unit:
      - super-fr:tests/unit/test_triage_render.py
      - super-fr:tests/unit/test_triage_check.py
    status: ci
    notes: 'Test Plan items 4 and 5: check reports unranked, settled, orphaned and unreachable
      (unviewed or skipped-repo judgements never orphaned), exit 0 throughout; render
      puts the unranked issue in the first tier, labelled not yet triaged with the fr-triage
      prompt, also when judgements.yaml is missing.'
  - id: triage-stage-derived
    capability: Backlog triage
    acceptance: Each issue's stage (backlog, blocked, PR draft, PR ready, merged, closed)
      is derived from forge facts on every collect, never hand-set
    origin:
    - spec:2026-09-21-fr-triage
    levels:
      unit:
      - super-fr:tests/unit/test_triage_stage.py
    status: ci
    notes: 'One case per row of spec §3.E: the six derived stages closed, merged, pr-ready,
      pr-draft, blocked and backlog, plus a closed issue with an open PR staying closed.'
  - id: triage-untrusted-text-inert
    capability: Backlog triage
    acceptance: 'A board over an org''s issues is safe to open: titles, bodies and labels
      filed by anyone render as inert text'
    origin:
    - spec:2026-09-21-fr-triage
    levels:
      unit:
      - super-fr:tests/unit/test_triage_render.py
    status: ci
    notes: 'Test Plan item 6, now proven in every context the page places untrusted
      text (review r-p3-row-overclaims). Element content: a <script> title, a </script>
      body and a markup label render only escaped, the single script element carries
      no facts text, and inline markup escapes first then allows only code and bold.
      Attribute: test_a_title_cannot_break_out_of_the_data_search_attribute parses the
      page and finds no on* attribute on any element and the literal quote inside data-search.
      Href: test_a_non_https_url_produces_no_href (javascript:, data:, HTTPS://, whitespace-led).
      Masthead, tier and pattern: test_hostile_text_in_every_context_renders_escaped
      (theme, tier title, tier description, pattern title, skipped repo and reason,
      unviewed reason, scope) and test_hostile_pattern_ids_render_escaped_even_past_the_loader.
      Mutation proof 2026-09-21: dropping each esc() in render.py, or loosening _safe_url
      to strip/lower or to accept anything, turned exactly the matching test red (11
      of 11). check''s human output escapes rich markup (r7, test_triage_check.py).'
  - id: triage-skill-claude-code
    capability: Backlog triage
    acceptance: An agent on Claude Code can follow fr-triage end to end for a repo and
      an org
    origin:
    - spec:2026-09-21-fr-triage
    levels: {}
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): walked
      live post-merge 2026-09-22 (Test Plan 11); evidence in the plan journal.'
    walks:
    - strategy: live
      harness: claude-code
      model: Opus 5
      outcome: pass
      at: '2026-09-22T00:00:00Z'
      evidence: 'Test Plan 11 post-merge walk on Claude Code 2.1.278: repo-scope sync
        and org scope over derio-net; plan journal walk-claude-code-repo'
  - id: triage-skill-opencode
    capability: Backlog triage
    acceptance: An agent on OpenCode, which has no Artifact tool, can follow fr-triage
      end to end for a repo
    origin:
    - spec:2026-09-21-fr-triage
    levels: {}
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): walked
      live post-merge 2026-09-22 (Test Plan 12) with a non-Claude model; evidence in
      plan journal walk-opencode.'
    walks:
    - strategy: live
      harness: opencode
      model: github-copilot/gpt-5.6-terra
      outcome: pass
      at: '2026-09-22T00:00:00Z'
      evidence: 'Test Plan 12 post-merge walk on OpenCode: first-run repo triage; plan
        journal walk-opencode'
  - id: triage-skill-hermes
    capability: Backlog triage
    acceptance: An agent on Hermes can follow fr-triage end to end
    origin:
    - spec:2026-09-21-fr-triage
    levels: {}
    status: not-implemented
    notes: Born at brainstorm; decision d4 chose not to walk Hermes. Stays not-implemented
      until someone does.
