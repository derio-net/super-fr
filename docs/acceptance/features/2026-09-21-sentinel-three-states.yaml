# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-21-sentinel-three-states
repo: derio-net/super-fr
rows:
  - id: sentinel-three-state-guard
    capability: Isolation state
    acceptance: The guard decides pipeline sentinel state from its fields (fresh/live/orphaned),
      not a worktree count, ending count-based self-heal false negatives (#472) and
      false positives (#529)
    origin:
    - spec:2026-09-21-sentinel-three-states
    levels:
      unit:
      - super-fr:tests/unit/test_sentinel_lifecycle.py
      - super-fr:tests/unit/test_sentinel_liveness.py
      - super-fr:tests/unit/test_hooks_guard.py#TestSentinelThreeStates
      - super-fr:tests/unit/test_sentinel_workspace_stamp.py
    status: ci
    notes: 'Liveness closed: the guard refreshes an active session''s sentinel so the
      48h GC only expires abandoned ones, and every sentinel writer shares one mkdir
      lock (a lost workspace entry could fail open). End-to-end down through the real
      CLI added. LIVE 2026-09-22 (fr 4.14.3, Claude Code, harness-invoked hooks on the
      session''s own commands): fresh sentinel denied and never healed; bind recorded
      the workspace cache-relative, no lock left; two workspaces formed a set and down
      of one kept the guard armed; a gc-style reap of the last healed on the next base-clone
      command. OpenCode: no Bash guard by design (parity: fr-pipeline-sentinel absent).
      gh#531: split a ref that had fused two refs with a comma, and anchored the hooks-guard
      ref on TestSentinelThreeStates (it sat on a helper).'
  - id: guard-denial-truthful
    capability: Isolation state
    acceptance: 'Guard denial messages convey the true state: cd target gone says the
      path no longer exists and points at recovery options; standard denial points first
      at status/up, deprecates unconditional down --all (#432)'
    origin:
    - spec:2026-09-21-sentinel-three-states#2.C
    levels:
      unit:
      - super-fr:tests/unit/test_hooks_guard.py#TestDenialsSayTheTrueThing
    status: ci
    notes: 'Tests pass in TestDenialsSayTheTrueThing: cd <nonexistent path> says ''no
      longer exists'' with recovery options; standard denial points at status/up first,
      only warns about down --all effects. gh#531: line anchors re-pointed to the tests
      they were recorded for (they had slid onto other tests as lines moved).'
  - id: verify-merge-after-gc
    capability: Isolation state
    acceptance: 'After gc has reaped a workspace, fr isolation verify-merge --branch
      still works without state: it fetches origin, resolves the branch ref, verifies
      the merge, and reports the workspace was already reaped'
    origin:
    - spec:2026-09-21-sentinel-three-states#2.D
    levels:
      unit:
      - super-fr:tests/unit/test_isolation.py
      - super-fr:tests/unit/test_isolation_cmd.py#test_verify_merge_reaped_verified
    status: ci
    notes: 'With --branch and no workspace, verify-merge fetches the branch and requires
      every surviving ref (origin/<b> and the local branch) to have landed on origin/<default>;
      an unresolvable ref exits 2. LIVE 2026-09-22 on Claude Code (4.13.2 fallback,
      #534 close-out) and OpenCode (4.14.3): reported verified with ''workspace already
      reaped''. gh#531: line anchors re-pointed to the tests they were recorded for
      (they had slid onto other tests as lines moved).'
  - id: down-all-blast-radius
    capability: Isolation guard
    acceptance: fr isolation down --all shows what it will tear down and refuses to
      tear down another session's workspace without --yes
    origin:
    - spec:2026-09-21-sentinel-three-states
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_cmd.py
    status: ci
    notes: 'Split from #432; #533. LIVE 2026-09-22 (fr 4.14.3) on Claude Code and OpenCode:
      --dry-run listed all 8 workspaces with keep reasons and bound sessions and changed
      nothing.'
