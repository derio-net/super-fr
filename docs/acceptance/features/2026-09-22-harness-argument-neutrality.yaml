# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-22-harness-argument-neutrality
repo: derio-net/super-fr
rows:
  - id: harness-argument-neutrality
    capability: Harness parity
    acceptance: A harness-specific argument named outside a scoped per-harness clause,
      in any skill, agent or rule (canonical or mirror) and in any spelling, fails CI
    origin:
    - spec:2026-09-22-harness-argument-neutrality
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_skill_tool_neutrality.py
      - super-fr:tests/unit/test_harness_vocabulary.py
    status: ci
    notes: 'Spec 3.A-C, phase 3. ARGUMENT_VOCABULARY (isolation flag in every spelling,
      run_in_background, Hermes background=true) is scanned by scan_prose everywhere;
      the tripwire covers skills, agents and rules (canonical plugins/super-fr/rules
      + .claude/rules, mirrors .opencode/instructions + .hermes/SOUL.d) and asserts
      zero violations. Closes the gap the adversarial review of #532 found: the flag
      was scanned only in agents, in one spelling; run_in_background nowhere; rules
      not at all.'
  - id: executor-long-commands-per-harness
    capability: fr-goal phase executor dispatch
    acceptance: The phase executor tells a reader on each harness how to run a command
      longer than that harness's foreground limit, and to leave nothing running at handback
    origin:
    - spec:2026-09-22-harness-argument-neutrality
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_skill_tool_neutrality.py
      - super-fr:tests/unit/test_phase_executor_agent.py
      - super-fr:tests/unit/test_long_command_rule.py
      - super-fr:tests/unit/test_run_cli.py
    status: ci
    notes: 'Spec 3.D. ci pins the PROSE: tests/unit/test_phase_executor_agent.py checks
      each harness''s arm carries its own mechanism and none of another''s (review p3r-4).
      Sources: OpenCode timeout/kill from its bash tool source; Hermes terminal/process
      from its tools reference; the OpenCode detach recipe (PID file, exit-code capture)
      is the one arm not verified from source. The BEHAVIOUR — a long suite not killed,
      nothing left running — is the post-merge Test Plan smoke''s to show (review p3r-m1/m2).
      LIVE SMOKE (#564 Test Plan step 2, 2026-09-23, OpenCode 1.18.32, mechanical tier
      on claude-haiku-4.5): the executor ran the full suite with no timeout twice, and
      it was killed at 120 s both times before it passed timeout=600000 and the suite
      passed (150 s). The orchestrator passed timeouts correctly. So the agent-file
      clause alone does not change behaviour (gh#582). FIX: every phase-member brief
      now carries the harness''s rule as long_commands, and fr-goal copies it into the
      task prompt verbatim (tests/unit/test_run_cli.py, tests/unit/test_long_command_rule.py).
      RE-WALK (2026-09-23, fr 4.17.2, same smoke, executor fr-phase-executor-mechanical
      on claude-haiku-4.5): the orchestrator copied the brief''s long_commands rule
      into the task prompt verbatim, and ALL three of the executor''s full-suite calls,
      the first included, passed timeout=600000; each ran 150 s with nothing killed
      and no process left behind. PASS. Side observation: the review-phase reviewer=
      id was mis-copied by one character (advisory on OpenCode, per #536''s stated limit).'
  - id: phase-executor-description-rules-out-second-worktree
    capability: fr-goal phase executor dispatch
    acceptance: The phase-executor description check fails a description that merely
      mentions a second worktree instead of ruling it out
    origin:
    - spec:2026-09-22-harness-argument-neutrality
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_phase_executor_worktree.py
    status: ci
    notes: 'Phase 4 (2026-09-22): _rules_out_a_second_worktree now requires a negation
      to GOVERN the phrase — same clause (split on . ; —), before it, only filler words
      between (<=6). Parametrized must-fail cases (the adversarial review''s four) and
      must-pass cases (shipped description, pre-#532 literal-flag wording) run in CI.'
