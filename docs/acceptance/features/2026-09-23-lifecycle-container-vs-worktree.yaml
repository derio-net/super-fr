# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-23-lifecycle-container-vs-worktree
repo: derio-net/super-fr
rows:
  - id: isolation-rebuild-keeps-worktree
    capability: Isolation lifecycle
    acceptance: 'An operator applies a changed devcontainer profile with `fr isolation
      rebuild`: the container is recreated with the new features while uncommitted worktree
      files and an active run''s cursor survive (#577).'
    origin:
    - spec:2026-09-23-lifecycle-container-vs-worktree
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_container_verbs.py
    status: ci
    notes: 'Unit (every PR): rebuild argv = up argv + --remove-existing-container (+
      --build-no-cache), missing worktree refused, changed old image reclaimed only
      on success (an already-gone one is not a warning, p6-f1), host no-op / external
      refuses, state + marker untouched. LIVE ONLY, not automated: that a changed profile''s
      feature actually applies (node answered after rebuild) and that the uncommitted
      scratch file and the run cursor survive — plan journal 2026-09-23-lifecycle-container-vs-worktree
      p6-live-577 (transcript corrected in p6-live-577b); p6-f1''s resolution records
      the image-store evidence (no leak).'
  - id: isolation-stop-and-resume
    capability: Isolation lifecycle
    acceptance: An operator stops an idle workspace container with `fr isolation stop`
      (worktree and state kept, status reads stopped), and the next `fr isolation exec`
      resumes it instead of failing with a raw devcontainer error (#471).
    origin:
    - spec:2026-09-23-lifecycle-container-vs-worktree
    levels:
      unit:
      - super-fr:tests/unit/test_isolation.py
      - super-fr:tests/unit/test_isolation_cmd.py
      - super-fr:tests/unit/test_isolation_container_verbs.py
    status: ci
    notes: 'Unit (every PR): stop argv + verification re-query, already-stopped no-op,
      no container errors, status maps exited→stopped (TestStop, CLI stop tests); exec
      resume matrix running/exited/paused/dead/docker-unreachable/resume-failure (TestExecEnsureRunning).
      Live 2026-09-23 (plan journal 2026-09-23-lifecycle-container-vs-worktree): acceptance
      1+3 by exec (p6-live-471), acceptance 2 — an in-container install survives — by
      restart and by up on the same container (p6-live-471b); attribution in p6-live-471-attribution.
      #471 acceptance 4 deferred to #580.'
  - id: isolation-down-preserves-run
    capability: Isolation lifecycle
    acceptance: Tearing down a workspace that holds an active run names the run in the
      refusal, preserves its uncommitted cursor even under --force, and the next `fr
      isolation up --branch` restores it (#575).
    origin:
    - spec:2026-09-23-lifecycle-container-vs-worktree
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_preserve.py
      int:
      - super-fr:tests/integration/test_run_survives_teardown.py
    status: ci
    notes: 'Unit (every PR): only docs/superpowers/** staged, -z rename/delete/non-ASCII
      parsing, tombstone only after verified removal, merge, restore rules, refusal
      names the active run. Integration (every PR): run start → commit → advance → down
      refuses naming the run → down --force preserves → up --branch restores the advanced
      cursor. Live walk 2026-09-23 (plan journal 2026-09-23-lifecycle-container-vs-worktree
      p6-live-575), incl. the shipped fr-goal manifest advancing on the restored cursor.'
  - id: run-missing-explains-teardown
    capability: Isolation lifecycle
    acceptance: A `fr run` command for a run whose workspace was torn down says so and
      names the recovery command, instead of an unexplained missing path; a never-existed
      id says that instead (#575).
    origin:
    - spec:2026-09-23-lifecycle-container-vs-worktree
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_explain_missing.py
      - super-fr:tests/unit/test_run_cli.py
      int:
      - super-fr:tests/integration/test_run_survives_teardown.py
    status: ci
    notes: 'Unit (every PR): explain_missing in every order (live workspace, preserved/committed
      tombstone, set-aside, unfinished teardown, never-existed; never raises) and one
      load path at every fr run load site. Integration: the torn-down message from fr
      run advance in another checkout. Live walk 2026-09-23 (plan journal 2026-09-23-lifecycle-container-vs-worktree
      p6-live-575): fr run advance/status for a torn-down run print the preserved-record
      text naming fr isolation up --branch.'
  - id: isolation-up-reuses-remote-branch
    capability: Isolation lifecycle
    acceptance: '`fr isolation up --branch <B>` on a branch that exists only on origin
      checks out origin''s tip, refuses an ambiguous --base, and names the tip it used
      (#438).'
    origin:
    - spec:2026-09-23-lifecycle-container-vs-worktree
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_branch_classify.py
      int:
      - super-fr:tests/integration/test_up_branch_reuses_origin.py
    status: ci
    notes: 'Integration (every PR, bare-repo origin): remote-only branch checks out
      origin''s tip, --single-branch clone still finds it, --base beside origin/<B>
      refused, behind local used with WARNING. Unit: every spec §3.E row, ls-remote
      exit codes, fetch-failure and --no-fetch paths. Not walked live against github.com:
      the phase-6 live walks exercised the local-branch reuse row only (up after a forced
      down: ''reusing local branch'').'
