# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-25-lean-cost-aware-process
repo: derio-net/super-fr
rows:
  - id: usage-reconstruct-cross-harness
    capability: Lean cost-aware pipeline
    acceptance: The operator can reconstruct a run's cost per model, step and activity
      from Claude Code, OpenCode or Hermes session data
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      unit:
      - super-fr:tests/unit/test_usage_readers.py
      - super-fr:tests/unit/test_usage_report.py
      - super-fr:tests/unit/test_usage_classify.py
    status: ci
    notes: 'Phase 1 of 2026-09-25-lean-cost-aware-process: per-harness readers over
      redacted fixtures (Claude Code capture, OpenCode live-schema DB incl. Copilot-routed
      estimated rows, Hermes upstream-schema DB), the classifier table and the rollup/CLI
      tests run in CI; cost per model, activity and step reconstructed. Hermes rows
      are schema-built, not a live capture (journal 83ed2919b8c4, live capture tracked
      in #623).'
  - id: usage-captured-at-deliver
    capability: Lean cost-aware pipeline
    acceptance: Delivering a run stores its usage in docs/superpowers/usage/<run-id>.yaml
      without an extra agent turn
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      int:
      - super-fr:tests/unit/test_usage_capture.py
    status: ci
    notes: fr run resolve --step deliver writes usage/<run>.yaml in the SAME commit
      as the cursor move, no extra agent turn; new-host and archive captures covered
      too; phase 2
  - id: usage-readable-on-any-host
    capability: Lean cost-aware pipeline
    acceptance: fr run cost shows a delivered run's cost on a checkout that never ran
      it
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      int:
      - super-fr:tests/unit/test_run_cost_cmd.py
    status: ci
    notes: 'CI unit-pinned; live-verified 2026-09-26: fr run cost from a fresh clone
      with an empty HOME rendered the Claude Code run''s per-step turns and per-model
      tokens from the committed usage file. The OpenCode run rendered empty because
      nothing was captured (#636).'
  - id: usage-privacy-no-host-identity
    capability: Lean cost-aware pipeline
    acceptance: A usage file never contains a hostname, base URL, path or message content
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      unit:
      - super-fr:tests/unit/test_usage_kind.py
    status: ci
    notes: 'test_a_capture_serializes_no_host_url_path_or_content: a capture from fixture
      host laptop.corp.example whose tool-call targets hold a hostname, ~/ and /Users
      paths and a URL serializes none of them (allowlist projection, p2-r12); phase
      2'
  - id: usage-devcontainer-captures
    capability: Lean cost-aware pipeline
    acceptance: A devcontainer-mode run's usage file has readable sessions
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels: {}
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): live-verified
      2026-09-26 (Test Plan 15). Caveat: subagent transcripts omitted (#637).'
    walks:
    - strategy: live
      harness: unrecorded
      model: unrecorded
      outcome: pass
      at: '2026-09-26T00:00:00Z'
      evidence: 'Test Plan 15 (#628 phase 4): /fr-goal on #624 in devcontainer mode,
        PR #635, captured a readable session'
  - id: step-record-one-resolve
    capability: Lean cost-aware pipeline
    acceptance: 'Each agent step''s bookkeeping is one fr run resolve --record: one
      commit, one line of output'
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      int:
      - super-fr:tests/unit/test_record_apply.py
      - super-fr:tests/unit/test_record_verbs.py
    status: ci
    notes: 'fr run resolve --record over a real fr-goal run in a linked worktree: one
      commit, clean tree for fr''s paths, one stdout line naming counts/next/sha; the
      verbs route through the same engine (spy).'
  - id: step-record-atomic-refusal
    capability: Lean cost-aware pipeline
    acceptance: An invalid step record changes nothing
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      unit:
      - super-fr:tests/unit/test_record_apply.py
      - super-fr:tests/unit/test_record_schema.py
    status: ci
    notes: unknown section, unknown tick id, unknown finding id, malformed and duplicate
      entries and the refactor gate each exit 2 with every file hash-identical, HEAD
      unchanged and the record left in place; gate refusals restore the overlay.
  - id: stale-session-resumes-record
    capability: Lean cost-aware pipeline
    acceptance: A new session picks up an in-progress step record and completes it
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      int:
      - super-fr:tests/unit/test_record_template.py
    status: ci
    notes: 'session A commits a partial record; a fresh process with another session
      id sees ''record in progress: 1 ticks, 1 decisions'' in fr pickup, appends and
      resolve --record applies the whole.'
  - id: bookkeeping-turns-per-step
    capability: Lean cost-aware pipeline
    acceptance: A live run spends at most 2 bookkeeping turns per step (baseline 6.1)
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels: {}
    status: not-implemented
    notes: 'Live walk 2026-09-26 missed the target: 2.7 turns/step-item on Claude Code
      (32/12, PR #635), 3.6 on OpenCode (36/10, PR #633), down from 6.1. Main drivers:
      deliver''s tests= gate refusing real suite logs (#607 comment), OpenCode''s orphan
      journal (#639). Stays open until a walk lands at or under 2.'
  - id: deliver-pr-body-sections
    capability: Lean cost-aware pipeline
    acceptance: A PR missing a required fr-rendered section cannot be delivered
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      int:
      - super-fr:tests/unit/test_deliver_pr_body.py
    status: ci
    notes: deliver's resolve --record renders pr-body.md and, with fr.gh mocked, refuses
      a live body missing the out-of-scope section (exit 2, named) and delivers one
      carrying every section.
  - id: audit-pages-regenerated
    capability: Lean cost-aware pipeline
    acceptance: The operator can regenerate the audit and architecture pages from run
      data
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      int:
      - super-fr:tests/integration/test_usage_report_cli.py
    status: ci
    notes: engine regenerates the audit page and the measured half of the architecture
      page; the future-state half is authored (spec §5.A.6)
  - id: deliver-pr-body-every-forge
    capability: Lean cost-aware pipeline
    acceptance: deliver's live-PR check reads the PR body on GitHub, GitLab and Gitea
      alike, and its refusals name that forge's own CLI
    origin:
    - spec:2026-09-25-lean-cost-aware-process
    levels:
      unit:
      - super-fr:tests/unit/test_pr_body_adapters.py
      - super-fr:tests/unit/test_tripwire_forge_adapter.py
      int:
      - super-fr:tests/unit/test_deliver_pr_body_forges.py
    status: ci
    notes: 'gh#742: the gate called fr.gh directly, so deliver refused forever on GitLab/Gitea.
      Now read through client_for(repo_root).pr_body; the int test drives the real gate
      on a gitlab- and a gitea-declared checkout with only the glab/tea subprocess boundary
      mocked and gh refusing. The tripwire fails CI on a new direct fr.gh import or
      ["gh", ...] argv. Not yet walked against a live GitLab/Gitea instance; the glab/tea
      argv shapes were checked against each CLI''s --help.'
