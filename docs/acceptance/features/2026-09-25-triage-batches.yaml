# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-25-triage-batches
repo: derio-net/super-fr
rows:
  - id: triage-batch-state
    capability: Backlog triage
    acceptance: An operator can group judged issues into a named batch; fr refuses a
      batch naming an unjudged issue or an issue already in another open batch, and
      derives the batch stage from forge facts
    origin:
    - spec:2026-09-25-triage-batches#3a-batch-state-judgementsyaml-schema-2
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_model.py
      - super-fr:tests/unit/test_triage_batch_verbs.py
      - super-fr:tests/unit/test_triage_facts_schema3.py
    status: ci
    notes: 'Test Plan 1-3 in CI (plan phase 2): schema-2 model load rules, open-batch
      rule and every derived batch stage (test_triage_batch_model.py), including a redispatch
      after an abandoned PR, which derives dispatched and then pr-open because only
      a PR opened at or after the last dispatch counts (review r2p-f1: test_a_redispatch_after_an_abandoned_pr_is_dispatched,
      test_a_new_pr_after_the_redispatch_is_pr_open, test_a_merged_no_closes_pr_after_the_redispatch_is_found);
      collect''s head lookup for that redispatch (test_triage_facts_schema3.py::test_a_linked_pr_from_before_the_dispatch_does_not_skip_the_lookup);
      create/edit/suggest and launch resolution (test_triage_batch_verbs.py).'
  - id: triage-batch-dispatch
    capability: Backlog triage
    acceptance: An operator can dispatch a batch as one fr-goal run to any runner that
      takes run-unit work, with an engine-rendered brief that closes every member issue;
      a runner that cannot take run work is refused before anything is written
    origin:
    - spec:2026-09-25-triage-batches#3c-batch-dispatch
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_dispatch.py
      - super-fr:tests/unit/test_import_direction.py
      - super-fr:tests/unit/test_fr_herdr_runner.py
    status: ci
    notes: 'Phase 3: batch dispatch lands with its brief/WorkItem, gates in spec order
      (can_dispatch before preflight), --repair and the second fr_dispatch soft point;
      unit-tested with the runner, adapter and checkout faked. fr-herdr''s run-unit
      contract was covered in phase 2. gh#931/gh#956: the herdr runner retries agent_pane_busy
      (bounded) and returns only once the agent left idle (agent prompt --wait; one
      Enter on agent_prompt_stalled, then a loud failure); live-walked 2026-10-06 on
      herdr 0.9.1, 3 dispatches, one of which hit agent_pane_busy and recovered.'
  - id: triage-batch-forge-visible
    capability: Backlog triage
    acceptance: After a batch is dispatched, every member issue shows as taken on the
      forge, and any machine that triages the repo shows it in-progress, without reading
      local run state
    origin:
    - spec:2026-09-25-triage-batches#3e-forge-visibility
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_dispatch.py
      - super-fr:tests/unit/test_triage_batch_verbs.py
      - super-fr:tests/unit/test_forge_adapter_batch_ops.py
    status: ci
    notes: 'Phase 3: dispatch writes fr:in-progress and one marker comment per member
      only after the runner accepted, idempotently (--repair posts no duplicate; a redispatch
      after cancel posts a new marker); adapter faked. Cancel, the in-progress stage
      and stale dispatch were covered in phase 2. Live walk 2026-09-26 (Test Plan 21,
      phase 4) on derio-net/super-fr: two batches dispatched --to herdr --yes each carried
      fr:in-progress plus exactly one fr-batch marker comment on the member (#603, #618),
      each run opened a draft PR with its Closes line (#651, #652), a second dispatch
      of a live batch was refused, and the board showed both batches dispatched, then
      merged.'
  - id: triage-batch-version-reserve
    capability: Backlog triage
    acceptance: Each dispatched batch bumps to a version reserved in merge order, so
      a later batch never ships a lower version and its version conflict after an earlier
      merge is resolved without the operator
    origin:
    - spec:2026-09-25-triage-batches#3d-version-reservations
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_version.py
      - super-fr:tests/unit/test_triage_batch_merge.py
      int:
      - super-fr:tests/integration/test_triage_batch_merge_git.py
    status: ci
    notes: 'Phase 3: reservation reads the source from origin/<default> by key (proven
      against a real clone), follows every live reservation with the batch''s bump;
      merge reconciles slots in merge order and re-versions with set in the scratch
      worktree (integration test against a local bare origin). After review r3-f2: a
      version-file conflict is taken from main only when the PR''s own change to that
      file is the version alone (a lockfile only with a declared relock); a PR that
      also added a dependency to pyproject.toml stops the queue naming the file, the
      dependency intact, and an up-to-date PR off its slot is re-slotted against real
      git.'
  - id: triage-batch-merge-queue
    capability: Backlog triage
    acceptance: An operator can merge several batch PRs in a computed order that predicts
      shared-file conflicts up front; the queue stops on a real conflict naming the
      files, and a re-run resumes at the first unmerged PR
    origin:
    - spec:2026-09-25-triage-batches#3f-batch-merge
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_merge.py
      - super-fr:tests/unit/test_triage_batch_board.py
      int:
      - super-fr:tests/integration/test_triage_batch_merge_git.py
    status: ci
    notes: 'Phase 3: merge order, printed plan, reconcile, refusals (draft, failing
      check, moved head, protection refusal verbatim, unsupported backend) unit-tested
      with the forge faked; execution against real git with a local bare origin, including
      resume. Live walk 2026-09-26 (Test Plan 21, phase 4) on derio-net/super-fr: the
      printed plan predicted the shared docs/acceptance files; the queue stopped on
      a real matrix.yaml conflict naming the file and pushing nothing; after a manual
      matrix union a re-run merged #652 at its reserved 4.23.2 and stopped on #651''s
      matrix plus reports; after that union a re-run resumed at #651 and re-slotted
      it from 4.23.1 to 4.23.3 (a third version, #635, had taken 4.23.1 on main mid-flight),
      pushed, waited for checks and merged. The verb resolved no conflict in the four
      generated acceptance files: every super-fr batch pair conflicts there (structural
      fix in flight on feat/version-bump-churn).'
