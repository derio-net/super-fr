# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-26-ci-time-budget
repo: derio-net/super-fr
rows:
  - id: ci-under-time-budget
    capability: CI
    acceptance: A CI run of ci.yml completes in under 4 minutes of wall clock (excluding
      queue), with coverage still gated at 75% across the whole suite
    origin:
    - spec:2026-09-26-ci-time-budget
    levels:
      unit:
      - super-fr:tests/unit/test_ci_shards.py
    status: walk-owed
    notes: tracked by derio-net/super-fr#1340
    issues:
    - derio-net/super-fr#1340
  - id: ci-budget-ticket-dedup
    capability: CI
    acceptance: A CI file that runs over its budget gets exactly one open ci-budget
      issue; later breaches update it without duplicates, and 3 consecutive green runs
      close it
    origin:
    - spec:2026-09-26-ci-time-budget
    levels:
      unit:
      - super-fr:tests/unit/test_ci_budget.py
    status: ci
    notes: 'Unit-tested against captured gh api fixtures + a fake gh adapter: create-then-update
      dedup, streak/close, regression link, per-file overrides, exclude — see the state-machine
      and dedup tests in test_ci_budget.py'
  - id: ci-budget-watch-list-complete
    capability: CI
    acceptance: Adding a workflow file that the budget watcher neither watches nor explicitly
      excludes fails CI
    origin:
    - spec:2026-09-26-ci-time-budget
    levels:
      unit:
      - super-fr:tests/unit/test_ci_budget.py
    status: ci
    notes: check_watch_list's tripwire tests (real repo passes; negative cases on a
      tmp dir for an unlisted workflow and a stale config key) exercise the exact check
      CI runs on every push via test_ci_budget.py
