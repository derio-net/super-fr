# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-26-container-git-ownership
repo: derio-net/super-fr
rows:
  - id: container-record-commits
    capability: isolation-git-ownership
    acceptance: An fr record commit succeeds inside a devcontainer whose bind-mounted
      worktree git considers foreign-owned
    origin:
    - spec:2026-09-26-container-git-ownership
    levels:
      unit:
      - super-fr:tests/unit/test_container_git_ownership.py
    status: ci
    notes: 'safe.directory override on git_answer, update-index restore and record/apply
      git calls; proven in a foreign-owned linked worktree from root and subdirectory
      super-fr#700: _run_git (repo_root/add/commit/status) shares the git_argv seam,
      proven in the same foreign-owned worktree; the walk-up honours GIT_CEILING_DIRECTORIES
      so fr never trusts a repository git would not open.'
  - id: scaffold-trusts-workspace
    capability: isolation-git-ownership
    acceptance: A scaffolded devcontainer profile trusts its own workspace path for
      git so a fresh container needs no manual safe.directory
    origin:
    - spec:2026-09-26-container-git-ownership
    levels:
      unit:
      - super-fr:tests/unit/test_container_git_ownership.py
    status: ci
    notes: POST_CREATE adds git config --global --add safe.directory "$PWD" || true;
      committed profiles regenerated
