# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-26-dynamic-brainstorm-question-rounds
repo: derio-net/super-fr
rows:
  - id: fr-goal-question-batch-sized-to-feature
    capability: fr-goal-methodology
    acceptance: fr-goal's brainstorm asks one question per operator-owned decision with
      no fixed cap of 4; a round larger than the harness question tool's limit spans
      consecutive calls and still clears the gate as one round.
    origin:
    - spec:2026-09-26-dynamic-brainstorm-question-rounds
    levels:
      unit:
      - super-fr:tests/unit/test_run_telemetry.py
      - super-fr:tests/unit/test_tripwire_fr_goal_question_rounds.py
    status: ci
    notes: Phase 3 landed the sizing prose (spec §3.A/§3.A.1). test_run_telemetry.py
      pins that a round spanning consecutive question calls counts as one round. The
      tripwire pins, on normalised text, the old fixed-batch phrases (max 4, ONE batch,
      batched Q&A and the rest) absent from every §3.A.1 surface plus both explainer
      pages, the OpenCode /fr-goal command and the README; the sizing markers (one question
      per decision, ~10) are asserted only on the canonical fr-goal skill and its two
      mirrors — the other surfaces are only required to describe a question round.
  - id: fr-goal-second-round-announced-and-verified
    capability: fr-goal-methodology
    acceptance: 'A brainstorm may take a second question round only when the record
      declares rounds: 2 with a trigger (design-risk announced in round 1 as `a 2nd
      round may follow`, or operator-request); fr run resolve refuses a round count
      that differs from the declaration, a design-risk round 2 that round 1 never announced,
      and any third round.'
    origin:
    - spec:2026-09-26-dynamic-brainstorm-question-rounds
    levels:
      unit:
      - super-fr:tests/unit/test_run_question_rounds.py
    status: ci
    notes: 'Phase 2 of 2026-09-26-dynamic-brainstorm-question-rounds: fr run resolve
      checks the declared question rounds against the transcript''s answered rounds
      (spec §3.C verdict table), through both the --record path and the --question-rounds
      flags; every refusal (count mismatch, unannounced design-risk round 2, a third
      round) is tested byte-identical in CI. gh#766 moved the announcement from the
      label ''Round 1 of 2'' (a forecast printed as a count) to the phrase ''a 2nd round
      may follow''; the old token is still accepted for sessions begun under the old
      prose, and the verdict table pins both plus a split round''s per-dialog labels.'
  - id: fr-goal-contract-prose-two-rounds
    capability: fr-goal-methodology
    acceptance: Every surface stating fr-goal's operator contract (skill, mirrors, explainer,
      README) describes one gate with sized, at-most-two announced rounds; none still
      promises a four-question single batch.
    origin:
    - spec:2026-09-26-dynamic-brainstorm-question-rounds
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_fr_goal_question_rounds.py
    status: ci
    notes: 'Phase 3 rewrote the §3.A.1 surfaces (fr-goal + fr-brainstorming SKILL.md,
      both mirrors, the explainer .md and rendered .html, the explainers index page,
      README, OpenCode /fr-goal command) to the sized, at-most-two-round contract. The
      tripwire (normalised, casefolded text) asserts the old fixed-batch phrase list
      is absent from all of them; on the canonical fr-goal skill and both mirrors it
      asserts the behavioural markers (questions: {rounds, the (Round 1 · questions
      / (Round 2 · questions labels and the a 2nd round may follow forecast (gh#766),
      design-risk, operator-request, never a round 3, tool-call round separation, announced
      round 2 as a ceiling, gate-question-rounds journal entry), each dialog of a split
      round naming its part, no (Round N of total label, and that no prose-only cross-examination
      instruction remains; on fr-brainstorming, the explainer .md, README and index.html
      it asserts only that a question round is described.'
