# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-26-plan-table-header
repo: derio-net/super-fr
rows:
  - id: plan-create-creates-missing-table
    capability: Plan scaffolding
    acceptance: fr plan create against a spec with no Implementation Plans section appends
      the canonical section and the plan's row instead of refusing.
    origin:
    - spec:2026-09-26-plan-table-header
    levels:
      unit:
      - super-fr:tests/unit/test_v2_plan_ops.py#test_create_appends_missing_section_with_header_and_row
      - super-fr:tests/unit/test_v2_plan_ops.py#test_create_rerun_adds_missing_section_once
      - super-fr:tests/unit/test_v2_plan_ops.py#test_validate_spec_section_is_read_only_on_missing_section
    status: ci
    notes: 'gh#603; pinned by the three tests cited, by name. gh#663: test_v2_migrate
      is no longer cited — this PR changed nothing there, so it was regression coverage,
      not evidence for this row.'
  - id: plan-create-table-errors-name-header
    capability: Plan scaffolding
    acceptance: Every Implementation Plans table error from fr plan create names the
      canonical '| Plan | Repo | File | Depends on |' header, so the first failure carries
      its own fix.
    origin:
    - spec:2026-09-26-plan-table-header
    levels:
      unit:
      - super-fr:tests/unit/test_v2_plan_ops.py
    status: ci
    notes: gh#603; pinned by test_create_rejects_spec_with_mislabeled_table_header,
      test_create_no_table_error_names_the_header_and_creates_nothing, test_append_spec_row_no_table_error_names_the_header,
      test_append_spec_row_missing_section_error_names_the_header.
  - id: plan-rework-missing-table-stays-strict
    capability: Plan scaffolding
    acceptance: fr plan rework on a spec with no Implementation Plans section still
      refuses, naming the canonical header; only create auto-creates the section.
    origin:
    - spec:2026-09-26-plan-table-header
    levels:
      unit:
      - super-fr:tests/unit/test_v2_plan_ops.py
    status: ci
    notes: gh#603; pinned by test_rework_on_sectionless_spec_names_the_header.
