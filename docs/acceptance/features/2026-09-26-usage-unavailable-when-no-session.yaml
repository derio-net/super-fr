# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-26-usage-unavailable-when-no-session
repo: derio-net/super-fr
rows:
  - id: usage-no-session-is-unavailable-not-free
    capability: usage capture honesty
    acceptance: A run whose capture found no session is reported as unavailable with
      a reason, never as an empty or free run
    origin:
    - spec:2026-09-26-usage-unavailable-when-no-session
    levels:
      unit:
      - super-fr:tests/unit/test_usage_capture.py
    status: ci
    notes: 'Capture writes a no-session-found placeholder (unit-proven). Live-verified
      2026-09-27 on OpenCode 1.18.32 in a scratch run: fr run resolve --step deliver,
      run by OpenCode with harness detected from its own env (no FR_HARNESS), wrote
      session '''' / unavailable: no session found in the cursor commit; fr run cost
      showed 0 read, 1 unavailable. Replacing the placeholder with real sessions stays
      owed until #537.'
