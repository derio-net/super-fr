# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-26-verify-merge-rewrites
repo: derio-net/super-fr
rows:
  - id: verify-merge-survives-later-rewrites
    capability: isolation verify-merge
    acceptance: verify-merge accepts a merged branch whose added lines a later merge
      rewrote (its exact file content was on the base after the merge) and checks the
      fetched remote branch as well as the local one; unlanded content still refuses
    origin:
    - spec:2026-09-26-verify-merge-rewrites
    levels:
      unit:
      - super-fr:tests/unit/test_isolation.py
    status: ci
    notes: 'Review fixes (super-fr#665 review): C1 perf (constant-cost archived-path
      blob scan), C2 correctness (verify_merge fetches the branch with an explicit refspec
      and requires branch_fetched), and S1-S5 spec/test corrections — also covers the
      run+usage archived kinds, a §C-only archive test, a usage re-capture test, and
      gc''s _merged_by_content not classifying unlanded content as merged. super-fr#716:
      a merge later REVERTED no longer reads as landed — the blob fallback reads the
      path history oldest-first and a return to a pre-landing blob un-lands it (squash,
      rebase, synced-branch, revert-then-edit and revert-of-revert pinned). super-fr#741:
      a --no-ff merge-commit landing reverted with revert -m 1 reads missing (fork point
      = merge-base with the landing merge''s first parent). super-fr#739: a three-way
      revert reads missing (the same log call reads each commit''s patch; the branch''s
      patch inverted un-lands). Known limit: a revert of a branch that only ADDED files
      stays indistinguishable from a later deletion or a consumed fragment. Still unit-only
      in tests/unit/test_isolation.py. super-fr#757: a fast-forward landing later reverted
      reads missing when fr recorded the branch''s start at up (IsolationState.base_sha
      passed by verify-merge, gc and archive); with no surviving record it is indistinguishable,
      as before. super-fr#715: a squash whose blob combined a concurrent base edit,
      then rewritten, reads landed (the landing is recognised by its patch adding every
      line the branch added).'
