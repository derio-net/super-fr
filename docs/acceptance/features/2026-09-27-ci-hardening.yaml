# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-27-ci-hardening
repo: derio-net/super-fr
rows:
  - id: ci-actions-sha-pinned
    capability: CI
    acceptance: A workflow that references a remote GitHub Action by anything but a
      full commit SHA with a version comment fails CI
    origin:
    - spec:2026-09-27-ci-hardening
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_actions_pinned.py
    status: ci
    notes: 'Tripwire test_tripwire_actions_pinned.py passes over the real repo''s workflows;
      every remote uses: is SHA-pinned with a version comment (spec 2026-09-27-ci-hardening
      §3.A/§3.C).'
  - id: ci-actions-dependabot-updates
    capability: CI
    acceptance: Dependabot proposes updates to the SHA-pinned actions weekly, as one
      grouped PR
    origin:
    - spec:2026-09-27-ci-hardening
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_actions_pinned.py
    status: walk-owed
    notes: tracked by derio-net/super-fr#1339
    issues:
    - derio-net/super-fr#1339
  - id: ci-ok-single-required-check
    capability: CI
    acceptance: One stable ci-ok check fails whenever any ci.yml job fails or is cancelled,
      so a required-check rule can name exactly one context
    origin:
    - spec:2026-09-27-ci-hardening
    levels:
      unit:
      - super-fr:tests/unit/test_ci_shards.py
    status: ci
    notes: 'test_ci_shards.py pins ci-ok''s shape (if: always(), needs == every other
      job id, env-only RESULTS, exits nonzero on failure/cancelled) and behaviorally
      executes the run: script; the live single-context observation is this PR''s own
      CI run (spec 2026-09-27-ci-hardening §3.D).'
