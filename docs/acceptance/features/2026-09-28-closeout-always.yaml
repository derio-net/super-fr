# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-28-closeout-always
repo: derio-net/super-fr
rows:
  - id: closeout-branch-brief
    capability: Branch-keyed close-out
    acceptance: Any fr flow's merged branch gets a self-contained close-out brief from
      `fr pickup --branch <b>`, and `fr pickup --run` delegates to the same builder,
      adding only run extras.
    origin:
    - spec:2026-09-28-closeout-always#R1
    - spec:2026-09-28-closeout-always#R2
    levels:
      unit:
      - super-fr:tests/unit/test_pickup_branch.py
      - super-fr:tests/unit/test_run_closeout.py
      - super-fr:tests/unit/test_closeout_run_clean.py
    status: ci
    notes: 'fr pickup --branch and fr pickup --run''s delegation to branch_closeout_brief
      are covered by unit tests; gh#825: both modes end by downing the housekeeping
      workspace (test_closeout_run_clean.py).'
  - id: archive-branch-every-artifact
    capability: Branch-keyed close-out
    acceptance: '`fr archive --branch <b>` archives every live artifact the merged branch
      added or modified (debug journals included) through each kind''s gate, reports
      what it holds, and refuses a branch whose changes are not on the default ref.'
    origin:
    - spec:2026-09-28-closeout-always#R3
    - spec:2026-09-28-closeout-always#R4
    levels:
      unit:
      - super-fr:tests/unit/test_archive_branch.py
      - super-fr:tests/unit/test_closeout_branch_artifacts.py
    status: ci
    notes: fr archive --branch's per-kind gates and artifact coverage are covered by
      unit tests
  - id: status-reports-owed-artifacts
    capability: Branch-keyed close-out
    acceptance: '`fr status` lists every live artifact whose PR has merged (debug journals
      on the default ref, archivable plans, fully implemented specs, orphan journals)
      with the command that clears it, without failing.'
    origin:
    - spec:2026-09-28-closeout-always#R5
    levels:
      unit:
      - super-fr:tests/unit/test_status_owed.py
      - super-fr:tests/unit/test_closeout_owed.py
    status: ci
    notes: fr status's owed_artifacts block is covered by unit tests
  - id: fr-debugging-relays-closeout
    capability: Branch-keyed close-out
    acceptance: fr-debugging's deliver relays the `fr pickup --branch <b>` close-out
      line on every harness mirror.
    origin:
    - spec:2026-09-28-closeout-always#R6
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_closeout_relay.py
    status: ci
    notes: fr-debugging's deliver-line relay to every harness mirror is covered by the
      relay tripwire
  - id: debug-journal-sweep-keeps-refs
    capability: Branch-keyed close-out
    acceptance: '`fr archive --all` moves every debug journal live on the default ref,
      and evidence refs to a moved journal still resolve in `fr acceptance check`.'
    origin:
    - spec:2026-09-28-closeout-always#R7
    levels:
      unit:
      - super-fr:tests/unit/test_archive_all_debug.py
      - super-fr:tests/unit/test_acceptance_archive_twin.py
    status: ci
    notes: fr archive --all's debug-journal sweep and archive_twin ref resolution are
      covered by unit tests
  - id: closeout-branch-live-run
    capability: Branch-keyed close-out
    acceptance: This feature's own post-merge close-out, run from its relayed line in
      a new session, archives the branch's spec, plan, run, usage and journals with
      nothing held.
    origin:
    - spec:2026-09-28-closeout-always#R1
    - spec:2026-09-28-closeout-always#R3
    levels: {}
    status: walked
    notes: 'walk backfilled from the evidence this row''s notes cite (p1-r2): proven
      live 2026-09-29 in a fresh session; manual, not in CI.'
    verify: live
    walks:
    - strategy: live
      harness: unrecorded
      model: unrecorded
      outcome: pass
      at: '2026-09-29T00:00:00Z'
      evidence: 'fresh session from the base clone: fr pickup --run 2026-09-28-feat-batch-closeout-always-2
        named fr archive --branch, which archived everything with no held line'
  - id: every-pr-flow-relays-closeout
    capability: Branch-keyed close-out
    acceptance: Every shipped skill that ends its flow at a PR it opens relays a close-out
      line (fr-goal's run line; fr-debugging and standalone fr-execute `fr pickup --branch
      <b>`), and fr-isolation's post-merge cleanup points at the same brief.
    origin:
    - spec:2026-09-28-closeout-always#R8
    levels:
      unit:
      - super-fr:tests/unit/test_tripwire_closeout_relay.py
    status: ci
    notes: Every PR-opening flow's close-out relay (fr-goal, fr-debugging, standalone
      fr-execute, fr-isolation) is covered by the relay tripwire
