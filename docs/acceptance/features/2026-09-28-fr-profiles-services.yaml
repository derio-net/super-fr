# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-09-28-fr-profiles-services
repo: derio-net/super-fr
rows:
  - id: profiles-services-schema
    capability: fr-profiles services
    acceptance: fr-profiles declares forge, ci and tracking as nested {type, host} services;
      jenkins, jira and a cross-forge tracker are refused naming the follow-up issue
    origin:
    - spec:2026-09-28-fr-profiles-services#R1
    levels:
      unit:
      - super-fr:tests/unit/test_services_model.py
      - super-fr:tests/unit/test_validate_profiles.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
  - id: profiles-services-defaults
    capability: fr-profiles services
    acceptance: An undeclared ci or tracking resolves to the forge's own, hosts default
      to the forge host for native types, and every forge consumer keeps today's behaviour
    origin:
    - spec:2026-09-28-fr-profiles-services#R2
    levels:
      unit:
      - super-fr:tests/unit/test_services_resolve.py
      - super-fr:tests/unit/test__hosts.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
  - id: profiles-services-migration
    capability: fr-profiles services
    acceptance: A flat backend/host fr-profiles.yaml is migrated to the nested services
      shape at the first fr command (ci detected offline), and an invalid services block
      fails fr validate artifacts
    origin:
    - spec:2026-09-28-fr-profiles-services#R3
    levels:
      unit:
      - super-fr:tests/unit/test_migration_profiles_services.py
      - super-fr:tests/unit/test_validate_profiles.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
  - id: profiles-services-ci-drives-acceptance
    capability: fr-profiles services
    acceptance: 'acceptance init and the ci status follow the declared ci service: none
      scaffolds no pipeline and refuses ci; a pipeline type scaffolds its template'
    origin:
    - spec:2026-09-28-fr-profiles-services#R4
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_services.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
  - id: profiles-services-no-ci-delivery
    capability: fr-profiles services
    acceptance: 'Under ci: none, fr-goal''s Ready checklist and fr-acceptance name the
      local suite as the gate'
    origin:
    - spec:2026-09-28-fr-profiles-services#R5
    levels:
      unit:
      - super-fr:tests/unit/test_skill_services_prose.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
    verify: live
  - id: profiles-services-no-tracker
    capability: fr-profiles services
    acceptance: 'Under tracking: none, no issue path fires: closeout prints no filing
      lines, apply --yes and triage batch dispatch refuse, the pipeline omits the debt
      issue, findings stay out-of-scope'
    origin:
    - spec:2026-09-28-fr-profiles-services#R6
    levels:
      unit:
      - super-fr:tests/unit/test_tracking_none.py
      - super-fr:tests/unit/test_skill_services_prose.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
  - id: profiles-services-cli
    capability: fr-profiles services
    acceptance: fr services prints each resolved service's type, host and source, plain
      and --json, without touching any artifact
    origin:
    - spec:2026-09-28-fr-profiles-services#R7
    levels:
      unit:
      - super-fr:tests/unit/test_services_cli.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
  - id: profiles-services-init-detect
    capability: fr-profiles services
    acceptance: fr init scaffold writes the nested services, detecting ci and tracking
      and refusing with the flag to pass when detection is inconclusive
    origin:
    - spec:2026-09-28-fr-profiles-services#R8
    levels:
      unit:
      - super-fr:tests/unit/test_init_scaffold.py
      - super-fr:tests/unit/test_issues_enabled.py
    status: ci
    notes: Implemented by plan 2026-09-28-fr-profiles-services (#774 step 1); unit tests
      run in CI.
