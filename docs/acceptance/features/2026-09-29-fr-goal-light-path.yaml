# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-09-29-fr-goal-light-path
repo: derio-net/super-fr
rows:
  - id: light-path-shape
    capability: fr-goal-cost
    acceptance: A run reaches the fr-goal-light shape by `fr run start fr-goal-light`
      or a brainstorm-record rebind (first step only, same first step), and the light
      plan step refuses a plan with more than one agentic phase
    origin:
    - spec:2026-09-29-fr-goal-light-path#R1
    - spec:2026-09-29-fr-goal-light-path#R2
    levels:
      unit:
      - super-fr:tests/unit/test_run_light_shape.py
      - super-fr:tests/unit/test_migration_record_shape.py
    status: ci
    notes: 'Phase 3 (spec §A, R1/R2): fr-goal-light shape, brainstorm-record rebind
      (first step only, same first step, valid shape, done only), single-phase derived
      gate, record kind v5.'
  - id: light-path-one-review
    capability: fr-goal-cost
    acceptance: On the light shape one dispatched fr-spec-reviewer reviews spec and
      plan together under the full spec-review evidence gate, and the per-phase code
      review still runs
    origin:
    - spec:2026-09-29-fr-goal-light-path#R3
    levels:
      unit:
      - super-fr:tests/unit/test_run_light_shape.py
    status: ci
    notes: 'Phase 3 (spec §A, R3): spec-plan-review carries the full spec-review evidence
      gate; plan-review and review-phase stay.'
  - id: deliver-suite-reuse
    capability: fr-goal-cost
    acceptance: deliver accepts `tests=reuse` only while HEAD's code tree equals the
      tree of the latest phase unit whose holder-written, fresh suite log fr verified;
      otherwise it demands a fresh run
    origin:
    - spec:2026-09-29-fr-goal-light-path#R6
    levels:
      unit:
      - super-fr:tests/unit/test_run_suite_reuse.py
    status: ci
    notes: 'Phase 2 (spec §D, R6): offered tests evidence on phase units (holder-written,
      committed-clean, fresh incl. deletions/renames), done-only tree witness, deliver
      tests: reuse on an unchanged code tree, unobserved propagated.'
  - id: light-path-benchmark
    capability: fr-goal-cost
    acceptance: On the super-fr-3 feature-C benchmark the light path costs at most 2x
      plain's money and 2.5x its time with verified delivery
    origin:
    - spec:2026-09-29-fr-goal-light-path#R8
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1355
    verify: live
    issues:
    - derio-net/super-fr#1355
  - id: light-path-structured-returns
    capability: fr-goal-methodology
    acceptance: fr-goal documents the light path and one-call resolve; the executor
      returns a fixed shape carrying its suite log, the spec reviewer covers spec and
      plan, and the orchestrator is told never to open subagent transcripts
    origin:
    - spec:2026-09-29-fr-goal-light-path#R7
    levels:
      unit:
      - super-fr:tests/unit/test_skill_light_path.py
    status: ci
    notes: 'Phase 3 (spec §C, R7): Light path section, one-call resolve wording, executor
      tests_log return, reviewer target spec|plan pinned.'
  - id: run-resolve-advances
    capability: Run
    acceptance: '`fr run resolve --record` applies the record and advances in the same
      call (running following cli steps, printing the next brief); `fr run advance`
      chains consecutive cli steps; `--no-advance` keeps the old behaviour'
    origin:
    - spec:2026-09-29-fr-goal-light-path#R4
    - spec:2026-09-29-fr-goal-light-path#R5
    levels:
      unit:
      - super-fr:tests/unit/test_run_one_call.py
    status: ci
    notes: 'Phase 1 (spec §B, R4/R5): advance chains cli steps; resolve --record advances
      after a done record, --no-advance opts out, failed/blocked stop; edge cases (refusal
      after apply, deliver closeout once, inline group completion, --redispatch) pinned.'
