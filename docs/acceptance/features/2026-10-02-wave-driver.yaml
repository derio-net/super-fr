# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-10-02-wave-driver
repo: derio-net/super-fr
rows:
  - id: batch-waves-and-deps
    capability: triage-batch-drive
    acceptance: An operator can give a triage batch a wave and prerequisite batches,
      and invalid prerequisites (unknown, self, cycle) are refused before anything is
      written
    origin:
    - spec:2026-10-02-wave-driver#R1
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_waves.py
    status: ci
    notes: wave and after round-trip through judgements schema 3; unknown, self and
      cycle refused with the file unchanged; list shows wave, dependencies and close-out
  - id: batch-drive-pass
    capability: triage-batch-drive
    acceptance: fr triage batch drive keeps at most N batches dispatched and unmerged,
      dispatches in wave order, skips a batch whose prerequisites are unmerged, resumes
      after a stop without repeating work, and signals done, waiting or refused through
      its exit code
    origin:
    - spec:2026-10-02-wave-driver#R2
    - spec:2026-10-02-wave-driver#R3
    - spec:2026-10-02-wave-driver#R6
    - spec:2026-10-02-wave-driver#R7
    - spec:2026-10-02-wave-driver#R13
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive.py
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py
      - super-fr:tests/unit/test_triage_batch_drive_disruption.py
    status: ci
    notes: 'Pure pass (cap, wave/merge/id order, unmet and unsatisfiable dependencies,
      a merge freeing a slot) and the command (plan without --yes, one line per action,
      exit codes 0/3/2/1, drive.lock, kill-safety) are unit-tested with a fake runner
      and forge client. Disruption (gh#921, gh#998): a failed fetch, archive merge,
      update push or broken main config skips the pass or that PR in loop mode; a repo
      collect skipped sits the pass out; an unknown config key is ignored; a post_merge-installed
      fr restarts the driver.'
  - id: batch-drive-operator-boundary
    capability: triage-batch-drive
    acceptance: The driver merges a batch PR only when it is not a draft and every check
      is green, and never readies, approves or un-drafts a PR
    origin:
    - spec:2026-10-02-wave-driver#R4
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive.py
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py
    status: ci
    notes: Draft, pending, failing and moved-head PRs are never merged; required checks
      else all checks, ci none on non-draft alone; failing CI warned once per head;
      the fake forge client exposes no ready/approve call and none is made.
  - id: batch-closeout-after-merge
    capability: triage-batch-drive
    acceptance: After a batch merges, the driver runs the repo's post_merge command,
      starts the close-out session through the batch's runner, and merges the archive
      PR when it is ready and green
    origin:
    - spec:2026-10-02-wave-driver#R5
    - spec:2026-10-02-wave-driver#R14
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py
      - super-fr:tests/unit/test_fr_herdr_closeout.py
      - super-fr:tests/unit/test_triage_gitseam.py
      - super-fr:tests/unit/test_triage_batch_drive_disruption.py
    status: ci
    notes: 'post_merge runs once after the release commit (or the ten-minute fallback)
      and before the close-out, a failure holds it; the close-out goes through the runner
      as a run item with payload.kind closeout and --run/--branch; an attributed archive
      PR is merged; herdr characterised unchanged. gh#883: the close-out is recorded
      before its session starts, so a restart after the session ended starts no second
      one; a runner failure takes the record back. gh#931: a failed runner dispatch
      (close-out or batch) no longer ends loop mode: it is reported once per batch and
      cause (the runner error''s code when it has one) and retried on a later pass;
      --once still exits 1.'
  - id: wave-driven-live
    capability: triage-batch-drive
    acceptance: A real wave of two batches runs from dispatch to a merged archive PR
      with no hand step but the operator readying the PRs
    origin:
    - spec:2026-10-02-wave-driver#R3
    - spec:2026-10-02-wave-driver#R4
    - spec:2026-10-02-wave-driver#R5
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1367
    verify: live
    issues:
    - derio-net/super-fr#1367
  - id: triage-scope-groups
    capability: triage-scope
    acceptance: fr triage collects, ranks, renders and drives a comma-separated group
      of repos, owners allowed to differ, as one board
    origin:
    - spec:2026-10-02-wave-driver#R15
    levels:
      unit:
      - super-fr:tests/unit/test_triage_scope_groups.py#test_drive_plans_both_repos_of_a_group_against_one_shared_cap
    status: ci
    notes: 'R15 shipped: --repo A/B,C/D is one group scope (facts schema 4, shared cap,
      per-repo checkouts); covered by the group scope tests'
  - id: board-decision-views
    capability: triage-views
    acceptance: The triage board opens with what changed since the last report, what
      needs the operator now, and what would start next, shows waves as tabs with the
      latest preselected, and keeps every section it showed before
    origin:
    - spec:2026-10-02-wave-driver#R9
    - spec:2026-10-02-wave-driver#R16
    - spec:2026-10-02-wave-driver#R17
    - spec:2026-10-02-wave-driver#R18
    - spec:2026-10-02-wave-driver#R19
    - spec:2026-10-02-wave-driver#R20
    levels:
      unit:
      - super-fr:tests/unit/test_triage_board_views.py#test_needs_you_now_lists_each_kind_and_the_unplaced_issues
      - super-fr:tests/unit/test_triage_kind_features_snapshot.py#test_the_diff_lists_exactly_what_changed
      - super-fr:tests/unit/test_triage_board_views.py#test_the_board_is_ordered_since_needs_next_waves_then_the_folds
    status: ci
    notes: 'Re-pointed the renamed ordering test (board order moved in phase 2: since,
      needs, next, waves, then folds).'
  - id: defect-origins-page
    capability: triage-views
    acceptance: A defect-origins page is generated from classified issues, with counts
      by category and source, filings per day and time to fix
    origin:
    - spec:2026-10-02-wave-driver#R10
    - spec:2026-10-02-wave-driver#R12
    levels:
      unit:
      - super-fr:tests/unit/test_triage_origins.py#test_render_ends_in_a_conclusion_linking_each_cause_to_its_batch
      - super-fr:tests/unit/test_triage_origins.py#test_render_median_hours_to_fix_counts_completed_closes_only
    status: ci
    notes: 'fr triage origins collect|check|render ship: fifteen-issue fixture, counts,
      per-day buckets, median time to fix and leaderboards match a hand computation;
      the page ends in a conclusion linking each cause to its batch'
  - id: architecture-page
    capability: triage-views
    acceptance: The architecture page's measured sections are generated from the triage
      state and the repo, and authored fragments are spliced in in manifest order
    origin:
    - spec:2026-10-02-wave-driver#R11
    - spec:2026-10-02-wave-driver#R12
    levels:
      unit:
      - super-fr:tests/unit/test_triage_architecture.py#test_line_counts_per_subsystem_at_then_and_now_name_their_commits
    status: ci
    notes: 'fr triage architecture render now builds the page: measured sections from
      git ls-tree/show at two refs, authored fragments in manifest order, snapshot timeline,
      wave tabs; covered by unit tests over a real two-ref fixture repo'
