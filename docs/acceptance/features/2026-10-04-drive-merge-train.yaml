# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-10-04-drive-merge-train
repo: derio-net/super-fr
rows:
  - id: drive-merge-train-head-only
    capability: triage-batch-drive
    acceptance: The drive acts only on the head of each repo's merge train — PRs behind
      it are neither updated nor merged — and advances past a merged head in the same
      pass
    origin:
    - spec:2026-10-04-drive-merge-train#R1
    - spec:2026-10-04-drive-merge-train#R2
    - spec:2026-10-04-drive-merge-train#R3
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive.py#test_ready_green_prs_form_one_train_in_order
      - super-fr:tests/unit/test_triage_batch_drive.py#test_a_pending_head_waits_and_the_rest_are_queued
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_an_updated_head_queues_the_rest_without_attempting_them
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_a_merged_head_lets_the_next_candidate_go_in_the_same_pass
    status: ci
    notes: Pure train walk and executor stop covered by unit tests
  - id: drive-merge-train-step-over
    capability: triage-batch-drive
    acceptance: A PR with failing CI or a refused merge is reported once and stepped
      over, and rejoins the train at its merge-order place once green
    origin:
    - spec:2026-10-04-drive-merge-train#R4
    - spec:2026-10-04-drive-merge-train#R5
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive.py#test_a_failing_head_is_stepped_over_and_the_next_leads
      - super-fr:tests/unit/test_triage_batch_drive.py#test_a_green_member_ahead_is_the_head_with_no_stored_state
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_a_refused_head_is_reported_and_stepped_over
      - super-fr:tests/unit/test_triage_batch_drive.py#test_a_failing_member_behind_the_stop_is_warned_and_stepped_over
    status: ci
    notes: 'Review fix: a failing PR behind the stop is warned and stepped over at once
      (test_a_failing_member_behind_the_stop_is_warned_and_stepped_over).'
  - id: drive-merge-train-output
    capability: triage-batch-drive
    acceptance: Every drive pass prints one train line per repo (head, queued, stepped
      over) and the summary counts queued PRs
    origin:
    - spec:2026-10-04-drive-merge-train#R6
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive.py#test_train_line_names_head_then_queued_and_stepped
      - super-fr:tests/unit/test_triage_batch_drive.py#test_summary_line_adds_queued_between_closing_and_blocked
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_the_train_line_comes_before_the_actions_in_plan_mode_and_with_yes
    status: ci
    notes: Train line and queued count printed in plan mode and with --yes
  - id: drive-merge-train-live-wave
    capability: triage-batch-drive
    acceptance: In a live wave of several ready PRs in one repo, each PR is updated
      at most once per PR merged ahead of it
    origin:
    - spec:2026-10-04-drive-merge-train#R2
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1345
    verify: live
    issues:
    - derio-net/super-fr#1345
