# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-04-drive-scoped-collect
repo: derio-net/super-fr
rows:
  - id: drive-collect-carries-closed
    capability: Backlog triage
    acceptance: A drive pass never views a judged issue the previous facts already show
      closed; it carries it with fresh PR links, an issue open again reads open, and
      a fully closed merged batch stays merged.
    origin:
    - spec:2026-10-04-drive-scoped-collect#R1
    - spec:2026-10-04-drive-scoped-collect#R3
    - spec:2026-10-04-drive-scoped-collect#R7
    levels:
      unit:
      - super-fr:tests/unit/test_triage_collect_carry.py#test_a_carried_closed_key_is_not_viewed
      - super-fr:tests/unit/test_triage_collect_carry.py#test_a_carried_key_that_reads_open_is_the_open_one_and_not_counted
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_a_merged_batch_stays_merged_after_its_members_are_carried
    status: ci
    notes: carried closed issues are not viewed; PR links recomputed; reopened reads
      open; merged batch stays merged
  - id: drive-collect-views-what-changed
    capability: Backlog triage
    acceptance: A drive pass views every judged issue that just left the open list,
      was unviewed or never seen, and collects fully when no same-scope previous facts
      are readable.
    origin:
    - spec:2026-10-04-drive-scoped-collect#R2
    - spec:2026-10-04-drive-scoped-collect#R4
    levels:
      unit:
      - super-fr:tests/unit/test_triage_collect_carry.py#test_an_unseen_key_and_a_carried_open_issue_are_viewed
      - super-fr:tests/unit/test_triage_collect_carry.py#test_collect_into_with_carry_views_when_the_previous_facts_are_no_use
    status: ci
    notes: unseen and carried-open keys are viewed; unusable previous facts collect
      fully
  - id: collect-stays-full
    capability: Backlog triage
    acceptance: fr triage collect never carries facts over; it views every judged issue
      that is not open.
    origin:
    - spec:2026-10-04-drive-scoped-collect#R5
    levels:
      unit:
      - super-fr:tests/unit/test_triage_collect_carry.py#test_the_collect_command_views_on_a_second_run_too
    status: ci
    notes: fr triage collect never carries
  - id: drive-collect-cost-line
    capability: Backlog triage
    acceptance: Each drive pass prints one line naming the issues its collect viewed
      and carried over.
    origin:
    - spec:2026-10-04-drive-scoped-collect#R6
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_recollect_carries_a_known_closed_issue_over
    status: ci
    notes: recollect prints the collect cost line
  - id: drive-pass-fast-on-settled-backlog
    capability: Backlog triage
    acceptance: On a repo with a large settled judged backlog, a drive pass after a
      full collect takes seconds, not minutes, and fr triage check reports the same
      settled count.
    origin:
    - spec:2026-10-04-drive-scoped-collect#R1
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1346
    verify: live
    issues:
    - derio-net/super-fr#1346
  - id: drive-carry-keeps-settled-set
    capability: Backlog triage
    acceptance: After drive passes that carried facts over, fr triage check reports
      the same settled set as right after a full fr triage collect.
    origin:
    - spec:2026-10-04-drive-scoped-collect#R7
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1342
    verify: live
    issues:
    - derio-net/super-fr#1342
