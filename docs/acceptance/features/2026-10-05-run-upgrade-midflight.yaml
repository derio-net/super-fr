# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-05-run-upgrade-midflight
repo: derio-net/super-fr
rows:
  - id: run-reshape-drifted-cursor
    capability: run-cursor
    acceptance: An in-flight run whose shape gained a step ahead of its cursor can be
      moved onto the current shape with every recorded step kept, and a reshape that
      would skip or lose recorded work is refused with nothing changed
    origin:
    - spec:2026-10-05-run-upgrade-midflight#R1
    - spec:2026-10-05-run-upgrade-midflight#R2
    - spec:2026-10-05-run-upgrade-midflight#R3
    levels:
      unit:
      - super-fr:tests/unit/test_run_reshape.py#test_a_step_added_after_the_cursor_is_inserted_pending_in_manifest_order
      - super-fr:tests/unit/test_run_reshape.py#test_a_step_added_at_or_behind_the_cursor_refuses
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_yes_rewrites_the_cursor_in_one_chore_commit
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_a_refusal_exits_2_and_writes_nothing
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_reshape_across_a_schema_change_refuses_naming_supersede
    status: ci
    notes: fr run reshape implemented; a schema-change refusal names adopt --supersede
      (review p1-r1)
  - id: run-read-drifted-cursor
    capability: run-cursor
    acceptance: '`fr run gates` and the other read-only run commands answer from a drifted
      cursor with a warning instead of refusing'
    origin:
    - spec:2026-10-05-run-upgrade-midflight#R4
    levels:
      unit:
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_gates_answers_a_drifted_cursor_with_one_warning
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_status_answers_a_drifted_cursor_with_one_warning
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_a_schema_mismatch_still_refuses_gates
      - super-fr:tests/unit/test_run_reshape_cmd.py#test_check_answers_a_drifted_cursor_with_one_warning
    status: ci
    notes: gates/status/check answer a drifted cursor with one warning (check now tested,
      review p1-r2); schema mismatch still refuses gates
  - id: adopt-supersede-carries-provenance
    capability: run-adoption
    acceptance: Adopting a plan that already has a run supersedes it on request, and
      the operator's gate answers, dispatch history and evidence recorded by the old
      cursor survive into the new one
    origin:
    - spec:2026-10-05-run-upgrade-midflight#R5
    - spec:2026-10-05-run-upgrade-midflight#R6
    levels:
      unit:
      - super-fr:tests/unit/test_run_adopt_supersede.py#test_carry_forward_copies_gate_provenance_and_missing_emitted_keys
      - super-fr:tests/unit/test_run_adopt_supersede.py#test_carry_forward_carries_every_old_unit_with_attempts_and_evidence
      - super-fr:tests/unit/test_run_adopt_supersede.py#test_supersede_yes_replaces_the_run_in_one_commit_and_carries_provenance
      - super-fr:tests/unit/test_run_adopt_supersede.py#test_supersede_preview_lists_the_closed_holds_and_writes_nothing
      - super-fr:tests/unit/test_run_adopt_supersede.py#test_a_review_the_old_cursor_resolved_keeps_its_real_evidence
    status: ci
    notes: 'Phase 3: carry_forward (gate/answered_by, emitted, every unit with attempts
      and evidence, open holds abandoned) and adopt --supersede (preview, --yes one
      commit, usage moved, refusals, same-day overwrite) are covered by unit tests that
      run in CI; p2-r5 ordering pinned.'
  - id: historical-review-evidence
    capability: run-evidence
    acceptance: A phase reviewed before its run's cursor existed can be closed honestly
      as a historical review — inferred by adoption from the plan journal or resolved
      by hand — and is reported as historical, never as debt or failure
    origin:
    - spec:2026-10-05-run-upgrade-midflight#R7
    - spec:2026-10-05-run-upgrade-midflight#R8
    - spec:2026-10-05-run-upgrade-midflight#R9
    levels:
      unit:
      - super-fr:tests/unit/test_run_evidence_historical.py#test_a_review_between_the_implement_return_and_started_is_accepted
      - super-fr:tests/unit/test_run_evidence_historical.py#test_a_review_created_after_the_run_started_is_refused
      - super-fr:tests/unit/test_run_evidence_historical.py#test_a_review_created_before_the_implement_return_is_refused
      - super-fr:tests/unit/test_run_evidence_historical.py#test_a_phase_owing_visual_evidence_is_refused
      - super-fr:tests/unit/test_run_evidence_historical.py#test_historical_is_refused_on_a_flat_spec_review_unit
      - super-fr:tests/unit/test_run_adopt.py#test_adoption_marks_journal_reviewed_phases_done_as_historical
      - super-fr:tests/unit/test_run_adopt.py#test_adoption_leaves_a_phase_with_an_open_finding_pending
      - super-fr:tests/unit/test_run_adopt.py#test_adoption_leaves_a_phase_with_an_unauthorized_fix_pending
      - super-fr:tests/unit/test_run_adopt.py#test_adoption_leaves_a_phase_with_no_review_entry_pending
      - super-fr:tests/unit/test_run_adopt.py#test_adoption_leaves_a_phase_owing_visual_evidence_pending
      - super-fr:tests/unit/test_run_evidence_historical.py#test_status_and_check_say_a_review_is_historical
      - super-fr:tests/unit/test_run_evidence_historical.py#test_an_adopted_historical_review_is_not_debt
      - super-fr:tests/unit/test_deliver_pr_body.py#test_the_body_lists_historical_reviews_when_a_unit_carries_one
      - super-fr:tests/unit/test_deliver_pr_body.py#test_deliver_refuses_a_live_body_lacking_the_historical_section
    status: ci
    notes: R7 by-hand bound (all three clauses, flat refusal, unchanged entry/findings
      checks), R8 adoption inference (done/pending with notes, cursor past the group)
      and R9 reporting (status/check sentence, no debt, PR-body section required on
      the live PR) are unit-tested in CI.
