      - super-fr:tests/unit/test_triage_origins.py#test_facts_stay_schema_1_and_origins_yaml_loads_1_and_2
      - super-fr:tests/unit/test_triage_origins.py#test_duplicate_of_needs_the_duplicate_category
      - super-fr:tests/unit/test_triage_origins.py#test_check_reports_a_duplicate_target_outside_the_window
