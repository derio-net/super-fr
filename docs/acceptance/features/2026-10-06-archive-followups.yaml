# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-06-archive-followups
repo: derio-net/super-fr
rows:
  - id: archive-prices-earlier-closeouts
    capability: archive
    acceptance: An fr archive that moves anything prices the sessions earlier closeouts
      left unpriced, staging the refreshed implemented/usage files, and never fails
      the archive doing so
    origin:
    - spec:2026-10-06-archive-followups#R1
    - spec:2026-10-06-archive-followups#R2
    - spec:2026-10-06-archive-followups#R3
    levels:
      unit:
      - super-fr:tests/unit/test_archive_followups.py#test_an_archive_that_moved_something_stages_each_refreshed_usage_file
      - super-fr:tests/unit/test_usage_backfill.py
      - super-fr:tests/unit/test_archive_followups.py#test_the_unpriced_note_promises_the_next_archive_will_price_it
    status: ci
    notes: 'unit-pinned in CI by this PR; the live close-out (verify: live, post-merge)
      is still owed'
  - id: archive-retargets-matrix-refs
    capability: archive
    acceptance: After a successful archive, every same-repo matrix ref naming a moved
      path points at its new location (only those bytes change) and the three reports
      are regenerated, so fr acceptance check stays clean after closeout
    origin:
    - spec:2026-10-06-archive-followups#R4
    - spec:2026-10-06-archive-followups#R5
    - spec:2026-10-06-archive-followups#R6
    - spec:2026-10-06-archive-followups#R7
    levels:
      unit:
      - super-fr:tests/unit/test_archive_followups.py#test_a_plan_archive_rewrites_no_acceptance_fragment
      - super-fr:tests/unit/test_acceptance_effective_readers.py#test_the_staleness_guard_counts_a_logical_citation
      - super-fr:tests/unit/test_acceptance_effective_readers.py#test_rows_citing_matches_a_logical_origin_live_and_archived
      - super-fr:tests/unit/test_acceptance_archive_twin.py#test_check_survives_debug_journal_archive
      - super-fr:tests/unit/test_acceptance_archive_twin.py#test_a_plan_dir_ref_resolves_at_its_archived_counterpart
    status: ci
    notes: 'review p2-r5: archive rewrites no fragment and the retarget step is gone;
      logical spec/plan refs survive an archive (spec 2026-11-04 R18), and check resolves
      a pre-archive path ref under docs/superpowers/{specs,journals,plans}/ at its archived
      counterpart at read time, ci-pinned; the live close-out (verify: live, post-merge)
      is still owed'
  - id: archive-files-open-ends
    capability: archive
    acceptance: fr archive lists the open and out-of-scope findings of the journals
      it moves, files the chosen ones as tracker issues (deduplicated by marker, never
      blocking the archive) and records each as deferred to its issue in the archived
      journal
    origin:
    - spec:2026-10-06-archive-followups#R8
    - spec:2026-10-06-archive-followups#R9
    - spec:2026-10-06-archive-followups#R10
    - spec:2026-10-06-archive-followups#R11
    - spec:2026-10-06-archive-followups#R12
    levels:
      unit:
      - super-fr:tests/unit/test_archive_open_ends.py#test_issues_all_files_every_end_marks_it_and_defers_the_finding
      - super-fr:tests/unit/test_archive_open_ends.py#test_an_issue_that_is_not_ours_or_only_quotes_the_marker_is_not_reused
      - super-fr:tests/unit/test_archive_open_ends.py#test_non_interactive_with_no_flag_only_lists
      - super-fr:tests/unit/test_archive_open_ends.py#test_archive_write_back_matches_the_journal_resolve_path
    status: ci
    notes: 'unit-pinned in CI by this PR; the live close-out (verify: live, post-merge)
      is still owed'
  - id: closeout-brief-files-via-archive
    capability: closeout
    acceptance: The closeout brief hands out-of-scope findings to one fr archive --branch
      <b> --issues <ids> command instead of per-finding manual journal lines
    origin:
    - spec:2026-10-06-archive-followups#R13
    levels:
      unit:
      - super-fr:tests/unit/test_run_closeout.py#test_closeout_brief_archive_line_names_every_qid_and_the_way_to_file_none
      - super-fr:tests/unit/test_run_closeout.py#test_closeout_brief_archive_line_parses_against_the_real_cli
    status: ci
    notes: 'unit-pinned in CI by this PR; the live close-out (verify: live, post-merge)
      is still owed'
