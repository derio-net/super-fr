# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-06-driver-sessions
repo: derio-net/super-fr
rows:
  - id: drive-post-merge-restart
    capability: Backlog triage
    acceptance: With post_merge_restart idle in the repo's triage config, the wave driver
      restarts idle sessions once per pass in which that repo's post_merge succeeded,
      reports the outcome, and never holds a close-out or ends the drive over a restart
      failure or a runner that cannot restart
    origin:
    - spec:2026-10-06-driver-sessions#R6
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive_restart.py#test_two_closeouts_in_one_pass_restart_once_after_both_started
      - super-fr:tests/unit/test_fr_herdr_runner.py#test_restart_idle_is_a_session_restarter_and_summarises_the_engine_report
    status: ci
    notes: 'phase 2: driver restarts idle sessions once per pass via SessionRestarter;
      fake-runner tests'
    verify: none
  - id: drive-idle-session-report
    capability: Backlog triage
    acceptance: The wave driver reports once a batch session idle with no PR, or a close-out
      session idle with no archive PR, past the repo's idle_session_minutes (default
      60), naming the focus command, without ending the drive
    origin:
    - spec:2026-10-06-driver-sessions#R7
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_drive.py#test_the_driver_warns_once_per_idle_session_with_a_paste_ready_focus_command
      - super-fr:tests/unit/test_triage_batch_drive_idle.py#test_an_idle_batch_session_with_no_pr_is_reported_with_its_focus_command
      - super-fr:tests/unit/test_triage_batch_drive_idle.py#test_an_idle_closeout_with_no_archive_pr_is_reported
    status: ci
    notes: 'idle_session rule and the driver''s idle-session warn: unit tests over drive_pass
      plus command-level tests with a fake inspecting runner'
    verify: none
  - id: board-idle-session
    capability: Backlog triage
    acceptance: The triage board marks a card needs-you, saying why, when its batch
      or close-out session has sat idle past the threshold with nothing to show for
      it
    origin:
    - spec:2026-10-06-driver-sessions#R8
    levels:
      unit:
      - super-fr:tests/unit/test_triage_kanban.py#test_a_batch_card_idle_with_no_pr_needs_you_and_says_why
      - super-fr:tests/unit/test_triage_kanban.py#test_a_closeout_card_idle_with_no_archive_pr_needs_you_and_says_why
      - super-fr:tests/unit/test_triage_kanban.py#test_a_card_with_a_pr_is_not_flagged
      - super-fr:tests/unit/test_triage_kanban_cmd.py#test_write_board_judges_idleness_by_the_wall_clock
    status: ci
    notes: card needs-you and its reason line are pinned by kanban card tests and write_board's
      wall clock; rendered and screenshot-checked in a headless browser (record visual
      section)
    verify: none
    visual:
      states:
      - idle-batch-card-needs-you
      - idle-closeout-card-needs-you
      - idle-card-with-pr-not-flagged
  - id: herdr-restart-idle
    capability: herdr runner
    acceptance: Inside herdr, fr-herdr restart-idle lists every Claude pane with ok
      / skip <reason> / fail <reason> and a summary, is a dry run unless --yes, never
      sends a key to a pane it skips (busy, draft, background work, no transcript, own
      or excluded pane), goes on past a failed pane, and refuses outside herdr
    origin:
    - spec:2026-10-06-driver-sessions#R1
    - spec:2026-10-06-driver-sessions#R2
    - spec:2026-10-06-driver-sessions#R4
    - spec:2026-10-06-driver-sessions#R5
    levels:
      unit:
      - super-fr:tests/unit/test_fr_herdr_restart.py
      - super-fr:tests/unit/test_fr_herdr_cli.py
    status: ci
    notes: 'fr-herdr restart-idle shipped (phase 1): engine and console script unit-tested
      against live herdr 0.9.1 captures, and a candidate-walk scenario drives the installed
      fr-herdr against a fake herdr that replays them'
    verify: candidate
    scenario: tests/scenarios/herdr-restart-idle.sh
  - id: herdr-restart-idle-live
    capability: herdr runner
    acceptance: A restarted pane resumes the same Claude session id in the same pane
      and tab, with the same label, herdr agent name and --model, and a pane at the
      exit dialog is reported, never answered
    origin:
    - spec:2026-10-06-driver-sessions#R3
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1354
    verify: live
    issues:
    - derio-net/super-fr#1354
  - id: herdr-outside-refusal
    capability: herdr runner
    acceptance: Outside a herdr session the herdr runner refuses and tells the operator
      to run drive or dispatch from a herdr pane, and the fr-triage skill documents
      that constraint and the session-upkeep settings
    origin:
    - spec:2026-10-06-driver-sessions#R9
    levels:
      unit:
      - super-fr:tests/unit/test_fr_herdr_runner.py#test_preflight_refuses_outside_a_herdr_session
      - super-fr:tests/unit/test_fr_triage_skill_runner_constraints.py#test_the_skill_states_the_herdr_only_rule
      - super-fr:tests/unit/test_fr_triage_skill_runner_constraints.py#test_the_skill_names_the_session_upkeep_settings
    status: ci
    notes: refusal text and the fr-triage skill paragraph are pinned by tests
    verify: none
