# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-06-verification-strategies
repo: derio-net/super-fr
rows:
  - id: verification-strategy-resolution
    capability: verification
    acceptance: A named verification strategy resolves repo-first then shipped, a repo-authored
      one is usable, a shape declares the default, and a malformed manifest is refused
      by fr verification check
    origin:
    - spec:2026-10-06-verification-strategies#R1
    - spec:2026-10-06-verification-strategies#R2
    - spec:2026-10-06-verification-strategies#R4
    - spec:2026-10-06-verification-strategies#R5
    levels:
      unit:
      - super-fr:tests/unit/test_verification_cmd.py#test_the_shipped_shapes_declare_candidate_and_it_resolves
      - super-fr:tests/unit/test_verification_cmd.py#test_a_workflow_manifest_accepts_an_optional_verification_default
      int:
      - super-fr:tests/integration/test_scenarios.py#test_verification_strategy_resolution
    status: ci
    notes: scenario covers resolution and check; unit tests added for a shape declaring
      the default (shipped shapes declare candidate and it resolves)
    scenario: tests/scenarios/verification-strategy-resolution.sh
  - id: shipped-verification-strategies
    capability: verification
    acceptance: candidate, client-live, prerelease and live ship; candidate-family installs
      go to a throwaway prefix through the repo's install contract and never touch the
      operator's install
    origin:
    - spec:2026-10-06-verification-strategies#R3
    - spec:2026-10-06-verification-strategies#R8
    levels:
      int:
      - super-fr:tests/integration/test_scenarios.py#test_shipped_verification_strategies
    status: ci
    notes: scenario tests/scenarios/shipped-verification-strategies.sh runs against
      a candidate install in CI (tests/integration/test_scenarios.py)
    scenario: tests/scenarios/shipped-verification-strategies.sh
  - id: spec-verification-section
    capability: verification
    acceptance: 'A spec''s ## Verification section sets the run''s strategy and per-row
      overrides; a post-merge row without a reason fails self-review; legacy verify
      post-merge rows read as live'
    origin:
    - spec:2026-10-06-verification-strategies#R6
    - spec:2026-10-06-verification-strategies#R7
    - spec:2026-10-06-verification-strategies#R10
    levels:
      unit:
      - super-fr:tests/unit/test_plan_self_review_verification.py#test_a_post_merge_or_none_row_without_a_reason_fails
      - super-fr:tests/unit/test_migration_matrix_strategies.py#test_post_merge_becomes_live_and_nothing_else_moves
      - super-fr:tests/unit/test_record_post_merge_consumers.py#test_the_pr_body_lists_live_rows_with_their_reason_or_a_legacy_note
      - super-fr:tests/unit/test_verification_spec_section.py#test_parse_section_reads_strategy_and_row_lines
      - super-fr:tests/unit/test_verification_spec_section.py#test_then_the_spec_override_line_for_that_row
      - super-fr:tests/unit/test_verification_spec_section.py#test_then_the_spec_strategy_line
      int:
      - super-fr:tests/integration/test_scenarios.py#test_spec_verification_section
    status: ci
    notes: 'scenario covers the section and self-review; unit tests added for the section
      setting the run''s strategy and per-row overrides (precedence: row verify, spec
