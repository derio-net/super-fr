      - super-fr:tests/unit/test_triage_state_workspace.py#test_the_home_cache_is_imported_once_and_left_in_place
      - super-fr:tests/unit/test_triage_state_ref.py#test_fetch_into_a_fresh_clone_restores_every_entry_byte_for_byte
      - super-fr:tests/unit/test_triage_state_ref.py#test_a_stale_expected_old_fails_and_changes_nothing
      - super-fr:tests/unit/test_triage_state_repo.py#test_a_mixed_set_asks_among_the_private_ones_only
