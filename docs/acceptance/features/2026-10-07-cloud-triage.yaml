      evidence: 'walk 17, 2026-10-08, Claude Code cloud: a driver session drove scope
        s-e7803c78 (batches walk17-a/b for throwaway #1093/#1094). Passed: dispatch
        of one worker session per batch; merge train with merge_method (#1095 updated
