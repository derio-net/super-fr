      - super-fr:tests/unit/test_triage_state_ref.py#test_the_state_ref_is_a_branch_under_refs_heads
      - super-fr:tests/unit/test_triage_state_ref.py#test_a_legacy_base_is_not_the_expected_old_of_the_first_branch_push
      - super-fr:tests/unit/test_triage_state_ref.py#test_a_push_the_remote_refuses_is_a_refusal_not_a_conflict
      - super-fr:tests/unit/test_triage_state_ref_sync.py#test_collect_whose_push_is_refused_warns_and_exits_zero
      int:
      - super-fr:tests/integration/test_scenarios.py#test_cloud_triage_state_ref
    status: ci
    notes: 'phase 3: workspace state dir + info/exclude + ~/.cache import (test_triage_state_workspace),
      the ref''s REF_FILES push/fetch CAS over bare remotes (test_triage_state_ref),
      the state-repo decision and restore of scope-durable.yaml (test_triage_state_repo);
      the candidate scenario tests/scenarios/cloud-triage-state-ref.sh runs in CI through
      test_scenarios.py. Test Plan 16''s walk (2026-10-08) measured the cloud git proxy
      refusing every ref outside refs/heads/ (HTTP 403), so the state ref moved to the
      orphan branch refs/heads/fr-triage/<scope-id>, read from the legacy refs/fr/triage/<scope-id>
      when the branch is absent, and a push the remote refuses is a warning after a
      command''s own work (debug 2026-10-08-cloud-state-ref-proxy); the walk of the
      branch push from a cloud session is still owed'
    scenario: tests/scenarios/cloud-triage-state-ref.sh
  - id: cloud-triage-privacy-guard
    capability: Backlog triage
    acceptance: An issue from a private repo can never reach a public state repo; adding
      it to a triage, a batch or a wave, or pushing or exporting state that contains
      it, is refused with the issue and both repos named
    origin:
    - spec:2026-10-07-cloud-triage#R8
    levels:
      unit:
      - super-fr:tests/unit/test_triage_privacy.py#test_leak_risk_is_a_private_key_into_a_public_state_repo
      - super-fr:tests/unit/test_triage_privacy.py#test_batch_create_of_a_private_issue_into_a_public_state_repo_exits_2
      - super-fr:tests/unit/test_triage_privacy.py#test_the_wave_setter_exits_2
      - super-fr:tests/unit/test_triage_privacy.py#test_push_reads_the_state_repos_visibility_live_with_get_repos
      - super-fr:tests/unit/test_triage_privacy.py#test_an_unreadable_state_repo_visibility_refuses_the_push
      - super-fr:tests/unit/test_triage_privacy.py#test_state_export_refuses_a_private_key_with_a_public_state_repo
      - super-fr:tests/unit/test_triage_privacy.py#test_a_key_whose_repo_the_scope_does_not_cover_has_its_visibility_read
      int:
      - super-fr:tests/integration/test_scenarios.py#test_cloud_triage_privacy_guard
    status: ci
    notes: 'phase 3: privacy.leak_risk and its two guards (batch/wave/judgement writes;
      push_state and state export with a live GET repos/{state_repo}) in test_triage_privacy,
      a key outside the scope read like any other and unreadable counting as private
      (p3-r8); the candidate scenario tests/scenarios/cloud-triage-privacy-guard.sh
      runs in CI through test_scenarios.py, refusing the private issue with a public
      state repo and landing the same create once the state repo is private. OWED to
      phase 4: Test Plan 7''s lease-push part (the lease push that opens a pass goes
      through the same guard) is untested until the lease ships.'
    scenario: tests/scenarios/cloud-triage-privacy-guard.sh
