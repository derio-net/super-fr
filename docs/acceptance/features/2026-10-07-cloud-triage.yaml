# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-07-cloud-triage
repo: derio-net/super-fr
rows:
  - id: cloud-triage-github-rest
    capability: Backlog triage
    acceptance: Where GitHub's GraphQL API is unavailable, an operator can still collect,
      judge, render, batch, merge and drive a backlog by setting one option, and gets
      the same records as with GraphQL apart from a listed set of fields
    origin:
    - spec:2026-10-07-cloud-triage#R1
    - spec:2026-10-07-cloud-triage#R2
    - spec:2026-10-07-cloud-triage#R3
    levels:
      unit:
      - super-fr:tests/unit/test_github_rest_contract.py
      - super-fr:tests/unit/test_github_rest_no_graphql.py
      - super-fr:tests/unit/test_forgeapi.py
    status: walk-owed
    notes: 'walk-owed (p1-r4): walk 16 passed live in a cloud session (recorded) after
      #1092 moved the state ref under refs/heads/; the board-matches-a-host-render comparison
      is still owed and needs the operator''s host. Gaps found under rest: verify-merge
      and pickup still read the PR over GraphQL, and a repo allowing several merge methods
      needs merge_method (derio-net/super-fr#1100).'
    verify: client-live
    walks:
    - strategy: client-live
      harness: claude-code
      model: session-default
      outcome: pass
      at: '2026-10-08T23:24:47Z'
      evidence: 'walk 16, 2026-10-08, Claude Code cloud session, main 07c629f2: collect/check/render
        of derio-net/super-fr over REST with no GraphQL call (48 open issues); state
        pushed and fetched through the cloud git proxy on refs/heads/fr-triage/<scope-id>,
        both to the session''s own repo and to a private state repo the session did
        not start with (derio-net/fr-triage-state, chosen at the collect prompt, restored
        in a fresh clone). Walk 17 then merged two PRs over REST with merge_method set.'
  - id: cloud-triage-state-ref
    capability: Backlog triage
    acceptance: A scope's triage state lives in its workspace and survives the loss
      of the machine through a ref only that scope writes, kept in the repo itself or,
      for several repos or an org, in a state repo the operator chose with the privacy
      trade-off spelled out
    origin:
    - spec:2026-10-07-cloud-triage#R4
    - spec:2026-10-07-cloud-triage#R5
    - spec:2026-10-07-cloud-triage#R6
    - spec:2026-10-07-cloud-triage#R7
    levels:
