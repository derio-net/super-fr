# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-11-batch-adopt-safety-2
repo: derio-net/super-fr
rows:
  - id: triage-adopt-holds-agent
    capability: triage
    acceptance: batch adopt's message to an adopted agent ends with an explicit hold
      by default (acknowledge only, no commits/merges/migrations/pushes/runs, wait for
      the operator), --no-hold drops it, and the plan without --yes prints the exact
      text
    origin:
    - spec:2026-10-11-batch-adopt-safety-2#R1
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_adopt.py#test_the_held_message_pins_every_line
    status: ci
    notes: held message pinned by unit tests; scenario on candidate
    verify: candidate
    scenario: tests/scenarios/triage-adopt-hold.sh
  - id: triage-adopt-default-branch
    capability: triage
    acceptance: 'batch adopt takes a session on the default branch: it creates the batch
      branch''s fr workspace from origin/<default>, binds the session, records the dispatch
      and tells the held agent the workspace path; it refuses a dirty base clone or
      unpushed default-branch commits, never changes the base clone, and is resumable'
    origin:
    - spec:2026-10-11-batch-adopt-safety-2#R5
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_adopt_default.py#test_yes_enters_the_workspace_binds_adopts_records_marks_and_messages
      - super-fr:tests/unit/test_triage_batch_adopt_default.py#test_a_dirty_base_clone_is_refused_with_its_paths
      - super-fr:tests/unit/test_triage_batch_adopt_default.py#test_a_local_default_ahead_of_origin_is_refused_with_its_commits
      - super-fr:tests/unit/test_triage_batch_adopt_default.py#test_the_base_clone_is_left_untouched
      - super-fr:tests/unit/test_triage_batch_adopt_default.py#test_a_failed_mark_resumes_the_workspace_and_finishes
    status: ci
    notes: default-branch adopt pinned by unit tests over a real temp repo
    verify: none
  - id: triage-adopt-list-columns
    capability: triage
    acceptance: 'batch adopt --list shows each session''s state (adoptable / on default
      branch / batch / no agent / unknown), repo, branch, fr workspace and open PR,
      and classifies every label ref, bare #n included, as issue or PR through the forge,
      writing nothing'
    origin:
    - spec:2026-10-11-batch-adopt-safety-2#R11
    levels:
      unit:
      - super-fr:tests/unit/test_triage_adopt_list.py#test_the_listing_has_one_row_per_state
      - super-fr:tests/unit/test_triage_adopt_list.py#test_session_state_precedence
      - super-fr:tests/unit/test_triage_adopt_list.py#test_each_distinct_ref_and_branch_is_read_once
      - super-fr:tests/unit/test_triage_adopt_list.py#test_one_rows_failures_degrade_only_that_row
      int:
      - super-fr:tests/integration/test_scenarios.py#test_triage_adopt_list
    status: ci
    notes: listing pinned by unit tests; scenario on candidate
    verify: candidate
    scenario: tests/scenarios/triage-adopt-list.sh
  - id: triage-adopt-live-sweep
    capability: triage
    acceptance: On a real herdr host, adopt --list correlates live agents with their
      repo, branch, workspace and PR, and adopted agents (feature branch and main) acknowledge
      and wait without acting
    origin:
    - spec:2026-10-11-batch-adopt-safety-2#R1
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1361
    verify: live
    issues:
    - derio-net/super-fr#1361
