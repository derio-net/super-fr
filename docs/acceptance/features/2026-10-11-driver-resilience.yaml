# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-10-11-driver-resilience
repo: derio-net/super-fr
rows:
  - id: driver-once-dispatch-refused
    capability: triage-batch-drive
    acceptance: '`fr triage batch drive --once --yes` whose pass would dispatch refuses
      (exit 2) before acting and prints the looping command with the caller''s arguments,
      unless --single-pass is given, which acts and ends with that warning; dry runs
      and non-dispatching passes are unchanged.'
    origin:
    - spec:2026-10-11-driver-resilience#R1
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_single_pass.py#test_once_yes_whose_plan_dispatches_refuses_before_acting
    status: ci
    notes: 'Unit tests drive batch_drive_command: refusal, --single-pass warning, dry-run
      and no-dispatch passes unchanged'
    verify: none
  - id: driver-unreadable-visibility-retries
    capability: triage-batch-drive
    acceptance: A looping driver that cannot read its state repo's visibility skips
      the pass (nothing pushed), warns once and retries after --interval instead of
      exiting; --once and the cloud pass still refuse, and a public state repo with
      a private member is still refused.
    origin:
    - spec:2026-10-11-driver-resilience#R8
    levels:
      unit:
      - super-fr:tests/unit/test_triage_drive_visibility_retry.py#test_a_loop_skips_a_pass_whose_lease_push_cannot_read_the_visibility
      - super-fr:tests/unit/test_triage_drive_visibility_retry.py#test_a_loop_skips_a_pass_whose_member_repo_visibility_cannot_be_read
      - super-fr:tests/unit/test_triage_drive_visibility_retry.py#test_a_loop_skips_a_pass_whose_judgements_write_cannot_read_the_visibility
      - super-fr:tests/unit/test_triage_privacy.py#test_a_member_repo_whose_visibility_cannot_be_read_is_unreadable_not_a_leak
      - super-fr:tests/unit/test_triage_privacy.py#test_a_definite_leak_outranks_an_unreadable_member_repo
    status: ci
    notes: 'Unit tests: a looping drive skips and retries, once/cloud/export still refuse,
      a leak still ends the driver; since gh#1144/gh#1145 also an unreadable member
      repo (public state repo) and a mid-pass judgements-write check skip the pass,
      and a certain leak outranks an unreadable repo'
    verify: none
  - id: rest-rulesets-free-plan-403
    capability: triage-batch-drive
    acceptance: Under the REST forge, a private repo on GitHub's free plan (rulesets
      endpoint 403 with the plan-upgrade notice) yields its classic-protection required
      checks and the drive pass proceeds; any other 403 still fails the read.
    origin:
    - spec:2026-10-11-driver-resilience#R12
    levels:
      unit:
      - super-fr:tests/unit/test_real_ghrestclient.py#test_a_free_plan_rulesets_403_means_no_rulesets
    status: ci
    notes: 'Unit tests: the free-plan 403 means no rulesets; other 403s and host refusals
      still raise'
    verify: none
