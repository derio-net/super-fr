# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-10-12-board-truth
repo: derio-net/super-fr
rows:
  - id: triage-in-progress-release
    capability: triage-batches
    acceptance: When a scope releases a finished, cancelled or abandoned batch's claim
      on a member no other scope holds, fr:in-progress comes off that member too; a
      member another scope holds keeps it.
    origin:
    - spec:2026-10-12-board-truth#R1
    levels:
      unit:
      - super-fr:tests/unit/test_triage_claim_writes.py#test_release_with_unlabel_removes_both_labels_in_one_edit
      - super-fr:tests/unit/test_triage_claim_writes.py#test_unlabel_removes_neither_label_while_another_scopes_claim_stands
    status: ci
    notes: claim_writes.release(unlabel=True), passed by claim sync's releases, takes
      fr:in-progress off with fr:claimed when no other scope holds the issue; claim
      release and scope retire leave it.
    verify: none
  - id: triage-closed-in-progress-set
    capability: triage-batches
    acceptance: fr triage check and the board name closed issues still labelled fr:in-progress,
      held ones apart, and fr triage clean-labels --yes removes the label from the rest
      (dry-run without --yes).
    origin:
    - spec:2026-10-12-board-truth#R2
    - spec:2026-10-12-board-truth#R3
    levels:
      unit:
      - super-fr:tests/unit/test_triage_clean_labels.py#test_with_yes_it_rereads_each_target_and_removes_the_label_from_the_rest
      - super-fr:tests/unit/test_triage_clean_labels.py#test_check_json_lists_the_whole_set_with_each_entrys_state
      - super-fr:tests/unit/test_triage_clean_labels.py#test_clean_labels_removes_both_labels_and_no_longer_skips_fr_claimed
    status: ci
    notes: 'post-merge truth: same target set (the stale entries); clean-labels now
      removes fr:claimed and fr:in-progress in one edit and no longer skips fr:claimed'
    verify: candidate
    scenario: tests/scenarios/triage-closed-in-progress.sh
  - id: triage-config-skew-visible
    capability: triage-batches
    acceptance: A repo whose .fr/triage.yaml carries keys this fr does not know is still
      collected; the ignored keys and any skipped repo appear as a prominent banner
      on the backlog and batch pages and in fr triage check.
    origin:
    - spec:2026-10-12-board-truth#R4
    - spec:2026-10-12-board-truth#R5
    levels:
      unit:
      - super-fr:tests/unit/test_triage_config_skew.py#test_the_banner_names_ignored_keys_and_skipped_repos_escaped
      - super-fr:tests/unit/test_triage_config_skew.py#test_check_names_skipped_and_ignored_in_json_and_first_in_the_text
      - super-fr:tests/unit/test_triage_config_skew.py#test_an_unknown_key_is_collected_and_named_without_any_lenient_argument
      int:
      - super-fr:tests/integration/test_scenarios.py#test_triage_config_skew
    status: ci
    notes: R4 unit ref and the scenario's integration test added; scenario now also
      renders board.html and uses org scope
    verify: candidate
    scenario: tests/scenarios/triage-config-skew.sh
  - id: triage-closeout-card-front
    capability: triage-batches
    acceptance: While a batch's close-out session is live, its card front shows the
      close-out's status and jumps to it; the batch session's jump is in the card body.
    origin:
    - spec:2026-10-12-board-truth#R6
    - spec:2026-10-12-board-truth#R7
    levels:
      unit:
      - super-fr:tests/unit/test_triage_kanban_render.py#test_a_live_closeout_takes_the_card_front_and_the_body_jumps_to_the_batch
    status: ci
    notes: 'R6/R7: Card.front derived from closeout_status; front pill and Jump speak
      for the live close-out; body has a Jump and code pair per session. Browser shots
      taken and opened.'
    verify: none
    visual:
      states:
      - closeout-live-front
      - closeout-absent-front
      - body-both-sessions
      interactions:
      - front-jump-closeout
      - body-jump-batch
  - id: triage-cancelled-batch-terminal
    capability: triage-batches
    acceptance: A dispatched batch that was cancelled and had its claims released reads
      as cancelled, owes no claim or release, and never renders as Running, including
      right after a fresh collect and render.
    origin:
    - spec:2026-10-12-board-truth#R8
    levels:
      unit:
      - super-fr:tests/unit/test_triage_cancelled_terminal.py#test_a_cancelled_released_batch_never_renders_as_running
      - super-fr:tests/unit/test_triage_cancelled_terminal.py#test_right_after_a_fresh_collect_and_render_it_is_still_cancelled
      int:
      - super-fr:tests/integration/test_scenarios.py#test_triage_cancelled_terminal
    status: ci
    notes: R8 also pinned through a real collect then render (wave and wave-less); scenario
      states claims-only.
    verify: candidate
    scenario: tests/scenarios/triage-cancelled-terminal.sh
  - id: triage-nav-present-pages
    capability: triage-batches
    acceptance: Every triage page, the batch board included, navigates only to the pages
      the scope has (Backlog, Batches, Origins, Architecture, History), and rendering
      any page brings every existing page's nav up to date.
    origin:
    - spec:2026-10-12-board-truth#R9
    - spec:2026-10-12-board-truth#R10
    - spec:2026-10-12-board-truth#R11
    - spec:2026-10-12-board-truth#R12
    levels:
      unit:
      - super-fr:tests/unit/test_triage_nav_pages.py#test_rendering_the_board_updates_the_other_pages_navs
      int:
      - super-fr:tests/integration/test_scenarios.py#test_triage_nav_pages
    status: ci
    notes: 'R9-R12: tests/unit/test_triage_nav_pages.py covers registry, presence, per-page
      nav, refresh (atomic, skip-if-current, no-nav warn) and the nav-stripped publish
      copy; tests/scenarios/triage-nav-pages.sh renders triage, history, board from
      an org fixture. Visual states checked in a browser in phase 4.'
    verify: candidate
    visual:
      states:
      - org-scope-nav
      - repo-scope-five-tabs
      - current-tab-marked
      - phone-width-nav
      interactions:
      - nav-link-each-tab
    scenario: tests/scenarios/triage-nav-pages.sh
