# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-10-12-quota-pacing
repo: derio-net/super-fr
rows:
  - id: quota-reset-wait
    capability: triage-batch-drive
    acceptance: After a rate-limit response, a looping drive reads /rate_limit once
      and makes no forge call on the exhausted budget until the announced reset; a pass
      that starts with nothing left does not run; a secondary limit backs off doubling
      to 15 minutes; an unreadable /rate_limit fails open.
    origin:
    - spec:2026-10-12-quota-pacing#R2
    levels:
      unit:
      - super-fr:tests/unit/test_triage_quota_loop.py#test_a_rate_limited_pass_waits_for_the_reset_and_spends_nothing_until_then
      - super-fr:tests/unit/test_triage_quota_loop.py#test_an_exhausted_budget_at_pass_start_runs_no_pass_at_all
      - super-fr:tests/unit/test_triage_quota_loop.py#test_a_rate_limited_skip_in_the_collect_ends_the_pass_before_the_snapshot
      - super-fr:tests/unit/test_triage_quota.py#test_exhausted_budget_waits_for_the_reset_plus_thirty_seconds
    status: ci
    notes: 'Phase 1: the host loop waits to reset+30s with no forge call, a collect
      that skips on a rate limit ends the pass before the snapshot, and an exhausted
      budget at pass start runs no pass.'
    verify: none
  - id: quota-floor-essential-pass
    capability: triage-batch-drive
    acceptance: Below the host's budget floor (default 20%, quota_floor in forge.yaml
      or --quota-floor), a drive pass collects only live-batch repos, dispatches nothing
      (held, quota below floor), still merges and closes out, keeps the last board,
      and waits four intervals.
    origin:
    - spec:2026-10-12-quota-pacing#R7
    levels:
      unit:
      - super-fr:tests/unit/test_triage_quota_passes.py#test_below_the_floor_nothing_is_dispatched_and_the_drive_keeps_going
      - super-fr:tests/unit/test_triage_quota_passes.py#test_below_the_floor_a_forced_full_pass_reads_only_the_live_batch_repos
      - super-fr:tests/unit/test_triage_batch_drive.py#test_a_dispatch_hold_turns_every_dispatch_into_a_pending_hold
    status: ci
    notes: 'Essential-only pass built in phase 2: below the floor no dispatch, held
      batches counted pending (never stalled), board kept, next pass 4x interval; a
      forced full pass reads only live-batch repos.'
    verify: none
  - id: quota-quiet-pass
    capability: triage-batch-drive
    acceptance: A drive pass with no forge changes costs only conditional REST probes
      answered 304 (no GraphQL point) and skips collect, plan and board; a pass with
      changes collects only the changed repos and carries the rest; a full pass runs
      at least every 15 minutes; ETags are stored only with the facts they describe.
    origin:
    - spec:2026-10-12-quota-pacing#R9
    levels:
      unit:
      - super-fr:tests/unit/test_triage_quota_passes.py#test_a_quiet_pass_reads_nothing_plans_nothing_and_renews_the_lease
      - super-fr:tests/unit/test_triage_quota_passes.py#test_an_edited_judgements_file_is_never_quiet_and_a_carried_repo_reads_nothing_live
      - super-fr:tests/unit/test_triage_probe.py#test_pass_kinds
    status: ci
    notes: 'Quiet pass built in phase 2: all probes 304 and judgements digest unchanged
      skip collect, snapshot, plan and board; the lease is still renewed.'
    verify: none
  - id: visibility-conditional-read
    capability: triage-batch-drive
    acceptance: The state repo's visibility is still read live before every push, but
      through a conditional REST request whose 304 answer costs no budget.
    origin:
    - spec:2026-10-12-quota-pacing#R12
    levels:
      unit:
      - super-fr:tests/unit/test_gh.py#TestConditionalVisibility::test_the_second_read_sends_the_first_etag_and_a_304_returns_its_answer
    status: ci
    notes: 'Built in phase 3: fr.gh.repo_visibility, a conditional REST read with a
      module-level (host, repo) ETag map shared by both adapters; a 304 returns the
      cached answer, an error raises.'
    verify: none
  - id: quota-board-footer
    capability: triage-batch-drive
    acceptance: The drive logs the remaining quota, reset time and action whenever it
      throttles itself, and board.html's footer shows the last budget read and when
      facts were last collected.
    origin:
    - spec:2026-10-12-quota-pacing#R13
    levels:
      unit:
      - super-fr:tests/unit/test_triage_kanban_render.py#test_the_footer_names_the_last_budget_and_when_the_facts_were_collected
      - super-fr:tests/unit/test_triage_kanban_cmd.py#test_write_board_reads_the_budget_from_pacing_json_for_the_footer
    status: ci
    notes: Drive logging landed in phase 1; the board footer (last budget and facts
      collected_at, read from pacing.json by write_board) in phase 3.
    verify: none
  - id: quota-shared-token-live
    capability: triage-batch-drive
    acceptance: Several org drivers running overnight on one token no longer exhaust
      the shared GraphQL budget.
    origin:
    - spec:2026-10-12-quota-pacing#R1
    levels: {}
    status: walk-owed
    notes: tracked by derio-net/super-fr#1359
    verify: live
    issues:
    - derio-net/super-fr#1359
  - id: quota-secondary-backoff
    capability: triage-batch-drive
    acceptance: A secondary rate limit backs off from --interval, doubling to a 15-minute
      cap and resetting after a clean pass; an unreadable /rate_limit fails open, reported
      once per cause.
    origin:
    - spec:2026-10-12-quota-pacing#R4
    levels:
      unit:
      - super-fr:tests/unit/test_triage_quota_loop.py#test_a_secondary_limit_backs_off_from_the_interval_and_a_clean_pass_resets_it
      - super-fr:tests/unit/test_triage_quota_loop.py#test_the_backoff_stops_at_fifteen_minutes
      - super-fr:tests/unit/test_triage_quota_loop.py#test_an_unreadable_rate_limit_runs_the_pass_and_warns_once
      - super-fr:tests/unit/test_triage_quota.py#test_secondary_limit_backs_off_exponentially_to_a_cap
    status: ci
    notes: Backoff doubles from the interval to the 15 minute cap and a clean pass resets
      it; an unreadable /rate_limit fails open with one warning.
    verify: none
  - id: quota-floor-config
    capability: triage-batch-drive
    acceptance: The budget floor resolves from --quota-floor, else quota_floor in ~/.config/fr/forge.yaml,
      else 0.20, and a value fr cannot use is refused naming its source.
    origin:
    - spec:2026-10-12-quota-pacing#R6
    levels:
      unit:
      - super-fr:tests/unit/test_forgeapi.py#test_floor_flag_beats_the_host_file
      - super-fr:tests/unit/test_forgeapi.py#test_floor_in_the_file_must_be_a_fraction
      - super-fr:tests/unit/test_forgeapi.py#test_floor_flag_must_be_a_fraction
      - super-fr:tests/unit/test_triage_quota_loop.py#test_an_unusable_quota_floor_is_refused_naming_the_flag
    status: ci
    notes: quota_floor resolves flag over host file over 0.20 and refuses an unusable
      value naming the flag or the file.
    verify: none
  - id: quota-partial-carry
    capability: triage-batch-drive
    acceptance: A pass collects only changed repos and carries the rest from the last
      facts, keeping cross-repo PR-to-issue links whichever side was read; carried repos
      are never reported unread.
    origin:
    - spec:2026-10-12-quota-pacing#R10
    levels:
      unit:
      - super-fr:tests/unit/test_triage_collect_partial.py#test_only_the_named_repos_are_read_and_the_rest_carried
      - super-fr:tests/unit/test_triage_collect_partial.py#test_cross_repo_links_survive_whichever_side_is_read
      - super-fr:tests/unit/test_triage_collect_partial.py#test_a_carried_repo_s_visibility_is_left_out_for_the_guard_to_read_live
    status: ci
    notes: 'Partial collect built in phase 2: only changed repos read, the rest carried
      (visibility never carried), cross-repo PR links kept both ways.'
    verify: none
  - id: quota-etag-consistency
    capability: triage-batch-drive
    acceptance: Probes precede each repo's collect, only successfully read repos keep
      their ETags, written after facts.json, so a change between probe and collect is
      never hidden by a later 304.
    origin:
    - spec:2026-10-12-quota-pacing#R11
    levels:
      unit:
      - super-fr:tests/unit/test_triage_probe.py#test_an_interleaved_change_is_never_a_stale_304
      - super-fr:tests/unit/test_triage_probe.py#test_promote_keeps_read_repos_drops_failed_and_leaves_the_rest
      - super-fr:tests/unit/test_triage_collect_partial.py#test_collect_into_carries_and_calls_back_after_facts_json
    status: ci
    notes: 'ETag consistency built in phase 2: probes precede the collect, pending ETags
      promoted only for successfully read repos after facts.json is written, a failed
      repo''s dropped.'
    verify: none
  - id: quota-lease-safe-wait
    capability: triage-batch-drive
    acceptance: A reset wait or stretched interval never lets the drive lease lapse,
      and the cloud drive pass exits 3 while waiting, renewing the lease first when
      it would lapse.
    origin:
    - spec:2026-10-12-quota-pacing#R16
    levels:
      unit:
      - super-fr:tests/unit/test_triage_quota_loop.py#test_a_wait_longer_than_the_lease_renews_it_and_sleeps_again
      - super-fr:tests/unit/test_triage_quota_loop.py#test_the_cloud_pass_exits_3_on_an_exhausted_budget_and_takes_no_lease
      - super-fr:tests/unit/test_triage_quota_loop.py#test_the_cloud_pass_renews_a_lease_that_would_lapse_before_its_next_wake
      - super-fr:tests/unit/test_triage_quota_loop.py#test_the_cloud_pass_honours_a_recorded_wait
    status: ci
    notes: 'Phase 1: a reset wait longer than the lease renews it and sleeps again;
      the cloud pass exits 3 on an exhausted budget or a recorded wait and renews a
      lease that would lapse. The essential-pass stretch reuses this wait in phase 2.'
    verify: none
