      - super-fr:tests/unit/test_triage_quota_passes.py#test_a_recorded_closeout_not_archived_turns_a_quiet_pass_into_a_read_of_its_repo
      - super-fr:tests/unit/test_triage_probe.py#test_a_quiet_pass_with_closing_repos_reads_only_them
