# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-10-14-merge-truth
repo: derio-net/super-fr
rows:
  - id: triage-closed-issues-unclaimed
    capability: triage-batches
    acceptance: Every claim sync --yes and drive --yes pass releases this scope's own
      claim on each closed in-scope issue and removes fr:in-progress and fr:claimed
      from every closed issue no other scope's trusted claim holds (untrusted-only and
      marker-less included); clean-labels --yes does the same; the batch board names
      a non-empty closed set.
    origin:
    - spec:2026-10-14-merge-truth#R1
    - spec:2026-10-14-merge-truth#R2
    - spec:2026-10-14-merge-truth#R3
    - spec:2026-10-14-merge-truth#R15
    levels:
      unit:
      - super-fr:tests/unit/test_triage_claim_sync.py#test_sync_yes_settles_and_records_claims_released_for_members
      - super-fr:tests/unit/test_triage_claim_writes.py#test_settle_closed_releases_own_marker_and_removes_both_labels_in_one_edit
      - super-fr:tests/unit/test_triage_collect.py#test_untrusted_only_claimed_closed_hit_is_stale
      - super-fr:tests/unit/test_triage_clean_labels.py#test_clean_labels_removes_both_labels_and_no_longer_skips_fr_claimed
      - super-fr:tests/unit/test_triage_batch_drive.py#test_drive_pass_emits_settle_actions_after_releases
      - super-fr:tests/unit/test_triage_kanban_cmd.py#test_rendered_board_html_carries_the_closed_set_note
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_a_yes_pass_settles_a_closed_hit_no_batch_holds
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_a_yes_pass_leaves_a_closed_hit_of_a_skipped_repo_alone
      int:
      - super-fr:tests/integration/test_scenarios.py#test_triage_closed_settle
    status: ci
    notes: 'phase 1 review p1-r5/r6: a drive --once --yes pass settles a closed hit
      no batch holds, and leaves a skipped repo''s alone'
    verify: candidate
    scenario: tests/scenarios/triage-closed-settle.sh
  - id: triage-release-pending-true
    capability: triage-batches
    acceptance: A closed issue shown release-pending is cleared by the next claim sync
      --yes or drive --yes pass, including a closed member of a still-running batch;
      check and both pages say so.
    origin:
    - spec:2026-10-14-merge-truth#R4
    levels:
      unit:
      - super-fr:tests/unit/test_triage_claim_sync.py#test_sync_never_refreshes_a_member_facts_show_closed
      - super-fr:tests/unit/test_triage_clean_labels.py#test_every_surface_states_the_same_clearing_rule
      - super-fr:tests/unit/test_triage_clean_labels.py#test_the_board_note_fires_on_stale_or_release_pending_and_names_the_rule
      - super-fr:tests/unit/test_triage_claim_sync.py#test_sync_yes_settles_and_records_claims_released_for_members
      - super-fr:tests/unit/test_triage_batch_drive_cmd.py#test_a_yes_pass_clears_a_release_pending_member
    status: ci
    notes: 'phase 1 review p1-r5: a claim sync --yes and a drive --once --yes pass each
      clear a release-pending member; check, the page and the board share one clearing
      rule'
    verify: none
  - id: triage-claim-take-recorded-first
    capability: triage-batches
    acceptance: fr triage claim take records the take before any forge write; a failed
      judgements write writes nothing to the forge, a forge refusal withdraws the recorded
      take, and a failed forge write leaves a take the next claim sync completes.
    origin:
    - spec:2026-10-14-merge-truth#R5
    levels:
      unit:
      - super-fr:tests/unit/test_triage_claim_cmd.py#test_take_writes_nothing_to_the_forge_when_the_judgements_write_fails
      - super-fr:tests/unit/test_triage_claim_cmd.py#test_take_refused_by_the_forge_withdraws_the_recorded_event
      - super-fr:tests/unit/test_triage_claim_cmd.py#test_take_held_withdraws_the_recorded_event
      - super-fr:tests/unit/test_triage_claim_cmd.py#test_take_transport_failure_keeps_the_event_and_next_sync_claims_the_member
    status: ci
    notes: 'phase 1: take appends claim_taken first; a refusal or Held withdraws it,
      a transport failure keeps it'
    verify: none
  - id: triage-retire-then-sync
    capability: triage-batches
    acceptance: After fr triage scope retire --yes, with no collect in between, fr triage
