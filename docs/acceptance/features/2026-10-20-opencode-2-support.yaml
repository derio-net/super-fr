      - super-fr:tests/unit/test_run_observed_opencode_v2.py#test_a_child_id_walks_to_its_2x_root
      - super-fr:tests/unit/test_run_observed_opencode_v2.py#test_no_session_id_names_opencode_session_id
    status: walked
    notes: 'Live walk on OpenCode 2.1.3 PASSED: OPENCODE_SESSION_ID matched the session_v2
      row with parent_id NULL (top-level), and fr run status read the cursor in this
      session (Test Plan step 3).'
    verify: live
