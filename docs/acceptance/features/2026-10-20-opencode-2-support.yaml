    - strategy: live
      harness: opencode
      model: deepseek-v4.1-flash-free
      outcome: pass
      at: '2026-10-23T00:00:00Z'
      evidence: 'OpenCode 2.1.3, isolated HOME/XDG + logging fr shim, synthetic advanceable
        run 2026-10-23-live-idle: nudge text in the session export (not the operator
