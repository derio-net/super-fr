  - id: opencode-2-push-guard
    capability: OpenCode adaptation
    acceptance: On OpenCode 2.x, a git push from a merged- or closed-PR branch is refused
      by the plugin with the same message the Claude hook gives (gh pr merge is evaluated
      with the same decision, which allows it)
    origin:
    - spec:2026-10-20-opencode-2-support#R4
    levels:
      unit:
      - super-fr:packages/fr-opencode-plugin/test/push.test.ts
    status: ci
    notes: 'push.ts refuses a git push on a merged/closed-PR branch from execute.before
      on shell, with the bash hook''s decision and text: push.test.ts compares 15 commands
      against the real fr-merged-pr-push-guard.sh (CI). gh pr merge is allowed by both
      engines, as R4''s today''s decision; its scenario tests/scenarios/opencode-plugin-v2.sh
      proves the delivery contract the hook rides on (one directory, cli.json naming
      the directory, an idempotent reinstall, an unparsable cli.json refused without
      writing, uninstall leaving foreign entries, and one load of the delivered directory
      in the real 2.x binary).'
    scenario: tests/scenarios/opencode-plugin-v2.sh
  - id: opencode-2-claim
    capability: OpenCode adaptation
    acceptance: A child session's first tool call claims its open unit on OpenCode 2.x,
      so fr run status names the holder instead of "an unclaimed agent"
    origin:
    - spec:2026-10-20-opencode-2-support#R7
    levels:
      unit:
      - super-fr:packages/fr-opencode-plugin/test/claim.test.ts
    status: ci
    notes: A child's first tool call runs fr run claim --open-unit with its id, agent
      and model, once per session (claim.test.ts, CI); fr's side names the holder (test_run_observed_resolve_opencode.py).
      Its scenario tests/scenarios/opencode-plugin-v2.sh proves the delivery contract
      the hook rides on (one directory, cli.json naming the directory, an idempotent
      reinstall, an unparsable cli.json refused without writing, uninstall leaving foreign
      entries, and one load of the delivered directory in the real 2.x binary); a live
      2.x claim has not been re-observed.
    scenario: tests/scenarios/opencode-plugin-v2.sh
  - id: opencode-2-pin
    capability: OpenCode adaptation
    acceptance: The fr binary the plugin resolved is pinned into shell commands as FR_HARNESS_FR
