    notes: 'Live walk on OpenCode 2.1.3 PASSED after the #1231 fix: idle.ts accepts
      session.execution.succeeded (2.1.x''s terminal event; session.idle kept for 2.0.x).
      One nudge appeared as a plugin-authored session message for the advanceable run
      and the model then ran fr run advance; exactly one nudge for three listeners on
      the one event pins the once-per-position guard.'
    verify: live
    issues:
    - derio-net/super-fr#1231
    walks:
