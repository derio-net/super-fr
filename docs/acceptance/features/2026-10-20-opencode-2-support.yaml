# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-10-20-opencode-2-support
repo: derio-net/super-fr
rows:
  - id: opencode-2-plugin-loads
    capability: OpenCode adaptation
    acceptance: The delivered super-fr plugin loads in OpenCode 2.x as a V2 plugin definition
      (id plus setup) and its hooks are registered
    origin:
    - spec:2026-10-20-opencode-2-support#R1
    levels:
      unit:
      - super-fr:packages/fr-opencode-plugin/test/plugin.test.ts
      - super-fr:packages/fr-opencode-plugin/test/wiring.test.ts
      - super-fr:packages/fr-opencode-plugin/test/registration.test.ts
      int:
      - super-fr:tests/integration/test_opencode_plugin_live.py#test_opencode_registers_the_delivered_plugin_exactly_once
      - super-fr:tests/integration/test_opencode_plugin_live.py#test_opencode_runs_the_delivered_gate
    status: ci
    notes: 'Retained existing CI coverage: delivered V2 super-fr loads and refuses base
      edits in test_opencode_plugin_live.py on CI-pinned versions. Added 2026-10-30
      synthetic registration-control regression for repository super-fr.development
      plus global super-fr: explicit -super-fr selects source setup once in either discovery
      order and repo-only use, including distinct module paths; real source edit gate
      denies a base edit. This is not a real 2.1.4 server-loader walk. Final isolated
      Bun run independently confirmed: 243 pass, 1 existing marker test fails because
      it assumes no container evidence inside a devcontainer. Global/repo registration
      on a real server remains unwalked for the new bytes; external RC14 failure evidence
      is in the debug journal.'
    verify: candidate
    scenario: tests/scenarios/opencode-plugin-v2.sh
  - id: opencode-2-edit-gate
    capability: OpenCode adaptation
    acceptance: Edits to tracked source in an fr-enabled repo are blocked from OpenCode
      2.x outside a valid isolation workspace, matching the Claude Code hook
    origin:
    - spec:2026-10-20-opencode-2-support#R2
    levels:
      unit:
      - super-fr:packages/fr-opencode-plugin/test/index.test.ts
      - super-fr:packages/fr-opencode-plugin/test/marker.test.ts
      int:
      - super-fr:tests/integration/test_opencode_plugin_live.py#test_opencode_runs_the_delivered_gate
    status: walked
    notes: 'Live walk on OpenCode 2.1.3 PASSED: a model-driven edit to a tracked spec
      in the base clone was refused with the fr-isolation message and git status stayed
      clean (Test Plan step 1). Re-walked with the model''s own report: the refusal
      came back as the model-visible tool result, and the model said so instead of retrying
      through another tool (#1227 proof 1).'
    verify: live
    walks:
    - strategy: live
      harness: opencode
      model: deepseek-v4.1-flash-free
      outcome: pass
      at: '2026-10-22T00:00:00Z'
      evidence: 'OpenCode 2.1.3 this session: edit tool on docs/superpowers/specs/2026-10-20-opencode-2-support-design.md
        refused; no file change'
    - strategy: live
      harness: opencode
      model: deepseek-v4.1-flash-free
      outcome: pass
      at: '2026-10-23T00:00:00Z'
      evidence: 'OpenCode 2.1.3: write tool on a tracked file in an fr-enabled clone
        -> failed tool call carrying the guard text; model reported the refusal; file
        unchanged (#1227 proof 1)'
  - id: opencode-2-bash-gate
    capability: OpenCode adaptation
    acceptance: During an active fr pipeline in OpenCode 2.x, a shell command whose
      cwd is inside the pipeline's base repo is denied, while the same command from
      the isolation worktree is allowed
    origin:
    - spec:2026-10-20-opencode-2-support#R3
    levels:
      unit:
      - super-fr:packages/fr-opencode-plugin/test/guard-verdicts.test.ts
      - super-fr:tests/unit/test_hooks_guard.py#test_the_verdict_table_covers_what_the_spec_names
    status: walked
    notes: 'Live walk on OpenCode 2.1.3 PASSED: with an active pipeline sentinel, a
      base-clone shell write was denied with the full escape list while git status from
      the archive workspace was allowed, and no probe file was created (Test Plan step
      2).'
    verify: live
    walks:
    - strategy: live
      harness: opencode
      model: deepseek-v4.1-flash-free
      outcome: pass
      at: '2026-10-22T00:00:00Z'
      evidence: 'OpenCode 2.1.3 this session: sentinel active; base-clone touch denied
        with escapes; workspace git status allowed; probe absent'
  - id: opencode-2-store-read
    capability: OpenCode adaptation
    acceptance: fr reads an OpenCode 2.0 session from session_v2 and session_message,
      and the transcript gates and usage reports see the same tool calls and figures
      the store holds
    origin:
    - spec:2026-10-20-opencode-2-support#R13
    levels:
      unit:
      - super-fr:tests/unit/test_run_observed_opencode_v2.py#test_a_2x_session_is_observed_end_to_end
      - super-fr:tests/unit/test_usage_opencode_store_agreement.py#test_both_readers_see_the_same_tool_calls_of_a_2x_session
      int:
      - super-fr:tests/integration/test_scenarios.py#test_opencode_store_v2
    status: ci
    notes: fr reads session_v2/session_message through the one adapter (fr.run.opencode_store);
      both readers see the same tool calls of a 2.x session on fixture stores, including
      a captured, redacted migrated 1.x session; the candidate scenario tests/scenarios/opencode-store-v2.sh
      runs in CI via test_scenarios.py.
    verify: candidate
    scenario: tests/scenarios/opencode-store-v2.sh
  - id: opencode-2-v1-refusal
    capability: OpenCode adaptation
    acceptance: An OpenCode 1.x session is refused with a reason naming OpenCode 1.x
      and the upgrade, never reported as an empty observation or as zeros
    origin:
    - spec:2026-10-20-opencode-2-support#R14
    levels:
      unit:
      - super-fr:tests/unit/test_run_observed_opencode_v2.py#test_a_1x_only_session_is_refused_naming_1x_and_the_upgrade
      - super-fr:tests/unit/test_usage_readers.py#test_opencode_1x_only_session_is_unavailable_naming_1x_and_the_upgrade
      - super-fr:tests/unit/test_usage_opencode_store_agreement.py#test_both_readers_refuse_a_1x_session_with_the_same_reason
      int:
      - super-fr:tests/integration/test_scenarios.py#test_opencode_store_v2
    status: ci
    notes: A v1-only session is probed as such and refused by both readers with the
      same reason naming OpenCode 1.x and the upgrade, never as empty or zero; covered
