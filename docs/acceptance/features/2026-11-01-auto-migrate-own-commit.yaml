# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-01-auto-migrate-own-commit
repo: derio-net/super-fr
rows:
  - id: auto-migrate-workspace-commits-alone
    capability: artifact migration gate
    acceptance: 'In a non-interactive fr-isolation workspace on a work branch, stale
      artifacts (including an excluded fr_version ceiling) are migrated and committed
      alone as chore(fr): migrate ..., on top of any existing work, and the command
      then runs'
    origin:
    - spec:2026-11-01-auto-migrate-own-commit#R1
    - spec:2026-11-01-auto-migrate-own-commit#R2
    - spec:2026-11-01-auto-migrate-own-commit#R7
    - spec:2026-11-01-auto-migrate-own-commit#R8
    levels:
      unit:
      - super-fr:tests/unit/test_migration_trigger.py#test_a_workspace_migrates_and_commits_the_migration_alone
      - super-fr:tests/unit/test_isolation_marker.py#test_a_linked_worktree_with_a_matching_marker_is_a_workspace
      int:
      - super-fr:tests/integration/test_scenarios.py#test_auto_migrate_workspace
    status: ci
    notes: pinned by the trigger's real-git workspace tests and the installed-CLI workspace
      scenario, both in CI
    verify: candidate
    scenario: tests/scenarios/auto-migrate-workspace.sh
  - id: auto-migrate-ci-in-place
    capability: artifact migration gate
    acceptance: In CI a stale but migratable checkout is migrated in place, never committed,
      with a warning (and a GitHub annotation), and the command runs; an unmigratable
      tree still fails
    origin:
    - spec:2026-11-01-auto-migrate-own-commit#R5
    - spec:2026-11-01-auto-migrate-own-commit#R10
    levels:
      unit:
      - super-fr:tests/unit/test_migration_trigger.py#test_ci_migrates_in_place_on_main_and_never_commits
      - super-fr:tests/unit/test_migration_trigger.py#test_ci_writes_its_warning_on_stderr_never_stdout
      - super-fr:tests/unit/test_migration_trigger.py#test_a_failing_migration_in_ci_refuses
      int:
      - super-fr:tests/integration/test_scenarios.py#test_auto_migrate_ci_in_place
    status: ci
    notes: pinned by the trigger's CI in-place tests and the installed-CLI CI scenario,
      both in CI
    verify: candidate
    scenario: tests/scenarios/auto-migrate-ci-in-place.sh
  - id: auto-migrate-refuses-outside-workspace
    capability: artifact migration gate
    acceptance: A non-interactive non-CI context outside a valid workspace (or with
      FR_NON_INTERACTIVE set) refuses, writes nothing, and names fr isolation up as
      the way to carry the migration
    origin:
    - spec:2026-11-01-auto-migrate-own-commit#R2
    - spec:2026-11-01-auto-migrate-own-commit#R3
    - spec:2026-11-01-auto-migrate-own-commit#R4
    levels:
      unit:
      - super-fr:tests/unit/test_migration_trigger.py#test_a_base_clone_on_a_branch_with_no_marker_refuses_and_names_isolation
      - super-fr:tests/unit/test_migration_trigger.py#test_fr_non_interactive_in_a_valid_workspace_refuses
      - super-fr:tests/unit/test_migration_trigger.py#test_a_drifted_workspace_refuses_naming_drift
      - super-fr:tests/unit/test_migration_trigger.py#test_fr_non_interactive_wins_over_a_tty
      - super-fr:tests/unit/test_isolation_marker.py#test_no_marker_is_not_a_workspace
    status: ci
    notes: unit tests over classify and the gate pin the refusal and its carry-it line;
      the workspace scenario's negative leg checks it installed
    verify: none
  - id: auto-migrate-git-guards-hold
    capability: artifact migration gate
    acceptance: No committing context ever auto-commits on the default branch, a detached
      HEAD, the wrong root, or over a file with uncommitted edits
    origin:
    - spec:2026-11-01-auto-migrate-own-commit#R6
    levels:
      unit:
      - super-fr:tests/unit/test_migration_trigger.py#test_a_workspace_on_the_default_branch_gets_the_default_branch_refusal
      - super-fr:tests/unit/test_migration_trigger.py#test_a_detached_workspace_gets_the_detached_refusal_not_enter_isolation
      - super-fr:tests/unit/test_migration_trigger.py#test_an_uncommitted_edit_in_a_workspace_is_held_back
      - super-fr:tests/unit/test_migration_trigger.py#test_ci_holds_back_an_uncommitted_edit
    status: ci
    notes: the default-branch, detached-HEAD and uncommitted-file guards re-pinned per
      committing context by unit tests in CI
    verify: none
  - id: auto-migrate-live-sweep
    capability: artifact migration gate
    acceptance: With the released fr, real stale repos get their migration as its own
      commit in the sweep's PRs, and a consumer main red only from stale artifacts goes
      green
    origin:
    - spec:2026-11-01-auto-migrate-own-commit#R1
    - spec:2026-11-01-auto-migrate-own-commit#R5
    - spec:2026-11-01-auto-migrate-own-commit#R9
    levels: {}
    status: walked
    notes: walked on first real use (cross-repo sweep 2026-11-02)
    verify: live
    walks:
    - strategy: live
      harness: claude-code
      model: claude-opus-5-5
      outcome: pass
      at: '2026-11-02T21:18:53Z'
      evidence: 'Walked 2026-11-02 on first real use, fr 6.1.0rc14 (consumer repos private,
        names redacted). (1) Workspace: in a stale private consumer repo''s fr workspace,
        the first ordinary command (fr acceptance status --brief) migrated 4 artifacts
        and committed them alone as ''chore(fr): migrate 4 artifacts to fr 6.1.0rc14''.
        (2) CI in place: a second private consumer''s main still carries a schema-4
        matrix with 13 skipped rows; its acceptance-report matrix job (fr from super-fr@main,
        Gitea runner) read them as 13 unwired and passed, so it migrated in place without
        committing. The in-place warning line was not visible in that step''s log. The
        sweep''s migrate PRs (17 repos) each carried the migration as its own commit.'
  - id: auto-migrate-nag-surfaces-commit
    capability: artifact migration gate
    acceptance: When a session's first fr command (the SessionStart acceptance nag)
      migrates and commits, the session is told which commit was made; a refused context's
      nag names fr isolation up
    origin:
    - spec:2026-11-01-auto-migrate-own-commit#R11
    levels:
      unit:
      - super-fr:tests/unit/test_hooks_acceptance_nag.py#test_the_gates_commit_notice_is_relayed_first
      - super-fr:tests/unit/test_hooks_acceptance_nag.py#test_a_stale_refusal_names_the_workspace_way_to_carry_it
      - super-fr:packages/fr-opencode-plugin/test/nag.test.ts
    status: ci
    notes: the hook and nag.ts are pinned by their shell and bun tests in CI
    verify: none
