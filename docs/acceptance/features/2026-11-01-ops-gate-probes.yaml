# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-01-ops-gate-probes
repo: derio-net/super-fr
rows:
  - id: ops-none-acknowledgement
    capability: fr ops
    acceptance: 'A plan''s ops.yaml can declare `none: <reason>` (no ops on purpose);
      it is refused beside a non-empty op list, never promotes the devops gate, and
      older ops.yaml files migrate to the new version'
    origin:
    - spec:2026-11-01-ops-gate-probes#R4
    levels:
      unit:
      - super-fr:tests/unit/test_ops_load.py#test_ops_none_beside_step_blocks_is_refused_by_name
      - super-fr:tests/unit/test_ops_load.py#test_a_none_file_loads_no_ops_and_never_counts_as_ops
      - super-fr:tests/unit/test_migration_ops_none.py#test_the_ops_chain_is_one_hop_to_two
    status: ci
    notes: 'R4 unit-pinned: loader/model refusals, plan_has_ops false, ops kind 1->2
      stamp-only migration chain'
    verify: none
  - id: ops-gap-advisory
    capability: fr ops gap
    acceptance: A devops-gated run with no ops and Test Plan steps containing commands
      is warned about by fr plan self-review and at spec-review (naming the steps and
      commands), and a step pointer naming an undeclared op is a self-review error
    origin:
    - spec:2026-11-01-ops-gate-probes#R1
    - spec:2026-11-01-ops-gate-probes#R2
    - spec:2026-11-01-ops-gate-probes#R3
    - spec:2026-11-01-ops-gate-probes#R7
    levels:
      unit:
      - super-fr:tests/unit/test_ops_gap.py#test_an_inline_span_starting_with_a_shipped_tool_is_a_command
      - super-fr:tests/unit/test_plan_ops.py#test_self_review_warns_of_an_ops_gap
      - super-fr:tests/unit/test_plan_ops.py#test_a_pointer_to_an_undeclared_op_is_an_error
    status: ci
    notes: 'R1-R3, R7 unit-pinned: the gap function, self-review warn/errors, spec-review
      stderr warning; CI test job'
    verify: none
  - id: ops-gate-gap-refusal
    capability: fr ops gate
    acceptance: fr ops gate stage 1 refuses, bringing nothing up, a devops-gated run
      whose plan has no ops and whose Test Plan has command steps, naming them and both
      fixes; a `none:` acknowledgement lets it proceed
    origin:
    - spec:2026-11-01-ops-gate-probes#R5
    levels:
      unit:
      - super-fr:tests/unit/test_ops_gate.py#test_stage_1_refuses_an_ops_gap_before_anything_is_brought_up
      - super-fr:tests/unit/test_ops_gate.py#test_stage_1_reads_a_merged_prs_gap_from_the_default_branch_tip
      int:
      - super-fr:tests/integration/test_scenarios.py#test_fr_ops_gate_probes
    status: ci
    notes: 'R5: unit (open and merged PR) plus the fr-ops-gate-probes scenario, which
      CI runs via test_scenarios'
    verify: candidate
    scenario: tests/scenarios/fr-ops-gate-probes.sh
  - id: ops-gate-step-probe
    capability: fr ops gate
    acceptance: 'A Test Plan step pointing at an op is probed at stage 5: DONE records
      `ran` with the probe''s output without asking, a failing probe shows its reason
      and asks retry/na/owed only'
    origin:
    - spec:2026-11-01-ops-gate-probes#R6
    - spec:2026-11-01-ops-gate-probes#R8
    - spec:2026-11-01-ops-gate-probes#R9
    levels:
      unit:
      - super-fr:tests/unit/test_ops_gate.py#test_a_passing_probe_records_ran_with_its_evidence_and_asks_nothing
      int:
      - super-fr:tests/integration/test_scenarios.py#test_fr_ops_gate_probes
    status: ci
    notes: 'R6, R8, R9: unit plus the scenario asserting the committed ran evidence
      omits data lines'
    verify: candidate
    scenario: tests/scenarios/fr-ops-gate-probes.sh
  - id: ops-gate-answer-grammar
    capability: fr ops gate
    acceptance: 'Stage 5 accepts `ran: x` and `na - y`, and re-prompts a malformed answer
      echoing it and the grammar instead of failing the stage'
    origin:
    - spec:2026-11-01-ops-gate-probes#R10
    levels:
      unit:
      - super-fr:tests/unit/test_ops_gate.py#test_a_non_matching_answer_is_reprompted_with_an_echo
      int:
      - super-fr:tests/integration/test_scenarios.py#test_fr_ops_gate_probes
    status: ci
    notes: 'R10: unit (accepted/re-prompted cases, three-miss failure) plus the scenario''s
      re-prompted bare ran'
    verify: candidate
    scenario: tests/scenarios/fr-ops-gate-probes.sh
  - id: ops-gate-probes-first-real-use
    capability: fr ops gate
    acceptance: On a real devops-gated run, pointed steps are probed and recorded with
      real output and natural `ran:` answers are accepted
    origin:
    - spec:2026-11-01-ops-gate-probes#R8
    - spec:2026-11-01-ops-gate-probes#R10
    levels: {}
    status: walk-owed
    notes: 'walked on first real use: the next real devops-gated run (tracked derio-net/super-fr#1294)'
    verify: live
    issues:
    - derio-net/super-fr#1294
  - id: ops-stub-cli
    capability: fr ops stub
    acceptance: fr ops stub previews, and with --yes writes, ops.yaml stubs and step
      pointers for a spec's command steps, refusing a duplicate id or an acknowledged
      `none:`
    origin:
    - spec:2026-11-01-ops-gate-probes#R11
    levels:
      unit:
      - super-fr:tests/unit/test_ops_stub.py#test_one_op_per_devops_command_step_without_a_pointer
      - super-fr:tests/unit/test_ops_stub.py#test_the_pointer_goes_after_the_tag
    status: ci
    notes: 'R11: pure proposer and CLI tests incl. refusals, append-only ops.yaml, CRLF,
      rollback'
