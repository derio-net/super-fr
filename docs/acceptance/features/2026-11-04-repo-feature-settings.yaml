# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-11-04-repo-feature-settings
repo: derio-net/super-fr
rows:
  - id: repo-settings-file
    capability: repo-feature-settings
    acceptance: Settings live with the placement and are read from the default ref;
      fr settings init/show/paths/check generate a fully commented defaults file, show
      each key's source, and refuse unknown keys, unservable placements and incoherent
      combinations
    origin:
    - spec:2026-11-04-repo-feature-settings#R2
    levels:
      unit:
      - super-fr:tests/unit/test_settings_load.py#test_a_file_on_the_default_branch_is_read_with_source_repo
      int:
      - super-fr:tests/integration/test_scenarios.py#test_repo_settings_file
    status: ci
    notes: 'settings core built: closed schema, default-ref loader, init/show/check;
      scenario in CI'
    verify: candidate
    scenario: tests/scenarios/repo-settings-file.sh
  - id: repo-settings-policy-off
    capability: repo-feature-settings
    acceptance: With acceptance, test_plan or gates off, fr writes none of that feature,
      refuses what would write it at authoring time, and every surface reports it as
      disabled by repo setting rather than none
    origin:
    - spec:2026-11-04-repo-feature-settings#R6
    levels:
      unit:
      - super-fr:tests/unit/test_policy_off_acceptance.py#test_add_set_status_and_init_are_refused_naming_the_setting
      int:
      - super-fr:tests/integration/test_scenarios.py#test_repo_settings_policy_off
    status: ci
    notes: policy off built; scenario in CI
    verify: candidate
    scenario: tests/scenarios/repo-settings-policy-off.sh
  - id: repo-settings-forge-quiet
    capability: repo-feature-settings
    acceptance: With forge labels, comments or issues off, neither fr nor the CI it
      scaffolds makes such a write; under pr_body minimal the live PR carries no fr
      marker or section while the full body is kept for the operator
    origin:
    - spec:2026-11-04-repo-feature-settings#R9
    levels:
      unit:
      - super-fr:tests/unit/test_forge_quiet_pr_body.py#test_minimal_a_plain_live_body_delivers_and_keeps_the_render_durable
      int:
      - super-fr:tests/integration/test_scenarios.py#test_repo_settings_forge_quiet
    status: ci
    notes: forge quiet built; scenario in CI
    verify: candidate
    scenario: tests/scenarios/repo-settings-forge-quiet.sh
  - id: repo-settings-git-policy
    capability: repo-feature-settings
    acceptance: Under push or pr ask nothing reaches the remote without a verified operator
      answer; squash-unpushed never rewrites pushed history or migration commits; pushed
      subjects follow the repo's with-issue or without-issue template
    origin:
    - spec:2026-11-04-repo-feature-settings#R11
    levels:
      unit:
      - super-fr:tests/unit/test_git_policy_push.py#test_squash_keeps_migration_and_merge_commits_and_squashes_the_segments_between
      - super-fr:tests/unit/test_git_policy_push.py#test_push_ask_refuses_naming_the_harness_when_the_transcript_is_unobservable
      - super-fr:tests/unit/test_git_policy_templates.py#test_default_templates_keep_every_fr_subject_byte_identical
      int:
      - super-fr:tests/integration/test_scenarios.py#test_repo_settings_git_policy
    status: ci
    notes: git policy built; scenario in CI
    verify: candidate
    scenario: tests/scenarios/repo-settings-git-policy.sh
  - id: acceptance-fragments-amendments
    capability: repo-feature-settings
    acceptance: A later feature changes an earlier feature's rows only by appending
      amendments in its own fragment; the effective matrix is the fold over merged features,
      and a stale-base amendment is refused before merge or marks its row contested
    origin:
    - spec:2026-11-04-repo-feature-settings#R16
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_amend.py#test_set_status_on_a_merged_row_appends_amendments_and_leaves_its_owner_alone
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_fragments_amendments
    status: ci
    notes: amend ops, record amendment shape, stale-base refusal at check/deliver, contested
      rows as debt
    scenario: tests/scenarios/acceptance-fragments-amendments.sh
    issues:
    - derio-net/super-fr#1379
  - id: acceptance-matrix-migration
    capability: repo-feature-settings
    acceptance: An existing repo's single matrix migrates to per-feature fragments with
      logical refs and no row lost
    origin:
    - spec:2026-11-04-repo-feature-settings#R19
    levels:
      unit:
      - super-fr:tests/unit/test_migration_matrix_fragments.py#test_the_split_writes_one_fragment_per_origin_spec_and_a_legacy_one
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_matrix_migration
    status: ci
    notes: matrix split into per-feature fragments with logical refs; matrix kind retired
      behind MatrixV5; this repo migrated
    scenario: tests/scenarios/acceptance-matrix-migration.sh
    issues:
    - derio-net/super-fr#1379
  - id: acceptance-reports-derived-published
    capability: repo-feature-settings
    acceptance: Acceptance reports are one documented command away and are published
      per PR and on Pages in repo placement, never on Pages wider than the repo
    origin:
    - spec:2026-11-04-repo-feature-settings#R20
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_pages_visibility.py#test_pages_check_exit_0_when_allowed
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_reports_derived_published
    status: ci
    notes: reports derived (report --open), CI job summary/exposed artifact, Pages only
      where no wider than the repo, report_comment
    scenario: tests/scenarios/acceptance-reports-derived-published.sh
    issues:
    - derio-net/super-fr#1379
  - id: placement-quiet
    capability: repo-feature-settings
    acceptance: In a quiet repo no fr file or commit reaches the default or feature
      branches, the fr branch is append-only and pushed atomically with code, and a
      missing or changed switch refuses instead of falling back
    origin:
    - spec:2026-11-04-repo-feature-settings#R23
    levels: {}
    status: not-implemented
    notes: built by plan 3 of the repo-feature-settings spec (R29), tracked in derio-net/super-fr#1380
    issues:
    - derio-net/super-fr#1380
  - id: placement-stealth
    capability: repo-feature-settings
    acceptance: A stealth run leaves only code and one minimal draft PR in the target,
      fails fast without its tracking repo, and resumes from the tracking repo on any
      host
    origin:
    - spec:2026-11-04-repo-feature-settings#R24
    levels: {}
    status: not-implemented
    notes: built by plan 3 of the repo-feature-settings spec (R29), tracked in derio-net/super-fr#1380
    issues:
    - derio-net/super-fr#1380
  - id: placement-move-and-drift
    capability: repo-feature-settings
    acceptance: A repo moves between any two placements with equal folds before and
      after, and an in-flight branch under the old placement is refused until migrate-branch
      moves it
    origin:
    - spec:2026-11-04-repo-feature-settings#R27
    levels: {}
    status: not-implemented
    notes: built by plan 3 of the repo-feature-settings spec (R29), tracked in derio-net/super-fr#1380
    issues:
    - derio-net/super-fr#1380
  - id: repo-settings-quiet-repo-live
    capability: repo-feature-settings
    acceptance: On a real forge, quiet and stealth fr-goal runs leave no fr trace in
      the product repo or on its forge
    origin:
    - spec:2026-11-04-repo-feature-settings#R23
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: acceptance-effective-matrix-fold
    capability: repo-feature-settings
    acceptance: 'The effective acceptance matrix is never stored: it is folded from
      merged features'' fragments in default-ref first-parent order plus the branch''s
      own pending ones, with logical spec/plan refs resolving to repo paths, and an
      abandoned feature''s rows and amendments never apply'
    origin:
    - spec:2026-11-04-repo-feature-settings#R17
    - spec:2026-11-04-repo-feature-settings#R18
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_fold.py#test_amendments_apply_in_merge_order_not_name_order
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_effective_matrix_fold
    status: ci
    notes: 'fold built: merged first-parent order, pending amendments, revisions and
      contested; logical spec/plan refs resolve repo-only'
    verify: candidate
    scenario: tests/scenarios/acceptance-effective-matrix-fold.sh
    issues:
    - derio-net/super-fr#1379
  - id: placement-resolver
    capability: repo-feature-settings
    acceptance: Every artifact path comes from one resolver keyed by kind and placement,
      across the Python modules, hooks, OpenCode plugin, Hermes hook and CI templates;
      a hardcoded artifact path anywhere else fails CI
    origin:
    - spec:2026-11-04-repo-feature-settings#R1
    levels: {}
    status: not-implemented
    notes: added at planning (plan 3); scenario tests/scenarios/placement-resolver.sh
      is built by plan 2026-11-12-placement-resolver
    scenario: tests/scenarios/placement-resolver.sh
  - id: placement-merged-status
    capability: repo-feature-settings
    acceptance: Under quiet and stealth a feature's merged status and order come from
      its code branch's merge into the default ref; merged records are a cache and archive
      moves nothing
    origin:
    - spec:2026-11-04-repo-feature-settings#R25
    levels: {}
    status: not-implemented
    notes: added at planning (plan 3); scenario tests/scenarios/placement-merged-status.sh
      is built by plan 2026-11-12-placement-resolver
    scenario: tests/scenarios/placement-merged-status.sh
  - id: placement-fr-enabled
    capability: repo-feature-settings
    acceptance: A quiet fr-branch switch and a stealth workspace count as fr-enabled
      in the bash decision library, the OpenCode plugin and the Hermes hook, each with
      its parity row
    origin:
    - spec:2026-11-04-repo-feature-settings#R26
    levels: {}
    status: not-implemented
    notes: added at planning (plan 3); scenario tests/scenarios/placement-fr-enabled.sh
      is built by plan 2026-11-12-placement-resolver
    scenario: tests/scenarios/placement-fr-enabled.sh
amendments:
  - row: acceptance-report-formats
    op: reword
    base: 0
    acceptance: 'The report renders on demand from the folded matrix in three forms:
      local-link HTML, github-link HTML and github Markdown (fr acceptance report --format
      md); none is committed.'
    why: 'Spec 2026-11-04-repo-feature-settings R20: reports are derived, never committed.'
  - row: acceptance-report-dual
    op: reword
    base: 0
    acceptance: Every report form is rendered from the same matrix on demand and published
      from the folded fragments in CI; none is committed or regenerated on matrix mutation.
    why: 'Spec 2026-11-04-repo-feature-settings R20: reports are derived, never committed.'
  - row: acceptance-report-drift-gate
    op: reword
    base: 0
    acceptance: 'A committed report cannot drift from the matrix because none is committed:
      fr acceptance check fails when a report file is tracked.'
    why: 'Spec 2026-11-04-repo-feature-settings R20: reports are derived, never committed.'
  - row: acceptance-report-dual-gate
    op: retire
    base: 0
    notes: 'Retired: Spec 2026-11-04-repo-feature-settings R20: reports are derived,
      never committed. The committed report set, its drift gate and regeneration on
      matrix mutation are removed; rendering is on demand (fr acceptance report --open)
      and published from the folded fragments in CI.'
    why: 'Spec 2026-11-04-repo-feature-settings R20: reports are derived, never committed.'
