# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 1
feature: 2026-11-13-writing-standards-docs
repo: derio-net/super-fr
rows:
  - id: writing-standards-docs-groups
    capability: published-docs
    acceptance: 'Each published page is held to its group''s writing standard: guides
      and reference to STE, explainers to plain language, why-fr to Elements of Style,
      the landing page to none.'
    origin:
    - spec:2026-11-13-writing-standards-docs#R1
    - spec:2026-11-13-writing-standards-docs#R2
    - spec:2026-11-13-writing-standards-docs#R3
    - spec:2026-11-13-writing-standards-docs#R4
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: writing-standards-docs-ci-gate
    capability: published-docs
    acceptance: A pull request that leaves a published page failing its writing standard
      fails CI, against the pinned blog-craft checker, and every page still renders.
    origin:
    - spec:2026-11-13-writing-standards-docs#R5
    - spec:2026-11-13-writing-standards-docs#R6
    - spec:2026-11-13-writing-standards-docs#R11
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: writing-standards-docs-guides
    capability: published-docs
    acceptance: Every guide and reference page reads to STE with every fact, command,
      link and number of the previous version kept.
    origin:
    - spec:2026-11-13-writing-standards-docs#R7
    - spec:2026-11-13-writing-standards-docs#R8
    - spec:2026-11-13-writing-standards-docs#R9
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: writing-standards-docs-explainers
    capability: published-docs
    acceptance: Every explainer reads to plain language (why-fr to Elements of Style)
      with every fact, command, link and number kept, and any remaining warning justified.
    origin:
    - spec:2026-11-13-writing-standards-docs#R7
    - spec:2026-11-13-writing-standards-docs#R8
    - spec:2026-11-13-writing-standards-docs#R9
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: writing-standards-docs-authoring-rule
    capability: published-docs
    acceptance: An author editing a published page can find which standard it follows
      and run the same check CI runs.
    origin:
    - spec:2026-11-13-writing-standards-docs#R10
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: writing-standards-docs-accuracy
    capability: published-docs
    acceptance: 'Every published page says what the code does: each claim was checked
      against the code it covers, and each wrong or stale one was corrected or shown
      true, with evidence.'
    origin:
    - spec:2026-11-13-writing-standards-docs#R13
    - spec:2026-11-13-writing-standards-docs#R14
    levels: {}
    status: not-implemented
    notes: per-page accuracy reviews owed (phases 2-6)
    verify: none
  - id: writing-standards-docs-accuracy-lens
    capability: published-docs
    acceptance: Every later change to a published page, made through an fr-goal run,
      gets a review of that page against the code, so pages stay accurate.
    origin:
    - spec:2026-11-13-writing-standards-docs#R15
    - spec:2026-11-13-writing-standards-docs#R16
    levels: {}
    status: not-implemented
    notes: lens and rule owed (phase 6)
    verify: none
