# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-14-acceptance-local-status
repo: derio-net/super-fr
rows:
  - id: acceptance-local-status-listed
    capability: Acceptance matrix
    acceptance: A row may be `local`; status, debt, the report, the digest and the triage
      board list it with its stamp date and never count a fresh one as debt
    origin:
    - spec:2026-11-14-acceptance-local-status#R1
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_local.py#test_local_is_a_listed_status_and_never_debt
      - super-fr:tests/unit/test_acceptance_local_surfaces.py#test_a_fresh_local_row_is_listed_not_debt_until_its_test_changes
      - super-fr:tests/unit/test_acceptance_local_surfaces.py#test_the_report_shows_local_with_its_date_or_reason
      - super-fr:tests/unit/test_acceptance_local_surfaces.py#test_the_board_counts_local_debt
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_local_status
    status: ci
    notes: Unit tests over status, debt, the report, digest and board, and the installed-candidate
      scenario (fresh local row listed, not debt), run in CI
    verify: candidate
    scenario: tests/scenarios/acceptance-local-status.sh
  - id: acceptance-local-earned
    capability: Acceptance matrix
    acceptance: Setting `local` is refused by every writer unless the row has a level
      ref resolving to an existing test, and refused while the repo has CI; an existing
      `local` row in a repo with CI is debt (promote to ci)
    origin:
    - spec:2026-11-14-acceptance-local-status#R2
    - spec:2026-11-14-acceptance-local-status#R3
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_local_writers.py#test_add_local_with_no_level_is_refused
      - super-fr:tests/unit/test_acceptance_local_writers.py#test_set_status_local_in_a_repo_with_ci_is_refused
      - super-fr:tests/unit/test_acceptance_local_writers.py#test_amend_set_status_local_with_a_missing_test_is_refused
      - super-fr:tests/unit/test_acceptance_local.py#test_a_local_row_in_a_repo_with_ci_is_promote_to_ci
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_local_status
    status: ci
    notes: Every writer's refusals unit-tested; the scenario shows the no-level refusal,
      the write, and the refusal once CI is declared; run in CI
    verify: candidate
    scenario: tests/scenarios/acceptance-local-status.sh
  - id: acceptance-local-stale
    capability: Acceptance matrix
    acceptance: A `local` row whose stamped test file changed or vanished, or that has
      no stamp, counts as debt and `fr acceptance check` reports it
    origin:
    - spec:2026-11-14-acceptance-local-status#R5
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_local.py#test_a_committed_edit_makes_it_stale
      - super-fr:tests/unit/test_acceptance_local.py#test_a_deleted_file_makes_it_stale
      - super-fr:tests/unit/test_acceptance_local.py#test_a_local_row_with_no_stamp_is_unstamped
      - super-fr:tests/unit/test_acceptance_local_surfaces.py#test_status_and_check_list_an_unstamped_local_row_as_debt
      int:
      - super-fr:tests/integration/test_scenarios.py#test_acceptance_local_status
    status: ci
    notes: Stale and unstamped debt unit-tested; the scenario shows check reporting
      local, stale and local, unstamped; run in CI
    verify: candidate
    scenario: tests/scenarios/acceptance-local-status.sh
  - id: acceptance-local-deliver-stamp
    capability: fr-goal deliver
    acceptance: Under ci none, deliver stamps the run's `local` rows from its verified
      local suite log (or a reuse of one), refuses otherwise, and its leftover refusal
      offers `local` before the tester gate
    origin:
    - spec:2026-11-14-acceptance-local-status#R4
    - spec:2026-11-14-acceptance-local-status#R6
    levels:
      unit:
      - super-fr:tests/unit/test_deliver_local_stamp.py#test_a_local_row_is_stamped_in_the_deliver_commit
      - super-fr:tests/unit/test_deliver_local_stamp.py#test_a_later_refusal_writes_no_stamp
      - super-fr:tests/unit/test_deliver_local_stamp.py#test_a_fresh_log_over_an_uncommitted_code_path_refuses_naming_the_row
      - super-fr:tests/unit/test_deliver_local_stamp.py#test_tests_reuse_stamps_with_the_witness_tree
      - super-fr:tests/unit/test_deliver_local_stamp.py#test_a_pending_set_status_amendment_is_stamped_in_place
      - super-fr:tests/unit/test_deliver_local_stamp.py#test_under_quiet_the_fragment_is_written_in_the_artifact_root
      - super-fr:tests/unit/test_deliver_leftovers.py#test_under_ci_none_the_row_fix_offers_local_first
      - super-fr:tests/unit/test_deliver_leftovers.py#test_with_ci_the_row_fix_is_unchanged
    status: ci
    notes: 'In-process deliver resolves over a no-CI fixture: the stamp in the resolve
      commit, no stamp on a later refusal, a dirty tree refused, reuse, an amendment,
      quiet placement; the leftover fix offers local; run in CI'
    verify: none
  - id: acceptance-local-held-quiet-walk
    capability: fr-goal deliver
    acceptance: A real repo with no CI delivers a unit-tested feature with its rows
      `local`, no tester gate and no issue
    origin:
    - spec:2026-11-14-acceptance-local-status#R4
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: acceptance-local-artifact-migration
    capability: Artifact versioning
    acceptance: Fragments and step records written before `local` existed migrate to
      the new stamps, and the validator refuses a malformed local stamp
    origin:
    - spec:2026-11-14-acceptance-local-status#R7
    levels:
      unit:
      - super-fr:tests/unit/test_migration_fragment_local.py#test_the_fragment_chain_from_one_reaches_two_hop_by_hop
      - super-fr:tests/unit/test_migration_fragment_local.py#test_a_v1_fragment_migrates_by_its_stamp_alone
      - super-fr:tests/unit/test_migration_fragment_local.py#test_the_validator_refuses_a_malformed_stamp
      - super-fr:tests/unit/test_migration_fragment_local.py#test_the_validator_refuses_a_stamp_on_a_row_that_is_not_local
    status: ci
    notes: The hop-by-hop chain test, the stamp-only migration and the validator, plus
      fr validate artifacts, run in CI
    verify: none
amendments:
  - row: acceptance-local-held-quiet-walk
    op: set-status
    base: 0
    status: walked
    notes: 'walked live: the held quiet-placement walk resumed on rc.8 and delivered
      with its row local, no gate and no issue'
    walk:
      strategy: live
      harness: claude-code
      model: claude-opus-5-5
      outcome: pass
      at: '2026-11-14T19:12:42Z'
      evidence: '2026-11-14 on GitHub, fr 7.0.0-rc.8, private scratch repo derio-net/fr-walk-quiet
        (quiet placement, fr services: ci none). The held run 2026-11-13-feat-whisper
        resumed at deliver: the leftover refusal offered set-status --status local first;
        whisper-lowercases was set local with level fr-walk-quiet:tests/test_whisper.py#test_whisper_lowercases_mixed_case;
        deliver resolved (24174b7) and stamped the row (at 2026-11-14, tree, log full-suite.log@e0a6ea218ea5,
        blob of tests/test_whisper.py). fr acceptance status shows [local 2026-11-14]
        and no acceptance debt; fr debt shows 0 items. No tester gate was added and
        the repo has no issue. Found on the way: the pending deliver record had to be
        changed to local too (1456).'
    why: 'walked live: the held quiet-placement walk resumed on rc.8 and delivered with
      its row local, no gate and no issue'
