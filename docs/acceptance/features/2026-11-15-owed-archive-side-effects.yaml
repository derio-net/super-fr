# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-15-owed-archive-side-effects
repo: derio-net/super-fr
rows:
  - id: owed-close-at-merge
    capability: debt
    acceptance: Discharging an owed entry off the default branch closes no issue and
      prints the Closes line for the PR; on the default branch it closes the issue;
      deliver's PR body carries a Closes line for every owed entry the run discharged.
    origin:
    - spec:2026-11-15-owed-archive-side-effects#R1
    - spec:2026-11-15-owed-archive-side-effects#R2
    - spec:2026-11-15-owed-archive-side-effects#R3
    - spec:2026-11-15-owed-archive-side-effects#R4
    - spec:2026-11-15-owed-archive-side-effects#R5
    levels: {}
    status: not-implemented
    notes: ''
    verify: candidate
    scenario: tests/scenarios/owed-close-at-merge.sh
  - id: archive-refusal-writes-nothing
    capability: archive
    acceptance: A refused fr archive leaves the working tree, the index and the forge
      as they were, and on the default branch a held plan records no owed entry.
    origin:
    - spec:2026-11-15-owed-archive-side-effects#R6
    - spec:2026-11-15-owed-archive-side-effects#R7
    levels: {}
    status: not-implemented
    notes: ''
    verify: candidate
    scenario: tests/scenarios/archive-refusal-writes-nothing.sh
  - id: archive-dry-run
    capability: archive
    acceptance: fr archive --dry-run reports the moves, owed entries and issues a run
      would make, changes no file, index or forge state, and exits with the real run's
      code.
    origin:
    - spec:2026-11-15-owed-archive-side-effects#R8
    - spec:2026-11-15-owed-archive-side-effects#R9
    levels: {}
    status: not-implemented
    notes: ''
    verify: candidate
    scenario: tests/scenarios/archive-dry-run.sh
  - id: owed-reuse-uncapped
    capability: archive
    acceptance: 'fr never files a duplicate fr:owed issue however many open issues the
      repo has: it finds existing ones by label, and files nothing when its listing
      cannot be complete.'
    origin:
    - spec:2026-11-15-owed-archive-side-effects#R10
    - spec:2026-11-15-owed-archive-side-effects#R11
    levels: {}
    status: not-implemented
    notes: ''
    verify: candidate
    scenario: tests/scenarios/owed-reuse-uncapped.sh
amendments:
  - row: debt-owed-discharge
    op: reword
    base: 0
    acceptance: '`fr debt` lists owed actions from owed/awaiting-live issues, held manual
      phases, walk-owed rows and unresolved owed entries (archived included), and resolving
      an owed entry with evidence removes it and closes its issue once the discharge
      reaches the default branch.'
    why: 'spec 2026-11-15-owed-archive-side-effects R5 amends debt-engine R24: the issue
      closes when the discharge reaches the default branch'
