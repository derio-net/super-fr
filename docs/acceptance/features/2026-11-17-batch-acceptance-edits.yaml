# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-17-batch-acceptance-edits
repo: derio-net/super-fr
rows:
  - id: acceptance-amend-origin-only-keeps-statement
    capability: acceptance
    acceptance: An origin-only `fr acceptance amend --op reword --origin` changes only
      the row's origin, never restating a pending reword's statement in the row.
    origin:
    - spec:2026-11-17-batch-acceptance-edits#R1
    - spec:2026-11-17-batch-acceptance-edits#R2
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_amend_origin.py#test_origin_only_reword_keeps_the_rows_own_statement_under_a_pending_reword
      - super-fr:tests/unit/test_acceptance_amend_origin.py#test_origin_only_reword_refusals_still_change_nothing
    status: ci
    notes: 'Unit-pinned in CI: an origin-only reword under a pending reword keeps the
      row''s own statement; the refusals move no byte.'
    verify: none
  - id: fragment-design-spelling-repair
    capability: acceptance
    acceptance: '`fr migrate artifacts` renames a `<slug>-design.yaml` acceptance fragment
      to `<slug>.yaml`, merging into an existing one and refusing by id when the two
      disagree, without changing the effective matrix.'
    origin:
    - spec:2026-11-17-batch-acceptance-edits#R13
    - spec:2026-11-17-batch-acceptance-edits#R14
    - spec:2026-11-17-batch-acceptance-edits#R15
    - spec:2026-11-17-batch-acceptance-edits#R16
    - spec:2026-11-17-batch-acceptance-edits#R17
    levels:
      unit:
      - super-fr:tests/unit/test_migration_fragment_design_name.py
      - super-fr:tests/unit/test_acceptance_design_spelling_merged.py
    status: ci
    notes: 'Unit-pinned in CI: the repair renames, merges, keeps an identical entry
      once, refuses by id, holds back on an uncommitted slug file and keeps the fold;
      check reads a merged -design fragment as its one spelling.'
    verify: none
  - id: spec-repairs-name-undecodable-files
    capability: migration
    acceptance: A spec or matrix that is not UTF-8 text is refused by `fr migrate artifacts`
      and the CLI-entry gate with a reason naming the file, the byte and its offset,
      never a codec error, and is left untouched.
    origin:
    - spec:2026-11-17-batch-acceptance-edits#R5
    - spec:2026-11-17-batch-acceptance-edits#R6
    - spec:2026-11-17-batch-acceptance-edits#R7
    levels:
      unit:
      - super-fr:tests/unit/test_test_plan_heading.py#test_a_non_utf8_spec_fails_the_migration_by_name_and_stays_byte_identical
      - super-fr:tests/unit/test_test_plan_heading.py#test_the_gate_refuses_a_non_utf8_spec_naming_it_without_a_codec_error
      - super-fr:tests/unit/test_migration_matrix_fragments.py#test_a_non_utf8_matrix_fails_by_name_and_stays_byte_identical
    status: ci
    notes: 'Unit tests in CI: a non-UTF-8 spec and v5 matrix fail run_migrations, the
      repairs and the CLI-entry gate with ''<path> is not UTF-8 text (byte 0xff at offset
      n)'', no codec text, file byte-identical.'
    verify: none
  - id: adopt-run-id-from-plan-slug
    capability: run
    acceptance: Adopting in-flight plans names each run after its plan, so `fr migrate
      artifacts --yes --adopt` on one branch adopts every adoptable plan, one run each.
    origin:
    - spec:2026-11-17-batch-acceptance-edits#R9
    - spec:2026-11-17-batch-acceptance-edits#R10
    - spec:2026-11-17-batch-acceptance-edits#R11
    levels:
      unit:
      - super-fr:tests/unit/test_run_adopt.py#test_migrate_adopt_adopts_every_in_flight_plan_on_one_branch
      - super-fr:tests/unit/test_run_adopt.py#test_a_plan_adopted_with_no_run_id_is_named_after_its_folder
      - super-fr:tests/unit/test_run_adopt.py#test_an_explicit_run_id_wins_and_an_existing_one_still_refuses
    status: ci
    notes: 'Unit tests in CI: a plan adopted with no --run-id is named after its folder,
      a spec-only adoption keeps <date>-<branch>, --run-id wins and an existing id refuses,
      and migrate --yes --adopt adopts three plans on one branch with none offered after.'
    verify: none
  - id: adopt-default-branch-warning
    capability: run
    acceptance: Adopting a run onto the repository's default branch warns once for that
      run, naming the branch and `--branch`, and still adopts.
    origin:
    - spec:2026-11-17-batch-acceptance-edits#R12
    levels:
      unit:
      - super-fr:tests/unit/test_run_adopt.py#test_adopting_onto_the_default_branch_warns_once_naming_it_and_branch
      - super-fr:tests/unit/test_run_adopt.py#test_adopting_onto_another_branch_or_with_no_remote_does_not_warn
    status: ci
    notes: 'Unit tests in CI: adopting onto origin''s default branch adds one note naming
      it and --branch; another branch, or no remote, adds none.'
    verify: none
