# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-19-batch-docs-wording
repo: derio-net/super-fr
rows:
  - id: cli-help-matches-code
    capability: cli
    acceptance: 'fr''s help and hints state what the code does: the ops-gate scaffold
      hint is a complete command that says where to scaffold, seal''s {target} is the
      shell-quoted path, rework accepts a live or archived parent, and scaffold''s <tool>[@<version>]
      prints as written.'
    origin:
    - spec:2026-11-19-batch-docs-wording#R1
    - spec:2026-11-19-batch-docs-wording#R2
    - spec:2026-11-19-batch-docs-wording#R3
    - spec:2026-11-19-batch-docs-wording#R4
    levels:
      unit:
      - super-fr:tests/unit/test_ops_gate_cmd.py#test_no_ops_profile_is_refused_naming_scaffold
      - super-fr:tests/unit/test_ops_gate_cmd.py#test_seal_help_says_target_is_the_quoted_path
      - super-fr:tests/unit/test_ops_gate_cmd.py#test_plan_rework_help_names_live_or_archived_parents
    status: ci
    notes: 'R1-R4: hint, seal and rework help asserted against rendered output; bracket
      escapes covered by cli-help-rich-markup-safe'
    verify: none
  - id: cli-help-rich-markup-safe
    capability: cli
    acceptance: No fr command's rendered --help loses bracketed text from its help strings
      to Rich markup; a test over every command fails naming the one that does.
    origin:
    - spec:2026-11-19-batch-docs-wording#R5
    levels:
      unit:
      - super-fr:tests/unit/test_cli_help_brackets.py#test_every_fr_help_shows_its_bracketed_text
      - super-fr:tests/unit/test_cli_help_brackets.py#test_the_checker_reports_an_unescaped_bracket
    status: ci
    notes: 'R5: every command''s rendered --help holds its bracketed help text'
    verify: none
  - id: cli-reference-ste
    capability: published-docs
    acceptance: The generated command tree in the CLI reference page passes the STE
      writing standard, and the page is checked as a reference page with no exemption.
    origin:
    - spec:2026-11-19-batch-docs-wording#R6
    levels:
      unit:
      - super-fr:tests/unit/test_writing_standards_docs.py#test_only_the_two_exceptions_carry_a_writing_standard_key
    status: ci
    notes: 'R6: cli.md carries no exemption; CI site-build runs the STE checker over
      it'
    verify: none
  - id: site-code-blocks-render
    capability: published-docs
    acceptance: Every fenced code block on the published site renders as a code block
      inside its list, and the site build fails naming the page when one would render
      as inline code.
    origin:
    - spec:2026-11-19-batch-docs-wording#R11
    - spec:2026-11-19-batch-docs-wording#R12
    levels:
      unit:
      - super-fr:tests/unit/test_build_site.py#test_a_fence_that_renders_without_pre_is_refused_and_no_page_is_written
      - super-fr:tests/unit/test_build_site.py#test_a_top_level_fence_builds_and_an_indented_block_in_a_list_is_no_fence
      - super-fr:tests/unit/test_build_site.py#test_a_pre_elsewhere_on_the_page_does_not_satisfy_a_fence
    status: ci
    notes: 'R11/R12: the four list fences are indented code blocks (a fence inside a
      list item is not read by the pinned renderer); the build refuses a fence that
      renders without pre, naming page:line; CI site-build builds every page'
    verify: none
  - id: site-pages-marker-own-line
    capability: published-docs
    acceptance: The site build fills the page-list marker only where it stands on a
      line of its own; a page that names the marker in text keeps its text and its list
      intact.
    origin:
    - spec:2026-11-19-batch-docs-wording#R13
    levels:
      unit:
      - super-fr:tests/unit/test_build_site.py#test_the_pages_marker_fills_only_when_it_stands_on_a_line_of_its_own
      - super-fr:tests/unit/test_build_site.py#test_a_marker_only_inside_inline_code_leaves_the_text_unchanged
    status: ci
    notes: 'R13: fill_pages fills only an own-line marker'
    verify: none
  - id: site-top-bar-phone-layout
    capability: published-docs
    acceptance: On a phone the top bar reads as two rows, the site name then its four
      links, with no wrap or horizontal scroll at 320 px, and its text starts at the
      content's left edge on article pages and the landing alike.
    origin:
    - spec:2026-11-19-batch-docs-wording#R14
    - spec:2026-11-19-batch-docs-wording#R15
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
    visual:
      states:
      - article-320
      - article-390
      - article-1280
      - landing-320
      - landing-390
      - landing-1280
      - guide-390
      - reference-390
      interactions:
      - bar-links-tappable-at-320
  - id: skill-prose-matches-engine
    capability: skills
    acceptance: 'The fr-acceptance, fr-progress and fr-triage skills state what the
      engine does: status lists a verify-live row only while it is debt, only repair
      and migrate take --yes, and the judgements schema number matches the engine (pinned
      by a test).'
    origin:
    - spec:2026-11-19-batch-docs-wording#R7
    - spec:2026-11-19-batch-docs-wording#R8
    - spec:2026-11-19-batch-docs-wording#R9
    levels:
      unit:
      - super-fr:tests/unit/test_fr_triage_skill_schema.py#test_the_triage_skill_states_the_judgements_schema_the_engine_writes
      - super-fr:tests/unit/test_fr_triage_skill_schema.py#test_the_acceptance_skill_does_not_say_a_live_row_nags_whatever_its_status
      - super-fr:tests/unit/test_fr_triage_skill_schema.py#test_the_progress_skill_does_not_group_status_with_the_yes_commands
    status: ci
    notes: 'R7-R9: skill prose asserted and the schema number pinned to the engine'
    verify: none
amendments:
  - row: writing-standards-docs-groups
    op: add-level
    base: 0
    level: unit
    ref: super-fr:tests/unit/test_writing_standards_docs.py#test_only_the_two_exceptions_carry_a_writing_standard_key
    why: R6 renamed the pinned test
  - row: writing-standards-docs-groups
    op: drop-level
    base: 1
    level: unit
    ref: super-fr:tests/unit/test_writing_standards_docs.py#test_only_the_three_exceptions_carry_a_writing_standard_key
    why: R6 renamed the pinned test
