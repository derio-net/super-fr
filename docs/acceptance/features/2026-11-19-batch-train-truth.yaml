# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-19-batch-train-truth
repo: derio-net/super-fr
rows:
  - id: drive-pass-boundary
    capability: A looping wave driver survives its own transient failures
    acceptance: In a looping `drive --yes`, a refused state-ref push, a git error or
      an unexpected exception skips the pass, is reported once per cause, and is retried
      with a capped, growing backoff; the next pass pushes what was left, losing or
      duplicating no event; only an operator-only refusal, or 10 failed passes in a
      row, stops the driver; --once and plan mode keep their exit codes
    origin:
    - spec:2026-11-19-batch-train-truth#R1
    - spec:2026-11-19-batch-train-truth#R2
    - spec:2026-11-19-batch-train-truth#R3
    - spec:2026-11-19-batch-train-truth#R4
    - spec:2026-11-19-batch-train-truth#R5
    - spec:2026-11-19-batch-train-truth#R6
    - spec:2026-11-19-batch-train-truth#R7
    levels:
      unit:
      - super-fr:tests/unit/test_triage_drive_pass_boundary.py#test_a_push_refusal_ends_the_pass_not_the_loop
      - super-fr:tests/unit/test_tripwire_drive_pass_boundary.py#test_no_direct_exit_inside_the_driver_the_loop_or_its_waits
    status: ci
    notes: 'CI: classification, the loop surviving a refused push, and the AST tripwire'
  - id: drive-failure-ledger
    capability: Driver refusals feed an improvement loop
    acceptance: A refusal is recorded with its cause and resume command and shown under
      Needs you now; every refusal, transient failure and crash is counted per cause;
      `drive failures --file --yes` files or updates one issue per cause, so recurring
      causes become tracked work
    origin:
    - spec:2026-11-19-batch-train-truth#R8
    - spec:2026-11-19-batch-train-truth#R9
    - spec:2026-11-19-batch-train-truth#R10
    levels:
      unit:
      - super-fr:tests/unit/test_triage_driver_failures.py#test_failures_file_files_one_issue_per_cause_without_the_message
      - super-fr:tests/unit/test_triage_driver_failures.py#test_failures_file_comments_a_grown_count_on_the_open_issue
    status: ci
    notes: 'CI: ledger writer and drive failures --file against a fake GhClient'
  - id: drive-session-supervisor
    capability: A supervised driver restarts after a crash and dies with its owning
      session
    acceptance: Under `drive --supervise --yes` a SIGKILLed driver is back within the
      backoff bound and replays nothing; a crash loop stops with its cause recorded;
      when the supervisor's parent dies the supervisor and its driver exit; `drive status`
      reports whether a driver holds the scope
    origin:
    - spec:2026-11-19-batch-train-truth#R11
    - spec:2026-11-19-batch-train-truth#R12
    - spec:2026-11-19-batch-train-truth#R13
    - spec:2026-11-19-batch-train-truth#R14
    levels:
      int:
      - super-fr:tests/integration/test_triage_supervise_process.py#test_a_killed_driver_is_restarted_and_the_crash_is_recorded
      - super-fr:tests/integration/test_triage_supervise_process.py#test_the_supervisor_and_its_driver_end_with_the_supervisors_parent
    status: ci
    notes: 'CI integration: real supervisor and child, SIGKILL the child, end the parent'
  - id: drive-red-drafts
    capability: Red CI on any open batch PR is handed back before approval
    acceptance: An unapproved draft batch PR with failing checks gets the red recovery
      (idle session handed back once per head, working one waited on, gone one a Needs
      you now entry) and is never shown as awaiting approval
    origin:
    - spec:2026-11-19-batch-train-truth#R15
    - spec:2026-11-19-batch-train-truth#R16
    levels:
      unit:
      - super-fr:tests/unit/test_triage_drive_draft_red.py#test_a_red_unapproved_draft_alone_is_reported_and_stepped_over
    status: ci
    notes: 'CI: both walks hand back a red unapproved draft'
  - id: drive-conflict-early
    capability: Conflicts on any open batch PR are handed back before approval
    acceptance: An open batch PR the forge reports conflicting, draft or not, approved
      or not, is trial-merged and a real conflict is handed back with the existing conflict
      rules; a version-file-only conflict is not handed back; no PR the forge reports
      clean is trial-merged; a conflicting PR is never asked for approval
    origin:
    - spec:2026-11-19-batch-train-truth#R17
    - spec:2026-11-19-batch-train-truth#R18
    levels:
      unit:
      - super-fr:tests/unit/test_triage_drive_draft_red.py#test_a_conflicting_unapproved_draft_is_probed_whatever_its_checks
      - super-fr:tests/unit/test_triage_drive_conflict_probe.py#test_a_real_content_conflict_returns_its_path_and_leaves_no_worktree
    status: ci
    notes: 'CI: a conflicting draft is probed in both walks; trial merge in a scratch
      repo'
  - id: drive-fetch-once
    capability: A pass fetches each repo at most once
    acceptance: Within one pass a repo whose fetch failed is not fetched again, and
      its later reads fail as a transient failure
    origin:
    - spec:2026-11-19-batch-train-truth#R19
    levels:
      unit:
      - super-fr:tests/unit/test_triage_fetched_reader.py#test_a_failed_fetch_is_made_once_and_every_read_raises_the_same_error
    status: ci
    notes: 'CI: fetch counted on a fake checkout that fails'
  - id: swap-labels-retry-converges
    capability: The label swap retry is correct whatever gh's resolution order
    acceptance: A refused label swap that applied part of its change, followed by the
      retry, ends with exactly the wanted labels
    origin:
    - spec:2026-11-19-batch-train-truth#R20
    levels:
      unit:
      - super-fr:tests/unit/test_gh.py#TestSwapIssueLabelsPartialApply::test_a_refused_call_that_applied_part_of_its_change_ends_with_the_wanted_labels
    status: ci
    notes: 'CI: a refused partial-apply call then the retry ends with the wanted labels'
  - id: cancel-undispatched-no-checkout
    capability: Cancelling a never-dispatched batch needs no clone
    acceptance: '`batch cancel --yes` of a batch with no dispatch event needs no --checkout,
      writes no label or comment, releases this scope''s claims and records the cancel'
    origin:
    - spec:2026-11-19-batch-train-truth#R21
    levels:
      unit:
      - super-fr:tests/unit/test_triage_batch_verbs.py#test_cancelling_a_never_dispatched_batch_withdraws_nothing_and_needs_no_clone
    status: ci
    notes: 'CI: batch cancel --yes of a never-dispatched batch with no --checkout'
  - id: drive-activity-log
    capability: The operator can watch the driver's actions live
    acceptance: Every line a looping driver or its supervisor prints lands, timestamped
      and kinded, in the scope's drive.log; `drive log -f` follows it across a rotation;
      the Batches board shows the newest 50 entries
    origin:
    - spec:2026-11-19-batch-train-truth#R22
    - spec:2026-11-19-batch-train-truth#R23
    levels: {}
    status: not-implemented
    notes: ''
