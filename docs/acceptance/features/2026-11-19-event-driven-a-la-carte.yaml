# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-19-event-driven-a-la-carte
repo: derio-net/super-fr
rows:
  - id: s1-config-root
    capability: settings
    acceptance: fr reads repo configuration from .fr/ in the run's configuration space
      (the product checkout under repo, the fr-config branch under quiet, the tracking
      repo's config branch under stealth) through one resolver, a feature branch cannot
      change it under quiet or stealth, and fr says once per command when a product
      checkout's own .fr/ is ignored
    origin:
    - spec:2026-11-19-event-driven-a-la-carte#R1
    - spec:2026-11-19-event-driven-a-la-carte#R2
    - spec:2026-11-19-event-driven-a-la-carte#R3
    - spec:2026-11-19-event-driven-a-la-carte#R4
    - spec:2026-11-19-event-driven-a-la-carte#R9
    - spec:2026-11-19-event-driven-a-la-carte#R22
    levels: {}
    status: not-implemented
    notes: candidate walk scenario, built in plan phase 7
    verify: candidate
    scenario: tests/scenarios/config-homes.sh
  - id: s1-migration
    capability: settings
    acceptance: fr migrate artifacts --yes moves every old configuration path into its
      configuration space (one commit within a checkout; configuration branch first,
      then the product, under quiet and stealth), refuses a file present at both paths,
      and until the owed release reads an unmigrated file with one notice
    origin:
    - spec:2026-11-19-event-driven-a-la-carte#R10
    - spec:2026-11-19-event-driven-a-la-carte#R11
    - spec:2026-11-19-event-driven-a-la-carte#R12
    - spec:2026-11-19-event-driven-a-la-carte#R13
    - spec:2026-11-19-event-driven-a-la-carte#R14
    levels: {}
    status: not-implemented
    notes: candidate walk scenario, built in plan phase 7
    verify: candidate
    scenario: tests/scenarios/config-homes.sh
  - id: s1-switch-moved
    capability: placement
    acceptance: The quiet and stealth switch and settings are read from .fr/settings.yaml
      on the configuration branch by fr and by the edit gate on every harness, the old
      settings file is kept identical so older fr still reads the placement, two that
      differ are refused, and the base-clone allowlist stays in the checkout it governs
    origin:
    - spec:2026-11-19-event-driven-a-la-carte#R5
    - spec:2026-11-19-event-driven-a-la-carte#R6
    - spec:2026-11-19-event-driven-a-la-carte#R8
    - spec:2026-11-19-event-driven-a-la-carte#R13
    levels: {}
    status: not-implemented
    notes: candidate walk scenario, built in plan phase 7
    verify: candidate
    scenario: tests/scenarios/config-homes.sh
  - id: s1-executable-config-protection
    capability: placement
    acceptance: Under quiet and stealth fr runs or gates on executable configuration
      (candidate-install, triage.yaml commands, ops.yaml, ci.yaml gate_checks) only
      when the forge enforces a pull-request rule on the configuration branch, and otherwise
      refuses with the reason and the fix
    origin:
    - spec:2026-11-19-event-driven-a-la-carte#R7
    levels: {}
    status: not-implemented
    notes: candidate walk scenario, built in plan phase 7
    verify: candidate
    scenario: tests/scenarios/config-homes.sh
  - id: s1-shipped-defaults
    capability: workflows
    acceptance: super-fr's default workflows, verification strategies and lenses are
      resolved from one shipped defaults tree, a repo's .fr/workflows or .fr/verifications
      entry of the same name wins, lenses keep .fr/lenses.yaml as their only override,
      and one environment variable redirects the tree
    origin:
    - spec:2026-11-19-event-driven-a-la-carte#R15
    - spec:2026-11-19-event-driven-a-la-carte#R16
    levels: {}
    status: not-implemented
    notes: candidate walk scenario, built in plan phase 7
    verify: candidate
    scenario: tests/scenarios/config-homes.sh
  - id: s1-triage-state-home
    capability: triage
    acceptance: A triage scope keeps its working state in a host-cache git repository
      that syncs its fr-triage branch with no product clone, moves an existing .fr/triage-state
      safely (refused while a driver runs or when two copies differ), defaults its state
      repo (stealth tracking repo, else the one repo, else asked), honours a repo's
      triage.state_repo, and the privacy guard still refuses a private issue in a public
      state repo
    origin:
    - spec:2026-11-19-event-driven-a-la-carte#R17
    - spec:2026-11-19-event-driven-a-la-carte#R18
    - spec:2026-11-19-event-driven-a-la-carte#R19
    - spec:2026-11-19-event-driven-a-la-carte#R20
    - spec:2026-11-19-event-driven-a-la-carte#R21
    levels: {}
    status: not-implemented
    notes: candidate walk scenario, built in plan phase 7
    verify: candidate
    scenario: tests/scenarios/config-homes.sh
