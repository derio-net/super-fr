# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-19-wave-merge-queue
repo: derio-net/super-fr
rows:
  - id: wave-queue-speculative-land
    capability: wave merge queue
    acceptance: The wave driver merges a wave's approved green PRs by testing speculative
      combinations (main + PRs ahead + this PR) on fr-owned branches and moving main
      to exactly the tested commit; no PR branch is ever updated because main moved
      and no forge merge queue is used.
    origin:
    - spec:2026-11-19-wave-merge-queue#R1
    - spec:2026-11-19-wave-merge-queue#R3
    - spec:2026-11-19-wave-merge-queue#R4
    - spec:2026-11-19-wave-merge-queue#R8
    - spec:2026-11-19-wave-merge-queue#R9
    - spec:2026-11-19-wave-merge-queue#R14
    - spec:2026-11-19-wave-merge-queue#R36
    levels:
      unit:
      - super-fr:tests/unit/test_wave_queue_planner.py#test_an_open_queue_builds_its_first_depth_entries_into_slots_on_the_base
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_green_first_slot_lands_alone_and_the_second_keeps_testing_on_the_landed_main
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_foreign_base_move_rebuilds_every_slot_on_the_new_base_and_says_so_once
      - super-fr:tests/unit/test_wave_queue_drive.py#test_a_queue_repo_walks_no_train_and_merges_nothing
      - super-fr:tests/unit/test_wave_queue_drive.py#test_later_waves_waiting_prs_take_no_in_flight_slot_while_the_queue_is_open
    status: not-implemented
    notes: 'phase 2: the pure planner builds depth slots, lands the longest green prefix
      at the tested sha, rebuilds every slot on a foreign move of main, and drive_pass
      plans queue repos with it (report-only); the executor that builds, pushes and
      lands is phase 3'
  - id: wave-queue-land-methods
    capability: wave merge queue
    acceptance: Landing by atomic push leaves every landed PR reading MERGED on the
      forge, with history in the repo's merge method (merge commits, or one squashed
      commit per PR); landing by forge merge refuses rather than land an untested tree.
    origin:
    - spec:2026-11-19-wave-merge-queue#R5
    - spec:2026-11-19-wave-merge-queue#R10
    - spec:2026-11-19-wave-merge-queue#R11
    levels:
      unit:
      - super-fr:tests/integration/test_queue_build.py#test_squash_builds_one_commit_per_entry_into_slots_and_moves_no_pr_branch
      - super-fr:tests/integration/test_queue_build.py#test_merge_builds_no_ff_merge_commits_with_the_forge_subject
      - super-fr:tests/integration/test_queue_build.py#test_rebase_replays_the_prs_commits
      - super-fr:tests/integration/test_queue_land.py#test_one_atomic_push_moves_main_to_the_tip_and_each_head_to_its_commit
      - super-fr:tests/integration/test_queue_land.py#test_under_merge_the_heads_are_pushed_unchanged
      - super-fr:tests/integration/test_queue_land.py#test_a_session_push_since_the_build_fails_the_whole_push
      - super-fr:tests/integration/test_queue_land.py#test_land_merge_stops_on_a_tree_mismatch
    status: ci
    notes: 'phase 3: queue_exec builds each method''s history (squash, merge, rebase)
      into slots and lands by one atomic leased push or by forge merge with a tree check,
      over real bare remotes and a fake forge'
  - id: wave-queue-wave-exclusive
    capability: wave merge queue
    acceptance: While a wave's queue is open only that wave's PRs and its one close-out
      enter it; later waves and no-wave batches wait until it drains.
    origin:
    - spec:2026-11-19-wave-merge-queue#R2
    - spec:2026-11-19-wave-merge-queue#R15
    - spec:2026-11-19-wave-merge-queue#R17
    levels:
      unit:
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_later_waves_ready_entry_never_joins_the_open_queue
      - super-fr:tests/unit/test_wave_queue_planner.py#test_another_scopes_hold_is_held_naming_it_and_nothing_else
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_wave_whose_batches_are_all_terminal_drains_at_the_landed_main
      - super-fr:tests/unit/test_wave_queue_planner.py#test_between_waves_entries_open_a_one_entry_queue_once_every_wave_is_done
      - super-fr:tests/unit/test_wave_queue_planner.py#test_an_idle_repo_opens_the_lowest_unfinished_wave_on_its_first_ready_entry
    status: not-implemented
    notes: 'phase 2: the pure planner opens the lowest unfinished wave, keeps later
      waves and no-wave batches waiting, opens one-entry queues between waves, holds
      a repo another scope''s hold holds, and drains a finished wave; phase 4 adds the
      hold handshake the release clears; the wave close-out is phase 6'
  - id: wave-queue-eject
    capability: wave merge queue
    acceptance: A combination that fails twice or conflicts takes only its own PR out
      of the queue, hands it back to its session through the existing budgets, and rebuilds
      only the combinations behind it.
    origin:
    - spec:2026-11-19-wave-merge-queue#R6
    - spec:2026-11-19-wave-merge-queue#R13
    levels:
      unit:
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_second_red_at_the_same_tree_ejects_it_and_rebuilds_what_was_behind
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_first_red_behind_a_green_slot_is_rebuilt_once_fresh_in_its_own_slot
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_conflict_met_at_build_ejects_the_entry_through_the_conflict_decision
      - super-fr:tests/unit/test_wave_queue_planner.py#test_an_ejected_entry_re_enters_only_when_its_head_moves
    status: not-implemented
    notes: 'phase 2: the pure planner ejects (one fresh rebuild, then red_decision /
      conflict_decision) and rebuilds only what was behind; the executor that pushes
      and hands back is phase 3'
  - id: wave-queue-one-path
    capability: wave merge queue
    acceptance: 'The queue is the driver''s and batch merge''s only merge path: a repo
      that requires a forge queue, refuses the push, or lacks queue CI is held with
      what it needs, ci-none repos land without a CI wait, and a restarted driver never
      lands twice.'
    origin:
    - spec:2026-11-19-wave-merge-queue#R7
    - spec:2026-11-19-wave-merge-queue#R20
    - spec:2026-11-19-wave-merge-queue#R22
    - spec:2026-11-19-wave-merge-queue#R23
    - spec:2026-11-19-wave-merge-queue#R24
    - spec:2026-11-19-wave-merge-queue#R31
    - spec:2026-11-19-wave-merge-queue#R32
    - spec:2026-11-19-wave-merge-queue#R34
    - spec:2026-11-19-wave-merge-queue#R35
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-live-wave
    capability: wave merge queue
    acceptance: A real wave on super-fr drains through the queue with no PR updates,
      one approval per PR and one release for the wave.
    origin:
    - spec:2026-11-19-wave-merge-queue#R1
    - spec:2026-11-19-wave-merge-queue#R9
    - spec:2026-11-19-wave-merge-queue#R10
    - spec:2026-11-19-wave-merge-queue#R17
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: wave-queue-devops-barrier
    capability: wave merge queue
    acceptance: A gate:devops PR enters the queue only when the DevOps stage releases
      it after its pre-merge ops. It lands alone, and nothing lands behind it until
      the stage records the post-merge ops done.
    origin:
    - spec:2026-11-19-wave-merge-queue#R26
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-broken-hold
    capability: wave merge queue
    acceptance: A deleted or expired hold, a stray merge or a mid-queue release never
      lands untested code or moves a PR branch. The hold is re-armed, and the operator
      is told which release may have cut from a partly landed wave.
    origin:
    - spec:2026-11-19-wave-merge-queue#R27
    - spec:2026-11-19-wave-merge-queue#R14
    levels:
      unit:
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_foreign_base_move_rebuilds_every_slot_on_the_new_base_and_says_so_once
      int:
      - super-fr:tests/integration/test_queue_hold.py#test_a_vanished_hold_is_re_armed_with_one_need_naming_a_release
      - super-fr:tests/integration/test_queue_hold.py#test_a_rearm_lands_nothing_untested_and_moves_no_pr_branch
    status: ci
    notes: 'phase 4: a vanished, cleared or expired open hold is re-armed with one Need
      naming any release cut from the partly landed wave, and nothing lands or moves
      a PR branch; the foreign move (R14) is phases 2 and 3''s'
  - id: wave-queue-operator-loop
    capability: wave merge queue
    acceptance: The operator sees every queue problem as a Needs-you entry with a command
      to paste, each queued PR's state in one comment edited in place, and a wave report
      at drain (landed, ejected and deferred PRs, cycles, approvals, the release).
    origin:
    - spec:2026-11-19-wave-merge-queue#R28
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-leave-wave
    capability: wave merge queue
    acceptance: A batch that cannot merge can leave its wave (defer), so the wave drains
      without it, and can later ask to join a named or the next queue (requeue). The
      driver proposes this when the batch blocks the drain, and never decides it.
    origin:
    - spec:2026-11-19-wave-merge-queue#R29
    - spec:2026-11-19-wave-merge-queue#R30
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-post-merge
    capability: wave merge queue
    acceptance: post_merge runs once per landing at the landed main and gates the next
      landing, and a landed PR the forge still shows open pauses the queue with a Need.
    origin:
    - spec:2026-11-19-wave-merge-queue#R33
    - spec:2026-11-19-wave-merge-queue#R35
    levels:
      unit:
      - super-fr:tests/integration/test_queue_resume.py#test_a_wave_opens_builds_lands_once_runs_post_merge_once_and_drains
      - super-fr:tests/integration/test_queue_resume.py#test_a_failed_post_merge_pauses_landings_with_a_need
      - super-fr:tests/integration/test_queue_resume.py#test_a_landed_pr_the_forge_still_shows_open_pauses_the_queue
      - super-fr:tests/unit/test_queue_exec.py#test_post_merge_is_owed_for_the_last_landing_until_every_batch_recorded_it
    status: ci
    notes: 'phase 3: post_merge runs once per landing and a failure pauses landings
      with a Need; a landed PR the forge still shows open pauses the queue (executor
      over real git and a fake forge)'
  - id: wave-queue-approval-content
    capability: approval gate
    acceptance: An approved-fr approval survives any push that leaves the PR's own diff
      unchanged (a merge of main, an empty commit, the queue's own landing rewrite)
      and is voided only by a change to that diff.
    origin:
    - spec:2026-11-19-wave-merge-queue#R12
    levels:
      unit:
      - super-fr:tests/unit/test_gitseam_patch_id.py#test_a_conflict_free_merge_of_main_keeps_the_patch_id
      - super-fr:tests/unit/test_gitseam_patch_id.py#test_an_empty_commit_keeps_the_patch_id
      - super-fr:tests/unit/test_gitseam_patch_id.py#test_a_code_edit_changes_the_patch_id
      - super-fr:tests/unit/test_gitseam_patch_id.py#test_a_whitespace_only_edit_changes_the_patch_id
      - super-fr:tests/unit/test_gitseam_patch_id.py#test_a_binary_edit_changes_the_patch_id
      - super-fr:tests/unit/test_triage_approval.py#test_the_same_patch_id_at_another_head_is_approved
      - super-fr:tests/unit/test_triage_approval.py#test_another_patch_id_at_another_head_is_void
      - super-fr:tests/unit/test_triage_approval.py#test_an_approval_with_no_patch_id_falls_back_to_reaches
      - super-fr:tests/unit/test_triage_approval.py#test_settle_records_the_patch_id_it_is_given_for_a_first_verdict
      - super-fr:tests/unit/test_triage_approval.py#test_settle_voids_on_a_patch_id_change_removing_the_label
    status: ci
    notes: 'phase 1: the verdict compares the recorded and live patch-ids; unit tests
      on a real repo and over the pure verdict'
  - id: wave-queue-release-hold
    capability: release
    acceptance: A repo cuts no release while a wave's queue drains and exactly one release
      follows the drain (dispatched, or from the next push or the daily cron); a stale
      hold older than a day is ignored with a warning.
    origin:
    - spec:2026-11-19-wave-merge-queue#R17
    - spec:2026-11-19-wave-merge-queue#R18
    - spec:2026-11-19-wave-merge-queue#R19
    levels:
      unit:
      - super-fr:tests/unit/test_release_script.py#test_an_open_hold_cuts_nothing_and_release_py_passes_it_in_the_facts
      - super-fr:tests/unit/test_release_script.py#test_a_finished_release_clears_a_drained_hold_its_base_contains
      - super-fr:tests/unit/test_release_status.py#test_an_open_hold_refreshed_over_a_day_ago_warns_and_does_not_hold
      - super-fr:tests/unit/test_release_workflow.py#test_a_deleted_hold_starts_no_release
      int:
      - super-fr:tests/integration/test_queue_hold.py#test_the_drain_pushes_drained_on_the_drained_main_and_dispatches_the_release
      - super-fr:tests/integration/test_scenarios.py#test_wave_queue_release_hold
    status: ci
    notes: 'phase 4: the hold is pushed by the driver (open, refresh, drained, cleared
      under release none), judged by fr release status, honoured and cleared by release.py;
      real git over a bare origin, the release workflow pinned, and a scenario over
      the facts'
    scenario: tests/scenarios/wave-queue-release-hold.sh
  - id: wave-queue-closeout-migrates
    capability: collected close-out
    acceptance: 'A wave''s close-out is never held by a stale artifact a registered
      migration can move: it migrates what it archives on its own branch.'
    origin:
    - spec:2026-11-19-wave-merge-queue#R16
    levels: {}
    status: not-implemented
    notes: born at brainstorm; scenario written by its phase
    scenario: tests/scenarios/wave-queue-closeout-migrates.sh
  - id: wave-queue-migratable-validation
    capability: artifact validation
    acceptance: fr validate artifacts --allow-migratable passes a stale artifact a registered
      migration can move and fails one it cannot, so a PR is not failed by another run's
      stale cursor.
    origin:
    - spec:2026-11-19-wave-merge-queue#R21
    levels: {}
    status: not-implemented
    notes: born at brainstorm; scenario written by its phase
    scenario: tests/scenarios/wave-queue-migratable-validation.sh
  - id: wave-queue-visible
    capability: triage board
    acceptance: The pass, the board and the Batches page show each repo's queue line
      (wave, base, entries and their state, hold), and an approved queued PR never reads
      as awaiting approval.
    origin:
    - spec:2026-11-19-wave-merge-queue#R25
    levels: {}
    status: not-implemented
    notes: ''
amendments:
  - row: wave-queue-release-hold
    op: reword
    base: 0
    acceptance: A repo cuts no release while a wave's queue drains, and once it drains
      exactly one release run follows. That run clears the hold whether it cut an RC,
      a final or nothing installable, and only then does the next queue open. A stale
      open hold older than a day is ignored with a warning, and an uncleared drained
      hold becomes a Need.
    why: 'hold became a handshake: the release clears it (operator, round 3)'
  - row: wave-queue-wave-exclusive
    op: reword
    base: 0
    acceptance: While a wave's queue is open or releasing, only that wave's PRs and
      its one close-out (of its ungated batches) enter it. Later waves wait as PRs until
      the previous wave's release is cut. No-wave batches, passed-gate close-outs and
      DevOps housekeeping PRs queue alone between waves.
    why: later waves wait for the previous wave's release; gated close-outs leave the
      wave close-out (operator, round 3)
  - row: wave-queue-approval-content
    op: reword
    base: 0
    acceptance: 'An approved-fr approval survives any push that leaves the PR''s own
      diff unchanged (a merge of main, an empty commit, fr''s own update and a clean
      merge of main after it, the queue''s own landing rewrite), on every host whatever
      its diff configuration, and is voided by a change to that diff, with one stated
      limit: patch-ids ignore hunk line numbers, so moving an otherwise identical hunk
      within a file keeps the approval.'
    why: 'p1-r1 review: git patch-id is position-blind within a file, so the row no
      longer claims every diff change voids; p1-r2/r7 widen what keeps it.'
