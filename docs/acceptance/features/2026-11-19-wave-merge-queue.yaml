    - spec:2026-11-19-wave-merge-queue#R17
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: wave-queue-devops-barrier
    capability: wave merge queue
    acceptance: A gate:devops PR enters the queue only when the DevOps stage releases
      it after its pre-merge ops. It lands alone, and nothing lands behind it until
      the stage records the post-merge ops done.
    origin:
    - spec:2026-11-19-wave-merge-queue#R26
    levels:
      unit:
      - super-fr:tests/unit/test_ops_gate.py#test_stage_2_never_merges_and_waits_for_the_queue
      - super-fr:tests/unit/test_wave_queue_barrier.py#test_the_barrier_lands_as_the_last_entry_of_its_push_and_nothing_behind_it
      - super-fr:tests/unit/test_wave_queue_barrier.py#test_nothing_lands_after_the_barrier_until_its_post_merge_ops_are_done
      - super-fr:tests/unit/test_wave_queue_barrier.py#test_a_combination_behind_the_barrier_is_built_and_tested_meanwhile
      - super-fr:tests/unit/test_queue_gate_labels.py#test_a_diff_that_moved_after_the_release_voids_it_and_removes_the_label
      int:
      - super-fr:tests/integration/test_scenarios.py#test_fr_ops_gate_stage
    status: ci
    notes: 'phase 6: stage 2 adds fr-queue:release and calls no pr_merge, stage 4 adds
      fr-queue:postmerge-done; the driver settles both into queue events; the planner
      admits a gate:devops entry only when released, lands it as the last entry of its
      push and nothing behind it until post-merge is done; unit tests and the ops-gate
      scenarios'
  - id: wave-queue-broken-hold
    capability: wave merge queue
    acceptance: A deleted or expired hold, a stray merge or a mid-queue release never
      lands untested code or moves a PR branch. The hold is re-armed, and the operator
      is told which release may have cut from a partly landed wave.
    origin:
    - spec:2026-11-19-wave-merge-queue#R27
    - spec:2026-11-19-wave-merge-queue#R14
    levels:
      unit:
      - super-fr:tests/unit/test_wave_queue_planner.py#test_a_foreign_base_move_rebuilds_every_slot_on_the_new_base_and_says_so_once
      int:
