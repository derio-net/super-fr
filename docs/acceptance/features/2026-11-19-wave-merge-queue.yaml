# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-19-wave-merge-queue
repo: derio-net/super-fr
rows:
  - id: wave-queue-speculative-land
    capability: wave merge queue
    acceptance: The wave driver merges a wave's approved green PRs by testing speculative
      combinations (main + PRs ahead + this PR) on fr-owned branches and moving main
      to exactly the tested commit; no PR branch is ever updated because main moved
      and no forge merge queue is used.
    origin:
    - spec:2026-11-19-wave-merge-queue#R1
    - spec:2026-11-19-wave-merge-queue#R3
    - spec:2026-11-19-wave-merge-queue#R4
    - spec:2026-11-19-wave-merge-queue#R8
    - spec:2026-11-19-wave-merge-queue#R9
    - spec:2026-11-19-wave-merge-queue#R14
    - spec:2026-11-19-wave-merge-queue#R36
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-land-methods
    capability: wave merge queue
    acceptance: Landing by atomic push leaves every landed PR reading MERGED on the
      forge, with history in the repo's merge method (merge commits, or one squashed
      commit per PR); landing by forge merge refuses rather than land an untested tree.
    origin:
    - spec:2026-11-19-wave-merge-queue#R5
    - spec:2026-11-19-wave-merge-queue#R10
    - spec:2026-11-19-wave-merge-queue#R11
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-wave-exclusive
    capability: wave merge queue
    acceptance: While a wave's queue is open only that wave's PRs and its one close-out
      enter it; later waves and no-wave batches wait until it drains.
    origin:
    - spec:2026-11-19-wave-merge-queue#R2
    - spec:2026-11-19-wave-merge-queue#R15
    - spec:2026-11-19-wave-merge-queue#R17
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-eject
    capability: wave merge queue
    acceptance: A combination that fails twice or conflicts takes only its own PR out
      of the queue, hands it back to its session through the existing budgets, and rebuilds
      only the combinations behind it.
    origin:
    - spec:2026-11-19-wave-merge-queue#R6
    - spec:2026-11-19-wave-merge-queue#R13
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-one-path
    capability: wave merge queue
    acceptance: 'The queue is the driver''s and batch merge''s only merge path: a repo
      that requires a forge queue, refuses the push, or lacks queue CI is held with
      what it needs, ci-none repos land without a CI wait, and a restarted driver never
      lands twice.'
    origin:
    - spec:2026-11-19-wave-merge-queue#R7
    - spec:2026-11-19-wave-merge-queue#R20
    - spec:2026-11-19-wave-merge-queue#R22
    - spec:2026-11-19-wave-merge-queue#R23
    - spec:2026-11-19-wave-merge-queue#R24
    - spec:2026-11-19-wave-merge-queue#R31
    - spec:2026-11-19-wave-merge-queue#R32
    - spec:2026-11-19-wave-merge-queue#R34
    - spec:2026-11-19-wave-merge-queue#R35
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-live-wave
    capability: wave merge queue
    acceptance: A real wave on super-fr drains through the queue with no PR updates,
      one approval per PR and one release for the wave.
    origin:
    - spec:2026-11-19-wave-merge-queue#R1
    - spec:2026-11-19-wave-merge-queue#R9
    - spec:2026-11-19-wave-merge-queue#R10
    - spec:2026-11-19-wave-merge-queue#R17
    levels: {}
    status: not-implemented
    notes: ''
    verify: live
  - id: wave-queue-devops-barrier
    capability: wave merge queue
    acceptance: A gate:devops PR enters the queue only when the DevOps stage releases
      it after its pre-merge ops. It lands alone, and nothing lands behind it until
      the stage records the post-merge ops done.
    origin:
    - spec:2026-11-19-wave-merge-queue#R26
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-broken-hold
    capability: wave merge queue
    acceptance: A deleted or expired hold, a stray merge or a mid-queue release never
      lands untested code or moves a PR branch. The hold is re-armed, and the operator
      is told which release may have cut from a partly landed wave.
    origin:
    - spec:2026-11-19-wave-merge-queue#R27
    - spec:2026-11-19-wave-merge-queue#R14
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-operator-loop
    capability: wave merge queue
    acceptance: The operator sees every queue problem as a Needs-you entry with a command
      to paste, each queued PR's state in one comment edited in place, and a wave report
      at drain (landed, ejected and deferred PRs, cycles, approvals, the release).
    origin:
    - spec:2026-11-19-wave-merge-queue#R28
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-leave-wave
    capability: wave merge queue
    acceptance: A batch that cannot merge can leave its wave (defer), so the wave drains
      without it, and can later ask to join a named or the next queue (requeue). The
      driver proposes this when the batch blocks the drain, and never decides it.
    origin:
    - spec:2026-11-19-wave-merge-queue#R29
    - spec:2026-11-19-wave-merge-queue#R30
    levels: {}
    status: not-implemented
    notes: born at brainstorm
  - id: wave-queue-post-merge
    capability: wave merge queue
    acceptance: post_merge runs once per landing at the landed main and gates the next
      landing, and a landed PR the forge still shows open pauses the queue with a Need.
    origin:
    - spec:2026-11-19-wave-merge-queue#R33
    - spec:2026-11-19-wave-merge-queue#R35
    levels: {}
    status: not-implemented
    notes: born at spec review
  - id: wave-queue-approval-content
    capability: approval gate
    acceptance: An approved-fr approval survives any push that leaves the PR's own diff
      unchanged (a merge of main, an empty commit, the queue's own landing rewrite)
      and is voided only by a change to that diff.
    origin:
    - spec:2026-11-19-wave-merge-queue#R12
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-release-hold
    capability: release
    acceptance: A repo cuts no release while a wave's queue drains and exactly one release
      follows the drain (dispatched, or from the next push or the daily cron); a stale
      hold older than a day is ignored with a warning.
    origin:
    - spec:2026-11-19-wave-merge-queue#R17
    - spec:2026-11-19-wave-merge-queue#R18
    - spec:2026-11-19-wave-merge-queue#R19
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-closeout-migrates
    capability: collected close-out
    acceptance: 'A wave''s close-out is never held by a stale artifact a registered
      migration can move: it migrates what it archives on its own branch.'
    origin:
    - spec:2026-11-19-wave-merge-queue#R16
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-migratable-validation
    capability: artifact validation
    acceptance: fr validate artifacts --allow-migratable passes a stale artifact a registered
      migration can move and fails one it cannot, so a PR is not failed by another run's
      stale cursor.
    origin:
    - spec:2026-11-19-wave-merge-queue#R21
    levels: {}
    status: not-implemented
    notes: ''
  - id: wave-queue-visible
    capability: triage board
    acceptance: The pass, the board and the Batches page show each repo's queue line
      (wave, base, entries and their state, hold), and an approved queued PR never reads
      as awaiting approval.
    origin:
    - spec:2026-11-19-wave-merge-queue#R25
    levels: {}
    status: not-implemented
    notes: ''
amendments:
  - row: wave-queue-release-hold
    op: reword
    base: 0
    acceptance: A repo cuts no release while a wave's queue drains, and once it drains
      exactly one release run follows. That run clears the hold whether it cut an RC,
      a final or nothing installable, and only then does the next queue open. A stale
      open hold older than a day is ignored with a warning, and an uncleared drained
      hold becomes a Need.
    why: 'hold became a handshake: the release clears it (operator, round 3)'
  - row: wave-queue-wave-exclusive
    op: reword
    base: 0
    acceptance: While a wave's queue is open or releasing, only that wave's PRs and
      its one close-out (of its ungated batches) enter it. Later waves wait as PRs until
      the previous wave's release is cut. No-wave batches, passed-gate close-outs and
      DevOps housekeeping PRs queue alone between waves.
    why: later waves wait for the previous wave's release; gated close-outs leave the
      wave close-out (operator, round 3)
