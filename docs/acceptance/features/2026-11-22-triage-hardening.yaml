    origin:
    - spec:2026-11-22-triage-hardening#R7
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: batch-obsolete-stage
    capability: triage-batches
    acceptance: 'A never-dispatched batch whose members are all closed is obsolete:
      never dispatched, meets its dependents, listed by check for cancelling; a partly-closed
      proposed batch names its closed members'
    origin:
    - spec:2026-11-22-triage-hardening#R8
    - spec:2026-11-22-triage-hardening#R9
    - spec:2026-11-22-triage-hardening#R10
    levels: {}
