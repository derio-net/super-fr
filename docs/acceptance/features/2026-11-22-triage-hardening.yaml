# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-22-triage-hardening
repo: derio-net/super-fr
rows:
  - id: intake-title-withheld
    capability: triage-intake
    acceptance: An issue intake finds ineligible reaches facts, check and the pages
      with no title or body; admitting it restores the title at the next collect
    origin:
    - spec:2026-11-22-triage-hardening#R1
    levels:
      unit:
      - super-fr:tests/unit/test_triage_collect.py#test_an_outside_authors_issue_is_stored_with_no_title_and_no_body
      - super-fr:tests/unit/test_triage_collect.py#test_a_schema_15_facts_file_loads_with_titles_and_label_only_text_withheld
      - super-fr:tests/unit/test_triage_check.py#test_check_prints_and_emits_the_untrusted_set
      - super-fr:tests/unit/test_triage_render.py#test_an_issue_row_with_a_withheld_title_shows_the_key_and_a_quiet_note
    status: ci
    notes: 'CI unit tests: collect withholds an outside author''s title and body, a
      schema-15 file is withheld on load, check and pages show key, url, author and
      reason'
    verify: none
  - id: intake-admit-pinned
    capability: triage-intake
    acceptance: ready-fr admits an issue only with a trusted admit marker matching its
      current title and body; an edit after admission makes it ineligible again until
      `fr triage admit` re-admits it
    origin:
    - spec:2026-11-22-triage-hardening#R2
    - spec:2026-11-22-triage-hardening#R3
    - spec:2026-11-22-triage-hardening#R4
    - spec:2026-11-22-triage-hardening#R5
    levels:
      unit:
      - super-fr:tests/unit/test_triage_admit.py#test_the_digest_reads_crlf_as_lf_and_starts_sha256
      - super-fr:tests/unit/test_triage_admit.py#test_latest_admit_ignores_an_untrusted_authors_newer_marker
      - super-fr:tests/unit/test_triage_admit.py#test_admit_with_yes_labels_and_posts_one_marker_over_the_live_content
      - super-fr:tests/unit/test_triage_admit.py#test_an_edit_between_the_preview_and_the_write_is_refused
      - super-fr:tests/unit/test_triage_admit.py#test_admit_refuses_a_forge_that_cannot_list_comments_before_any_read
      - super-fr:tests/unit/test_triage_collect.py#test_a_ready_fr_issue_with_a_trusted_marker_over_its_full_content_is_eligible
      - super-fr:tests/unit/test_triage_collect.py#test_a_ready_fr_issue_edited_after_its_marker_is_ineligible
      - super-fr:tests/unit/test_triage_collect.py#test_a_member_authored_ready_fr_issue_reads_its_association_and_no_comments
      - super-fr:tests/unit/test_triage_collect.py#test_a_failed_admit_read_leaves_only_that_issue_ineligible
      - super-fr:tests/unit/test_triage_intake.py#test_the_ready_fr_label_admits_only_with_a_marker_matching_the_content
    status: ci
    notes: 'CI unit tests: digest over a body past BODY_LIMIT, marker parser and trust,
      intake reasons (edited, no marker, unread, unsupported forge), a MEMBER-authored
      labelled issue, and fr triage admit against a fake GhClient incl. the confirmed-digest
      re-read'
    verify: none
  - id: dedupe-set-apart
    capability: triage-dedupe
    acceptance: Owed trackers, awaiting-live issues, debt digests and untrusted issues
      are never proposed as duplicate candidates
    origin:
    - spec:2026-11-22-triage-hardening#R6
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: claim-untrusted-warning
    capability: triage-claims
    acceptance: A claim marker ignored as untrusted is reported by check with the pr_authors
