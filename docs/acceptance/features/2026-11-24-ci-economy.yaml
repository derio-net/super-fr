      naming that run; any other push to main runs full CI, and the release's pre-publish
      suite is unchanged
    why: spec-review s-r1-8, s-r1-9
  - row: ci-cancelled-reads-pending
    op: reword
    base: 0
    acceptance: 'The wave driver, the queue, fr pr settle, triage collect, the DevOps
