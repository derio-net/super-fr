# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-24-ci-economy
repo: derio-net/super-fr
rows:
  - id: ci-superseded-runs
    capability: ci
    acceptance: A pull-request CI run superseded by a newer push to the same pull request
      is cancelled and leaves no failing ci-ok; pushes to main and fr-queue/** and merge
      groups are never cancelled
    origin:
    - spec:2026-11-24-ci-economy#R1
    - spec:2026-11-24-ci-economy#R2
    levels:
      unit:
      - super-fr:tests/unit/test_ci_lanes_workflow.py#test_pull_request_runs_share_a_group_and_cancel_only_there
      - super-fr:tests/unit/test_ci_lanes_workflow.py#test_ci_ok_always_runs_and_asks_the_verdict
    status: walk-owed
    notes: Workflow shape unit-pinned in CI; only GitHub cancels a run in a concurrency
      group, so the live walk is owed post-merge (gate tester)
    verify: live
  - id: ci-landed-skip
    capability: ci
    acceptance: A push to main of a sha that already carries a successful ci-ok from
      its fr-queue run runs no suite and reports a green ci-ok naming that run; any
      other push to main runs full CI, and the release's pre-publish suite is unchanged
    origin:
    - spec:2026-11-24-ci-economy#R5
    - spec:2026-11-24-ci-economy#R6
    - spec:2026-11-24-ci-economy#R7
    levels:
      unit:
      - super-fr:tests/unit/test_ci_lane.py#test_landed_names_the_trusted_run
      - super-fr:tests/unit/test_ci_lane.py#test_no_other_run_is_trusted
      - super-fr:tests/unit/test_ci_lanes_workflow.py#test_validate_artifacts_runs_in_every_lane
    status: walk-owed
    notes: ci_lane.py landed and the workflow shape are unit-tested in CI; only a real
      queue landing on main proves the skip, owed post-merge (gate tester)
    verify: live
  - id: ci-light-lane
    capability: ci
    acceptance: A pull request that changes only non-installable paths outside tests/
      and .github/ runs the light lane (no shards, collect, split-check or coverage,
      plus scoped tests) and ci-ok reads the skipped jobs as passing only for that lane
    origin:
    - spec:2026-11-24-ci-economy#R15
    - spec:2026-11-24-ci-economy#R16
    - spec:2026-11-24-ci-economy#R17
    - spec:2026-11-24-ci-economy#R18
    levels:
      unit:
      - super-fr:tests/unit/test_ci_lane.py#test_classify_reads_a_docs_only_pull_request_as_light
      - super-fr:tests/unit/test_ci_lane.py#test_light_skips_only_the_shard_jobs
      - super-fr:tests/unit/test_ci_lanes_workflow.py#test_scoped_tests_runs_the_fr_scope_tier_in_the_light_lane
    status: walk-owed
    notes: Classifier, verdict and workflow shape unit-tested in CI; only a real docs-only
      pull request shows the skipped jobs and a green ci-ok, owed post-merge (gate tester)
    verify: live
  - id: own-artifacts-tests-selected
    capability: ci
    acceptance: Tests that read this repo's own artifacts carry the own_artifacts marker
      and --fr-scope selects them whenever docs/, .fr/ or .changes/ change; a tripwire
      fails an unmarked reader
    origin:
    - spec:2026-11-24-ci-economy#R19
    - spec:2026-11-24-ci-economy#R20
    levels:
      unit:
      - super-fr:tests/unit/test_fr_scope.py#test_a_change_to_the_checkouts_own_files_collects_the_own_artifacts_tests
      - super-fr:tests/unit/test_tripwire_own_artifacts.py#test_every_test_module_that_resolves_the_root_is_marked
    status: ci
    notes: Unit tests of --fr-scope's own_artifacts selection and the root-reader tripwire
      run in CI
    verify: none
  - id: ci-cancelled-reads-pending
    capability: triage-queue
    acceptance: The wave driver, the queue, fr pr settle and triage collect read a cancelled
      check as pending (superseded), never as failing; timed-out and failed checks stay
      failing
    origin:
    - spec:2026-11-24-ci-economy#R3
    - spec:2026-11-24-ci-economy#R4
    levels:
      unit:
      - super-fr:tests/unit/test_checkstate.py#test_cancelled_unfinished_and_unknown_states_are_pending
      - super-fr:tests/unit/test_checkstate.py#test_failed_states_fail
      - super-fr:tests/unit/test_triage_batch_drive.py#test_checks_verdict_reads_a_cancelled_required_check_as_pending
      - super-fr:tests/unit/test_settle_evaluate.py#test_a_cancelled_check_is_pending_never_red
      - super-fr:tests/unit/test_triage_collect.py#test_collect_buckets_a_cancelled_check_as_pending
      - super-fr:tests/unit/test_queue_exec.py#test_a_cancelled_required_check_is_pending_and_late_after_the_wait
      - super-fr:tests/unit/test_tripwire_checkstate.py#test_no_module_grows_its_own_cancelled_check_rule
      - super-fr:tests/unit/test_run_ci_evidence.py#test_a_cancelled_gate_waits_while_a_run_is_still_going
      - super-fr:tests/unit/test_run_ci_evidence.py#test_a_cancelled_gate_nothing_replaces_is_refused_naming_a_rerun
    status: ci
    notes: fr.checkstate is the one rule; each reader's unit test reads CANCELLED as
      pending and TIMED_OUT/STALE as failing, the check-state tripwire holds, and slot_check
      reports a cancelled check late after wait_minutes (ci-economy phase 1); verify_ci's
      ref re-pointed to the tests the phase 1 review renamed it into (phase 4)
    verify: none
  - id: queue-regenerates-generated
    capability: triage-queue
    acceptance: A queue combination whose only conflicts are declared generated files
      or docs reviewed stamps is built by regenerating the files and taking the newer
      stamp, and is tested like any entry; a real conflict, a failing mirror command
      or one that writes outside the generated globs still hands the entry back
    origin:
    - spec:2026-11-24-ci-economy#R8
    - spec:2026-11-24-ci-economy#R9
    - spec:2026-11-24-ci-economy#R10
    - spec:2026-11-24-ci-economy#R11
    - spec:2026-11-24-ci-economy#R12
    - spec:2026-11-24-ci-economy#R13
    - spec:2026-11-24-ci-economy#R14
    levels:
      unit:
      - super-fr:tests/unit/test_triage_regen.py#test_classify_sorts_paths_into_whole_hunk_and_real
      - super-fr:tests/unit/test_triage_model.py#test_a_schema_16_facts_file_loads_with_no_generated_globs
      - super-fr:tests/unit/test_triage_yaml_mirrors.py#test_the_mirrors_are_the_five_sync_scripts_through_uv_run_frozen
      int:
      - super-fr:tests/integration/test_queue_regen.py#test_a_whole_generated_conflict_is_regenerated_by_the_mirrors
      - super-fr:tests/integration/test_queue_regen.py#test_a_stamp_conflict_takes_the_newer_date_with_no_mirrors
      - super-fr:tests/integration/test_queue_regen.py#test_a_failing_mirror_hands_the_entry_back_naming_the_command
      - super-fr:tests/integration/test_queue_drive_cmd.py#test_the_drive_regenerates_a_generated_file_both_entries_changed
    status: ci
    notes: 'ci-economy phase 4: regen.py resolves reviewed stamps and generated blocks
      (two regular blobs with marker hunks only); the builder runs the base''s mirrors
      in a git-less export of the combination with a named environment, kills their
      process group, and copies back only generated changes; super-fr declares its mirrors
      and generated globs; tested over real bare repos for squash, rebase and merge'
    verify: none
amendments:
  - row: ci-superseded-runs
    op: reword
    base: 0
    acceptance: A pull-request CI run superseded by a newer push to the same pull request
      is cancelled, and the pull request's head reports only the newer run's ci-ok;
      pushes to main and fr-queue/** and merge groups are never cancelled, and ci-ok
      is never skipped
    why: 'spec-review s-r1-3: ci-ok keeps if: always()'
  - row: ci-landed-skip
    op: reword
