# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-27-ci-hygiene
repo: derio-net/super-fr
rows:
  - id: ci-workflows-pin-the-python-floor
    capability: CI interpreter pin
    acceptance: Every workflow that installs uv runs on the declared requires-python
      floor (UV_PYTHON at workflow level), so no run downloads or drifts to another
      interpreter.
    origin:
    - spec:2026-11-27-ci-hygiene#R4
    levels:
      unit:
      - super-fr:tests/unit/test_ci_python_floor.py#test_every_uv_workflow_pins_uv_python_to_the_floor
    status: ci
    notes: every setup-uv workflow pins UV_PYTHON; unit test runs in CI
  - id: ci-workflows-least-privilege-token
    capability: CI token scope
    acceptance: Every workflow declares its token permissions at workflow level, and
      ci.yml's default is read-only contents, so no job silently takes the repository's
      default token scope.
    origin:
    - spec:2026-11-27-ci-hygiene#R5
    levels:
      unit:
      - super-fr:tests/unit/test_ci_lanes_workflow.py#test_ci_yml_default_token_is_read_only_contents
      - super-fr:tests/unit/test_ci_lanes_workflow.py#test_every_workflow_declares_workflow_level_permissions
    status: ci
    notes: workflow-level permissions pinned; unit tests run in CI
