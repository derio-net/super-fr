# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-28-batch-silent-failures
repo: derio-net/super-fr
rows:
  - id: install-warns-on-fr-refusal
    capability: Installer
    acceptance: When fr models apply refuses during install, the install continues,
      prints a WARNING naming fr's exit code, message and remedy, and repeats every
      warning of the install at its end beside the installed fr version
    origin:
    - spec:2026-11-28-batch-silent-failures#R1
    - spec:2026-11-28-batch-silent-failures#R2
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: bootstrap-unreadable-tag-refuses
    capability: Installer
    acceptance: 'bootstrap.sh never drops a release tag silently: a tag whose install.sh
      git cannot read stops bootstrap with an ERROR naming the tag and git''s message,
      while an absent or unmarked install.sh is still skipped'
    origin:
    - spec:2026-11-28-batch-silent-failures#R3
    - spec:2026-11-28-batch-silent-failures#R4
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: forge-read-failure-named
    capability: Forge adapters
    acceptance: fr run adopt and fr push still fail open when a PR's state cannot be
      read, and print one redacted stderr line naming the PR and the reason (a login
      page included)
    origin:
    - spec:2026-11-28-batch-silent-failures#R5
    - spec:2026-11-28-batch-silent-failures#R6
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
  - id: debt-unsupported-forge-named
    capability: Debt report
    acceptance: fr debt publishes a forge operation the backend does not support as
      'not supported on <backend> (<issue>)', never 'forge error', and fr debt issue
      prints each unavailable source's reason on stderr
    origin:
    - spec:2026-11-28-batch-silent-failures#R7
    - spec:2026-11-28-batch-silent-failures#R8
    levels: {}
    status: not-implemented
    notes: ''
    verify: none
