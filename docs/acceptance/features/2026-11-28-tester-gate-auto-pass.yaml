# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: 2026-11-28-tester-gate-auto-pass
repo: derio-net/super-fr
rows:
  - id: loose-gated-pr-rows-walked-pass
    capability: Triage driver
    acceptance: A whole-scope drive pass passes each held post-merge gate of a merged
      PR outside any batch once every row that gate holds reads walked on the default
      branch, swapping its label, commenting why and closing its owed trackers, under
      the same rules as a batch
    origin:
    - spec:2026-11-28-tester-gate-auto-pass#R1
    - spec:2026-11-28-tester-gate-auto-pass#R2
    - spec:2026-11-28-tester-gate-auto-pass#R4
    levels:
      unit:
      - super-fr:tests/unit/test_triage_drive_loose.py#test_a_whole_scope_drive_passes_a_loose_prs_walked_gate
      - super-fr:tests/unit/test_triage_pr_gates.py#test_walked_rows_of_a_loose_pr_plan_one_gate_pass_naming_its_repo
    status: ci
    notes: driver passes a loose PR's walked gate end to end
    verify: none
  - id: loose-gated-pr-awaiting-live
    capability: Triage driver
    acceptance: A whole-scope drive pass labels each open issue cited by a non-batch
      gated PR's held rows fr:awaiting-live, at most once per issue per pass across
      batches and such PRs
    origin:
    - spec:2026-11-28-tester-gate-auto-pass#R3
    levels:
      unit:
      - super-fr:tests/unit/test_triage_pr_gates.py#test_r3_a_loose_pr_and_a_gated_batch_citing_one_issue_label_it_once
      - super-fr:tests/unit/test_triage_pr_gates.py#test_an_open_issue_a_row_cites_is_labelled_once_across_calls
    status: ci
    notes: one awaiting-live label per issue across batches and loose PRs
    verify: none
  - id: loose-gated-pr-no-pass-without-evidence
    capability: Triage driver
    acceptance: The driver passes nothing for a non-batch gated PR whose branch no run
      cursor names, whose rows cannot be read (reported once), or in a drive narrowed
      with --batch; a failed write is reported and retried next pass
    origin:
    - spec:2026-11-28-tester-gate-auto-pass#R5
    - spec:2026-11-28-tester-gate-auto-pass#R6
    - spec:2026-11-28-tester-gate-auto-pass#R7
    levels:
      unit:
      - super-fr:tests/unit/test_triage_pr_gates.py#test_a_cursor_naming_another_pr_gives_no_rows
      - super-fr:tests/unit/test_triage_pr_gates.py#test_two_cursors_naming_the_branch_are_unreadable_for_a_pr
      - super-fr:tests/unit/test_triage_drive_loose.py#test_a_drive_narrowed_with_batch_writes_nothing_for_a_loose_pr
      - super-fr:tests/unit/test_triage_drive_loose.py#test_rows_unreadable_for_a_loose_pr_are_reported_once_and_plan_nothing
      - super-fr:tests/unit/test_triage_drive_loose.py#test_a_failed_label_write_for_a_loose_pr_is_reported_and_exits_one
    status: ci
    notes: no cursor, another PR, two cursors, unreadable rows, narrowed drive and failed
      write plan or write nothing
    verify: none
  - id: loose-gated-pr-batch-guards
    capability: Triage driver
    acceptance: Walked rows never pass a loose PR's run-level gate that no row inherits,
      its ops-promoted devops gate, or a held gate with no rows; those pass only through
      fr gate pass
    origin:
    - spec:2026-11-28-tester-gate-auto-pass#R2
    levels:
      unit:
      - super-fr:tests/unit/test_triage_pr_gates.py#test_r2_the_batch_guards_hold_for_a_loose_pr
    status: ci
    notes: the batch guards hold for a loose PR
    verify: none
  - id: closed-out-batch-gated-pr-pass
    capability: Triage driver
    acceptance: A whole-scope drive pass passes the walked post-merge gate of a closed-out
      batch's merged PR, which the batch route skips
    origin:
    - spec:2026-11-28-tester-gate-auto-pass#R8
    levels:
      unit:
      - super-fr:tests/unit/test_triage_pr_gates.py#test_a_batch_pr_without_a_closeout_is_not_loose_but_a_closed_out_one_is
      - super-fr:tests/unit/test_triage_pr_gates.py#test_a_closed_out_batchs_pr_given_as_a_loose_ledger_is_passed
    status: ci
    notes: a closed-out batch's PR is loose and planned
    verify: none
amendments:
  - row: loose-gated-pr-no-pass-without-evidence
    op: reword
    base: 0
    acceptance: The driver passes nothing for a loose gated PR whose branch no run cursor
      names, whose cursor names another PR, whose branch two cursors name or whose rows
      cannot be read (both reported once), or in a drive narrowed with --batch; a failed
      write is reported and retried next pass
    why: 'spec review s2: the cursor must name this PR'
