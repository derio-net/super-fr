# Acceptance rows owned by one feature (spec 2026-11-04-repo-feature-settings R16).
# The effective matrix is a fold over every fragment in this directory
# (`fr acceptance status`); it is never stored. Write rows with
# `fr acceptance add` / `set-status`, never by hand. Keep `rows:` before
# `amendments:`.
schema_version: 2
feature: legacy
repo: derio-net/super-fr
rows:
  - id: cncd-runner-ingest-dispatch
    capability: CNCD runner
    acceptance: An operator can dispatch an eligible tracked plan phase to cncd via
      the cncd runner; the plan folder is posted to /v1/ingest and the phase is stamped
      synced only after success
    origin:
    - super-fr:packages/fr-cncd/src/fr_cncd/runner.py
    levels:
      int:
      - super-fr:tests/integration/test_cncd_stub_server.py
    status: ci
    notes: Loopback stub server pins the cncd wire contract, entry-point registration,
      preflight failure, and fr_dispatch.tick end-to-end path in CI.
  - id: acceptance-report-dual
    capability: Acceptance report
    acceptance: The committed report set is generated together and regenerated on every
      matrix mutation (fr acceptance add / report --deterministic / init).
    origin:
    - spec:2026-07-24-acceptance-dual-reports
    - spec:2026-07-25-acceptance-report-formats
    levels:
      unit:
      - super-fr:tests/unit/test_acceptance_report.py
      - super-fr:tests/unit/test_acceptance_status_add.py
    status: ci
    notes: render_committed_set writes the whole set; add/init regenerate it. File set
      is report_local.html + report_linked.html + report_linked.md (see acceptance-report-formats).
  - id: runner-unit-refusal
    capability: Runner and tracker negotiation
    acceptance: fr apply --to <runner> refuses, before any forge call, a runner that
      takes no phase work; and a tick that refuses an item for its unit says so instead
      of blaming the repo.
    origin:
    - super-fr:docs/superpowers/implemented/journals/debug/2026-09-27-apply-runner-units.md
    levels:
      unit:
      - super-fr:tests/unit/test_apply_runner_units.py
    status: ci
    notes: 'super-fr#644. Runner.units is a class attribute read off the registered
      entry point (fr_dispatch.registry.runner_units) without building the runner, since
      vk and cncd have no from_env. apply refuses a runner whose units lack phase (herdr:
      run only) or that declares none, with exit 2 and _make_gh_client never called.
      vk, cncd and herdr each gate can_dispatch on their own units, so the declaration
      and the per-item gate cannot drift. tick reports a unit refusal as unit_mismatch
      naming the units the runner does take; any other can_dispatch refusal is reported
      as a refusal naming the runner, unit and repo, with the historical unknown_repo
      metric reason kept.'
  - id: statusline-shows-bound-workspace
    capability: isolation-traceability
    acceptance: The Claude Code status line shows the branch this session works on and
      its fr-isolation worktree path (or no fr-isolation), green when fr and purple
      when not, well inside one status-line refresh (0.5 s CI guard).
    origin:
    - spec:2026-09-04-worktree-traceability
    - spec:2026-09-14-statusline-session-branch
    levels:
      int:
      - super-fr:tests/unit/test_statusline_segment.py
      - super-fr:tests/unit/test_statusline_claude.py
    status: ci
    notes: 'Contract v2 (spec 2026-09-14). Golden subprocess tests, filed under int
      because the matrix has no golden level. Segment plugins/super-fr/scripts/fr-statusline-segment.sh
      (test_statusline_segment.py): a live binding wins, a stale binding (worktree gone)
      is ignored, a cwd inside an fr workspace is fr, plain linked and detached agent
      worktrees are none, non-repo and missing cwd, the plain / ansi / oneline formats
      and --cwd, a 0.5 s CI timing guard, and a trap fr on PATH proving the fr CLI is
      never invoked. Reference status line plugins/super-fr/scripts/fr-statusline-claude.sh
      (test_statusline_claude.py): three lines (model, ctx and rates; branch row and
      ~/cwd; worktree row), a symlinked script still finds the segment, a missing segment
      degrades to purple none rows, and float percentages are floored. Measured on the
      operator Mac (2026-09-14, /bin/bash 3.2, Xcode git first on PATH): bound about
      77 ms, unbound in a repo about 100 ms, non-repo about 65 ms. Operator-side wiring
      (~/.claude/statusline.sh) is the manual phase 5. LIVE 2026-09-24 (P7): with ~/.claude/statusline.sh
      symlinked to the cache''s fr-statusline-claude.sh, the demo2 session showed ''branch:
      wt/demo2 | ~/.cache/fr/worktrees/super-fr/wt__demo2'' / ''worktree: <that path>'',
      and a native non-fr worktree showed ''no fr-isolation''.'
  - id: agent-worktrees-reaped-by-fr
    capability: isolation-conformity
    acceptance: A subagent's isolation worktree is cut outside the repo, locked with
      its Claude session's pid, and every dispatch fires a sweep that reaps it once
      it is at least 24h old (72h while its session's pid still answers), clean, and
      every commit on it is reachable from a ref; dirty or unreachable ones are reported,
      never removed.
    origin:
    - super-fr:docs/superpowers/implemented/journals/debug/2026-11-01-agent-worktrees-accumulate.md
    levels:
      unit:
      - super-fr:tests/unit/test_isolation_agent_worktrees.py
      - super-fr:tests/unit/test_isolation_gc_hygiene.py#test_gc_runs_the_agent_worktree_sweep
      int:
      - super-fr:tests/unit/test_hooks_worktree.py#TestWorktreeCreate::test_agent_worktree_lands_outside_the_repo
      - super-fr:tests/unit/test_hooks_worktree.py#TestWorktreeCreate::test_agent_worktree_is_locked_with_the_session_pid
    status: ci
    notes: 'gh#1270. Hook level filed under int (no hook level). LIVE 2026-11-01, Claude
      Code 2.1.316, throwaway repo registering this branch''s fr-worktree-create.sh
      as its only WorktreeCreate hook: the subagent ran in ~/.cache/fr/agent-worktrees/repo/agent-<id>,
      locked with the Claude pid; WorktreeRemove was never fired (twice observed); the
      sweep skipped it as young, then with the clock at +25h and the pid dead reaped
      and logged it. Claude Code accepted the out-of-repo path for a subagent.'
    issues:
    - derio-net/super-fr#1270
    harnesses:
    - claude-code
  - id: run-resolve-requires-briefing
    capability: Run cursor
    acceptance: A grouped unit cannot be resolved through its own member resolve until
      fr run advance has briefed it, so that path can no longer leave a done unit with
      no dispatch record
    origin:
    - super-fr:docs/superpowers/implemented/journals/debug/2026-09-21-508-live-test-plan-defects.md
    levels:
      unit:
      - super-fr:tests/unit/test_run_resolve_requires_advance.py#test_a_unit_that_was_never_advanced_cannot_be_resolved
      - super-fr:tests/unit/test_run_resolve_requires_advance.py#test_once_advanced_it_resolves_and_the_attempt_is_there
    status: ci
    notes: 'C3, found live on PR #508''s post-merge Test Plan: review-phase resolved
      done with no advance, leaving a done unit with no attempt. The member-resolve
      path now holds the rule the flat path always had. NARROWED in review: a whole-group
      resolve and an adopted done unit still end done with no attempt, by design, and
      an unclaimed record names no holder - so this row claims the member path only.'
