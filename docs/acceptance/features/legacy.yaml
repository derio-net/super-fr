    capability: Run cursor
    acceptance: fr resolves a tier's model only for work it dispatched to that tier;
      a unit the orchestrator runs itself never carries a tier's model - it records
      the orchestrator's OBSERVED model, or none when unobservable
    origin:
    - super-fr:docs/superpowers/implemented/journals/debug/2026-09-21-508-live-test-plan-defects.md
    levels:
      unit:
      - super-fr:tests/unit/test_run_orchestrator_model.py#test_an_orchestrator_run_unit_records_no_model
      - super-fr:tests/unit/test_run_orchestrator_model.py#test_a_model_the_orchestrator_reports_is_kept
    status: ci
    notes: 'C2 of the #508 defects. Refined 2026-09-21 (debug journal 2026-09-21-fr-goal-first-run-contracts,
      C3): the orchestrator''s model is no longer invisible - its session transcript
      names it - so an orchestrator-run unit now records the model fr OBSERVES there;
      what this row forbids, a tier''s model on work the tier never touched, is unchanged.
      The seven false archived reviews stay as they are (archives are frozen). See run-records-observed-models.'
