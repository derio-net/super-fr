      - super-fr:tests/unit/test_hostclient.py
      - super-fr:tests/unit/test__urls.py
    status: skipped
    notes: 'LIVE-VERIFIED 2026-09-19 against a self-hosted GitLab (gh-486): fr apply
      rendered, observed, diffed and applied two phases as GitLab Issues with correctly-shaped
      labels (#-prefixed 6-hex, applied once), re-ran clean, and propagated a state
      change then re-converged. Transcript in the PR. The row was previously ''ci''
      for a capability broken FOUR independent ways, none findable by unit test: the
      missing mandatory ref parameter; the Issue web_url being /-/work_items/N, which
      fr stored and then refused to parse (crashing observe on every re-apply, on gitlab.com
      too); ensure_labels aborting the whole apply on a 409 for a label that already
      existed, a tolerance its own docstring had claimed since 2026-07-09; and the body
      diff never converging because GitLab strips the rendered trailing newline. ''skipped'',
      NOT ''ci'': CI cannot reach a private instance, so the live half is hand-run per-PR.
      The unit half now asserts the REQUEST and the real captured error vocabulary,
      so the arg-blind ''lambda args:'' mocks that hid all of this are gone.'
