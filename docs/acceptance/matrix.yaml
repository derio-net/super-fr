      - super-fr:tests/unit/test_isolation.py#test_gc_warns_no_pr_branch_with_unmerged_commits
      - super-fr:tests/unit/test_isolation.py#test_gc_does_not_reap_fresh_branch_at_default_tip
      - super-fr:tests/unit/test_isolation.py#test_gc_does_not_reap_merged_content_with_dirty_worktree
      - super-fr:tests/unit/test_isolation.py#test_gc_content_reap_dry_run_mutates_nothing
      - super-fr:tests/unit/test_isolation.py#test_up_spawns_background_gc
