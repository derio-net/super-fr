    status: not-implemented
    notes: 'Spec 3.A. Per-artifact stamps chosen over a repo manifest because a manifest
      cannot describe a half-migrated tree. Phase 1 lands the registry and a reader/writer
      per kind, and the unit refs cover the second half of the claim in CI — an absent
      stamp reads as version 1, not an error, for all five kinds, and `fr validate
      artifacts` now fails an unreadable or newer-than-this-fr stamp on every kind.
      RE-EVALUATED IN PHASE 7 AND DELIBERATELY LEFT RED. The FIRST half is still unmet
      and nothing in this plan changed it — only plans carry a stamp in practice, while
      `fr journal add`, `fr run start` / `fr run adopt` (save_run_state) and the spec
      writer all emit unstamped files. Absence READING as 1 is not the same claim as
      every generated artifact DECLARING its version, and flipping this row on that
      equivalence would be exactly the overclaim the row exists to prevent. What closes
      it — the generators write the stamp, which is owed at the moment a kind''s
      current_version first moves past 1, in the same PR that must widen that kind''s
      extra=forbid model with an optional defaulted schema_version field (finding
      f-closed-world-models-reject-a-stamp; obligation now standing in
      .claude/rules/artifact-versioning.md).'
