      tests that gate those rows say nothing about this one. It closes with post-merge
      Test Plan items 13 and 14 - a real /fr-goal run on Claude Code recording harness
      claude-code with a real subagent task id, and the same on OpenCode recording harness
      opencode with a child session id - transcripts in the PR.'
