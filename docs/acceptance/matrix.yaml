  - id: run-unit-record-migrates
    capability: Run cursor
    acceptance: A v4 cursor's items, dispatch and accounting migrate into one unit map
      with no loss
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: The first body-rewriting run migration (4 to 5). Business-level because every
      in-flight run on every node rides it the moment the plugin updates; a lossy migration
      here silently corrupts live cursors.
  - id: run-legacy-cursors-still-migrate
    capability: Artifact migration
    acceptance: A version 1, 2 or 3 run cursor still migrates all the way to the current
      version after fields were removed from the live model
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'Pins the flaw the spec''s first draft had: every run migration parsed with
      the LIVE model, so removing items/dispatch/accounting would have made the chain
      refuse every old cursor at its first hop. Business-level because a node whose
      plugin updates mid-flight would otherwise be stranded.'
  - id: run-migration-atomic-per-cursor
    capability: Artifact migration
    acceptance: A cursor the body-rewriting migration cannot fully convert is left byte-identical,
      never half-rewritten, and every other cursor still migrates
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'The first run migration that can half-write. A partial v4 measurement is
      the concrete refusal case: refused and named, never silently dropped to make the
      new model constructible.'
  - id: run-upgrade-mid-run-keeps-holder
    capability: Artifact migration
    acceptance: A run upgraded while a phase is held still refuses a second dispatch
      and still names the holder
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'The end-to-end claim for an in-flight run: the witness survives the shape
      change. If this fails, upgrading fr during a run silently re-opens the gh#499
      hazard.'
  - id: run-adopted-cursor-refuses-double-dispatch
    capability: Run cursor
    acceptance: A run adopted from disk, which records no attempts, still refuses to
      re-brief a running unit
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'gh#519''s behaviour preserved under decision u1: with no attempt to name,
      the refusal falls back to ALREADY RUNNING rather than lifting.'
  - id: run-adopt-writes-unit-records
    capability: Run cursor
    acceptance: fr run adopt produces a current-version cursor whose already-complete
      phases are done units with no invented attempts
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: adopt.py is the first WRITER of the old items map and was missing from the
      spec's first draft. An empty attempt list is the honest record that fr never dispatched
      that phase.
  - id: run-abandoned-attempt-is-measured
    capability: Run cursor
    acceptance: An abandoned attempt's spend is measured at the moment it is abandoned
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: The spend most worth seeing is the spend that produced nothing. Before this,
      abandoning a unit discarded its cost entirely.
  - id: run-status-cost-under-holder
    capability: Run cursor
    acceptance: fr run status shows each attempt's cost beneath its holder, with estimate
      and measurement labelled as different quantities
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'Carries gh#514''s never-blurred rule through the move: an estimate is one
      dispatch''s assembled context, a measurement is cumulative billing, and on a real
      unit they differed by about 1426x.'
  - id: run-review-evidence-cannot-be-faked
    capability: Run cursor
    acceptance: Review evidence must be a review entry for that same phase; a finding,
      or a review of another phase, is refused
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: Without this the evidence gate is satisfiable by any journal id, which would
      make skipped and passed-clean the same state again with extra steps.
  - id: run-legacy-reviews-not-retro-failed
    capability: Run cursor
    acceptance: Reviews resolved before the evidence gate existed are shown as unevidenced
      debt and are never retroactively failed
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: An obligation cannot be enforced backwards in time. Without this, every in-flight
      run fails its check on the day the plugin updates.
  - id: workflow-without-evidence-unchanged
    capability: Workflow shapes
    acceptance: A repo-authored workflow that declares no evidence resolves its steps
      exactly as before
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: The gate is opt-in per step. Pins that consumer repos' custom shapes are
      untouched until they ask for it.
  - id: run-stalled-reported-not-failed
    capability: Run cursor
    acceptance: A unit held beyond the threshold is reported with its age and never
      fails the check
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: gh#503's 11.5-hour executor made visible from fr. Never a failure, because
      fr cannot tell a long phase from a dead agent and must not kill a legitimate one.
  - id: run-idle-guard-never-wedges
    capability: Harness parity
    acceptance: The idle Stop guard stays silent when no run is bound to the session
      and fails open on any fr error
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: The worst outcome of this whole spec is an operator who cannot end a turn.
      A guard that wedges a session over its own bug is worse than the stall it prevents.
  - id: run-idle-guard-allows-waiting
    capability: Harness parity
    acceptance: Ending a turn while a dispatched executor is still working is allowed
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'The subtle legitimate stop: on Claude Code a background executor''s return
      arrives as a notification, so a turn that ends while a unit is HELD is correct.
      Separated from run-idle-detected because it is the case most likely to be got
      wrong.'
  - id: run-cost-attributed-by-agent-id
    capability: Run cursor
    acceptance: A claimed attempt's cost is selected by its agent id, so overlapping
      dispatches neither lose nor swap their measurements
    origin:
    - super-fr:docs/superpowers/specs/2026-09-20-unit-record-unification-design.md
    levels: {}
    status: not-implemented
    notes: 'Operator asked whether ''exactly one dispatch'' was a per-phase assumption.
      It is run-wide and temporal: gh#514 selects a transcript by TIME WINDOW and yields
      nothing when two overlap. The attempt''s agent id is also the transcript filename,
      so selection becomes exact under any concurrency; the window stays as the fallback
      for unclaimed attempts only.'
