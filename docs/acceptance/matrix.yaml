  - id: multibackend-gitlab-tracking
    capability: Multi-backend git hosting
    acceptance: An operator can run fr apply against a GitLab-backed repo and see phases
      rendered/observed/diffed/applied as GitLab Issues with correctly-shaped GitLab
      labels (color, length)
    origin:
    - super-fr:docs/superpowers/specs/2026-07-09-multi-backend-git-host-adapters-design.md
    levels:
      unit:
      - super-fr:tests/unit/test_glab.py
