      test_claim_abandoned_leaves_the_flat_steps_state_running, test_advance_after_abandon_briefs_again_and_appends_a_second_record),
      and it refuses a unit with no open record or a stray --agent. Live-verified by
      closing this run''s own bootstrap-era open records (journal x-abandon-live). Unit
      is the whole level the spec asks for on this row.'
  - id: run-dispatch-harness-neutral
