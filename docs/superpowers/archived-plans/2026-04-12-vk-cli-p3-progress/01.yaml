      ```python
      @progress_app.command()
      def transition(
          target: str = typer.Argument(
              ..., help="Plan path (local) or Issue ref like #N (dispatch)."
          ),
          new_state: str = typer.Argument(..., help="New lifecycle state."),
          dry_run: bool = typer.Option(False, "--dry-run", help="Preview without mutating."),
          yes: bool = typer.Option(False, "--yes", help="Execute without prompting."),
      ) -> None:
          """Transition a work item to a new lifecycle state."""
          validate_dry_run_yes(dry_run, yes)

          profile = load_profile_from_cwd()

          if profile.dispatch_enabled and target.startswith("#"):
              _transition_dispatch(target, new_state, profile, dry_run, yes)
          else:
              _transition_local(Path(target), new_state, dry_run, yes)


      def _transition_local(
          plan_path: Path, new_state: str, dry_run: bool, yes: bool
      ) -> None:
          """Local mode: edit plan Status header + spec index sync."""
          plan_path = plan_path.resolve()
          if not plan_path.exists():
              console.print(f"[red]Plan not found:[/red] {plan_path}")
              raise typer.Exit(2)

          plan = parse_plan(plan_path)
          old_status = plan.status

          if dry_run:
              console.print(
                  f"Would transition: [yellow]{old_status}[/yellow] -> [green]{new_state}[/green]"
              )
              return

          if not yes:
              typer.confirm(
                  f"Transition {plan_path.name}: {old_status} -> {new_state}. Proceed?",
                  abort=True,
              )

          rewrite_status(plan_path, new_state)
          console.print(
              f"Transitioned: [yellow]{old_status}[/yellow] -> [green]{new_state}[/green]"
          )

          if plan.spec:
              spec_path = _resolve_spec_path(plan_path, plan.spec)
              if spec_path and spec_path.exists():
                  update_spec_index(spec_path, plan_path, new_state)
                  console.print(f"Updated spec index in: {spec_path}")


      def _transition_dispatch(
          issue_ref: str, new_state: str, profile: object, dry_run: bool, yes: bool
      ) -> None:
          """Dispatch mode: move Issue lifecycle state on board."""
          from vk.gh import transition_issue

          issue_number = issue_ref.lstrip("#")

          if dry_run:
              console.print(
                  f"Would transition Issue #{issue_number} -> [green]{new_state}[/green]"
              )
              return

          if not yes:
              typer.confirm(
                  f"Transition Issue #{issue_number} to {new_state}?", abort=True
              )

          transition_issue(
              repo=profile.dispatch.default_repo,
              issue_number=int(issue_number),
              new_state=new_state,
              project=profile.dispatch.project_board,
          )
          console.print(f"Transitioned Issue #{issue_number} -> [green]{new_state}[/green]")
      ```
