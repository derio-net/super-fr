      ```python
      @progress_app.command()
      def board(
          format: str = typer.Option("table", "--format", help="Output format: table or json."),
          stale_days: Optional[int] = typer.Option(
              None, "--stale-days", help="Show only plans not updated in N days."
          ),
      ) -> None:
          """Show work status board."""
          profile = load_profile_from_cwd()

          if profile.dispatch_enabled:
              _board_dispatch(profile, format, stale_days)
          else:
              _board_local(format, stale_days)


      def _board_local(format: str, stale_days: int | None) -> None:
          """Scan local plan files, group by Status header."""
          import json as json_mod
          from datetime import datetime, timedelta

          from vk.config import find_repo_root
          from vk.plan.parser import parse_plan

          repo_root = find_repo_root()
          plans_dir = repo_root / "docs" / "superpowers" / "plans"
          if not plans_dir.exists():
              console.print("[red]No plans directory found.[/red]")
              raise typer.Exit(1)

          board_data: dict[str, list[dict[str, str]]] = {}
          for plan_file in sorted(plans_dir.glob("*.md")):
              try:
                  plan = parse_plan(plan_file)
              except Exception:
                  continue

              if stale_days is not None:
                  mtime = datetime.fromtimestamp(plan_file.stat().st_mtime)
                  if datetime.now() - mtime < timedelta(days=stale_days):
                      continue

              status = plan.status
              board_data.setdefault(status, []).append({
                  "file": plan_file.name,
                  "title": plan.title,
                  "status": status,
              })

          if format == "json":
              typer.echo(json_mod.dumps(board_data, indent=2))
          else:
              from rich.table import Table

              table = Table(title="Plan Status Board")
              table.add_column("Status", style="bold")
              table.add_column("Plan")
              table.add_column("Title")
              for status, plans in board_data.items():
                  for p in plans:
                      table.add_row(status, p["file"], p["title"])
              console.print(table)


      def _board_dispatch(
          profile: object, format: str, stale_days: int | None
      ) -> None:
          """Dispatch mode: query project board via gh."""
          import json as json_mod

          from vk.gh import query_project_board

          items = query_project_board(profile)

          if format == "json":
              typer.echo(json_mod.dumps(items, indent=2))
          else:
              from rich.table import Table

              table = Table(title="Project Board")
              table.add_column("Title", style="bold")
              table.add_column("Status")
              for item in items:
                  table.add_row(item.get("title", ""), item.get("status", ""))
              console.print(table)
      ```
