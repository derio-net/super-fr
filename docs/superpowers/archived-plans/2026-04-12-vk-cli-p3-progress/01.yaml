      Create progress_cmd.py with sync subcommand (local mode)


      Create `src/vk/commands/progress_cmd.py`:

      ```python
      """vk progress — track work lifecycle."""

      from __future__ import annotations

      from pathlib import Path
      from typing import Optional

      import typer
      from rich.console import Console

      from vk.commands.common import validate_dry_run_yes
      from vk.config import load_profile
      from vk.plan.parser import parse_plan
      from vk.plan.writer import rewrite_status
      from vk.spec_index import update_spec_index

      console = Console(stderr=True)
      progress_app = typer.Typer(help="Track work lifecycle.")


      def _compute_status_from_checkboxes(plan_path: Path) -> str:
          """Derive status from checkbox states in the plan file."""
          plan = parse_plan(plan_path)
          all_tasks = plan.all_tasks
          if not all_tasks:
              return "Not Started"

          total_steps = 0
          checked_steps = 0
          for task in all_tasks:
              for step in task.steps:
                  total_steps += 1
                  if step.state in ("x", "-"):
                      checked_steps += 1

          if total_steps == 0:
              return "Not Started"
          if checked_steps == 0:
              return "Not Started"
          if checked_steps == total_steps:
              return "Complete"
          return "In Progress"


      @progress_app.command()
      def sync(
          plan_path: Path = typer.Argument(..., help="Path to the plan file."),
          dry_run: bool = typer.Option(False, "--dry-run", help="Preview without mutating."),
          yes: bool = typer.Option(False, "--yes", help="Execute without prompting."),
      ) -> None:
          """Sync plan progress: checkboxes -> Status header -> spec index."""
          validate_dry_run_yes(dry_run, yes)

          plan_path = plan_path.resolve()
          if not plan_path.exists():
              console.print(f"[red]Plan not found:[/red] {plan_path}")
              raise typer.Exit(2)

          profile = load_profile(plan_path)

          if profile.dispatch_enabled:
              _sync_dispatch(plan_path, profile, dry_run, yes)
          else:
              _sync_local(plan_path, dry_run, yes)


      def _sync_local(plan_path: Path, dry_run: bool, yes: bool) -> None:
          """Local mode: checkboxes -> Status header -> spec index."""
          new_status = _compute_status_from_checkboxes(plan_path)
          plan = parse_plan(plan_path)
          old_status = plan.status

          if old_status == new_status:
              console.print(f"Status already [bold]{new_status}[/bold]. Nothing to sync.")
              return

          if dry_run:
              console.print(
                  f"Would update Status: [yellow]{old_status}[/yellow] -> [green]{new_status}[/green]"
              )
              if plan.spec:
                  console.print(f"Would update spec index in: {plan.spec}")
              return

          if not yes:
              typer.confirm(
                  f"Update Status: {old_status} -> {new_status}. Proceed?", abort=True
              )

          rewrite_status(plan_path, new_status)
          console.print(
              f"Status: [yellow]{old_status}[/yellow] -> [green]{new_status}[/green]"
          )

          if plan.spec:
              spec_path = _resolve_spec_path(plan_path, plan.spec)
              if spec_path and spec_path.exists():
                  update_spec_index(spec_path, plan_path, new_status)
                  console.print(f"Updated spec index in: {spec_path}")


      def _sync_dispatch(
          plan_path: Path, profile: object, dry_run: bool, yes: bool
      ) -> None:
          """Dispatch mode: Issue states -> checkboxes -> spec index."""
          from vk.gh import query_issue_states

          plan = parse_plan(plan_path)
          if not plan.phases:
              console.print("[red]Dispatch sync requires a phased plan.[/red]")
              raise typer.Exit(2)

          issue_states = query_issue_states(plan)
          changes: list[tuple[str, str, str]] = []

          for phase in plan.phases:
              if phase.tracking_url:
                  issue_state = issue_states.get(phase.tracking_url, None)
                  if issue_state:
                      new_status = _map_issue_state_to_status(issue_state)
                      changes.append((f"Phase {phase.number}", phase.title, new_status))

          if not changes:
              console.print("No dispatched phases with state changes found.")
              return

          if dry_run:
              for phase_id, title, status in changes:
                  console.print(f"Would sync {phase_id} ({title}): -> {status}")
              return

          if not yes:
              typer.confirm(f"Sync {len(changes)} phase(s) from Issues. Proceed?", abort=True)

          for phase_id, title, status in changes:
              console.print(f"Synced {phase_id} ({title}): -> {status}")

          new_plan_status = _compute_status_from_checkboxes(plan_path)
          rewrite_status(plan_path, new_plan_status)

          if plan.spec:
              spec_path = _resolve_spec_path(plan_path, plan.spec)
              if spec_path and spec_path.exists():
                  update_spec_index(spec_path, plan_path, new_plan_status)


      def _map_issue_state_to_status(issue_state: str) -> str:
          """Map GitHub Issue lifecycle state to plan status."""
          state_map = {
              "open": "In Progress",
              "closed": "Complete",
              "done": "Complete",
              "in_progress": "In Progress",
              "todo": "Not Started",
          }
          return state_map.get(issue_state.lower(), "In Progress")


      def _resolve_spec_path(plan_path: Path, spec_ref: str) -> Path | None:
          """Resolve a spec reference (relative path) to an absolute path."""
          repo_root = plan_path.parent
          while repo_root != repo_root.parent:
              if (repo_root / ".git").exists():
                  return repo_root / spec_ref
              repo_root = repo_root.parent
          return None
      ```
