      ```python
      @progress_app.command()
      def audit(
          format: str = typer.Option("report", "--format", help="Output: report or json."),
      ) -> None:
          """Audit plan health: drift, staleness, consistency."""
          profile = load_profile_from_cwd()
          findings: list[dict[str, str]] = []

          # Local-always checks
          findings.extend(_audit_status_vs_checkboxes())
          findings.extend(_audit_spec_index_drift())
          findings.extend(_audit_stale_plans())

          # Dispatch-only checks
          if profile.dispatch_enabled:
              findings.extend(_audit_issue_drift(profile))

          if format == "json":
              import json as json_mod

              typer.echo(json_mod.dumps({"findings": findings}, indent=2))
          else:
              if not findings:
                  console.print("[green]Audit clean. No issues found.[/green]")
              else:
                  from rich.table import Table

                  table = Table(title="Audit Findings")
                  table.add_column("Severity", style="bold")
                  table.add_column("Check")
                  table.add_column("Detail")
                  for f in findings:
                      table.add_row(f.get("severity", ""), f.get("check", ""), f.get("detail", ""))
                  console.print(table)


      def _audit_status_vs_checkboxes() -> list[dict[str, str]]:
          """Check that plan Status headers match actual checkbox state."""
          from vk.config import find_repo_root

          findings: list[dict[str, str]] = []
          repo_root = find_repo_root()
          plans_dir = repo_root / "docs" / "superpowers" / "plans"
          if not plans_dir.exists():
              return findings

          for plan_file in plans_dir.glob("*.md"):
              try:
                  plan = parse_plan(plan_file)
                  computed = _compute_status_from_checkboxes(plan_file)
                  if plan.status != computed:
                      findings.append({
                          "severity": "warning",
                          "check": "status-mismatch",
                          "detail": (
                              f"{plan_file.name}: Status header says '{plan.status}' "
                              f"but checkboxes indicate '{computed}'"
                          ),
                      })
              except Exception:
                  continue
          return findings


      def _audit_spec_index_drift() -> list[dict[str, str]]:
          """Check that spec index tables match plan statuses."""
          from vk.config import find_repo_root
          from vk.spec_index import read_spec_index

          findings: list[dict[str, str]] = []
          repo_root = find_repo_root()
          specs_dir = repo_root / "docs" / "superpowers" / "specs"
          plans_dir = repo_root / "docs" / "superpowers" / "plans"
          if not specs_dir.exists() or not plans_dir.exists():
              return findings

          for spec_file in specs_dir.glob("*.md"):
              index_entries = read_spec_index(spec_file)
              for entry in index_entries:
                  plan_file = plans_dir / entry["file"]
                  if plan_file.exists():
                      try:
                          plan = parse_plan(plan_file)
                          if plan.status != entry.get("status"):
                              findings.append({
                                  "severity": "warning",
                                  "check": "spec-index-drift",
                                  "detail": (
                                      f"{spec_file.name} says '{entry.get('status')}' "
                                      f"for {entry['file']} but plan says '{plan.status}'"
                                  ),
                              })
                      except Exception:
                          continue
          return findings


      def _audit_stale_plans() -> list[dict[str, str]]:
          """Flag plans with In Progress status but no recent file changes."""
          from datetime import datetime, timedelta

          from vk.config import find_repo_root

          findings: list[dict[str, str]] = []
          repo_root = find_repo_root()
          plans_dir = repo_root / "docs" / "superpowers" / "plans"
          if not plans_dir.exists():
              return findings

          stale_threshold = timedelta(days=14)
          for plan_file in plans_dir.glob("*.md"):
              try:
                  plan = parse_plan(plan_file)
                  if plan.status == "In Progress":
                      mtime = datetime.fromtimestamp(plan_file.stat().st_mtime)
                      if datetime.now() - mtime > stale_threshold:
                          days_old = (datetime.now() - mtime).days
                          findings.append({
                              "severity": "info",
                              "check": "stale-plan",
                              "detail": (
                                  f"{plan_file.name}: In Progress but not modified "
                                  f"in {days_old} days"
                              ),
                          })
              except Exception:
                  continue
          return findings


      def _audit_issue_drift(profile: object) -> list[dict[str, str]]:
          """Dispatch-only: check for Issue state drift vs local plan state."""
          from vk.config import find_repo_root
          from vk.gh import query_project_board

          findings: list[dict[str, str]] = []
          repo_root = find_repo_root()
          plans_dir = repo_root / "docs" / "superpowers" / "plans"
          if not plans_dir.exists():
              return findings

          try:
              board_items = query_project_board(profile)
          except Exception:
              findings.append({
                  "severity": "error",
                  "check": "issue-drift",
                  "detail": "Failed to query project board",
              })
              return findings

          for plan_file in plans_dir.glob("*.md"):
              try:
                  plan = parse_plan(plan_file)
                  for phase in plan.phases:
                      if phase.tracking_url:
                          for item in board_items:
                              if str(item.get("issue_number", "")) in phase.tracking_url:
                                  remote_status = _map_issue_state_to_status(
                                      item.get("status", "")
                                  )
                                  local_status = plan.status
                                  if remote_status != local_status:
                                      findings.append({
                                          "severity": "warning",
                                          "check": "issue-drift",
                                          "detail": (
                                              f"{plan_file.name} Phase {phase.number}: "
                                              f"Issue says '{item.get('status')}' "
                                              f"but plan says '{local_status}'"
                                          ),
                                      })
              except Exception:
                  continue
          return findings
      ```
