    text: |-
      Implement create subcommand


      Add to `progress_cmd.py`:

      ```python
      GATE_REFUSAL_MESSAGE = """Dispatch unavailable -- no `dispatch:` block in `docs/superpowers/plan-config.yaml` for this repo.

      To enable, add this to the file:

        dispatch:
          target: github-issues
          owner: <your-github-owner>
          project_board: "<Project Name>"
          default_repo: <owner>/<repo>
          labels:
            agentic: vk-ready
            manual: manual
      """


      @progress_app.command()
      def create(
          title: str = typer.Argument(..., help="Title for the new work item."),
          type: str = typer.Option(..., "--type", help="Type: agentic or manual."),
          repo: Optional[str] = typer.Option(None, "--repo", help="Target repo (OWNER/REPO)."),
          lifecycle: Optional[str] = typer.Option(
              None, "--lifecycle", help="Initial lifecycle state."
          ),
          dry_run: bool = typer.Option(False, "--dry-run", help="Preview without mutating."),
          yes: bool = typer.Option(False, "--yes", help="Execute without prompting."),
      ) -> None:
          """Create a new work item (dispatch-only)."""
          validate_dry_run_yes(dry_run, yes)

          profile = load_profile_from_cwd()

          if not profile.dispatch_enabled:
              typer.echo(GATE_REFUSAL_MESSAGE)
              raise typer.Exit(1)

          target_repo = repo or profile.dispatch.default_repo
          label = profile.dispatch.labels.get(type, type)

          if dry_run:
              console.print(f"Would create Issue: [bold]{title}[/bold]")
              console.print(f"  Repo: {target_repo}")
              console.print(f"  Label: {label}")
              if lifecycle:
                  console.print(f"  Lifecycle: {lifecycle}")
              return

          if not yes:
              typer.confirm(f"Create Issue '{title}' in {target_repo}?", abort=True)

          from vk.gh import create_issue

          issue_url = create_issue(
              repo=target_repo,
              title=title,
              labels=[label],
              project=profile.dispatch.project_board,
              lifecycle=lifecycle,
          )
          console.print(f"Created: [link={issue_url}]{issue_url}[/link]")
      ```
