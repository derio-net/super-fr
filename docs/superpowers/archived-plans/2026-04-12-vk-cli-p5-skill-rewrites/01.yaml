          result = runner.invoke(
              app,
              ["install-skills", "--copy"],
              catch_exceptions=False,
              env={
                  "VK_PACKAGE_ROOT": str(mock_skills),
                  "VK_CLAUDE_HOME": str(mock_claude_dir),
