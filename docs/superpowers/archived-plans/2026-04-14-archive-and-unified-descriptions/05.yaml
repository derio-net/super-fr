schema_version: 2
phase:
  number: 5
  title: Operational migration
  tag: manual
  depends_on: []
  tracking_issue: https://github.com/derio-net/superpowers-for-vk/issues/14
tasks:
- number: 1
  title: Verify bridge changes deployed
  steps:
  - id: P5.T1.S1
    text: |-
      Confirm bridge-fail-loud plan is archived


      ```bash
      ls /home/claude/repos/agent-images/docs/superpowers/archived-plans/2026-04-14-bridge-fail-loud-and-blocker-preamble.md
      ```

      Expected: file exists at that path. If not, stop and investigate.
  - id: P5.T1.S2
    text: |-
      Confirm the running bridge script matches the agent-images source


      The pod's supercronic runs the bridge from whatever path the active `~/.crontab` points at. Until the next image rebuild lands, that's the in-repo agent-images clone; afterwards it will be `/opt/scripts/vk-issue-bridge.py` baked into the image.

      ```bash
      # Identify the path actually invoked from ~/.crontab
      grep -oE '/[^ ]*vk-issue-bridge\.py' /home/claude/.crontab | head -1
      # Diff that path against the agent-images source of truth
      diff "$(grep -oE '/[^ ]*vk-issue-bridge\.py' /home/claude/.crontab | head -1)" \
           /home/claude/repos/agent-images/kali/scripts/vk-issue-bridge.py
      ```

      Expected: no output (files identical). If output shows changes, either the crontab override is stale or the image hasn't been rebuilt yet — resolve before running the operational migration.
- number: 2
  title: Migrate Frank hextra plan
  steps:
  - id: P5.T2.S1
    text: |-
      Dry-run migrate


      ```bash
      cd /home/claude/repos/frank
      vk dispatch migrate docs/superpowers/plans/2026-04-13--repo--blog-hextra-migration.md --dry-run
      ```

      Expected: 5 rewrites printed (phases 1–5), each showing old title → new `[derio-net/frank] blog-hextra-migration · Phase N/5 · ...` title. If any Issue is CLOSED, the line reads `Skip #N: CLOSED`.
  - id: P5.T2.S2
    text: |-
      Apply migrate


      ```bash
      vk dispatch migrate docs/superpowers/plans/2026-04-13--repo--blog-hextra-migration.md --yes
      ```

      Expected: 5 `Migrated #N` lines (or fewer, for CLOSED phases).
  - id: P5.T2.S3
    text: |-
      Confirm bridge ingests phase 1, defers others


      Wait for the next bridge cron tick (≤ 2 minutes), then:

      ```bash
      tail -80 /home/claude/.willikins-agent/vk-bridge.log
      ```

      Expected log contents: `p derio-net/frank#69: blocked by #68` (and similar for #70, #71, #72). Phase 1 (#68) should either be already-synced (has `vk-synced` label) or sync now if it wasn't before. No workspace created for phases 2–5 until phase 1 closes.
- number: 3
  title: Migrate remaining open plans
  steps:
  - id: P5.T3.S1
    text: |-
      Enumerate open plans across repos


      ```bash
      for repo in /home/claude/repos/superpowers-for-vk /home/claude/repos/agent-images /home/claude/repos/frank /home/claude/repos/willikins; do
        for plan in "$repo"/docs/superpowers/plans/*.md; do
          [ -f "$plan" ] || continue
          status=$(grep -m1 '^**Status:**' "$plan" | sed 's/**Status:**\s*//')
          [ "$status" = "Complete" ] || echo "$plan ($status)"
        done
      done
      ```

      Review the output. Any plan that was dispatched before this work shipped is a migration candidate.
  - id: P5.T3.S2
    text: |-
      Migrate each candidate


      For each plan from Step 1 with tracking comments:

      ```bash
      vk dispatch migrate <plan> --dry-run
      vk dispatch migrate <plan> --yes
      ```

      Spot-check one migrated Issue in the GitHub UI — confirm the new title format and tracking block render as expected.
- number: 4
  title: Verify bridge behavior end-to-end
  steps:
  - id: P5.T4.S1
    text: |-
      Confirm dep-gating active across all repos


      ```bash
      tail -200 /home/claude/.willikins-agent/vk-bridge.log | grep -E '(blocked|deferred|synced)' | tail -30
      ```

      Expected: `p ... blocked by ...` lines for every migrated multi-phase plan's non-phase-0 Issues whose blockers remain open. Absence of such lines when blockers exist is a regression — abort and open a bug.
  - id: P5.T4.S2
    text: |-
      Mark this plan Complete


      Edit this file's `**Status:**` header to `Complete`, then:

      ```bash
      vk progress sync docs/superpowers/plans/2026-04-14-archive-and-unified-descriptions.md --yes
      ```

      The archive flow from Phase 2 moves the plan to `archived-plans/` and commits.
