                  gh.GhError("forbidden", stderr="HTTP 403", returncode=1),
              ])
              result = runner.invoke(execute_app, [
                  "pr-opened", "--issue", "8", "--repo", "o/r",
                  "--pr-url", "https://github.com/o/r/pull/14",
