tasks:
- number: 1
  title: Bump version triplet
  steps:
  - id: P5.T1.S1
    text: |-
      Update `pyproject.toml` — set `[project].version = "2.0.0"`
  - id: P5.T1.S2
    text: |-
      Update `.claude-plugin/plugin.json` — set `.version = "2.0.0"`
  - id: P5.T1.S3
    text: |-
      Update `.claude-plugin/marketplace.json` — set `.plugins[0].version = "2.0.0"`
  - id: P5.T1.S4
    text: |-
      Run `uv sync` — uv.lock picks up `vk==2.0.0`
  - id: P5.T1.S5
    text: |-
      Verify `uv run vk --version` — outputs `2.0.0`
- number: 2
  title: CHANGELOG
  steps:
  - id: P5.T2.S1
    text: |-
      Add v2.0.0 section to `CHANGELOG.md`

      Brief but explicit: "BREAKING — full rewrite per 2026-05-06 spec. Plan format is now folder-based (v2.0); use `vk migrate v1-to-v2` to convert existing v1 plans. CLI surface collapses to `vk apply`, `vk plan create/edit/rework`, `vk pickup`, `vk spec status`, `vk migrate`. The bridge in willikins requires Plan 2 to migrate to v2 vk; until then it operates on consumer repos that haven't migrated."
- number: 3
  title: Tag and push
  steps:
  - id: P5.T3.S1
    text: |-
      Commit Phase 5

      ```
      release: v2.0.0 — single state machine rebuild

      Per docs/superpowers/specs/2026-05-06-vk-rebuild-state-machine-design.md.
      ```
  - id: P5.T3.S2
    text: |-
      Tag

      ```
      git tag -a v2.0.0 -m "v2.0.0 — single state machine rebuild"
      git push --tags
      ```
  - id: P5.T3.S3
    text: |-
      Verify tag visible — `gh release view v2.0.0` (or check github.com)


