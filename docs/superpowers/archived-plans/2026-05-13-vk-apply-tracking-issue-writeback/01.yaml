      - `test_set_tracking_issue_idempotent_on_same_url`: call twice
        with the same URL; assert the second call does not raise; assert
        the file bytes are identical between the two calls (capture
        `phase_path.read_bytes()` before and after the second call).

      Run: `uv run pytest tests/unit/test_plan_ops.py -x -q --no-cov`
      Expect: red — `vk.plan_ops` does not yet expose `set_tracking_issue`
      (AttributeError at import or first call).
  - id: P1.T1.S2
    text: |-
      Extend `tests/unit/test_plan_ops.py` with the remaining unit tests:

      - `test_set_tracking_issue_overwrites_different_non_null_url`: write
        URL_A, then write URL_B against the same phase. Assert no
        exception. Assert the yaml ends up with URL_B.
      - `test_set_tracking_issue_raises_when_phase_yaml_missing`: call
        with `phase_n=99` (no `99.yaml` in fixture). Assert
        `pytest.raises(PlanEditError)` with a message mentioning the
        missing file path.
      - `test_set_tracking_issue_works_for_manual_phase`: copy the
        minimal fixture, then before any test call edit `01.yaml` to set
        `phase.tag: manual` (via `yaml.safe_load` + dump). Call
        `set_tracking_issue`; assert the same yaml-mutation outcome (URL
        present in the file, file staged).
      - `test_set_tracking_issue_raises_on_post_write_schema_invalid`:
        construct a plan dir whose `_meta.yaml` validates pre-write but
        where mutating the phase yaml is sufficient to break a schema
        invariant. The simplest path is to monkeypatch
        `vk.plan_ops.parse` to raise `PlanSchemaError` only on the
        *second* call (post-write); use `unittest.mock.patch` with a
        `side_effect` list. Assert `pytest.raises(PlanEditError)`.

      Run: `uv run pytest tests/unit/test_plan_ops.py -x -q --no-cov`
      Expect: red on all four new tests (same AttributeError).
  - id: P1.T1.S3
    text: |-
      Implement `set_tracking_issue` in `src/vk/plan_ops.py`. Place it in
      the `# vk.plan.tick / vk.plan.complete_phase` section, between
      `complete_phase` and the `# vk.plan.rework_*` section header.

      Implementation:

      ```python
      def set_tracking_issue(plan_dir: Path, phase_n: int, url: str) -> None:
          """Persist phase.tracking_issue back to <plan_dir>/<NN>.yaml.

          Idempotent on same url; overwrites on different. Stages but does
          not commit.
          """
          plan = parse(plan_dir)  # pre-write validation + repo_root capture
          phase_path = plan_dir / f"{phase_n:02d}.yaml"
          if not phase_path.exists():
              raise PlanEditError(f"phase {phase_n} yaml not found: {phase_path}")
          raw = yaml.safe_load(phase_path.read_text())
          if raw["phase"].get("tracking_issue") == url:
              return
          raw["phase"]["tracking_issue"] = url
          phase_path.write_text(_yaml_dump(raw))
          try:
              parse(plan_dir)
          except PlanSchemaError as e:
              raise PlanEditError(f"post-write schema validation failed: {e}") from e
          _stage(plan.repo_root, [phase_path])
      ```

      No other changes to `plan_ops.py`.
  - id: P1.T1.S4
    text: |-
      Confirm all unit tests for the helper are green.

      Run: `uv run pytest tests/unit/test_plan_ops.py -v --no-cov`
      Expect: 6 passed.

      If any test fails, fix the implementation or test until all pass
      before proceeding to T2.
- number: 2
  title: Wire CLI writeback in `apply_cmd.py`
  steps:
  - id: P1.T2.S1
    text: |-
      Write failing tests in `tests/unit/test_v2_apply.py` for the CLI
      writeback. Match the existing test style — those tests call the
      library `apply()` directly. For the CLI-level tests, invoke
      `apply_cmd.apply_command(...)` directly with arguments, after
      monkeypatching `apply_cmd._make_gh_client` to return a
      `FakeGhClient` (the file's docstring at the top of `apply_cmd.py`
      explicitly documents this as the test seam).

      Tests to add:

      - `test_apply_command_writes_tracking_issue_back`: with `yes=True`,
        run apply_command against a tmp plan whose phase has
        `tracking_issue: null`. After the call, re-read `01.yaml` and
        assert `phase.tracking_issue` equals the URL the FakeGhClient
        minted.
      - `test_apply_command_second_run_emits_no_issue_create`: run
        apply_command with `yes=True` twice in a row against the same
        plan. Inspect the second run's dry-run preview (capture stdout
        or json) and assert it contains zero `IssueCreate` mutations.
      - `test_apply_command_dry_run_does_not_write_back`: run
        apply_command with `yes=False`. Assert phase yaml still has
        `tracking_issue: null`.

      Run: `uv run pytest tests/unit/test_v2_apply.py -k writeback -x -q --no-cov`
      Expect: red — the CLI does not yet invoke the writeback.
  - id: P1.T2.S2
    text: |-
      Extend `tests/unit/test_v2_apply.py` with the remaining CLI tests:

      - `test_apply_command_partial_failure_isolates_writeback`: prepare
        a 2-phase plan. Monkeypatch `FakeGhClient.create_issue` to raise
        for phase 2 (e.g. check the title) but succeed for phase 1.
        Assert phase 1's yaml has the new URL; phase 2's yaml is still
        `null`; the result's `failures` contains a phase-2 entry.
      - `test_apply_command_writeback_failure_surfaced_in_json_and_text`:
        monkeypatch `vk.commands.apply_cmd.plan_ops.set_tracking_issue`
        to raise `PlanEditError("disk full")`. Run with
        `output_format="json"`. Assert the exit code is 4 (catch
        `typer.Exit` or check via the Typer CliRunner). Assert the JSON
        output's `tracking_issue_writeback_failures` is non-empty with
        the expected `phase_number`, `url`, `error` fields. Assert the
        text output (run separately) contains a "writeback failed"
        message naming the URL.
      - `test_apply_command_all_isolates_writeback_per_plan`: create two
        plans in the tmp repo. Monkeypatch `set_tracking_issue` to raise
        only when the path contains the second plan's slug (inspect the
        arg). Run with `all_plans=True, yes=True`. Assert the first
        plan's yaml has its URL; the second plan's yaml does not.

      Run: `uv run pytest tests/unit/test_v2_apply.py -k writeback -x -q --no-cov`
      Expect: red on the three new tests.
  - id: P1.T2.S3
    text: |-
      Add new imports to `src/vk/commands/apply_cmd.py`. In the existing
      import block (lines 27-39), add:

      ```python
      from vk import plan_ops
      from vk.plan_ops import PlanEditError
      ```

      Place them alphabetically with the existing `vk.*` imports — after
      `from vk.parser import PlanSchemaError, parse` and before
      `from vk.render import render`.
  - id: P1.T2.S4
    text: |-
      Insert the writeback loop in `_apply_one`. After the existing line
      `result = apply(d, gh)` (around line 154), add:

      ```python
      writeback_failures: list[dict[str, Any]] = []
      for phase_n, url in result.created_issues.items():
          try:
              plan_ops.set_tracking_issue(plan_dir, phase_n, url)
          except (PlanEditError, OSError, PlanSchemaError) as e:
              writeback_failures.append(
                  {"phase_number": phase_n, "url": url, "error": str(e)}
              )
      ```

      Extend the failure-display block (around lines 160-163) to print
      writeback failures after `result.failures`:

      ```python
      if writeback_failures:
          parts.append(f"\n{len(writeback_failures)} writeback failure(s):")
          for wf in writeback_failures:
              parts.append(
                  f"  phase {wf['phase_number']}: writeback of "
                  f"{wf['url']} failed: {wf['error']} "
                  "(backfill `phase.tracking_issue` manually or re-run apply)"
              )
      ```

      Adjust the exit-code logic so the function returns 4 if EITHER
      `result.failures` OR `writeback_failures` is non-empty. Replace
      the existing `if result.failures: ... return 4, ...` block with a
      unified check that handles both lists.
  - id: P1.T2.S5
    text: |-
      Extend the JSON output in `_apply_one`. After the existing
      `json_out["created_issues"] = ...` line, add:

      ```python
      json_out["tracking_issue_writeback_failures"] = writeback_failures
      ```

      Also initialise the key in the dry-run JSON path (around line 142)
      as an empty list, so consumers can always read the key without
      feature-detecting:

      ```python
      json_out: dict[str, Any] = {
          ...
          "created_issues": {},
          "tracking_issue_writeback_failures": [],
      }
      ```
  - id: P1.T2.S6
    text: |-
      Confirm all CLI tests are green.

      Run: `uv run pytest tests/unit/test_v2_apply.py -v --no-cov`
      Expect: existing tests still pass + 6 new writeback tests green.

      If anything fails, fix and re-run before proceeding to T3.
