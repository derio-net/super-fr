              |------|------|------|------------|
              | x | derio-net/other | docs/superpowers/plans/x/ | — |
          """).strip())
          meta = parse_spec(spec)
          status = compute_status(meta, tmp_path, gh=None)   # explicit
          assert status.plans[0].state == "Unreachable"
      ```

      Run all spec tests:
      `uv run pytest tests/unit/test_spec.py tests/unit/test_spec_cross_repo.py -x -q --no-cov`
      Expect: green.
