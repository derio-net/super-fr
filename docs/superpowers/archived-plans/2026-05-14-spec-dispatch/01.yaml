      Run: `uv run pytest tests/unit/test_spec.py::test_parse_deps_cell -x -q --no-cov`
      Expect: red — `_parse_deps_cell` doesn't exist.
  - id: P1.T3.S2
    text: |-
      Implement `_parse_deps_cell` in `src/vk/spec.py`. Place it
      above `parse_spec`.

      ```python
      _ROOT_SENTINELS: frozenset[str] = frozenset({"—", "-", "None", ""})


      def _parse_deps_cell(cell: str) -> tuple[str, ...]:
          """Split a Depends-on cell into ref tuple. No validation; bad
          refs survive untouched (validation runs separately at apply
          time, see spec §1.3)."""
          s = cell.strip()
          if s in _ROOT_SENTINELS:
              return ()
          return tuple(part.strip() for part in s.split(";") if part.strip())
      ```

      Re-run: `uv run pytest tests/unit/test_spec.py::test_parse_deps_cell -x -q --no-cov`
      Expect: green.
