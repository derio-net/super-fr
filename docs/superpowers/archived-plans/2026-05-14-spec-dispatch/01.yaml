  - id: P1.T1.S3
    text: |-
      Implement `RealGhClient.read_repo_file` in
      `src/vk/real_ghclient.py`.

      Use `gh api repos/{repo}/contents/{path}?ref={ref}` with header
      `Accept: application/vnd.github.raw` to return the raw bytes
      without base64 round-trip.

      ```python
      def read_repo_file(self, repo, path, *, ref="main"):
          proc = subprocess.run(
              ["gh", "api",
               f"repos/{repo}/contents/{path}",
               "-H", "Accept: application/vnd.github.raw",
               "-f", f"ref={ref}"],
              capture_output=True,
          )
          if proc.returncode != 0:
              stderr = proc.stderr.decode("utf-8", errors="replace")
              if "Not Found" in stderr or "404" in stderr:
                  raise FileNotFoundError(
                      f"gh contents 404: {repo}:{ref}:{path}"
                  )
              raise RealGhClientError(f"gh api failed: {stderr.strip()}")
          return proc.stdout
      ```

      Note: keep using the existing `_run_gh` / subprocess helper if
      this module already has one — match local conventions. Add the
      method directly under `create_issue` for proximity to other
      file-shaped operations.

      Add `tests/unit/test_real_ghclient.py::test_read_repo_file_404_translates_to_filenotfound`
