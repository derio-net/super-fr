      ```python
      import textwrap
      from pathlib import Path
      from tests.unit.fakes import FakeGhClient   # adjust import to repo layout
      from vk.spec import parse_spec, compute_status


      def _make_phase_yaml(phase_n: int, complete: bool) -> bytes:
          completion = "completion:\n  at: 2026-05-14T00:00:00Z" if complete else "completion:\n  at: null"
          return textwrap.dedent(f"""
              schema_version: 2
              phase:
                number: {phase_n}
                title: t
                tag: agentic
                depends_on: []
              tasks: []
              state:
                steps: {{}}
                {completion}
          """).strip().encode()


      def test_compute_status_resolves_cross_repo_via_gh(tmp_path):
          spec = tmp_path / "spec.md"
          spec.write_text(textwrap.dedent("""
              # Cross-repo spec
              ## Implementation Plans
              | Plan | Repo | File | Depends on |
              |------|------|------|------------|
              | upstream | derio-net/other | docs/superpowers/plans/up/ | — |
          """).strip())
          gh = FakeGhClient(repo_files={
              ("derio-net/other", "docs/superpowers/plans/up/_meta.yaml", "main"):
                  b"schema_version: 2\nplan: up\nspec: x.md\ntarget_repo: derio-net/other\nvk_version: '>=2.0.0,<3.0.0'\ncreated: '2026-05-14'\n",
              ("derio-net/other", "docs/superpowers/plans/up/01.yaml", "main"):
                  _make_phase_yaml(1, complete=True),
          })
          meta = parse_spec(spec)
          status = compute_status(meta, tmp_path, gh=gh)
          up = status.plans[0]
          assert up.state == "Complete"
          assert up.phases_complete == 1
      ```

      Run: `uv run pytest tests/unit/test_spec_cross_repo.py -x -q --no-cov`
      Expect: red — `compute_status` signature doesn't accept `gh`,
      and cross-repo path is not implemented.
  - id: P1.T4.S2
    text: |-
      Extend `compute_status` in `src/vk/spec.py`:

      ```python
      def compute_status(
          spec: SpecMeta,
          repo_root: Path,
          gh: GhClient | None = None,
      ) -> SpecStatus:
          ...
      ```

      In the per-row loop, when `_resolve_local_plan_dir` returns
      None AND `gh is not None`, materialise the plan via gh
      contents API into a temp directory and parse it from there.
      Add a helper:

      ```python
      def _materialise_cross_repo_plan(
          ref: PlanRef,
          gh: GhClient,
      ) -> Path | None:
          """Fetch plan files from gh into a temp dir; return the
          dir. Returns None on 404; caller emits Unreachable."""
          import tempfile, yaml
          tmpdir = Path(tempfile.mkdtemp(prefix="vk-spec-xrepo-"))
          base = ref.file.rstrip("/")
          try:
              meta_bytes = gh.read_repo_file(ref.repo, f"{base}/_meta.yaml")
          except FileNotFoundError:
              return None
          (tmpdir / "_meta.yaml").write_bytes(meta_bytes)
          # Walk phase yamls — they're named NN.yaml (zero-padded 2-digit).
          # We don't know N a priori; probe 01..99 and stop at first 404.
          for n in range(1, 100):
              fname = f"{n:02d}.yaml"
              try:
                  phase_bytes = gh.read_repo_file(ref.repo, f"{base}/{fname}")
              except FileNotFoundError:
                  if n == 1:
                      return None  # no phase yamls — malformed plan
                  break
              (tmpdir / fname).write_bytes(phase_bytes)
          # Optional _prose.md — best-effort.
          try:
              prose = gh.read_repo_file(ref.repo, f"{base}/_prose.md")
              (tmpdir / "_prose.md").write_bytes(prose)
          except FileNotFoundError:
              pass
          return tmpdir
      ```

      Wire into `compute_status`: when `_resolve_local_plan_dir`
      returns None for a cross-repo row AND `gh is not None`, call
      `_materialise_cross_repo_plan`. If it returns None → emit
      `state="Unreachable"` with note `gh contents 404: <path>`. If
      non-None → parse the tempdir via the existing `parse(local)`
      flow.

      Clean up the tempdir with `shutil.rmtree` after the parse, in
      a try/finally inside the row loop. (Don't accumulate temp
      dirs.)

      Re-run: `uv run pytest tests/unit/test_spec_cross_repo.py -x -q --no-cov`
      Expect: green.
  - id: P1.T4.S3
    text: |-
      Add a regression test for the 404 → Unreachable path.

      Append to `tests/unit/test_spec_cross_repo.py`:

      ```python
      def test_compute_status_cross_repo_404_emits_unreachable(tmp_path):
          spec = tmp_path / "spec.md"
          spec.write_text(textwrap.dedent("""
              # spec
              ## Implementation Plans
              | Plan | Repo | File | Depends on |
              |------|------|------|------------|
              | gone | derio-net/other | docs/superpowers/plans/gone/ | — |
          """).strip())
          gh = FakeGhClient(repo_files={})   # empty — every read 404s
          meta = parse_spec(spec)
          status = compute_status(meta, tmp_path, gh=gh)
          gone = status.plans[0]
          assert gone.state == "Unreachable"
          assert "404" in (gone.note or "")
      ```

      Also verify the no-gh path stays as today (returns
