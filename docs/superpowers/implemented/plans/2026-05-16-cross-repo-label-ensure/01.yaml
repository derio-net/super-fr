  - id: P1.T3.S3
    text: |-
      Add the apply()-level end-to-end regression test.

      Add to `tests/unit/test_v2_apply.py`:

      ```python
      def test_apply_executes_cross_repo_mutations_through_correct_repo():
          """Issue #132 end-to-end. With the cross-repo fixture, apply()
          must ensure labels on repo-b (where phase 1 lives), then
          successfully apply IssueLabelChange/IssueStateChange/
          IssueBodyChange against repo-b — never accidentally
          target_repo (repo-a).
          """
          from pathlib import Path

          from tests.unit.fakes import FakeGhClient
          from vk import parse
          from vk.apply import apply
          from vk.diff import diff
          from vk.render import render
          from vk.states import GhState, PhaseObservation

          FIXTURE = Path(__file__).parent / "fixtures" / "v2_plan_cross_repo"
          plan = parse(FIXTURE)

          fake = FakeGhClient()
          # Preload repo-b#100 as OPEN with vk-ready. Body drifted so an
          # IssueBodyChange is emitted too.
          fake.add_issue(
              "derio-net/repo-b",
              100,
              state="OPEN",
              labels={"vk-ready"},
              body="stale body",
          )

          observed = GhState(
              phases={
                  1: PhaseObservation(
                      issue_state="OPEN",
                      issue_labels=frozenset({"vk-ready"}),
                      issue_assignees=(),
                      linked_prs=(),
                      body="stale body",
                  )
              }
          )
          rendered = render(plan, observed)
          d = diff(rendered, observed, plan=plan)
          result = apply(d, fake, plan=plan)

          # No failures — labels were ensured on the right repo, so
          # every per-issue mutation against repo-b succeeded.
          assert result.failures == (), f"unexpected failures: {result.failures}"

          # repo-b#100 actually mutated:
          issue_b = fake.issues[("derio-net/repo-b", 100)]
          assert "vk-ready" in fake.repo_labels.get("derio-net/repo-b", set())
          assert issue_b.body != "stale body", "body update never landed on repo-b"

          # repo-a (target_repo) got its own ensure for the undispatched
          # phase 2 that diff() emitted an IssueCreate for.
          assert "vk-ready" in fake.repo_labels.get("derio-net/repo-a", set())
      ```

      Run: `uv run pytest tests/unit/test_v2_apply.py::test_apply_executes_cross_repo_mutations_through_correct_repo -x -q --no-cov`
      Expect: green.
  - id: P1.T3.S4
    text: |-
      Add the bridge-tick regression test so the post-MCP
      `gh.edit_issue_labels(issue_repo, add={"vk-synced"})` path at
      `bridge/__init__.py:181` is covered for cross-repo plans.

      Read `tests/unit/test_vk_bridge_tick.py` to find the existing
      `_FakeVkMcpClient` or equivalent stub. If it doesn't exist as a
      reusable helper, inline a minimal one inside the new test.

      Add a new test (place near the other tick tests):

      ```python
      def test_tick_post_mcp_label_add_lands_on_tracking_repo():
          """Issue #132 bridge regression. After apply() succeeds, the
          bridge adds `vk-synced` to the phase Issue. For a cross-repo
          plan that label add must target the tracking_issue's repo,
          not plan.meta.target_repo.
          """
          from pathlib import Path

          from tests.unit.fakes import FakeGhClient
          from vk import parse
          from vk.bridge import tick

          class _StubMcp:
              def __init__(self) -> None:
                  self.created: list[dict] = []

              def create_card(self, *, title, body, issue_url):
                  self.created.append({"title": title, "issue_url": issue_url})
                  return "card-1"

              def update_card(self, *, card_id, status):
                  pass

          FIXTURE = Path(__file__).parent / "fixtures" / "v2_plan_cross_repo"
          plan = parse(FIXTURE)

          fake = FakeGhClient()
          fake.add_issue(
              "derio-net/repo-b",
              100,
              state="OPEN",
              labels={"vk-ready"},
              body="",  # body drift handled by render
          )

          result = tick(plan, fake, _StubMcp())
          assert result.errors == 0, f"unexpected failures: {result.failures}"

          # The post-MCP add-vk-synced call must have landed on repo-b,
          # never repo-a (target_repo).
          adds_to_repo_b = [
              c for c in fake.calls
              if c[0] == "edit_issue_labels"
              and c[1]["repo"] == "derio-net/repo-b"
              and "vk-synced" in c[1]["add"]
          ]
          assert adds_to_repo_b, "vk-synced was never added to repo-b#100"

          adds_to_repo_a = [
              c for c in fake.calls
              if c[0] == "edit_issue_labels"
              and c[1]["repo"] == "derio-net/repo-a"
              and "vk-synced" in c[1]["add"]
          ]
          assert not adds_to_repo_a, (
              f"vk-synced incorrectly added to target_repo: {adds_to_repo_a}"
          )
      ```

      Run: `uv run pytest tests/unit/test_vk_bridge_tick.py::test_tick_post_mcp_label_add_lands_on_tracking_repo -x -q --no-cov`
      Expect: green.
