- number: 2
  title: Tighten FakeGhClient to model gh's "label must exist" rule
  steps:
  - id: P1.T2.S1
    text: |-
      Update `tests/unit/fakes.py` so `edit_issue_labels` raises
      `FakeGhError` when the `add` set contains a label that has not
      been ensured on the destination repo. Without this, the
      cross-repo bug would not be unit-test-catchable in the future.

      Edit `FakeGhClient.edit_issue_labels` (around line 99-112):

      ```python
      def edit_issue_labels(
          self,
          repo: str,
          number: int,
          *,
          add: frozenset[str],
          remove: frozenset[str],
      ) -> None:
          self._gate()
          missing = set(add) - self.repo_labels.get(repo, set())
          if missing:
              raise FakeGhError(
                  f"label(s) not found on {repo}: {sorted(missing)}"
              )
          self.calls.append(
              ("edit_issue_labels", {"repo": repo, "number": number, "add": add, "remove": remove})
          )
          i = self.issues[(repo, number)]
          i.labels = (i.labels | set(add)) - set(remove)
      ```

      Note: `remove` is intentionally NOT checked. Real `gh issue edit
      --remove-label X` succeeds even if X isn't currently applied or
      defined on the repo; matching that lenient behavior keeps the
      fake honest.

      No new tests yet — the rule fires only when an existing test
      relies on previously-silent behavior.
  - id: P1.T2.S2
    text: |-
      Update `FakeGhClient.create_issue` with the same label-existence
      rule:

      ```python
      def create_issue(
          self,
          repo: str,
          *,
          title: str,
          body: str,
          labels: frozenset[str],
      ) -> str:
          self._gate()
          missing = set(labels) - self.repo_labels.get(repo, set())
          if missing:
              raise FakeGhError(
                  f"label(s) not found on {repo}: {sorted(missing)}"
              )
          self.calls.append(
              ("create_issue", {"repo": repo, "title": title, "body": body, "labels": labels})
          )
          n = self._next_issue_number.get(repo, 1)
          self._next_issue_number[repo] = n + 1
          self.issues[(repo, n)] = FakeIssue(number=n, body=body, labels=set(labels))
          return f"https://github.com/{repo}/issues/{n}"
      ```
