- number: 3
  title: Implement the diff() fix and add downstream regression tests
  steps:
  - id: P1.T3.S1
    text: |-
      Land the diff() fix per spec § Decision.

      Edit `src/vk/diff.py`:

      1. Add `from collections import defaultdict` after the existing
         `from dataclasses import dataclass` import (group with stdlib).
      2. Replace the leading-emission block at the current
         `diff.py:108-113` with the per-repo grouping. Specifically,
         replace:

         ```python
             # Always ensure managed labels exist on the repo before any Issue ops.
             # Rendered labels are LabelDefs (registry-colored); we filter by name
             # against the managed-prefix allowlist and pass LabelDefs straight to
             # the GhClient so colors/descriptions survive the trip.
             all_managed_labels: set[LabelDef] = set()
             for issue in rendered.issue_per_phase.values():
                 all_managed_labels.update(ld for ld in issue.labels if _is_managed(ld.name))
             if all_managed_labels:
                 mutations.append(RepoLabelEnsure(repo=repo, labels=frozenset(all_managed_labels)))
         ```

         With:

         ```python
             # Ensure managed labels exist on every destination repo before
             # any Issue ops. Group by destination so cross-repo plans
             # (target_repo != tracking_issue repo) get labels on the
             # repo where the IssueLabelChange will land. Issue #132.
             labels_per_repo: dict[str, set[LabelDef]] = defaultdict(set)
             for phase_n, ri in rendered.issue_per_phase.items():
                 phase = next(p for p in plan.phases if p.phase.number == phase_n)
                 tracking = phase.phase.tracking_issue
                 dest = parse_issue_url(tracking)[0] if tracking else repo
                 labels_per_repo[dest].update(
                     ld for ld in ri.labels if _is_managed(ld.name)
                 )
             for dest_repo in sorted(labels_per_repo):
                 labels = labels_per_repo[dest_repo]
                 if labels:
                     mutations.append(
                         RepoLabelEnsure(repo=dest_repo, labels=frozenset(labels))
                     )
         ```

      Note: `repo` is the local variable already bound at the top of
      `diff()` to `plan.meta.target_repo`. Using it for the
      undispatched-phase fallback keeps the call shape minimal.

      Run: `uv run pytest tests/unit/test_v2_diff.py::test_diff_emits_ensure_per_destination_repo -x -q --no-cov`
      Expect: green. The previously-red test now passes.
  - id: P1.T3.S2
    text: |-
      Confirm the fix didn't break any existing diff() tests.

      Run: `uv run pytest tests/unit/test_v2_diff.py -q --no-cov`
      Expect: all green. If the existing
      `test_diff_undispatched_yields_create`,
      `test_repo_label_ensure_carries_registry_colors`, or
      `test_diff_observed_matches_rendered_yields_minimal_diff`
