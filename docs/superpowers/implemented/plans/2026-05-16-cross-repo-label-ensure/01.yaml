      Add to `tests/unit/test_v2_diff.py`:

      ```python
      def test_diff_emits_ensure_per_destination_repo():
          """Issue #132 regression. A plan with target_repo=A and a phase
          tracking-issue on repo B must emit RepoLabelEnsure for BOTH repos
          so the subsequent IssueLabelChange against B doesn't fail with
          'label not found'.
          """
          from pathlib import Path

          from vk import parse
          from vk.diff import RepoLabelEnsure, diff
          from vk.render import render
          from vk.states import GhState, PhaseObservation

          FIXTURE = Path(__file__).parent / "fixtures" / "v2_plan_cross_repo"
          plan = parse(FIXTURE)

          # Phase 1 is dispatched on repo-b; phase 2 has no tracking_issue.
          observed = GhState(
              phases={
                  1: PhaseObservation(
                      issue_state="OPEN",
                      issue_labels=frozenset(),
                      issue_assignees=(),
                      linked_prs=(),
                  )
              }
          )
          rendered = render(plan, observed)
          d = diff(rendered, observed, plan=plan)

          ensures = [m for m in d.mutations if isinstance(m, RepoLabelEnsure)]
          repos = {m.repo for m in ensures}
          assert repos == {"derio-net/repo-a", "derio-net/repo-b"}, (
              f"expected ensures on both repos, got: {repos}"
          )
      ```

      Run: `uv run pytest tests/unit/test_v2_diff.py::test_diff_emits_ensure_per_destination_repo -x -q --no-cov`
      Expect: red — assertion fails with `repos == {"derio-net/repo-a"}`
      because `diff()` still emits only one RepoLabelEnsure on
      `target_repo`. Note the failure message and continue — this is the
      documented bug repro.
  - id: P1.T1.S3
    text: |-
      Write the passing regression-guard test that locks down the
      already-correct per-issue routing. This test must pass before AND
      after the fix; if it ever fails in the future, the issue-comment
      wider-scope claim has resurfaced as a real bug.

      Add to `tests/unit/test_v2_diff.py`:

      ```python
      def test_diff_routes_per_issue_mutations_to_tracking_repo():
          """Regression guard. IssueLabelChange/IssueStateChange/IssueBodyChange
          for a dispatched phase must carry the tracking_issue's repo,
          never plan.meta.target_repo. Issue #132 comment thread claimed
          these paths were broken; reading diff.py:134-171 shows they
          already use parse_issue_url(tracking).repo. This test pins it.
          """
          from pathlib import Path

          from vk import parse
          from vk.diff import (
              IssueBodyChange,
              IssueLabelChange,
              IssueStateChange,
              diff,
          )
          from vk.render import render
          from vk.states import GhState, PhaseObservation

          FIXTURE = Path(__file__).parent / "fixtures" / "v2_plan_cross_repo"
          plan = parse(FIXTURE)

          # Observed state for phase 1 (on repo-b): OPEN with vk-ready,
          # body drifted, so all three mutation kinds will be emitted.
          observed = GhState(
              phases={
                  1: PhaseObservation(
                      issue_state="OPEN",
                      issue_labels=frozenset({"vk-ready", "stale-label"}),
                      issue_assignees=(),
                      linked_prs=(),
                      body="stale body that doesn't match render output",
                  )
              }
          )
          rendered = render(plan, observed)
          d = diff(rendered, observed, plan=plan)

          phase1_muts = [
              m for m in d.mutations
              if isinstance(m, (IssueLabelChange, IssueStateChange, IssueBodyChange))
          ]
          assert phase1_muts, "expected per-issue mutations for phase 1"
          for m in phase1_muts:
              assert m.repo == "derio-net/repo-b", (
                  f"{type(m).__name__} routed to {m.repo!r}, expected derio-net/repo-b"
              )
      ```

      Run: `uv run pytest tests/unit/test_v2_diff.py::test_diff_routes_per_issue_mutations_to_tracking_repo -x -q --no-cov`
      Expect: green. This proves the comment's wider-scope claim does
      not match the current code.
