  steps:
  - id: P1.T4.S1
    text: |-
      Bump the version triple per CLAUDE.md § Release / version bumping.

      Edit three files, changing `2.1.4` → `2.1.5` in each:

      1. `pyproject.toml` — `version = "2.1.4"` → `version = "2.1.5"`
         under the `[project]` table.
      2. `.claude-plugin/plugin.json` — `"version": "2.1.4"` →
         `"version": "2.1.5"`.
      3. `.claude-plugin/marketplace.json` — `"version": "2.1.4"` →
         `"version": "2.1.5"` inside the first entry of `.plugins`.

      Verify all three are aligned:

      ```
      grep -nE 'version' pyproject.toml | head -3
      grep -nE 'version' .claude-plugin/plugin.json
      grep -nE 'version' .claude-plugin/marketplace.json
      ```

      Expect: every reported `version` line shows `2.1.5`.
  - id: P1.T4.S2
    text: |-
      Run `uv sync` so `uv.lock` picks up the new `vk==2.1.5` entry,
      then confirm the CLI reports the new version.

      Run: `uv sync`
      Expect: `uv.lock` updated; no errors.

      Run: `uv run vk --version`
      Expect: `vk 2.1.5`.

      Stage the lock file alongside the three version files:

      ```
      git add pyproject.toml .claude-plugin/plugin.json .claude-plugin/marketplace.json uv.lock
      ```
  - id: P1.T4.S3
    text: |-
      Run the full pre-push verification suite per CLAUDE.md § PR
      workflow expectations.

      Run each (sequentially — easier to triage a single failure):

      ```
      uv run ruff format src/ tests/
      uv run ruff check src/ tests/
      uv run mypy src/
      uv run pytest -q --no-cov
      ```

      Expect:
      - `ruff format` reports no files reformatted (or reformats and
        you stage the result).
      - `ruff check` exits 0.
      - `mypy` exits 0.
      - `pytest` reports all green.

      If `ruff format` modifies any file, stage and re-run `ruff
      check` before proceeding. If anything else fails, stop and fix
      the underlying cause; do not commit broken state.
  - id: P1.T4.S4
    text: |-
      Final integration check: the fix actually changes mutation
      shape for the cross-repo fixture when run through the CLI.

      Run:

      ```
      uv run vk apply tests/unit/fixtures/v2_plan_cross_repo
      ```

      Expect (in the diff preview): two `ensure labels on …` lines —
      one for `derio-net/repo-a`, one for `derio-net/repo-b`. The
      existing assertion test covers this, but doing it via the CLI
      confirms the end-to-end pipeline (parse → render → diff →
      _format_diff) is consistent with what the unit tests assert.
      Exit code should be 0 (no `--yes`, so it's dry-run).

      Note: the fixture won't pass `vk apply --yes` against real
      GitHub because `derio-net/repo-a` / `repo-b` don't exist as
      repos — `--dry-run` (the default) is what we want here. If the
      CLI errors out before the diff (parse error, etc.), stop and
      fix; don't proceed to commit.
