tasks:
- number: 1
  title: Enforcement guard tests — RED
  steps:
  - id: P1.T1.S1
    text: |
      RED: add three per-skill content assertions to
      tests/unit/test_skill_validation.py, following the existing
      `test_fr_execute_*` skip pattern (parametrized over `_SKILL_DIRS`,
      `pytest.skip` unless the target skill):
        - `test_fr_plan_tdd_names_all_three_beats`: for skill_dir.name ==
          "fr-plan", read SKILL.md and assert `"red → green → refactor"`
          appears (case-insensitive) — the canonical three-beat token.
        - `test_fr_plan_routes_to_canonical_tdd_skill`: for "fr-plan", assert
          `"superpowers:test-driven-development"` in text.
        - `test_fr_goal_routes_to_canonical_tdd_skill`: for "fr-goal", assert
          `"superpowers:test-driven-development"` in text.
      Run `uv run pytest tests/unit/test_skill_validation.py -q --no-cov`;
      confirm the three new tests FAIL (red) — the SKILL.md files still say
      "test first, always" and don't route to the skill.
- number: 2
  title: fr-plan SKILL.md — expand TDD rule + step-shape convention — GREEN
  steps:
  - id: P1.T2.S1
    text: |
      GREEN (fr-plan routing): in plugins/super-fr/skills/fr-plan/SKILL.md
      `## Rules`, replace the bullet "- TDD: test first, always. No
      speculative generality." with a bullet that names all three beats and
      routes to the canonical skill. It MUST contain the literal token
      `red → green → refactor` (U+2192 arrows) and the string
      `superpowers:test-driven-development`. Suggested text: "TDD
      (`superpowers:test-driven-development`): red → green → refactor. Test
      first (red → green), then an optional refactor step per task when
      there's duplication / naming / extraction to clean — stay green, add no
      behavior; skip it when there's nothing to clean. No speculative
      generality."
  - id: P1.T2.S2
    text: |
      Add the plan step-shape convention (a compact bullet under `## Rules`,
      or a short note) documenting BOTH forms plans already use:
      default = a trailing OPTIONAL refactor step `P<n>.T<n>.S<n>` after a
      task's red→green steps for small cleanups; a separate
      `REFACTOR + quality gate` task for larger cleanups (e.g.
      docs/superpowers/implemented/plans/2026-06-16-readme-ux-and-plan-config-cleanup);
      SKIP entirely when there's nothing to clean.
  - id: P1.T2.S3
    text: |
      Run `uv run pytest tests/unit/test_skill_validation.py -q --no-cov -k
      fr_plan`; confirm the two fr-plan guard tests now PASS (green).
- number: 3
  title: fr-goal SKILL.md — route to canonical skill, net-zero lines — GREEN
  steps:
  - id: P1.T3.S1
    text: |
      GREEN (fr-goal routing): fr-goal/SKILL.md is at the 120-line hard cap,
      so edits are NET-ZERO on line count — reword in place, add no new
      lines. Step 4 line ("Keep v2 plan-as-folder, TDD-shaped steps."):
      reword so it routes, e.g. "Keep v2 plan-as-folder, TDD-shaped steps
      (red→green→refactor per `superpowers:test-driven-development`)."
  - id: P1.T3.S2
    text: |
      Step 6 line ("TDD per step; tick steps ..."): reword to route to the
      skill, e.g. "Full red→green→refactor per
      `superpowers:test-driven-development` per step; tick steps ...". At
      least one fr-goal occurrence must contain the literal
      `superpowers:test-driven-development`. Keep both edits on their
      existing lines.
  - id: P1.T3.S3
    text: |
      Run `uv run pytest tests/unit/test_skill_validation.py -q --no-cov`;
      confirm `test_fr_goal_routes_to_canonical_tdd_skill` passes AND
      `test_under_120_lines` still passes for fr-goal (line count still
      <= 120). If the count exceeded 120, compress wording until it fits.
- number: 4
  title: REFACTOR — optional, dogfood the stay-green/skip loop
  steps:
  - id: P1.T4.S1
    text: |
      Optional refactor beat (dogfoods the new convention). Review the doc
      edits for duplication / naming / extraction to clean while staying
      green. This change is prose-only — the three SKILL.md bullets share no
      extractable structure, so per the skill's "after green only" stay-green
      /skip loop, SKIP the refactor. Record the skip (this step exists to
      demonstrate the optional beat, not to force work). Re-run
      `uv run pytest tests/unit/test_skill_validation.py -q --no-cov`; all
      green.
