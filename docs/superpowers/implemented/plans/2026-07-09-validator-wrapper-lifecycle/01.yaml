  - plan-validator-wrapper-lifecycle
tasks:
- number: 1
  title: RED - init scaffold wrapper behavior
  steps:
  - id: P1.T1.S1
    text: |-
      RED: extend tests/unit/test_init_scaffold.py for plan-repo wrapper handling. Cover: a repo with docs/superpowers/plans/ gets scripts/validate-plans.sh written executable and included in the scaffold commit; a repo without plans does not get the wrapper; a pre-existing non-super-fr scripts/validate-plans.sh fails rather than being overwritten. Run these tests and confirm they fail before production changes.
- number: 2
  title: GREEN - shared wrapper helper and init integration
  steps:
  - id: P1.T2.S1
    text: |-
      GREEN: add a small fr.plan_validator_wrapper helper that owns wrapper content, recognition, installation, and isolation preflight checks. Integrate ensure_validator_wrapper into fr.isolation.scaffold.scaffold_profile only when docs/superpowers/plans/ exists, and include scripts/validate-plans.sh in the scoped commit only when this invocation wrote/refreshed it.
  - id: P1.T2.S2
    text: |-
      GREEN: run tests/unit/test_init_scaffold.py and confirm the new wrapper tests pass.
- number: 3
  title: RED - isolation hard-stop behavior
  steps:
  - id: P1.T3.S1
    text: |-
      RED: extend tests/unit/test_isolation_cmd.py to cover a repo with docs/superpowers/plans/ but no executable scripts/validate-plans.sh. Assert fr isolation up exits 2, the output includes install-validator-wrapper.sh, and no devcontainer command is called. Also cover the happy path with an executable wrapper.
- number: 4
  title: GREEN - isolation preflight
  steps:
  - id: P1.T4.S1
    text: |-
      GREEN: call the shared preflight in LocalWorktreeDevcontainerTarget.up() after the git-repo check and before _git_worktree_add(). Missing or non-executable wrappers in plan repos raise IsolationError with the exact repair command. Run tests/unit/test_isolation_cmd.py and confirm green.
- number: 5
  title: Docs/install cleanup and version bump
  steps:
  - id: P1.T5.S1
    text: |-
      Update scripts/install.sh to remove the final manual per-repo wrapper instruction. Adjust tests/integration/test_install_sh.py or adjacent install-output tests so the removed instruction cannot drift back silently.
  - id: P1.T5.S2
    text: |-
      Because this changes packages/fr/src behavior and scripts/install.sh user-observable behavior, run scripts/bump-version.py patch and keep the changed manifests plus uv.lock in the PR.
  - id: P1.T5.S3
    text: |-
      Run focused tests for init scaffold, isolation command, install output, version sync, and acceptance check. Then run ruff check on touched Python/test files.
