      Run `cd <worktree> && uv run python scripts/sync-hermes.py` to materialise
      .hermes/skills/fr/<name>/SKILL.md for every skill, then
      `uv run pytest tests/unit/test_tripwire_hermes_skills_sync.py -q --no-cov`.
      EXPECT GREEN — canonical non-empty, zero drift.
