tasks:
- number: 1
  title: RED → GREEN — deterministic item identity
  steps:
  - id: P2.T1.S1
    text: |-
      RED: create tests/unit/test_work_item.py for a new module
      packages/fr-dispatch/src/fr_dispatch/work_item.py covering
      item_id(repo, spec_slug, plan_slug=None, phase=None) -> str:
      (a) repo + spec only -> "owner/repo/<spec-slug>";
      (b) + plan -> ".../<plan-slug>"; (c) + phase -> ".../phase/<n>";
      (d) determinism — same args twice give the identical string;
      (e) a phase without a plan raises ValueError (a phase cannot exist
          outside a plan);
      (f) parent_id(item_id) returns the next level up and None at the spec level.
      Run: uv run pytest tests/unit/test_work_item.py -q --no-cov
      Expected: ModuleNotFoundError for fr_dispatch.work_item.
  - id: P2.T1.S2
    text: |-
      GREEN: implement item_id / parent_id in fr_dispatch/work_item.py. Pure string
      composition — NO tracker calls, no I/O — because identity must be computable
      before any Issue or card exists (that is the whole reason it replaces
      build_card_title-based dedup).
      Run: uv run pytest tests/unit/test_work_item.py -q --no-cov
      Expected: all passed.
- number: 2
  title: RED → GREEN — the WorkItem value
  steps:
  - id: P2.T2.S1
    text: |-
      RED: extend tests/unit/test_work_item.py: WorkItem is a frozen dataclass with
      id, unit ("run"|"phase"|"spec"), workflow, repo, parent, inputs
      (tuple[ArtifactRef, ...]), payload (Mapping), tracking (str | None).
      Assert: it is hashable; two items with equal fields are equal; `tracking`
      defaults to None; constructing with unit="phase" and no phase segment in `id`
      raises ValueError (identity and unit must agree).
      Also assert ArtifactRef carries (kind, repo, path) and that a repo-relative
      path is normalized (no leading "./").
      Run: uv run pytest tests/unit/test_work_item.py -q --no-cov
      Expected: failures for WorkItem / ArtifactRef.
  - id: P2.T2.S2
    text: |-
      GREEN: implement ArtifactRef and WorkItem in fr_dispatch/work_item.py with
      frozen=True and a __post_init__ validating the unit/id agreement.
      Export both from fr_dispatch/__init__.py's __all__.
      Run: uv run pytest tests/unit/test_work_item.py -q --no-cov && uv run mypy packages/fr-dispatch/src
      Expected: passed, no type errors.
