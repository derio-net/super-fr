tasks:
- number: 1
  title: RED → GREEN — Tracker protocol and mapping config
  steps:
  - id: P10.T1.S1
    text: |-
      RED: create tests/unit/test_tracker.py: load_trackers(path) parses
      `<tracker> -> <instance> -> <ItemState> -> mapping|null`; resolution is
      repo over user (mirroring fr.models); supports(instance, state) is False for
      a null mapping and True otherwise; an unknown state key fails loud; and a
      GithubTracker built from the existing label behavior satisfies the Protocol
      and reports supports()==True for all five states.
      Run: uv run pytest tests/unit/test_tracker.py -q --no-cov
      Expected: ModuleNotFoundError.
  - id: P10.T1.S2
    text: |-
      GREEN: implement fr/tracker/{model,github}.py — the Protocol (supports,
      observe, create_item, transition, link_parent), the mapping loader, and a
      GithubTracker that delegates to today's label projection. NO Jira adapter.
      Run: uv run pytest tests/unit/test_tracker.py -q --no-cov
      Expected: passed.
  - id: P10.T1.S3
    text: |-
      RED → GREEN: add the refusal path — a workflow whose steps require a state
      the configured tracker instance cannot express is refused at preflight with a
      message naming the state and the instance. Reuse the Phase-5 capability
      refusal path; do not add a second mechanism.
      Run: uv run pytest tests/unit/test_tracker.py tests/unit/test_capabilities.py -q --no-cov
      Expected: passed.
- number: 2
  title: Source seam + the anti-coupling guard the poller extraction depends on
  steps:
  - id: P10.T2.S1
    text: |-
      Define the Source Protocol (name, discover() -> Iterable[WorkItem]) in
      fr_dispatch/protocols.py with a docstring stating that discover_plans is its
      first intended implementation and that nothing is extracted yet.
      Then add tests/unit/test_tripwire_tick_source_neutral.py asserting that
      fr_dispatch/__init__.py's tick body does not reference discover_plans — the
      spec's one standing obligation to (b), enforced rather than promised.
      Run: uv run pytest tests/unit/test_tripwire_tick_source_neutral.py -q --no-cov
      Expected: passed.
