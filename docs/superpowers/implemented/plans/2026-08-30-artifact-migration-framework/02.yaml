tasks:
- number: 1
  title: RED → GREEN — the runner
  steps:
  - id: P2.T1.S1
    text: |-
      RED: create tests/unit/test_migration_runner.py. A migration is
      (kind, from_version, to_version, fn). Assert: the runner reads each
      artifact's stamp and applies the chain up to the kind's current version;
      an artifact already current is untouched (no write, no mtime change);
      a chain with a gap raises rather than skipping a step; re-running after a
      successful migration is a NO-OP (idempotence — the stamp is the guard);
      a migration that raises leaves that artifact unmodified and is reported,
      without aborting the other artifacts.
      Run: uv run pytest tests/unit/test_migration_runner.py -q --no-cov
      Expected: failures.
  - id: P2.T1.S2
    text: |-
      GREEN: implement packages/fr/src/fr/artifacts/runner.py. Migrations
      re-read the artifact immediately before writing rather than trusting a
      parse taken at plan time — spec §4 names an agent writing concurrently as
      a real hazard.
      Run: uv run pytest tests/unit/test_migration_runner.py -q --no-cov
      Expected: passed.
- number: 2
  title: RED → GREEN — the 4.0.0 migration and `fr migrate artifacts`
  steps:
  - id: P2.T2.S1
    text: |-
      RED: tests for the first registered migration: a plan whose fr_version
      ceiling EXCLUDES the installed major is widened (`<4.0.0` → `<5.0.0`);
      a plan already admitting the installed version is untouched; a plan with
      no fr_version is untouched; a malformed constraint is reported, not
      rewritten. Use the real ceilings found in this repo (`>=3.0.0,<4.0.0`,
      `>=3.7.0,<4.0.0`) as fixtures — 39 of 40 plans here carry one.
      Run: uv run pytest tests/unit/test_migration_fr_version.py -q --no-cov
      Expected: failures.
  - id: P2.T2.S2
    text: |-
      GREEN: implement the migration, register it, and add
      `fr migrate artifacts [--yes]` — DRY-RUN BY DEFAULT like every other fr
      mutation. Register it under the existing `fr migrate` app beside
      v1-to-v2/dirs.
      Run: uv run pytest tests/unit -k "migration" -q --no-cov
      Expected: passed.
