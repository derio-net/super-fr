  title: Live dispatch proof, acceptance flips, version bump
  tag: agentic
  tier: standard
  depends_on:
  - 3
  - 4
  tracking_issue: null
  acceptance:
  - opencode-subagent-dispatch
  - opencode-subagent-mirror
  - opencode-subagent-tiering
  - opencode-subagent-installer
tasks:
- number: 1
  title: Run a real dispatch against a free model
  steps:
  - id: P5.T1.S1
    text: |-
      Pick a currently-available free model — `opencode models | grep free`.
      NOTE: `opencode/north-mini-code-free`, which this repo's existing matrix
      notes cite, is GONE from the current list; do not copy it forward, and
      journal that as a discovery so the next person does not either. In a
      scratch directory OUTSIDE the repo, seed .opencode/agent/ from the shipped
      mirror, then run one `opencode run --model <free-model>` whose prompt
      instructs a dispatch to the fr-phase-executor subagent.
- number: 2
  title: Prove it from the session store, not from the output
  steps:
  - id: P5.T2.S1
    text: |-
      Output alone could be the primary agent role-playing, so prove it from the
      store: `sqlite3 ~/.local/share/opencode/opencode.db "select
      id,parent_id,agent,model,cost,tokens_input,tokens_output from session
      where agent like 'fr-phase-executor%' order by time_created desc limit
      5;"`. The claim holds only if a row has parent_id SET and agent =
      fr-phase-executor*. Record the row in the plan journal as a discovery —
      session ids, token counts and the model id only; no absolute paths, no
      third-party hostnames (.claude/rules/third-party-privacy.md). If no such
      row appears, journal a FINDING with the actual query output and do NOT
      claim the acceptance: a green-looking report over absent evidence is the
      exact defect class this repo keeps guarding against.
- number: 3
  title: Move the acceptance rows, explicitly
  steps:
  - id: P5.T3.S1
    text: |-
      `fr acceptance set-status` for each of the four rows — never a hand-edit,
      never a silent move. opencode-subagent-mirror, -tiering and -installer go
      to `ci` with their unit/integration refs attached via --level. For
      opencode-subagent-dispatch use the status the EVIDENCE supports: `skipped`
      if the live dispatch is real but not reproducible in CI (it needs a live
      binary and a model), with --notes naming the session row as the evidence
      and the back-loaded full run as the debt. Every --notes says why the
      status moved. Then `uv run fr acceptance check` — clean, with the three
      committed reports regenerated by set-status staged.
- number: 4
  title: Version bump
  steps:
  - id: P5.T4.S1
    text: |-
      `uv run --no-project python scripts/bump-version.py minor` — minor, not
      patch: a user-visible workflow addition on a harness that did not have it
      (spec §3.G). Never hand-edit a version-bearing manifest. Commit the
      changed manifests together with uv.lock.
- number: 5
  title: Verification before completion
  steps:
  - id: P5.T5.S1
    text: |-
      Full gate, output read rather than assumed: `uv run pytest -q --no-cov`;
      `uv run ruff check packages/ tests/ scripts/`; `uv run mypy
      packages/fr/src packages/fr-dispatch/src packages/fr-vk/src
      packages/fr-cncd/src`; `uv run scripts/sync-opencode.py --check`;
      `uv run scripts/sync-hermes.py --check`; `uv run fr harness parity
      --check`; `uv run fr validate artifacts`; `uv run --no-project python
      scripts/bump-version.py --check`; `uv run fr journal check --scope plan`.
      Every one green before the phase completes.
