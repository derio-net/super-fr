tasks:
- number: 1
  title: A full /fr-goal run on OpenCode dispatches a phase
  steps:
  - id: P6.T1.S1
    text: |-
      MANUAL (operator, post-merge): run a real `/fr-goal` on OpenCode against a
      paid model on any small issue. Confirm at least one phase is dispatched to
      `fr-phase-executor-<tier>`, evidenced by an opencode.db session row with
      parent_id set and that agent name, and that the child's token counts are
      its own — i.e. the orchestrator's context does not carry the phase's file
      reads. Paste the redacted row into the PR. This is the half of the
      acceptance a free-model smoke cannot buy: it exercises the skill prose
      driving the dispatch, not just the primitive.
- number: 2
  title: A real consumer install resolves the operator's own bindings
  steps:
  - id: P6.T2.S1
    text: |-
      MANUAL (operator, post-merge): run scripts/install.sh on a machine with
      ~/.config/opencode present and `fr models` bound for opencode. Confirm
      ~/.config/opencode/agent/ holds the four agents, that each TIER file
      carries the model that machine's bindings resolve to, that the base file
      carries none, and that `opencode agent list` in an unrelated project shows
      all four. Then `--uninstall` and confirm only super-fr's agents were
      removed.
