schema_version: 2
phase:
  number: 2
  title: The bound — state-first collapse in compose_handoff
  tag: agentic
  tier: hard
  depends_on:
  - 1
  tracking_issue: null
  acceptance:
  - handoff-closed-entries-bounded
tasks:
- number: 1
  title: Collapse rules — red, green, refactor
  steps:
  - id: P2.T1.S1
    text: |-
      RED in tests/unit/test_handoff_bound.py, using build_plan_journal:
      (a) a finding with state=fixed tagged to a DEPENDENCY phase collapses to a
          single line (assert the body text is absent and the one-line form is
          present);
      (b) a finding still effectively open in a dependency phase renders IN FULL;
      (c) a decision and a discovery in a dependency phase render IN FULL
          (dependency scoping is deliberately unchanged — they carry forward value);
      (d) a resolution record (kind=finding with resolves=<id>) collapses;
      (e) a fixed finding in a NON-dependency phase still collapses (no regression
          on the rule #465 already shipped).
      Run; confirm (a) and (d) fail against current code.
  - id: P2.T1.S2
    text: |-
      RED — the load-bearing property, stated as the spec's A3 bar:
      build two journals identical except that every CLOSED finding's body is 20x
      longer in the second. Assert the composed handoff for the last phase differs
      by less than a small constant (closed entries cost O(1) chars regardless of
      body size).
      Also assert the inverse guard so the test cannot pass vacuously: growing an
      OPEN finding's body DOES grow the handoff.
      Run; confirm the first assertion fails and the second passes.
  - id: P2.T1.S3
    text: |-
      GREEN: in packages/fr/src/fr/journal/model.py, compose_handoff.
      Today the loop is:
        if finding and not resolves and id in still_open:  -> full (Open findings)
        elif e.phase is None or e.phase in relevant:        -> full (Relevant context)
        else:                                              -> one line
      Insert the state test ahead of the dependency test: an entry that is a
      finding whose EFFECTIVE state is closed (not in still_open), or that is a
      resolution record (resolves is not None), collapses regardless of phase.
      Reuse open_finding_ids (model.py:302) — the same fold `fr journal check`
      uses. Do not add a second state machine.
      Update the docstring: its current claim that "a phase-10 executor stops
      re-reading 39 fixed findings in full" was only true outside dependency
      phases, which is the defect this phase fixes. Say what the code now does.
  - id: P2.T1.S4
    text: |-
      REFACTOR + confirm the old contract's tests now fail.
      Refactor compose_handoff's now three-way branch for legibility if warranted;
      otherwise record `no-refactor-because: P2.T1` (--phase 2).
      Then the check #464's comment item 11 asks for, which matters here because this
      phase CHANGES an existing contract: run the whole journal suite
      (`uv run pytest tests/unit/test_journal_model.py tests/unit/test_journal_cmd.py
      tests/unit/test_handoff_bound.py -q`). Any pre-existing test that asserted a
      fixed dependency-phase finding renders in full was pinning the defect, and it
      SHOULD now fail. Green everywhere after a contract change is the suspicious
      result, not the reassuring one. Name which tests changed behaviour and why,
      rather than editing them quietly.
- number: 2
  title: Measure the real before/after
  steps:
  - id: P2.T2.S1
    text: |-
      MEASURE — this is the phase's evidence, not a nicety.
      Re-run the spec section 2 measurement against the same real journal:
        S=2026-09-18-harness-parity-matrix
        PD=docs/superpowers/implemented/plans/$S
        for N in 1 2 3 4 5 6 7; do
          uv run fr journal handoff --scope plan --slug $S --phase $N --plan-dir $PD | wc -c
        done
      Record the actual after-figures against the spec's before-table and its ~46k
      / ~24k predictions with `fr journal add --kind discovery --phase 2`.
      If the real numbers differ materially from the prediction, say so — the spec
      committed to reporting the measurement, not to being right.
state:
