tasks:
- number: 1
  title: Flip the acceptance rows with their evidence
  steps:
  - id: P6.T1.S1
    text: |-
      For each of the three rows, `uv run fr acceptance set-status
      --id <id> --status ci --level unit=super-fr:<the actual test
      file> --notes "<why it moved>"`. Use the real test paths written
      in phases 1-3, not guesses. `set-status` regenerates all three
      committed reports; commit them. Then `uv run fr acceptance check`
      — clean.
- number: 2
  title: Version and artifacts
  steps:
  - id: P6.T2.S1
    text: |-
      VERIFY the version bump rather than making it. The worktree ALREADY
      carries an uncommitted 4.8.0 -> 4.9.0 bump left by an earlier session on
      this branch (plan journal, discovery `pre-existing-bump`), and 4.9.0 is
      exactly the minor bump this PR owes for a new CLI flag plus a new
      mandatory workflow step (AGENTS.md). Running `bump-version.py minor`
      again from that dirty tree would land 4.10.0 and overshoot.
      So: confirm `git diff` over the version-bearing surfaces is version-only
      (five `version = "4.9.0"` lines plus the JSON version keys in
      .claude-plugin/marketplace.json, packages/fr-opencode-plugin/package.json
      and both plugins' plugin.json, and NOTHING else); confirm
      `uv run --no-project python scripts/bump-version.py --check` passes;
      confirm `uv run fr --version` reads 4.9.0. Only then commit those
      manifests together with uv.lock if it moved. If the diff turns out NOT to
      be version-only, stop and journal a finding — do not silently absorb an
      unrelated edit into a release commit.
  - id: P6.T2.S2
    text: |-
      `uv run fr validate artifacts` — clean. No stamp bump is owed
      (spec Non-goals: no artifact schema changed), so this should pass
      with no migration. If it does NOT, stop: something in this plan
      changed a shape the spec said it would not, and
      .claude/rules/artifact-versioning.md then requires a stamp bump,
      a registered migration and a structure validator in THIS PR.
- number: 3
  title: Full gate
  steps:
  - id: P6.T3.S1
    text: |-
      `uv run ruff format packages/ tests/ scripts/`; `uv run ruff check
      packages/ tests/ scripts/`; `uv run mypy packages/fr/src
      packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src`;
      `uv run --no-project python scripts/bump-version.py --check`;
      `uv run pytest` (the FULL run CI gates, cov-fail-under=75 included
      — not `-q --no-cov`). Report the real output. The single known
      pre-existing failure (#463/#489) is the only tolerated red;
      anything else is this PR's.
