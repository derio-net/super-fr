tasks:
- number: 1
  title: Smoke
  steps:
  - id: P1.T1.S1
    text: |-
      Smoke: create `packages/fr/src/fr/checkstate.py` with only a module docstring naming spec 2026-11-24-ci-economy R3, and `tests/unit/test_checkstate.py` with one test that imports `fr.checkstate` and asserts its docstring names the spec. Add the change fragment `.changes/feat-ci-economy.yaml` (`bump: minor`, summary: "CI economy: superseded PR runs cancel and read as pending, main skips a landed queue combination, docs-only PRs run a light lane, and the merge queue regenerates generated files and docs stamps"). Run `uv run pytest tests/unit/test_checkstate.py -q --no-cov` green.
- number: 2
  title: The shared definition (R3)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: in `tests/unit/test_checkstate.py`, assert `verdict_of(state)` (case-insensitive, conclusion or state) gives `pass` for SUCCESS/SKIPPED/NEUTRAL, `pending` for CANCELLED and for any unfinished or unknown state (PENDING, QUEUED, IN_PROGRESS, EXPECTED, ""), and `fail` for FAILURE, ERROR, TIMED_OUT, ACTION_REQUIRED, STARTUP_FAILURE, STALE and status-context `error`/`failure`; and that `FAILING_BUCKETS == {"fail"}`, `bucket_verdict("cancel") == "pending"` and `bucket_verdict("skipping") == "pass"`.
  - id: P1.T2.S2
    text: |-
      GREEN: implement `verdict_of`, `FAILED_STATES`, `PASSED_STATES`, `FAILING_BUCKETS` and `bucket_verdict` in `fr/checkstate.py` (stdlib only, no fr imports, so every package layer may use it). Tests pass.
- number: 3
  title: Every reader uses it (R3)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: per reader, a test that a cancelled check reads as pending (and a timed-out one as failing): `batch_drive.checks_verdict` with a required check in bucket `cancel` gives `pending`; `batch_merge`'s required-check reading (batch_merge.py:35, :156); `settle.evaluate` (evaluate.py:46, :135) is not red; `collect._bucket({"conclusion": "CANCELLED"}) == "pending"`; `queue_exec._state` with conclusion `cancelled` gives `pending` and `stale` gives `fail`; `real_ghrestclient._BUCKET`/`_ci`: a rollup holding only a cancelled check is `PENDING`; `ops.gate._checks_green` with a `cancel` bucket reports pending, not failed; `run.ci_evidence.verify_ci` with a cancelled gate check raises `CiPending` (exit 75), not `CiEvidenceRefused`. Reuse each module's existing test file and fixtures.
  - id: P1.T3.S2
    text: |-
      GREEN: replace each reader's own set with `fr.checkstate`: the `_FAILING_BUCKETS`/`FAILING_BUCKETS` literals, `queue_exec._FAILED`, the CANCELLED/cancel entries in `collect._bucket` and `real_ghrestclient._BUCKET`/`_ci`, `ops.gate`'s `key = "fail" if key == "cancel"`; in `verify_ci` treat a cancelled finished gate check as unfinished. Keep `batch_merge.FAILING_BUCKETS` importable as an alias of `fr.checkstate.FAILING_BUCKETS` if other modules import it. Leave `real_ghclient._coerce_ci_state` unchanged, with a comment naming spec 2026-11-24-ci-economy Design §A's exemption. Tests pass.
  - id: P1.T3.S3
    text: |-
      REFACTOR + tripwire: add `tests/unit/test_tripwire_checkstate.py` that parses every module under `packages/fr/src` with `ast` and fails on a set, frozenset or tuple literal containing both `"cancel"` and `"fail"`, or both `"CANCELLED"` and `"FAILURE"` (any case), outside `fr/checkstate.py`, `real_ghclient.py` (the GraphQL exemption) and `real_glabclient.py`. It must not flag the batch stage `cancelled`. ruff and mypy green on the touched files.
- number: 4
  title: A cancelled combination check becomes a Need (R4)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: `slot_check` tests (queue_exec.py:702): a required check whose latest run is cancelled is `pending` and is listed in `late` once `now - built_at >= wait_minutes` (and not before); with no required checks, a cancelled check past `wait_minutes` is returned in `late` too.
  - id: P1.T4.S2
    text: |-
      GREEN: in `slot_check`, compute `late` as the missing names plus the names whose checks are all cancelled, in both branches; keep the verdict rules otherwise. Check that the caller turning `late` into the Needs-you entry words a cancelled check correctly. Tests pass; the fast tier `uv run pytest --fr-scope origin/main -n 2 -q --no-cov` is green.
