tasks:
- number: 1
  title: Smoke and the shape-block grammar (spec §B, R6)
  steps:
  - id: P1.T1.S1
    text: |-
      SMOKE + RED: create tests/unit/test_shape.py with `test_fr_shape_imports` (imports `fr.shape`) and grammar tests. `is_shape_block` is true for text holding a fenced block (``` or ~~~, any info string incl. `mermaid` and `diff`), and true for exactly one non-blank line `none — <reason>` or `none - <reason>` with a non-empty reason; false for empty text, prose only, `none —` with no reason, `none — x` plus another non-blank line, and an unclosed fence. `shape_block_problem` returns None when valid and a one-line reason otherwise. `design_shape_section(spec_text)` returns the body under `## Design shape` up to the next `## ` heading OUTSIDE a fence (a `## ` line inside a fenced block does not end it), None when the heading is absent. `shape_path(repo_root, run_id)` equals `run_path(repo_root, run_id).with_name(f"{run_id}.shape.md")`, beside `fr.record.pr_body.durable_pr_body_path`. Run `uv run pytest tests/unit/test_shape.py -q --no-cov`: red (module missing).
  - id: P1.T1.S2
    text: |-
      GREEN: write packages/fr/src/fr/shape.py: `SHAPE_FILE_SUFFIX = ".shape.md"`, `TWO_FORMS` (one sentence naming both valid forms, reused by every refusal), `is_shape_block`, `shape_block_problem`, `design_shape_section`, `shape_path` (via `fr.run.model.run_path`). Reuse an existing fence pattern from fr (`fr.record.pr_body._FENCE` or `fr.spec`'s) rather than adding a third copy, if one fits. Re-run test_shape.py: green.
  - id: P1.T1.S3
    text: |-
      REFACTOR: docstrings cite spec 2026-11-24-show-me-visuals R6; `uv run ruff check packages/fr/src/fr/shape.py tests/unit/test_shape.py` and `uv run mypy packages/fr/src` clean.
- number: 2
  title: The spec gate at brainstorm and every spec-reviewing step (spec §C, R7, R8)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: find the tests that drive `run_cmd._refuse_spec_policy` (grep tests/unit for `breaks the repo's settings` / `spec_policy_problems`) and add beside them, in a new tests/unit/test_spec_design_shape_gate.py using the same fixtures: a `brainstorm` resolve emitting a spec with no `## Design shape` exits 2, names the spec and `fr.shape.TWO_FORMS`, and writes nothing (cursor and journal byte-identical); a section that is not a shape block (prose only) is refused the same way; a valid fenced section and a `none — reason` section pass; the same refusal fires at `spec-review` on an fr-goal run AND at `spec-plan-review` on an fr-goal-light run; an `outcome: failed` record is not checked. Fixture specs used by OTHER existing resolve tests that now lack the section must get one (grep tests/fixtures and inline spec strings). Run the new file: red.
  - id: P1.T2.S2
    text: |-
      GREEN: add `_refuse_spec_shape(repo_root, state, step_id, emitted_map)` in packages/fr/src/fr/commands/run_cmd.py next to `_refuse_spec_policy`, on the same step set (`"brainstorm", *_spec_review_ids(...)`) and the same spec path (`emitted_map.get("spec") or run_spec(state)`), called at the same call site and only where that one is; it reads the spec (an unreadable spec is the other validators' — return), uses `fr.shape.design_shape_section` / `shape_block_problem`, and prints `<step>: <spec> has no valid \`## Design shape\`: <problem>` plus `TWO_FORMS`, exit 2. Re-run the new file and every test file that drives a brainstorm or spec-review resolve (grep `--step brainstorm` / `spec-review` in tests/unit; single files, the host is loaded): green.
  - id: P1.T2.S3
    text: |-
      REFACTOR: keep run_cmd.py within its module line budget (tests/unit/test_tripwire_module_budget.py); if it fails, move the shape checks into fr/shape.py helpers so run_cmd.py only calls them. Run the budget tripwire.
- number: 3
  title: The PR section, deliver refusals and in-flight runs (spec §D, R9-R11, R18)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: in tests/unit/test_pr_body_shape.py (model it on tests/unit/test_pr_body_lenses.py's fixtures): `render_pr_body` carries `## Shape of the change` directly after `## Out-of-scope findings` and before `## Review lenses`; its body is `This run has no spec.` when `run_spec(state)` is None, `This run predates design shapes.` when the spec has no `## Design shape`, the shape file's content (stripped) when the file exists, else `No shape file was written.`; `"## Shape of the change" in REQUIRED_SECTIONS`. Under `forge.pr_body: minimal` the durable render (`<run-id>.pr-body.md`) carries the section (follow tests/unit/test_forge_quiet_pr_body.py). In tests/unit/test_deliver_pr_body.py's style: a deliver resolve whose spec has the section and no shape file exits 2 naming `shape_path` and TWO_FORMS; an invalid shape file (prose only) likewise; an unreadable spec exits 2 naming it; a run with no spec is not refused for shape; an in-flight run (spec without the section) whose LIVE body lacks `## Shape of the change` is refused once by the existing missing-sections refusal, which prints the edit command, and passes once the live body is the render (R18). Existing deliver/pr-body tests whose fixture specs or expected bodies change get updated. Run the new and touched files: red.
  - id: P1.T3.S2
    text: |-
      GREEN: in packages/fr/src/fr/record/pr_body.py add `HEADING_SHAPE = "## Shape of the change"` to `REQUIRED_SECTIONS` (after `## Out-of-scope findings`), a `_shape_section(repo_root, state)` with the four bodies, and render it in `render_pr_body` before `HEADING_REVIEW_LENSES`. In run_cmd.py's deliver gate (`_deliver_pr_gate` or the deliver evidence checks before it, wherever the earliest refusal that runs before the render belongs) add the two R11 refusals via fr.shape helpers. Re-run the files from S1 plus every tests/unit/test_*pr_body*.py and test_deliver*.py (single files): green.
  - id: P1.T3.S3
    text: |-
      REFACTOR: one helper decides "this run owes a shape" (spec emitted, readable, has the section) and both the render and the refusal call it; ruff + mypy clean.
- number: 4
  title: Lens brief, archive, adopt, trust (spec §D2, §D3, §E, R12, R16, R17)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: (a) lens brief — in the lens-review brief tests (tests/unit/lens_review_support.py users, grep `lens_review_brief`): the brief has `shape: <absolute path>` when the run's shape file exists and `shape: null` otherwise, and `lens_review_rule(<lens>)` contains a sentence telling the reviewer to read the shape, report any contradiction with the diff as a finding of its lens, and not list the shape file under `examined`. (b) archive — beside the `_archive_pr_body` tests: `fr archive` moves `<run-id>.shape.md` next to the archived cursor, staged, and leaves an existing destination alone. (c) trust — `is_trust_excluded` is true for `docs/superpowers/runs/<run-id>.shape.md` and still false for a `.md` that is neither, and `TRUST_EXCLUDED` lists the pattern. (d) adopt — in tests/unit/test_run_adopt_supersede.py: supersede moves `<old>.shape.md` to `<new>.shape.md` and refuses, before any write, when `<new>.shape.md` exists. Run those files: red.
  - id: P1.T4.S2
    text: |-
      GREEN: `fr.lenses.review.lens_review_brief` gains the `shape` key (the run id must reach it: thread the state or the path from the caller in run_cmd.py rather than guessing); one sentence in `lens_review_rule`. `fr.archive._archive_shape`, a twin of `_archive_pr_body`, called beside it. `fr.ops.trust`: the run-file predicate accepts `.shape.md` beside `.pr-body.md` and `TRUST_EXCLUDED` gains `f"{KIND_DIRS['run']}/<run-id>.shape.md"`. `fr.run.adopt`: a `_shape_move` beside `_usage_move` with the same refuse-before-write rule, called where `_usage_move` is. Re-run the files: green.
  - id: P1.T4.S3
    text: |-
      REFACTOR + quality gate: dedupe the twin archive/move helpers if they read as copies (one `_move_beside_cursor(suffix)` is fine); `uv run ruff format packages/ tests/`, `uv run ruff check packages/ tests/`, mypy over the five source trees (AGENTS.md command). Update the acceptance rows this phase built: `fr acceptance set-status --id <row> --status unwired --level unit=derio-net/super-fr:tests/unit/<file>.py#<test> --notes "..."` for spec-design-shape-gate, pr-shape-section and shape-file-archived (they turn `ci` once CI runs them; leave `ci` to the PR when CI is green). Commit, then run the fast tier from the brief LAST.
