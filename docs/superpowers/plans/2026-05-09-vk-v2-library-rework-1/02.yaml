        - `repo` not present on disk → return `[]`, no exception
        - `docs/superpowers/plans/` absent → return `[]`
        - one plan_dir has invalid `_meta.yaml` → skip it, log, continue
          (don't take down the whole tick over one bad plan)

      Implement the catches. Verify with pytest -x.
- number: 3
  title: '`tick` — one cron iteration'
  steps:
  - id: P2.T3.S1
    text: |-
      Failing happy-path test

      In `tests/unit/test_vk_bridge_tick.py`, build a plan with one phase
      whose Issue is labelled `vk-ready` but not yet `vk-synced`. Use
      stub GhClient + stub VkMcpClient.

      Assert that after `tick(plan, gh_stub, mcp_stub)`:
        - `mcp_stub.create_card` was called with the issue URL
        - `gh_stub.add_label(... 'vk-synced' ...)` was called
        - The returned TickResult has `synced=1, errors=0`

      Run, expect red.
  - id: P2.T3.S2
    text: |-
      Implement tick — observe / render / diff / apply / VK update

      ```python
      def tick(plan: Plan, gh: GhClient, vk_mcp: VkMcpClient) -> TickResult:
          observed = observe(plan, gh)
          rendered = render(plan, observed)
          d = diff(plan, observed, rendered)
          # GH-side mutations first (Issues + labels)
          result = apply(d, gh)
          failures = [f.error for f in result.failures]

          # Now sync VK board cards from the rendered state — one card
          # per phase whose Issue is vk-ready & not yet vk-synced.
          synced = 0
          for phase in plan.phases:
              ph_obs = observed.phases.get(phase.phase.number)
              if ph_obs is None: continue
              if "vk-ready" in ph_obs.labels and "vk-synced" not in ph_obs.labels:
                  try:
                      vk_mcp.create_card(
                          title=phase.phase.title,
                          body=rendered.issue_per_phase[phase.phase.number].body,
                          issue_url=ph_obs.url,
                      )
                      gh.edit_issue_labels(plan.meta.target_repo, ph_obs.number,
                                           add={"vk-synced"}, remove=set())
                      synced += 1
                  except Exception as e:
                      failures.append(f"phase {phase.phase.number}: {e}")
          return TickResult(
              synced=synced,
              errors=len(failures),
              skipped=0,
              failures=tuple(failures),
          )
      ```

      Re-run, expect green.
  - id: P2.T3.S3
    text: |-
      Failure-path tests

      Add tests for:
        - MCP `create_card` raises → counted in `errors`, not `synced`;
          GH label `vk-synced` NOT added (so we retry next tick)
        - GH apply has a failure → still attempt VK syncs for unaffected
          phases; failures list contains both
        - Plan with zero `vk-ready` phases → `TickResult(skipped=1)`

      Implement the branches. Run full bridge test file, expect green.
- number: 4
  title: Wire `vk.bridge` into the public surface
  steps:
  - id: P2.T4.S1
    text: |-
      Re-export from `vk.__init__`

      Add to `src/vk/__init__.py`:
      ```python
      from vk import bridge as bridge  # noqa: F401 — public sub-package
      ```

      So callers can either `from vk.bridge import tick` or `import vk;
      vk.bridge.tick(...)`. Verify `python -c "from vk import bridge;
      print(bridge.tick)"` works.

      Add a public-API regression test:
      ```python
      def test_public_bridge_api_stable():
          import vk
          assert hasattr(vk.bridge, "discover_plans")
          assert hasattr(vk.bridge, "tick")
          assert hasattr(vk.bridge, "TickResult")
          assert hasattr(vk.bridge, "VkMcpClient")
      ```
  - id: P2.T4.S2
    text: |-
