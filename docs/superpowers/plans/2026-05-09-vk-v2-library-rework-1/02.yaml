      Run: pytest tests/unit/test_vk_bridge_discover.py -x --no-cov
      Expect: red (NotImplementedError).
  - id: P2.T2.S2
    text: |-
      Implement discover_plans

      ```python
      def discover_plans(repo: str, gh: GhClient) -> list[Plan]:
          """Walk docs/superpowers/plans/ in repo, return plans where at
          least one phase Issue carries the `vk-ready` label."""
          repo_root = _repo_checkout_root(repo)
          plans_dir = repo_root / "docs" / "superpowers" / "plans"
          out: list[Plan] = []
          for plan_dir in sorted(plans_dir.iterdir()):
              if not (plan_dir / "_meta.yaml").exists():
                  continue
              plan = parse(plan_dir)
              if _any_phase_is_vk_ready(plan, gh):
                  out.append(plan)
          return out
      ```

      `_repo_checkout_root` resolves `repo` ("owner/name") to a path under
      `~/repos/<name>` (matching the existing bridge's REPOS_DIR
      convention — env-overridable via `VK_REPOS_DIR`).

      Re-run the test, expect green.
  - id: P2.T2.S3
