  - id: P2.T3.S2
    text: |-
      Implement `_resolve_writable_plan_dir` in `src/vk/spec.py`. This
      replaces the v0 draft helper `_load_plan_for_dispatch` — per spec
      D14, dispatch operates only on locally-writable checkouts so the
      `plan_ops.set_tracking_issue` writeback can persist. Cross-repo
      plans with no writable checkout emit `deferred_cross_repo`.

      ```python
      import os
      from pathlib import Path


      def _resolve_writable_plan_dir(
          ref: PlanRef,
          repo_root: Path,
      ) -> Path | None:
          """Return a locally-writable plan directory path, or None.

          1. Same-repo: `repo_root / ref.file` if it's a directory.
          2. Cross-repo: `$VK_REPOS_DIR / <name(ref.repo)> / ref.file`
             if it's a directory. Mirrors bridge `_repo_checkout_root`.

          Returns None when no local writable checkout has the dir —
          caller emits `deferred_cross_repo` outcome.
          """
          same_repo = (repo_root / ref.file).resolve()
          if same_repo.is_dir():
              return same_repo
          base = os.environ.get("VK_REPOS_DIR")
          if not base:
              return None
          name = ref.repo.split("/", 1)[1] if "/" in ref.repo else ref.repo
          cross = (Path(base) / name / ref.file).resolve()
          return cross if cross.is_dir() else None
      ```

      Note: this helper is for the **write side** only. The
      cross-repo read side (`compute_status` resolving completion via gh
      contents API) lives in Phase 1 T4 and is unchanged.

      Run: `uv run pytest tests/unit/test_spec_dispatch_loader.py -x -q --no-cov`
      Expect: all 4 green.
