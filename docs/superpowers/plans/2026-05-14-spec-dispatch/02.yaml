  - id: P2.T2.S2
    text: |-
      Implement `_validate_spec(spec: SpecMeta) -> None` in
      `src/vk/spec.py`. Place above `dispatch`.

      Walk `spec.plans` in order, tracking a `seen: dict[str, int]`
      mapping Plan ID → row index. For each row, run the 7 checks
      in this order and raise on the first failure:

      1. Blank Plan column → raise with `row N is blank`.
      2. Duplicate Plan column → raise with `appears in rows {a, b}`.
      3. For each `ref` in `row.depends_on`:
         - `ref == row.name` → self-ref error.
         - `ref not in seen` → unknown ref (could be forward or
           typo; distinguish by checking if it's in *later* rows).
         - if found at later index → forward ref.
         - if found and that row has `File == "—"` → manual-row ref.
      4. Empty depends_on cell (depends_on_raw is "" or only WS, but
         depends_on parsed empty AND raw isn't a root sentinel) →
         empty-cell error.

      Error messages must match spec §1.3 verbatim (validation table
      in the design doc). Add this comment above the function
      referencing the design doc section.

      Re-run: `uv run pytest tests/unit/test_spec_validation.py -x -q --no-cov`
      Expect: all 7 green.
