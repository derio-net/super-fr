      Implement the skeleton of `dispatch`:

      ```python
      def dispatch(
          spec: SpecMeta,
          gh: GhClient,
          *,
          yes: bool = False,
          repo_root: Path | None = None,
      ) -> SpecDispatchResult:
          _validate_spec(spec)
          repo_root = repo_root or Path.cwd()
          status = compute_status(spec, repo_root, gh=gh)
          by_id = {ps.plan_ref.name: ps for ps in status.plans}
          outcomes: list[PlanDispatchOutcome] = []
          for row in spec.plans:
              outcome = _dispatch_one_row(row, by_id, repo_root, gh, yes=yes)
              outcomes.append(outcome)
              # Partial-failure stop: see spec §3.4
              if outcome.apply_failures:
                  break
          return _summarise(spec, outcomes)
      ```

