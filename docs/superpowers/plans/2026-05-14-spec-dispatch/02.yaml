      - `from vk.render import render`
      - `from vk.diff import diff, IssueCreate`
      - `from vk.apply import apply`
      - `from vk import plan_ops`
      - `from vk.plan_ops import PlanEditError`
      - `from vk.parser import parse, PlanSchemaError`

      Run the happy-path test from S1. Expect green.
