    text: |-
      Update `skills/vk-dispatch/SKILL.md`:

      Add a section near the end (before any "Integration" footer):

      ```
      ## Spec-level dispatch

      For specs whose plans declare inter-plan deps via the spec
      table's `Depends on` column (grammar in
      docs/superpowers/specs/2026-05-13-spec-dispatch-design.md §1.1),
      use `vk spec apply <spec> --yes` instead of dispatching each
      plan manually. The command gates downstream plans on upstream
      completion and the bridge auto-advances on subsequent ticks.

      Run `vk spec self-review <spec>` first to catch grammar errors.
      ```

      Update `skills/vk-plan/SKILL.md`:

      In the "Dependency declarations" section (which today covers
      intra-plan phase deps), add at the bottom:

