      ## Spec-level (inter-plan) deps

      A spec's `## Implementation Plans` table has a `Depends on`
      column for cross-plan ordering. Grammar:
      `—` for root, `;`-separated Plan-column refs for non-root.
      Run `vk spec self-review <spec>` to validate.
      ```

