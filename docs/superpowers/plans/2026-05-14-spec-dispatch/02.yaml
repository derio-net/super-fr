  - id: P2.T6.S2
    text: |-
      Implement `discover_specs` in `src/vk/bridge/__init__.py`:

      ```python
      from vk.spec import parse_spec, SpecMeta


      def discover_specs(repo: str) -> list[SpecMeta]:
          """Walk docs/superpowers/specs/*.md in repo's checkout."""
          repo_root = _repo_checkout_root(repo)
          specs_dir = repo_root / "docs" / "superpowers" / "specs"
          if not specs_dir.is_dir():
              return []
          out: list[SpecMeta] = []
          for spec_path in sorted(specs_dir.glob("*.md")):
              try:
                  out.append(parse_spec(spec_path))
              except Exception as e:  # noqa: BLE001
                  logger.warning(
                      "bridge: skipping unparseable spec %s: %s",
                      spec_path, e,
                  )
          return out
      ```

