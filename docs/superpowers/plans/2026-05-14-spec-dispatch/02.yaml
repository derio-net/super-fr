  - id: P2.T7.S2
    text: |-
      Implement `apply_cmd` inside `spec_cmd.py`:

      ```python
      @spec_app.command("apply")
      def apply_cmd(
          spec_path: Path | None = typer.Argument(None, ...),
          all_specs: bool = typer.Option(False, "--all", ...),
          yes: bool = typer.Option(False, "--yes", ...),
          output_format: str = typer.Option("text", "--format", ...),
      ) -> None:
          ...
          gh = _make_gh_client()
          overall_rc = 0
          for sp in targets:
              meta = parse_spec(sp)
              try:
                  result = dispatch(meta, gh, yes=yes,
                                    repo_root=repo_root)
              except SpecValidationError as e:
                  err_console.print(f"spec validation: {e}")
                  overall_rc = max(overall_rc, 2)
                  continue
              except PlanSchemaError as e:
                  err_console.print(f"plan parse error: {e}")
                  overall_rc = max(overall_rc, 5)
                  continue
              # Map outcome states to exit codes (spec §3.6).
              if any(o.apply_failures for o in result.outcomes):
                  overall_rc = max(overall_rc, 4)
              if any(o.state == "unreachable" for o in result.outcomes):
                  overall_rc = max(overall_rc, 6)
              _render(result, output_format)
          if overall_rc:
              raise typer.Exit(overall_rc)
      ```

      Implement `_render(result, fmt)` to format text per spec §4.2
      and JSON per spec §4.3.

