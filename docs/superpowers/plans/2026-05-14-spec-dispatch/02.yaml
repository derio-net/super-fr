      - `GhClient.read_repo_file()` Protocol method (cross-repo file reads).
      - `vk spec status` now resolves cross-repo plans via gh contents API;
        `--no-gh` retains the offline behaviour.

      ### Changed
      - `PlanRef.depends_on` is now `tuple[str, ...]` (parsed refs);
        free-form prose is preserved in the new `depends_on_raw` field.
        Old specs with prose-style cells continue to render under
        `vk spec status` unchanged.
      ```

      Use Edit on CHANGELOG.md.
