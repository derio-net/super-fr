  - id: P2.T4.S3
    text: |-
      Implement the apply-dispatched branch inside
      `_dispatch_one_row` per spec §3.2. Includes the
      `plan_ops.set_tracking_issue` writeback (D15) and the
      `_resolve_writable_plan_dir` guard (D14).

      For unblocked, non-manual, reachable rows:

      ```python
      local_dir = _resolve_writable_plan_dir(row, repo_root)
      if local_dir is None:
          return PlanDispatchOutcome(
              plan_ref=row, state="deferred_cross_repo",
              note=f"no local checkout for {row.repo}")

      plan = parse(local_dir)
      observed = observe(plan, gh)
      rendered = render(plan, observed)
      d = diff(rendered, observed, plan=plan)

      if not yes:
          issues_created = sum(
              1 for m in d.mutations if isinstance(m, IssueCreate)
          )
          if issues_created == 0:
              return PlanDispatchOutcome(
                  plan_ref=row, state="already_dispatched")
          return PlanDispatchOutcome(
              plan_ref=row, state="dispatched",
              issues_created=issues_created, note="(dry-run)")

      result = apply(d, gh, plan=plan)
      issues_created = len(result.created_issues)
      failures: list[str] = [f.error for f in result.failures]

      # D15 writeback: same loop apply_cmd._apply_one and bridge.tick do.
      # Without it, re-running dispatch would re-emit IssueCreate per
      # phase (the duplicate-Issue regression PR #122 fixed).
      for phase_n, url in result.created_issues.items():
          try:
              plan_ops.set_tracking_issue(plan.dir, phase_n, url)
          except (PlanEditError, OSError, PlanSchemaError) as e:
              failures.append(f"phase {phase_n}: writeback failed: {e}")

      if issues_created == 0 and not failures:
          return PlanDispatchOutcome(
              plan_ref=row, state="already_dispatched")
      return PlanDispatchOutcome(
          plan_ref=row, state="dispatched",
          issues_created=issues_created,
          apply_failures=tuple(failures))
      ```

      Imports needed:
