  - id: P1.T2.S2
    text: |-
      Implement `_check_plan_reachable_on_origin_head` in
      `src/vk/commands/apply_cmd.py`. Add as a module-level helper
      between `_make_gh_client` and `_format_diff`.

      ```python
      def _check_plan_reachable_on_origin_head(
          plan: Plan, repo_root: Path
      ) -> list[Path]:
          """Return plan files (and spec, if set) NOT present on origin/HEAD.

          Empty list = gate passes. Caller (`_apply_one`) refuses `--yes`
          when this returns non-empty.

          Raises if origin/HEAD isn't resolvable locally — caller catches
          and re-raises with a setup hint.
          """
          from vk.git import file_on_ref

          missing: list[Path] = []
          plan_dir = plan.dir
          for path in sorted(plan_dir.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(repo_root)
              if not file_on_ref("origin/HEAD", str(rel), cwd=repo_root):
                  missing.append(rel)
          if plan.meta.spec:
              spec_rel = Path(plan.meta.spec)
              if not file_on_ref("origin/HEAD", str(spec_rel), cwd=repo_root):
                  missing.append(spec_rel)
          return missing
      ```

      Add `from pathlib import Path` to the top of the file if it
      isn't already imported (it's already used via `plan_dir: Path`
      in `_apply_one`).

      Add `from vk.parser import Plan` to the top of the file
      (already imported as `from vk.parser import PlanSchemaError,
      parse` — extend to `Plan, PlanSchemaError, parse`).

