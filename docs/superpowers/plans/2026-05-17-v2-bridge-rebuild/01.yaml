  - id: P1.T3.S2
    text: |-
      Add `_deps_satisfied` helper in `src/vk/render.py`.

      Below `_phase_complete`, add:
      ```python
      def _deps_satisfied(phase: PhaseDoc, plan: Plan, observed: GhState) -> bool:
          """True iff every phase in `phase.depends_on` is complete."""
          phase_by_number = {p.phase.number: p for p in plan.phases}
          for dep_n in phase.phase.depends_on:
              dep_phase = phase_by_number.get(dep_n)
              if dep_phase is None:
                  return False
              dep_obs = observed.phases.get(dep_n) if observed else None
              if not _phase_complete(dep_phase, dep_obs):
                  return False
          return True
      ```

      Note: the exact `GhState` / `observed.phases` shape depends on
      `vk.parser` / `vk.observe`. If the field is named differently
      (e.g. `observed.phase_observations`), use that. Read
      `src/vk/observe.py` for the actual shape before writing.

      Don't run pytest yet — this helper isn't wired in.
  - id: P1.T3.S3
    text: |-
      Change `_lifecycle_label` signature to accept plan + observed.

      Edit `src/vk/render.py` at line 51. New signature:
      ```python
      def _lifecycle_label(
          phase: PhaseDoc,
          obs: PhaseObservation | None,
          plan: Plan,
          observed: GhState,
      ) -> LabelDef | None:
          if _phase_complete(phase, obs):
              return None
          if phase.phase.tag == "manual":
              return MANUAL
          if not _deps_satisfied(phase, plan, observed):
              return VK_BLOCKED
          if obs is None:
              return VK_READY
          # existing PR/assignee logic unchanged below
          ...
      ```

      Update the call site(s) of `_lifecycle_label` in the same module
      (search `_lifecycle_label(` in render.py — typically one call
      inside `render(plan, observed)`). Pass `plan` and `observed`
      through.

      Run: `uv run pytest tests/unit/test_render_deps.py -x --no-cov`
      Expect: all six Group A tests GREEN.
  - id: P1.T3.S4
