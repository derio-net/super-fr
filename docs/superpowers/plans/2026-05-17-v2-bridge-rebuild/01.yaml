  - id: P1.T1.S2
    text: |-
      Add `test_v2_plan_cross_repo_fixture_exists` (test H8).

      Add `tests/integration/test_repo_invariants.py` (new file) with:
      ```python
      from pathlib import Path
      import yaml

      def test_v2_plan_cross_repo_fixture_exists():
          """
          GIVEN the repo
          THEN  tests/unit/fixtures/v2_plan_cross_repo/_meta.yaml exists
          AND   at least one phase yaml has tracking_issue pointing at a
                repo different from _meta.target_repo
          AND   at least one phase yaml has tracking_issue=null (undispatched)
          """
          fx = Path("tests/unit/fixtures/v2_plan_cross_repo")
          meta = yaml.safe_load((fx / "_meta.yaml").read_text())
          assert meta["target_repo"] == "derio-net/repo-a"
          phases = [yaml.safe_load(p.read_text()) for p in sorted(fx.glob("0*.yaml"))]
          foreign = [p for p in phases if (p["phase"].get("tracking_issue") or "").startswith("https://github.com/derio-net/repo-b")]
          undispatched = [p for p in phases if p["phase"].get("tracking_issue") is None]
          assert foreign, "no foreign-repo phase in fixture"
          assert undispatched, "no undispatched phase in fixture"
      ```

      Run: `uv run pytest tests/integration/test_repo_invariants.py -k cross_repo_fixture -x --no-cov`
      Expect: green.
  - id: P1.T1.S3
    text: |-
      Failing test for FakeGhClient label-must-exist regression guard (test H5).

      Create `tests/unit/test_fakes.py` (new file) with:
      ```python
      import pytest
      from tests.unit.fakes import FakeGhClient, FakeGhError

      def test_fake_gh_client_rejects_unensured_labels_on_edit():
          gh = FakeGhClient()
          gh.add_issue("derio-net/repo-a", 1)  # preload an issue to edit
          with pytest.raises(FakeGhError, match="label not found"):
              gh.edit_issue_labels(
                  "derio-net/repo-a", 1,
                  add=frozenset({"vk-ready"}), remove=frozenset(),
              )

      def test_fake_gh_client_rejects_unensured_labels_on_create():
          gh = FakeGhClient()
          with pytest.raises(FakeGhError, match="label not found"):
              gh.create_issue(
                  "derio-net/repo-a",
                  title="t", body="b", labels=frozenset({"vk-ready"}),
              )

      def test_fake_gh_client_accepts_labels_after_ensure():
          gh = FakeGhClient()
          gh.ensure_labels("derio-net/repo-a", ["vk-ready"])
          gh.create_issue(
              "derio-net/repo-a",
              title="t", body="b", labels=frozenset({"vk-ready"}),
          )
      ```

      Notes on signatures:
        - `ensure_labels(repo, labels)` accepts strings OR LabelDef objects
          (see `tests/unit/fakes.py:150-156`). Dicts are NOT supported.
        - `create_issue` takes `repo` positionally, then keyword-only
          `title`, `body`, `labels: frozenset[str]` (lines 133-148).
        - `edit_issue_labels` takes `repo, number` positionally, then
          keyword-only `add`/`remove` as `frozenset[str]` (lines 99-112).
        - Use `gh.add_issue(repo, n)` to preload an issue without going
          through `create_issue` (lines 51-71).

      Run: `uv run pytest tests/unit/test_fakes.py -x --no-cov`
      Expect: red — FakeGhClient currently accepts labels without ensure.
  - id: P1.T1.S4
    text: |-
      Tighten FakeGhClient to enforce label pre-ensure.

      Edit `tests/unit/fakes.py`. The class ALREADY tracks ensured labels
      per repo via `self.repo_labels: dict[str, set[str]]` (line 41); the
      gap is that `edit_issue_labels` and `create_issue` don't consult
      it. Do NOT introduce a parallel field — reuse `self.repo_labels`.

      In `edit_issue_labels(repo, number, add, remove)` and
      `create_issue(repo, ..., labels=...)`, raise FakeGhError if any
      `add` (or `labels`) name isn't in `self.repo_labels.get(repo, set())`:
      ```python
      unknown = set(add or set()) - self.repo_labels.get(repo, set())
      if unknown:
          raise FakeGhError(f"label not found on {repo}: {sorted(unknown)}")
      ```

      Run: `uv run pytest tests/unit/test_fakes.py tests/unit/ -x --no-cov`
      Expect: the three new fakes tests green. Existing tests may newly
      fail — those callers need to call `ensure_labels` first. Audit and
      fix any test that mutates labels without ensuring, OR pre-load
      the standard label set in their fixtures.
