- number: 5
  title: Implement cross-repo RepoLabelEnsure grouping
  steps:
  - id: P1.T5.S1
    text: |-
      Read `src/vk/diff.py` end-to-end. The current `RepoLabelEnsure`
      emission is single-repo; per-issue mutations at lines 134-171 are
      already cross-repo correct (regression-guarded by H2). Find the
      function that emits `RepoLabelEnsure` — likely top of `diff()` or
      a helper like `_label_ensures(...)`.

      Replace its single-repo emission with grouping. `parse_issue_url`
      already exists at `src/vk/_urls.py` and is already imported by
      `src/vk/diff.py` (used at line ~134 for per-issue routing). It
      returns `(repo, number)` — a tuple, not an object with `.repo`.

      ```python
      # Build labels_per_repo: {dest_repo: set[LabelDef]} from rendered.
      labels_per_repo: dict[str, set[LabelDef]] = {}
      for phase in plan.phases:
          ri = rendered.issue_per_phase[phase.phase.number]
          if phase.phase.tracking_issue:
              dest_repo, _ = parse_issue_url(phase.phase.tracking_issue)
          else:
              dest_repo = plan.meta.target_repo
          labels_per_repo.setdefault(dest_repo, set()).update(
              ld for ld in ri.labels if _is_managed(ld.name)
          )
      # RepoLabelEnsure.labels is frozenset[LabelDef] (see diff.py:79).
      # Sort the OUTER iteration for deterministic mutation order.
      ensures = [
          RepoLabelEnsure(repo=repo, labels=frozenset(labels))
          for repo, labels in sorted(labels_per_repo.items())
      ]
      mutations.extend(ensures)
      ```

      Replace the existing single-repo emission block at `diff.py:109-113`
      with the above. The per-issue routing at `diff.py:134-171` already
      uses `parse_issue_url` correctly — leave it alone.

      Run: `uv run pytest tests/unit/test_v2_diff.py -k 'ensure or cross_repo' -x --no-cov`
      Expect: H1, H2, H3, H4 all GREEN.
  - id: P1.T5.S2
    text: |-
      Run H6 end-to-end:
      `uv run pytest tests/unit/test_v2_apply.py -k cross_repo -x --no-cov`
      Expect: GREEN — apply now ensures labels on `derio-net/repo-b`
