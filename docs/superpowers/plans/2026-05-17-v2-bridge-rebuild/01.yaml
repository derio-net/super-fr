      Implementation pattern (imports as you'd write them — `parse` is
      the v2 plan-folder loader at `src/vk/parser.py:89`):
      ```python
      from pathlib import Path
      from vk.parser import parse
      from vk.render import render
      from vk.diff import diff, RepoLabelEnsure
      from vk.states import GhState

      def test_diff_emits_ensure_per_destination_repo(tmp_path):
          plan = parse(Path("tests/unit/fixtures/v2_plan_cross_repo"))
          observed = GhState(phases={})  # empty — all undispatched / fresh
          rendered = render(plan, observed)
          # diff() signature: diff(rendered, observed, *, plan) — kwarg-only.
          mutations = diff(rendered, observed, plan=plan).mutations
          ensures = [m for m in mutations if isinstance(m, RepoLabelEnsure)]
          ensure_repos = {m.repo for m in ensures}
          assert ensure_repos == {"derio-net/repo-a", "derio-net/repo-b"}
      ```

      Run: `uv run pytest tests/unit/test_v2_diff.py -k 'ensure or cross_repo' -x --no-cov`
      Expect: H1, H3, H4 RED (current diff emits one ensure on target_repo
      only). H2 may already pass if the per-issue routing at
      `src/vk/diff.py:134-171` is correct — confirm and treat as a
