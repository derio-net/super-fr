- number: 5
  title: B2 — regression guard against duplicate dispatch
  steps:
  - id: P2.T5.S1
    text: |-
      Add B2 to `tests/unit/test_bridge_dispatch.py`:
      ```python
      def test_no_duplicate_dispatch_implementations():
          """
          GIVEN the rebuilt vk package
          WHEN  grepping src/ for the dispatch sequence
          THEN  the create_issue + update_issue + list_repos + start_workspace
                + link_workspace_issue chain appears in exactly ONE module:
                vk.bridge.dispatch.
          """
          import subprocess
          from pathlib import Path
          # Grep src/ for files that call all 5 MCP methods.
          files_with_create = subprocess.check_output(
              ["git", "grep", "-l", "create_issue", "src/"], text=True
          ).splitlines()
          culprits = []
          for f in files_with_create:
              content = Path(f).read_text()
              if all(name in content for name in ("create_issue", "update_issue", "list_repos", "start_workspace", "link_workspace_issue")):
                  culprits.append(f)
          assert culprits == ["src/vk/bridge/dispatch.py"], (
              f"Dispatch sequence appears in unexpected files: {culprits}"
          )
      ```

      Run: `uv run pytest tests/unit/test_bridge_dispatch.py -k no_duplicate -x --no-cov`
      Expect: green. (If red, find the second file and migrate its
      dispatch into `vk.bridge.dispatch`.)
