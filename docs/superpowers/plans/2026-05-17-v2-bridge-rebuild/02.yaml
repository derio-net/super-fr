- number: 4
  title: vk.bridge.dispatch — implementation
  steps:
  - id: P2.T4.S1
    text: |-
      Create `src/vk/bridge/dispatch.py`.

      Public surface:
      ```python
      from dataclasses import dataclass
      from vk.parser import Plan, PhaseDoc
      from vk._mcp_client import VkMcpClient

      @dataclass(frozen=True)
      class DispatchResult:
          card_id: str
          workspace_id: str | None

      def dispatch_phase(plan: Plan, phase: PhaseDoc, mcp: VkMcpClient) -> DispatchResult:
          """Create VK card + workspace for a vk-ready phase. The ONE canonical
          dispatch implementation. Both legacy and v2 call sites converge here."""
          ...
      ```

      Implementation extracts the merged behavior of legacy `sync_issue`
      and the v2 `_McpAdapter.create_card`:
      1. Build title: `gh#{N}: [{repo}]` where N = issue number from
         `phase.tracking_issue`, repo = `parse_issue_url(...).repo`.
      2. Build description (newline-joined):
         - `plan.meta.plan`
         - `f"Phase {phase.phase.number}/{len(plan.phases)}"`
         - `phase.phase.title`
         - `phase.tracking_issue` (issue URL)
      3. `card = mcp.create_issue(title=..., description=...)`
      4. `mcp.update_issue(card['id'], status='In progress')`
      5. `repos = mcp.list_repos()`; resolve target by name
      6. `ws = mcp.start_workspace(name=f"{simple_id} -> gh#{N}", repo=..., executor='CLAUDE_CODE', branch=f"vk/gh-{N}")`
      7. `mcp.link_workspace_issue(ws['id'], card['id'])`
      8. Optional: invoke `VK_LIFECYCLE_HOOK_SCRIPT` if env var set
         (deferred to Phase 4 — leave a hook point but don't implement).
      9. Return `DispatchResult(card_id=card['id'], workspace_id=ws['id'])`

      Run: `uv run pytest tests/unit/test_bridge_dispatch.py -x --no-cov`
      Expect: both tests GREEN.
