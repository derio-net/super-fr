  - id: P2.T2.S2
    text: |-
      Implement `FakeMcpClient` in `tests/unit/fakes.py`.

      ```python
      class FakeMcpClient:
          def __init__(self, fail_on_call: int | None = None):
              self.calls: list[tuple[str, dict]] = []
              self._fail_on = fail_on_call
              self._next_card_id = 0
              self._next_ws_id = 0
              self.issues: dict[str, dict] = {}      # card_id -> data
              self.workspaces: dict[str, dict] = {}  # ws_id -> data

          def _record(self, name: str, args: dict):
              self.calls.append((name, args))
              if self._fail_on and len(self.calls) == self._fail_on:
                  raise Exception("injected MCP failure")

          def create_issue(self, *, title, description, **kw):
              self._record("create_issue", {"title": title, "description": description, **kw})
              self._next_card_id += 1
              cid = f"card-{self._next_card_id}"
              self.issues[cid] = {"id": cid, "title": title, "description": description, "status": "Todo"}
              return self.issues[cid]

          def update_issue(self, card_id, **changes):
              self._record("update_issue", {"card_id": card_id, **changes})
              self.issues.setdefault(card_id, {"id": card_id}).update(changes)
              return self.issues[card_id]

          def start_workspace(self, *, name, repo, executor, branch, **kw):
              self._record("start_workspace", {"name": name, "repo": repo, "executor": executor, "branch": branch, **kw})
              self._next_ws_id += 1
              wid = f"ws-{self._next_ws_id}"
              self.workspaces[wid] = {"id": wid, "name": name, "archived": False, "linked_issue": None}
              return self.workspaces[wid]

          def update_workspace(self, ws_id, **changes):
              self._record("update_workspace", {"ws_id": ws_id, **changes})
              self.workspaces.setdefault(ws_id, {"id": ws_id}).update(changes)
              return self.workspaces[ws_id]

          def list_repos(self):
              self._record("list_repos", {})
              return [{"name": "derio-net/frank"}, {"name": "derio-net/willikins"}, {"name": "derio-net/superpowers-for-vk"}]

          def link_workspace_issue(self, ws_id, card_id):
              self._record("link_workspace_issue", {"ws_id": ws_id, "card_id": card_id})
              if ws_id in self.workspaces:
                  self.workspaces[ws_id]["linked_issue"] = card_id

          def list_workspaces(self):
              self._record("list_workspaces", {})
              return list(self.workspaces.values())

          def list_issues(self):
              self._record("list_issues", {})
              return list(self.issues.values())

          def get_issue(self, card_id):
              self._record("get_issue", {"card_id": card_id})
              return self.issues.get(card_id)

          def close(self):
              self._record("close", {})
      ```

      Run: `uv run pytest tests/unit/test_fakes.py -k fake_mcp -x --no-cov`
      Expect: GREEN.
