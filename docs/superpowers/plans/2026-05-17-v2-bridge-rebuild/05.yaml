- number: 1
  title: vk.bridge.__main__ + main() skeleton + tick log + no public verb
  steps:
  - id: P5.T1.S1
    text: |-
      Failing tests E1, E2, G1, G5 in `tests/unit/test_bridge_cli.py`
      and `tests/integration/test_bridge_entry_point.py`.

      E1: `vk --help` output (subprocess.run) does NOT contain 'bridge'.

      E2: `python -m vk.bridge --dry-run` exits 0 with no MCP/gh side
      effects (use a clean environment that lacks VK_ORG_ID etc. so
      --dry-run is the only mode that can succeed).

      G1: caplog captures log records during a tick — proves stdlib
      logging is wired.

      G5: caplog's first record matches regex
      `^\[bridge\] - v\d+\.\d+\.\d+ - \d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2} UTC - tick$`.

      Run: red — `vk.bridge.cli` doesn't exist.
  - id: P5.T1.S2
    text: |-
      Create `src/vk/bridge/__main__.py`:
      ```python
      from vk.bridge.cli import main
      if __name__ == "__main__":
          raise SystemExit(main())
      ```

      Create `src/vk/bridge/cli.py` with stdlib `logging` setup +
      version-stamped tick banner:
      ```python
      import argparse
      import datetime
      import logging
      import sys
      from importlib.metadata import version as _pkg_version

      def main(argv: list[str] | None = None) -> int:
          parser = argparse.ArgumentParser(prog="vk.bridge")
          parser.add_argument("--dry-run", action="store_true")
          args = parser.parse_args(argv)

          logging.basicConfig(level=logging.INFO, format="%(message)s")
          log = logging.getLogger("vk.bridge")

          vk_ver = _pkg_version("vk")
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
          log.info(f"[bridge] - v{vk_ver} - {now} - tick")

          if args.dry_run:
              log.info("vk.bridge: dry-run complete")
              return 0

          # ... real tick logic added in T5.T1.S3
          log.info("vk.bridge: tick complete")
          return 0
      ```

      Run: `uv run pytest tests/unit/test_bridge_cli.py tests/integration/test_bridge_entry_point.py -x --no-cov`
      Expect: E1, E2, G1, G5 all GREEN.
  - id: P5.T1.S3
    text: |-
      Wire the real tick into `main()`. Roughly:
      ```python
      import os
      from pathlib import Path
      from vk._mcp_client import VkMcpClient
      from vk.real_ghclient import RealGhClient  # actual module: src/vk/real_ghclient.py
      from vk.bridge import tick, discover_plans
      from vk.bridge.workspaces import reap_orphans
      from vk.bridge.pr_state import tick as pr_state_tick
      ...
      gh = RealGhClient()
      mcp = VkMcpClient.start()
      try:
          for repo_path in _configured_repos():
              for plan in discover_plans(repo_path, gh):
                  tick(plan, gh, mcp)
          pr_state_tick(mcp, _gather_pr_observations(...))
          reap_orphans(mcp)
      finally:
          mcp.close()


      def _configured_repos() -> list[Path]:
          """Resolve managed repo checkouts from the VK_BRIDGE_REPOS env var.

          Format: comma-separated list of absolute paths to git checkouts.
          Default: '~/repos/*' glob expansion (matches today's bridge convention
          at agent-images/kali/scripts/vk-issue-bridge.py:55-76).
          """
          raw = os.environ.get("VK_BRIDGE_REPOS", "").strip()
          if raw:
              return [Path(p).expanduser() for p in raw.split(",") if p.strip()]
          home_repos = Path("~/repos").expanduser()
          return sorted(p for p in home_repos.glob("*") if (p / ".git").exists())
      ```

      Exact wiring TBD by what `vk.bridge.tick` already accepts. Read
      `src/vk/bridge/__init__.py` and adapt.

      Run: full unit suite. Expect green.
- number: 2
  title: Stale-checkout auto-pull (E4)
  steps:
  - id: P5.T2.S1
    text: |-
      Failing test E4 in `tests/integration/test_bridge_cli.py`. Uses
      tmp_path with a bare origin repo + clone; pushes a commit to
      origin that local doesn't have; runs `main()` configured to
      manage that repo; asserts `discover_plans` finds the new plan
      (proving the pull happened first).

      Run: red.
  - id: P5.T2.S2
    text: |-
      In `vk.bridge.cli`, before iterating `discover_plans` for each
      repo, run:
      ```python
      subprocess.run(["git", "-C", repo_path, "fetch"], check=True)
      subprocess.run(["git", "-C", repo_path, "checkout", "main"], check=True)
      subprocess.run(["git", "-C", repo_path, "pull", "--ff-only"], check=True)
      ```

      Wrap in try/except — if pull fails (conflicts), log warning and
      continue with stale checkout (defensive — better stale dispatch
      than no dispatch).

      Run: E4 GREEN.
- number: 3
  title: Resilience guards (I1, I2, I3, I4, I6, I9) + MCP timeout knob
  steps:
  - id: P5.T3.S1
    text: |-
      Failing tests I1, I2, I3, I4, I6, I9 in
      `tests/integration/test_bridge_resilience.py` (append to existing
      file from Phase 1).

      I1: missing `vibe-kanban-mcp` AND `npx` → exit non-zero, stderr
      names binary + install fix.
      I2: MCP subprocess dies mid-tick → tick aborts cleanly, metric
      pushed.
      I2 (TimeoutError sub-case, NEW for 2026-05-18 incident):
      `test_tick_continues_when_one_phase_times_out` — plan with three
      vk-ready phases; FakeMcpClient.start_workspace raises TimeoutError
      for phase 2; assert phases 1 and 3 are dispatched, phase 2
      surfaces in TickResult.failures, tick() does not re-raise.
      I3: gh returns 403 rate-limit → backoff, no MCP mutations, metric.
      I4: lock file at `/var/run/vk-bridge.lock` (or VK_BRIDGE_LOCK_PATH)
      → second concurrent invocation exits 0 with 'tick already in
      progress'.
      I6: plan disappears between ticks → cards left intact, single
      warning logged.
      I9 (NEW for 2026-05-18 incident):
      `test_per_plan_exception_does_not_kill_daemon` — three discoverable
      plans (A, B, C); monkeypatch `vk.bridge.tick` to raise TimeoutError
      for plan B; assert tick was invoked for all three, A and C produced
      TickResult metrics, failure metric pushed for plan B with reason,
      daemon exits 0.

      Run: red.
  - id: P5.T3.S2
    text: |-
      Implement resilience:

      - I1: In `_construct_mcp_client()`, check `shutil.which('npx')` and
        `shutil.which('vibe-kanban-mcp')`. If both absent, write to
        stderr: `error: vibe-kanban-mcp and npx both missing. Install via
        'apt install nodejs npm' then 'npm install -g vibe-kanban'` and
        return non-zero exit.

      - I2: Catch `BrokenPipeError` / `subprocess.CalledProcessError` in
        the tick loop. Push failure metric, return cleanly.

      - I2 (TimeoutError sub-case): NO code change needed. The existing
        `except Exception as e` guard at
        `src/vk/bridge/__init__.py:175` already catches TimeoutError
        (TimeoutError is a subclass of Exception). The new test pins
        this behaviour against regressions — if anyone tightens the
        guard to a narrower exception type in future, the test fails.

      - I3: In the gh-call wrapper, detect 403 + 'rate limit'. Log
        backoff, return early. Metric. Use the new `_classify_error`
        helper (see P5.T3.S3) to keep the rate-limit detection logic
        out of the wrapper itself.

      - I4: At start of `main()`, `flock(open(LOCK_PATH, 'w'), LOCK_EX |
        LOCK_NB)`. On `BlockingIOError`, log 'tick already in progress,
        skipping' and return 0.

      - I6: When `discover_plans` returns nothing for a managed repo
        that had cards in the previous tick, log once per tick:
        `f"plan <slug> no longer on disk; cards left intact for manual
        review"`. Maintain a `_seen_plans.json` sidecar in
        `~/.willikins-agent/` (or similar) to track previously-seen
        plans across ticks. Do NOT auto-archive.

      - I9: In `vk.bridge.cli.main()`, the loop that iterates
        `discover_plans()` wraps its per-plan body in
        `try/except Exception`. On exception: `logger.exception(...)`,
        push failure metric with `plan=plan.dir.name` and
        `reason=str(e)`, then `continue` to the next plan. Do NOT
        re-raise. This is the OUTER boundary; `tick()`'s inner per-phase
        guard handles dispatch-layer failures, this catches anything that
        bypasses the inner try-block (observe/render/diff/apply raising,
        metric push throwing, or any non-tick() code in the daemon loop).

      Run: `uv run pytest tests/integration/test_bridge_resilience.py -x --no-cov`
      Expect: GREEN.
  - id: P5.T3.S3
    text: |-
      Extract gh-stderr classification (concern M in the spec inventory).

      Port `_classify_gh_error:543-555` from the legacy bridge into
      `src/vk/gh.py` as `_classify_error(stderr: str) -> str`. Returns
      one of `'info'`, `'warn'`, `'rate_limit'`, `'unknown'`.

      Add `tests/unit/test_gh_classify.py`:
      ```python
      from vk.gh import _classify_error

      def test_rate_limit_classified():
          assert _classify_error("HTTP 403: API rate limit exceeded") == "rate_limit"

      def test_not_found_classified_info():
          assert _classify_error("HTTP 404: Not Found") == "info"

      def test_unknown_returns_unknown():
          assert _classify_error("connection reset") == "unknown"
      ```

      The I3 backoff guard (P5.T3.S2) consumes `_classify_error` to
      decide whether to back off vs. raise. Phase 6 G4 test (concern M
      coverage) imports `vk.gh._classify_error` and asserts it exists.

      Run: `uv run pytest tests/unit/test_gh_classify.py -x --no-cov`
      Expect: GREEN.
  - id: P5.T3.S4
    text: |-
      Failing test for the MCP per-call timeout knob (the 2026-05-18
      incident's Bug 1). New unit test
      `tests/unit/test_mcp_client_timeout.py::test_start_workspace_uses_180s_timeout`
      — see the third location listed under spec section I2.

      Construct a real VkMcpClient (or a minimally-stubbed subclass that
      doesn't actually spawn the MCP subprocess), monkeypatch `_recv` to
      record the `timeout` kwarg it was invoked with, then assert:

      - `client.start_workspace(name=..., repo='owner/r', executor='X',
        branch='b')` records `timeout=180.0`.
      - `client.get_issue('id-1')` records `timeout=30.0` (default
        unchanged for cheap RPC tools).
      - `client.call_tool('custom', {}, timeout=5.0)` records
        `timeout=5.0` (explicit override wins).

      Add a second test
      `test_existing_tool_wrappers_inherit_30s_default` asserting
      `update_issue`, `list_issues`, `list_workspaces`, `list_repos`,
      `link_workspace_issue` all record `timeout=30.0`. This pins the
      "only start_workspace opts up" guarantee against future drift.

      Run: red — `call_tool` today doesn't accept `timeout`;
      `start_workspace` doesn't pass one.
  - id: P5.T3.S5
    text: |-
      Implement the per-call timeout knob in `src/vk/_mcp_client.py`:

      ```python
      def call_tool(
          self,
          name: str,
          arguments: dict[str, Any],
          *,
          timeout: float = 30.0,
      ) -> Any:
          ...
          self._send({...})
          response = self._recv(timeout=timeout)
          ...

      def start_workspace(self, *, name, repo, executor, branch, **kwargs):
          if "repositories" in kwargs:
              raise TypeError(...)  # unchanged guard
          return self.call_tool(
              "start_workspace",
              {
                  "name": name,
                  "executor": executor,
                  "repositories": [repo],
                  "branch": branch,
                  **kwargs,
              },
              timeout=180.0,
          )
      ```

      Leave `_recv`'s signature (`timeout: float = 30.0`), the wire
      protocol, and every other tool wrapper untouched. The change is
      purely additive: existing tool wrappers' callers do not need to
      change because they don't pass `timeout` — they inherit the 30s
      default.

      Run: `uv run pytest tests/unit/test_mcp_client_timeout.py
      tests/unit/test_mcp_client.py -x --no-cov`
      Expect: new tests GREEN, existing _mcp_client tests still GREEN.
- number: 4
  title: install.sh --install-bridge (E3)
  steps:
  - id: P5.T4.S1
    text: |-
      Failing test E3 in `tests/integration/test_install_bridge.py`.

      Temp HOME with vk installed (use `uv tool install vk` against the
      in-repo source if possible, OR mock it). Set
      VK_BRIDGE_WRAPPER_PATH=/tmp/test-wrapper/run.sh. Run
      `bash scripts/install.sh --install-bridge`. Assert wrapper exists,
      is executable, content references the venv python. Assert stdout
      contains a cron line.

      Run: red — flag doesn't exist.
  - id: P5.T4.S2
    text: |-
      Edit `scripts/install.sh`. Add `--install-bridge` handling:
      ```bash
      if [ "$1" = "--install-bridge" ]; then
          wrapper_path="${VK_BRIDGE_WRAPPER_PATH:-/opt/vk-bridge/run.sh}"
          mkdir -p "$(dirname "$wrapper_path")"
          # Resolve the active vk venv's python interpreter.
          vk_python="$(uv run which python 2>/dev/null || command -v python3)"
          cat > "$wrapper_path" <<EOF
      #!/bin/bash
      exec "$vk_python" -m vk.bridge "\$@"
      EOF
          chmod +x "$wrapper_path"
          echo "Wrapper installed at $wrapper_path"
          echo ""
          echo "To schedule the bridge, add to your cron config:"
          echo "*/2 * * * * $wrapper_path"
          exit 0
      fi
      ```

      Run: `uv run pytest tests/integration/test_install_bridge.py -x --no-cov`
      Expect: E3 GREEN.
