tasks:
- number: 1
  title: Prepend a "sync your repo" preamble to the dispatch prompt
  steps:
  - id: P8.T1.S1
    text: |-
      Pin the desired behavior with a failing unit test.

      Background (surfaced 2026-05-18, post-Phase-4-merge): the bridge
      pod's `~/repos/<repo>` checkouts are NOT auto-refreshed and are
      shared with the operator (so we can't have the bridge `git pull`
      either — would clobber operator's in-progress work). After Phase 4
      shipped, the bridge kept projecting Phase 5 as `vk-blocked`
      because its plan checkout was 9 hours stale and didn't see Phase
      4's `completion.at` timestamp. Once a workspace IS dispatched,
      its branch is also based on stale `main`, so the agent's work
      could rebase on top of already-merged code (silent regression
      risk) or produce conflicts at PR time.

      The fix lives **agent-side**, not bridge-side: the dispatch
      prompt instructs the agent to refresh its checkout before doing
      anything else.

      Add to `tests/unit/test_bridge_prompt.py` (or wherever
      `build_prompt` is unit-tested — read `src/vk/bridge/prompt.py`
      first to find the existing test file):

      ```python
      def test_build_prompt_includes_repo_sync_preamble(plan_factory, phase_factory):
          """Agent must be told to fetch + rebase on origin/main before
          starting work, because the pod's repo checkout is shared with
          the operator and not auto-refreshed."""
          plan = plan_factory(...)  # any v2 plan, single phase
          phase = phase_factory(..., tracking_issue="https://github.com/derio-net/foo/issues/1")
          prompt = build_prompt(plan, phase)

          # The preamble fires UNCONDITIONALLY (no `depends_on` gate)
          assert "SYNC YOUR REPO CHECKOUT FIRST" in prompt
          assert "git fetch origin" in prompt
          assert "git rebase origin/main" in prompt
          # Preamble appears BEFORE the deps block (if any) and BEFORE
          # the "You are a VK-spawned agent" line
          sync_idx = prompt.index("SYNC YOUR REPO CHECKOUT FIRST")
          agent_idx = prompt.index("You are a VK-spawned agent")
          assert sync_idx < agent_idx
      ```

      Add a second test covering ordering when deps ALSO fire:

      ```python
      def test_build_prompt_sync_preamble_precedes_deps_preamble(...):
          """When a phase has deps, both preambles appear: sync FIRST,
          deps SECOND."""
          plan = plan_factory(...)  # plan with Phase 2 depending on Phase 1
          phase = plan.phases[1]   # Phase 2
          prompt = build_prompt(plan, phase)

          sync_idx = prompt.index("SYNC YOUR REPO CHECKOUT FIRST")
          deps_idx = prompt.index("BEFORE YOU BEGIN: This Issue declares dependencies")
          assert sync_idx < deps_idx
      ```

      Run: `uv run pytest tests/unit/test_bridge_prompt.py -k sync_preamble -x --no-cov`
      Expect: RED.
  - id: P8.T1.S2
    text: |-
      Make the tests green — add the preamble.

      Edit `src/vk/bridge/prompt.py`. Add a new template constant next
      to `_DEPS_PREAMBLE_TEMPLATE`:

      ```python
      _SYNC_PREAMBLE = (
          "SYNC YOUR REPO CHECKOUT FIRST:\n"
          "The pod's repo checkout is shared with the operator and is "
          "NOT auto-refreshed. Your workspace branch is based on "
          "whatever `main` was when the pod last touched it — possibly "
          "stale by hours. Before any other action:\n\n"
          "  git fetch origin\n"
          "  git rebase origin/main\n\n"
          "If rebase produces conflicts, STOP and report — likely your "
          "dispatch is racing with already-merged work, or a sibling "
          "agent landed something on `main` while you were being "
          "spawned. Either way, the operator needs to triage before "
          "you proceed.\n\n"
          "---\n\n"
      )
      ```

      Modify `build_prompt()` to prepend it UNCONDITIONALLY (does not
      require `depends_on`):

      ```python
      def build_prompt(plan: Plan, phase: PhaseDoc) -> str:
          ...
          preamble = _SYNC_PREAMBLE  # ALWAYS fires
          if phase.phase.depends_on:
              dep_refs = ", ".join(_dep_ref(plan, dep) for dep in phase.phase.depends_on)
              preamble += _DEPS_PREAMBLE_TEMPLATE.format(dep_refs=dep_refs)
          ...
          return preamble + ...
      ```

      Important: the order is `sync` → `deps` → `agent identity`. The
      sync block fires first because it's pre-flight; the deps block
      is conditional and is the second gate; only then does the agent
      learn what it's working on.

      Run: `uv run pytest tests/unit/test_bridge_prompt.py -x --no-cov`
      Expect: GREEN.

      Then run the full unit + integration suites to make sure no
      golden-prompt fixture broke:
      `uv run pytest tests/ -x --no-cov`
      If golden-prompt tests fail, update their expected strings to
      include the new preamble — the change is intentional and
      operator-visible.
  - id: P8.T1.S3
    text: |-
      Document the change in `_prose.md` for the prompt module.

      `src/vk/bridge/prompt.py`'s module docstring (top of file) mentions
      the dependency preamble. Extend it to mention the sync preamble
      too, so future readers don't have to guess why an unconditional
      block exists ahead of the conditional one.

      Add a paragraph to the docstring along these lines:

      "A second, unconditional preamble — `_SYNC_PREAMBLE` — fires
      ahead of the deps preamble, instructing the agent to
      `git fetch origin && git rebase origin/main` before doing any
      work. This compensates for the bridge pod's
      shared-with-operator repo checkout, which is not auto-refreshed.
      Without this, a workspace branched off a 9-hour-stale `main`
      would do work on top of already-merged code, surfacing as
      either silent regression or PR-time conflicts. Added in Phase
      8 of #147 after the 2026-05-18 stale-checkout incident."

      No code change in this step — docstring only.
  - id: P8.T1.S4
    text: |-
      Version bump + verification + PR.

      Bump to the next patch version available when this phase ships.
      Phase 6 (cutover) bumps to v2.2.0 per the original plan; if Phase
      8 ships after Phase 6, this is `2.2.0 → 2.2.1`. If something else
      shipped between Phase 6 and Phase 8, use whatever's next.
      Implementing agent: read `pyproject.toml::[project].version`
      immediately before bumping — don't hardcode.

      Bump the three files (`pyproject.toml`,
      `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json`).
      Run `uv sync`. Pre-push verify per CLAUDE.md (ruff format +
      check, mypy, pytest).

      Open PR with title:
      `feat(bridge): add repo-sync preamble to dispatch prompt (Phase 8 of #147)`

      PR body must include:
      - Link to the 2026-05-18 stale-checkout incident (bridge kept
        projecting Phase 5 vk-blocked because its plan yaml was 9 hours
        out of date; surfaced after Phase 4's merge but before this
        phase shipped, requiring operator manual `git pull` in the pod)
      - Reference #147 (tracking)
      - Explicit note that this is the operator-shared-pod-shape
        compensation, NOT a fix to the underlying "bridge doesn't
        auto-pull" issue (which is intentional — the pod is shared,
        so auto-pull would clobber operator state). A bridge-side
        auto-pull would be a separate, larger change requiring pod
        ownership negotiation.
      - The before/after for the prompt — paste the rendered string
        for a phase WITH and WITHOUT deps so reviewers can see the
        new preamble in situ.
