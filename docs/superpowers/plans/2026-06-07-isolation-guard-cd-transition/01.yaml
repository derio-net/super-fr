- number: 2
  title: Implement the allowance in fr-isolation-guard.sh
  steps:
  - id: P1.T2.S1
    text: |-
      Edit plugins/super-fr/hooks/fr-isolation-guard.sh. After the
      `command=$(…)` extraction (line 39) and BEFORE the
      `fr isolation` allowlist check, insert:

      BEGIN allowance block
      # Transition allowance (#279): a command LEADING with `cd <dir>` whose
      # target resolves inside an allowed prefix (fr worktrees, temp dirs)
      # and outside the base repo is the documented way to move the host
      # shell to the worktree for git/gh ops (SKILL.md exec-bridge
      # discipline). Without it, a session that starts in the base repo —
      # every fr pipeline session — can never reach the prescribed cwd: the
      # guard would deny the very `cd` it asks for. Each subsequent call is
      # re-evaluated against its own declared cwd, so nothing is lost.
      cd_target=$(printf '%s' "$command" | sed -nE 's/^[[:space:]]*cd[[:space:]]+("([^"]+)"|'\''([^'\'']+)'\''|([^[:space:];&|]+)).*/\2\3\4/p')
      if [ -n "$cd_target" ]; then
        case "$cd_target" in "~"*) cd_target="$HOME${cd_target#\~}" ;; esac
        if rtarget=$(cd "$cd_target" 2>/dev/null && pwd -P); then
          case "$rtarget/" in
            "$rroot"/*) ;;   # back into the base repo — guard still applies
            *)
              prefixes="${FR_CD_ALLOW_PREFIXES:-$HOME/.cache/fr/worktrees:/tmp:${TMPDIR:-}}"
              old_ifs=$IFS
              IFS=':'
              for prefix in $prefixes; do
                [ -n "$prefix" ] || continue
                rprefix=$(cd "$prefix" 2>/dev/null && pwd -P) || continue
                case "$rtarget/" in
                  "$rprefix"/*) IFS=$old_ifs; exit 0 ;;
                esac
              done
              IFS=$old_ifs
              ;;
          esac
        fi
      fi
      END allowance block
  - id: P1.T2.S2
    text: |-
      In the same file, update the deny reason (the jq -n --arg reason
      line) to:

      "fr pipeline active: run via \`fr isolation exec -- …\` (or \`fr
      isolation up\` first). Host-side git/gh ops: lead with \`cd
      <worktree> && …\` — run from the worktree cwd, not the base repo.
      See plugins/super-fr/skills/fr-isolation (exec-bridge discipline,
      #265/#279)."

      Also extend the header comment (lines 2-8) with one line noting
      the #279 transition allowance.
  - id: P1.T2.S3
    text: |-
      Run: fr isolation exec --branch feat/issue-279 -- uv run pytest
      tests/unit/test_hooks_guard.py -q --no-cov

      Expect: ALL tests green (existing 8 + new allowance class), zero
      skips.
