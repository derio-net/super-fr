- number: 1
  title: Document the compound shape in fr-isolation SKILL.md
  steps:
  - id: P2.T1.S1
    text: |-
      Edit plugins/super-fr/skills/fr-isolation/SKILL.md, exec-bridge
      discipline section: after the "ALL GitHub interaction relies on
      an AUTHENTICATED HOST…" bullet, add:

      "- The Claude Code harness resets the persistent shell cwd back
        to the base repo between calls, so every host-side git/gh op is
        a compound `cd <worktree> && gh …` / `cd <worktree> && git
        push`. The isolation guard explicitly allows a leading `cd`
        whose target resolves under `~/.cache/fr/worktrees` or a temp
        dir (#279) — nothing else leaves the base-repo cwd."
  - id: P2.T1.S2
    text: |-
      Run: fr isolation exec --branch feat/issue-279 -- uv run pytest
      tests/unit/test_skill_validation.py -q --no-cov — expect green
      (prose-only edit, frontmatter untouched).
- number: 2
  title: Version bump and full verification
  steps:
  - id: P2.T2.S1
    text: |-
      Run: fr isolation exec --branch feat/issue-279 -- uv run
      scripts/bump-version.py patch

      Expect 3.1.1 → 3.1.2 across workspace pyproject.toml, member
      pyprojects, plugins/*/.claude-plugin/plugin.json,
      .claude-plugin/marketplace.json, and uv.lock refreshed. Then:
      fr isolation exec --branch feat/issue-279 -- uv run
      scripts/bump-version.py --check — expect agreement.
  - id: P2.T2.S2
    text: |-
      Run the full local CI surface inside the container:
      fr isolation exec --branch feat/issue-279 -- uv run ruff format src/ tests/
      fr isolation exec --branch feat/issue-279 -- uv run ruff check
      fr isolation exec --branch feat/issue-279 -- uv run pytest -q --no-cov

      Expect: format makes no changes (or commit them), check clean,
      full suite green.
