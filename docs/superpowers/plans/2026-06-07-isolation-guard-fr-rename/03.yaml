- number: 1
  title: TDD profiles-file dual-read (fr-profiles.yaml first)
  steps:
  - id: P3.T1.S1
    text: |-
      Add failing tests to tests/unit/test_isolation.py:
      - profiles_config reads .devcontainer/fr-profiles.yaml when present.
      - vk-profiles.yaml only → still read, stderr carries
        "legacy vk-profiles.yaml" warning (capsys).
      - both present → fr wins, no warning.
      And to tests/unit/test_init_scaffold.py: scaffold_profile writes
      fr-profiles.yaml (not vk-). Run — expect failures.
  - id: P3.T1.S2
    text: |-
      Implement in packages/fr/src/fr/isolation/types.py: add
      _PROFILES_FILES = ("fr-profiles.yaml", "vk-profiles.yaml") and a
      module-level _warn_legacy(what, path) printing
      "[fr] WARNING: legacy {what} at {path} — run `fr init migrate`"
      to stderr. profiles_config() walks the pair. Update
      resolve_profile() error strings to name fr-profiles.yaml and the
      fr-init skill. scaffold._update_profiles_yaml writes
      fr-profiles.yaml. Run — green.
- number: 2
  title: TDD secrets-dir dual-read (~/.config/fr/secrets first)
  steps:
  - id: P3.T2.S1
    text: |-
      Add failing tests (test_isolation.py, test_init_scaffold.py, HOME
      monkeypatched to tmp_path):
      - secrets_env_file(): fr path returned when it exists or when
        neither exists (new default); vk-only on disk → vk returned +
        legacy warning.
      - LocalWorktreeDevcontainerTarget.up() creates the placeholder
        under ~/.config/fr/secrets/<repo>/<profile>.env.
      - scaffold_profile() devcontainer.json runArgs --env-file points
        at ${localEnv:HOME}/.config/fr/secrets/....
      - scaffold_profile() devcontainer.json carries customizations.fr
        (not customizations.vk) — spec matrix row 3, new-write side.
      Run — expect failures.
  - id: P3.T2.S2
    text: |-
      Implement: new shared helper in types.py —
      secrets_env_file(repo_name, profile) encapsulating the fr/vk pair
      logic; local.py:_env_file and scaffold.py:env_file_path delegate
      to it; scaffold config template emits the fr path in runArgs and
      "customizations": {"fr": {...}}.
      Run — green.
- number: 3
  title: TDD state-dir dual-read + cache-dir rename
  steps:
  - id: P3.T3.S1
    text: |-
      Add failing tests (test_isolation.py):
      - save_state writes under .git/fr/isolation/.
      - load_state/list_states find a state file under legacy
        .git/vk/isolation/ + warn once.
      - both dirs populated → fr copy wins for the same branch.
      - up() default worktree path starts with ~/.cache/fr/worktrees/
        (HOME monkeypatched).
      Run — expect failures.
  - id: P3.T3.S2
    text: |-
      Implement in types.py: state_dir() → .git/fr/isolation;
      _legacy_state_dir() → .git/vk/isolation; load_state/list_states
      check fr first then legacy (warn). down() unlinks from whichever
      dir the state was loaded from (unlink both paths, missing_ok).
      local.py up(): cache base ~/.cache/fr/worktrees. Run — green.
- number: 4
  title: TDD bridge lock + FR_BRIDGE_* env dual-read
  steps:
  - id: P3.T4.S1
    text: |-
      Add failing tests to tests/unit/test_bridge_cli.py and
      test_bridge_config.py:
      - default lock path is /var/run/fr-bridge.lock; read-only
        /var/run fallback is /tmp/fr-bridge.lock.
      - FR_BRIDGE_LOCK_PATH respected; VK_BRIDGE_LOCK_PATH alone still
        respected + stderr warning.
      - same FR-first/VK-fallback-warn for FR_BRIDGE_REPOS and
        FR_BRIDGE_RECOVER_ORPHAN_CARDS (helper-level test).
      - VK_DERIO_OPS_PROJECT_ID intentionally NOT renamed (assert the
        existing read is untouched — VibeKanban-domain).
      Run — expect failures.
  - id: P3.T4.S2
    text: |-
      Implement in packages/fr-vk/src/fr_vk/: add _bridge_env(name) →
      reads FR_BRIDGE_<name>, falls back to VK_BRIDGE_<name> with
      warning; use it for LOCK_PATH, REPOS, RECOVER_ORPHAN_CARDS at
      their read sites (bridge_cli.py, config.py/bridge.py — locate
      with: grep -rn "VK_BRIDGE_" packages/fr-vk/src/). Rename
      _DEFAULT_LOCK_PATH and the /tmp fallback to fr-bridge.lock.
      Run — green.
- number: 5
  title: Sweep stale vk-init strings
  steps:
  - id: P3.T5.S1
    text: |-
      Fix remaining strings: types.py:83,93 error messages (vk-init →
      fr-init), scaffold.py module docstring ("driven by the fr-init
      skill"), init_cmd.py help text ("driven by vk-init" → fr-init).
      Verify zero hits: grep -rn "vk-init" packages/fr/src/ — expect
      empty. Run full isolation tests: uv run pytest
      tests/unit/test_isolation.py tests/unit/test_init_scaffold.py
      tests/unit/test_isolation_cmd.py -q --no-cov — green.
