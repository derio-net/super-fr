tasks:
- number: 1
  title: Test-drive the gated hint
  steps:
  - id: P1.T1.S1
    text: |
      RED — add two tests to tests/unit/test_isolation_cmd.py exercising the
      CLAUDECODE gate on `fr isolation up` output.

      Append after the existing happy-path test:

      BEGIN tests/unit/test_isolation_cmd.py (append)
      def test_up_prints_add_dir_hint_in_claude_code(repo: Path, fake_run: list) -> None:
          res = runner.invoke(
              app,
              ["isolation", "up", "--repo", str(repo), "--branch", "vk-iso/h"],
              env={"CLAUDECODE": "1"},
          )
          assert res.exit_code == 0, res.output
          assert "/add-dir " in res.output
          # the absolute worktree path is the /add-dir argument
          assert "vk-iso__h" in res.output


      def test_up_omits_add_dir_hint_without_claude_code(repo: Path, fake_run: list) -> None:
          res = runner.invoke(
              app,
              ["isolation", "up", "--repo", str(repo), "--branch", "vk-iso/n"],
              env={"CLAUDECODE": None},
          )
          assert res.exit_code == 0, res.output
          assert "worktree" in res.output
          assert "/add-dir" not in res.output
      END

      Run: cd <worktree> && uv run pytest -q --no-cov tests/unit/test_isolation_cmd.py -k add_dir
      Expected: the positive test FAILS (no /add-dir emitted yet); the
      negative test passes vacuously. At minimum the positive test must RED.
  - id: P1.T1.S2
    text: |
      GREEN — implement the gated hint in
      packages/fr/src/fr/commands/isolation_cmd.py.

      1. Add `import os` to the imports (currently: json, Path, typer).
      2. In the `up()` command, after the existing summary echo
         (the `typer.echo(f"isolation up: worktree=...")` call), append:

      BEGIN packages/fr/src/fr/commands/isolation_cmd.py (inside up(), after the summary echo)
          if os.environ.get("CLAUDECODE"):
              typer.echo(
                  "tip: register the worktree as a Claude Code working directory so the "
                  "shell cwd persists there (no more `cd <worktree> && …` for host git/gh):\n"
                  f"    /add-dir {state.worktree}"
              )
      END

      Run: cd <worktree> && uv run pytest -q --no-cov tests/unit/test_isolation_cmd.py
      Expected: all isolation_cmd tests PASS (the two new ones plus the
      existing happy-path/no-profile/idempotency tests unchanged).
- number: 2
  title: Document the escape hatch + bump version
  steps:
  - id: P1.T2.S1
    text: |
      Update the fr-isolation SKILL.md exec-bridge bullet that documents the
      cwd reset (plugins/super-fr/skills/fr-isolation/SKILL.md, the bullet at
      lines ~64-69 beginning "The Claude Code harness resets the persistent
      shell cwd...").

      Append one or two sentences folded into that bullet: that `fr isolation
      up` prints an `/add-dir <worktree>` tip in a Claude Code session, and
      running it once stops the resets — after which a bare `cd <worktree>`
      persists and the `cd <worktree> &&` prefix is no longer needed for
      host-side ops (the #279 compound form remains the fallback before the
      dir is added). Do not restructure the section.
  - id: P1.T2.S2
    text: |
      Bump the version (src/ + skills/ changed → user-observable surfaces).

      Run: cd <worktree> && uv run scripts/bump-version.py patch
      Expected: 3.1.2 -> 3.1.3 across the canonical pyproject, member
      packages, plugin.json files, marketplace.json, and uv.lock; the script
      verifies `uv run fr --version` reports 3.1.3.

      Then run the full gate locally:
      cd <worktree> && uv run ruff format src/ tests/ ; uv run ruff check ;
      uv run pytest -q --no-cov
      Expected: format clean, lint clean, full suite green (note: one
      pre-existing integration test may fail if the uv-tool `fr` install is
      stale — `uv tool install --force .` fixes it; see project memory).
