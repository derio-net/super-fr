  - id: P1.T2.S1
    text: |-
      RED. Add a failing test to tests/unit/test_init_migrate.py: run
      migrate_repo from inside a linked worktree and assert it does not raise
      and resolves the vk->fr state paths under the shared .git dir.

          def test_migrate_repo_from_worktree(tmp_path: Path) -> None:
              repo = make_repo(tmp_path)  # import/define a minimal repo with a commit
              wt = repo.parent / "wt"
              subprocess.run(
                  ["git", "-C", str(repo), "worktree", "add", "-q", str(wt), "-b", "feat/x"],
                  check=True,
              )
              # seed a legacy vk state file under the SHARED .git
              vk_dir = repo / ".git" / "vk" / "isolation"
              vk_dir.mkdir(parents=True)
              (vk_dir / "feat__x.json").write_text("{}\n")
              actions = migrate_repo(wt, yes=True)  # from the worktree path
              assert any("vk/isolation" in a for a in actions)
              assert (repo / ".git" / "fr" / "isolation" / "feat__x.json").is_file()

      Match the existing test module's helpers/imports for building a repo.
      Run: uv run pytest tests/unit/test_init_migrate.py -q --no-cov
      Expect FAILURE (NotADirectoryError or paths resolved under the gitfile).
  - id: P1.T2.S2
    text: |-
      GREEN. In packages/fr/src/fr/isolation/migrate.py import _git_common_dir
      from fr.isolation.types and replace lines ~97-98:

          common = _git_common_dir(repo_root)
          vk_state = common / "vk" / "isolation"
          fr_state = common / "fr" / "isolation"

      Run: uv run pytest tests/unit/test_init_migrate.py -q --no-cov — expect green.
