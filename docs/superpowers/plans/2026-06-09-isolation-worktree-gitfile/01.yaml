- number: 1
  title: _git_common_dir helper + worktree-safe state dirs
  steps:
  - id: P1.T1.S1
    text: |-
      RED. Add failing tests to tests/unit/test_isolation.py. First add a
      helper that turns make_repo() output into a linked worktree:

          def add_worktree(repo: Path, branch: str = "feat/x") -> Path:
              wt = repo.parent / "wt"
              subprocess.run(
                  ["git", "-C", str(repo), "worktree", "add", "-q", str(wt), "-b", branch],
                  check=True,
              )
              return wt

      Then a test that exercises the state functions FROM the worktree path:

          def test_state_dir_worktree_safe(tmp_path: Path) -> None:
              repo = make_repo(tmp_path)
              wt = add_worktree(repo)
              common = repo / ".git"  # main checkout's real .git dir
              st = IsolationState(
                  repo_root=wt, branch="feat/x", worktree=wt,
                  profile="dev", created_at="2026-06-09T00:00:00Z",
              )
              save_state(st)  # must NOT raise NotADirectoryError
              p = state_path(wt, "feat/x")
              assert p.is_file()
              assert str(p).startswith(str(common / "fr" / "isolation"))
              # worktree-invariant key: main and worktree resolve identically
              assert state_path(wt, "feat/x") == state_path(repo, "feat/x")
              assert load_state(wt, "feat/x") == st
              delete_state(wt, "feat/x")
              assert load_state(wt, "feat/x") is None

      Import delete_state in the test module's imports.
      Run: uv run pytest tests/unit/test_isolation.py -q --no-cov
      Expect FAILURE: NotADirectoryError from save_state -> mkdir on the gitfile.
  - id: P1.T1.S2
    text: |-
      GREEN. In packages/fr/src/fr/isolation/types.py add `import subprocess`
      (alongside os/sys) and the helper, then repoint the two state dirs:

          def _git_common_dir(repo_root: Path) -> Path:
              """Shared .git dir, resolved for main checkouts AND linked
              worktrees. In a worktree <repo>/.git is a gitfile, not a dir;
              --git-common-dir returns the real shared dir (<main>/.git) that
              all worktrees of the repo share — the correct key for isolation
              state (state is repo+branch, not per-worktree). #292"""
              try:
                  out = subprocess.run(
                      ["git", "-C", str(repo_root), "rev-parse", "--git-common-dir"],
                      check=True, capture_output=True, text=True,
                  ).stdout.strip()
              except (subprocess.CalledProcessError, FileNotFoundError):
                  return repo_root / ".git"  # non-repo path (tests): legacy literal
              p = Path(out)
              return p if p.is_absolute() else (repo_root / p)

          def state_dir(repo_root: Path) -> Path:
              return _git_common_dir(repo_root) / "fr" / "isolation"

          def _legacy_state_dir(repo_root: Path) -> Path:
              return _git_common_dir(repo_root) / "vk" / "isolation"

      Run: uv run pytest tests/unit/test_isolation.py -q --no-cov — expect green
      (new worktree test passes; existing main-path tests unchanged because
      --git-common-dir returns ".git" for a main checkout).
