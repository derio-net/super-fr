tasks:
- number: 1
  title: Normalize repo_root to the main worktree toplevel
  steps:
  - id: P2.T1.S1
    text: |-
      RED. Add a failing test to tests/unit/test_isolation.py: a Target built
      from a worktree path normalizes repo_root to the MAIN checkout.

          def test_target_normalizes_repo_root_from_worktree(tmp_path: Path) -> None:
              repo = make_repo(tmp_path, ["dev"], default="dev")
              wt = add_worktree(repo, "feat/y")
              t = LocalWorktreeDevcontainerTarget(wt)
              assert t.repo_root == repo.resolve()

      Run: uv run pytest tests/unit/test_isolation.py -q --no-cov
      Expect FAILURE: t.repo_root currently equals wt.resolve(), not repo.
  - id: P2.T1.S2
    text: |-
      GREEN. In packages/fr/src/fr/isolation/local.py import _git_common_dir
      from fr.isolation.types, add _main_worktree_root, and use it in __init__:

          def _main_worktree_root(repo_root: Path) -> Path:
              """The MAIN checkout's toplevel, even when launched from a linked
              worktree. The common dir is <main>/.git; its parent is the main
              toplevel. Keying isolation off the durable main checkout (not the
              possibly-ephemeral launch worktree) means state + the spawned
              worktree survive that launch worktree being reaped. #292"""
              common = _git_common_dir(repo_root)
              return common.parent if common.name == ".git" else repo_root

          # in __init__:
          self.repo_root = _main_worktree_root(Path(repo_root).resolve())

      Run: uv run pytest tests/unit/test_isolation.py -q --no-cov — expect green.
      Also confirm the existing "not a git repo" guard test still passes
      (_git_common_dir's fallback returns repo_root/.git for a non-repo, whose
      parent is repo_root, so __init__ stays a no-op and up() still raises
      IsolationError). If no such test exists, add one asserting up() on a
      non-repo tmp_path raises IsolationError.
- number: 2
  title: .git bind-mount uses the common dir + up-from-worktree e2e
  steps:
  - id: P2.T2.S1
    text: |-
      RED. Add a failing test to tests/unit/test_isolation.py: up() launched
      from a worktree mounts the MAIN .git (a real dir) and persists main-keyed
      state. Mirror the existing test_up_creates_worktree_envfile_and_devcontainer
      setup (FakeRunner, home monkeypatch). Then:

          def test_up_from_worktree_mounts_common_git_and_keys_main(
              tmp_path, monkeypatch
          ) -> None:
              repo = make_repo(tmp_path, ["dev"], default="dev")
              wt = add_worktree(repo, "feat/z")
              monkeypatch.setenv("HOME", str(tmp_path / "home"))
              runner = FakeRunner()
              t = LocalWorktreeDevcontainerTarget(wt, runner=runner)
              st = t.up(profile=None, branch="iso/work", path=None)
              up_argv = next(c for c in runner.calls if c[0] == "devcontainer")
              mount = next(a for a in up_argv if a.startswith("--mount="))
              assert f"source={repo.resolve() / '.git'}" in mount
              assert st.repo_root == repo.resolve()
              assert str(st.worktree).startswith(
                  str(tmp_path / "home" / ".cache" / "fr" / "worktrees" / repo.name)
              )

      Adjust to match the FakeRunner / make_repo conventions already in the file.
      Run: uv run pytest tests/unit/test_isolation.py -q --no-cov
      Expect FAILURE: mount source is the worktree gitfile, not <main>/.git.
  - id: P2.T2.S2
    text: |-
      GREEN. In packages/fr/src/fr/isolation/local.py replace line ~72:

          git_dir = _git_common_dir(self.repo_root)

      Run: uv run pytest tests/unit/test_isolation.py -q --no-cov — expect green.
      Then run the whole isolation suite to catch regressions:
      uv run pytest tests/unit/test_isolation.py tests/unit/test_isolation_cmd.py
      tests/unit/test_init_migrate.py -q --no-cov — expect all green.
