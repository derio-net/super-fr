    text: |
      In README.md, add an `fr-debugging` row to the Skills table (near fr-brainstorming): "superpowers systematic-debugging, run inside an isolated workspace; autonomous to a PR with hard stops at the don't-understand and 3+-fixes architecture checkpoints".
  - id: P2.T2.S2
    text: |
      In README.md line ~20, change the super-fr row from "7 skills" to "8 skills".
  - id: P2.T2.S3
    text: |
      Run `cd <worktree> && uv run python -m fr skills` and confirm the new fr-debugging row prints under Skills (exit 0).
