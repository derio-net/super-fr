- number: 1
  title: Add the Debugging Override to the repo-local rule
  steps:
  - id: P2.T1.S1
    text: |
      Append a "## Debugging Override" section to plugins/super-fr/rules/fr-plan-override.md, mirroring the Brainstorming Override: in a repo with fr plans (docs/superpowers/plans/) or devcontainer profiles (.devcontainer/<profile>/), debugging a bug / test failure / unexpected behavior uses fr-debugging instead of plain superpowers:systematic-debugging — it enters isolation first. Plain systematic-debugging remains for non-fr repos.
- number: 2
  title: Add fr-debugging to the README skills table
  steps:
