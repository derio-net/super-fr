    text: |
      Run `cd <worktree> && uv run ruff format packages/ tests/` then `uv run ruff check packages/ tests/` — EXPECT clean.
  - id: P3.T2.S2
    text: |
      Run `cd <worktree> && uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src` — EXPECT clean.
  - id: P3.T2.S3
    text: |
      Run `cd <worktree> && uv run pytest -q --no-cov` — EXPECT full suite green (drift guard + smoke included).
