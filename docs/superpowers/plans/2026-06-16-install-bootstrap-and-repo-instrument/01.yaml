tasks:
- number: 1
  title: Manifest model + loader (TDD)
  steps:
  - id: P1.T1.S1
    text: |
      RED: create tests/unit/test_repos_module.py. Test load_manifest(path): parses a `repos:` list with plain string entries ("owner/repo") and mapping entries ({repo: owner/name, path: /abs}); returns a list of RepoEntry(repo, path|None); a missing file returns []; a malformed file (top-level not a mapping / repos not a list) raises a clear error. Run `uv run pytest tests/unit/test_repos_module.py -q --no-cov` and confirm it fails with ImportError (no fr.repos yet).
  - id: P1.T1.S2
    text: |
      GREEN: create packages/fr/src/fr/repos.py with a frozen RepoEntry dataclass (repo: str, path: str | None) and load_manifest(path: Path) -> list[RepoEntry], using fr._yaml for parsing. Accept both string and mapping entries; ignore unknown mapping keys; missing file -> []. Rerun the test file; all pass.
- number: 2
  title: Checkout resolver (TDD)
  steps:
  - id: P1.T2.S1
    text: |
      RED: add tests for checkout_root(entry, *, repos_dir=None). entry.path set -> Path(entry.path). Else $FR_REPOS_DIR/<name> when set; else ~/repos/<name>. name = repo.split('/')[-1]. Use monkeypatch for env + home. Confirm failure (function absent).
  - id: P1.T2.S2
    text: |
      GREEN: implement checkout_root in fr/repos.py matching the fr_dispatch._repo_checkout_root convention (FR_REPOS_DIR / $HOME/repos). Rerun; pass.
- number: 3
  title: plan-config template renderer (TDD)
  steps:
  - id: P1.T3.S1
    text: |
      RED: add a test for render_plan_config(owner, repo) -> str. Assert the returned text contains the live validator profile (plan.filename, header.required with Spec+Status, status_values) and a commented, documentation-only dispatch block with owner/<owner>/<repo> substituted; assert the non-commented portion parses as YAML via fr._yaml. Confirm failure.
  - id: P1.T3.S2
    text: |
      GREEN: implement render_plan_config per the spec's template section (live validator keys + commented optional dispatch stub). Rerun; pass.
- number: 4
  title: Manifest append (TDD)
  steps:
  - id: P1.T4.S1
    text: |
      RED: add tests for append_to_manifest(path, repo): creates the file and parent dirs if missing; appends a string entry; is idempotent (no duplicate when repo already present, whether as string or mapping); preserves existing entries. Confirm failure.
  - id: P1.T4.S2
    text: |
      GREEN: implement append_to_manifest in fr/repos.py. Rerun; pass.
- number: 5
  title: REFACTOR + quality gate
  steps:
  - id: P1.T5.S1
    text: |
      Run `uv run ruff format packages/ tests/`, `uv run ruff check packages/ tests/`, and `uv run mypy packages/fr/src`. Fix findings. Rerun tests/unit/test_repos_module.py green.
