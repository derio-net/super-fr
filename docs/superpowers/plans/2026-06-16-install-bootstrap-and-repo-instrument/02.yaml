- number: 1
  title: Command behavior tests (RED)
  steps:
  - id: P2.T1.S1
    text: |
      RED: create tests/unit/test_repos_cmd.py using typer.testing.CliRunner against the fr app, with tmp_path checkouts and FR_REPOS_DIR monkeypatched. Cases: (a) dry-run by default writes nothing and prints "DRY-RUN (would write)"; (b) --yes writes docs/superpowers/plan-config.yaml with template content; (c) a repo whose checkout dir is missing prints "WARN (missing)" and the command still exits 0; (d) an existing plan-config.yaml is left untouched and reported "SKIP (exists)"; (e) --force overwrites it; (f) collection is the union of --manifest entries and positional args (deduped); (g) a positional arg is appended to the manifest, and --no-save suppresses that. Confirm failure (no `repos` command yet).
- number: 2
