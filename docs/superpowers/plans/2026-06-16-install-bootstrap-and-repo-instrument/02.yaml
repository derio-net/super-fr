  steps:
  - id: P2.T2.S1
    text: |
      GREEN: create packages/fr/src/fr/commands/repos_cmd.py with a typer group `repos_app` exposing `sync(repos: list[str], manifest: Path|None, yes: bool, force: bool, no_save: bool)`. Resolve collection = manifest ∪ args via fr.repos; for each, resolve checkout_root; missing -> WARN; else write/skip/force the template (dry-run unless --yes). Append args to manifest unless --no-save. Exit 0 on warnings; exit 2 when no repos resolve.
  - id: P2.T2.S2
    text: |
      Register in packages/fr/src/fr/cli.py: `from fr.commands.repos_cmd import repos_app` and `app.add_typer(repos_app, name="repos")` (mirror init_app).
  - id: P2.T2.S3
    text: |
      Rerun tests/unit/test_repos_cmd.py; all pass. Smoke: `fr repos sync --help` renders.
- number: 3
