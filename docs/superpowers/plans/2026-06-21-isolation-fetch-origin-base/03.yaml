- number: 1
  title: Document the new default and escape hatches in the skills
  steps:
  - id: P3.T1.S1
    text: |
      In plugins/super-fr/skills/fr-isolation/SKILL.md, document the cold-start default (a NEW branch is cut from freshly-fetched `origin/<default>`) and the `--base <ref>` / `--no-fetch` escape hatches plus the offline auto-fallback. Keep the file under the 120-line cap (test-enforced) — compress neighboring prose if needed.
  - id: P3.T1.S2
    text: |
      In plugins/super-fr/skills/fr-debugging/SKILL.md cold-start block, note a standalone fix now cuts from freshly-fetched `origin/<default>`; to debug on the current branch intentionally, use `--base HEAD`. Leave the reuse-path wording unchanged (it never rebases). Respect the 120-line cap.
  - id: P3.T1.S3
    text: |
      In plugins/super-fr/skills/fr-brainstorming/SKILL.md, add a one-line note to the `fr isolation up` invocation that new branches base on `origin/<default>` by default. Respect the 120-line cap. Do NOT touch fr-goal's SKILL.md unless a line genuinely must change (it is at its 120-line budget and the new default is transparent to its flow).
- number: 2
  title: Version bump and full CI gate
  steps:
  - id: P3.T2.S1
    text: |
      Run `cd <worktree> && scripts/bump-version.py patch` (3.4.1 → 3.4.2). Confirm it updates the three sources + uv.lock and that `uv run fr --version` reports 3.4.2.
  - id: P3.T2.S2
    text: |
      Run the full CI gate locally: `uv run ruff format --check packages/ tests/`, `uv run ruff check packages/ tests/`, `uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src`, `uv run pytest -q --no-cov`, `scripts/bump-version.py --check`. All must pass (exit 0). Fix anything red.
