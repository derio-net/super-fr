tasks:
- number: 1
  title: fr acceptance status (terminal nag)
  steps:
  - id: P4.T1.S1
    text: |-
      RED: tests: `fr acceptance status` on a matrix with mixed statuses
      prints counts by status and one line per open skipped/
      not-implemented row (id, status, acceptance, notes) in matrix
      order (append order = oldest first); `--brief` prints the counts
      line + at most the 3 oldest open rows; exit 0 always (read-only,
      allowlist-safe like fr status); zero open rows → "no acceptance
      debt". Run → red.
  - id: P4.T1.S2
    text: |-
      GREEN: status verb in acceptance_cmd.py reusing load_matrix +
      a shared open_rows(matrix) helper in check.py. Tests pass.
- number: 2
  title: fr acceptance add (schema-safe append)
  steps:
  - id: P4.T2.S1
    text: |-
      RED: tests: (a) `fr acceptance add --id x --capability C
      --acceptance "..." --origin fr:docs/... --level unit=fr:tests/...
      --status not-implemented --notes n` appends a row; reloaded matrix
      has it; the header comment block above `rows:` is byte-identical
      after the append (textual append, not load→dump); (b) bad status /
      bad level key / duplicate id → exit 2, file unchanged; (c)
      repeated --level flags accumulate; --origin repeatable. Run → red.
  - id: P4.T2.S2
    text: |-
      GREEN: add verb builds the Row via pydantic (validation up front),
      renders a YAML block with our canonical two-space style, appends
      to matrix.yaml, re-runs load_matrix as a post-write invariant and
      restores the original text on failure. Tests pass.
- number: 3
  title: check --added-since <ref>
  steps:
  - id: P4.T3.S1
    text: |-
      RED: tests in a tmp git repo with commits: base commit has matrix
      with row a; HEAD adds rows b, c. `fr acceptance check
      --added-since <base-sha>` prints exactly b and c (id + acceptance
      one-liner) and exits per the normal check contract; base ref
      without a matrix file → all current rows listed as added; bad ref
      → exit 1 with a git error message. Run → red.
  - id: P4.T3.S2
    text: |-
      GREEN: added_since(ref, matrix_path, root) via `git show
      <ref>:<relpath>` (subprocess, cwd=root), yaml-load the old text
      (tolerate absence), diff id sets, print "added since <ref>:"
      section after the normal check output. Tests pass.
- number: 4
  title: fr acceptance digest (issue-body markdown)
  steps:
  - id: P4.T4.S1
    text: |-
      RED: tests: `fr acceptance digest` prints a markdown document:
      H2 "Acceptance debt", a table (id | status | acceptance | notes)
      of open skipped/not-implemented rows oldest-first, a trailing
      idempotence marker line `<!-- fr-acceptance-digest -->`, and a
      "generated by fr acceptance digest" footer; zero debt → prints the
      marker + "No open acceptance debt." (the workflow uses this to
      close the issue); exit 0 either way. Run → red.
  - id: P4.T4.S2
    text: |-
      GREEN: digest verb reusing open_rows(). Tests pass.
  - id: P4.T4.S3
    text: |-
      REFACTOR (optional): consolidate verb bodies' repo-root/matrix
      resolution into one _load(ctx) helper in acceptance_cmd.py; ruff +
      mypy clean. Stay green.
