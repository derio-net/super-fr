      references `fr acceptance backfill` and `fr acceptance check`,
      and carries the calibration line "when in doubt between ci and
      skipped, choose skipped"; test_cli/skills: `fr skills` output
      includes fr-acceptance. Run → red.
  - id: P7.T2.S2
    text: |-
      GREEN: write plugins/super-fr/skills/fr-acceptance/SKILL.md (≤120
      lines): frontmatter (name, description with backfill/matrix/
      acceptance-debt triggers), the backfill drive protocol (§7):
      inventory → draft rows via `fr acceptance add` → honest statuses →
      check → review PR; status-flip guidance for fr-execute handoffs;
      mid-flight addition etiquette (decision 6). Add SKILLS entry in
      skills_cmd.py. Tests pass.
- number: 3
  title: Pipeline skill edits (brainstorm/plan/execute/goal/progress)
  steps:
  - id: P7.T3.S1
    text: |-
      RED: content assertions in test_skill_validation.py:
      fr-brainstorming mentions `fr acceptance add` and "defense";
      fr-plan mentions `acceptance:` phase linkage; fr-execute mentions
      flipping statuses at phase completion; fr-goal mentions
      "acceptance debt" and `--added-since`; fr-progress mentions
      `fr acceptance status`. All five must stay ≤120 lines
      (test_under_120_lines already enforces). Run → red.
  - id: P7.T3.S2
    text: |-
      GREEN: edit the five SKILL.md files per spec §5: fr-brainstorming
      — draft rows born with the spec, closing presentation with per-row
      one-line defenses (decision 5); fr-plan — phases carry acceptance:
      ids, self-review enforces, planning may ADD rows (decision 6);
      fr-execute — completing a phase flips linked rows with test refs,
      unflipped rows called out in the completion note, may ADD rows;
      fr-goal — close-out runs fr acceptance status, PR body carries
      remaining debt + "rows added since brainstorm" via --added-since;
      fr-progress — acceptance section. fr-goal (120/120) and
      fr-execute (119/120): compress existing prose to fit (tighten the
      step-1/step-6 wording; no content loss). Tests pass incl. line
      caps.
  - id: P7.T3.S3
    text: |-
      REFACTOR (optional): re-read the five diffs for voice consistency
      with each skill's register; shellcheck fr-acceptance-nag.sh. Stay
      green.
