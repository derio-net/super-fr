tasks:
- number: 1
  title: JournalEntry model + kind/scope enums
  steps:
  - id: P1.T1.S1
    text: |
      RED. Create tests/unit/test_journal_model.py. Assert a
      `fr.journal.model.JournalEntry` (pydantic, frozen, extra=forbid):
      accepts kind in {decision, review, discovery, finding, repro,
      hypothesis, ruled-out, root-cause} and rejects "bogus";
      accepts scope in {spec, plan, debug}; requires `state` in
      {fixed, refuted, open} ONLY when kind == "finding" and forbids it
      otherwise; fields: kind, scope, id (str), created (str ISO),
      phase (int|None), title (str), body (str), state (str|None).
      Run: uv run pytest tests/unit/test_journal_model.py -q --no-cov
      → fails (module missing).
  - id: P1.T1.S2
    text: |
      GREEN. Create packages/fr/src/fr/journal/__init__.py and
      packages/fr/src/fr/journal/model.py defining JournalKind,
      JournalScope (Literal sets) and JournalEntry with the validators
      from S1 (model_validator enforces finding⇔state). Mirror the
      frozen/extra=forbid config style of fr/types.py. Re-run the test
      → passes.
- number: 2
  title: Scope→path resolution
  steps:
  - id: P1.T2.S1
    text: |
      RED. In test_journal_model.py add cases for
      `journal_path(repo_root, scope, slug)`:
      returns docs/superpowers/journals/<slug>.md for every scope; and
      `archived_journal_path` returns
      docs/superpowers/implemented/journals/<slug>.md. Run → fails.
  - id: P1.T2.S2
    text: |
      GREEN. Add journal_path / archived_journal_path to
      fr/journal/model.py (JOURNALS_REL = Path("docs/superpowers/journals")).
      Re-run → passes.
- number: 3
  title: Serialize + parse round-trip (append-only, machine+human)
  steps:
  - id: P1.T3.S1
    text: |
      RED. Add tests: `serialize_entry(e)` yields a markdown block with a
      parseable header (kind/scope/id/created/phase/state) + a body;
      `parse_journal(text)` returns the entries in file order;
      round-trip serialize→parse→deep-equal for one entry AND for three
      appended entries (order preserved); a corrupted block raises
      `JournalParseError`. Run → fails.
  - id: P1.T3.S2
    text: |
      GREEN. Implement serialize_entry / parse_journal / JournalParseError
      in fr/journal/model.py. Use an HTML-comment fenced delimiter per
      entry (e.g. `<!-- fr:journal id=... -->`) so the file renders as
      plain Markdown yet parses deterministically. Re-run → passes.
  - id: P1.T3.S3
    text: |
      REFACTOR (optional). Extract the delimiter constants + a
      _split_blocks helper if S2 duplicated parsing logic; stay green
      (uv run pytest tests/unit/test_journal_model.py -q --no-cov).
