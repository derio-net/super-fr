      START/END markers into .hermes/SOUL.d/super-fr-rules.md; find_rules_drift(); wire
      into main() and --check. Do NOT include .claude/rules/acceptance-matrix.md.
  - id: P2.T1.S4
    text: |
      Run `cd <worktree> && uv run python scripts/sync-hermes.py` then
      `uv run pytest tests/unit/test_tripwire_hermes_rules_sync.py -q --no-cov`.
      EXPECT GREEN — 3-rule block materialised, zero drift.
