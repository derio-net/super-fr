schema_version: 2
phase:
  number: 4
  title: Acceptance rows, version bump, and full-suite verification
  tag: agentic
  depends_on:
  - 1
  - 2
  - 3
  tracking_issue: null
  acceptance:
  - phase-executor-worktree-refused
  - phase-executor-correct-dispatch-allowed
  - phase-executor-allowlist-message-repaired
  - pipeline-guard-second-repo-reachable
  - pipeline-guard-base-repo-still-denied
tasks:
- number: 1
  title: Acceptance matrix
  steps:
  - id: P4.T1.S1
    text: |-
      fr acceptance add one row per spec Test Plan claim cluster (poisoned dispatch refused; correct dispatch still allowed; org-hook message repaired; second repo reachable; base repo still guarded), each with --origin and --level refs to the tests written above.
  - id: P4.T1.S2
    text: |-
      Run uv run fr acceptance check and uv run fr acceptance report --deterministic; commit all three regenerated reports.
- number: 2
  title: Version bump and gate
  steps:
  - id: P4.T2.S1
    text: |-
      uv run --no-project python scripts/bump-version.py minor (spec decision 4), committing the changed manifests plus uv.lock.
  - id: P4.T2.S2
    text: |-
      uv run ruff format packages/ tests/ && uv run ruff check packages/ tests/ && uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src.
  - id: P4.T2.S3
    text: |-
      uv run pytest -q --no-cov (full suite) and record the summary for the PR body.
