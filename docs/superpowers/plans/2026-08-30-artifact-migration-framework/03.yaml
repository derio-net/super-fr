tasks:
- number: 1
  title: RED → GREEN — detection and context
  steps:
  - id: P3.T1.S1
    text: |-
      RED: create tests/unit/test_migration_trigger.py. Assert: a callback runs
      before any fr command; with stale artifacts in an INTERACTIVE context it
      migrates and the invoked command still runs; in a NON-INTERACTIVE context
      (CI env set, or no TTY) it refuses, exits non-zero, and names the command
      to run — and does NOT migrate or commit. Exemptions do not trigger at all:
      `--version`, `--help`, `fr migrate` itself (it cannot require itself), and
      FR_SKIP_MIGRATION=1. Assert the exemption list is exactly those.
      Run: uv run pytest tests/unit/test_migration_trigger.py -q --no-cov
      Expected: failures.
  - id: P3.T1.S2
    text: |-
      GREEN: implement the callback on the Typer app in fr/cli.py plus context
      detection. Keep the detection cheap: it runs before EVERY command, so it
      must not walk the whole tree when nothing is stale — read stamps lazily
      and bail on the first current-everything answer.
      Run: uv run pytest tests/unit/test_migration_trigger.py -q --no-cov
      Expected: passed.
