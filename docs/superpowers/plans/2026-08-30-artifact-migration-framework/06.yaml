- number: 1
  title: RED → GREEN — cursor inference
  steps:
  - id: P6.T1.S1
    text: |-
      RED: create tests/unit/test_run_adopt.py covering the inference table in
      spec §3.E: spec only → cursor `plan`; plan with no phase complete →
      `implement`; some phases complete → `implement` with per-phase state
      recorded; all phases complete, no PR → `review`; PR open → `deliver`.
      Assert the adopted run records emitted spec and plan paths, so
      archival-by-emitted.plan (2026-08-14 spec §4.B) keys correctly afterwards
      — adopt a plan whose slug does NOT resemble its run id, or the assertion
      proves nothing.
      Run: uv run pytest tests/unit/test_run_adopt.py -q --no-cov
      Expected: failures.
  - id: P6.T1.S2
    text: |-
      GREEN: implement `fr run adopt <plan-dir> [--branch <b>]`. Reuse the
      existing run model and cursor logic; do not fork a second way to write a
      run file.
      Run: uv run pytest tests/unit -k "run_adopt or run_cli or run_state" -q --no-cov
      Expected: passed.
- number: 2
  title: RED → GREEN — the migration offers adoption
  steps:
  - id: P6.T2.S1
    text: |-
      RED → GREEN: the interactive migration path reports in-flight plans with
      no run and adopts them; a plan whose work is COMPLETE gets no run (a
      cursor over finished work is noise — spec §3.E). Assert both directions.
      Run: uv run pytest tests/unit -k "run_adopt or migration_trigger" -q --no-cov
      Expected: passed.
