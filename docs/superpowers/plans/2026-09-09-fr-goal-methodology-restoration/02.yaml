  - id: P2.T2.S2
    text: |-
      GREEN: implement the justification check in packages/fr/src/fr/plan_ops.py; re-run — green.
  - id: P2.T2.S3
    text: |-
      Refactor or record `no-refactor-because:` in the plan journal; full suite stays green.
- number: 3
  title: Skill prose plus token tripwires
  steps:
  - id: P2.T3.S1
    text: |-
      RED: extend tests/unit/test_fr_goal_journal.py (or a new test_skill_tokens.py) with substring guards for the nested loop, the Phase-1 skeleton mandate, and the `no-refactor-because` + `red → green → refactor` tokens across plugins/super-fr/skills/fr-goal/SKILL.md, plugins/super-fr/skills/fr-plan/SKILL.md, plugins/super-fr/skills/fr-execute/SKILL.md, and plugins/super-fr/agents/fr-phase-executor.md; run and confirm failure.
  - id: P2.T3.S2
    text: |-
      GREEN: update the four prose files (fr-goal §§3–6 narrate the nested loop + skeleton; fr-plan gains skeleton + 4–6-phase granularity guidance; fr-execute + fr-phase-executor gain refactor-or-justify); re-run — green.
  - id: P2.T3.S3
    text: |-
      Tick steps and complete the phase via `fr plan edit`; refactor or record `no-refactor-because:` in the plan journal; full suite green.
