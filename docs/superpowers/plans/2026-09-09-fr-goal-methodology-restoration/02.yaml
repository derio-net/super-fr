      GREEN: implement the skeleton rule in packages/fr/src/fr/plan_ops.py with a named error and the override path (override = spec-scope decision logged via `fr journal add`); re-run — green.
  - id: P2.T1.S3
    text: |-
      Refactor or record `no-refactor-because:` in the plan journal; full suite stays green.
- number: 2
  title: Refactor-or-justify justification gate
  steps:
