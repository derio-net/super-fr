  steps:
  - id: P2.T1.S1
    text: |-
      RED: in tests/unit/test_v2_plan_ops.py add tests that self-review refuses a plan whose first agentic phase is not the walking skeleton (no CI smoke / minimum-runtime exercise / real-system capture marker) and passes one carrying an explicit operator-override decision; run and confirm failure.
