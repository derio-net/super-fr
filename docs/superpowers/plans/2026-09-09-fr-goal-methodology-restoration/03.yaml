  - id: P3.T1.S3
    text: |-
      Refactor or record `no-refactor-because:` in the plan journal; full suite stays green.
- number: 2
  title: fr journal handoff CLI verb
  steps:
  - id: P3.T2.S1
    text: |-
      RED: in tests/unit/test_journal_cmd.py add tests for `fr journal handoff --scope plan --slug <s> --phase N` covering the collapse output and fail-open on a missing journal (empty handoff, exit 0, like render); run and confirm failure.
  - id: P3.T2.S2
    text: |-
      GREEN: implement the `handoff` command in packages/fr/src/fr/commands/journal_cmd.py on top of the model rule; re-run — green.
  - id: P3.T2.S3
    text: |-
      Refactor or record `no-refactor-because:` in the plan journal; full suite stays green.
- number: 3
  title: Rewire the executor brief to the handoff
  steps:
  - id: P3.T3.S1
    text: |-
      RED: extend the skill token tests with guards that fr-goal §5 and fr-phase-executor.md name `fr journal handoff` as the brief source and reserve raw `fr journal render` for the executor-STOP path; run and confirm failure.
  - id: P3.T3.S2
    text: |-
      GREEN: update plugins/super-fr/skills/fr-goal/SKILL.md §5 and plugins/super-fr/agents/fr-phase-executor.md inputs (handoff completeness is the contract: missing anything → STOP, do not guess); re-run — green.
  - id: P3.T3.S3
    text: |-
      Tick steps and complete the phase via `fr plan edit`; refactor or record `no-refactor-because:` in the plan journal; full suite green.
