- number: 1
  title: Dependency-scoped collapse rule
  steps:
  - id: P3.T1.S1
    text: |-
      RED: in tests/unit/test_journal_model.py (or a new test_journal_handoff.py) add tests on a synthetic journal: open findings + dependency-tagged decisions/discoveries render in full, fixed/refuted findings from non-dependency phases collapse to one line each, and a raw-render pointer is always present; run and confirm failure.
  - id: P3.T1.S2
