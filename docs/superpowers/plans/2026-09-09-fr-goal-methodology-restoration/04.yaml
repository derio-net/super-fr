tasks:
- number: 1
  title: Per-phase accounting fields on the run record
  steps:
  - id: P4.T1.S1
    text: |-
      RED: in tests/unit/test_run_state.py add tests that the run record stores per-phase journal entries/lines at dispatch, spec + plan bytes, files touched from the executor return, and handoff section sizes — all additive with defaults so old runs still parse; run and confirm failure.
  - id: P4.T1.S2
    text: |-
      GREEN: implement the additive fields in packages/fr/src/fr/run/model.py; re-run — green.
  - id: P4.T1.S3
    text: |-
      Refactor or record `no-refactor-because:` in the plan journal; full suite stays green.
- number: 2
  title: Per-phase cost table in fr run status
  steps:
  - id: P4.T2.S1
    text: |-
      RED: in tests/unit/test_run_cli.py add tests that `fr run status` prints a per-phase accounting table plus a running total, with estimates clearly labeled (no harness token API); run and confirm failure.
  - id: P4.T2.S2
    text: |-
      GREEN: implement the table in packages/fr/src/fr/commands/run_cmd.py; re-run — green.
  - id: P4.T2.S3
    text: |-
      Refactor or record `no-refactor-because:` in the plan journal; full suite stays green.
- number: 3
  title: Granularity guidance with live numbers
  steps:
  - id: P4.T3.S1
    text: |-
      RED: extend the skill token tests to require the "prefer 4–6 phases; every additional phase re-reads the accumulated handoff" guidance in plugins/super-fr/skills/fr-plan/SKILL.md alongside a pointer to `fr run status` accounting; run and confirm failure.
  - id: P4.T3.S2
    text: |-
      GREEN: add the guidance prose to fr-plan; re-run — green, then verify `fr plan self-review <plan-dir>` passes on this plan.
  - id: P4.T3.S3
    text: |-
      Tick steps and complete the phase via `fr plan edit`; refactor or record `no-refactor-because:` in the plan journal; full suite green.
