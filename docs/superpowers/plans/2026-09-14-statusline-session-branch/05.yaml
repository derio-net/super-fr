tasks:
- number: 1
  title: Operator rollout (post-merge)
  steps:
  - id: P5.T1.S1
    text: |
      After merge: update the super-fr plugin so
      `~/.claude/plugins/cache/derio-net--super-fr/super-fr/current/scripts/`
      contains the v2 segment and `fr-statusline-claude.sh`. Then either
      point `statusLine.command` at `fr-statusline-claude.sh`, or rewire
      `~/.claude/statusline.sh`: replace its segment block and lines 2–3 with
      `rows=$(printf '%s' "$data" | bash "$segment" --format ansi)`, line 2 =
      row 1 + SEP + cwd, line 3 = row 2 (drop the `iso_line` / `wt_line`
      handling and the stale dev-checkout fallback path).
  - id: P5.T1.S2
    text: |
      Look at the footer in (a) a session bound to an fr workspace — green
      `branch: <feat>` and `worktree: <full path>`; (b) a plain base-clone
      session — purple `branch: main` and `no fr-isolation`; (c) a session in
      a non-repo directory — purple `no branch` / `no fr-isolation`.
