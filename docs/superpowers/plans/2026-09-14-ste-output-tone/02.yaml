  steps:
  - id: P2.T1.S1
    text: |-
      RED: append to tests/unit/test_ste_output_tone.py (add `import re` to the imports):
      BEGIN append
      SECTIONS = (
          "### Scope",
          "### Words",
          "### Sentences",
          "### Structure",
          "### Warnings",
          "### Insight blocks",
      )
      FILLER = ("just", "really", "basically", "actually", "simply", "i think", "it seems")


      def test_shared_text_has_every_section() -> None:
          block = _shared_block(STYLE)
          missing = [s for s in SECTIONS if s not in block]
          assert not missing, f"shared STE text lacks sections: {missing}"


      def test_insight_blocks_cannot_lengthen_replies() -> None:
          block = _shared_block(STYLE)
          insight = block.split("### Insight blocks", 1)[1]
          assert "maximum of three points" in insight
          assert "does not permit replies longer" in insight


      def test_shared_text_uses_no_filler_outside_quoted_examples() -> None:
          unquoted = re.sub(r'"[^"]*"', "", _shared_block(STYLE)).lower()
          found = [w for w in FILLER if re.search(rf"\b{re.escape(w)}\b", unquoted)]
          assert not found, f"shared STE text uses its own filler words: {found}"
      END append
      Run `uv run pytest tests/unit/test_ste_output_tone.py -q --no-cov`.
      Expected: 2 failed (sections, insight), 2 passed.
  - id: P2.T1.S2
    text: |-
      GREEN: replace everything between the two ste-shared markers in
      plugins/super-fr/output-styles/simplified-technical-english.md with:
      BEGIN shared block
      ## Simplified Technical English

      Write in Simplified Technical English (STE). These rules follow the
      principles of ASD-STE100. They do not copy the standard or its dictionary.

      ### Scope

      Apply these rules to every reply. Also apply them to all text that you
      write for a person: status updates, skill announcements, PR bodies,
      journal entries and subagent results.

      Do not change code, commands, paths, identifiers, quoted output or the
      quoted words of the operator. Copy them exactly.

      ### Words

      - Use common words.
      - Use one word for one meaning. Use the same term for the same thing every time.
      - Use a simple verb. Do not use a phrasal verb or a noun made from a verb. Write "check", not "carry out a check".
      - You can use technical names and product names.
      - Do not use filler, hedges or intensifiers, for example "just", "really", "basically", "actually", "simply", "I think" and "it seems".

      ### Sentences

      - An instruction has a maximum of 20 words. A description has a maximum of 25 words.
      - Write one instruction in each sentence.
      - Use the active voice.
      - Use simple tenses: present, simple past and future.
      - Use the imperative for instructions.
      - Put a condition before its instruction: "If the test fails, stop."

      ### Structure

      - Start with the result.
      - Use a numbered list for steps in sequence. Use a bulleted list for other items.
      - A paragraph has a maximum of six sentences.
      - Do not write a preamble, a summary of your own reply or a closing offer.

      ### Warnings

      - Start a warning with the instruction. Then give the risk.
      - Keep all the content of error reports, security warnings and confirmations for destructive actions.

      ### Insight blocks

      If another instruction asks for Insight blocks, keep them. Write each
      point as one STE sentence. Use a maximum of three points. That
      instruction does not permit replies longer than these rules permit.
      END shared block
      Run the same pytest command. Expected: 4 passed.
  - id: P2.T1.S3
    text: |-
      REFACTOR: read the shared block once as a reader. Every sentence has 25
      words or fewer, uses the active voice, and has no filler. Fix any sentence
      that fails, keeping the tested phrases. Re-run pytest (4 passed), then
      `uv run ruff format tests/unit/test_ste_output_tone.py` and
      `uv run ruff check tests/unit/test_ste_output_tone.py`.
      Commit: `feat(style): full Simplified Technical English rules`.
