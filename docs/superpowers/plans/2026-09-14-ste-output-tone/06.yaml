- number: 2
  title: The filler list matches the STE style text
  steps:
  - id: P6.T2.S1
    text: |-
      RED: append to tests/unit/test_prose_lint.py (add `import re` and
      `from pathlib import Path` to the imports, and add FILLER_WORDS to the
      fr.prose_lint import):
      BEGIN append
      STYLE = (
          Path(__file__).resolve().parents[2]
          / "plugins/super-fr/output-styles/simplified-technical-english.md"
      )


      def test_filler_words_match_the_ste_style_list() -> None:
          """The lint and the opt-in style name the same filler words (spec §5.C)."""
          text = " ".join(STYLE.read_text().split())
          bullet = text.split("Do not use filler", 1)[1].split(" - ", 1)[0]
          quoted = [w.lower() for w in re.findall(r'"([^"]+)"', bullet)]
          assert quoted == [w.lower() for w in FILLER_WORDS]


      def test_the_filler_tripwire_can_fail(monkeypatch) -> None:
          import fr.prose_lint as lint

          monkeypatch.setattr(lint, "FILLER_WORDS", ("just",))
          text = " ".join(STYLE.read_text().split())
          bullet = text.split("Do not use filler", 1)[1].split(" - ", 1)[0]
          quoted = [w.lower() for w in re.findall(r'"([^"]+)"', bullet)]
          assert quoted != [w.lower() for w in lint.FILLER_WORDS]
      END append
      Temporarily delete "simply" from FILLER_WORDS in the module, run
      `uv run pytest tests/unit/test_prose_lint.py -q --no-cov`, and confirm
      test_filler_words_match_the_ste_style_list fails.
  - id: P6.T2.S2
    text: |-
      GREEN: restore "simply" in FILLER_WORDS. Run the same pytest command.
      Expected: all pass.
  - id: P6.T2.S3
    text: |-
