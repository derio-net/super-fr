- number: 1
  title: lint_prose finds long sentences and filler words in prose only
  steps:
  - id: P6.T1.S1
    text: |-
      RED: create tests/unit/test_prose_lint.py:
      BEGIN tests/unit/test_prose_lint.py
      """Spec 2026-09-14-ste-output-tone §5.C: warn-only prose lint for fr artifacts."""

      from __future__ import annotations

      import pytest
      from fr.prose_lint import MAX_SENTENCE_WORDS, lint_prose

      LONG = " ".join(["word"] * 30) + "."


      def _sentence(n: int) -> str:
          return " ".join(["word"] * n) + "."


      def test_the_limit_is_25_words() -> None:
          assert MAX_SENTENCE_WORDS == 25


      def test_a_25_word_sentence_passes() -> None:
          assert lint_prose(_sentence(25)) == []


      def test_a_26_word_sentence_warns() -> None:
          issues = lint_prose(_sentence(26))
          assert [(i.kind, i.words) for i in issues] == [("long-sentence", 26)]


      def test_sentences_are_counted_separately() -> None:
          assert lint_prose(_sentence(20) + " " + _sentence(20)) == []


      def test_list_items_are_counted_separately() -> None:
          words = " ".join(["word"] * 20)
          assert lint_prose(f"- {words}\n- {words}") == []


      @pytest.mark.parametrize(
          "text",
          [
              "```\n" + LONG + "\n```",
              "BEGIN tests/x.py\n" + LONG + "\nEND tests/x.py",
              "`" + LONG + "`",
              '"' + LONG + '"',
              "<!-- " + LONG + " -->",
              "## " + LONG,
              "| " + LONG + " |",
              "---\ntitle: " + LONG + "\n---\n",
          ],
          ids=["fence", "embed", "inline-code", "quoted", "comment", "heading", "table", "front-matter"],
      )
      def test_non_prose_is_not_counted(text: str) -> None:
          assert lint_prose(text) == []


      def test_a_url_does_not_count_as_words() -> None:
          text = " ".join(["word"] * 24) + " https://example.com/one-two/three-four/five."
          assert lint_prose(text) == []


      def test_a_filler_word_warns() -> None:
          issues = lint_prose("This is just a test.")
          assert [(i.kind, i.excerpt) for i in issues] == [("filler", "just")]


      def test_a_quoted_filler_word_is_ignored() -> None:
          assert lint_prose('Do not write "just".') == []


      def test_filler_matches_whole_words_only() -> None:
          assert lint_prose("Adjust the value.") == []


      def test_a_two_word_filler_matches_across_a_line_break() -> None:
          issues = lint_prose("I\nthink it works.")
          assert [i.excerpt for i in issues] == ["I think"]
      END tests/unit/test_prose_lint.py
      Run `uv run pytest tests/unit/test_prose_lint.py -q --no-cov`.
      Expected: collection error (ModuleNotFoundError: fr.prose_lint).
  - id: P6.T1.S2
    text: |-
      GREEN: create packages/fr/src/fr/prose_lint.py:
      BEGIN packages/fr/src/fr/prose_lint.py
      """Warn-only prose lint for text that fr writes.

      Spec: docs/superpowers/specs/2026-09-14-ste-output-tone-design.md §5.C.
      Two checks: sentences over MAX_SENTENCE_WORDS words, and filler words.
      The 20-word limit for instructions is not checked: code cannot tell an
      instruction from a description. Callers print the issues; nothing here
      decides an exit code.
      """

      from __future__ import annotations

      import re
      from dataclasses import dataclass
      from typing import Literal

      MAX_SENTENCE_WORDS = 25
      FILLER_WORDS: tuple[str, ...] = (
          "just",
          "really",
          "basically",
          "actually",
          "simply",
          "I think",
          "it seems",
      )

      _FRONT_MATTER = re.compile(r"\A---\n.*?\n---\n", re.S)
      _FENCE = re.compile(r"^(```|~~~)[^\n]*\n.*?^\1[^\n]*$", re.S | re.M)
      _EMBED = re.compile(r"^[ \t]*BEGIN\b[^\n]*\n.*?^[ \t]*END\b[^\n]*$", re.S | re.M)
      _COMMENT = re.compile(r"<!--.*?-->", re.S)
      _INLINE_CODE = re.compile(r"`[^`\n]*`")
      _QUOTED = re.compile(r'"[^"\n]*"')
      _URL = re.compile(r"https?://\S+")
      _WORD = re.compile(r"[\w'-]+")
      _ITEM_SPLIT = re.compile(r"\n[ \t]*\n|\n(?=[ \t]*(?:[-*+]|\d+\.)[ \t])")
      _SENTENCE_SPLIT = re.compile(r"(?<=[.!?])\s+")
      _BULLET = re.compile(r"^(?:[-*+]|\d+\.)\s+")


      @dataclass(frozen=True)
      class ProseIssue:
          kind: Literal["long-sentence", "filler"]
          excerpt: str
          words: int | None = None

          def __str__(self) -> str:
              if self.kind == "long-sentence":
                  return f"sentence of {self.words} words (max {MAX_SENTENCE_WORDS}): {self.excerpt}"
              return f"filler word {self.excerpt!r}"


      def _prose_only(text: str) -> str:
          """Drop everything that is not prose: code, embeds, quotes, tables, headings."""
          text = _FRONT_MATTER.sub("", text)
          for pattern in (_FENCE, _EMBED, _COMMENT):
              text = pattern.sub("", text)
          lines = [line for line in text.splitlines() if not line.lstrip().startswith(("#", "|"))]
          text = "\n".join(lines)
          for pattern in (_INLINE_CODE, _QUOTED, _URL):
              text = pattern.sub("", text)
          return text


      def _excerpt(sentence: str, limit: int = 80) -> str:
          flat = " ".join(sentence.split())
          return flat if len(flat) <= limit else flat[: limit - 1] + "…"


      def lint_prose(text: str) -> list[ProseIssue]:
          """Long sentences, then filler words, in the order they are found."""
          prose = _prose_only(text)
          issues: list[ProseIssue] = []
          for item in _ITEM_SPLIT.split(prose):
              flat = _BULLET.sub("", " ".join(item.split()))
              for sentence in _SENTENCE_SPLIT.split(flat):
                  count = len(_WORD.findall(sentence))
                  if count > MAX_SENTENCE_WORDS:
                      issues.append(ProseIssue("long-sentence", _excerpt(sentence), count))
          flat_prose = " ".join(prose.split()).lower()
          for word in FILLER_WORDS:
              if re.search(rf"\b{re.escape(word.lower())}\b", flat_prose):
                  issues.append(ProseIssue("filler", word))
          return issues
      END packages/fr/src/fr/prose_lint.py
      Run the same pytest command. Expected: all pass. If a case fails, fix the
      module, not the test, and journal a discovery that names the case.
