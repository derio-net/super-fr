  - id: P7.T2.S1
    text: |-
      RED: create tests/unit/test_self_review_prose.py. Reuse _repo, _spec and
      _create_plan from tests/unit/test_plan_acceptance_links.py.
      BEGIN tests/unit/test_self_review_prose.py
      """Spec 2026-09-14-ste-output-tone §5.C: self-review warns on long prose."""

      from __future__ import annotations

      from pathlib import Path

      from fr.cli import app
      from fr.parser import parse as parse_plan
      from fr.plan_ops import self_review
      from typer.testing import CliRunner

      from tests.unit.test_plan_acceptance_links import _create_plan, _repo, _spec

      LONG = " ".join(["word"] * 30) + "."


      def _prose_warnings(plan_dir: Path) -> list[str]:
          issues = self_review(parse_plan(plan_dir))
          return [i.message for i in issues if i.severity == "warn" and i.message.startswith("prose lint")]


      def _plan(tmp_path: Path) -> Path:
          repo = _repo(tmp_path, matrix=False)
          _spec(repo, test_plan=False)
          return _create_plan(repo)


      def test_a_clean_plan_has_no_prose_warning(tmp_path: Path) -> None:
          assert _prose_warnings(_plan(tmp_path)) == []


      def test_a_pending_step_with_a_long_sentence_warns(tmp_path: Path) -> None:
          plan_dir = _plan(tmp_path)
          phase = plan_dir / "01.yaml"
          text = phase.read_text()
          first_text = text.index("text:")
          phase.write_text(text[:first_text] + f"text: {LONG}\n" + text[text.index("\n", first_text) + 1:])
          warnings = _prose_warnings(plan_dir)
          assert any("step P1.T1.S1" in w and "sentence of 30 words" in w for w in warnings), warnings


      def test_the_plan_prose_warns(tmp_path: Path) -> None:
          plan_dir = _plan(tmp_path)
          (plan_dir / "_prose.md").write_text(f"# Plan\n\n{LONG}\n")
          assert any("_prose.md" in w for w in _prose_warnings(plan_dir))


      def test_the_spec_warns(tmp_path: Path) -> None:
          plan_dir = _plan(tmp_path)
          spec = tmp_path / "docs/superpowers/specs/2026-07-04-toy.md"
          spec.write_text(spec.read_text() + f"\n{LONG}\n")
          assert any("spec " in w for w in _prose_warnings(plan_dir))


      def test_prose_warnings_do_not_change_the_exit_code(tmp_path: Path) -> None:
          """The fixture plan has a non-prose error (no skeleton marker), so compare
          against the clean plan's exit code instead of asserting 0."""
          plan_dir = _plan(tmp_path)
          runner = CliRunner()
          baseline = runner.invoke(app, ["plan", "self-review", str(plan_dir)])
          (plan_dir / "_prose.md").write_text(f"# Plan\n\n{LONG}\n")
          result = runner.invoke(app, ["plan", "self-review", str(plan_dir)])
          assert "prose lint" not in baseline.output
          assert "prose lint" in result.output
          assert result.exit_code == baseline.exit_code, result.output


      def test_markup_like_prose_does_not_crash_self_review(tmp_path: Path) -> None:
          """Rich reads '[/tmp]' as a closing tag and raises MarkupError, unless the
          CLI prints issues with markup off (phase 6 review, finding I6)."""
          plan_dir = _plan(tmp_path)
          (plan_dir / "_prose.md").write_text(f"# Plan\n\nSee [/tmp] and [the spec](x.md). {LONG}\n")
          result = CliRunner().invoke(app, ["plan", "self-review", str(plan_dir)])
          assert not isinstance(result.exception, Exception) or isinstance(result.exception, SystemExit), result.output
          assert "[/tmp]" in result.output
          assert "[warn]" in result.output
      END tests/unit/test_self_review_prose.py
      _create_plan writes the step as the single line `text: s`, so the file
      manipulation in test_a_pending_step_with_a_long_sentence_warns is valid.
      Run `uv run pytest tests/unit/test_self_review_prose.py -q --no-cov`.
      Expected: the clean-plan test passes; the other five fail.
  - id: P7.T2.S2
    text: |-
      GREEN: in packages/fr/src/fr/plan_ops.py, add this function after _workflow_issues:
      BEGIN _prose_issues
      def _prose_issues(plan: Plan) -> list[ReviewIssue]:
          """Warn-only prose lint (spec 2026-09-14-ste-output-tone §5.C).

          Pending step text, the plan prose and a same-repo spec. Ticked steps are
          exempt, like the manual-verb detector. One issue per source keeps a long
          document to one line.
          """
          from fr.prose_lint import lint_prose

          sources: list[tuple[str, str]] = []
          for phase in plan.phases:
              for task in phase.tasks:
                  for step in task.steps:
                      state = phase.state.steps.get(step.id)
                      if state is not None and state.state == "x":
                          continue
                      sources.append((f"step {step.id}", step.text))
          if plan.prose:
              sources.append(("_prose.md", plan.prose))
          spec_rel = plan.spec_path or plan.meta.spec
          if plan.repo_root is not None and spec_rel and not is_cross_repo_spec(spec_rel):
              spec_file = plan.repo_root / spec_rel
              if spec_file.is_file():
                  sources.append((f"spec {spec_rel}", spec_file.read_text()))

          out: list[ReviewIssue] = []
          for label, text in sources:
              found = lint_prose(text)
              if not found:
                  continue
              shown = "; ".join(str(issue) for issue in found[:3])
              more = f" (+{len(found) - 3} more)" if len(found) > 3 else ""
              out.append(
                  ReviewIssue(
                      severity="warn",
                      message=f"prose lint — {label}: {len(found)} issue(s): {shown}{more}",
                  )
              )
          return out
      END _prose_issues
      In self_review, add `issues.extend(_prose_issues(plan))` directly after
      `issues.extend(_refactor_issues(plan))`.
      In packages/fr/src/fr/commands/plan_cmd.py, self_review_cmd, change
      `console.print(str(issue))` to `console.print(str(issue), markup=False)`.
      Excerpts can hold `[`…`]`, which Rich reads as markup: it drops text or raises
      MarkupError, and d9 says the lint never fails a command. The same change makes
      the `[warn]`/`[error]` prefixes visible; Rich used to eat them as unknown tags.
      Run the same pytest command, then `uv run pytest tests/unit/test_plan_acceptance_links.py
      tests/unit/test_v2_plan_ops.py tests/unit/test_plan_workflow_binding.py -q --no-cov`.
      Expected: all pass. An existing test that asserts "no issues" on a plan with
      long prose may now see a warn issue. If so, filter it to non-prose issues
      in that test and journal a discovery that names the test.
