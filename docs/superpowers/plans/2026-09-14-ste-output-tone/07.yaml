  - id: P7.T1.S1
    text: |-
      RED: create tests/unit/test_journal_add_prose_warning.py. Reuse the
      repo setup of tests/unit/test_journal_cmd.py: import its _init_repo helper
      (`from tests.unit.test_journal_cmd import _init_repo`), then
      `monkeypatch.chdir(root)` and `runner.invoke(app, ["journal", "add", ...])`.
      BEGIN tests/unit/test_journal_add_prose_warning.py
      """Spec 2026-09-14-ste-output-tone §5.C: journal add warns, never fails."""

      from __future__ import annotations

      from pathlib import Path

      from fr.cli import app
      from typer.testing import CliRunner

      from tests.unit.test_journal_cmd import _init_repo

      runner = CliRunner()
      LONG = " ".join(["word"] * 30) + "."


      def _add(title: str, body: str, entry_id: str):
          return runner.invoke(
              app,
              ["journal", "add", "--scope", "plan", "--slug", "S", "--kind", "discovery",
               "--title", title, "--body", body, "--id", entry_id],
          )


      def test_a_long_sentence_warns_and_exits_zero(tmp_path: Path, monkeypatch) -> None:
          monkeypatch.chdir(_init_repo(tmp_path))
          result = _add("Short title", LONG, "e1")
          assert result.exit_code == 0, result.output
          assert "warning: journal entry e1: sentence of 30 words" in result.output


      def test_a_clean_entry_prints_no_warning(tmp_path: Path, monkeypatch) -> None:
          monkeypatch.chdir(_init_repo(tmp_path))
          result = _add("Short title", "The test passes.", "e2")
          assert result.exit_code == 0, result.output
          assert "warning:" not in result.output


      def test_an_idempotent_re_add_prints_no_warning(tmp_path: Path, monkeypatch) -> None:
          monkeypatch.chdir(_init_repo(tmp_path))
          _add("Short title", LONG, "e3")
          result = _add("Short title", LONG, "e3")
          assert result.exit_code == 0, result.output
          assert "warning:" not in result.output


      def test_warnings_stop_after_five_lines(tmp_path: Path, monkeypatch) -> None:
          monkeypatch.chdir(_init_repo(tmp_path))
          result = _add("Short title", " ".join([LONG] * 8), "e4")
          lines = [line for line in result.output.splitlines() if line.startswith("warning:")]
          assert len(lines) == 6
          assert lines[-1] == "warning: journal entry e4: … 3 more"
      END tests/unit/test_journal_add_prose_warning.py
      Run `uv run pytest tests/unit/test_journal_add_prose_warning.py -q --no-cov`.
      Expected: 3 failed (no warnings yet), 1 passed (the clean entry).
      If CliRunner does not mix stderr into result.output in the installed test-runner library version,
      use `result.stderr` in the assertions and journal a discovery.
  - id: P7.T1.S2
    text: |-
      GREEN: in packages/fr/src/fr/commands/journal_cmd.py, add this helper below _load:
      BEGIN helper
      _PROSE_WARNING_LIMIT = 5


      def _warn_prose(entry_id: str, title: str, body: str) -> None:
          """Print warn-only prose lint results for a new entry (spec 2026-09-14 §5.C)."""
          from fr.prose_lint import lint_prose

          issues = lint_prose(title) + lint_prose(body)
          for issue in issues[:_PROSE_WARNING_LIMIT]:
              err_console.print(f"warning: journal entry {entry_id}: {issue}", markup=False)
          if len(issues) > _PROSE_WARNING_LIMIT:
              more = len(issues) - _PROSE_WARNING_LIMIT
              err_console.print(f"warning: journal entry {entry_id}: … {more} more", markup=False)
      END helper
      At the end of add(), after both path.write_text(...) branches, call
      `_warn_prose(eid, title, body)`. The idempotent `return` stays before it,
      so a re-add prints nothing.
      Run the same pytest command, then `uv run pytest tests/unit/test_journal_cmd.py -q --no-cov`.
      Expected: all pass.
