    text: |-
      Run, in order, and record each exit code:
      `uv run ruff format --check packages/ tests/`, `uv run ruff check packages/ tests/`,
      `uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src`,
      `uv run pytest tests/unit/test_ste_output_tone.py tests/unit/test_prose_lint.py
      tests/unit/test_journal_add_prose_warning.py tests/unit/test_self_review_prose.py
      tests/unit/test_reporting_contract.py tests/unit/test_journal_cmd.py
      tests/unit/test_plan_acceptance_links.py tests/unit/test_skill_validation.py
      tests/unit/test_tripwire_hermes_rules_sync.py tests/unit/test_install_copies_rules.py
      tests/unit/test_validate_artifacts.py -q --no-cov`,
      `fr validate artifacts`, `fr journal check --scope plan --slug 2026-09-14-ste-output-tone`.
      Do NOT run the full suite: it runs past the tool time limit. The orchestrator runs it.
      If ruff format changed files, commit `style: ruff format`.
