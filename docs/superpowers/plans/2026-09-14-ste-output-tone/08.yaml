tasks:
- number: 1
  title: Reporting contract and row tables in the skills
  steps:
  - id: P8.T1.S1
    text: |-
      RED: create tests/unit/test_reporting_contract.py:
      BEGIN tests/unit/test_reporting_contract.py
      """Spec 2026-09-14-ste-output-tone §5.A-B: skills ask for fewer, shorter reports."""

      from __future__ import annotations

      from pathlib import Path

      import pytest

      SKILLS = Path(__file__).resolve().parents[2] / "plugins/super-fr/skills"
      CONTRACT = "Each update is the result in 1–3 lines, then the next step."
      TABLE = "`id | claim | level | defense`"


      def _skill(name: str) -> str:
          return " ".join((SKILLS / name / "SKILL.md").read_text().split())


      @pytest.mark.parametrize("name", ["fr-goal", "fr-debugging"])
      def test_the_reporting_contract_is_in_the_skill(name: str) -> None:
          assert CONTRACT in _skill(name)


      def test_fr_goal_no_longer_asks_to_say_what_you_tried() -> None:
          assert "say what you tried" not in _skill("fr-goal")


      @pytest.mark.parametrize("name", ["fr-brainstorming", "fr-acceptance"])
      def test_new_rows_are_presented_as_one_table(name: str) -> None:
          assert TABLE in _skill(name)


      def test_brainstorming_no_longer_asks_for_a_defense_each() -> None:
          assert "with a one-line defense each" not in _skill("fr-brainstorming")
      END tests/unit/test_reporting_contract.py
      Run `uv run pytest tests/unit/test_reporting_contract.py -q --no-cov`.
      Expected: 6 failed.
  - id: P8.T1.S2
    text: |-
      GREEN: edit four skills. The en dash in "1–3" is U+2013.
      (a) plugins/super-fr/skills/fr-goal/SKILL.md, first paragraph: replace
      "Blocked → stop, say what you tried, ask. Another shape, same mechanics; below
      narrates the shipped `fr-goal` shape." with
      "Another shape, same mechanics; below narrates the shipped `fr-goal` shape.
      **Operator updates** only at the Q&A gate, a block or failure, and delivery.
      Each update is the result in 1–3 lines, then the next step. Evidence goes to
      the journal and the PR body, not the chat. Blocked → stop, give the result, ask."
      Wrap to the file's width of about 95 characters. The file must stay at 120
      lines or fewer: reflow §2's last paragraph ("spec: this session owns ONE repo's
      plan + PR; …") to the same width to recover lines. Do not remove words.
      (b) plugins/super-fr/skills/fr-debugging/SKILL.md, §2: after the paragraph
      that ends "runs autonomously.", add a blank line and
      "**Operator updates** only at these two stops, a block or failure, and
      delivery. Each update is the result in 1–3 lines, then the next step.
      Evidence goes to the debug journal and the PR body, not the chat."
      (c) plugins/super-fr/skills/fr-brainstorming/SKILL.md, §3: replace
      "ENDS by presenting the rows to the operator with a one-line defense each** —
      the business claim it pins, the target verification level, why it is
      business-level rather than an implementation detail." with
      "ENDS by presenting the rows as one table — `id | claim | level | defense`,
      one short line per cell** — the claim it pins, the target verification
      level, and why it is business-level, not an implementation detail."
      (d) plugins/super-fr/skills/fr-acceptance/SKILL.md, "Mid-flight additions":
      replace "with a one-line defense." with
      "as one table row each (`id | claim | level | defense`)."
      Run the same pytest command, then `uv run pytest tests/unit/test_skill_validation.py -q --no-cov`.
      Expected: all pass. `wc -l plugins/super-fr/skills/fr-goal/SKILL.md` prints 120 or less.
  - id: P8.T1.S3
    text: |-
      REFACTOR + mirrors: run `uv run scripts/sync-opencode.py` and
      `uv run scripts/sync-hermes.py`, then both with `--check`. Run
      `uv run pytest tests/unit/test_tripwire_opencode_skills_sync.py tests/unit/test_tripwire_hermes_skills_sync.py -q --no-cov`.
      Expected: all pass.
      Explainer check: `grep -n "short defense for each" docs/explainers/01-fr-goal.md`
      must still print line 329. A table with a defense column keeps it true, so
      the explainer does not change. If the grep finds no match, journal a finding.
      Commit: `feat(skills): report only at gates, blocks and delivery; present rows as a table`
      (skills, tests, .opencode/skills, .hermes/skills).
- number: 2
  title: Acceptance rows move to their evidence
  steps:
  - id: P8.T2.S1
    text: |-
      Use the Edit tool on docs/acceptance/matrix.yaml. Copy the levels shape of
      row acceptance-added-since. Set:
      - ste-style-opt-in: status skipped; levels unit super-fr:tests/unit/test_ste_output_tone.py;
        notes "Unit pins the frontmatter without force-for-plugin in CI. The /config selection
        is the post-merge operator walk (spec §7, Test Plan step 2)."
      - fr-goal-reports-result-and-next-step: status skipped; levels unit
        super-fr:tests/unit/test_reporting_contract.py; notes "Unit pins the skill text in CI.
        Live behaviour and the re-measure are the post-merge operator walk (spec §7, steps 3-4)."
      - acceptance-rows-presented-as-table: status ci; levels unit
        super-fr:tests/unit/test_reporting_contract.py.
      - journal-add-warns-on-long-prose: status ci; levels unit
        super-fr:tests/unit/test_prose_lint.py and super-fr:tests/unit/test_journal_add_prose_warning.py.
      - plan-self-review-warns-on-long-prose: status ci; levels unit
        super-fr:tests/unit/test_prose_lint.py and super-fr:tests/unit/test_self_review_prose.py.
      For the three ci rows, replace the notes with one sentence that names the tests.
  - id: P8.T2.S2
    text: |-
      Run `fr acceptance report --deterministic`, `fr acceptance check` and
      `fr acceptance report --check`. Expected: exit 0, no failing rows.
  - id: P8.T2.S3
    text: |-
      REFACTOR: none beyond the report regeneration; confirm `git status` shows
      only matrix.yaml and the three reports. Commit: `docs(acceptance): chattiness rows`.
