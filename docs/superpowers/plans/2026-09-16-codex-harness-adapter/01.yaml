    text: |
      Refactor and gate. Confirm the two new shell files carry no logic that
      belongs in the shared decision library (the entrypoint must contain NO
      marker parsing, NO .fr-isolation-allow handling, NO fr-enabled test —
      all of that is fr_isolation_decide_edit's job). If shellcheck is
      available run `shellcheck plugins/super-fr/hooks/codex/*.sh
      plugins/super-fr/hooks/lib/fr-apply-patch-paths.sh` and fix warnings
      (add explicit disables with a reason, matching the style of the
      existing hooks).

      Then the full gate:
          uv run ruff check packages/ tests/
          uv run ruff format --check packages/ tests/
          uv run pytest -q --no-cov tests/unit

      Log the exit code you actually read (`rc=$?` on its own line — do NOT
      judge a piped/tailed run's status). Commit:
      `feat(codex): apply_patch path extractor + Codex isolation edit gate`.
