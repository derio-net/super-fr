tasks:
- number: 1
  title: RED — the docs guard
  steps:
  - id: P6.T1.S1
    text: |
      RED. Create tests/unit/test_codex_docs.py in the style of
      test_hermes_docs.py. Assert the README:
        - documents the opt-in env var CODEX_SKILLS_INSTALL
        - names `fr codex install`, `uninstall` and `doctor`
        - states the TRUST caveat explicitly — the assertion should look for
          the substance, e.g. "/hooks" and "trust", because an installed hook
          that is never trusted never fires, and trust is keyed to the hook's
          hash so a super-fr upgrade re-arms the review
        - names the artifact paths (~/.codex/skills, ~/.codex/AGENTS.md,
          ~/.codex/super-fr-hooks)
        - says plainly that hook firing is NOT proven by this PR
      And assert AGENTS.md registers .agents/skills + .codex/ as GENERATED by
      scripts/sync-codex.py (so nobody hand-edits them).
      Confirm RED.
- number: 2
  title: GREEN — README, AGENTS.md, fr-isolation SKILL.md
  steps:
  - id: P6.T2.S1
    text: |
      GREEN.
      (1) README: add `### Codex CLI` as a peer of `### Hermes Agent`, with
          the what-lands-where table (skills / AGENTS.md block / hook tree /
          rules), the `fr codex install|uninstall|doctor` triple, the
          enforcement surface (edits AND bash — better than the OpenCode
          port), the trust caveat, and the honest limit: skill DISCOVERY is
          empirically verified (`codex debug prompt-input`), hook FIRING is
          not. Add the Quickstart line mirroring the OpenCode/Hermes ones and
          a Components-table row for plugins/super-fr/hooks/codex/.
      (2) AGENTS.md: extend "Skills/rules: canonical source vs. generated
          mirrors" with .agents/skills/ and .codex/ (generated by
          scripts/sync-codex.py; never hand-edit).
      (3) plugins/super-fr/skills/fr-isolation/SKILL.md: add Codex to the
          status-line/harness list. THE FILE IS EXACTLY AT THE 120-LINE CAP
          enforced by tests/unit/test_skill_validation.py::test_under_120_lines
          — you must COMPRESS existing prose to make room, not append. One
          honest line: Codex has no documented status-line hook, so run
          `--format oneline --cwd <dir>` from a tmux/herdr bar, same as
          OpenCode; and note the edit/bash gates ship as Codex PreToolUse
          hooks requiring a one-time `/hooks` trust.
          Re-run `uv run pytest -q --no-cov tests/unit/test_skill_validation.py`
          and confirm the cap still passes.
      Run tests/unit/test_codex_docs.py, confirm green.
- number: 3
  title: GREEN — version bump + CHANGELOG
  steps:
  - id: P6.T3.S1
    text: |
      This PR touches packages/*/src/** and scripts/install.sh, so the
      version-bump-required CI gate applies. Minor, per AGENTS.md's own
      example ("Minor = ... new subcommand/skill ... e.g. the OpenCode-support
      release"):
          uv run --no-project python scripts/bump-version.py minor
      Confirm 4.4.0 -> 4.5.0 and that it also ran `uv sync` and verified
      `uv run fr --version`. Commit the changed manifests AND uv.lock together.
      Add a CHANGELOG.md entry at the top under `## 4.5.0 — Codex harness
      support`, covering: skills/rules/hooks delivery, `fr codex
      install|uninstall|doctor`, the dangling-link repair and WHY it is
      needed (Codex skips a broken skill symlink silently), the bash guard,
      and the trust caveat. Then:
          uv run --no-project python scripts/bump-version.py --check
          python scripts/check-version-bump-needed.py origin/main
      Both must pass.
- number: 4
  title: GREEN — flip acceptance rows to ci
  steps:
  - id: P6.T4.S1
    text: |
      The five rows were added at spec time as `not-implemented`. Now that
      unit coverage exists, edit docs/acceptance/matrix.yaml to add the
      `levels.unit` refs and move each row's status. Be honest per row:
        - codex-isolation-gate-edits -> ci (unit refs:
          tests/unit/test_codex_apply_patch_paths.py,
          tests/unit/test_codex_isolation_hook_edits.py)
        - codex-isolation-gate-bash -> ci (tests/unit/test_codex_bash_guard.py)
        - codex-rules-agents-block -> ci (tests/unit/test_tripwire_codex_rules_sync.py)
        - codex-skills-link-repair -> ci (tests/unit/test_codex_install_cmd.py)
        - codex-skills-delivery -> ci for the DELIVERY mechanism
          (test_tripwire_codex_skills_sync.py, test_install_copies_codex.py);
          keep a note recording that end-to-end discovery in a live session
          remains Test Plan 1. Do NOT claim a level that does not exist.
      Then `fr acceptance check` — must exit 0 with no `failing` row.
- number: 5
  title: REFACTOR + full verification
  steps:
  - id: P6.T5.S1
    text: |
      Final gate, run each and log the REAL exit code on its own line (never
      judge a piped/tailed run's status — `rc=$?` immediately after):
          uv run ruff check packages/ tests/
          uv run ruff format --check packages/ tests/
          uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src
          uv run pytest
          fr validate artifacts
          fr acceptance check
          uv run scripts/sync-codex.py --check
          uv run --no-project python scripts/bump-version.py --check
      Confirm `git status --porcelain` shows no unintended files (especially
      no .fr-isolation, no scripts/tmp/).
      Commit: `docs(codex): README/AGENTS/skill wiring, 4.5.0, acceptance rows`.
