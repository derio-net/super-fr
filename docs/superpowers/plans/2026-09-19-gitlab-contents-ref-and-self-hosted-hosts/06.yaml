tasks:
- number: 1
  title: 'RED -> GREEN: _hosts.backend_for_url, path shape first'
  steps:
  - id: P6.T1.S1
    text: "RED. The gap, proven live before it is fixed: a bare MR URL on a\nself-hosted GitLab resolves to the GITHUB adapter, because\n`backend_for_hostname` only knows `github.com` and `gitlab.com`.\n\n```\nhttps://gitlab.com/g/p/-/merge_requests/7                      -> gitlab\nhttps://gitlab.local.gebit.de/IDerm/devops-scripts/-/merge_requests/7 -> github  (!)\nhttps://github.com/derio-net/super-fr/pull/486                 -> github\n```\n\nSo phase 5's host threading in `pr_observe` cannot fire: `backend ==\n\"gitlab\"` and a non-None self-hosted host are mutually exclusive by\nconstruction of the same table. The bridge does not merely lose the host\n— it picks the wrong CLI entirely. And unlike `fr apply`, there is no\n`.devcontainer/fr-profiles.yaml` to declare `backend:` in: a bare URL has\nno repo.\n\nThe URL's own PATH names the forge, needing no config:\n\n| forge | PR/MR path | issue path |\n|---|---|---|\n| GitLab | `/-/merge_requests/N` (or `/merge_requests/N`) | `/-/issues/N` |\n| Gitea | `/pulls/N` | `/issues/N` |\n| GitHub | `/pull/N` | `/issues/N` |\n\nIn `tests/unit/test__hosts.py`:\n\n```python\nclass TestBackendForUrl:\n    @pytest.mark.parametrize(\n        (\"url\", \"expected\"),\n        [\n            (\"https://gitlab.local.corp/g/p/-/merge_requests/7\", \"gitlab\"),\n            (\"https://gitlab.local.corp/g/sub/p/-/merge_requests/7\", \"gitlab\"),\n            (\"https://git.corp/g/p/merge_requests/7\", \"gitlab\"),   # pre-dash GitLab\n            (\"https://gitlab.local.corp/g/p/-/issues/3\", \"gitlab\"),\n            (\"https://gitea.corp/o/r/pulls/4\", \"gitea\"),\n            (\"https://github.corp/o/r/pull/9\", \"github\"),\n            (\"https://gitlab.com/g/p/-/merge_requests/7\", \"gitlab\"),\n            (\"https://github.com/o/r/pull/1\", \"github\"),\n        ],\n    )\n    def test_the_path_shape_names_the_forge(self, url, expected):\n        assert backend_for_url(url) == expected\n\n    def test_an_ambiguous_issue_path_falls_back_to_the_hostname(self):\n        # `/issues/N` is BOTH GitHub's and Gitea's shape, so it cannot\n        # discriminate; the documented Gitea boundary is preserved rather\n        # than guessed at.\n        assert backend_for_url(\"https://gitea.corp/o/r/issues/3\") == \"github\"\n        assert backend_for_url(\"https://gitlab.com/g/p/issues/3\") == \"gitlab\"\n\n    def test_a_shapeless_url_falls_back_to_the_hostname(self):\n        assert backend_for_url(\"https://gitlab.com/g/p\") == \"gitlab\"\n        assert backend_for_url(\"not a url\") == \"github\"\n```\n\nConfirm RED: `backend_for_url` does not exist."
  - id: P6.T1.S2
    text: "GREEN. In `packages/fr/src/fr/_hosts.py`, beside `backend_for_hostname`:\n\n```python\n# A forge URL's PATH identifies the forge where its HOSTNAME cannot.\n# `backend_for_hostname` knows two SaaS domains, so every self-hosted\n# instance falls through to \"github\" — fine as a default for a repo that\n# can declare `backend:`, useless for a bare URL, which is all the VK\n# bridge has (gh-486 gap 2). Ordered most-specific first; `/pulls/` is\n# checked before `/pull/` so Gitea is never read as GitHub.\n_URL_SHAPES: tuple[tuple[str, HostBackend], ...] = (\n    (\"/merge_requests/\", \"gitlab\"),  # /-/merge_requests/ and pre-dash alike\n    (\"/-/\", \"gitlab\"),               # GitLab's route infix, e.g. /-/issues/\n    (\"/pulls/\", \"gitea\"),\n    (\"/pull/\", \"github\"),\n)\n\n\ndef backend_for_url(url: str) -> HostBackend:\n    \"\"\"Resolve a backend from a forge URL: its path shape first, its\n    hostname second.\n\n    For `fr_vk.pr_observe`/`pr_state` and `fr_dispatch.prompt`, which hold\n    a URL and no checkout, so `detect_backend`'s config tier is\n    unavailable. `/issues/N` is deliberately NOT a shape: it is both\n    GitHub's and Gitea's, so it falls through to the hostname rather than\n    being guessed — the same documented Gitea boundary as before.\"\"\"\n    path = urlparse(url).path\n    for marker, backend in _URL_SHAPES:\n        if marker in path:\n            return backend\n    return backend_for_hostname(urlparse(url).hostname)\n```\n\n`urlparse` moves to a module-level import. Green.\n\nThen re-run the live proof from S1 through the new function and record it\nin the step note — the self-hosted MR URL must now say `gitlab`."
- number: 2
  title: Wire the three URL-only call sites, and state what remains broken
  steps:
  - id: P6.T2.S1
    text: "RED → GREEN, the three call sites that hold a URL and no checkout.\nEach is a one-line swap from `backend_for_hostname(urlparse(u).hostname)`\nto `backend_for_url(u)`:\n\n1. `fr_vk/pr_observe.py` `_default_pr_status_fetch` — **this is the one\n   that makes phase 5's host threading live.** With the backend now\n   correctly `gitlab`, `host=self_hosted_hostname(hostname)` is non-None\n   at the same time for the first time. Update\n   `tests/unit/test_pr_observe.py`'s self-hosted test to STOP\n   monkeypatching `backend_for_hostname` — that patch existed only to\n   isolate the host claim from this bug, and leaving it would hide the fix.\n2. `fr_vk/pr_state.py` `_close_linked_gh_issue` (line ~145) — right\n   adapter for a self-hosted GitLab Issue close.\n3. `fr_dispatch/prompt.py` `_backend_for_tracking_url` — a self-hosted\n   GitLab phase's prompt now gets `glab issue view` wording instead of\n   `gh issue view`. Its docstring's \"hostname alone\" reasoning is now\n   wrong for GitLab and must be rewritten; the **Gitea** half stays true\n   (`/issues/N` cannot discriminate), so\n   `test_prompt_backend_wording_gitea_hostname_alone_is_not_enough` must\n   still pass unchanged — if it fails, the shape table is too greedy.\n\nConfirm RED per site before each swap, then the full gate."
  - id: P6.T2.S2
    text: "Say plainly what is still broken, in the code and in the journal.\n\n`pr_state._default_close_gh_issue` now receives the right backend, but\nstill no HOST: its public `closer: Callable[[str, str, str], None]` — two\ncall sites (`pr_state.py:146`, `:335`) and every test double — has no room\nfor one, and widening that arity is a bridge-wide change beyond gh-486.\nSo on a self-hosted instance the Issue auto-close builds a `gitlab`\nclient pointed at `gitlab.com` and fails non-fatally with a logged\nwarning. Update the comment at that call site to say exactly that (it\ncurrently blames backend resolution, which this task just fixed), and\nresolve/replace the open findings so the journal matches reality:\n\n```bash\nuv run fr journal resolve --scope plan \\\n  --slug 2026-09-19-gitlab-contents-ref-and-self-hosted-hosts \\\n  --id 51477f0cd417 --state fixed \\\n  --note \"backend_for_url resolves the forge from the URL path, so pr_observe now reaches backend=gitlab WITH a self-hosted host — the combination phase 5 could not produce.\"\n```\n\nLeave the `pr_state` host finding OPEN with an updated note naming the\n`closer` arity as the blocker, and record a `discovery` stating the\nresulting support matrix for the PR body: which bridge operations work\nagainst a self-hosted GitLab after this phase, and which do not."
