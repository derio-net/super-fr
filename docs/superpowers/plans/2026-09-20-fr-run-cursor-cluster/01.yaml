tasks:
- number: 1
  title: '`_find_step` refuses a composite member id with an actionable message'
  steps:
  - id: P1.T1.S1
    text: |-
      RED. In `tests/unit/test_run_cli.py`, add `test_resolve_composite_member_id_teaches_the_two_flags`:
      start a run against the shipped `fr-goal` shape, resolve `brainstorm`/`plan` so a plan is
      recorded, advance into `implement`, then invoke
      `fr run resolve <id> --step phase/1/implement-phase --state done`.
      Assert exit 2 AND that stderr contains both `--step implement-phase` and `--item phase/1`.
      Run `uv run pytest tests/unit/test_run_cli.py -k composite -q --no-cov` and CONFIRM IT FAILS
      with today's message `step 'phase/1/implement-phase' not found in workflow 'fr-goal'`.
      Paste the failing output into the phase journal — this is the walking skeleton's proof that
      the CLI test harness reaches the real runtime, not a mock.
  - id: P1.T1.S2
    text: |-
      GREEN. In `packages/fr/src/fr/commands/run_cmd.py`, before `_find_step` raises, check whether
      `step_id` contains `/` and its tail after the last `/` matches a member step id of some
      grouped `for_each` step in the manifest. If so raise `RunStateError` with:
        step '<id>' not found in workflow '<w>'.
        It is a grouped `for_each` member, which takes two flags:
          --step <member> --item <head>
      Leave the message unchanged for every other not-found id. Re-run the test; confirm green.
  - id: P1.T1.S3
    text: |-
      REFACTOR. Extract the split into `_split_member_id(manifest, step_id) -> tuple[str, str] | None`
      returning `(item, member_id)` or `None`, with a docstring saying why the composite is NOT
      accepted in `--step` (spec 3.B: one canonical form, the flags are taught rather than hidden).
      `_find_step` calls it. Re-run the file's tests; confirm still green.
- number: 2
  title: '`advance` prints the resolve command, before the JSON brief'
  steps:
  - id: P1.T2.S1
    text: |-
      RED. Add `test_advance_prints_the_resolve_command_before_the_json`: advance into `implement`,
      capture stdout, and assert (a) some line contains
      `fr run resolve <run-id> --step implement-phase --item phase/1 --state done|failed`,
      and (b) `json.loads(stdout.strip().splitlines()[-1])` still succeeds — the brief must remain
      the last line a naive `tail -1` reads. Confirm (a) FAILS today.
  - id: P1.T2.S2
    text: |-
      GREEN. In `_advance_group`, print the hint line between the existing
      `f"{step.id}: dispatch brief ({pending})"` line and the `json.dumps(...)` line, with
      `soft_wrap=True`. Add a comment citing the same ordering constraint the gate-degradation
      notice already documents (spec 3.B). Confirm both assertions pass.
  - id: P1.T2.S3
    text: |-
      REFACTOR. Extract `_resolve_hint(run_id, member_id, item) -> str` building that command
      string once; `_advance_group` uses it. Phase 2 reuses it for the ALREADY RUNNING refusal, so
      the two surfaces cannot drift into printing different commands for the same act.
- number: 3
  title: 'Delivery-infrastructure smoke: every CI gate green on this slice'
  steps:
  - id: P1.T3.S1
    text: |-
      Run, from the worktree, in order: `uv run ruff format packages/ tests/`,
      `uv run ruff check packages/ tests/`,
      `uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src`,
      `uv run pytest -q --no-cov`. All four must pass. This is the skeleton's point: the smallest
      real change proves lint, types and the whole suite are reachable before the expensive phases.
  - id: P1.T3.S2
    text: |-
      Flip the row now that evidence exists:
      `uv run fr acceptance set-status --id run-resolve-teaches-item-flag --status ci
       --level unit=super-fr:tests/unit/test_run_cli.py
       --notes "Composite member id refused with the two flags spelled out; advance prints the same
       command before the JSON brief, and the brief stays the last stdout line."`
      Commit the regenerated reports with the code.
