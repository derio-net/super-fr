  - run-advance-refuses-running
tasks:
- number: 1
  title: A grouped member already `running` is refused, not re-briefed
  steps:
  - id: P2.T1.S1
    text: |-
      RED. Add `test_advance_refuses_a_running_member`: advance into `implement` so
      `phase/1/implement-phase` is `running`, then advance again. Assert exit 2, that stderr says
      `ALREADY RUNNING`, that it names the dispatch timestamp from the group record's `at`, and that
      stdout contains NO JSON brief. Confirm it FAILS today (a byte-identical brief is re-emitted).
  - id: P2.T1.S2
    text: |-
      GREEN. In `_advance_group`, before choosing `pending`, compute
      `running = next((k for k in expected if items.get(k) == "running"), None)`. When set, print the
      refusal (subject, `record.at`, then `_resolve_hint(...)`, then the `--redispatch` line) to
      `err_console` and `raise typer.Exit(2)`. Nothing is written to the run file on this path.
  - id: P2.T1.S3
    text: |-
      REFACTOR. Extract `_already_running_refusal(step_id, key, at, run_id, member_id, item) -> str`
      so Task 2's top-level case renders the identical shape. Re-run the file; confirm green.
- number: 2
  title: A top-level `agent` step already `running` is refused the same way
  steps:
  - id: P2.T2.S1
    text: |-
      RED. Add `test_advance_refuses_a_running_top_level_agent_step`: advance to `plan` (agent, no
      gate) so it is `running`, advance again, assert exit 2 + `ALREADY RUNNING` + no JSON on stdout.
      Add `test_advance_still_briefs_a_blocked_gated_agent_step`: advance `brainstorm` twice and
      assert the brief IS still printed both times — the gate stops the run, not the harness's view
      of the step (spec 3.A). Confirm the first fails and the second already passes.
  - id: P2.T2.S2
    text: |-
      GREEN. In `advance_cmd`'s `step.kind == "agent"` branch (AFTER the `_gate_pending` block, so
      the gated path is untouched), refuse when `record.state == "running"` using the same renderer,
      with no `--item` in the hint. Confirm both tests green.
  - id: P2.T2.S3
    text: |-
      REFACTOR. Fold the two refusal call sites into one helper if they now differ only by the hint
      arguments; otherwise record `no-refactor-because: P2.T2` in the phase journal with the reason.
- number: 3
  title: '`--redispatch` is the deliberate escape, and says so when there is nothing
    to escape'
  steps:
  - id: P2.T3.S1
    text: |-
      RED. Add three tests: (a) `--redispatch` on a running member re-emits the brief for THAT unit
      and leaves every other item untouched; (b) `--redispatch` refreshes the group record's `at` and
      rewrites only that unit's accounting snapshot; (c) `--redispatch` with nothing outstanding exits
      2 naming that nothing is running, and does NOT fall through to an ordinary dispatch (spec 3.A).
      Confirm all three fail (the flag does not exist).
  - id: P2.T3.S2
    text: |-
      GREEN. Add `redispatch: bool = typer.Option(False, "--redispatch", help=...)` to `advance_cmd`,
      thread it into `_advance_group`, and implement: when set and a unit is running, re-emit that
      unit's brief; when set and nothing is running, exit 2. The flag never resets an item to
      `pending`, never selects a different unit, and never applies to a `cli` step.
  - id: P2.T3.S3
    text: |-
      REFACTOR + GATES. Re-read `advance_cmd` end to end and collapse any duplicated
      state-transition code the flag introduced. Then run ruff format, ruff check, mypy and
      `uv run pytest -q --no-cov`; all green. Flip the row:
      `uv run fr acceptance set-status --id run-advance-refuses-running --status ci
       --level unit=super-fr:tests/unit/test_run_cli.py
       --notes "Grouped member and top-level agent step both refuse re-dispatch with exit 2;
       --redispatch re-briefs only the outstanding unit and exits 2 when none is."`
