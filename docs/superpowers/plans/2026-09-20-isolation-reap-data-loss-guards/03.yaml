tasks:
- number: 1
  title: gc classification, red to green
  steps:
  - id: P3.T1.S1
    text: |-
      RED: in tests/unit/test_isolation_gc_hygiene.py (or the gc test module
      that already owns _gc_one — check both it and test_isolation.py and
      put these beside the existing gc verdict tests, not in a new file),
      assert:
      (a) a MERGED workspace that refuses → GcAction(verdict="merged",
          action="skipped", detail=<the hazard text>) and specifically NOT
          action="reap-failed". A refusal is a decision; reporting it as a
          failure reads as breakage and trains the operator to ignore the
          row (spec §3.5);
      (b) a genuine teardown error still reports "reap-failed" — the broad
          handler must survive, so ReapRefused is caught BEFORE it, not
          instead of it;
      (c) the merged-by-content branch behaves identically;
      (d) `gc(dry_run=True)` on the same refusing workspace reports
          action="would-skip", not "would-reap". A preview that promises an
          action the live run will refuse is not a preview;
      (e) a clean, fully-landed merged workspace still reports "reaped" live
          and "would-reap" in dry-run. This is the false-refusal regression
          and the reason acceptance row isolation-reap-guards-dont-strand
          exists;
      (f) one workspace's refusal does not abort the host-wide sweep —
          a refusing workspace and a reapable one in the same sweep produce
          both actions.
      Run pytest — fails.
  - id: P3.T1.S2
    text: |-
      GREEN: in `_gc_one`, both reap branches (local.py:696 MERGED and
      local.py:720 merged-by-content): add `except ReapRefused as e` BEFORE
      the existing `except Exception`, emitting
      GcAction(wt, branch, verdict, "skipped", e.hazard.detail); and in each
      `if dry_run:` arm call `self._reap_hazard(state)` first, returning
      "would-skip" with the detail when it fires. Add "would-skip" to the
      action vocabulary comment on the GcAction dataclass (local.py:117) —
      that comment is the only place the vocabulary is written down, so an
      unlisted value is an undocumented one. Leave `verdict` alone: it
      classifies why we looked, `action` records what we did. Green.
  - id: P3.T1.S3
    text: |-
      REFACTOR: the two reap branches are now near-identical blocks
      differing only in their verdict string. Collapse them into one helper
      taking the verdict, if that reads more clearly than the duplication —
      and if it does not, record `no-refactor-because: P3.T1` in the plan
      journal with the reason, rather than forcing a helper that obscures
      the two genuinely different classification paths that lead into it.
      Re-run the gc tests.
- number: 2
  title: down --all and --force stop lying
  steps:
  - id: P3.T2.S1
    text: |-
      RED: in tests/unit/test_isolation_cmd.py assert (a) `down --all` with
      one open-PR workspace and one hazard-refused workspace keeps BOTH and
      its summary states each one's actual reason — the current code
      hardcodes "kept (open PR — rerun with --force)" and its docstring at
      isolation_cmd.py:478 asserts "that open-PR check is the only
      IsolationError down raises", which this change makes false (spec §3.7);
      (b) `down` (single) on a refused workspace exits non-zero with the
      hazard message and does NOT detach sessions or clear the pipeline
      sentinel — the existing comment at isolation_cmd.py:459 says a refused
      down keeps its bindings, and that must hold for the new refusals too.
      Run pytest — fails.
  - id: P3.T2.S2
    text: |-
      GREEN: make `_down_all` collect each refusal's message per branch and
      report the reasons it actually received instead of asserting one, and
      correct its docstring. Update `--force`'s --help from "Tear down even
      with an open PR." to name what it now destroys (uncommitted changes,
      commits not on origin) rather than only what it bypasses — the help
      string is where an operator meets this flag. Update `down`'s docstring
      at local.py:548, which currently claims "--force bypasses the open-PR
      guard ONLY"; it now bypasses all three guards and still never skips
      the #354 post-condition verification, which stays true and stays
      stated. Green.
  - id: P3.T2.S3
    text: |-
      REFACTOR + gate: re-read every docstring touched in phases 1-3 as a
      set and check they tell one consistent story about what --force does;
      a reader lands on exactly one of them and must not be misled by it.
      Then `uv run ruff format packages/ tests/`; `uv run ruff check
      packages/ tests/`; `uv run mypy packages/fr/src packages/fr-dispatch/src
      packages/fr-vk/src packages/fr-cncd/src`; `uv run pytest -q --no-cov
      --basetemp=/tmp/sb` — green against phase 1's recorded baseline.
