tasks:
- number: 1
  title: One integration test spanning ingestion, plan, run and brief
  steps:
  - id: P4.T1.S1
    text: |
      RED. Add `test_a_phases_file_tier_reaches_the_dispatch_brief` to
      `tests/integration/test_fr_goal_shape.py` (which already drives
      `fr run advance` and asserts on member briefs — see its `brief["item"]`
      assertion around line 392, and reuse its harness rather than building a
      second one).

      The test walks the WHOLE chain in one go, which is the point — every link
      was independently covered and the chain was still broken:
      (1) `fr plan create --phases-file` with per-phase tiers (`hard`, then one
      phase with none); (2) record the plan on the run and advance to the
      `implement` group; (3) assert the first member brief's `resolved_tier`
      equals the tier the PHASES FILE declared — not a tier written into
      `01.yaml` by the test. Scaffolding through the CLI is load-bearing: a test
      that hand-writes the phase yaml would pass against the very bug this
      closes; (4) advance to the untiered phase's member and assert
      `resolved_tier is None`.

      Write it FIRST against the current tree and record the failure. If it passes
      before phases 1 and 3 land, the test is not exercising the CLI ingestion path
      and must be rewritten — a test that asserts the code calls the function it
      calls is the defect class this repo names explicitly.
  - id: P4.T1.S2
    text: |
      GREEN. No production change should be needed — phases 1 and 3 supply it.
      If one IS needed, that is a real finding: journal it
      (`fr journal add --scope plan --kind finding`) rather than quietly widening
      an earlier phase, because it means the unit-level coverage of phase 1 or 3
      did not pin what it claimed to.

      Run: `uv run pytest tests/integration/test_fr_goal_shape.py -q --no-cov`.
  - id: P4.T1.S3
    text: |
      REFACTOR + full gate. Fold any fixture duplication between the new test and
      its neighbours into the module's existing helpers.

      Then the complete CI gate locally, since this is the last code phase:
      `uv run ruff format packages/ tests/`,
      `uv run ruff check packages/ tests/`,
      `uv run mypy packages/fr/src packages/fr-dispatch/src packages/fr-vk/src packages/fr-cncd/src`,
      `uv run pytest` (full, WITH coverage — CI gates cov-fail-under=75),
      `uv run fr validate artifacts`.
