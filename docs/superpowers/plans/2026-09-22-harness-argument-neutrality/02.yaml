tasks:
- number: 1
  title: Arguments are scanned by pattern
  steps:
  - id: P2.T1.S1
    text: |-
      RED: tests that scan_prose flags isolation:"worktree", isolation: 'worktree', isolation="worktree" and isolation: "worktree" as the claude-code argument, flags run_in_background (claude-code) and background=true / notify_on_complete (hermes), excuses each inside a valid Harness clause, and that no argument name is claimed by two harnesses; see them fail
  - id: P2.T1.S2
    text: |-
      GREEN: populate ARGUMENT_VOCABULARY with the spec 3.A table (name -> compiled regex) and make scan_prose report argument matches under the same clause rules as tool names; tests pass
  - id: P2.T1.S3
    text: |-
      REFACTOR: one lookup helper serving both tool names and argument patterns in prose.py so the clause logic is not duplicated; tests green
- number: 2
  title: Headings are not instructions
  steps:
  - id: P2.T2.S1
    text: |-
      RED: test that a Markdown heading line ('## Plan Skill Override', '### 1. Agent sessions ...') is not flagged while the same word in a body line is; see it fail
  - id: P2.T2.S2
    text: |-
      GREEN: scan_prose skips lines matching ^#{1,6} ; test passes and the existing skill tripwire stays green
  - id: P2.T2.S3
    text: |-
      REFACTOR: document the heading rule in the module docstring with the measured false positives (spec decision d-headings-exempt); tests green
- number: 3
  title: extra_tools is gone
  steps:
  - id: P2.T3.S1
    text: |-
      RED: rewrite the three test_extra_tools_* tests in tests/unit/test_harness_vocabulary.py and the agent tripwire call to use the vocabulary instead of extra_tools, plus a test that scan_prose rejects an extra_tools keyword; see the rejection test fail
  - id: P2.T3.S2
    text: |-
      GREEN: remove the extra_tools parameter from scan_prose and _AGENT_EXTRA_TOOLS from tests/unit/test_tripwire_skill_tool_neutrality.py; full harness and tripwire tests pass
  - id: P2.T3.S3
    text: |-
      REFACTOR: drop any now-dead imports or comments mentioning extra_tools; ruff, mypy, tests green
