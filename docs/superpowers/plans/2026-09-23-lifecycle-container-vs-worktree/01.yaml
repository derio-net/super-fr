tasks:
- number: 1
  title: Red - stop verb and stopped status tests
  steps:
  - id: P1.T1.S1
    text: |-
      In tests/unit/test_isolation.py (reuse its stateful docker Runner fake) write failing tests, following superpowers:test-driven-development red step (spec §3.B, §3.F): LocalWorktreeDevcontainerTarget.stop runs `docker stop <id>` then re-queries `docker ps --all` and returns the id; an already-exited container is a no-op success reported as already stopped; no container raises IsolationError naming `fr isolation up`; a container still running after stop raises; HostWorktreeTarget.stop returns a no-op message without calling docker; ExternalTarget.stop raises the externally-managed error; status() reports docker `exited` as `stopped` and passes other states through
  - id: P1.T1.S2
    text: |-
      Write a failing CLI test (typer CliRunner, as the existing isolation_cmd tests do) that `fr isolation stop --branch <b>` exits 0 and prints the stopped line, and that bare `fr isolation stop` resolves the single active workspace like restart does
  - id: P1.T1.S3
    text: |-
      Run `uv run pytest tests/unit/test_isolation.py -q --no-cov -k "stop or stopped"` and confirm the new tests fail for the right reason (missing method/command), not import errors
- number: 2
  title: Green - stop across all three targets
  steps:
  - id: P1.T2.S1
    text: |-
      Add `stop(state) -> str` to the Target Protocol in packages/fr/src/fr/isolation/types.py; implement it in local.py (docker stop + verify re-query, #354 style: a failed docker ps is an error, never absence), hostworktree.py (no-op message, no docker), external.py (raise the existing _EXTERNAL refusal); map exited to stopped in LocalWorktreeDevcontainerTarget.status
  - id: P1.T2.S2
    text: |-
      Add the `stop` command to packages/fr/src/fr/commands/isolation_cmd.py mirroring restart's --repo/--branch resolution and IsolationError handling; help text says the worktree, state and bindings are kept and that `up`, `restart` or the next `exec` resumes it
  - id: P1.T2.S3
    text: |-
      Run `uv run ruff format packages/ tests/ && uv run ruff check packages/ tests/ && uv run mypy packages/fr/src && uv run pytest -q --no-cov` and confirm all green, then refactor any duplication with restart's container lookup, or record no-refactor-because for P1.T2 in the plan journal
