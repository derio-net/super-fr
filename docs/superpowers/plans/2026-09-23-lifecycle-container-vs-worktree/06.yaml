- number: 2
  title: Live walks and matrix flips
  steps:
  - id: P6.T2.S1
    text: |-
      Live walk #471 on this host from the worktree with `uv run fr`: pick a throwaway workspace (fr isolation up --branch tmp/live-stop), install a package in-container via exec, fr isolation stop → status shows stopped → fr isolation exec -- <tool> resumes with the notice and the install survived; fr isolation down that workspace; record the transcript (no third-party hosts) as a plan-journal discovery
  - id: P6.T2.S2
    text: |-
      Live walk #577 on the same throwaway pattern: uncommitted scratch file plus an fr run start cursor in the workspace, add a devcontainer feature to its profile uncommitted, fr isolation rebuild → the feature's tool answers via exec, scratch file and `fr run status <id>` intact; tear the throwaway down; record as a plan-journal discovery
  - id: P6.T2.S3
    text: |-
      Flip the five acceptance rows with `fr acceptance set-status` to ci (unit/integration refs) with notes naming the live walks, add the test refs as levels, and confirm `fr acceptance check` is green
