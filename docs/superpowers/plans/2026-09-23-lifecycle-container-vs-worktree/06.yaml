    text: |-
      Edit plugins/super-fr/skills/fr-isolation/SKILL.md (lifecycle block gains stop and rebuild, a container-vs-worktree table, the profile-change line per spec §3.G), and add the one-sentence repair rule to fr-goal and fr-debugging SKILL.md; keep them harness-neutral; run scripts/sync-opencode.py and scripts/sync-hermes.py and confirm `--check` passes for both
