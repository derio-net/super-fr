tasks:
- number: 1
  title: A master repo verifies with no flags
  steps:
  - id: P1.T1.S1
    text: |-
      RED: in tests/unit/test_isolation_cmd.py, add tests invoking
      `fr isolation verify-merge --branch <b>` (CliRunner, the file's existing
      fake-target pattern around the other verify-merge tests) where the
      target's `_resolve_default_branch()` returns "master": (a) with no
      `--default-branch`, the target's verify_merge receives
      default_branch="master" and output names `origin/master`; (b) an
      explicit `--default-branch trunk` wins over the resolver; (c) when
      verify_merge raises IsolationError("no merge-base ...") on the LIVE path,
      exit code is 2, stderr starts `error:` and names `--default-branch`,
      and no traceback (`result.exception` is a SystemExit, not
      IsolationError). Run
      `uv run pytest tests/unit/test_isolation_cmd.py -q --no-cov -k verify_merge`
      and confirm the new tests fail.
  - id: P1.T1.S2
    text: |-
      GREEN: isolation_cmd.py verify_merge (~L856-929): `default_branch:
      str | None = typer.Option(None, "--default-branch", ...)`; when None
      resolve via the target's `_resolve_default_branch()` (local.py ~L2175);
      wrap the live `verify_merge(...)` call in `try/except IsolationError`
      → `_fail`, matching the reaped path; interpolate the resolved branch in
      every output string. In local.py drop the `= "main"` default from
      `verify_merge`/`verify_merge_reaped` signatures (keyword required) and
      make `branch_changes_present`'s missing-merge-base message name the
      base ref and suggest `--default-branch`. Fix any caller the signature
      change breaks (grep `verify_merge(`). Re-run the tests: green.
  - id: P1.T1.S3
    text: |-
      REFACTOR: if the live and reaped paths now duplicate the resolve +
      except shape, fold it into one small helper in isolation_cmd.py; run
      `uv run pytest tests/unit/test_isolation_cmd.py tests/unit/test_isolation.py -q --no-cov`
      green.
