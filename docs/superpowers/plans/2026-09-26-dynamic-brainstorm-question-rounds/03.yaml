  steps:
  - id: P3.T1.S1
    text: |-
      Red: add tests/unit/test_tripwire_fr_goal_question_rounds.py per spec Test Plan 6: on every §3.A.1 surface (fr-goal and fr-brainstorming SKILL.md, their .opencode/skills and .hermes/skills/fr mirrors, docs/explainers/01-fr-goal.md, README.md) none of "max 4", "≤4 questions", "ONE batch", "one batched Q&A", "no more than four questions", "ask ONCE" appears; the canonical fr-goal SKILL.md and both mirrors contain "Round 1 of", "never a round 3", and the `questions:` record declaration. Run it and see it fail.
  - id: P3.T1.S2
    text: |-
      Green: rewrite fr-goal SKILL.md lines 5, 14, 42 and §1 (46-62, including the "Harness — questions" clause) and fr-brainstorming SKILL.md:64 to the spec §3.A/§3.A.1 contract — one gate; one question per operator-owned decision, soft ceiling ~10 with justification or a split proposal; "(Round 1 of N)" announced before round 1 ends, with `of 1` offering a second round on request; round 2 only what round 1 opened, after checking the answers against the code, each question naming its cause; never a round 3; the hard gate per round; on Claude Code a round is ceil(N/4) consecutive AskUserQuestion calls with no other tool call between (inside the per-harness clause only, per harness prose neutrality); the record's `questions: {rounds, trigger, reason}` and that resolve verifies it. Keep the fr-goal skill's line budget in mind (check any skill-length test). Run scripts/sync-opencode.py and scripts/sync-hermes.py; re-run the tripwire and see the skill assertions pass.
  - id: P3.T1.S3
    text: |-
      Refactor: run the skill guards — `uv run pytest tests/unit/test_tripwire_*.py tests/unit/test_skill_*.py tests/unit/test_opencode_agent_mirror.py -q --no-cov -n auto` (opencode + hermes sync tripwires, harness tool-neutrality, gate-provenance prose tripwire, skill validation) — and fix any wording they flag.
