  title: Gate the skeleton rule on two or more agentic phases
  steps:
  - id: P1.T1.S1
    text: |-
      Red: in tests/unit/test_v2_plan_ops.py, invert the sole-skeleton parametrized test (one marked agentic phase, with and without a manual phase, raises no skeleton issue), rename and flip the minimal-fixture test to assert no issues, delete test_sole_skeleton_error_is_silenced_by_the_skeleton_override, add a one-unmarked-agentic-phase-passes test and a sole-marked-phase-with-old-fr_version floor-error test; run them and see the inverted ones fail.
  - id: P1.T1.S2
    text: |-
      Green: in _skeleton_issues (plan_ops.py) delete the sole-skeleton error block and add the `agentic >= 2` condition to the unmarked-first error; run tests/unit/test_v2_plan_ops.py and see it pass, with the two-agentic-phase tests unchanged.
  - id: P1.T1.S3
    text: |-
      Refactor: update the _skeleton_issues docstring and the stale comments in tests/unit/skeleton_override.py and tests/unit/test_run_cli.py so none describes the removed error; ruff format and check clean.
- number: 2
  title: '#662 — spec is untouched when the no-table pre-flight raises'
  steps:
  - id: P1.T2.S1
    text: |-
      Red/green: in test_create_no_table_error_names_the_header_and_creates_nothing capture the spec text before the call and assert it is byte-identical after the raise; the test passes (pre-flight raises before any write) — confirm it would fail if create wrote the spec first.
  - id: P1.T2.S2
    text: |-
      Refactor: none needed, refactor: a single added assertion with nothing to restructure.
- number: 3
  title: Rewrite the prose and regenerate both mirrors
  steps:
  - id: P1.T3.S1
    text: |-
      Rewrite the Walking-skeleton rule in plugins/super-fr/skills/fr-plan/SKILL.md and §3 of plugins/super-fr/skills/fr-goal/SKILL.md: size phases to the change, a one-agentic-phase plan is first-class with no marker or override, and the first agentic phase is a marked skeleton only when there are two or more.
  - id: P1.T3.S2
    text: |-
      Run scripts/sync-opencode.py and scripts/sync-hermes.py, then their --check forms, and run the skill/tripwire tests (test_skill_tokens, the opencode and hermes sync tripwires, skill validation, harness prose neutrality).
  - id: P1.T3.S3
    text: |-
      Refactor: reread both rewritten passages against the spec §2.B for wording drift; none expected beyond what S1 wrote.
- number: 4
