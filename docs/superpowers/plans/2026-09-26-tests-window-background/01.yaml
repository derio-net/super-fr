- number: 1
  title: RED — reproduce both refusals
  steps:
  - id: P1.T1.S1
    text: |-
      RED: in tests/unit/test_run_telemetry.py (fixtures via tests/unit/transcript_sessions.py, mirroring the captured records in spec §2, both content shapes: string and text-block list) add tests for spec §5.1-5.2: a backgrounded writing Bash (immediate "Command running in background with ID" tool_result, later user record origin.kind task-notification with <tool-use-id>, <status>completed</status>, "exit code 0") yields window (tool_use ts, notification ts); no notification, failed/exit code != 0, other tool-use-id, non-writing command yield none. Run `uv run pytest tests/unit/test_run_telemetry.py -q --no-cov`; confirm the new tests fail for the right reason.
  - id: P1.T1.S2
    text: |-
      RED: add tests for spec §5.3 on `_writes` (parametrized): `L=/x/t.log; pytest > $L`, `> "${L}"`, `export L=...`, chained reassignment, `L=$TMPDIR/t.log` and `> "$L" 2>&1` match; unassigned variable, mid-path variable, assignment after the redirect, `$(mktemp)` do not. Confirm they fail.
- number: 2
  title: GREEN — fix telemetry.py and the refusal hint
  steps:
  - id: P1.T2.S1
    text: |-
      GREEN: in packages/fr/src/fr/run/telemetry.py extend `orchestrator_wrote_since` per spec §3.A (ack detection, notification parse by tool-use-id, completed + no non-zero exit, both content shapes; the ack's zero-length window is replaced) and `_writes` per spec §3.B (same-command assignments, bounded substitution, leading unresolvable variable dropped, fail closed otherwise). Update the no-window refusal text in packages/fr/src/fr/commands/run_cmd.py to hint that a backgrounded suite counts once its task-notification arrived. Run the new tests green plus tests/unit/test_run_telemetry.py, tests/unit/test_run_tests_log_opencode.py and tests/unit/test_deliver_pr_body.py.
  - id: P1.T2.S2
    text: |-
      refactor: extract the ack/notification parsing into small private helpers in telemetry.py if the function grew unwieldy; otherwise record a refactor reason. Run `uv run ruff format packages/ tests/`, `uv run ruff check packages/ tests/`, and mypy on packages/fr/src.
- number: 3
  title: Bookkeeping — fragment and acceptance rows
  steps:
  - id: P1.T3.S1
    text: |-
      Add .changes/feat-batch-tests-window.yaml with `bump: patch` and a one-line summary. Move rows deliver-tests-log-background and deliver-tests-log-shell-variable to `ci` with `uv run fr acceptance set-status --id <id> --status ci --level unit=super-fr:tests/unit/test_run_telemetry.py --notes "<why>"` (gh#594/#607/#631). Run `uv run fr acceptance check` and commit.
