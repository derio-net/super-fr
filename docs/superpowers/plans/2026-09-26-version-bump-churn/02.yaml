tasks:
- number: 1
  title: Red - fragment schema, gate table, floors
  steps:
  - id: P2.T1.S1
    text: |-
      Write failing tests in tests/unit/test_change_fragments.py for scripts/changes.py: parse a valid fragment (bump patch|minor|major, single-line non-empty summary); refuse bad bump, empty summary, multi-line summary, unknown key, each error naming the field and file; `aggregate([...])` returns the highest bump; `load_pending(repo)` skips .changes/README.md; the repo's own .changes/ validates
  - id: P2.T1.S2
    text: |-
      Write failing table-driven tests in tests/unit/test_change_fragment_gate.py over synthetic tmp git repos (base commit, head commit): bump-required path with no added fragment fails; with an added fragment passes; only a modified existing fragment fails; a changed version value (any version_surfaces entry) fails even with a fragment and names the file; an added workspace member at the base version passes, at another version fails; a uv.lock dependency-only change passes; a docs-only PR passes; failure output prints the fix line from spec §3.B
  - id: P2.T1.S3
    text: |-
      Write failing tests in tests/unit/test_version_floors.py for scripts/floors.py: finds only `>=X.Y.Z,<X.Y.Z` string literals under packages/*/src (not "demo>=1.0.0"); the check passes a floor whose lower bound equals the predicted version, fails one newer than base but not predicted, passes lower bounds at or below base, passes reformatting a historical floor and moving an upper bound
- number: 2
  title: Green - changes.py, floors.py, check-change-fragment.py
  steps:
  - id: P2.T2.S1
    text: |-
      Implement scripts/changes.py (schema, parse, validate, aggregate, load_pending) and scripts/floors.py (literal scan and lower-bound comparison) per spec §3.A and §3.E, stdlib only
  - id: P2.T2.S2
    text: |-
      Implement scripts/check-change-fragment.py <base-ref>: keep `requires_bump` from check-version-bump-needed.py; rule 1 (an added valid fragment when required), rule 2 (no changed version value via version_surfaces at base vs head; added surfaces must equal base), the floor rule (predicted = base + highest bump of the added fragments); delete scripts/check-version-bump-needed.py
  - id: P2.T2.S3
    text: |-
      Retarget tests/unit/test_version_bump_guard.py to load check-change-fragment.py (its requires_bump cases stay); rename the CI job in .github/workflows/ci.yml from version-bump-required to change-fragment running `python scripts/check-change-fragment.py "origin/${{ github.base_ref }}"`
  - id: P2.T2.S4
    text: |-
      Create .changes/README.md (format, naming by branch slug, never edit a version in a PR) and this PR's own fragment .changes/feat-version-bump-churn.yaml with `bump: minor` and a one-line summary; run `python scripts/check-change-fragment.py origin/main` and confirm it passes
- number: 3
  title: Verify and refactor
  steps:
  - id: P2.T3.S1
    text: |-
      Run the three new test files and `uv run pytest -q --no-cov -n auto`, ruff check and format; all green
  - id: P2.T3.S2
    text: |-
      Refactor pass (one diff-reading helper shared by rule 1, rule 2 and the floor rule), or record the refactor reason
