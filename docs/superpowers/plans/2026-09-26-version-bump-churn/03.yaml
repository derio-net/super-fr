tasks:
- number: 1
  title: Red - release.py in temp repos
  steps:
  - id: P3.T1.S1
    text: |-
      Write failing tests in tests/unit/test_release_script.py over tmp git repos with a bare origin and a minimal copy of the version surfaces (bump, lock-check and gh commands injected, so no real uv or gh runs): several fragments aggregate to the highest bump and are removed in the same `release: vX.Y.Z` commit whose body lists summaries grouped by bump; no fragments and a tagged version is a no-op; no fragments and an untagged version tags only; a commit pushed to origin between compute and push makes it recompute and include a fragment that landed meanwhile; three lost races exit non-zero; a push rejected with "GH006 protected branch" fails at once with the bypass-actor message; an override not above the current version is refused; a pre-existing tag at the computed version bumps past it; an invalid fragment refuses; a failing lock check refuses; a staged line outside version_surfaces refuses; a rerun reads its notes from the release commit body
  - id: P3.T1.S2
    text: |-
      Write failing tests: a floor mismatch at release (lower bound newer than the previous tag but not the released version) still creates the tag, then exits with a distinct non-zero status and an issue title and body naming the floor and the right value
  - id: P3.T1.S3
    text: |-
      Write failing tests in tests/unit/test_release_workflow.py parsing .github/workflows/release.yml: triggers push to main and workflow_dispatch with an optional `version` input; concurrency group release, cancel-in-progress false; permissions contents write and issues write; runs scripts/release.py; auto-tag.yml no longer exists
- number: 2
  title: Green - release.py and release.yml
  steps:
  - id: P3.T2.S1
    text: |-
      Implement scripts/release.py per spec §3.C, §3.E and §5: fetch and reset to the origin/main tip, load_pending, compute (override wins), `uv lock --check`, run bump-version.py, git rm the fragments, verify the staged diff is only version_surfaces lines and fragments, commit as github-actions[bot], push with up to 3 recompute attempts telling a protection refusal apart, then the idempotent annotated tag and `gh release create` with notes (summaries or the release-commit body, plus --generate-notes), then the release-time floor check filing an issue with `gh issue create`; add `--dry-run`; commands injectable for tests
  - id: P3.T2.S2
    text: |-
      Create .github/workflows/release.yml (checkout fetch-depth 0, setup-uv, run release.py with GH_TOKEN) with a header comment stating the GITHUB_TOKEN no-CI property and the bypass-actor requirement if main's rules tighten; delete .github/workflows/auto-tag.yml
- number: 3
  title: Verify and refactor
  steps:
  - id: P3.T3.S1
    text: |-
      Run the new test files and `uv run pytest -q --no-cov -n auto`, ruff check and format; `python scripts/release.py --dry-run` on this branch prints the minor bump it would make from .changes/ and writes nothing
  - id: P3.T3.S2
    text: |-
      Refactor pass (the push/retry loop and the tag/release step as separate functions), or record the refactor reason
