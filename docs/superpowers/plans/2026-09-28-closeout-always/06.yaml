  - id: P6.T1.S3
    text: |-
      Commit every move as `chore: sweep owed artifacts (#733)` and record in the step note the moves by kind with counts (the deliver PR body cites it). Run `uv run pytest -q --no-cov -n auto` (full suite) — green.
