tasks:
- number: 1
  title: init and the `ci` status keyed by the ci service
  steps:
  - id: P3.T1.S1
    text: |-
      RED: tests/unit/test_acceptance_services.py — with a v2 fr-profiles: `ci: {type: none}` → `fr acceptance
      init` writes no pipeline and prints a notice naming `fr services`; `--with-ci` is refused naming the
      declared `ci: {type: none}`; `set-status --status ci` and `add --status ci` refused naming
      `ci: {type: none}`; `ci: {type: gitlab-ci}` on a github forge → `.gitlab-ci.yml` scaffolded and `ci`
      allowed; `ci: {type: github-actions}` → `.github/workflows/acceptance-report.yml`. With no fr-profiles
      file, every test in tests/unit/test_acceptance_init_no_ci.py still passes unchanged (#787). Run: red.
  - id: P3.T1.S2
    text: |-
      GREEN: `fr.acceptance.ci.ci_active(root)` from `resolve_services(root).ci`; re-key `SCAFFOLD_PATHS` and the
      templates by ci type; `scaffold.init` takes the ci service (keep `with_ci` semantics for the
      no-declaration case); `record/apply._no_ci_reason` asks `ci_active`. Run: green.
  - id: P3.T1.S3
    text: |-
      REFACTOR: drop `backend`-keyed leftovers in scaffold.py that no caller uses; rerun the acceptance tests.
- number: 2
  title: Debt-issue step only on the tracker's own platform
  steps:
  - id: P3.T2.S1
    text: |-
      RED: the scaffolded pipeline and the rule template's CI bullet keep the weekly "Acceptance debt" issue
      step only when tracking type is the ci type's platform (github-actions↔github, gitlab-ci↔gitlab,
      gitea-actions↔gitea); `tracking: none` or ci on another platform → step and bullet sentence omitted, a
      notice printed. Run: red.
  - id: P3.T2.S2
    text: |-
      GREEN: split each template's debt step into a fragment included conditionally; run: green.
  - id: P3.T2.S3
    text: |-
      REFACTOR + gate: ruff format/check, mypy, `uv run pytest tests/unit -q --no-cov -n auto -k acceptance`; commit; push.
