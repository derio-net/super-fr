schema_version: 2
phase:
  number: 1
  title: Size phases to the asks — sizing module, self-review gate, proportionality
    section, prose
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - phase-sizing-ask-floor
  - phase-sizing-split-reason
  - phase-sizing-proportionality
  - phase-sizing-manual-verification
  - phase-sizing-plan-guidance
  tier: hard
  files:
  - packages/fr/src/fr/phase_sizing.py
  - packages/fr/src/fr/plan_ops.py
  - packages/fr/src/fr/proportionality.py
  - tests/unit/test_phase_sizing.py
  - tests/unit/test_plan_phase_sizing.py
  - tests/unit/test_plan_proportionality.py
  - tests/unit/test_fr_plan_sizing_prose.py
