tasks:
- number: 1
  title: Operator gate verified from OpenCode's question tool (R9)
  steps:
  - id: P3.T1.S1
    text: |-
      RED: resolve-level test on the OpenCode fixture: a brainstorm gate with one answered question round since it blocked resolves with derived `answered_by: operator`; a declared `rounds: 2` against one observed round is refused; a declined-only round is no answer. Fails.
  - id: P3.T1.S2
    text: |-
      GREEN: `_gate_provenance` and `question_rounds_refusal` take rounds from `observed_session(...).answered_rounds` on OpenCode. Green.
- number: 2
  title: No default answered_by; honest gates wording (R10, R11)
  steps:
  - id: P3.T2.S1
    text: |-
      RED: the record form and the `--answered-by`-less flag form both refuse an unobservable gate with no `answered_by` (exit 2, naming `operator` and `agent`); an UNGATED step resolves with no `answered_by` exactly as today; a third value is still refused; `fr run gates` and `fr run check` print "cleared by the agent, as claimed — unobserved: fr could not read who answered" for an `agent` clearance whose step records `unobserved` containing `operator-gate`, keep "no operator answered it" for an observed agent, and print "answered by the operator, as claimed — unobserved" for a claimed-unobserved operator. Fails.
  - id: P3.T2.S2
    text: |-
      GREEN (spec §F): remove all three defaults — `resolve_in_process` (`run_cmd.py:5289`), the flag form (`:4783`), `_resolve_body`'s parameter (`:4904` → `AnsweredBy | None = None`); the closed-set check (`:4920-4927`) accepts `None`; `_gate_provenance` (`:1193`) takes `claimed: AnsweredBy | None` and refuses only on an unobserved gate with `None`; update the `run/model.py:41` docstring; the wording in `fr run check` (`:5995`) and `fr run gates` (`:6065`). Green.
- number: 3
  title: Visual witness on OpenCode, keyed on the owing session (R12)
  steps:
  - id: P3.T3.S1
    text: |-
      RED: test_run_evidence_visual.py on the OpenCode fixture: a PNG read only in the orchestrator's session does not satisfy the reviewer's check; the same read in the reviewer's child does; a capture script run in ses_run satisfies an inline (no holder) unit; `_unobservable` no longer names OpenCode. Fails.
  - id: P3.T3.S2
    text: |-
      GREEN: `run/visual.py`'s witness reads through `observed_session(...).child(...)` / the run session's own parts (`first_read`, `first_shell_executing`), choosing the session as today. Green.
- number: 4
  title: Parity rows, skill prose, mirrors, explainer
  steps:
  - id: P3.T4.S1
    text: |-
      RED→GREEN: parity.yaml per spec §H — `operator-gate`, `out-of-scope-operator-guard`, `spec-review-independence`, `visual-evidence` OpenCode → `partial` with a scope_note naming the fixture tests and the post-merge row `opencode-observe-take10-rerun`; `dispatch-holder-identity` and `usage-capture` scope_note only; new `run-session-identity` row (`kind: interaction`; claude-code enforced, opencode partial, hermes absent); `fr-isolation-required` Hermes → `partial` with a scope_note (`pre_tool_call` gates `write_file|patch`, `.hermes/config.snippet.yaml`; `terminal`/`execute_code` writes reach only `fr-isolation-guard.sh`, git/gh mutations alone). Add a test asserting the Hermes edit-gate cell is `partial`. `uv run fr harness parity --check` exits 0.
  - id: P3.T4.S2
    text: |-
      fr-goal SKILL.md: "Harness — questions" says OpenCode uses its `question` tool with the same labelling and sequencing rules and fr verifies the answers there (Hermes keeps end-the-turn + `answered_by`); "Harness — spec reviewer" says fr verifies the reviewer id on OpenCode too; §6 tells the orchestrator to put the brief's `review_findings` text verbatim into each reviewer's prompt and give several reviewers distinct letters. Run `uv run --no-project python scripts/sync-opencode.py` AND `uv run --no-project python scripts/sync-hermes.py`; `uv run pytest tests/unit/test_tripwire_opencode_skills_sync.py tests/unit/test_tripwire_hermes_skills_sync.py tests/unit/test_tripwire_skill_tool_neutrality.py -q --no-cov` green.
  - id: P3.T4.S3
    text: |-
      Explainer (spec §J): update docs/explainers/01-fr-goal.md's OpenCode session/question passages (~:361-373) in its existing voice; regenerate the .html per .claude/rules/explainers-currency.md — first re-render the UNMODIFIED .md from `/` with `uv run --isolated --no-project --with markdown --with pyyaml python ~/.claude/plugins/marketplaces/derio-net--blog-craft/tools/render_explainer.py <abs md> --style broadsheet --embed-fonts -o <abs html>` and confirm byte-identical, then render the edited .md. `uv run pytest tests/unit/test_tripwire_explainers_fresh.py -q --no-cov` green.
