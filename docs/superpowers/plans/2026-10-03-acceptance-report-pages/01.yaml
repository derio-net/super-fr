schema_version: 2
phase:
  number: 1
  title: Publish the acceptance report on the Pages site beside the explainers
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - pages-acceptance-report-published
  - pages-explainers-preserved
  - pages-acceptance-report-discoverable
  tier: standard
  files:
  - .github/workflows/pages.yml
  - tests/unit/test_pages_workflow.py
  - tests/unit/test_acceptance_report.py
  - docs/explainers/index.html
  - README.md
  - docs/acceptance/*
  estimate_lines: 220
tasks:
- number: 1
  title: Render test — `--out` under a site dir renders a SHA-pinned, stamped report
    even with failing rows (spec §A step 5, §D)
  steps:
  - id: P1.T1.S1
    text: |-
      RED: in tests/unit/test_acceptance_report.py, next to the existing
      github-mode ad-hoc test (around test_report_adhoc_writes_uncommitted_report_html),
      add test_report_out_under_site_dir_is_sha_pinned_and_stamped. Use the
      file's make_repo + VK_REPO_ROOT harness with a matrix that holds a row with
      `status: failing`. Invoke `fr acceptance report --link-mode github --ref
      <a 40-hex sha> --out _site/acceptance/index.html` through the CliRunner. Assert:
      exit_code == 0, (repo / "_site/acceptance/index.html") exists, the html contains
      `blob/<sha>/`, and it contains `(ref <sha>)` (the git stamp from report.py's
      render_report). Run: `uv run pytest tests/unit/test_acceptance_report.py -q --no-cov -k site_dir`.
      If it passes at once (expected: the CLI already supports this), record that this
      test pins existing behaviour instead of driving new code, and move on.
  - id: P1.T1.S2
    text: |-
      GREEN/REFACTOR: if anything in S1 failed, fix only the test's assumptions
      (stamp format, fixture shape) against packages/fr/src/fr/acceptance/report.py.
      No production change is in scope. Re-run the targeted test until it is green.
- number: 2
  title: Pages workflow test — pin triggers, combined site, render step, no check
    gate (spec §A, §D; R1-R4)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: create tests/unit/test_pages_workflow.py that yaml-loads
      .github/workflows/pages.yml (handle PyYAML parsing the `on` key as True, the
      same way tests/unit/test_ci_budget.py does with ci_budget.workflow_on). Tests:
      (1) push.branches == ["main"] and push.paths has exactly the set {docs/explainers/**,
      docs/acceptance/**, packages/fr/src/fr/acceptance/**}, and workflow_dispatch is
      present; (2) a step whose `run` contains `fr acceptance report` and also contains
      `--link-mode github`, `--ref "$GITHUB_SHA"` (or `${{ github.sha }}`) and
      `--out _site/acceptance/index.html`; (3) a step that copies docs/explainers into
      _site (its run contains `docs/explainers/.` and `_site`), and exactly one step
      uses actions/upload-pages-artifact with `with.path == "_site"`; (4) no step `run`
      contains `fr acceptance check`, and no step has an `if:` that mentions it;
      (5) the render step's env does not set FR_SKIP_MIGRATION (spec §A); (6) the
      workflow `name` is still "Deploy explainers to Pages". Run it and confirm red.
  - id: P1.T2.S2
    text: |-
      GREEN: rewrite .github/workflows/pages.yml as spec §A describes. Keep name,
      permissions, concurrency, environment and every pinned action SHA. Add the two
      extra trigger paths. Add astral-sh/setup-uv pinned to the SHA in
      acceptance-report.yml (c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0) and
      the `uv tool install ./packages/fr` step. Add an "Assemble site" step,
      `mkdir -p _site && cp -R docs/explainers/. _site/`, and a "Render acceptance
      report" step, `fr acceptance report --link-mode github --ref "$GITHUB_SHA" --out
      _site/acceptance/index.html`. Point upload-pages-artifact at `_site`. Add a short
      header comment saying why a single workflow owns the one Pages site (each deploy
      replaces the whole site). Run test_pages_workflow.py and test_ci_budget.py:
      green.
  - id: P1.T2.S3
    text: |-
      REFACTOR: dedupe any YAML-loading helper in test_pages_workflow.py (reuse
      ci_budget.workflow_on if importable the same way test_ci_budget.py imports it).
      Re-run both test files.
- number: 3
  title: Discoverability — explainers index link and README badge (spec §B; R5, R6)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: add test_index_links_to_acceptance_report (index.html contains
      `href="./acceptance/"`) and test_readme_has_acceptance_badge (README.md contains
      `](https://derio-net.github.io/super-fr/acceptance/)` inside a badge, `[![Acceptance]`)
      to tests/unit/test_pages_workflow.py. Run and confirm red.
  - id: P1.T3.S2
    text: |-
      GREEN: docs/explainers/index.html is hand-authored and over a megabyte, so never
      read it whole. Use one targeted edit: insert the new line
      `      <span><a href="./acceptance/">acceptance coverage &rarr;</a></span>`
      straight after the existing `<span><a href="./fr-isolation.html">isolation,
      covered in full &rarr;</a></span>` line in the `.foot` div. In README.md, add the
      badge as the fourth line of the badge row (after the License badge):
      `[![Acceptance](https://img.shields.io/badge/acceptance-report-blue)](https://derio-net.github.io/super-fr/acceptance/)`.
      Run the tests plus tests/unit/test_tripwire_explainers_fresh.py: green.
- number: 4
  title: Acceptance matrix — link the new tests to the rows (spec §E)
  steps:
  - id: P1.T4.S1
    text: |-
      Run `uv run fr acceptance set-status` for each row. pages-acceptance-report-published
      and pages-explainers-preserved go to `skipped`: unit-pinned workflow shape, but the
      live deploy is owed post-merge. Use `--level unit=super-fr:tests/unit/test_pages_workflow.py`
      (add `--level unit=super-fr:tests/unit/test_acceptance_report.py#test_report_out_under_site_dir_is_sha_pinned_and_stamped`
      on the published row) and a --notes saying the live Pages deploy is verified
      post-merge. pages-acceptance-report-discoverable goes to `ci` with
      `--level unit=super-fr:tests/unit/test_pages_workflow.py#test_index_links_to_acceptance_report`
      and `#test_readme_has_acceptance_badge`. Then run `uv run fr acceptance check`: exit 0,
      and the three committed reports regenerated by set-status.
- number: 5
  title: Quality gate
  steps:
  - id: P1.T5.S1
    text: |-
      Run `uv run ruff format tests/` and `uv run ruff check packages/ tests/`, then the
      full suite into a host-visible log after the last code commit, e.g. `uv run pytest -q
      --no-cov -n auto > <scratch>/full-suite.log 2>&1`. Expect all green. Commit.
