tasks:
- number: 1
  title: The pure pass walks a train per repo in a stable order (spec §A; R1, R2, R4 checks, R5)
  steps:
  - id: P1.T1.S1
    text: |-
      RED: in tests/unit/test_triage_batch_drive.py, first give `_snap` an optional `repos: dict[str, str] | None`
      override (default: every batch -> REPO; today it hard-codes `repos=` and forwards **kw, so passing repos=
      would raise TypeError). Then add tests: (a) three ready green PRs in one repo give three `merge` actions in
      train order (wave, then `order`, then id) and `plan.trains == (Train(repo=REPO, head="a", candidates=("a",
      "b", "c"), queued=(), stepped=(), numbers={...}),)`, each merge Action carrying `train=REPO`; (b) the first
      PR pending: no `merge` action at all, it is the head, the rest are queued; (c) the first PR's live head
      differs from its collected head_oid: no merge action, it is the waiting head, the rest are queued; (d) the
      first PR failing: one `warn` (once per head sha, the existing rule), stepped=(it,), the second is the head
      and gets the merge action; (e) green a, pending b, green c: one merge action (a), head a, queued == (b, c);
      (f) PRs in two repos (via the repos override) give two Trains ordered by repo, each with its own head;
      (g) order stability: three members whose explicit `order` is unset and that share files (so merge_order's
      adjacency search could rearrange them once one leaves) keep the id order; after a is removed from the
      queue (merged), b is the head; (h) R5: with no stored state, a member earlier in the order that is green
      now is the head and gets the merge action although a later member is pending; (i) Summary.queued equals
      the number of queued members, the waiting head excluded. Keep test_merges_follow_the_merge_order green
      (explicit order 1 before 2). Run `uv run pytest tests/unit/test_triage_batch_drive.py -q --no-cov`:
      the new tests fail (no Train yet).
  - id: P1.T1.S2
    text: |-
      GREEN: in packages/fr/src/fr/triage/batch_drive.py add the frozen `Train` dataclass (repo, head,
      candidates, queued, stepped, numbers: Mapping[str, int]), `Pass.trains: tuple[Train, ...] = ()`,
      `Action.train: str = ""`, `Summary.queued: int = 0`. Rewrite step 1 of drive_pass as the spec §A walk:
      sort snap.queue by `_dispatch_key(entry.batch)` (no merge_order here), group by snap.repos.get(bid, "")
      keeping that order; per member: missing/not OPEN/draft -> skip; failing -> warn once per head, stepped;
      moved head or pending -> stop (the head when no candidate came before, else the first queued), the rest
      queued; green -> merge action with train=repo, candidate, continue. Summary.queued = total queued. Drop the
      now-unused merge_order import if nothing else uses it. Re-run the file: green.
  - id: P1.T1.S3
    text: |-
      REFACTOR: extract the per-repo walk into a helper (`_walk_train`) so drive_pass stays readable; keep the
      purity test (test_the_pass_module_reaches_no_runner_git_process_or_clock) green; re-run the file.
- number: 2
  title: train_line and summary_line (spec §C; R6)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: tests for `train_line(train)`: `train derio-net/super-fr: head a (PR #12) · then b (#13), c (#14) ·
      queued d (#15) · stepped over e (#16)`; `then` lists candidates[1:]; empty parts omitted; no head reads
      `train <repo>: no head · stepped over …`. summary_line appends `, queued N` only when N > 0, in the order
      `..., closing C, queued N, blocked B`. Run them: red.
  - id: P1.T2.S2
    text: |-
      GREEN: implement train_line in batch_drive.py from Train.numbers (filled by drive_pass from the queue
      entries' PR numbers) and extend summary_line. Re-run: green.
- number: 3
  title: HeadMovedError tells a moved head from a refusal (spec §B; R3, R4, R8)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: in tests/unit/test_triage_batch_merge_ready.py, using the file's existing fakes, assert that
      merge_ready on a PR whose re-read head differs from the slot's head raises `HeadMovedError`, and that
      `issubclass(HeadMovedError, MergeStopError)`. Run it: red (no such class).
  - id: P1.T3.S2
    text: |-
      GREEN: in packages/fr/src/fr/triage/batch_merge.py add `class HeadMovedError(MergeStopError)` with a
      docstring (the head moved since the plan; the driver stops a train on it, R3) and raise it from
      `_open_head`'s head-moved branch (same message). Re-run tests/unit/test_triage_batch_merge_ready.py and
      every tests/unit/test_triage_batch_merge*.py: green (existing MergeStopError catches still hold).
- number: 4
  title: The executor stops a train at the first head that does not merge (spec §B; R3, R4)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: in tests/unit/test_triage_batch_drive_cmd.py, with the World/DriveCheckout fixtures and
      triage_batch_cmd.merge_ready monkeypatched to a scripted fake that returns MergeAttempt outcomes (or raises)
      per PR number, add: (a) three ready green PRs, the first `updated`: the other two print
      `merge <id>: queued: behind <head>` and the fake is called exactly once; (b) the first `merged`: the second
      is attempted in the same pass; (c) the first raises MergeStopError: reported (`stopped: ...`), and the second
      is attempted; (d) the first raises HeadMovedError: reported, and the train stops; (e) the first returns
      `pending`: the train stops; (f) the head-moved hold (slots[0].head != action.head) stops the train; (g) the
      first `failing` or `draft` at merge time: the second is attempted; (h) two repos: a stop in one does not stop
      the other; (i) the summary line shows `queued N` for the candidates answered `queued`. Run the file: red.
  - id: P1.T4.S2
    text: |-
      GREEN: in packages/fr/src/fr/commands/triage_batch_cmd.py, _Driver gets per-pass
      `_stopped: dict[str, str]` (repo -> the batch whose outcome stopped it) and `_queued: int`, reset in
      run_pass beside _unlanded. In _act, a merge action whose train is in _stopped returns
      `queued: behind <batch>`, adds the batch to _unlanded and increments _queued, without calling _merge_batch.
      _merge_batch also returns whether its outcome stops the train, per the spec §B table (catch HeadMovedError
      before MergeStopError; it is reported once like a refusal); _act records the stop. settle gains
      `queued: int = 0`, added to Summary.queued; run_pass passes self._queued. Re-run the file: green.
  - id: P1.T4.S3
    text: |-
      REFACTOR: keep the stop decision in one place (a small function or table beside _merge_batch) instead
      of branches spread over _act; re-run tests/unit/test_triage_batch_drive_cmd.py and
      tests/unit/test_triage_batch_drive.py.
- number: 5
  title: Train lines printed before the actions, in plan mode and with --yes (spec §C; R6)
  steps:
  - id: P1.T5.S1
    text: |-
      RED: command-level tests: plan mode (no --yes) and --once --yes both print the `train <repo>: ...` line
      before the pass's first action line; no train line when the repo has no ready PR. Run: red.
  - id: P1.T5.S2
    text: 'GREEN: run_pass prints train_line for each of plan.trains before iterating the actions. Re-run: green.'
- number: 6
  title: The fr-triage skill states the merge train (spec §D; R9)
  steps:
  - id: P1.T6.S1
    text: |-
      In plugins/super-fr/skills/fr-triage/SKILL.md, replace "each pass merges every green non-draft batch PR
      (readying one stays the operator's)" with the merge train: per repo, only the head of the ready PRs (wave,
      order, id) is merged or updated, the next follows in the same pass, a failing or refused PR is stepped over,
      and each pass prints a train line and `queued N` (readying a PR stays the operator's). Then run
      `uv run --no-project python scripts/sync-opencode.py` and `uv run --no-project python scripts/sync-hermes.py`
      and confirm `--check` passes for both; run tests/unit/test_tripwire_opencode_skills_sync.py,
      test_tripwire_hermes_skills_sync.py and test_skill_validation.py: green.
- number: 7
  title: Change fragment, acceptance rows, and the full gate
  steps:
  - id: P1.T7.S1
    text: |-
      Add .changes/feat-batch-drive-merge-train.yaml with `bump: minor` and the summary
      `fr triage batch drive merges each repo's ready PRs as a merge train: only the head is updated or merged,
      failing and refused PRs are stepped over, and each pass prints the train`.
  - id: P1.T7.S2
    text: |-
      Move rows drive-merge-train-head-only, drive-merge-train-step-over and drive-merge-train-output to `ci`
      with `uv run fr acceptance set-status --id <row> --status ci --notes "<why>" --level
      unit=super-fr:tests/unit/<file>.py#<test_name>` (name-anchored refs to the new tests); it regenerates the
      three reports. Leave drive-merge-train-live-wave not-implemented (post-merge).
  - id: P1.T7.S3
    text: |-
      Gate: `uv run ruff format packages/ tests/`, `uv run ruff check packages/ tests/`,
      `uv run mypy packages/fr/src`, `uv run fr acceptance check`, then the full suite
      `uv run pytest -q --no-cov -n auto` into a log outside the repo; all green.
