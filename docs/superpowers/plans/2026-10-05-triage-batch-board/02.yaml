schema_version: 2
phase:
  number: 2
  title: The board — model, page and `fr triage board` (R1–R7, R10, R14, R15)
  tag: agentic
  depends_on:
  - 1
  tracking_issue: null
  acceptance:
  - triage-board-columns
  - triage-board-card-detail
  - triage-board-session-status
  - triage-board-untrusted-text
  - triage-board-jump-focus
  tier: standard
  files:
  - packages/fr/src/fr/triage/kanban.py
  - packages/fr/src/fr/triage/kanban_render.py
  - packages/fr/src/fr/triage/batch_drive.py
  - packages/fr/src/fr/commands/triage_kanban_cmd.py
  - packages/fr/src/fr/commands/triage_batch_cmd.py
  - tests/unit/test_triage_kanban.py
  - tests/unit/test_triage_kanban_render.py
  - tests/unit/test_triage_kanban_cmd.py
