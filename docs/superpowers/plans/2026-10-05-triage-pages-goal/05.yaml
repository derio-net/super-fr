  - id: P5.T2.S2
    text: |-
      Verify: import the state into a temp dir with `uv run fr triage state import`, then
      `uv run fr triage architecture render --dir <tmp>` and `history render --dir <tmp>` print no
      missing-fragment or moved-name warning. Full suite into `$TMPDIR/p5-suite.log`. Commit and push.
