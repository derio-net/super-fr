      matrix → no-op; a RetargetError warns and touches nothing; the single-plan
      moved-then-exit-2 case still retargets. Fails.
  - id: P2.T2.S2
    text: |-
      GREEN: implement the retarget step (own = resolve_identity(matrix, root)[1]; render
