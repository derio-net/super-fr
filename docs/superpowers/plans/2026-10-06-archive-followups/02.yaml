    text: |-
      GREEN: packages/fr/src/fr/acceptance/retarget.py — a line-based walker tracking the
      current row id and key block; it rewrites only `- <ref>` items under `origin:` or
      under a level key of `levels:`, then re-parses with
      fr.artifacts.structure._StrictLoader into Matrix and checks equality with the
      original plus changes, else raises RetargetError. Tests green.
  - id: P2.T1.S3
    text: |-
      REFACTOR: reuse split_ref from acceptance/model.py rather than re-parsing refs;
      ruff/mypy clean.
