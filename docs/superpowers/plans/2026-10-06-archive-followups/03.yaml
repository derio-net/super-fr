  title: RED/GREEN — shared resolution_entry builder (R12)
  steps:
  - id: P3.T1.S1
    text: |-
      RED: a test that fr.journal.model.resolution_entry(...) for a deferral (target
      finding, taken ids, stamp, tracked_by=url, body=note, phase) equals the entry
      record/apply.py builds for the same deferral today (same id, title, state=open,
