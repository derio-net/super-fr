tasks:
- number: 1
  title: Smoke — the suite is green on this branch before any change
  steps:
  - id: P1.T1.S1
    text: |-
      Smoke (spec R5-R6 baseline): run `uv run pytest tests/unit/test_hostclient.py tests/unit/test_tripwire_forge_adapter.py -q --no-cov`
      from the workspace and confirm it passes. Also confirm that `gh pr checks 994` (CI on the draft PR) is not red
      for a reason this branch caused. If anything is red, record it as the phase's first discovery.
- number: 2
  title: GH_HOST through fr.gh and RealGhClient(host=) (spec §4.E, R6)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: create tests/unit/test_gh_host.py (spec Test Plan 3, 4). Monkeypatch `subprocess.run` in `fr.gh` with a recorder.
      Assert that `RealGhClient(host="ghe.example").view_issue(...)` (a `_run_gh` path) and `.pr_body(ref, cwd=...)`
      (the `view_pr_body` path) each run with `env["GH_HOST"] == "ghe.example"`. Assert that `RealGhClient()` passes
      `env=None` on both. Assert that a bare `fr.gh.list_issues(...)` passes `env=None` both after a hosted call
      returns and after one raises `GhError`. Run it and confirm it fails.
  - id: P1.T2.S2
    text: |-
      GREEN: in packages/fr/src/fr/gh.py add:
      - `_HOST: contextvars.ContextVar[str | None]` (default None);
      - `_env()`, which returns None when `_HOST` is unset, else `{**os.environ, "GH_HOST": host}`;
      - a `host_scope(host)` context manager: `token = _HOST.set(host)`, then `_HOST.reset(token)` in `finally`.
      Pass `env=_env()` in both `_run_gh` and `view_pr_body`.
      In real_ghclient.py give `RealGhClient` an `__init__(self, host: str | None = None)` and wrap every method
      that delegates to `_gh` in `with _gh.host_scope(self._host):` (a small decorator or helper is fine).
      Run test_gh_host.py and confirm it is green.
  - id: P1.T2.S3
    text: |-
      REFACTOR: if the per-method wrapping repeats, fold it into one helper. Rerun test_gh_host.py and
      whichever tests/unit/test_real_ghclient*.py files exist, and confirm they are green.
- number: 3
  title: client_for / client_for_backend thread the host to GitHub (spec §4.E reach,
    R6)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: in tests/unit/test_hostclient.py (spec Test Plan 5):
      - rewrite `test_a_declared_v2_forge_host_for_an_unthreaded_backend_warns` to declare
        `forge: {type: gitea, host: x.example.com}`, still asserting the warning;
      - add a test that `forge: {type: github, host: ghe.example}` builds a `RealGhClient` whose host is
        `ghe.example`, with NO warning;
      - add a test that a github checkout with a non-SaaS origin host and nothing declared yields a
        `RealGhClient` with host None;
      - add a test that `client_for_backend("github", host="ghe.example")` threads the host.
      Confirm the tests are red.
  - id: P1.T3.S2
    text: |-
      GREEN: in packages/fr/src/fr/hostclient.py:
      - `client_for_backend` returns `RealGhClient(host=host)` for github;
      - `client_for` passes the GitHub backend `_hosts.declared_host(repo_root)`, and GitLab
        `_hosts.host_for(repo_root)` as today;
      - the declared-host warning fires only when backend == "gitea".
      Update the docstrings that say gh resolves its own host. Run test_hostclient.py and confirm it is green.
- number: 4
  title: client_for_url shared by pr_state and triage batch make_client (spec §4.D,
    R5)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: write tests for `hostclient.client_for_url` (Test Plan 2):
      - `https://ghe.example/o/r/pull/3` gives a github client with host "ghe.example";
      - `https://github.com/o/r/pull/3` gives host None;
      - `https://gitlab.example/g/p/-/merge_requests/1` gives a glab client with host "gitlab.example".
      Also test that `triage_batch_cmd.make_client("https://ghe.example/o/r")` returns a client whose host is
      "ghe.example", and None for github.com. Confirm the tests are red.
  - id: P1.T4.S2
    text: |-
      GREEN:
      - add `client_for_url(url)` to hostclient.py (body as in spec §4.D);
      - make packages/fr-vk/src/fr_vk/pr_state.py call it: delete its private `_client_for_url` and update
        its callers;
      - make `triage_batch_cmd.make_client` return `client_for_url(url)`.
      Run the new tests plus
      `uv run pytest tests/unit -q --no-cov -n auto -k "pr_state or triage_batch or hostclient"` and confirm green.
- number: 5
  title: Change fragment and phase gate
  steps:
  - id: P1.T5.S1
    text: |-
      Add `.changes/feat-batch-forge-remainder.yaml` with `bump: patch` and the summary "Forge calls all go through the
      adapter: triage collect, isolation lookups and the fr-vk rate-limit guard. Triage batch verbs and a declared
      GitHub Enterprise host now reach the right instance (#742, #892)".
      Then run, in order, and confirm all green:
      - `uv run ruff format packages/ tests/`
      - `uv run ruff check packages/ tests/`
      - mypy (the AGENTS.md command)
      - the full suite: `uv run pytest -q --no-cov -n auto > <host-visible log> 2>&1`
