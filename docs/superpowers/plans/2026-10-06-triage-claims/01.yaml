schema_version: 2
phase:
  number: 1
  title: Claims core — scope identity, the claim marker, forge comment ids and edits,
    claim writes, facts, check sets, the claim and scope commands, batch-command gates
    (R1–R12, R15)
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - triage-claims-identity
  - triage-claims-hands-off
  - triage-claims-expiry
  - triage-claims-writes
  skeleton: true
  tier: hard
  files:
