- number: 2
  title: Command execution and backfill (spec §3.F, R11)
  steps:
  - id: P2.T2.S1
    text: |-
      RED in tests/unit/test_triage_batch_drive_cmd.py: `_Driver.snapshot` fills the claim fields from facts,
      the scope id and the scope config; a `--yes` pass writes owed claims (a dispatched pre-claims batch is
      backfilled), refreshes, releases and appends one `claims_released` event per released batch, so the next
      pass owes nothing; a claim that returns Held stops the pass acting on that batch and prints the held
      line. Run — fails.
  - id: P2.T2.S2
    text: |-
