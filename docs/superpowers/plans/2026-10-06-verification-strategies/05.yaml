  title: RED/GREEN — structured conflict and ConflictEvent (judgements 4→5)
  steps:
  - id: P5.T1.S1
    text: |-
      RED: batch_merge tests — an unresolvable conflict raises MergeConflictError
      (a MergeStopError) carrying batch, head and the refused paths, message unchanged.
      Model tests — ConflictEvent (kind conflict; at, head, paths, delivered
      session|fresh|held, handle) round-trips; a judgements file with a conflict event
