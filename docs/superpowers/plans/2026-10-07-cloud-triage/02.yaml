tasks:
- number: 1
  title: 'Verify CI on HEAD (R22, §I)'
  steps:
  - id: P2.T1.S1
    text: |-
      RED: tests/unit/test_run_ci_evidence.py — `fr.run.ci_evidence.verify_ci(repo_root, client)` over a tmp repo with a bare remote and a fake client returning check runs and statuses for a sha: all completed success/skipped/neutral → returns `ci:<sha>;tree=<code_tree(HEAD)>`; HEAD not equal to the remote branch head → `CiEvidenceRefused` naming the unpushed commit; a dirty code path → refused naming it; no check present → refused "CI has not finished for <sha>"; one in progress → same; one failed → refused naming the check and its URL; `fr services` CI `none` → refused before any forge call. Fails (no module).
  - id: P2.T1.S2
    text: |-
      GREEN: packages/fr/src/fr/run/ci_evidence.py — the remote head via `git ls-remote origin refs/heads/<branch>` (through fr.git), `fr.run.code_tree.code_tree`/`dirty_code_paths`, the checks via a new `GhClient.commit_checks(repo, sha)` (REST: `GET commits/{sha}/check-runs` + `/status`; GraphQL client: the same REST routes through `gh api`, which both backends may call), `CiEvidenceRefused`. glab/tea raise `UnsupportedForgeOperation`. Run: passes.
- number: 2
  title: 'Accept `tests: ci` in run resolve'
  steps:
  - id: P2.T2.S1
    text: |-
      RED: tests/unit/test_run_resolve_tests_ci.py — `fr run resolve --step implement-phase --item phase/<n> --record <r>` with `evidence: {tests: ci}` and a green fake forge records `tests=ci:<sha>;tree=<tree>`; the same on `deliver`; `tests: reuse` afterwards accepts that witness while the tree is unchanged; a pending check exits 2 with the "resolve again when CI finishes" line and the cursor unmoved; a local log is still accepted exactly as before (existing resolve tests unchanged). Fails.
  - id: P2.T2.S2
    text: |-
      GREEN: in run_cmd's evidence block, `offered["tests"] == "ci"` routes to `ci_evidence.verify_ci` for both the phase and the flat path, before the local-log branches; `_latest_tests_witness` already reads `;tree=`. Run the new file and tests/unit/test_run_*tests*.py: pass.
  - id: P2.T2.S3
    text: |-
      RED/GREEN: tests/scenarios/cloud-triage-ci-evidence.sh (row cloud-triage-ci-evidence's `candidate` scenario, run by tests/integration/test_scenarios.py): a fresh fixture repo with a bare remote and a fake `gh` on PATH serving `commits/{sha}/check-runs` and `/status`; with HEAD pushed and all checks green, `fr run resolve … --record <r>` carrying `tests: ci` exits 0; with one check `in_progress` it exits 2 printing "resolve again when CI finishes" and the cursor file is byte-identical; with an unpushed commit it exits 2 naming it. Run test_scenarios.py: passes.
- number: 3
  title: 'Tell the executor and fr-goal'
  steps:
  - id: P2.T3.S1
    text: |-
      RED: a prose test (extend tests/unit/test_skill_validation.py or a new tests/unit/test_fr_goal_ci_evidence_prose.py) asserting fr-goal §5/§8 and the fr-phase-executor agent name `tests: ci` as an alternative to the local log (commit, push, return `tests_log: ci`; the orchestrator resolves when CI finishes) and that a run using it opens its draft PR when `implement` starts. Fails.
  - id: P2.T3.S2
    text: |-
      GREEN: edit plugins/super-fr/skills/fr-goal/SKILL.md and plugins/super-fr/agents/fr-phase-executor.md (harness-neutral wording; the tool-neutrality tripwire scans them); run `scripts/sync-opencode.py` and `scripts/sync-hermes.py`, commit the mirrors. Run the prose test, the three mirror tripwires and tests/unit/test_tripwire_skill_tool_neutrality.py: pass.
  - id: P2.T3.S3
    text: |-
      Quality gate: ruff format/check, mypy, then push and let the PR's CI run the full suite; this phase's own evidence may be `tests: ci` once phase 2's code is on HEAD.
