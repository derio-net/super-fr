tasks:
- number: 1
  title: State directory in the workspace (R4)
  steps:
  - id: P2.T1.S1
    text: |-
      RED: tests/unit/test_triage_state_workspace.py — in a tmp git repo with a linked worktree, `state_dir(scope, workspace=<worktree>)` is `<worktree>/.fr/triage-state/<scope>/`; first use appends `.fr/triage-state/` to `$(git rev-parse --git-common-dir)/info/exclude` once (idempotent), and `git status --porcelain` stays empty after writing a file there; an existing `~/.cache/fr/triage/<scope>/` is copied in on first use and left in place, and not copied again; an org scope outside any clone with no `--workspace` raises `TriageError` naming the flag. Fails.
  - id: P2.T1.S2
    text: |-
      GREEN: `fr.triage.model.state_dir(scope, override=None, *, workspace=None)` resolves the workspace (explicit, else the git toplevel of cwd via `gitseam`), ensures the exclude entry and the one-time import; `--workspace PATH` is added beside `--dir` on the triage commands that take `--dir`; `--dir` keeps winning. Update `fr.artifacts.trigger.READ_ONLY_COMMANDS`'s rationale comment for `triage` (still no registered artifact; it writes its own state dir and refs). Run the file and tests/unit/test_triage_model.py: pass.
- number: 2
  title: 'The state ref: REF_FILES, fetch and compare-and-swap push (R5)'
  steps:
  - id: P2.T2.S1
    text: |-
      RED: tests/unit/test_triage_state_ref.py — with a bare tmp remote: `push_state` writes `refs/fr/triage/<scope-id>` whose tree holds exactly `REF_FILES` that exist (judgements.yaml, origins.yaml, subsystems.yaml, board/, origins/, architecture/, history/, snapshots/, authored-src/, merge-stops.json, lease.yaml, scope-durable.yaml, requests.yaml, sessions.yaml, rehomes.yaml) and never facts.json, rendered pages or scope.yaml; `fetch_state` into a fresh clone restores every entry byte for byte; a push whose expected old value is stale fails (`StateRefConflict`) and changes nothing; the ref is not listed by `git branch -a`. Fails.
  - id: P2.T2.S2
    text: |-
      GREEN: packages/fr/src/fr/triage/state_ref.py — `REF_FILES` (tuple, the one list), `ref_name(scope_id)`, `fetch_state(state_dir, remote_repo, scope_id) -> str | None` (old sha), `push_state(state_dir, remote_repo, scope_id, *, expected_old)`. Git runs only through `fr.triage.gitseam` (new `fetch_ref`, `push_ref_cas` using `git push --force-with-lease=<ref>:<old>`, `commit_tree_from_paths` building a commit with `git hash-object`/`mktree`/`commit-tree` in a temp index, never touching the worktree's index). `state_sync`'s DURABLE_FILES/DURABLE_DIRS are derived from or asserted equal to the file/dir subset of REF_FILES. Run: passes.
- number: 3
  title: Durable settings and where the ref lives (R6, R7, R11)
  steps:
  - id: P2.T3.S1
    text: |-
      RED: tests/unit/test_triage_state_repo.py — `ScopeConfig` accepts optional `state_repo` and `forge_api`; `scope-durable.yaml` round-trips both; `decide_state_repo(repos, visibility, ask)`: one repo → that repo, no question; a mixed set → asks among the private ones only; all public → asks between "a new repo for the refs" and each public repo, and the warning text names the leak; non-interactive with none decided → state stays local and one warning per pass. A restore into a fresh workspace recovers `state_repo` and `forge_api` and writes `forge.api` to `~/.config/fr/forge.yaml` only when that file is absent (`fr.forgeapi.write_default`). Fails.
  - id: P2.T3.S2
    text: |-
      GREEN: fields on `ScopeConfig`; `fr.triage.state_ref.decide_state_repo` (pure; the prompt is injected); collect records each scope repo's `visibility` in facts from `GET repos/{r}` (REST, already read by the github-rest client); the first collect of a scope with no `state_repo` decides it and writes scope-durable.yaml plus the scope.yaml mirror. Run: passes.
- number: 4
  title: The privacy guard (R8)
  steps:
  - id: P2.T4.S1
    text: |-
      RED: tests/unit/test_triage_privacy.py — `leak_risk(keys, state_repo, visibility)` true iff a key's repo is private and the state repo public; `batch create --issue`, `batch edit --add-issue`, the wave setters, a judgement write adding a key, `push_state` and `state export` each exit 2 naming the issue, its repo and the state repo when it is true, and proceed when the state repo is private; `push_state` reads the state repo's visibility with `GET repos/{state_repo}` immediately before writing, also when the state repo is outside the scope and when facts.json is absent (then the keys' repos are read the same way); an unreadable visibility refuses the push. Fails.
  - id: P2.T4.S2
    text: |-
      GREEN: packages/fr/src/fr/triage/privacy.py (`leak_risk`, `check_or_refuse`, `live_visibility(client, repo)`); call sites in triage_batch_cmd (create/edit/wave), the judgement writer, `state_ref.push_state` and `triage_state_cmd` export. Run the privacy tests and the existing triage batch tests: pass.
  - id: P2.T4.S3
    text: |-
      REFACTOR + quality gate: one `_refuse(issue, repo, state_repo)` message builder shared by every call site; ruff format/check, mypy, full suite `-n auto` into a log outside the repo; green.
