tasks:
- number: 1
  title: The agents artifact kind (R19)
  steps:
  - id: P6.T1.S1
    text: |-
      RED: tests/unit/test_tripwire_agents_data.py — `packages/fr/src/fr/agents/{fr-spec-reviewer,fr-phase-executor}.md` (wheel package data) are byte-identical to `plugins/super-fr/agents/`, and a pinned sha256 per file in `fr.agents.CANONICAL_SHA256` matches: changing a canonical agent without bumping the `agents` kind's `current_version` and the pin fails with a message saying so. tests/unit/test_agents_artifact.py — `render_agent(name, version)` = canonical text with `fr_artifact_version: <v>` added to its front matter; `fr init` writes both into `.claude/agents/`; `fr validate artifacts` passes them and fails one missing, unstamped, with mismatched `name`, or stale; `iter_paths_of` locates exactly the two files. Fails.
  - id: P6.T1.S2
    text: |-
      GREEN: scripts/sync-agents-data.py (copy + `--check`), the data copy, `fr.agents` (paths via importlib.resources, `render_agent`, `CANONICAL_SHA256`); registry `ArtifactKind(name="agents", current_version=1, locator=".claude/agents/fr-*.md", stamp="`fr_artifact_version` in the agent's front matter", read/write via the spec kind's front-matter helpers generalised to a key parameter, validate=validate_agents)`; `fr init scaffold` gains the agents step. Re-run test_tripwire_artifact_kinds.py and test_migration_runner.py (no migration registered at version 1): pass.
  - id: P6.T1.S3
    text: |-
      RED/GREEN: the re-render migration path — a test that registers a temporary version 2 in a monkeypatched registry and checks `fr migrate artifacts --yes` re-renders both files from the installed wheel copy, atomically, refusing (byte-identical) a file whose `name` is not one fr ships; document in agents_kind.py that the first real bump registers this migration. Replace this repo's `.claude/agents/*.md` symlinks with rendered, stamped files via `uv run fr init` (or the agents step alone) and commit. Run the agents tests and `uv run fr validate artifacts`: pass.
- number: 2
  title: Setup script, install.sh and the worker brief (R19)
  steps:
  - id: P6.T2.S1
    text: |-
      RED: tests/unit/test_install_sh.py — with a HOME lacking `~/.claude/plugins/installed_plugins.json` or `~/.claude/settings.json`, `scripts/install.sh` exits non-zero naming the missing file instead of warning and exiting 0. tests/unit/test_triage_worker_brief.py — the batch brief (`batch_dispatch.render_brief`) for a claude-cloud batch starts with: check `fr --version`, install super-fr when missing; confirm `fr-spec-reviewer` and `fr-phase-executor` are dispatchable agent types; when not, end the turn BLOCKED with a needs_action naming the `agents` artifact (`fr init` / `fr migrate artifacts --yes`); no rehome request is emitted for that state; enter isolation with `fr isolation up` before any edit. Fails.
  - id: P6.T2.S2
    text: |-
      GREEN: install.sh fails on the two missing files (message names them and the seeding commands); the brief section, rendered only for runners without plugin-loaded agents (claude-cloud). docs/cloud-setup.md documents the environment setup script (apt install rsync, seed the two files, clone the marketplace, run install.sh, write `api: rest` to ~/.config/fr/forge.yaml) and the driver's per-wake host-id write. Run: passes.
- number: 3
  title: post_merge in the cloud, the skill and its mirrors (R20, R21)
  steps:
  - id: P6.T3.S1
    text: |-
      RED: tests/unit/test_triage_skill_docs.py — the fr-triage skill names the cloud driver (`fr triage drive pass`/`record`, wakes, outbox execution), `forge.api`, the state ref, the state repo choice and the privacy guard, and stays within its existing line budget; the cloud driver's `post_merge` is a no-op (asserted in the adapter test from phase 3, extended here to the shipped skill text). Fails.
  - id: P6.T3.S2
    text: |-
      GREEN: edit plugins/super-fr/skills/fr-triage/SKILL.md within budget (move detail into docs/cloud-setup.md, linked); run `scripts/sync-opencode.py` and `scripts/sync-hermes.py` and commit the mirrors; AGENTS.md gains short entries for `fr.forgeapi`, `real_ghrestclient`, `fr/triage/{state_ref,privacy,lease,driver,drift}.py`, `fr-claude-cloud` and the `agents` kind; update the docs/explainers page that describes fr-triage if it names the driver's host-only state (regenerate the .html per .claude/rules/explainers-currency.md, or record in the PR body that it is owed). Run the skill tests, the three mirror tripwires and test_skill_validation.py: pass.
  - id: P6.T3.S3
    text: |-
      Quality gate: ruff format/check, mypy, `uv run fr validate artifacts`, `uv run fr acceptance check`, full suite `-n auto` into a log outside the repo; all green.
