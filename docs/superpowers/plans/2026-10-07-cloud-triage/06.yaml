tasks:
- number: 1
  title: Run kind 9 → 10 (R16)
  steps:
  - id: P6.T1.S1
    text: |-
      RED: tests/unit/test_migration_run_fr_version.py — `RunState.fr_version: str | None = None`; `fr run start` records the running fr's version; the `run` kind's `current_version` is 10; the 9 → 10 migration is stamp-only and refuses a cursor that does not read as v9 (left byte-identical, reported as that artifact's failure); a body already wholly v10 lets the runner finish the stamp; `fr validate artifacts` accepts a v10 cursor; the chain test asserts every hop `[2, …, 10]` (extend `test_the_run_kind_is_reachable_all_the_way_from_version_one_to_…`). Fails.
  - id: P6.T1.S2
    text: |-
      GREEN: field on RunState; registry `current_version=10` with its comment; packages/fr/src/fr/artifacts/run_fr_version.py (SchemaMigration, imported by fr/artifacts/__init__.py) following run_driver.py's stamp-only pattern (no field removed, so no new frozen model); `fr run start` sets it. Run `uv run fr migrate artifacts --yes` in the workspace and commit the migrated cursors in the same commit. Run the migration tests and `uv run fr validate artifacts`: pass.
- number: 2
  title: Drift detection and re-home (R17)
  steps:
  - id: P6.T2.S1
    text: |-
      RED: tests/unit/test_triage_drift.py — for each active batch, the pass reads the run cursor from the batch branch head (`read_file_at_ref`, REST) and compares `fr_version` major with the latest release's: equal → nothing; different → one `rehome` request at the session's next idle, recorded in rehomes.yaml per (run, release), never two, also after a restore from the ref; no recorded version → reported once, never re-homed. Fails.
  - id: P6.T2.S2
    text: |-
      GREEN: packages/fr/src/fr/triage/drift.py (pure: cursors + latest release in, requests out) called from the pass; latest release read via the forge client's releases route. Run: passes.
  - id: P6.T2.S3
    text: |-
      RED/GREEN: tests/scenarios/cloud-triage-version-drift.sh (row cloud-triage-version-drift's `candidate` scenario, run by tests/integration/test_scenarios.py, fake forge only): two active batches whose cursors record `fr_version` 5.x and 6.x against a latest release of 6.y; one `drive pass` writes exactly one `rehome` request (for the 5.x run) to the outbox; a second pass after `drive record` writes none; a third batch with no recorded version is reported, not re-homed. Run test_scenarios.py: passes.
- number: 3
  title: The driver updates itself (R18)
  steps:
  - id: P6.T3.S1
    text: |-
      RED: in test_triage_drift.py — before each pass: installed fr older than the latest release → reinstall (an injected installer) and re-exec the pass; latest major differs from the driver session's own start major → emit a self-`rehome` request and stop the pass; the re-homed driver keeps its lease (identity `cloud:<host id>`). Fails.
  - id: P6.T3.S2
    text: |-
      GREEN: self-update step in triage_drive_cmd's pass (installer injected; the real one runs the cloud setup's documented install). Run, then the quality gate: ruff, mypy, full suite `-n auto` into a log outside the repo; green.
