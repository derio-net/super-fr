tasks:
- number: 1
  title: '§F (R9, R10, R12): registry, presence, and the header on every page including
    the board'
  steps:
  - id: P4.T1.S1
    text: |-
      RED in tests/unit (components and each renderer): PAGES order and titles are Backlog (triage.html), Batches (board.html), Origins, Architecture, History; pages_present(state_dir, current) is the keys whose file exists plus current; page_header(current, present) links only present pages, with aria-current on current, followed by current's goal; board.html carries the nav and the goal "What is running, and what needs me?", and its header says "Batches".
  - id: P4.T1.S2
    text: |-
      GREEN: implement in components.py; every render command (triage render, history, origins, architecture, and kanban's write_board) computes pages_present and passes it. Re-run: green.
- number: 2
  title: '§F (R11): refresh_navs keeps every existing page''s nav current; the publish
    copy strips the nav'
  steps:
  - id: P4.T2.S1
    text: |-
      RED: in a state dir where triage.html and history.html were rendered first, rendering the board updates history.html's nav to include Batches; a page whose nav already matches is not rewritten (content and mtime unchanged); a page with no nav block is left byte-identical and named in a warning; the rewrite goes through write_text_atomic. The publish step hands the publish command a temp copy of board.html with no <nav class="pages">, while the local board.html keeps it.
  - id: P4.T2.S2
    text: |-
      GREEN: components.refresh_navs(state_dir, current), called by each render command after its write; write_board's publish passes the nav-stripped temp copy. Re-run: green.
  - id: P4.T2.S3
    text: |-
      REFACTOR: one compiled pattern for the nav block, shared by refresh_navs and the publish strip.
- number: 3
  title: Skill text, mirrors, browser check, scenario and matrix
  steps:
  - id: P4.T3.S1
    text: |-
      Edit plugins/super-fr/skills/fr-triage/SKILL.md "Pages and state": the pages per scope kind (Backlog and History once rendered, Batches once the board is rendered, Origins and Architecture only where rendered, Architecture being single-repo), that the nav follows them, the Backlog/Batches names (fix the "the board" wording near :46), and `clean-labels`. Stay at or under 120 lines (net-zero). Run scripts/sync-opencode.py AND scripts/sync-hermes.py; run the three mirror tripwires and test_skill_validation, targeted.
  - id: P4.T3.S2
    text: |-
      Browser check (visual row): render an org-scope state dir (triage, board and history) and a single-repo one with all five pages into a git-ignored scratch dir; screenshot org-scope-nav, repo-scope-five-tabs, current-tab-marked and phone-width-nav (390px); follow each tab link (nav-link-each-tab) and confirm none 404s; open every shot; fill the record's visual section.
  - id: P4.T3.S3
    text: |-
      Add tests/scenarios/triage-nav-pages.sh: from an org-scope fixture, render triage, then history, then the board; assert history.html's nav lists Backlog, Batches and History only, and that no page links origins.html or architecture.html. Run it targeted. Then set-status triage-nav-present-pages to ci with --scenario and a unit level ref, with notes.
