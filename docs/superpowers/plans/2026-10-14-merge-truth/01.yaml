schema_version: 2
phase:
  number: 1
  title: 'Closed issues settle: claims released, both labels removed; release-pending
    true; take records first; retire updates facts (R1-R6, R15)'
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - triage-closed-issues-unclaimed
  - triage-release-pending-true
  - triage-claim-take-recorded-first
  - triage-retire-then-sync
  - triage-closed-in-progress-set
  skeleton: true
  tier: standard
  files:
  - packages/fr/src/fr/triage/claim_writes.py
  - packages/fr/src/fr/triage/claim_sync.py
  - packages/fr/src/fr/triage/claims.py
  - packages/fr/src/fr/triage/collect.py
