tasks:
- number: 1
  title: Live checks for head-found archive PRs; linked archive PRs from issue.prs
    (R7)
  steps:
  - id: P2.T1.S1
    text: |-
      Red: in `test_triage_batch_merge.py`, add `test_pr_checks_verdict_matches_live_checks`. In `test_triage_batch_drive_cmd.py`, add:
      - `test_head_found_open_archive_pr_gets_live_checks_not_pending`: a PR absent from `facts.prs`, fake required checks green, and the snapshot's archive verdict `green`.
      - `test_linked_archive_pr_in_issue_prs_gets_the_facts_verdict`
  - id: P2.T1.S2
    text: |-
      Green: split `batch_merge.live_checks` into `pr_checks_verdict(client, repo, number, *, ci_none)`, with `live_checks(ctx, number)` delegating to it. In `triage_batch_cmd._live_head_prs` (3226-3246), call it for an OPEN PR instead of `checks="pending"`. `_archive_prs` (4053-4092) also scans `issue.prs` for `ARCHIVE_PREFIXES` heads.
  - id: P2.T1.S3
    text: |-
      Refactor + run `uv run pytest tests/unit/test_triage_batch_merge*.py tests/unit/test_triage_batch_drive_cmd.py -q --no-cov -n auto`.
- number: 2
  title: Closing repos are read every pass (R8)
  steps:
  - id: P2.T2.S1
    text: |-
      Red: in `test_triage_probe.py`, add:
      - `test_plan_pass_adds_closing_to_a_partial_pass`
      - `test_plan_pass_adds_closing_to_an_essential_pass`
      - `test_a_quiet_pass_with_closing_repos_reads_only_them`
      - `test_live_repos_includes_closing`

      In `test_triage_quota_passes.py` (or `test_triage_kanban_pacing.py`), add a pacing-caller test proving `closing` comes from the judgements: a close-out event recorded and no `archived` value.
  - id: P2.T2.S2
    text: |-
      Green: `probe.plan_pass` gains `closing: set[str]`, and `live_repos` includes it. `pacing.py`'s caller (about 127-138) computes `closing` from the judgements (close-out recorded, not archived) and passes it.
  - id: P2.T2.S3
    text: |-
      Refactor + run probe and pacing tests.
- number: 3
  title: Waiting lines; archive warns are never a failing-ci Need; board names the
    PR (R9, R10)
  steps:
  - id: P2.T3.S1
    text: |-
      Red:
      - In `test_triage_batch_drive.py`, add:
        - `test_attributed_archive_pr_with_pending_checks_gets_one_waiting_warn`
        - `test_failing_checks_waiting_warn`
        - `test_wrong_base_gets_only_the_blocked_line_no_warn`
      - In the views tests, add `test_archive_warn_is_not_a_failing_ci_need`.
      - In `test_triage_kanban*.py`, add `test_card_names_an_existing_linked_archive_pr_and_its_wait`, which asserts the card never says "no archive PR" when one exists.
  - id: P2.T3.S2
    text: |-
      Green:
      - In the archive step (`batch_drive.py`, about 1298-1340), emit `Action("warn", batch, "archive PR #N: checks pending|failing")` when no archive, archive-conflict or blocked action applies.
      - `views.needs_you` skips warns whose text starts with `archive PR`.
      - `kanban._archive_prs` reads linked PRs from `issue.prs` and applies `attributed()`'s trust rule.
      - `_idle_hint` names the PR and its wait reason.
  - id: P2.T3.S3
    text: |-
      Refactor + run drive, views and kanban tests.
- number: 4
  title: Draft archive PRs are marked ready then merged (R11)
  steps:
  - id: P2.T4.S1
    text: |-
      Red: in `test_triage_batch_drive.py`, add `test_green_draft_archive_pr_gets_an_archive_action_flagged_draft`. In `test_triage_batch_drive_cmd.py`, add `test_archive_of_a_draft_calls_pr_ready_before_pr_merge_and_says_so`, and assert no `approved-fr` read or label is involved.
  - id: P2.T4.S2
    text: |-
      Green: drop `not p.draft` from the ready filter (`batch_drive.py:1318`), and give `Action` a `draft` flag for archive. In `_archive` (`triage_batch_cmd.py` about 5474), call `client.pr_ready` first when the flag is set, and the line says `marked ready, merged`.
  - id: P2.T4.S3
    text: |-
      Refactor + run tests.
- number: 5
  title: archive_conflict event, judgements schema 10, pure decision (R12)
  steps:
  - id: P2.T5.S1
    text: |-
      Red: in `test_triage_batch_model.py`, add:
      - `test_archive_conflict_event_round_trips`
      - `test_judgements_schema_10_is_written_and_1_to_10_read`

      In `test_triage_batch_conflict.py` (or `test_triage_batch_drive.py`), add the `archive_conflict_decision` cases:
      - skip on an event for the same head;
      - held after two non-held hand-backs since the close-out event;
      - batch-PR `ConflictEvent`s are not counted;
      - handback otherwise.
  - id: P2.T5.S2
    text: |-
      Green: in `model.py`, add `ArchiveConflictEvent{kind: "archive_conflict", at, head, pr, delivered, handle}` to the event union, bump `JUDGEMENTS_SCHEMA` to 10, add 10 to `JUDGEMENTS_READS`, and extend the version comment. Add `archive_conflict_decision(events, head)` and `archive_conflict_item_id(repo, batch, n)` (`<repo>/run/archive-conflict-<batch>-<n>`) to `batch_drive.py`. Regenerate any judgements fixtures and expected schema pins that tests compare (search for `JUDGEMENTS_SCHEMA` and literal `9` pins in `tests/`). Update the schema numbers that `AGENTS.md` and `plugins/super-fr/skills/fr-triage/SKILL.md` state, then run BOTH `uv run --no-project python scripts/sync-opencode.py` and `uv run --no-project python scripts/sync-hermes.py`. If `docs/triage/` holds a judgements file stamped 9, leave it: it is read as 9.
  - id: P2.T5.S3
    text: |-
      Refactor + run `uv run pytest tests/unit/test_triage_batch_*.py tests/unit/test_tripwire_*sync*.py -q --no-cov -n auto`.
- number: 6
  title: Conflict detection, hand-back to the close-out, Need, stops (R12)
  steps:
  - id: P2.T6.S1
    text: |-
      Red: in `test_triage_batch_drive.py`, add `test_conflicting_archive_pr_gets_archive_conflict_never_archive`.

      In `test_triage_batch_drive_cmd.py`, add:
      - `test_archive_conflict_messages_an_idle_closeout_session`
      - `test_archive_conflict_waits_while_the_closeout_session_works`
      - `test_archive_conflict_starts_a_fresh_item_when_the_closeout_is_done`
      - `test_archive_conflict_held_records_a_stop_and_raises_the_need`
      - `test_conflicting_export_pr_goes_straight_to_needs_you_with_stop_key_export_repo`
      - `test_merged_archive_pr_clears_its_stop`
      - `test_forge_refused_archive_merge_records_a_stop`

      In the views tests, add `test_held_archive_conflict_is_an_archive_conflict_need`.
  - id: P2.T6.S2
    text: |-
      Green:
      - `_archive_prs` keeps `mergeable` from its `pr_view` read, on a new `LivePr` field.
      - The archive step emits `Action("archive-conflict", ...)` for `CONFLICTING`.
      - The command's `_archive_conflict` applies `archive_conflict_decision`. `_hand_back_archive` messages the idle close-out item, waits while it works, and otherwise starts `archive_conflict_item_id` through the runner, with a brief that names the PR and head and says to merge the default branch into the head and push.
      - `held` writes the event and calls `record_stop`.
      - The export step reads `mergeable` from the export PR; on a conflict it raises the Need and calls `record_stop(..., "export:<repo>", ...)`.
      - A successful archive or export merge calls `clear_stop`, and `_archive`'s forge-refusal branch calls `record_stop`.
      - `views.py` gains the `archive-conflict` Need kind.
  - id: P2.T6.S3
    text: |-
      Refactor: fold any duplication between `_hand_back` and `_hand_back_archive` into a shared session-state helper. Run `uv run pytest tests/unit/test_triage_batch_*.py tests/unit/test_triage_views*.py -q --no-cov -n auto`.
- number: 7
  title: Acceptance rows move
  steps:
  - id: P2.T7.S1
    text: |-
      Run `uv run fr acceptance set-status --id <row> --status ci --level unit=super-fr:tests/unit/<file>.py#<test> --notes "<why>"` for `triage-archive-pr-visible`, `triage-archive-pr-draft-merged` and `triage-archive-pr-conflict-handed`, then `uv run fr acceptance check`.
