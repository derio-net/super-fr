tasks:
- number: 1
  title: Prove the TUI entrypoint can be delivered
  steps:
  - id: P3.T1.S1
    text: |-
      Spike, recorded in the plan journal: write a minimal `tui/statusline.tsx` exporting
      `default { id, setup(context) }` that registers
      `context.ui.slot({append: "prompt.footer.status", render: () => <text>fr</text>})`, deliver it
      into a throwaway `XDG_CONFIG_HOME` and register it in that config's `cli.json`; confirm
      `opencode` loads it and renders the constant. Capture the exact registration key and path
      form that works.
  - id: P3.T1.S2
    text: |-
      If the spike cannot load without consumer-side `@opentui/solid`/`solid-js`, stop and ship the
      fallback instead: a `context.keymap.layer` command that prints
      `plugins/super-fr/scripts/fr-statusline-segment.sh`'s output. Record which one happened in the
      record; the acceptance row stays `partial` for the fallback.
- number: 2
  title: The real segment
  steps:
  - id: P3.T2.S1
    text: |-
      Render the segment script's output (branch + isolation state), refresh on
      `session.execution.*` and `session.idle` through `context.data.on`, render nothing outside a
      git repo, and never spawn on every keystroke (a debounce or event-driven refresh only).
  - id: P3.T2.S2
    text: |-
      Test the pure formatting against a stubbed spawn (segment text, em-dash for missing state,
      empty for a non-repo cwd). No JSX in the test path: keep the render function thin and the
      data assembly pure.
- number: 3
  title: Delivery and cli.json
  steps:
  - id: P3.T3.S1
    text: |-
      `scripts/deliver-opencode-plugin.sh` copies the TUI entry into the plugin DIRECTORY (never
      top level, so the server loader cannot pick it up) and removes it on uninstall. Add a test
      asserting the delivered file set, and that the file the server loads never imports the TUI.
  - id: P3.T3.S2
    text: |-
      `scripts/install.sh` appends the TUI entry's path to `cli.json`'s `plugins` list: create the
      file when absent, refuse (with the file named) rather than overwrite unparsable content,
      be idempotent by exact path on reinstall, and remove only its own entry on uninstall. Tests
      beside `tests/unit/test_opencode_plugin_delivery.py` cover all four.
  - id: P3.T3.S3
    text: |-
      `fr.harness.observe` gains a config probe for the status-line row (the entry is listed AND
      the file exists), because a `.tsx` is outside the `src/*.ts` marker scan. Parity test proves
      the row's state follows the probe; `fr harness parity --check` stays green.
