- number: 1
  title: Smoke — the branch's CI is green on a trivial test
  steps:
  - id: P1.T1.S1
    text: |-
      SMOKE: create tests/unit/test_yamlio.py with one trivial test
      (`def test_smoke(): assert True`), commit it, push, and confirm the
      draft PR's CI (https://github.com/derio-net/super-fr/pull/1276)
