schema_version: 2
phase:
  number: 1
  title: The ops gap — Step pointer/raw lines, `none:` acknowledgement (ops kind v2),
    advisory warnings, stage-1 refusal
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - ops-gap-advisory
  - ops-none-acknowledgement
  - ops-gate-gap-refusal
  skeleton: true
  tier: hard
  files:
  - packages/fr/src/fr/spec.py
  - packages/fr/src/fr/ops/gap.py
  - packages/fr/src/fr/ops/load.py
  - packages/fr/src/fr/ops/model.py
  - packages/fr/src/fr/ops/gate.py
  - packages/fr/src/fr/commands/ops_gate_cmd.py
  - packages/fr/src/fr/plan_ops.py
  - packages/fr/src/fr/commands/run_cmd.py
