schema_version: 2
phase:
  number: 1
  title: Landing front page, why-fr essay and the top bar (R1-R12)
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - site-front-page-landing
  - site-landing-build-refuses-malformed
  - site-top-bar-every-page
  - site-why-fr-essay-kept
  tier: standard
  files:
  - scripts/build-site.py
  - scripts/site/*
