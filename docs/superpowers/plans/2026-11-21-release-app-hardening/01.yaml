schema_version: 2
phase:
  number: 1
  title: Release environment, the setup script and its runbook (R1-R15)
  tag: agentic
  depends_on: []
  tracking_issue: null
  acceptance:
  - release-key-environment-scoped
  - setup-script-app-check
  - setup-script-environment
  - setup-script-key-never-printed
  - setup-script-variable-last
  - setup-script-rulesets
  - setup-script-idempotent-confirmed
  tier: standard
  files:
  - .github/workflows/release.yml
  - scripts/setup-release-app.sh
  - scripts/configure-main-protection.sh
  - scripts/release.py
  - tests/unit/test_setup_release_app.py
  - tests/unit/test_configure_main_protection.py
  - tests/unit/test_release_workflow.py
  - tests/unit/test_release_script.py
  - docs/merge-protection.md
  - docs/exit-gates-release-walk.md
  - docs/explainers/fr-exit-gates.md
  - docs/explainers/index.md
