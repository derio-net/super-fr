  estimate_lines: 900
tasks:
- number: 1
  title: Smoke
  steps:
  - id: P1.T1.S1
    text: |-
      Smoke: create `packages/fr/src/fr/settle/__init__.py`, with a module docstring that names spec 2026-11-23-pr-readiness-wait, and `tests/unit/test_settle_smoke.py`, with one test that imports `fr.settle` and asserts that its docstring names the spec. Add the change fragment `.changes/feat-pr-readiness-wait.yaml` (`bump: minor`, summary: "Delivered draft PRs settle: fr waits for mergeability and CI and fixes them, per the new git.settle setting"). Run `uv run pytest tests/unit/test_settle_smoke.py -q --no-cov` and confirm it is green.
- number: 2
  title: git.settle in the settings model (R1)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: in `tests/unit/test_settings_settle.py`, assert the following:
      - `parse_settings({})` gives `git.settle.conflicts == "fix"` and `git.settle.ci == "fix"`.
      - The words `off`, `report` and `fix` parse.
      - Any other value raises `SettingsError` naming the dotted key (for example `git.settle.ci`). A YAML bool is a value of that kind.
      - `fr settings show --json` lists `git.settle.conflicts` and `git.settle.ci` with source `default`.
      - The file `fr settings init` writes documents both keys with their allowed values.
  - id: P1.T2.S2
    text: |-
      GREEN: in `packages/fr/src/fr/settings/model.py`:
      - Add `SETTLE_MODES: Final = frozenset({"off", "report", "fix"})` and a `SettleModeType`.
      - Add a closed `Settle(_Closed)` model whose `conflicts` and `ci` fields use `_choice("fix", SETTLE_MODES, description=...)`. Each description has two lines: Default fix: fr waits and fixes. Report: waits and reports. Off: today's behaviour.
      - Add `settle: Settle = Field(default_factory=Settle, ...)` to `Git`.
      - Make `fr settings show` list the nested keys, the same way it lists `git.commit.*`.
      The tests pass.
  - id: P1.T2.S3
    text: |-
      REFACTOR: confirm that the settings render and check modules need no other change, because they treat the nested model like `commit`. ruff and mypy are green on the touched files.
- number: 3
  title: The pure engine — states, modes, verdict (R2, R4)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: write table-driven tests in `tests/unit/test_settle_evaluate.py` for `fr.settle.evaluate.evaluate(view, checks, gate_names, modes, *, ci_none, head_committed_at, now)`:
      - Conflict states: clean; conflicting (`CONFLICTING` or `DIRTY`); unknown (an `UNKNOWN` mergeable or merge state). `BLOCKED` is clean.
      - CI states: green; red, with the failing check names; pending, when a check has not finished; pending, when no check has reported and `now - head_committed_at < NO_CI_WAIT_SECONDS`; missing, after that; unrunnable, on a conflicting PR; none, under `ci_none`.
      - When a gate set is given, it filters the checks; with none, every check is read.
      - The exit code for every mode × state cell follows spec R4. Only `fix` concerns decide the code: 4 when failing, 75 when pending or unknown, 0 otherwise. A `report` concern never changes the code, and an `off` concern is not evaluated.
  - id: P1.T3.S2
    text: |-
      GREEN: add `packages/fr/src/fr/settle/model.py` with closed models:
      - `Modes`: the mode and source of each key.
      - `Verdict`: conflict state, CI state, failing checks, exit code, printed lines, and the witness value `<c-mode>/<ci-mode>:<c-state>/<ci-state>@<head>`.
      Add `packages/fr/src/fr/settle/evaluate.py`, which reuses `fr.triage.mergeability.conflicting` and `fr.run.ci_evidence.NO_CI_WAIT_SECONDS`. It is pure: no forge, no git and no clock of its own. The tests pass.
  - id: P1.T3.S3
    text: |-
      REFACTOR: state the exit-code table once, in `evaluate.py`'s module docstring, and keep the wording of the printed lines in one place. ruff and mypy are green.
- number: 4
  title: Driver-managed branches (R5)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: in `tests/unit/test_settle_managed.py`, assert that:
      - `driver_managed` is true for `feat/batch-x`, `fix/batch-x`, `chore/closeout-2026-11-23-1`, `chore/closeout-feat-batch-x`, `chore/closeout-fix-batch-x`, `chore/triage-state-s-wave-2` and `chore/ops-p`.
      - It is false for `chore/archive-p`, `chore/closeout-2026-11-23-feat-x` (a run id), `feat/other` and `fix/other`.
      - `fr/settle/managed.py` contains none of the literal prefixes, because it takes them from their owners.
  - id: P1.T4.S2
    text: |-
      GREEN: add `packages/fr/src/fr/settle/managed.py` with `driver_managed(branch) -> bool`, built from:
      - `fr.triage.batch.BRANCH_PREFIX` and `FIX_BRANCH_PREFIX`;
      - `fr.triage.batch_drive.collected_name`;
      - `COLLECTED_PREFIX` plus each batch prefix with `/` as `-`;
      - `EXPORT_PREFIX` and `HOUSEKEEPING_PREFIX`.
      If importing `batch_drive` here pulls in heavy imports or breaks `tests/unit/test_import_direction.py`, move only the constants to a small module that both import. Never duplicate them. The tests pass.
  - id: P1.T4.S3
    text: |-
      RED, then GREEN: assert that every driver brief carries the managed sentence, "The wave driver owns this PR's mergeability and CI: run no `fr pr settle` loop." The briefs are `batch_dispatch.render_brief`, `red_brief`, `conflict_brief` and `archive_conflict_brief`, `batch_drive.closeout_brief`, and `batch_closeout.handback_brief`. Add the sentence from one constant in `fr.settle.managed`. Update existing brief tests only where they pin the whole text.
- number: 5
  title: Poll and the fr pr settle verb (R2-R4, R11)
  steps:
  - id: P1.T5.S1
    text: |-
      RED: in `tests/unit/test_settle_poll.py`, with an injected clock and sleeper, assert that the poll:
      - polls only `report` and `fix` concerns;
      - stops as soon as no concern is unknown or pending, and stops at the end of the wait;
      - never calls a write method of the fake client.
      Also assert that a `--wait` above the 540 s ceiling is refused and that the default wait is 300 s.
  - id: P1.T5.S2
    text: |-
      GREEN: add `packages/fr/src/fr/settle/poll.py` (`settle(client, repo, pr, *, gate_names, modes, ci_none, wait, clock, sleep) -> Verdict`) and `packages/fr/src/fr/settle/modes.py`, with `effective_modes(repo_root)`. For now `effective_modes` returns only the repo setting; phase 2 adds overrides. The tests pass.
  - id: P1.T5.S3
    text: |-
      RED: in `tests/unit/test_pr_settle_cmd.py`, through the CLI runner with a fake client, assert the following:
      - The verb finds the PR from the run cursor's `pr`, else with `open_pr_for_head`.
      - A managed branch prints the managed line and exits 0, with no forge read.
      - No open PR exits 2.
      - `UnsupportedForgeOperation` from `open_pr_for_head`, `pr_view` or a checks read gives `unsupported` and exits 0, ahead of the no-PR refusal.
      - A `FORGE_ERRORS` failure exits 75.
      - Gate names come from `declared_gates`, else `required_check_names`, else every check, with no refusal on that last fallback.
      - `ci none` from `fr services` gives `none`.
      - `--json` prints the verdict.
  - id: P1.T5.S4
    text: |-
      GREEN: add `@pr_app.command("settle")` to `packages/fr/src/fr/commands/pr_cmd.py`. Keep it thin: resolve the PR, call `fr.settle.poll.settle`, print, and exit with the verdict's code. It makes no push and no PR edit. The tests pass.
  - id: P1.T5.S5
    text: |-
      REFACTOR, in this order:
      1. Run `scripts/sync-readme.py`, so the CLI tables gain `fr pr settle`.
      2. Run `fr docs check` against `origin/main`. Fix every page it names: edit the page, or bump its `reviewed` stamp with a note.
      3. In the step record, set rows pr-settle-setting, pr-settle-verb and pr-settle-managed to `ci`, with level refs on the new test names.
      4. Run this repo's fast tier last.
