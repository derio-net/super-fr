tasks:
- number: 1
  title: Method order and its source (R1)
  steps:
  - id: P1.T1.S1
    text: |-
      RED: in `tests/unit/test_triage_batch_merge.py`, add tests for `choose_method` and a new `choose_method_source` (import both from `fr.triage.batch_merge`). Cases, with `methods = {"default": "squash", "allowed": ["merge", "rebase", "squash"]}` unless stated: configured `merge` with forge default `squash` returns `merge` (source `merge_method in .fr/triage.yaml`) — the #1702 case; explicit `rebase` beats configured `merge` (source `--method`); nothing configured returns the default `squash` (source `the forge's default`); no default and one allowed method returns it (source `the one allowed method`); no default, several allowed, nothing configured raises `ConfigError` naming `merge_method` and `--method`; a configured or explicit method the repo disallows raises `ConfigError` as today. Update `test_choose_method_uses_the_configured_method_when_the_forge_names_none` only if its expectation changes (it should not). Run `uv run pytest tests/unit/test_triage_batch_merge.py -q --no-cov` and see the new ones fail.
  - id: P1.T1.S2
    text: |-
      GREEN: in `packages/fr/src/fr/triage/batch_merge.py` add `choose_method_source(explicit, methods, *, configured=None) -> tuple[str, str]` holding the logic in the order explicit > configured > default > single, with the four source strings above as module constants (`SOURCE_EXPLICIT`, `SOURCE_CONFIGURED`, `SOURCE_DEFAULT`, `SOURCE_ONLY`); make `choose_method` return `choose_method_source(...)[0]`. Rewrite the docstring: the configured method is the repo's decision, the forge's (viewer) default only a fallback (spec 2026-11-26-landing-method R1, gh#1702). Tests pass.
  - id: P1.T1.S3
    text: |-
      REFACTOR: grep the callers (`triage_batch_cmd.py` `merge_ctx`, `cloud.py` `_check_merge_method`) and confirm they still read only the method; run `uv run pytest tests/unit/test_triage_batch_merge.py tests/unit/test_cloud_remedy.py -q --no-cov` and fix any test whose expectation encoded the old order (say why in the step note).
- number: 2
  title: The push landing rule (R2, R3)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: in `tests/unit/test_queue_exec.py`, test a new pure `landing_refusal(land, method, *, source)` from `fr.triage.queue_exec`: `("push", "squash", source=...)` and `("push", "rebase", ...)` return a string naming the method, the source, that GitHub closes such a PR unmerged (`closes`/`unmerged`), and both fixes (`merge_method: merge` and `queue.land: merge`); `("push", "merge", ...)`, `("merge", "squash", ...)` and `("merge", "rebase", ...)` return None. Then test `land_push` with `method="squash"` and `method="rebase"`: it returns `LandResult` with status `held`, the reason text, and the fake checkout's `push_leased` is never called. Find the existing `land_push` tests in that file (or `tests/unit/test_wave_queue_drive.py`) and reuse their fake checkout; remove or rewrite any test that asserts a squash/rebase head-ref rewrite under `land_push`, noting why.
  - id: P1.T2.S2
    text: |-
      GREEN: in `packages/fr/src/fr/triage/queue_exec.py` add `landing_refusal` next to `queue_refusal` (docstring: spec 2026-11-26-landing-method R2, gh#1705 — only a merge commit, whose second parent is the PR's head, makes GitHub mark a PR merged by push). In `land_push`, before anything else, return `LandResult("held", detail=landing_refusal("push", method, source="the queue's method"))` when `method != "merge"`; then simplify the head-ref refspec to `(x.head, ref)` and update the docstring (no squash/rebase case any more). Tests pass.
  - id: P1.T2.S3
    text: |-
      RED: in `tests/unit/test_triage_batch_drive_cmd.py` (or `tests/unit/test_wave_queue_drive.py`, wherever the driver's `_queue_refusal` / `queue-held` plans are already driven with a fake client), add: a repo whose fake `repo_merge_methods` reports `default: squash` with `.fr/triage.yaml` having `queue: {ci: push, land: push}` and no `merge_method` gets a `queue-held` plan whose detail names `squash` and `the forge's default`; the same with `merge_method: merge` configured is not held; with `--method rebase` (the driver's `method_override`) under `land: push` it is held naming `--method`. Run and see them fail.
  - id: P1.T2.S4
    text: |-
      GREEN: in `packages/fr/src/fr/commands/triage_batch_cmd.py`, make `merge_ctx` record the source too (use `choose_method_source`, store it on the driver per repo, e.g. `self._method_source[repo]`, refreshed where `ctx.method` is refreshed). In `_queue_refusal`, after `queue_refusal(...)` returns None, get the context through `self._ctx_or_hold(facts, repo)` (None → return None, the existing hold path already says why) and return `landing_refusal(block.land, ctx.method, source=self._method_source[repo])`. Keep the module within its line budget (`tests/unit/test_tripwire_module_budget.py`); if it would grow past it, put the helper in `queue_exec.py`. Tests pass.
- number: 3
  title: The rebase warning and fr cloud doctor (R4, R5)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: a driver test: under `queue: {ci: push, land: merge}` with method `rebase`, two passes print the warning (naming first-parent, `(#N)`, `Merge pull request #N`, and `merge` or `squash` as the fix) exactly once; under `land: merge` with `squash` nothing is printed. In `tests/unit/test_cloud_remedy.py`: `.fr/triage.yaml` with `merge_method: squash` and `queue: {land: push}` (and with no `queue:` block, land's default is push) fails the `merge_method` check with the landing refusal text; `merge_method: merge` passes; `merge_method: squash` with `queue: {land: merge}` passes. Update the existing `test_a_configured_or_single_merge_method_passes` parametrisation so it writes `land: merge` for non-merge methods, or expects the failure, and say which in the step note.
  - id: P1.T3.S2
    text: |-
      GREEN: in `_queue_refusal` (or a small helper it calls), when the landing is allowed, `block.land == "merge"` and the method is `rebase`, say the R4 warning through `self._report_once(f"rebase-first-parent\0{repo}", ...)`. In `packages/fr/src/fr/cloud.py`, read `queue.land` (default `push`) beside `_configured_merge_method`, use `choose_method_source`, and fail the check with `landing_refusal`'s text when it refuses. Tests pass.
- number: 4
  title: release.py counts a closed-unmerged first-parent landing (R7)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: in `tests/unit/test_release_script.py`, reuse the existing git-fixture and fake `Commands.gh_read` helpers that drive `waiting_prs`. Build a repo with a final tag and, after it, a first-parent commit `chore: x (#1704)`. The fake `gh pr list` returns no #1704; the fake `gh pr view 1704 --json ...` returns `{"number":1704,"state":"CLOSED","mergedAt":null,"labels":[{"name":"gate:tester"}],...}`. Assert `waiting_prs` does not raise, and that the facts `cmds.decide` receives hold #1704 with `mergedAt` equal to that commit's `%cI` and its labels, and no `state` key. Two more: `state: OPEN` raises `GateStateUnknownError` naming #1704; a failing `pr view` (non-zero returncode) raises it too. Also a test for `logged_pr_dates` returning the newest commit's date for a number named twice.
  - id: P1.T4.S2
    text: |-
      GREEN: in `scripts/release.py` add `logged_pr_dates(repo, tag) -> dict[int, str]` (`git log --first-parent --format=%an%x00%cI%x00%s`, same bot/prefix skips, first occurrence wins = newest) and make `logged_prs` return its keys. In `waiting_prs`, for each missing number run `cmds.gh_read(["pr", "view", str(n), "--json", MERGED_PR_FIELDS + ",state"])`; a `CLOSED` PR with no `mergedAt` is appended to `prs` with `mergedAt` = the date and `state` removed; anything else keeps it missing, and the existing `GateStateUnknownError` names the still-missing ones. Docstring cites spec 2026-11-26-landing-method R7 and #1704. Tests pass.
- number: 5
  title: Repo config, docs, fragment and full checks (R6, R8)
  steps:
  - id: P1.T5.S1
    text: |-
      In `.fr/triage.yaml` set `merge_method: merge` and replace its comment: under `queue.land: push` only a merge commit makes GitHub mark the PR merged (a squash or rebase push closes it unmerged, #1705), and this repo's release attributes PRs by first-parent `Merge pull request #N`, which a rebase breaks (#1603); a configured method wins over the forge's viewer default (#1702).
  - id: P1.T5.S2
    text: |-
      Docs (R8): in `plugins/super-fr/skills/fr-triage/SKILL.md` replace "The merge method is the forge's default, else `merge_method: merge | squash | rebase` in `.fr/triage.yaml`, which a repo allowing several methods needs under `rest`." with the new order (`--method`, then `merge_method`, then the forge's default, then the one allowed method) and the rule that under `queue.land: push` a squash or rebase method holds the queue with the fix named (GitHub closes such a PR unmerged), plus the rebase warning under `land: merge`. Update `docs/explainers/fr-wave-driver.md` around line 305 and the merge-method row of `docs/cloud-setup.md` to say the same, in each page's writing standard, and bump their `reviewed:` stamps. Run `uv run python scripts/sync-opencode.py`, `uv run python scripts/sync-hermes.py` and `uv run python scripts/sync-readme.py` and commit the regenerated mirrors. Run `uv run fr docs check --base origin/main` and fix what it names.
  - id: P1.T5.S3
    text: |-
      Add `.changes/feat-batch-landing-method.yaml` with `bump: patch` and a one-line summary ("the wave merge queue uses the configured merge_method over the forge's viewer default and, under queue.land: push, refuses squash and rebase, which GitHub closes unmerged; release gating counts a closed-unmerged first-parent landing"). Move the four acceptance rows to `ci` with `uv run fr acceptance set-status --id <row> --status ci --notes "<why>" --level unit=derio-net/super-fr:tests/unit/<file>.py#<test>` naming the tests written above (or put them in the step record's `acceptance:` section).
  - id: P1.T5.S4
    text: |-
      Run `uv run ruff format packages/ tests/ scripts/`, `uv run ruff check packages/ tests/ scripts/`, the mypy command from AGENTS.md, `uv run --no-project python scripts/bump-version.py --check`, `uv run python scripts/sync-opencode.py --check`, `uv run python scripts/sync-hermes.py --check`, then the repo's fast tier last (`.fr/ci.yaml`'s `fast_tier`, with `{base}` = origin/main). All green.
