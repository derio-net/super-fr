tasks:
- number: 1
  title: The export record (R1)
  steps:
  - id: P1.T1.S1
    text: |-
      RED: in `tests/unit/test_triage_state_sync.py`, assert that `export_state` writes `<root>/exported-files` as JSON `{"schema": 1, "files": {path: sha256}}` naming every durable file copied or skipped as identical (a file whose name holds a newline and a backslash round-trips), that `exported-files` is in `report.copied` only when its bytes changed, and that `import_state` never copies it into the state. Run `uv run pytest tests/unit/test_triage_state_sync.py -q --no-cov`: the new tests fail.
  - id: P1.T1.S2
    text: |-
      GREEN: in `state_sync.py` add `RECORD_FILE = "exported-files"`, `read_record(root)` (opened with `_open_dir`/`_open` from the root, O_NOFOLLOW; `None` when absent; a symlink, a non-regular file, bad JSON or a wrong schema raises `BadRecord(TriageError)` naming the file), `_hash(root, rel)` through the same descriptors, and the record write after `_sync` (from the root's descriptor, like the stamp). Tests green.
  - id: P1.T1.S3
    text: |-
      REFACTOR: share the descriptor read between `_hash`, `read_record` and `_copy` where it removes duplication; update the module docstring for the record. ruff and mypy green on `state_sync.py`.
- number: 2
  title: Drift detection and the refusal, export --force (R2, R3)
  steps:
  - id: P1.T2.S1
    text: |-
      RED: tests that export once, then edit the repo-side root and change the state, and export again: a `changed` file, a `deleted` file, an `added` file the state also has, and an `added` file only the repo has each raise `ExportDrift` naming the path and kind and the remedy (`fr triage state import --from <dir> --only <path>` and `fr triage state export --force`), with every byte of the root (stamp and record included) unchanged; a repo file equal to the state's copy is not drift; with no record nothing is drift; a repo-side symlink at a durable path is skipped (`SYMLINK_DEST`), not drift; a bad record raises `BadRecord`; `force=True` overwrites the drifted files and rewrites a bad record. Through the CLI too: `fr triage state export --to <dir> --force` overwrites, and without `--force` it exits 2.
  - id: P1.T2.S2
    text: |-
      GREEN: add `Drift`, `ExportDrift`, `find_drift(state_dir, root, record)` over the union of `durable_entries(state_dir)`, `durable_entries(root)` and the record's paths (symlink entries and `_symlinked_dest` paths left out), and `export_state(..., force=False)` checking record and drift after `_stamp` and before `_sync`. Add `--force` to `export_command` in `triage_state_cmd.py`. Tests green.
  - id: P1.T2.S3
    text: |-
      REFACTOR: keep the drift message one builder function the driver can reuse for its Need text. ruff and mypy green.
- number: 3
  title: The targeted import (R5)
  steps:
  - id: P1.T3.S1
    text: |-
      RED: tests for `import_state(..., only=[...])` and `fr triage state import --only`: a named file is copied over a state copy with a newer mtime; a named directory takes every durable file under it; unnamed state files are untouched (bytes and mtime); a named path the state has and the repo lacks is removed and reported `removed`; a named symlink on either side is skipped, never followed or removed; a `..` or absolute path, and a path naming no durable file on either side, exit 2 with nothing changed.
  - id: P1.T3.S2
    text: |-
      GREEN: implement the selection (`contained`'s rule, expansion against both trees), `keep_newer=False` for the selection, removal by `os.unlink(name, dir_fd=...)` from an O_NOFOLLOW parent descriptor, `SyncReport.removed` (default empty), `--only` on `import_command` and `removed <path>` lines in `_print`. Tests green.
  - id: P1.T3.S3
    text: |-
      REFACTOR: make sure `_sync`'s existing callers behave as before (no change without `only`). ruff and mypy green.
- number: 4
  title: The driver's stop and the Needs-you-now row (R4)
  steps:
  - id: P1.T4.S1
    text: |-
      RED: in `tests/unit/test_triage_batch_drive_cmd.py` (beside the existing export tests that call `export_state` on a clone), run the driver's export over a drifted repo-side root and over a bad record: nothing is committed or pushed and no PR is opened, the pass counts a refusal, `merge-stops.json` holds `export-drift:<repo>` whose reason names the paths, the shell-quoted `fr triage state import --repo <repo> --from <path> --only ...` command, the default-branch sha and the `--force` alternative; a later export with no drift clears the stop. In the views tests, `needs_you` with that stop yields one `export-drift` Need whose text is the reason, and the Batches page renders it with the label "Triage export drifted from the repo".
  - id: P1.T4.S2
    text: |-
      GREEN: `export_drift_stop_key` in `merge_stops.py`; in `_Driver._export` catch `ExportDrift` and `BadRecord` before the generic `TriageError`, build the text (with `--dir` when the driver was given a state dir override), `record_stop`, and `clear_stop` once the drift check passes; `export_drift_needs(stops)`, the `NEED_LABELS` entry and the kind comment in `views.py`, called from `needs_you`. Tests green.
  - id: P1.T4.S3
    text: |-
      REFACTOR: keep `triage_batch_cmd.py` within its line budget (`tests/unit/test_tripwire_module_budget.py`) by putting the text builder in `state_sync.py`; ruff and mypy green.
- number: 5
  title: Docs, mirrors, fragment (R6)
  steps:
  - id: P1.T5.S1
    text: |-
      Edit `docs/triage/README.md` (a "Which way it flows" paragraph, an `exported-files` row, the targeted import in the recipe), line 15 of `plugins/super-fr/skills/fr-triage/SKILL.md`, and the export passages of `docs/explainers/fr-triage.md` and `docs/explainers/fr-wave-driver.md` with new `reviewed` stamps; run `uv run --no-project python scripts/sync-opencode.py`, `uv run --no-project python scripts/sync-hermes.py` and `uv run --no-project python scripts/sync-readme.py`; add `.changes/feat-batch-export-drift.yaml` (`bump: minor`, summary: "fr triage state export refuses to overwrite a file changed in the repo since the last export (--force overrides; the driver shows a Need), and fr triage state import --only takes in named paths only"). Run `uv run fr docs check`: clean.
  - id: P1.T5.S2
    text: |-
      Run `uv run ruff format packages/ tests/`, `uv run ruff check packages/ tests/`, mypy over `packages/fr/src`, and the repo's declared fast tier last; all green.
