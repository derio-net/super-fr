  - id: P1.T2.S1
    text: |-
      RED: in `tests/unit/test_isolation_network_timeouts.py`, turn `test_local_py_holds_no_forge_cli_argv` into a test parametrized over a module list `ISOLATION_MODULES = ["fr.isolation.local", "fr.isolation.runner"]` (import each with `importlib.import_module`, AST-scan its file exactly as today). It fails: `fr.isolation.runner` does not exist.
  - id: P1.T2.S2
    text: |-
      GREEN: create `packages/fr/src/fr/isolation/runner.py` with a docstring (what it holds, #1517) and the runner group moved byte-identical from `local.py` lines 50-171: `Runner`, `_BASE32`, `devcontainer_id`, `_missing_binary`, `subprocess_runner`, `_home`, `GcSpawner`, `_detached_gc_spawn`, `_noop_gc_spawn`, with the imports they need. Delete them from `local.py` and import from `fr.isolation.runner` only the names local.py's remaining code uses. `uv run python -c "import fr.isolation.local"` works; the guard from S1 passes.
  - id: P1.T2.S3
    text: |-
      REFACTOR: migrate every caller of a moved name (`grep -rn "fr.isolation.local import" packages tests`, including lazy imports inside functions and `fr/isolation/routing.py`, `external.py`) to import it from `fr.isolation.runner`; names not moved keep importing from `local`. Patch targets need no change (`local_mod.subprocess` is the shared module, spec Background). Then lower `local.py`'s budget in `tests/unit/test_tripwire_module_budget.py` to the line count rounded up to the next 25, plus 25. `uv run ruff check packages tests`, `uv run ruff format packages tests`, mypy over the five packages clean; the fast tier green.
