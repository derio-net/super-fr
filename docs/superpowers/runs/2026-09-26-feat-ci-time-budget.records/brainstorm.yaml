schema_version: 2
run: 2026-09-26-feat-ci-time-budget
step: brainstorm
outcome: done
questions:
  rounds: 2
  trigger: operator-request
  reason: >-
    One logical round of 8 questions, sent as two AskUserQuestion calls in
    parallel instead of consecutively. The second dialog overwrote the first
    in the UI, so the first 4 came back unanswered (the operator asked to
    clarify). The operator asked about it, and the lost 4 were re-asked in a
    second call. One of those answers was itself a clarification, so the
    scope question was settled in prose (A, repo-local). No third question
    call was made.
journal:
  - kind: decision
    id: scope-repo-local
    title: The watcher is repo-local (workflow + scripts/ci_budget.py), with no fr verb
    body: Operator chose A. With agent filing dropped, nothing outside super-fr's own CI needs to call it.
  - kind: decision
    id: sharding-pytest-split-4
    title: pytest-split with 4 duration-balanced shards, plus a coverage-combine job gating at 75
    body: 'Recommended option. Measured: 6,408 tests, largest file 13% of test time, unit/ 84%. A directory split would stay unbalanced.'
  - kind: decision
    id: measure-run-wall-clock
    title: Budget measures one run's wall clock, first job start to last job end, excluding queue
    body: Recommended option.
  - kind: decision
    id: trigger-main-unless-pr-differs
    title: Count main-push runs, and other events only for workflows that never run on a push to main
    body: >-
      Operator: "if PR and Main have the same slow CI jobs, then Main is enough.
      If not, add PR to the mix". Checked against the on: blocks. ci.yml and
      acceptance-report.yml match (change-fragment runs only on PRs, ~8s,
      parallel). _pr_spec_status.yml and pinned-clis.yml never run on a push to
      main, so they are counted on their own events.
  - kind: decision
    id: close-after-3-green
    title: Auto-close after 3 consecutive under-budget successful runs; a regression opens a new issue linking the old one
    body: Recommended option.
  - kind: decision
    id: agent-filing-dropped
    title: Agents filing or enriching tickets is dropped
    body: 'Operator: "drop this requirement, I think the mechanical gate is enough".'
  - kind: decision
    id: budget-240-override
    title: 240s default, with a per-file override or exclusion in .github/ci-budget.yaml
    body: Recommended option.
  - kind: decision
    id: test-plan-observe-forced-breach
    title: 'Post-merge Test Plan: observe the next main run, then force a breach via workflow_dispatch to check dedup'
    body: Recommended option.
acceptance:
  - id: ci-under-time-budget
    capability: CI
    acceptance: A CI run of ci.yml completes in under 4 minutes of wall clock (excluding queue), with coverage still gated at 75% across the whole suite
    origin: [super-fr:docs/superpowers/specs/2026-09-26-ci-time-budget-design.md]
    status: not-implemented
  - id: ci-budget-ticket-dedup
    capability: CI
    acceptance: A CI file that runs over its budget gets exactly one open ci-budget issue; later breaches update it without duplicates, and 3 consecutive green runs close it
    origin: [super-fr:docs/superpowers/specs/2026-09-26-ci-time-budget-design.md]
    status: not-implemented
  - id: ci-budget-watch-list-complete
    capability: CI
    acceptance: Adding a workflow file that the budget watcher neither watches nor explicitly excludes fails CI
    origin: [super-fr:docs/superpowers/specs/2026-09-26-ci-time-budget-design.md]
    status: not-implemented
emitted:
  spec: docs/superpowers/specs/2026-09-26-ci-time-budget-design.md
