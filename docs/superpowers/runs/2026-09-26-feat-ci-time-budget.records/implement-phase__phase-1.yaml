journal:
  - kind: discovery
    id: pytest-split-store-durations-with-xdist
    title: "--store-durations works fine together with -n auto"
    body: >-
      Ran `uv run pytest -n auto --no-cov --store-durations` over the full
      suite. It completed cleanly and wrote a `.test_durations` with 6413
      entries — one per collected test, matching the full collection size.
      No warning or degraded behavior observed from pytest-split (0.11.0)
      under xdist. No fallback to a serial run was needed.
    phase: 1
  - kind: discovery
    id: ci-branch-run-wall-clock
    title: "Branch CI run 36247922786: 4 green test shards + coverage, 155s wall clock"
    body: >-
      First push (run 36247574806) failed `lint` (ruff format --check) on
      the newly-added tests/unit/test_ci_shards.py — a formatting miss from
      writing it outside `ruff format`. Fixed and re-pushed; the resulting
      run, 36247922786, is fully green: lint, typecheck, `test (1..4)`,
      `coverage`, validate-artifacts, opencode-plugin-test, version-sync
      (change-fragment skipped, correctly, as this is a push not a PR).
      Wall clock = max(completedAt) - min(startedAt) over non-skipped jobs
      = 2026-09-26T14:18:40Z (coverage's completedAt) minus
      2026-09-26T14:16:05Z (the earliest job start) = 155s, well under the
      240s budget (spec §3.A predicted ~150-180s).
    phase: 1
  - kind: discovery
    id: ci-coverage-total-before-after-source-move
    title: "Coverage TOTAL unchanged by moving --cov=<pkg> into [tool.coverage.run] source"
    body: >-
      Before (main, commit 7f50d74c, CI job log): TOTAL 21824 stmts, 1542
      miss, `Total coverage: 92.93%`. After (this branch, local full-suite
      run with the coverage-source move applied, ci.yml not yet sharded):
      TOTAL 21753 stmts, 1527 miss, `Total coverage: 92.98%`. The
      statement-count difference (21824 vs 21753) is expected — different
      commits, different code — not a sign of divergence: both runs measure
      exactly the same 5-package source list (fr, fr_dispatch, fr_vk,
      fr_cncd, fr_herdr) and both gate at 75%, confirming the move from CLI
      `--cov=<pkg>` flags in addopts to `[tool.coverage.run] source = [...]`
      is behaviorally inert locally, as spec §3.A intends.
    phase: 1
  - kind: finding
    id: flaky-index-lock-test-under-host-contention
    title: "test_records_commit.py::test_a_record_commit_gives_up_on_a_stuck_index_lock_quickly failed once under heavy host load, unrelated to this phase"
    body: >-
      During the first full-suite run today (26m24s wall clock — the host
      had 5+ other fr worktrees running their own full suites concurrently,
      vs. AGENTS.md's ~150s baseline), this test failed once: it asserts
      `1.0 <= elapsed < 5.0` seconds for a retry-on-stuck-lock code path,
      which is exactly the wall-clock-tight shape AGENTS.md already warns
      about for `-n auto`. A second full-suite run (17m24s, same host,
      still contended) passed it cleanly, with no code changes in between.
      Not caused by this phase's changes (pyproject.toml / ci.yml / new
      test file never touch fr.records_commit), and not reproducible on
      retry — recorded for visibility, not as a regression to fix here.
    state: refuted
    review_scope: out
    phase: 1
