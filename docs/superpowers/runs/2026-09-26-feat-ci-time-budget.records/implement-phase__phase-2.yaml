    id: ci-budget-skipped-job-fixture-proves-155-vs-157
    title: "Captured fixture (run 36247922786) proves the 155s/157s skipped-job distinction"
    body: >-
      tests/fixtures/ci_budget/jobs_sharded.json's `change-fragment` job
      (skipped, started_at 14:16:03Z, completed_at 14:16:02Z) is 2s earlier
      than the earliest real job's start (lint, 14:16:05Z). `wall_clock`
      filtering by `conclusion == "skipped"` gives 155s; a naive filter that
      included it (flipped to `success` in a test-only copy) gives exactly
      157s, matching the orchestrator's finding precisely. Both figures are
      asserted directly in
      test_wall_clock_sharded_run_excludes_the_skipped_job_by_conclusion.
    phase: 2
  - kind: discovery
    id: ci-budget-pinned-clis-name-is-not-its-filename
    title: "pinned-clis.yml's own `name:` is \"Pinned CLIs\", not \"pinned-clis\""
    body: >-
      workflow_run.workflows matches on a workflow's `name:` field, not its
      filename. The plan step's prose lists the watch set loosely by
      filename-ish shorthand ("pinned-clis"); the real file's `name:` is
      "Pinned CLIs", which is what ci-budget.yml's watch list and
      check_watch_list's names_by_file both use. Verified by
      test_counted_pinned_clis_counts_every_event and the real-repo
      watch-list tripwire test passing.
    phase: 2
  - kind: discovery
    id: no-refactor-p2-t4-t5
