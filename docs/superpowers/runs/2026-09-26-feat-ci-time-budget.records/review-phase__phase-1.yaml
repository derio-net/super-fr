journal:
  - kind: finding
    id: r1-partition-test-cost
    phase: 1
    review_scope: in
    title: The partition test ran five full-suite --collect-only subprocesses (30-90s) inside a CI-time PR
    body: "tests/unit/test_ci_shards.py: .test_durations recorded the node at 31s, and it took about 90s locally, one lumpy indivisible unit that fights least_duration balancing. Fix: call pytest_split.algorithms.LeastDurationAlgorithm in-process over the .test_durations ids plus unknown ids."
  - kind: finding
    id: r1-dead-recursion-guard
    phase: 1
    review_scope: in
    title: The PYTEST_SPLIT_INNER recursion guard was dead code (subprocesses were --collect-only)
    body: tests/unit/test_ci_shards.py:125-131.
  - kind: finding
    id: r1-skipped-jobs-have-timestamps
    phase: 2
    review_scope: in
    title: GitHub stamps skipped jobs, so wall_clock must drop jobs by conclusion == skipped, not by null timestamps
    body: "Orchestrator observation on run 36247922786: change-fragment (skipped) has startedAt 14:16:03Z and completedAt 14:16:02Z. Spec §3.B and §7.2 assumed null timestamps; both are corrected. Phase 2's wall_clock and its fixture test must filter by conclusion."
  - kind: review
    id: review-phase-1
    phase: 1
    title: Code review of phase 1 (sharding + coverage combine)
    body: "Dispatched reviewer (separate context). It verified the pytest-cov addopts accumulation fix, bare --cov with [tool.coverage.run] source being equivalent, include-hidden-files on upload, that a missing shard skips coverage rather than gating on 3 of 4 (needs semantics), and the live run 36247922786 (155s, TOTAL 93%). Findings: r1-partition-test-cost (in, fixed), r1-dead-recursion-guard (in, fixed). The orchestrator added r1-skipped-jobs-have-timestamps (in, filed against phase 2)."
