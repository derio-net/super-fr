journal:
  - {kind: finding, id: r2-budget-re-mismatch, phase: 2, review_scope: in, title: "BUDGET_RE never matched render_body's heading, so a non-default budget parsed back as 240s", body: "scripts/ci_budget.py:233 and :278. Inert today (decide always uses the fresh measurement budget) but it broke the §7.7 round-trip claim for any override."}
  - {kind: finding, id: r2-run-step-injection, phase: 2, review_scope: in, title: "ci-budget.yml interpolated ${{ inputs.* }} into run:, the script-injection shape, on an issues:write token", body: ".github/workflows/ci-budget.yml:56-59; release.yml and acceptance-report.yml route such values through env."}
  - {kind: finding, id: r2-wasted-uv-sync, phase: 2, review_scope: in, title: "The watcher ran uv sync before a --no-project invocation", body: ".github/workflows/ci-budget.yml:53; about 20s wasted on every watched run."}
  - {kind: finding, id: r2-jobs-not-paginated, phase: 2, review_scope: in, title: "fetch_jobs did not paginate, so past 30 jobs wall_clock would truncate silently", body: "scripts/ci_budget.py:589-591."}
  - {kind: finding, id: r2-run-id-unvalidated, phase: 2, review_scope: in, title: "--run-id was not validated as numeric", body: "scripts/ci_budget.py:655."}
  - {kind: finding, id: r2-actions-pinned-by-tag, phase: 2, review_scope: out, title: "Third-party actions pinned by tag rather than SHA (flagged by a background security scan)", body: "Every workflow here pins by tag, including release.yml and acceptance-report.yml, which already hold issues:write. This is a pre-existing repo-wide convention that the change follows, not one it introduced."}
  - kind: review
    id: review-phase-2
    phase: 2
    title: Code review of phase 2 (ci-budget watcher)
    body: "Dispatched reviewer (separate context). It verified the §3.B state machine row by row, conclusion-based skipped-job filtering on the real fixture, the issue-list dedup with --limit 100 and no gh search, and the watch-list tripwire's negative paths. Findings: r2-budget-re-mismatch, r2-run-step-injection, r2-wasted-uv-sync, r2-jobs-not-paginated, r2-run-id-unvalidated (in, all fixed); r2-actions-pinned-by-tag (out)."
