schema_version: 2
run: 2026-09-26-feat-ci-time-budget
step: spec-review
outcome: done
journal:
  - kind: finding
    id: sr-cov-report-noop
    title: "--cov-report= on the shard CLI does not suppress addopts' term-missing report"
    review_scope: in
    body: "pyproject.toml:53 addopts `--cov-report=term-missing`; pytest_cov/plugin.py:72-75 StoreReport accumulates into a dict and 240-243 clears only when `''` is the sole key. A CLI `--cov-report=` therefore cannot cancel addopts, and every shard prints a whole-codebase table."
  - kind: finding
    id: sr-watchlist-unclassified-files
    title: release.yml and pages.yml are never classified as watched or excluded
    review_scope: in
    body: "The spec's own tripwire (§7.3) would fail on day one: release.yml:1-24 and pages.yml:1-6 are live workflows that the spec never mentions."
  - kind: finding
    id: sr-testplan-missing-override-case
    title: The Test Plan never exercises budget_for's per-file numeric override, only exclusion
    review_scope: in
    body: Decision budget-240-override requires a per-file override, but §7 tests only exclusion and staleness.
  - kind: finding
    id: sr-concurrency-group-workflow-dispatch
    title: The ci-budget-<file> concurrency group is unspecified for the workflow_dispatch trigger
    review_scope: in
    body: github.event.workflow_run.path is null under workflow_dispatch, and the concurrency expression is evaluated before any step can look the run up.
  - kind: finding
    id: sr-acceptance-matrix-not-addressed
    title: The spec never addresses the repo's acceptance-matrix rule for its new Test Plan
    review_scope: in
    body: .claude/rules/acceptance-matrix.md requires rows for a new Test Plan. §3.C reasons through the fragment gate but not the matrix, and §4 never mentions it.
  - kind: finding
    id: sr-job-name-branch-protection-claim
    title: "The claim that keeping the job name `test` preserves branch protection is inaccurate once `test` is a matrix"
    review_scope: out
    body: The status-check contexts become `test (1)`…`test (4)`. This is harmless today because main's ruleset requires no status checks (AGENTS.md, Release).
  - kind: review
    id: spec-review-1
    title: "Spec review of 2026-09-26-ci-time-budget-design: 6 findings (5 in scope, 1 out of scope)"
    body: "Dispatched fr-spec-reviewer (read-only, separate context). Verified ci.yml:2,22-35; acceptance-report.yml:15-21; _pr_spec_status.yml:1-4; pinned-clis.yml:1-13; fr-spec-status.yml:1-3; check-change-fragment.py:60-65; pyproject.toml:29-37,51-53; test_tripwire_unarchived_plans.py:5,26; PyYAML parsing the `on` key as True. Findings: sr-cov-report-noop, sr-watchlist-unclassified-files, sr-testplan-missing-override-case, sr-concurrency-group-workflow-dispatch, sr-acceptance-matrix-not-addressed (in); sr-job-name-branch-protection-claim (out)."
resolves:
  - {id: sr-cov-report-noop, state: fixed, body: "§3.A: the shard clears addopts with `-o addopts=\"--strict-markers --cov\"` and passes `--cov-report=`. The coverage sources move to [tool.coverage.run] source. §7.8 pins the override."}
  - {id: sr-watchlist-unclassified-files, state: fixed, body: "§3.B lists every workflow watched at launch, including Release (release.yml) and Deploy explainers to Pages (pages.yml), counted on push@main."}
  - {id: sr-testplan-missing-override-case, state: fixed, body: "§7.5 adds the numeric-override case: 300s is under a 360s override but over the default, and an excluded file is never decided."}
  - {id: sr-concurrency-group-workflow-dispatch, state: fixed, body: "§3.B: the group is `ci-budget-${{ github.event.workflow_run.path || 'dispatch' }}`, and the reason dispatch is serialized separately is stated."}
  - {id: sr-acceptance-matrix-not-addressed, state: fixed, body: "§4 names the three rows added at brainstorm and how each moves with fr acceptance set-status."}
  - {id: sr-job-name-branch-protection-claim, state: out-of-scope, body: "The lack of required status checks predates this change. The spec sentence was reworded to state the real contexts rather than claim branch-protection compatibility."}
evidence:
  review: spec-review-1
  reviewer: ac104750f36d9b447
