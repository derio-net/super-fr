schema_version: 1
run: 2026-09-26-feat-version-bump-churn
step: brainstorm
outcome: done
journal:
  - kind: decision
    id: d1-intent-on-merge
    title: PRs declare a bump in a .changes/ fragment; the release workflow on main assigns the number
    body: |
      Operator chose intent-in-PR / number-on-merge over consolidating the version surfaces.
      Consolidation alone shrinks a 13-file conflict to a one-line conflict but keeps the
      collision and the CI rerun; only moving the number out of the PR removes both.
  - kind: decision
    id: d2-no-consolidation
    title: Version surfaces stay as they are; only the release bot writes them
    body: Once PRs never edit a version surface, bump-version.py already writes all 12 files plus uv.lock.
  - kind: decision
    id: d3-reports-in-scope
    title: Committed acceptance reports drop aggregates; add inserts rows by capability
    body: |
      Operator put the report conflicts in scope. The row-count stamp and status table are shared
      write hotspots. Exploration also found append_row always writes at EOF of matrix.yaml,
      so insert-by-capability is included to make "different rows do not conflict" actually true.
  - kind: decision
    id: d4-no-test-skip-guard
    title: No general version-only test-skip guard
    body: The release commit is pushed with GITHUB_TOKEN, which triggers no workflow, so it reruns nothing.
  - kind: discovery
    id: ruleset-allows-bot-push
    title: main's ruleset enforces only deletion and non_fast_forward
    body: |
      GET /repos/derio-net/super-fr/rules/branches/main returns ["deletion","non_fast_forward"] (2026-09-26),
      so a GITHUB_TOKEN release commit can fast-forward main. AGENTS.md's "branch-protection blocks direct
      commits" overstates it; the spec corrects the sentence and requires a bypass actor if rules tighten.
  - kind: discovery
    id: floors-need-a-guard
    title: Hand-written fr_version floors name a release number the PR no longer knows
    body: |
      SCOPE_FR_VERSION / WORKFLOW_FR_VERSION and plan_ops refusal text; three introduced in two months.
      Spec §3.E adds a PR-time and a release-time guard instead of a mechanism.
acceptance:
  - id: release-on-merge
    capability: Release integrity
    acceptance: Merging a PR that carries a change fragment releases it — main gets one bot release commit, tag and GitHub Release listing the fragment summaries, and no CI run starts for that commit
    origin: [super-fr:docs/superpowers/specs/2026-09-26-version-bump-churn-design.md]
    status: not-implemented
  - id: prs-never-conflict-on-version
    capability: Release integrity
    acceptance: Two PRs that both need a release never conflict over the version — the PR gate demands an added change fragment and refuses any edit to a version surface
    origin: [super-fr:docs/superpowers/specs/2026-09-26-version-bump-churn-design.md]
    status: not-implemented
  - id: version-floor-guard
    capability: Release integrity
    acceptance: A hand-written fr_version floor can never silently admit an fr that lacks its feature — it must name the predicted release at PR time and the actual release at tag time, or a failure and issue say so
    origin: [super-fr:docs/superpowers/specs/2026-09-26-version-bump-churn-design.md]
    status: not-implemented
  - id: concurrent-acceptance-rows-merge-clean
    capability: Acceptance matrix
    acceptance: Two PRs adding acceptance rows to different existing capabilities merge without conflict in matrix.yaml or any of the three committed reports
    origin: [super-fr:docs/superpowers/specs/2026-09-26-version-bump-churn-design.md]
    status: not-implemented
