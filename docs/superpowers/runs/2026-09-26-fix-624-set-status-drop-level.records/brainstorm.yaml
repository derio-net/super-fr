journal:
  - kind: decision
    id: d-carrier
    title: Drops are carried CLI-only via RecordTarget; the record kind's shape is unchanged
    body: >-
      Operator chose CLI-only over adding `drop_levels` to AcceptanceItem. The record
      artifact kind keeps version 1 (no stamp bump, no migration), so the release stays a
      patch. Step records still cannot drop refs; a step that needs one runs the verb.
  - kind: decision
    id: d-conflict
    title: The same ref in both --level and --drop-level is refused, exit 2
    body: Contradictory intent in one call. It is refused with nothing changed, like an absent-ref drop.
  - kind: decision
    id: d-empty-evidence
    title: A drop that empties a ci/scheduled row's evidence is allowed
    body: >-
      The status is the operator's explicit call in the same command, with --notes;
      set-status never judged status against evidence, and `fr acceptance check` stays the gate.
acceptance:
  - id: lifecycle-acceptance-drop-level
    capability: Artifact lifecycles
    acceptance: >-
      An operator can remove a stale evidence ref from an acceptance row with a command
      (in the same rewrite as its status move), so re-pointing a row whose tests were
      deleted needs no hand-edited YAML.
