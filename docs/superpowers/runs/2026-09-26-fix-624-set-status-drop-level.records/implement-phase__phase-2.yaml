  - kind: decision
    id: p2-check-drops-upfront
    phase: 2
    title: The three drop misalignments are refused at the top of apply_record, before the run context is loaded
    body: >-
      `_check_drops(record, drops, run_id)` runs first in `apply_record`, so a drop passed with a
      `run_id` is refused before `_run_context` reads the run (a missing run would otherwise mask
      the real refusal), and the no-item / create-item checks need only the record's shape, not the
      matrix. The absent-ref refusal stays in `_acceptance_writes`, where `drop_levels` raises
      `AcceptanceError` inside the existing except and becomes `RecordRefusedError`; all refusals
      fire before the overlay is written. An extra test pins drop + addition re-pointing a row in
      one pass (spec §2.C).
