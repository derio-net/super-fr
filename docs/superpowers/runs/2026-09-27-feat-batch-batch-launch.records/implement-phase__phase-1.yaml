journal:
  - kind: discovery
    id: p1-acceptance-record-refused
    title: "implement-phase's emits don't allow an `acceptance` record section"
    body: >-
      The shipped fr-goal manifest's `implement-phase` step emits only
      `[journal:plan, plan:ticks]`, so `allowed_sections` (fr.record.model)
      never includes `acceptance` for it — a record naming that section
      would be refused by `fr run resolve --record` (RecordRefusedError,
      "section(s) acceptance not allowed"). The step-record template's own
      comment names the fallback ("or use `fr acceptance set-status` ...
      and commit the matrix + reports"), so triage-batch-session-model was
      moved to `ci` that way instead, in its own commit
      (cc6cacb9a6903e2c5d856c0d6cc46b98a00bedef), rather than through this
      record's `acceptance:` field.
    phase: 1
