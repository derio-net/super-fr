journal:
  - kind: review
    id: review-phase-1
    title: "phase 1 code review: 3 findings (1 in scope, 2 out of scope) | ready to merge"
    body: >-
      Independent reviewer (separate context, sonnet) over f6d45f0d..HEAD against spec + plan.
      Confirmed all three fixes match spec §3.A-C, that each new test fails on pre-fix code
      (#709 same-slug local spec present; #710 asserts call count AND printed-once; #711 full
      path stored), and that --sweep-only still repairs repo-wide. Raised cr-1, cr-2, cr-3.
  - kind: finding
    id: cr-1
    title: "canonical_spec_ref escape check raises ValueError on a relative repo_root with an absolute ref"
    review_scope: in
    body: >-
      refs.py: os.path.commonpath refuses to mix a relative root with an absolute target, so the new
      check (the only line in the function that can raise) crashed where the old code tolerated a
      relative repo_root. Unreachable from current callers (resolve_repo_root is absolute) but a
      regression in the one canonical definition.
  - kind: finding
    id: cr-2
    title: "repair._repair_meta warns 'ambiguous' before canonical_spec_ref decides to keep a ref verbatim"
    review_scope: out
    body: >-
      A repo-escaping ref whose slug matches same-named specs in two lifecycle roots gets an ambiguity
      warning about a ref left untouched.
  - kind: finding
    id: cr-3
    title: "the lexical escape check reads the raw value, so a backtick-annotated escaping ref is not caught"
    review_scope: out
    body: >-
      A value like `../sibling/specs/foo.md` (note) keeps its backtick through normpath, so it is not
      seen as escaping and could still be shortened to a same-slug local spec.
resolves:
  - id: cr-1
    state: fixed
    body: >-
      Escape check uses os.path.abspath for root and target (normalises as normpath did, and makes
      both absolute). Red-first test test_canonical_spec_ref_tolerates_a_relative_repo_root
      (ValueError before, green after).
  - id: cr-2
    state: out-of-scope
    body: >-
      Not caused by this change: the same warn-then-verbatim ordering already applied to the existing
      "exists outside SPEC_ROOTS" verbatim branch before #709; this change only adds another verbatim
      trigger. Reordering repair's warnings is its own change.
  - id: cr-3
    state: out-of-scope
    body: >-
      No spec: writer receives a decorated value: stored spec: fields are YAML scalars (repair), CLI
      arguments (plan create), a parsed _meta (rework) or the v1 **Spec:** value (migration); backticked
      annotations exist only in spec-table File cells, handled by a different path. The operator chose
      a lexical test of the written value (§2); extending it to token extraction is a separate change.
