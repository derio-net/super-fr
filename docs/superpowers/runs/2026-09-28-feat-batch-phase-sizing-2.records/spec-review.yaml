journal:
- kind: finding
  id: s1
  review_scope: in
  title: The floor-failure message offers `ask:` as a fix, but an `ask:` decision never clears a floor
    failure
  body: 'check: consistency

    evidence: spec §B "Floor failure (R2)" bullet ("listing the four reason tokens") vs §B rules table
    (S = `ask:` → "needs an own ask"); R2 "unless a recorded split decision names why the phase exists";
    decision d5-error-with-override ("a spec-journal decision `phase-split-<plan>-p<N>` naming the reason
    clears it")

    scope: the contradiction is inside this spec''s own design and its R2/d5 wording

    The table says an `ask:` split still needs an own ask, so for a phase that fails the floor only `tier:`,
    `risk-first:` and `review-size:` can clear it. The floor message still lists all four tokens, so a
    planner who follows it and records `ask:` gets the same error again. R2 and d5 read as "any recorded
    split decision clears it", and the design is narrower for `ask:`. To fix it, the floor message should
    list only the three tokens that waive the floor. §B should also say why `ask:` is excluded: it is
    a claim fr can verify, so a false claim is not a reason. Add a Test Plan case that checks the message
    text.

    '
- kind: finding
  id: s2
  review_scope: in
  title: A tier/risk/review-size split of ONE ask fails the floor on the ORIGINAL phase, which records
    no split
  body: 'check: consistency

    evidence: spec §A `own` = "asks no OTHER agentic phase''s rows cite"; §B table row "first agentic
    | S absent | needs an own ask"; R1 "a further phase needs a stated reason (a different tier, …)";
    Test Plan 3 "a `tier:` split waives the floor"

    scope: the rule this spec introduces rejects the split shape that R1 names as legitimate

    Take ask R1 split by tier into p1 (standard) and p2 (hard), each linking a row that cites R1, with
    `phase-split-…-p2` "tier: …". p2 passes. p1 has asks={R1} but own={} because p2 also cites R1, so
    p1 fails the floor ("all also served by phase 2"). The only way out is a split decision on p1 as well,
    even though R1 puts the reason on the further phase. To fix it, compute `own` without the phases whose
    split reason waives the floor (tier/risk-first/review-size). Otherwise, state explicitly that both
    halves need a decision and say so in the fr-plan prose. Either way, Test Plan 3 should check the shared-ask
    pair, not only that the waived phase passes.

    '
- kind: finding
  id: s3
  review_scope: in
  title: R1/§E prose tell planners a per-ask phase needs no reason, but the ceiling (R3, d1) errors on
    every later phase without an `ask:` decision
  body: 'check: consistency

    evidence: R1 "one agentic phase per independently reviewable ask; a further phase needs a stated reason
    (a different tier, a risky piece first, or a diff too large…)"; R3 / d1-both-checks "every agentic
    phase after the first carries a recorded split reason"; §E fr-plan bullet "Split only with a recorded
    `phase-split-*` reason"; §A fourth token `ask:` ("this phase is its own ask")

    scope: the spec''s own requirements and prose disagree with its gate, so a plan that follows the new
    prose fails self-review

    R1 and the §E rewrite of "Size phases to the change" both say the default is one phase per ask, with
    a recorded reason needed only to split further. Under d1 the ceiling also errors on phase 2 of a correctly
    sized two-ask plan unless `phase-split-<plan>-p2` "ask: …" is recorded. R1 lists three reasons, and
    the design adds `ask:` as a fourth without saying why. This is d1-faithful: R3 is right, and R1 should
    not be rewritten to fit. The fix is in the design and the prose. §B should state that under d1 each
    per-ask phase after the first records an `ask:` decision. The §E fr-plan and fr-goal §3 sentences
    must tell the planner to record it, or a planner following the new guidance fails the gate on every
    multi-ask plan. Test Plan 6 should check that sentence.

    '
- kind: finding
  id: s4
  review_scope: in
  title: Cut-off fails open on an unparseable Requirements table; the 'already refused upstream' justification
    only holds inside an fr-goal run
  body: 'check: consistency

    evidence: spec §B Scope "A Requirements section that fails to parse is also left silent here, because
    the requirements gate at `brainstorm` and `spec-review` already refuses it"; requirements.py:73 `REQUIREMENTS_PREDATES`
    (runs that predate the gate record it, never meet it); docs/superpowers/specs/2026-06-11-bridge-dispatch-hardening-design.md:21
    (a prose `## Requirements` heading on a legacy spec)

    scope: unsure — the cut-off is sound for this repo''s live plan, but the stated reason is not always
    true, so tagged in scope

    The requirements gate is derived evidence on fr-goal manifest steps. A plan written by standalone
    fr-plan, or in a run where that evidence reads "predates", never passes that gate. A typo in the table
    header then switches the sizing gate off silently. Keeping silence for legacy specs is right: bridge-dispatch-hardening
    has a prose `## Requirements` section that does not parse, and it must stay exempt. So the cut-off
    should say "parses", not "has a section". Also either (a) warn when the section''s first table row
    looks like `| id | requirement | source |` but fails to parse, or (b) drop the "already refuses it"
    claim and state plainly that this is a deliberate fail-open. The Test Plan should cover the unparseable-table
    case.

    '
- kind: finding
  id: s5
  review_scope: in
  title: Proportionality's HEAD-only reads are feasible, but the design must name the text-level helpers;
    the existing loaders read the working tree
  body: 'check: codebase

    evidence: spec §D "the spec, matrix and spec journal are read with `git show HEAD:<path>` through
    the existing `_show_head`"; proportionality.py:284 `_show_head` (returns text); requirements.py:544-554
    `load_spec_matrix` (reads `repo_root / MATRIX_REL` from the working tree); acceptance/model.py:115
    `parse_matrix(text)`; acceptance/check.py:41-58 `resolve_identity` (falls back to `git remote get-url
    origin`); proportionality.py:227-247 `_justifiers` (the active-then-archived HEAD pattern, for plan
    journals only)

    scope: without these named, the obvious implementation reuses the working-tree loaders and breaks
    deliver''s byte-hash contract, which this change introduces

    The design is buildable: `parse_matrix` accepts text and `_show_head` supplies it. But the obvious
    reuse, `load_spec_matrix` as self-review would call it, reads the working tree, and Test Plan 5 would
    catch it only for the journal. §D should name `parse_matrix` over `_show_head`. It should resolve
    the spec journal active-then-archived at HEAD, as `_justifiers` does for plan journals, using `spec_journal_slug`
    (as `_skeleton_overridden` does, plan_ops.py:1793). It should also say where `spec_ref` comes from.
    `resolve_identity` uses the matrix''s `org`/`repo` when present (this repo''s matrix has both, matrix.yaml:28-29),
    but otherwise it reads the clone''s origin remote, which breaks the "same HEAD, same bytes" contract.

    '
- kind: finding
  id: s6
  review_scope: in
  title: Undefined counts and message slots, and Test Plan gaps for behaviour the design promises
  body: 'check: consistency

    evidence: §D "2 agentic phases for 3 asks (R1, R2, R3)" vs R4 "against the asks they serve"; §B floor
    message "all also served by phase <M>"; §A "Any other title prefix is **malformed**, which self-review
    reports as an error"; Test Plan 2–3

    scope: gaps between this spec''s design and its own Test Plan

    (1) In §D, it is unclear whether the "asks" count is every requirement id in the spec or the union
    of ids the agentic phases serve. They differ as soon as a requirement''s row is linked only to a manual
    phase or to none, so pick one to match R4. (2) The floor message''s `<M>` has no value when the phase
    cites no requirement, for example a single-agentic-phase plan whose rows cite no R-id, or the #745
    skeleton with no rows. Define the no-M wording. (3) The design has four behaviours the Test Plan never
    checks: the malformed-prefix error surfacing through `_phase_sizing_issues` (only `split_decisions`
    is tested); a cross-repo spec or a spec file that does not exist staying silent; an unparseable Requirements
    table staying silent (see s4); and a single agentic phase with no R-citing rows. Add them to Test
    Plan item 3.

    '
- kind: review
  id: spec-review
  title: 'independent spec review: 6 findings'
  body: 'Traceability: every span of the three input entries is covered, deferred or context. No dropped,
    reinterpreted or invented finding. R3 widens "more phases than asks" and R5 narrows "No [manual] phase
    for a single operator step", but both cite the operator decisions that made those choices (d1, d3).
    Decisions d1–d7 are honoured, except that the `ask:` token narrows d5 (s1). No existing test or live
    plan in this repo newly fails self-review. The one live plan (2026-07-09-multi-backend-git-host-adapters)
    cites a spec with no Requirements section. No test fixture outside the requirements tests carries
    a `## Requirements` table, and no test pins the proportionality report''s full text.

    input-coverage:

    ```input-coverage

    | span | coverage |

    |---|---|

    | "fr-plan sizes phases to the asks: one phase per independently reviewable ask," | R1 |

    | "a manual step is not a phase" | R5 |

    | "Batch `phase-sizing-2` of derio-net/super-fr: 2 issues, delivered as ONE pull request. ## super-fr#745:
    fr-plan over-splits phases; each phase adds a fixed orchestrator + review round trip: size phases
    to the asks Live OpenCode run (4.26.5): a two-ask ~1,200-line feature split into 4 phases (skeleton,
    validation, API+UI, a [manual] screenshots phase). Orchestrator $6.00 of $8.46 (71%), executors 14%,
    419 orchestrator turns. Matches the page: one-phase $4.16/$4.27 vs three-phase $5.58. Note: Feature
    (fr-goal), batch `phase-sizing`." | context |

    | "#674 made one phase legal; this makes it the default:" | R1, R6 |

    | "one phase per independently reviewable ask," | R1 |

    | "a manual step is a Test Plan line, not a phase." | R5 |

    | "## super-fr#760: fr-plan: ''prefer 4–6 phases'' contradicts ''one agentic phase is first-class''
    and #745''s measurements fr-plan SKILL.md says both "one agentic phase is first-class" (l.68) and
    "Prefer 4–6 phases" (l.89), against #745''s measurements. Note: Same fix as super-fr#745: fold into
    batch `phase-sizing` (in flight, feat/batch-phase-sizing) when its brainstorm resumes. ## Why these
    belong together Retry of the batch cancelled on 2026-09-28 at its question gate (#783): dispatch only
    after question-order (#783) merges. Wave 5. #674 made a one-phase plan legal; #745 shows fr-plan still
    over-splits (4 phases for 2 asks; the orchestrator 71% of cost, 419 turns)." | context |

    | "Make the ask count the default phase count," | R1 |

    | "a [manual] operator action a Test Plan line," | R5 |

    | "and have proportionality/self-review flag a phase with no ask of its own." | R2, R4 |

    | "Edits the fr-plan skill (and both mirrors) and fr/proportionality.py; closeout-always edits the
    fr-goal and fr-debugging skills: if both touch fr-goal SKILL.md, rebase before merging." | context
    |

    | "Also closes #760 (fr-plan''s ''prefer 4–6 phases'' line contradicts one-phase-first), the same
    fix." | R7 |

    | "## Delivery rules - Work on branch `feat/batch-phase-sizing-2`. - Open a draft PR as soon as the
    spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
    Closes derio-net/super-fr#745 Closes derio-net/super-fr#760 - Do not name any member issue as a phase
    `tracking_issue` in the plan: the bridge would then own that issue''s `fr:` labels." | context |

    | "## Problem fr-goal is meant to size a plan''s phases to the feature. In practice it over-splits,
    and every extra phase has a fixed cost that doesn''t depend on how much code the phase contains. **Observed
    (OpenCode, fr 4.26.5):** one feature with two asks, (1) a business-rule check and (2) its demo UI
    and API. That''s a ~1,200-line change. fr-plan produced **four phases**: 1. a walking skeleton; 2.
    complete combinations and validation; 3. API and demo UI; 4. `[manual]` attach screenshots to the
    PR. Phase 4 is a single operator action, written as a phase of its own." | context |

    | "Each implemented phase costs the same fixed round trip, whatever its size: - an executor dispatch;
    - a dispatched reviewer (`review-phase`); - the orchestrator''s resolve, advance and record-commit
    turns for both units. The run''s costs, by role (delivery only): \| role \| sessions \| cost \| \|---\|---\|---\|
    \| orchestrator \| 1 \| $6.00 (71%) \| \| review subagents (`general`) \| 6 \| $1.30 \| \| executors
    (1 hard, 3 standard) \| 4 \| $1.15 \| \| spec reviewer \| 2 \| $0.01 \|" | context |

    | "- The executors did the actual implementation for **14% of the cost**. - The orchestrator ran **419
    turns**. Every turn re-reads its context, so each phase''s bookkeeping gets more expensive as the
    run goes on. - Phase 3''s implementation plus review took 36 min; phases 1 and 2 took 5 and 8 min.
    The split into three didn''t isolate anything hard: it added two more round trips. This matches the
    architecture page''s own measurement: one-phase plans cost $4.16 and $4.27 against $5.58 for three
    phases. A comparable single-phase run of the same feature, on an earlier fr, delivered for $6.15,
    against $6.41 for the multi-phase run. ## Proposed" | context |

    | "1. **A sizing rule in fr-plan:** by default, one phase per independently reviewable ask in the
    brief." | R1 |

    | "Split further only with a stated reason: a different tier is needed, a risky piece should land
    before the rest, or the diff is too large for one review." | R1 |

    | "Put the reason in the phase''s prose, so plan review can check it." | deferred |

    | "2. **No `[manual]` phase for a single operator step.** Record it as a step in the delivery checklist
    or the Test Plan instead." | R5 |

    | "A phase is an implement-and-review unit." | context |

    | "3. **Plan review flags over-splitting:** more phases than asks without a stated reason," | R3 |

    | "or phases estimated under a threshold (e.g. < 150 lines)" | deferred |

    | ", becomes a finding." | R3 |

    | "4. **Report the overhead:** `fr run cost` / the PR body''s cost table gets a per-phase line splitting
    the executor''s work from orchestrator and review overhead." | deferred |

    | "That makes the price of each extra phase visible." | context |

    | "5. **Measure it:** a before/after audit (`fr-audit`) on the same feature, one phase per ask vs
    today''s sizing." | deferred |

    | "## Related - #597: performance/cost measures. - #674: single phase as a first-class plan shape.
    - #653: extra bookkeeping turns." | context |

    | "## Problem `plugins/super-fr/skills/fr-plan/SKILL.md` gives the planner contradictory sizing guidance:
    - line 68: "**Size phases to the change:** one agentic phase is first-class (no marker, no override)."
    - line 89–90: "Bite-sized steps: 2-5 minutes each. Prefer 4–6 phases: every additional phase re-reads
    the accumulated handoff, so cost grows superlinearly with phase count." "Prefer 4–6 phases" also contradicts
    #745''s measurements (one-phase plans came out cheaper), and the "superlinear" rationale argues for
    *fewer* phases, not a 4–6 floor. ## Why it matters Found while filing #759 (see its follow-up comment,
    item 1). In the #759 run the planner, told "single phase", compressed the whole UI into one step ("implement
    styled mode buttons, card quantities and number input"). The detail lived only in the spec. Nothing
    in fr limits plan size — no cap on phases or steps, no truncation of the executor handoff — so the
    compression was the planner''s choice, steered by guidance that pulls both ways. ## Proposed" | context
    |

    | "Reconcile the two lines against #745''s data: size phases to the change (one is first-class), drop
    the "prefer 4–6" floor," | R7 |

    | "and keep steps bite-sized *within* a phase so a one-phase plan does not collapse a spec section
    into a single step." | R7 |

    | "Split out of #759 (whose spec, `2026-09-28-requirements-traceability-design.md`, lists this as
    a non-goal). 🤖 Generated with [Claude Code](https://claude.com/claude-code)" | context |

    ```

