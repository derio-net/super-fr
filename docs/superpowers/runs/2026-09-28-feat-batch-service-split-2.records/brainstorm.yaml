  - {kind: decision, id: q4-no-adapter, title: "jenkins and jira are rejected by the schema until their adapters ship", body: "Operator chose 'Reject until adapters': step 1 accepts only none plus the forge-native types."}
  - {kind: decision, id: q5-no-tracker-findings, title: "Under tracking none, findings stay out-of-scope; closeout drops the file-an-issue/deferred lines; journal model unchanged"}
  - {kind: decision, id: q6-issue-cmds, title: "Under tracking none, fr apply --yes and triage batch dispatch refuse naming tracking: none; the acceptance template omits the debt-issue step; triage collect still reads the forge"}
  - {kind: decision, id: q7-no-ci-delivery, title: "Under ci none, the Ready checklist reads 'local suite green (evidence: <log>)' and fr-goal/fr-acceptance prose says the local suite is the gate"}
  - {kind: decision, id: q8-surface, title: "New read-only `fr services` verb (with --json) prints each resolved service and its source; added to READ_ONLY_COMMANDS"}
  - {kind: decision, id: q9-migration, title: "fr-profiles becomes a registered artifact kind: stamp, SchemaMigration flat->nested, structure validator; the CLI-entry gate migrates it"}
  - {kind: decision, id: r2q1-blast-radius, title: "Accept the entry gate's usual refusals (default branch, non-interactive) for the fr-profiles kind; no special case"}
  - {kind: decision, id: r2q2-migrated-ci, title: "Migration writes ci as detected: forge's own if a CI config exists that is not solely fr's scaffolded acceptance template, else none", body: "Operator chose 'Detected' and asked: 'aren't ci configs created regardless so far? If so, how can the migration know if the config is active?' Answer recorded in the spec: before #787 fr scaffolded the CI file regardless, so presence alone proves nothing; the offline migration discounts a config that is solely fr's own acceptance template; activity (pipelines actually running) is only knowable from the forge, which the migration does not call."}
