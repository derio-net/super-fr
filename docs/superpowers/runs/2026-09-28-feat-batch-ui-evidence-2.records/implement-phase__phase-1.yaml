journal:
  - kind: discovery
    title: "AcceptanceItem.visual lands in P1.T2, not P1.T3"
    body: >-
      The plan assigns `AcceptanceItem.visual` to P1.T3 ("record sections"),
      but `fr acceptance add --visual-state/--visual-interaction` (P1.T2)
      writes through `fr.record.apply`'s `_apply_rows` -> `apply_record`,
      which builds the matrix `Row` from an `AcceptanceItem`. The CLI cannot
      thread `visual` to the writer without the field existing on
      `AcceptanceItem`, so it was added in P1.T2 as necessary plumbing. P1.T3
      then adds the record's own evidence section (`StepRecord.visual`:
      `VisualEvidence`/`VisualShot`) on top of it. No behavior gap — both
      tasks' RED tests are still real (P1.T3's record-apply test exercises a
      different code path, `fr.record.apply` directly rather than the CLI)
      — but a reader diffing task boundaries against the plan should know
      this before assuming P1.T3's diff is self-contained.
  - kind: discovery
    title: "render_row_block did not emit verify-style optional fields generically"
    body: >-
      `fr.acceptance.edit.render_row_block` (the ONE place that renders a
      row block into matrix.yaml) had to be extended by hand for `visual`,
      the same way `verify` was added before it — there is no generic
      "render every optional field" loop, so a future optional `Row` field
      needs the same one-line addition here or it round-trips as `None`
      silently (caught in this phase only because the CLI round-trip test
      exercises it explicitly).
  - kind: discovery
    title: "Shape for phase 2/3: where the visual vocabulary now lives"
    body: >-
      `fr.acceptance.model.Visual` (states/interactions StrictStr tuples,
      `check_visual_names` the shared non-empty/no-duplicate validator) and
      `Row.visual: Visual | None`. `fr.record.model.VisualShot` (path,
      shows — min_length=1), `VisualEvidence` (row, optional script, shots —
      min_length=1), `StepRecord.visual: tuple[VisualEvidence, ...]` in the
      `evidence` section group (`_SECTION_FIELDS["evidence"]` now:
      `evidence`, `emitted`, `visual`). Matrix kind is now version 3, record
      kind version 4 (`RECORD_SCHEMA_VERSION`). None of this phase touches
      `_VERIFIABLE_EVIDENCE`/`_DERIVED_EVIDENCE` in `run_cmd.py`, the
      `witness_transcript`/`read_file_since`/`shell_named_since` telemetry
      predicates (spec §C), the `fr-goal.yaml` manifest's `visual` evidence
      name, or the skills/agent prose (spec §E) — all still owed by a later
      phase.
