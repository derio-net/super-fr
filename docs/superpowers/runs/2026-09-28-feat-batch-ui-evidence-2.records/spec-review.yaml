  body: 'Removed the committed/tracked condition: R5 now reads ''a capture script is preferred'', §D leaves
    committing to the implementer, and check 5 verifies only that the named script exists and that the
    stage re-ran it. Matrix row visual-evidence-capture-script text aligned.'
- id: s2
