  body: R4's text now states d3 (the review-phase reviewer drives the UI and opens its own screenshots)
    and d5 (fresh screenshots of the delivered branch at deliver).
- id: s3
  state: fixed
  body: Check 3's freshness rule is limited to review-phase (d3) and deliver (d5); at implement-phase
    only the opening must fall in the unit (d2), and the Test Plan pins a stale implement-phase shot as
    accepted.
- id: s4
  state: fixed
  body: '§C now says OpenCode''s store is read (`_opencode_wrote_since`, telemetry.py:1002) but has no
