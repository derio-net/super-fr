  body: |+
    # super-fr#816: review-phase record on OpenCode: a fabricated reviewer id and findings: none despite 6 reviewer findings

    ## What happened
    super-fr-3 take 10 run B (fr 4.35.0, OpenCode 1.18.32, GitLab, gpt-6-luna high). At review-phase, three `general` reviewer sessions raised 6 in-scope findings between them (ses_f154409f3f, ses_f153bde73f, ses_f153535eef).

    - After `claim --agent-type general` was refused, the orchestrator recorded the reviewer id `opencode-gpt-6-luna`. No such session or agent exists.
    - The review-phase record says `findings: none`.
    - The PR body's `## Findings` lists only the last 3 spec-review findings.

    fr accepted the record. On OpenCode the reviewer is `unobserved`, so neither the fabricated id nor the missing findings were caught.

    ## Expected
    - fr supplies or verifies the reviewer identity (the dispatched child session in opencode.db), and refuses an id that matches no dispatched session.
    - The review record's findings come from, or are checked against, the reviewer's returned message. `findings: none` with a non-empty reviewer return is refused.
    - The PR body's Findings section includes the review-phase findings and how each was resolved.

    Related: #777, #797.

- kind: decision
  id: d-seam
  title: 'Seam: one harness-neutral session protocol'
  body: 'Round 1 Q1 → "One session protocol": a harness-neutral ObservedSession (answered rounds, dispatches with their returned text, file reads, shell calls) with a Claude Code backend (today''s JSONL code moved behind it) and an OpenCode backend; every gate calls the protocol.'
- kind: decision
  id: d-run-session
  title: 'Run session: the plugin''s shell.env export'
  body: 'Round 1 Q2 → "Plugin shell.env var": the super-fr OpenCode plugin''s shell.env hook exports the calling session id into every bash call; fr walks parent_id to the top-level session. No plugin → unobserved, as today.'
- kind: decision
  id: d-coverage-refuse
  title: 'spec-review coverage: refuse a differing block'
  body: 'Round 1 Q3 → "Refuse a differing block": the recorded review entry''s input-coverage block must equal the block in the reviewer''s return (whitespace-normalised); a re-cut or relabel is refused naming the first divergent span. The orchestrator still writes the record.'
- kind: decision
  id: d-findings-block
  title: 'review-phase: a structured findings block in the reviewer''s return'
  body: 'Round 1 Q4 → "Structured findings block": the reviewer brief asks for a fenced findings block at the end of the return; every item must appear as a phase finding in the journal; a return with no block is refused where the return is observable.'
- kind: decision
  id: d-answered-by-refuse
  title: 'Unobserved gate with no answered_by: refuse'
  body: 'Round 1 Q5 → "Refuse, name both values": resolve exits 2 asking for answered_by operator|agent explicitly, on every harness (the --answered-by flag loses its agent default); fr run gates says ''as claimed, unobserved'' when the step carries unobserved=operator-gate.'
- kind: decision
  id: d-parity-partial
  title: 'Parity: partial plus a post-merge live row'
  body: 'Round 1 Q6 → "partial + post-merge live row": OpenCode cells move to partial (fr reads it, live path unproven); an acceptance row with verify: post-merge re-runs take 10 B''s shape; a follow-up flips parity to enforced.'
- kind: decision
  id: d-every-harness
  title: Return checks apply on every observable harness
  body: 'Round 2 Q1 (follows d-seam) → "Every observable harness": Claude Code and OpenCode both read the reviewer''s final message; the coverage and findings-block checks apply wherever fr can see the return. Hermes stays unobserved (warned, recorded as claimed).'
- kind: decision
  id: d-finding-ids
  title: Findings block ids are prescribed by the brief
  body: 'Round 2 Q2 (follows d-findings-block) → "Brief-prescribed ids": the review-phase brief tells the reviewer to number findings p<N>-r<k>; each block line is `id | in/out | summary`; every block id must be a plan-journal finding against phase N with the same review_scope (reclassification stays visible, as today). No schema change.'
