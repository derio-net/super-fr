journal:
  - kind: finding
    id: p1-r1-duplicate-design-sections
    review_scope: in
    title: "Two same-named ### Design subsections always refused as out of order"
    body: "fidelity.py parse_design_sections kept duplicates while check_inventory de-duplicated `seen`, so a spec with two `### Notes` got a false order refusal the reviewer could never satisfy, and InventoryCounts.sections double-counted. In scope: new code in this change."
  - kind: finding
    id: p1-r2-test-gaps
    review_scope: in
    title: "Missing tests: open/legacy-unconfirmed departures, quote-boundary clause, escaped quote, nested fence, duplicates; substring import guard"
    body: "The behaviour was right but unpinned: a never-resolved departure and a legacy `unconfirmed` one at the witness, a clause spanning two separate quotes, a `\\\"` escape in a clause, a longer fence holding a shorter one, duplicate sections. The import-direction test was a bare substring check with an unclosed file. In scope: tests for this change."
  - kind: finding
    id: p1-r3-unconfirmed-refusal-shape
    review_scope: in
    title: "unconfirmed_refusal always refuses but kept a str | None type, unused params and a dead unconfirmed= write"
    body: "After retirement the helper can only refuse; its Optional return, `del target, scope`, the callers' `is not None` checks and the `unconfirmed=res.state == \"unconfirmed\"` write were dead weight obscuring the retirement. In scope: code this change edited."
  - kind: finding
    id: p1-r4-backtick-info-string
    review_scope: in
    title: "A backtick run with a backtick in its info string opened a fence"
    body: "_FENCE_RE treated \"```inline``` text\" at line start as a fence opener, swallowing the rest of the Design (CommonMark forbids a backtick in a backtick fence's info string). In scope: new parser in this change."
  - kind: review
    id: p1-review
    title: "phase 1 code review: 4 findings (r1-r4), all in scope, all fixed"
    body: |
      Independent reviewer over d0d66c4a..9ba1748f against spec §A-§D, §H and Test Plan 1-4.
      Findings: p1-r1-duplicate-design-sections, p1-r2-test-gaps, p1-r3-unconfirmed-refusal-shape,
      p1-r4-backtick-info-string — each verified against the code and fixed in 8dd3156a with tests
      (r1, r4 red first; r2's gap tests passed on first run, confirming the behaviour and pinning it).
      Verified clean by the reviewer: clause-partition walk (whitespace, elision fragments, middle-column
      pipe protection, escapes), CommonMark fence rules, the four run_cmd.py tables and both manifest
      copies, predates handling, staged-resolve reading in the witness, unconfirmed still folding,
      fr/requirements.py free of fr.fidelity. Out of scope, noted: fr/requirements.py `_locate_section`
      remains fence-unaware (pre-existing; the spec limits the fence fix to the Design parser).
