schema_version: 7
run: 2026-10-02-feat-wave-driver
step: brainstorm
outcome: done
journal:
- kind: decision
  id: scope-all-three
  title: One spec for the driver, the board views and the page skills
  body: 'Operator: the three parts fit together, so one spec.'
- kind: decision
  id: verb-drive-loop-once
  title: fr triage batch drive, a loop with --once
  body: Operator chose the foreground loop plus a single-pass --once over a single-pass-only verb or a daemon.
- kind: decision
  id: closeout-through-runner
  title: Close-out starts through the runner
  body: Operator chose a runner work item (unit run, payload kind closeout) over printing the command or running the steps in-process.
- kind: decision
  id: waves-as-batch-fields
  title: wave and after are fields on each batch
  body: Operator chose fields on Batch (judgements schema 3) over a separate plan file; the in-flight cap is a drive flag.
- kind: decision
  id: post-merge-config
  title: The host install is a per-repo post_merge command
  body: 'Raised by the operator: without install.sh the harnesses on the host run a stale fr. The driver runs a post_merge command from .fr/triage.yaml once per merge, before the close-out.'
- kind: decision
  id: scope-groups-and-views
  title: Comma-separated repo groups; three new board views; nothing removed
  body: 'Operator asked for a comma-separated repo list as one group, wave tabs with the latest preselected, and a reorganisation around what changed and what to do next. Operator: the same three artifacts,
    nothing removed, just reordered, plus three new views (Since last report, Needs you now, Next up).'
resolves: []
acceptance:
- id: batch-waves-and-deps
  capability: triage-batch-drive
  acceptance: An operator can give a triage batch a wave and prerequisite batches, and invalid prerequisites (unknown, self, cycle) are refused before anything is written
  origin:
  - super-fr:docs/superpowers/specs/2026-10-02-wave-driver-design.md#R1
  status: not-implemented
- id: batch-drive-pass
  capability: triage-batch-drive
  acceptance: fr triage batch drive keeps at most N batches dispatched and unmerged, dispatches in wave order, skips a batch whose prerequisites are unmerged, resumes after a stop without repeating work,
    and signals done, waiting or refused through its exit code
  origin:
  - super-fr:docs/superpowers/specs/2026-10-02-wave-driver-design.md#R2
  - super-fr:docs/superpowers/specs/2026-10-02-wave-driver-design.md#R3
