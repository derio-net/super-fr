  status: not-implemented
- id: batch-drive-operator-boundary
  capability: triage-batch-drive
  acceptance: The driver merges a batch PR only when it is not a draft and every check is green, and never readies, approves or un-drafts a PR
  origin:
  - super-fr:docs/superpowers/specs/2026-10-02-wave-driver-design.md#R4
