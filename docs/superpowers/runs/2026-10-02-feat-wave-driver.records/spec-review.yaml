schema_version: 7
run: 2026-10-02-feat-wave-driver
step: spec-review
outcome: done
journal:
- kind: review
  id: spec-review-1
  title: 'independent spec review: 14 findings (12 in scope, 2 out of scope)'
  body: All 7 recorded decisions are honoured. The review checked the spec against the codebase (merge_one, batch dispatch, herdr runner, facts and judgements schemas, closeout.py), against itself, and
    the acceptance rows. Findings sr-1 to sr-14; every in-scope one is fixed in the spec.
- kind: finding
  id: sr-1
  title: The pass reads stale facts; nothing in the design re-collects each pass
  body: derive_batch_stage reads facts.json, written only by collect; the spec never says a pass re-collects (batch.py:163-179, model.py:276-298).
  review_scope: in
- kind: finding
  id: sr-2
  title: merge_one is not blocking-free, and it can push to the PR branch
  body: merge_one blocks in wait_required_checks and pushes an update when behind its base or off its version slot (batch_merge.py:185-236); R4's 'never waits' cannot be met by it. Check vocabulary also
    differs from facts.
  review_scope: in
- kind: finding
  id: sr-3
  title: '''Existing dispatch/merge path'' is inline in Typer commands; per-repo checkouts unspecified'
  body: batch dispatch and merge bodies are inline (triage_batch_cmd.py:764-1016); --checkout is one path; R15 groups repos.
  review_scope: in
- kind: finding
  id: sr-4
  title: Where a goal batch's run id for fr pickup comes from is unspecified
  body: Neither Batch nor DispatchEvent stores the run id (model.py:350-358); pickup --run needs it (pickup_cmd.py:59-92).
  review_scope: in
- kind: finding
  id: sr-5
  title: The herdr agent_name and can_dispatch changes are unnecessary
  body: agent_name's removeprefix is a no-op for closeout-<id> and the hash already makes it unique; can_dispatch ignores payload.kind (runner.py:82-88,131); payload.model and checkout still need a source.
  review_scope: in
- kind: finding
  id: sr-6
  title: closed-out contradicts 'stage derivation unchanged'; partial is an unhandled dependency state
  body: Design says derivation is unchanged yet derives closed-out; a merged PR with open members derives partial, which is neither satisfiable nor unsatisfiable (batch.py:43-57,163-179).
  review_scope: in
- kind: finding
  id: sr-7
  title: Definition of 'unplaced' differs between R9/R18 and Design D
  body: R9 flags every open unplaced issue; Design D only those with a kind.
  review_scope: in
- kind: finding
  id: sr-8
  title: post_merge 'once per merge' conflicts with 'no driver state' and has no crash-safe record
  body: A kill between post_merge and the closeout event repeats the command; trust boundary of a host command from .fr/triage.yaml; TriageConfig is extra=forbid (check_config_fresh, batch_dispatch.py:128).
  review_scope: in
- kind: finding
  id: sr-9
  title: Schema rules for judgements schema 3 and the facts schema change for R15 are unspecified
  body: schema_ is Literal[1,2], JUDGEMENTS_SCHEMA is 2, save_batches stamps it (model.py:36-40,437,490); R15 needs a third ScopeKind and facts schema 4 (Facts is extra=forbid).
  review_scope: in
- kind: finding
  id: sr-10
  title: One spec carries three independent deliverables of very different size
  body: The Design spans driver, runner contract, judgement model, origins, architecture, snapshots, tabs, groups and page reordering; delivery order must be fixed in the spec.
  review_scope: in
- kind: finding
  id: sr-11
  title: Requirements without Test Plan coverage
  body: R2's --yes gate, R13, R12's gutter and theme variant, R18's six kinds, R17's retention and corrupt snapshot, R20's orderings, the clock seam and the exit-code vocabulary.
  review_scope: in
- kind: finding
  id: sr-12
  title: Archive-PR lookup and the close-out's end are left to guess
  body: Real heads are chore/archive-<plan>, chore/closeout-<run-id>, chore/closeout-<branch-slug> (closeout.py:169-178); 'naming the batch' matches only the last.
  review_scope: in
- kind: finding
  id: sr-13
  title: The herdr runner dispatches only inside a herdr session; the loop inherits this
  body: preflight needs HERDR_ENV=1 and HERDR_WORKSPACE_ID (runner.py:106-116); pre-existing.
  review_scope: out
- kind: finding
  id: sr-14
  title: 'Verified-correct claims: soft point, single-repo --repo today, no schema clash'
  body: triage_batch_cmd.py is the _SOFT_POINTS entry; --repo takes one OWNER/REPO (triage_cmd.py:67-90); git and process starts belong to seam/command modules.
  review_scope: out
