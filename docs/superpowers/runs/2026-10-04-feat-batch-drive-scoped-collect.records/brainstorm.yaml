journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Operator brief (verbatim) — batch drive-scoped-collect, gh#911
    body: |
      /fr-goal Drive collects only what its selected batches need each pass

      Batch `drive-scoped-collect` of derio-net/super-fr: 1 issues, delivered as ONE pull request.

      ## super-fr#911: Drive: every pass re-collects all facts (200+ serial gh issue view calls)
      each drive pass re-collects all facts with 200+ serial gh issue view calls

      ## Why these belong together
      Needs a design (scope of the per-pass collect); builds on the read-timeout/retry change

      ## Delivery rules
      - Work on branch `feat/batch-drive-scoped-collect`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#911
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.

      Issue body (gh#911): Found in wave-driver Test Plan item 16 (live two-batch wave, 2026-10-03, during a GitHub API degradation). Each driver pass calls `collect_into`. On this repo that includes one `gh issue view` per judged issue, more than 200 serial calls, so a pass took about 10 minutes against the 120s `--interval`, and every call was another chance to stall (one hung on `gh issue view 625` for over 2 minutes). The driver only needs fresh state for the batches it is acting on: their members, their PRs and the open `chore/*` PRs. Consider a scoped collect for the driver (the selected batches' members and PRs), or reusing unchanged facts between passes.
  - kind: decision
    id: d1-carry-known-closed
    title: Carry known-closed judged keys over from the previous facts.json
    body: Operator chose carry-over (over scoping views to batch members, or both). A judged key the previous facts show closed is carried, with links recomputed; only keys that just left the open list, were unviewed, or never seen are viewed. facts.json stays complete for the board.
  - kind: decision
    id: d2-driver-only
    title: Only the driver carries over; fr triage collect stays a full re-read
    body: Operator chose driver-only. collect is the explicit refresh that heals carry-over drift.
  - kind: decision
    id: d3-every-pass
    title: Every drive pass carries over, the first included
    body: Operator chose every pass with a readable same-scope facts.json; none readable falls back to a full collect.
  - kind: decision
    id: d4-cost-line
    title: One line per pass naming issues viewed vs carried over
    body: Operator chose a per-pass report line, e.g. "collect - 3 issues viewed, 214 carried over".
acceptance:
  - id: drive-collect-carries-closed
    capability: Backlog triage
    acceptance: A drive pass never views a judged issue the previous facts already show closed; it carries it with fresh PR links, an issue open again reads open, and a fully closed merged batch stays merged.
    origin: ["super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R1", "super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R3", "super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R7"]
    status: not-implemented
  - id: drive-collect-views-what-changed
    capability: Backlog triage
    acceptance: A drive pass views every judged issue that just left the open list, was unviewed or never seen, and collects fully when no same-scope previous facts are readable.
    origin: ["super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R2", "super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R4"]
    status: not-implemented
  - id: collect-stays-full
    capability: Backlog triage
    acceptance: fr triage collect never carries facts over; it views every judged issue that is not open.
    origin: ["super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R5"]
    status: not-implemented
  - id: drive-collect-cost-line
    capability: Backlog triage
    acceptance: Each drive pass prints one line naming the issues its collect viewed and carried over.
    origin: ["super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R6"]
    status: not-implemented
  - id: drive-pass-fast-on-settled-backlog
    capability: Backlog triage
    acceptance: On a repo with a large settled judged backlog, a drive pass after a full collect takes seconds, not minutes, and fr triage check reports the same settled count.
    origin: ["super-fr:docs/superpowers/specs/2026-10-04-drive-scoped-collect-design.md#R1"]
    status: not-implemented
    verify: post-merge
