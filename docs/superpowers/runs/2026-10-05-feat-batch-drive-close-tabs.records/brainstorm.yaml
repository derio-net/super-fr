journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Batch drive-close-tabs brief (super-fr#918, super-fr#919)
    body: |
      /fr-goal Drive manages its herdr sessions: one workspace per wave, finished sessions closed

      Batch `drive-close-tabs` of derio-net/super-fr: 2 issues, delivered as ONE pull request.

      ## super-fr#918: Drive leaves a finished batch's runner sessions open (batch and close-out tabs)
      drive leaves a finished batch's batch and close-out runner sessions open

      ## super-fr#919: Drive: open each wave's sessions in a herdr workspace of its own (<prefix>-wave-<n>)
      drive should open each wave's sessions in a herdr workspace of its own

      ## Why these belong together
      #918 and #919 are the same runner-protocol extension (a wave/group hint and a close operation on the work item); one design covers both. Shares the close-out/archive path with drive-closeout-recognition.

      ## Delivery rules
      - Work on branch `feat/batch-drive-close-tabs`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#918
        Closes derio-net/super-fr#919
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.
  - kind: discovery
    id: herdr-sees-status
    title: herdr reports per-tab agent status and lists tabs across workspaces
    body: |
      `herdr tab list` carries `agent_status` (idle|working|blocked|done|unknown, AgentStatus
      enum, protocol 22); without `--workspace` it lists every workspace's tabs.
      `workspace create` returns workspace, first tab and root pane. The wave-driver premise
      "the runner cannot see whether a session ended" no longer holds.
  - kind: discovery
    id: isolation-host-worktree
    title: Run isolated in host-worktree mode
    body: Docker (colima) was unreachable at start, so the devcontainer up failed; the run
      was started with FR_ISOLATION_TARGET=worktree, as other recent runs on this repo were.
  - {kind: decision, id: q1-default-prefix, title: "Default prefix is `drive` (drive-wave-<n>, drive-no-wave)", body: "Operator chose the fixed neutral default over a scope-derived one or opt-in grouping."}
  - {kind: decision, id: q2-closable-status, title: "Close idle, done and unknown; skip working and blocked", body: "Operator chose: all but working/blocked are closable; busy ones retried next pass."}
  - {kind: decision, id: q3-close-default, title: "Closing is on by default; --keep-sessions opts out", body: "Operator chose default-on with an opt-out flag."}
  - {kind: decision, id: q4-empty-workspace, title: "An emptied wave workspace is closed; the driver's own never", body: "Operator chose to close a workspace whose last tab the driver closes."}
  - {kind: decision, id: q5-batch-tab-timing, title: "Batch tab closes with the close-out tab, at archive merge", body: "Operator chose the #918 trigger for both tabs over closing the batch tab at its PR merge."}
  - {kind: decision, id: q6-test-plan, title: "Post-merge Test Plan: a live two-wave drive", body: "Operator chose a live two-wave drive inside herdr as the owed post-merge run."}
resolves: []
acceptance:
  - id: drive-wave-workspaces
    capability: triage-batch-drive
    acceptance: The driver opens each batch's session, and its close-out, in a herdr workspace
      of the batch's wave (<prefix>-wave-<n>, <prefix>-no-wave; prefix default drive), created
      once and reused, while a batch dispatched by hand opens where it always did
    origin:
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R1
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R2
