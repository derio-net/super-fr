    status: not-implemented
  - id: runner-close-optional
    capability: runner-protocol
    acceptance: A runner may offer to close an item's sessions; one that does not is never
      asked and behaves as before
    origin:
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R6
    status: not-implemented
  - id: drive-closes-finished-sessions
    capability: triage-batch-drive
    acceptance: Once a batch is finished the driver closes its batch and close-out sessions,
      never a working or blocked one and never a session that is not its own, closes an emptied
      wave workspace, and never holds or fails the drive over it; --keep-sessions turns it off
    origin:
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R7
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R8
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R9
      - super-fr:docs/superpowers/specs/2026-10-05-drive-herdr-sessions-design.md#R10
    status: not-implemented
  - id: drive-herdr-sessions-live
    capability: triage-batch-drive
    acceptance: A live two-wave drive inside herdr groups each wave's sessions in its own
      workspace and leaves no finished batch's tab or emptied wave workspace open
    origin:
