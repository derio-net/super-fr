journal:
- kind: discovery
  id: p1-read-callsite-audit
  phase: 1
  title: Audit of _resolve_manifest_for_state call sites (R4)
  body: 'Call sites of `_resolve_manifest_for_state`: `_unevidenced_units` (read-only report, used by
    status and check), `_advance_chain`, `_advance_step`, `_resolve_body`, `_next_unit`, `_advance_after_record`,
    `claim_cmd` (all mutating, kept strict), `_idle_reading` (kept strict: a drifted cursor is `not-advanceable`,
    which is the liveness answer), and `gates_cmd` (switched to `_resolve_manifest_for_read`). `status`
    and `cost` never resolved the manifest: `status` now calls the lenient resolver for its single warning
    (and prints a refusal such as a schema mismatch as a warning, still exit 0, since it is how an operator
    finds out); `check` calls it likewise, exit codes unchanged. `_unevidenced_units` now uses a schema-checked-only
    resolve (`_resolve_manifest_checked_schema`) so the evidence report survives a step-list drift instead
    of silently going empty. `cost` needs no change.

    '
- kind: decision
  id: p1-drift-error-subclass
  phase: 1
  title: StepDriftError subclass distinguishes drift from schema mismatch
  body: '`_StepDriftError(RunStateError)` is raised by `_check_step_drift`, so the read resolver downgrades
    exactly the drift refusal and still raises on a schema-version mismatch. Shared added/removed computation
    is `fr.run.reshape.diff_ids`, used by reshape, `_check_step_drift` (top-level and member diffs) and
    the reshape command.

    '
