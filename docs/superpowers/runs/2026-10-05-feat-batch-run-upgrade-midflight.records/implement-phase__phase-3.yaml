  - {kind: decision, id: p3-prior-seen-by-clause-2, phase: 3, title: "Supersede inference sees the old cursor's attempts through a merged read-only view, and review_key is now passed", body: "build_run_state takes `prior`; clause 2 reads a copy of the new state whose steps are overlaid with the old cursor's, with review_key=<phase>/<review member> so the old review unit's own attempts never count as implementation (p2-r5). Carried units are applied after inference by carry_forward, which keeps an old done unit's real evidence over an inferred historical one."}
  - {kind: decision, id: p3-supersede-preview-default, phase: 3, title: "adopt_run previews (dry_run) unless --yes, but only when there is an existing run to replace", body: "A plain adopt (no run, or no --supersede) keeps writing immediately as before. Superseded is an outparam (old id, closed holds, removed and moved paths); the CLI previews from it and notes only git-tracked removed paths for the one commit, since `git add` of an untracked missing path would refuse the whole commit."}
  - {kind: discovery, id: p3-usage-run-field, phase: 3, title: "A moved usage file keeps its inner `run:` as the old id", body: "The usage file is renamed byte for byte (spec: renamed). Its host labels are hashes of that inner run id and backfill reads them via usage.run, so rewriting the field would orphan every capture; capture.py already builds on the existing file's run. New captures under the new run id append a new host label."}
  - {kind: discovery, id: p3-find-run-sees-legacy, phase: 3, title: "find_run_for_plan recognises legacy-shaped cursors, so a v4 cursor reaches the supersede parse check", body: "The parse-refusal test uses a v4-shaped file (items, stamp 4): find_run_for_plan still matches it via the frozen readers, the current model rejects it, and the refusal names `fr migrate artifacts --yes`. A file no reader can parse is not found at all and falls through to a plain adopt (unchanged behaviour)."}
