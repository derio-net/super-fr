journal:
- kind: finding
  id: sr-1
  title: carry-forward's 'unit key present in both' drops every review-phase and step/* unit
  body: 'build_run_state writes only phase/N/<first member> keys and no step/<id> units (adopt.py:370-384,
    :393-403), so ''present in both'' never matched a reviewed member, spec-review''s evidence or deliver''s.
    Contradicts decision adopt-supersede-carry-forward. Fix: carry every old unit whose step and member
    still exist; state at/driver.'
  review_scope: in
- kind: finding
  id: sr-2
  title: --supersede says nothing about open attempts or units held by a live session
  body: 'Attempts copied verbatim carry an open hold (e.g. #891''s phase/6 review) into the new cursor;
    advance would refuse it or a dead session holds it forever. Pick: refuse while held, or close as abandoned.'
  review_scope: in
- kind: finding
  id: sr-3
  title: --supersede orphans the old run's usage file and records directory
  body: 'usage/<old>.yaml loses its cursor (archive.py:521-555 keys on run id), PR body ## Cost and fr
    run cost undercount; a live <old>.records/ step record is stranded.'
  review_scope: in
- kind: finding
  id: sr-4
  title: reshape rules 2 and 4 decide on state == pending, but a pending record can carry data
  body: An adopted pending group carries done units keyed on old members; a pending removed step can hold
    gate/answered_by, emitted (plan = archive key) or units. Check content, not lifecycle.
  review_scope: in
- kind: finding
  id: sr-5
  title: 'reshape alone does not finish #891 case 3 when the review ran in an earlier session'
  body: A review dispatched in an earlier session after start fails both the dispatch check and the before-started
    bound after reshape; only --supersede works. Widen R7 or state it plainly.
  review_scope: in
- kind: finding
  id: sr-6
  title: reviewer=historical's before-state.started bound can be gamed
  body: Write entry then --supersede passes; an entry from an abandoned earlier attempt passes for a phase
    this cursor implements later. Bound against the implement member's last return; state the residual
    trust model.
  review_scope: in
- kind: finding
  id: sr-7
  title: historical review leaves visual and the reviewer-return check undefined
  body: review-phase also owes visual (fr-goal.yaml:181), whose witness needs observed screenshots; reviewer-return
    check would note unobserved. Specify both.
  review_scope: in
- kind: finding
  id: sr-8
  title: '## Historical reviews ''required on the live PR'' has no mechanism; missing_sections is static'
  body: pr_body.missing_sections takes no state (pr_body.py:44-61); caller run_cmd.py:5201. Name the change.
  review_scope: in
- kind: finding
  id: sr-9
  title: R8 inference fold omits unauthorized fixes and cannot call the gate
  body: _closed_findings_witness also refuses unauthorized fixes and exits rather than returns; name phase_finding_states
    + unauthorized_fixes.
  review_scope: in
- kind: finding
  id: sr-10
  title: "smaller inaccuracies in \xA7A/\xA7C"
  body: adopt_run at :552 not :595; step-state rule is a no-op; rule 5 vs rule 4; write path is _save_run_state
    inside _commits_run_writes; same-day overwrite vs adopt.py:634; --supersede with no run unspecified.
  review_scope: in
- kind: finding
  id: sr-11
  title: Test Plan does not cover several designed behaviours
  body: 'Missing: member-change rule, data-holding pending removal, unparseable old cursor, same-day overwrite
    + commit subject, unbuilt-unit carry-forward, open attempts, R3 message, live PR lacking ## Historical
    reviews.'
  review_scope: in
- kind: finding
  id: sr-12
  title: fr pickup resolves the manifest strictly and fails on a drifted cursor
  body: pickup_cmd.py:247 has no lenient path; pre-existing, outside the fr run read-only set; reshape
    removes the drift.
  review_scope: out
- kind: review
  id: spec-review-1
  title: 'independent spec review: 12 findings (sr-1..sr-11 in scope, sr-12 out)'
  body: 'Dispatched fr-spec-reviewer raised sr-1..sr-11 (in scope) and sr-12 (out of scope). Confirmed:
    #891''s reshape case (journal-check after implement) passes; no artifact shape change owed (reviewer:
    historical is a value in UnitRecord.evidence).'
