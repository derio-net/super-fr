    status: not-implemented
  - id: triage-origins-schema-2
    capability: triage-views
    acceptance: origins.yaml schema 2 records duplicate_of, fixed_by and introduced_in; origins check reports a duplicate whose target is outside the window, and the page links a duplicate to its original.
