    acceptance: The board's first screen is Since last report as a transitions table, Needs you now, Next up and the unfinished waves with a per-batch Tier column; backlog, features, parked, patterns, PRs and batches follow as collapsed sections.
    origin: [super-fr:docs/superpowers/specs/2026-10-05-triage-pages-goal-design.md#R2, super-fr:docs/superpowers/specs/2026-10-05-triage-pages-goal-design.md#R3, super-fr:docs/superpowers/specs/2026-10-05-triage-pages-goal-design.md#R4]
