    capability: triage-views
    acceptance: On the board every batch card starts collapsed, a multi-select stage filter hides cards by stage, and a link to a batch opens its card and the sections around it.
    origin: [super-fr:docs/superpowers/specs/2026-10-05-triage-pages-goal-design.md#R5]
