  title: preselected_wave keeps facts as its first argument
  body: The plan wrote preselected_wave(judgements, among=...) but the real signature is (facts, judgements); stage
    derivation needs facts. Added among as a keyword only. Wave keys are strings.
  phase: 1
- kind: discovery
  id: p1-board-https-href-test
  title: page chrome adds relative hrefs to the board
  body: test_a_non_https_url_produces_no_href asserted every anchor on the board is https; the nav bar links triage.html/origins.html/architecture.html/history.html.
    The test now allows exactly the PAGES file names (constants, never untrusted).
  phase: 1
- kind: discovery
  id: p1-architecture-drops-kind-counts
  title: architecture summary loses open/defect counts
  body: 'Spec background lists kind counts as a fact on the board and the architecture summary. R6''s summary is
    lines then/now plus Where it hurts, so the open-issues and defects figures (and issues filed, batches merged)
    left the architecture page: one home per fact. History also got a small MOVED map {waves: board} so an old manifest
    naming it is noted, not reported missing; architecture render_architecture lost its snapshots parameter since
    the timeline moved.'
  phase: 1
- kind: discovery
  id: p1-files-outside-list
  title: touched beyond the obvious files
  body: components.py gained BASE_CSS (shared prelude for architecture and history); origins.py lost the origin_counts/filings_chart
    re-exports (dead); triage_cmd.py registers the history command; tests/unit/test_triage_render.py and test_triage_board_views.py
    hold the board and finished-wave tests.
  phase: 1
- kind: finding
  id: p1-visual-matcher-uv-with
  title: capture-script witness misreads uv run --with
  review_scope: out
  body: "fr's capture-script witness misreads `uv run --with <pkg> python <script>` (value-taking flag read as the program), so a correctly run capture is reported unwitnessed"
  phase: 1
