journal:
- kind: discovery
  id: p2-files-outside-list
  title: touched beyond the obvious files
  body: 'components.py gained GRID_CSS (shared by board and history so the wave tables scroll sideways at 390px
    instead of wrapping by the letter: min-width 720px inside .tablewrap, nowrap headers); history.py uses it; triage_cmd.py
    reads <state>/board/manifest.yaml (BOARD_DIR); the acceptance matrix and its reports moved (two rows to ci,
    board-decision-views re-pointed at the renamed ordering test).'
  phase: 2
- kind: discovery
  id: p2-section-shapes
  title: fold bodies keep the old wrapper tags, ids are new
  body: 'PRs, Batches and Patterns keep a <section class=prs|batches|patterns> inside their fold so the existing
    tests still address them. Fold ids: backlog-by-tier, backlog-tier-<n|unranked>, ranked-features, parked, patterns,
    prs, batches. Empty features, parked, patterns and batches render no fold (as before); Backlog and PRs always
    render. The board ordering test replaced lives in test_triage_board_views.py, not test_triage_render.py as the
    plan says.'
  phase: 2
- kind: discovery
  id: p2-link-opens-filtered-card
  title: a link to a filtered-off card re-checks its stage
  body: FOLD_SCRIPT turns the target card's stage checkbox back on before opening the card and its ancestors, so
    a link never lands on a hidden card. A same-hash re-click is handled by a click listener, since hashchange does
    not fire.
  phase: 2
- kind: discovery
  id: p2-unreachable-no-judgement-tier-dash
  title: the Tier dash cannot arise from a valid board
  body: Judgements validation requires every batch member to be judged, so the em-dash tier is reachable only through
    wave_table on a hand-built Batch; the test builds it that way.
  phase: 2
- kind: finding
  id: p2-suite-log-background-unwitnessed
  review_scope: out
  title: fr cannot witness a suite log written by a run_in_background command, which the brief's own long_commands
    rule prescribes
  body: implement-phase refuses evidence.tests when the full suite ran via a background Bash call (the call returns
    at once, so the log's writes fall outside the command's window). The dispatch brief's long_commands rule tells
    executors to do exactly that for the suite. Not caused by this change; the deliver step re-runs the suite on
    the final tree.
