journal:
- kind: finding
  id: p4-sec-symlink-follow
  review_scope: in
  phase: 4
  title: state_sync followed symlinks on export and import
  body: 'Security review of a82a6a0c6: base.rglob plus shutil.copy2 followed symlinks, so a symlink planted in the
    state dir (authored-src/x -> ~/.ssh/id_rsa, or a symlinked page dir) copied its target into the repo, which the
    R13 driver then commits and pushes; import from a cloned repo could copy an arbitrary local file into the cache;
    and a symlinked destination was written through.'
- kind: finding
  id: p4-sec-root-symlink-traversal
  review_scope: in
  phase: 4
  title: state sync trusted the repo-side root and the parts joined to build it
  body: 'Follow-up review of ed706bdfc: the symlink checks covered entries under a root but not the root, so a
    cloned repo committing docs/triage or docs/triage/<scope> as a symlink made import read wherever it points
    and the driver export write outside its worktree; and <dir>/<scope> and <worktree>/<path>/<scope> trusted
    scope and every component of path (a symlinked component escapes without `..` or a leading `/`).'
- kind: discovery
  id: p4-files-outside-list
  phase: 4
  title: touched beyond the phase's files list
  body: 'RealGhClient.pr_create lives in packages/fr/src/fr/real_ghclient.py (the gh adapter is not in
    ghclient.py, which holds only the Protocol and UnsupportedBatchOps); its tests and the glab/tea refusal
    parametrisation are in tests/unit/test_forge_adapter_batch_ops.py, the existing home of the batch-op adapter
    tests. Six existing triage tests that pinned "the writer writes schema 3" or "schema 4 is refused" now pin 4
    and 5.'
- kind: discovery
  id: p4-export-decisions
  phase: 4
  title: export choices the spec left open
  body: 'Action.batch carries the repo for export actions; action_line prints `<kind> wave <N> <repo>` for any
    action with a wave (export warns included). Export warns name no head, so they repeat every pass, as the
    spec wants. A recorded export whose live PR reads MERGED (merged by hand) needs nothing and is not counted; a
    recorded PR not read this pass counts as closing. The group/org scope warn is not counted blocked (it would
    stop every group drive). A contained() refusal in _export prints as a warn, counts blocked instead of
    closing, and is not `acted`, so --once exits 3 and the loop stops waiting on the operator. A leftover export
    worktree from a dead pass is force-removed before the next export (it is driver-owned scratch; add_worktree
    would otherwise refuse it forever). The P4.T4.S3 command tests were written right after the implementation
    draft rather than strictly before; one of them failed red (the refusal counted as acted) and drove a fix.'
- kind: finding
  id: p4-export-backlog-of-finished-waves
  review_scope: out
  phase: 4
  title: opting in on a repo with many already-finished waves opens one export PR per wave at once
  body: 'Per the spec, step 3b acts on every finished wave with no merged export. A repo that sets export: after
    several waves finished (this repo, in phase 5) gets one export PR per old wave in the first pass, all
    carrying near-identical state. Exporting only the highest unexported finished wave, or recording older ones
    as superseded, would avoid that; it is a spec decision, not made here.'
resolves:
- id: p4-sec-symlink-follow
  state: fixed
  body: 'state_sync walks with os.scandir and never follows a symlink at any depth (durable files and dirs
    themselves included); a symlinked target or parent under the destination root is never written through;
    copy2 uses follow_symlinks=False. Each is skipped and reported in SyncReport.skipped with its reason
    (Skipped(path, reason)); tests in tests/unit/test_triage_state_sync.py cover all four cases.'
- id: p4-sec-root-symlink-traversal
  state: fixed
  body: 'state_sync.contained(base, rel) refuses an absolute rel, an empty/./.. part, any existing symlinked
    component under base (the last included) and a resolve() outside base.resolve(); the base itself is trusted
    (macOS /var). check_scope_name refuses a scope that is not one plain part. export_state/import_state take
    (base, rel) and build the root through contained; the CLI passes (--to|--from, scope); the driver passes
    (worktree, <path>/<scope>), and a refusal there is a warn for that wave with nothing committed or pushed,
    counted blocked. _symlinked_dest still re-checks each target. Tests: test_triage_state_sync.py (contained,
    scope name, symlinked scope dir on import, symlinked root on export, base under a symlinked /var-style
    parent) and test_triage_batch_drive_cmd.py::test_a_symlinked_export_path_in_the_repo_is_refused_as_a_warn_with_nothing_written.'
