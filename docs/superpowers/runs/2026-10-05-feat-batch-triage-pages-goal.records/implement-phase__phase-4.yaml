journal:
- kind: finding
  id: p4-sec-symlink-follow
  review_scope: in
  phase: 4
  title: state_sync followed symlinks on export and import
  body: 'Security review of a82a6a0c6: base.rglob plus shutil.copy2 followed symlinks, so a symlink planted in the
    state dir (authored-src/x -> ~/.ssh/id_rsa, or a symlinked page dir) copied its target into the repo, which the
    R13 driver then commits and pushes; import from a cloned repo could copy an arbitrary local file into the cache;
    and a symlinked destination was written through.'
- kind: finding
  id: p4-sec-root-symlink-traversal
  review_scope: in
  phase: 4
  title: state sync trusted the repo-side root and the parts joined to build it
  body: 'Follow-up review of ed706bdfc: the symlink checks covered entries under a root but not the root, so a
    cloned repo committing docs/triage or docs/triage/<scope> as a symlink made import read wherever it points
    and the driver export write outside its worktree; and <dir>/<scope> and <worktree>/<path>/<scope> trusted
    scope and every component of path (a symlinked component escapes without `..` or a leading `/`).'
resolves:
- id: p4-sec-symlink-follow
  state: fixed
  body: 'state_sync walks with os.scandir and never follows a symlink at any depth (durable files and dirs
    themselves included); a symlinked target or parent under the destination root is never written through;
    copy2 uses follow_symlinks=False. Each is skipped and reported in SyncReport.skipped with its reason
    (Skipped(path, reason)); tests in tests/unit/test_triage_state_sync.py cover all four cases.'
- id: p4-sec-root-symlink-traversal
  state: fixed
  body: 'state_sync.contained(base, rel) refuses an absolute rel, an empty/./.. part, any existing symlinked
    component under base (the last included) and a resolve() outside base.resolve(); the base itself is trusted
    (macOS /var). check_scope_name refuses a scope that is not one plain part. export_state/import_state take
    (base, rel) and build the root through contained; the CLI passes (--to|--from, scope); the driver passes
    (worktree, <path>/<scope>), and a refusal there is a warn for that wave with nothing committed or pushed,
    counted blocked. _symlinked_dest still re-checks each target. Tests: test_triage_state_sync.py (contained,
    scope name, symlinked scope dir on import, symlinked root on export, base under a symlinked /var-style
    parent) and test_triage_batch_drive_cmd.py::test_a_symlinked_export_path_in_the_repo_is_refused_as_a_warn_with_nothing_written.'
