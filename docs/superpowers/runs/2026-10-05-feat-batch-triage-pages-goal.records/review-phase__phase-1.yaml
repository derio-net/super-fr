resolves:
- id: p1-r1
  state: fixed
  body: wave_table made public; history.py imports it by that name (b30c470fe).
- id: p1-r2
  state: fixed
  body: splice numbers slug-alike collapsed fragment ids; test test_collapsed_fragments_whose_names_slug_alike_get_distinct_ids
    (b30c470fe).
- id: p1-r3
  state: refuted
  body: The validator moved verbatim from architecture.py on main (same _URL_ATTRS denylist, same end-tag rule);
    spec R9 deliberately keeps today's validate_fragment refusals, and the forbidden <form>/<iframe> close the attributes
    cited. Changing the refusal set is a spec change, not a defect of this move. The reviewer withdrew it.
- id: p1-r4
  state: out-of-scope
  body: Follows the spec'd R8 predicate (cancelled is terminal). Not caused by an implementation error; documenting
    it falls to the skills text in phase 5.
- id: p1-r5
  state: fixed
  body: Capture script now covers the board's every-wave-finished state, nav from every page to every other, and
    keyboard tab switching; all assertions pass and the reviewer opened every fresh shot.
- id: p1-r6
  state: out-of-scope
  body: The wave table markup predates this change; phase 2 (R2-R5) owns the board layout and is briefed to keep
    its wave table usable at phone width.
- id: p1-visual-matcher-uv-with
  state: out-of-scope
  body: A defect in fr's capture-script witness (fr/run/telemetry.py _executes), not caused by this change; worked
    around with a shebang so the script is its own command word.
