    a duplicate (ecf259861); test test_a_duplicate_of_a_duplicate_is_duplicate_chained.'
- id: p3-r3
  state: refuted
  body: The operator chose 'severity on every open issue' in the question round (q4), and R11 states the set as
    open, judged issues without a severity. A parked or duplicate issue can be unparked or turn out distinct; its
    severity is still owed and still shown in fr triage check and the JSON. Excluding them would contradict the
    recorded decision.
- id: p3-r4
  state: refuted
  body: 'Deliberately consistent with the existing pr: field, which is free text rendered through the same _pr_link
    (link when it parses, escaped text otherwise). Validating two of three PR-ref fields would make the schema inconsistent;
    nothing renders unsafely.'
