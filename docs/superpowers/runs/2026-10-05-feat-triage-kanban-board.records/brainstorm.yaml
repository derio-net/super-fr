  - id: triage-board-refresh
    capability: triage-batch-board
    acceptance: The board stays fresh without the operator re-rendering it — the drive re-renders it after each pass (a render failure only warns), `fr triage board --watch` re-collects and re-renders when no drive runs (refusing while one does), and the page reloads on a configurable timer keeping expanded cards and scroll position.
    origin:
