  - id: triage-board-session-status
    capability: triage-batch-board
    acceptance: Each dispatched batch and started close-out shows its live session status from the runner (working, blocked, idle, done, unknown, no session); a missing, failing or incapable runner shows unknown with a page note and never fails the render; a blocked session flags its card as needing the operator.
    origin:
