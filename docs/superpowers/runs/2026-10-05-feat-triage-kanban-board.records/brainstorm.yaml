schema_version: 7
run: 2026-10-05-feat-triage-kanban-board
step: brainstorm
outcome: done
questions: {rounds: 1}
journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Operator brief (verbatim)
    body: |
      I would like an extension for the Triage pages, the Wave Driver and the herdr dispatcher.. A new artifact that shows the state of all prepared/dispatched issues as a Kanban board, is refreshed via the state changes (or timer) and can be used to quickly jump to a corresponding herdr session (e.g. clicking on a button copies the herdr command that can be used to jump to the correct session). Each item should be expanded to show more information about it
  - kind: decision
    id: d1-card-unit
    title: One card per batch
    body: A batch is one session, one branch, one PR; member issues appear inside the expanded card. (Q1, recommended option chosen.)
  - kind: decision
    id: d2-columns
    title: Lifecycle columns
    body: Proposed, Waiting, Running, PR open, Closing out, Done; cancelled/abandoned/partial sit in Done with a pill. (Q2, recommended.)
  - kind: decision
    id: d3-artifact
    title: Separate board.html via `fr triage board`
    body: Written beside triage.html in the triage state dir; triage.html links to it. (Q3, recommended.)
  - kind: decision
    id: d4-refresh
    title: Drive re-renders each pass, page reloads on a timer
    body: Drive writes board.html after every acting pass; the page reloads itself (default 30s) keeping expanded cards and scroll; `fr triage board --watch` re-collects and re-renders when no drive runs. (Q4, recommended.)
  - kind: decision
    id: d5-jump-command
    title: Jump copies a new fr verb
    body: The button copies `fr triage batch focus <batch-id>`, which resolves the session by label through the runner at run time and focuses it. (Q5, recommended.)
  - kind: decision
    id: d6-live-status
    title: Live session status read at render
    body: Render asks each batch's runner for session status through an optional capability; failures show `unknown`, never fail. Blocked sessions are highlighted. (Q6, recommended.)
  - kind: decision
    id: d7-expanded-content
    title: Expanded card content
    body: Members + PR + CI, lifecycle details, event timeline with close-out jump, and a next-action hint. (Q7, all four options chosen.)
resolves: []
acceptance:
  - id: triage-board-columns
    capability: triage-batch-board
    acceptance: '`fr triage board` writes board.html showing one card per batch in six lifecycle columns (Proposed, Waiting, Running, PR open, Closing out, Done) with counts, a blocked mark for unsatisfiable dependencies and a pill for cancelled/abandoned/partial, linked from triage.html, readable in light and dark and at phone width.'
    origin:
