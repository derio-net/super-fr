  - id: triage-board-jump-focus
    capability: triage-batch-board
    acceptance: A card's jump button copies `fr triage batch focus <id>` (with --closeout for the close-out session) and confirms; that command focuses the batch's live herdr session, and refuses with exit 2 and a reason when there is no event, no capable runner or no live session.
    origin:
      - super-fr:docs/superpowers/specs/2026-10-05-triage-batch-board-design.md#R5
      - super-fr:docs/superpowers/specs/2026-10-05-triage-batch-board-design.md#R8
