    origin: [super-fr:docs/superpowers/specs/2026-10-06-driver-sessions-design.md#R1, super-fr:docs/superpowers/specs/2026-10-06-driver-sessions-design.md#R2, super-fr:docs/superpowers/specs/2026-10-06-driver-sessions-design.md#R4, super-fr:docs/superpowers/specs/2026-10-06-driver-sessions-design.md#R5]
