journal:
- kind: discovery
  input: true
  id: operator-brief
  title: 'Operator brief: batch model-bindings / super-fr#591'
  body: "Batch `model-bindings` of derio-net/super-fr (one PR, branch feat/batch-model-bindings): super-fr#591\
    \ — Model bindings rot as providers churn: probe live, fall back by family then tier, ask when interactive,\
    \ decide and record when not (high priority). Operator note: Design first: live probe, then family,\
    \ then tier fallback; ask when interactive, decide and record when not.\n\nIssue text:\n\n# Model\
    \ bindings rot as providers churn: probe live, fall back by family then tier, ask when interactive,\
    \ decide and record when not (high priority)\n\n> **Priority: high.** Model availability now churns\
    \ faster than anyone re-runs\n> `fr models set`. On 2026-09-23 an entire provider generation vanished\
    \ within\n> about a day of its successor shipping, and a machine was left with a tier agent\n> bound\
    \ to a dead model and no signal from anything.\n\n## What happened\n\nCopilot released `gpt-6-*` and\
    \ `claude-opus-5.5` on 2026-09-22. By the next day\n**every** `gpt-5.6-*` model had been retired.\
    \ A live probe of each:\n\n| model | live probe |\n|---|---|\n| `github-copilot/gpt-5.6-terra` | `Error:\
    \ The requested model is not supported.` |\n| `github-copilot/gpt-5.6-luna` | `Error: The requested\
    \ model is not supported.` |\n| `github-copilot/gpt-5.6-sol` | `Error: The requested model is not\
    \ supported.` |\n| `github-copilot/gpt-6-sol` / `gpt-6-luna` / `claude-opus-5.5` / `claude-haiku-4.5`\
    \ | `OK` |\n\nMeanwhile:\n\n- **The operator's installed `fr-phase-executor-standard` was bound to\n\
    \  `gpt-5.6-luna`.** Any OpenCode `/fr-goal` that dispatched a `standard` phase\n  would have failed\
    \ at dispatch. Nothing warned: `fr models set` accepted the\n  string, the materialiser wrote it,\
    \ `fr harness parity` was green.\n- **The catalogue does not know either.** `opencode models --refresh`\
    \ still\n  lists all three, and `--verbose` marks each **`\"status\": \"active\"`** — the\n  same\
    \ as the live models. The catalogue's `status` is not an availability\n  signal.\n- The Claude side\
    \ needed a manual bump too (`claude-opus-5-5`), because\n  bindings are concrete model ids.\n\n##\
    \ The requirement (operator's words)\n\n> the models are churning very quickly, there must be fallback\
    \ processes and\n> dynamic in-place updates. Asking the user if possible, autonomously deciding\n\
    > (based on the 3-tiered concept) when not\n\n## What the data already supports\n\nThe catalogue is\
    \ untrustworthy about *availability* but reliable about\n**lineage**. From `opencode models --verbose`:\n\
    \n| retired | `family` | released | same-family successor |\n|---|---|---|---|\n| `gpt-5.6-luna` |\
    \ `gpt-luna` | 2026-07-09 | `gpt-6-luna` (2026-09-22) |\n| `gpt-5.6-sol` | `gpt-sol` | 2026-07-09\
    \ | `gpt-6-sol` (2026-09-22) |\n| `gpt-5.6-terra` | `gpt-terra` | 2026-07-09 | **none** — gpt-6 has\
    \ no terra |\n| *(still live)* `claude-opus-5` | `claude-opus` | 2026-07-24 | `claude-opus-5.5` (2026-09-22)\
    \ |\n\nSo there are two different cases, and they deserve different rules.\n\n## Proposed behaviour\n\
    \n### Detection — live, and as early as possible\n\n- **Probe at bind time.** `fr models set` issues\
    \ a minimal call and **refuses**\n  a model the provider will not serve, naming the error. Fail at\
    \ authoring, not\n  at dispatch.\n- **Probe at run start.** `fr run start` (and `advance` before dispatching)\n\
    \  probes the orchestrator binding and every tier the plan uses, once per run,\n  cached. Cost is\
    \ a few tokens per model.\n- **Recognise retirement at dispatch** as a distinct error class, so a\
    \ dispatch\n  failure caused by a dead model triggers fallback rather than failing the\n  phase.\n\
    - **Never trust catalogue `status`** — pinned by a test using the evidence above.\n\n### Choosing\
    \ a replacement — the 3-tier concept\n\n1. **Same-family successor** (`family` equal, newer `release_date`,\
    \ live) — the\n   provider's own lineage. Covers luna, sol and opus above. Safe to take\n   autonomously.\n\
    2. **No family successor** (terra's case) — choose by **tier**, keeping the\n   tier's relative position\
    \ among the other bindings: `mechanical` ≤ `standard`\n   ≤ `hard` by cost, tool-calling capable,\
    \ live, and distinct from the\n   `orchestrator` binding (the constraint #560 established — a tier\
    \ bound to the\n   session model cannot be told from an untiered dispatch).\n3. **Nothing satisfies\
    \ the tier** — refuse, loudly. Never silently collapse two\n   tiers onto one model.\n\n### Asking\
    \ vs deciding\n\n- **Interactive** (TTY, or an operator gate available) → **ask**, proposing the\n\
    \  choice above as the recommended option, with the alternatives. In fr-goal this\n  belongs in the\
    \ batched question gate — the model-per-tier question\n  (SKILL.md:47) already lives there. But note\
    \ #538: that question relies on the\n  model remembering a check, and on OpenCode it did not fire.\
    \ The trigger has to\n  be a **CLI refusal or warning**, not prose.\n- **Non-interactive** (pods,\
    \ CI, the bridge, an unattended run) → **decide\n  autonomously** by the rules above, and never escalate\
    \ cost beyond a bound —\n  e.g. no more than N× the retired model's price without a human.\n- **Either\
    \ way, record it.** Every substitution is written with old model, new\n  model, reason (`retired`),\
    \ decider (`operator` | `autonomous`) and rule used.\n  An autonomous substitution must be as loud\
    \ as a refusal. Silent success is the\n  defect class this repo keeps producing.\n\nThis deliberately\
    \ differs from the artifact-migration gate, which **refuses** in\nnon-interactive contexts rather\
    \ than mutating. The difference is justified: a\nstale artifact can wait for a human, whereas a dead\
    \ model makes an unattended run\nfail outright. It should be stated as a decision, not left implicit.\n\
    \n### In-place update\n\nRewrite `models.yaml` and re-materialise the installed OpenCode agents through\n\
    the #504 materialiser — which is also where #505's misleading \"no agent files\nfound\" message lives,\
    \ so fix it here or first. On OpenCode the tier lives in the\nagent's **name** and its model is fixed\
    \ in the agent file (SKILL.md:92), so a\nfallback must rewrite the file **before** dispatch. On Claude\
    \ Code the model is\npassed per call, so fallback can be per-dispatch.\n\n### Upgrades are different:\
    \ ask only, never autonomous\n\nA new model in a still-live family (`claude-opus-5` → `claude-opus-5.5`)\
    \ is an\n**offer**, not a fallback. The bound model still works, so nothing justifies\nchanging behaviour\
    \ or cost without consent. Surface it — `fr models` status, or\nthe run-start banner — and let the\
    \ operator accept.\n\n## Acceptance — live, per the #486 precedent\n\n- [ ] `fr models set` refuses\
    \ a retired model, showing the provider's error.\n- [ ] With a tier bound to a retired model, an interactive\
    \ `fr run start` asks\n      and proposes the same-family successor; the answer is materialised and\n\
    \      the dispatched agent runs on it (verified in `opencode.db`).\n- [ ] Non-interactive, the same\
    \ situation substitutes autonomously, records old\n      → new, reason and decider, and says so loudly.\n\
    - [ ] A tier with no family successor gets a tier-ranked replacement that is\n      distinct from\
    \ the orchestrator and keeps tier ordering — or a loud refusal.\n- [ ] A new model in a live family\
    \ is offered, never applied unasked.\n- [ ] A test pins that catalogue `status: active` is not treated\
    \ as live.\n\n## Related\n\n#538 (tier question never fires on OpenCode — same trigger problem), #505\n\
    (materialiser message), #536 C3 (served model recorded, and the `orchestrator`\nbinding that warns\
    \ on mismatch — the natural anchor for the distinctness rule).\n\nSuggested handoff: `/fr-goal` on\
    \ this issue.\n\n"
- kind: decision
  id: probe-scope-opencode-only
  title: Live probing covers OpenCode only
  body: 'Operator answer (Q1): OpenCode only. Claude Code and Hermes bindings are reported `unprobed`;
    nothing substitutes them (spec R10).'
- kind: decision
  id: ask-at-gates-else-decide
  title: Ask at TTY/operator gate, decide autonomously elsewhere
  body: 'Operator answer (Q2): ask on a terminal (`fr models set/check`) and in fr-goal''s brainstorm
    question round; decide + record at `fr run advance` before a dispatch, so a run never stalls mid-wave
    (spec R5-R8).'
- kind: decision
  id: autonomous-cost-bound-2x
  title: Autonomous picks cost at most 2x the dead model
  body: 'Operator answer (Q3): catalogue input+output price of an autonomous replacement <= 2x the dead
    model''s; else no autonomous pick (spec R4).'
- kind: decision
  id: record-in-run-journal-only
  title: Substitutions are recorded in the run journal only
  body: 'Operator answer (Q4): run journal only. Outside a run, the loud stderr line is the only record
    (spec R11).'
- kind: decision
  id: offers-asked-in-round
  title: Upgrade offers are also asked in fr-goal's round
  body: 'Operator answer (Q5): the gated brief carries `binding_offers`; fr-goal asks one question per
    offer (recommended: keep), never applied unasked (spec R6, R7, R12).'
- kind: decision
  id: verification-candidate-plus-live
  title: Verified by candidate scenarios plus one live row
  body: 'Operator answer (Q6): `candidate` walk with stub-opencode scenarios; one post-merge `live` row
    for a real OpenCode retirement verified in opencode.db (spec ## Verification, Test Plan).'
- kind: decision
  id: repo-layer-never-rewritten
  title: A dead repo-layer binding is refused, never rewritten
  body: 'Author decision, stated in the spec (R9): docs/superpowers/models.yaml is a tracked contract;
    advance refuses (exit 2) rather than edit it.'
- kind: decision
  id: triage-launch-out-of-scope
  title: Triage batch launch is out of scope
  body: 'Author decision (spec non-goals): herdr only supports Claude Code, which is unprobed per Q1.'
