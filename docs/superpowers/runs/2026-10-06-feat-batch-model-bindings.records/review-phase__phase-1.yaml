journal:
  - kind: review
    id: p1-review-r1
    phase: 1
    title: "phase 1 independent review: 9 findings (p1-r1..p1-r9), all in scope, all fixed in 25c7c4bb6"
    body: |
      Reviewed spec R1–R5, R10, R12, R3 and §A/§B/## Verification against git diff 37724adaf..HEAD. Targeted unit tests (78) and the 3 model_binding scenarios passed. Conformance confirmed: R1 terminal/off-terminal, R2 never reads catalogue status, R4 rule order + 5-probe cap + is_autonomous, R5 report/exit 1, R10 unprobed, R11 line fields, the argument-injection guard (single --model=<id> token, validated before spawn, per-harness set refusal). Raised p1-r1..p1-r9; each verified against the code by the orchestrator, then fixed test-first in 25c7c4bb6; full suite after the fix: 9754 passed, 105 skipped.
  - {kind: finding, id: p1-r1, phase: 1, review_scope: in, title: "ProbeCache crashes on corrupt entry types or unwritable HOME; write not atomic", body: "probe.py ProbeCache: ProbeResult(**raw) unvalidated (`at` a string raises TypeError in check/run start); unguarded mkdir/write_text raises OSError; non-atomic write. Fix: validate and treat bad entries as a miss, temp+os.replace, swallow OSError."}
  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "SnapshotStore does not type-validate entries; its write can raise OSError", body: "catalogue.py SnapshotStore.get/remember: CatalogueEntry(**raw) unchecked, later TypeError in choose.py comparisons; OSError on a bad HOME crashes check_bindings. Fix: validate fields, guard writes."}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "valid_model_id refuses real nested/@ opencode ids", body: "fr/bindings/__init__.py _MODEL excluded '/' and '@', refusing openrouter/anthropic/claude-3.5 and vertex/claude@20240620 — a regression for fr models set. Fix: provider = first segment, tail allows nested and versioned forms."}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "fr models check can propose the same model for two dead tiers", body: "models_cmd.check_cmd/health.check_bindings computed all proposals from the original map; distinctness/ordering broken when two tiers die. Fix: choose sequentially, folding each pick in."}
  - {kind: finding, id: p1-r5, phase: 1, review_scope: in, title: "set's dead path duplicates choose/catalogue logic and skips the R3 snapshot", body: "models_cmd.set_cmd hand-built choose_replacement and read the catalogue without SnapshotStore.remember. Fix: one shared proposer in health.py."}
  - {kind: finding, id: p1-r6, phase: 1, review_scope: in, title: "hint rule may propose another provider's model", body: "choose.py:162 used a provider-qualified hint verbatim; R4 requires the same provider. Fix: require matching provider."}
  - {kind: finding, id: p1-r7, phase: 1, review_scope: in, title: "prober catches only FileNotFoundError/TimeoutExpired", body: "probe.py probe/catalogue: PermissionError/OSError or UnicodeDecodeError would crash; R2/Risks say never a crash. Fix: catch them."}
  - {kind: finding, id: p1-r8, phase: 1, review_scope: in, title: "validators in fr/bindings/__init__ with function-local circular imports", body: "probe.py imported fr.bindings inside methods. Fix: leaf module fr/bindings/ids.py, re-exported."}
  - {kind: finding, id: p1-r9, phase: 1, review_scope: in, title: "missing tests for corrupt cache/snapshot, failed cache write, nested/@ ids", body: "The robustness cases p1-r1..r3 break on had no tests. Fix: add them alongside the fixes."}
