  - {id: p1-r2, state: fixed, body: "25c7c4bb6: SnapshotStore.get validates every field, remember uses write_json_atomic. Tests test_bindings_catalogue::test_corrupt_snapshot_fields_count_as_absent, ::test_a_failing_snapshot_write_never_crashes."}
