journal:
  - kind: review
    id: p2-review-r1
    phase: 2
    title: "phase 2 independent review: 7 findings (p2-r1..r6 in scope, fixed in 8244ae448; p2-r7 out of scope)"
    body: |
      Reviewed spec R6–R9, R11, §C, §D against git diff 25c7c4bb6..HEAD. Ran test_run_binding_guard + test_run_cli (287 passed), the four mirror/neutrality/parity tripwires (26 passed), sync-opencode/sync-hermes --check, fr harness parity --check, fr acceptance check, ruff/mypy — all green. Confirmed R8 placement on both dispatch paths with the exact `_open_dispatch` tier, byte-identical cursor on refusal, redispatch/retry coverage, autonomy only via is_autonomous, R9 repo-layer refusal, R11 write order and same-commit journal entry, R6 brief keys, R7 skill text, generated mirrors, parity row partial. Raised p2-r1..p2-r7; the orchestrator verified each against the code; p2-r1..r6 fixed test-first in 8244ae448 (full suite after: 9775 passed, 105 skipped); p2-r7 predates this change.
  - {kind: finding, id: p2-r1, phase: 2, review_scope: in, title: "guard runs full check_bindings on every tiered OpenCode dispatch", body: "_guard_dispatch_binding → _binding_health → check_bindings: an uncached `opencode models` spawn plus live offer probes per dispatch, discarded. Fix: read the cached verdict first; catalogue and choose only on dead; no offers."}
  - {kind: finding, id: p2-r2, phase: 2, review_scope: in, title: "partial materialise reported as SUBSTITUTED", body: "materialize_agents reports change.problem without raising; the guard warned and printed SUBSTITUTED while the dispatched tier's agent file could still name the dead model. Fix: treat a problem on the dispatched tier's file as a failed apply (restore, exit 2)."}
  - {kind: finding, id: p2-r3, phase: 2, review_scope: in, title: "substitution journal id is count-based and can collide", body: "run_cmd.py:3731 n = 1 + count of numeric suffixes; non-contiguous suffixes give a duplicate id that fr validate artifacts fails. Fix: max suffix + 1."}
  - {kind: finding, id: p2-r4, phase: 2, review_scope: in, title: "guard tests miss restore, flat refusal, redispatch, repeated id", body: "Only set_binding raising was pinned. Fix: tests for materialise raising, flat-path refusal byte-identity, guard on --redispatch, repeated substitution id."}
  - {kind: finding, id: p2-r5, phase: 2, review_scope: in, title: "no-op _remember(journal) and duplicated set+materialise path", body: "run_cmd.py:3720 _remember is a no-op on advance (guard=None); the guard re-implemented models_cmd._apply_binding, which spec §B calls the one write path. Fix: drop the call; one shared apply_binding."}
  - {kind: finding, id: p2-r6, phase: 2, review_scope: in, title: "member briefs lack dead_bindings/binding_offers", body: "_build_member_brief (run_cmd.py:4026) claims the same keys as the step brief; R6 says every agent-step brief carries them. Fix: add both as null."}
  - {kind: finding, id: p2-r7, phase: 2, review_scope: out, title: "corrupt models.yaml crashes fr run start after save", body: "load_models raises ModelsError/YAMLError; _orchestrator_model_notice → _resolved_model already raises it before the new code. Pre-existing; _binding_health is equally unguarded but never reached first."}
resolves:
  - {id: p2-r1, state: fixed, body: "8244ae448: the guard reads the cached verdict only; on dead it reads the catalogue and chooses via health.propose_for; never offers. Test test_run_binding_guard::test_a_live_binding_at_dispatch_reads_no_catalogue_and_probes_no_offer."}
  - {id: p2-r2, state: fixed, body: "8244ae448: a problem on the dispatched tier's agent file takes the restore path (SUBSTITUTION NOT APPLIED, exit 2). Test test_run_binding_guard::test_a_dispatched_tier_agent_file_left_unrewritten_is_not_a_substitution."}
  - {id: p2-r3, state: fixed, body: "8244ae448: _substitution_id = max numeric suffix + 1. Tests test_run_binding_guard::test_two_substitutions_of_one_tier_get_distinct_ids, ::test_a_substitution_id_never_reuses_a_taken_suffix."}
  - {id: p2-r4, state: fixed, body: "8244ae448: tests test_a_raising_materialise_restores_and_rematerialises_the_old_binding, test_a_flat_path_refusal_leaves_the_cursor_byte_identical, test_the_guard_runs_on_redispatch, plus the two p2-r3 tests (test_run_binding_guard)."}
  - {id: p2-r5, state: fixed, body: "8244ae448: _remember(journal) removed; new fr.bindings.apply.apply_binding is the one write path used by models_cmd._apply_binding and the guard (which keeps its restore)."}
  - {id: p2-r6, state: fixed, body: "8244ae448: _build_member_brief carries dead_bindings/binding_offers as null; _MEMBER_BRIEF_KEYS and test_member_briefs_carry_no_operator_input pin it."}
  - {id: p2-r7, state: out-of-scope, body: "Not caused by this change: a corrupt models.yaml already crashed fr run start via _orchestrator_model_notice → _resolved_model → load_models before this PR; the new _binding_health is never reached first. Worth its own fix (warn instead of crash in both notices)."}
