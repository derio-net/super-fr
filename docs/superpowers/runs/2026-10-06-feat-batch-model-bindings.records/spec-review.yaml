journal:
- kind: review
  id: spec-review-r1
  title: 'independent spec review: 12 findings'
  body: 'Reviewed docs/superpowers/specs/2026-10-06-model-binding-churn-design.md against the spec journal''s
    eight decision entries, against the codebase it names, and against itself (including matrix coverage
    and the `## Verification` grammar).

    Findings raised: sr1-f1..sr1-f12, all review_scope: in. Codebase: f1, f2, f3, f12. Decisions: f6,
    f11. Consistency/completeness: f4, f5, f7, f8, f9, f10.

    Verified: models.py:105 set_binding; models.py:70 resolved_config (spec cites :67); models_cmd.py:94-112
    set → set_binding → materialize_agents → _report_changes; models_cmd.py:69 _report_changes; opencode_agents.py:145
    materialize_agents; run_cmd.py:3347 _unbound_tiers (key emitted at :3343); run_cmd.py:3473 _orchestrator_model_notice
    called at :4450 (start) and :5047 (advance); run_cmd.py:4071 _advance_group (_open_dispatch at :4194,
    unit marked running at :4174); run_cmd.py:4012 _print_member_dispatch; run_cmd.py:4281 start_cmd;
    run_cmd.py:163/:191 _RunWrites + note(repo_root, path); run_cmd.py:723 _phase_tier → str|None; run_cmd.py:5174
    gated agent step prints _build_brief; trigger.py:280 is_interactive (TTY on stdin+stdout, no CI marker;
    also honours FR_NON_INTERACTIVE); journal/model.py:576 append_journal_entry(path, slug, entry), JournalEntry
    at :89 (frozen, extra=forbid, title required); parity.yaml rows are kind hook|interaction; harness/check.py:134
    checks hook rows only, so an interaction row passes --check; fr_herdr/runner.py:97-99 HARNESSES =
    only `claude`; fr-goal.yaml:61-64 brainstorm is the gate: operator step; fr-goal SKILL.md:57 the model-per-tier
    / unbound_tiers sentence exists; verification/spec_section.py:30-115 the section parses (one strategy
    line, two row lines with reasons; prose ignored); matrix.yaml:7077-7145 five model-binding-* rows
    cite R1, R2, R4–R12 but not R3.

    '
- kind: finding
  id: sr1-f1
  review_scope: in
  title: '`_flat_brief` does not exist; the brief builder is `_build_brief`, and it serves every agent
    step'
  body: 'check: codebase. Evidence: spec §C "Brief keys"; run_cmd.py:3305 (`_build_brief`), :3343 (`unbound_tiers`),
    :5174 (gated brief). The function returning the brief dict carrying `unbound_tiers` is `_build_brief(step,
    state)` at run_cmd.py:3305; it is not "flat" — it is called for grouped steps too (:5179 → `_advance_group`)
    and for the gated brief at :5174. Fix: rename to `_build_brief` and state the new keys are added only
    when `step.gate == "operator"`; its docstring and `test_run_cli.py` pin the key set to `Step.model_fields`,
    so say whether that test learns two conditional keys or the keys are always present as `null`.

    '
- kind: finding
  id: sr1-f2
  review_scope: in
  title: Several cited line numbers have drifted, and the description of `is_interactive` omits one condition
  body: 'check: codebase. Evidence: spec §2; models.py:70; models_cmd.py:94-95; trigger.py:295. `resolved_config`
    is at models.py:70, not :67; `fr models set` is at models_cmd.py:94-95, not :96. `is_interactive`
    also returns false when `FR_NON_INTERACTIVE` is truthy (trigger.py:295); R5''s "off a terminal" inherits
    that, so state it.

    '
- kind: finding
  id: sr1-f3
  review_scope: in
  title: R8 checks only grouped phase dispatch, misses tiered flat agent steps, and names the wrong tier
    source
  body: 'check: consistency. Evidence: R8; spec §C; flat dispatch run_cmd.py:5201-5223 (`_open_dispatch(...,
    tier=step.tier)`); fr-goal.yaml:85-86 (`spec-review`: `agent: super-fr:fr-spec-reviewer`, `tier: hard`);
    grouped tier run_cmd.py:4199 (`_dispatch_tier(repo_root, state, _effective_tier(member, step), phase_n)`);
    run_cmd.py:723-744 (`_phase_tier` returns None when the phase declares no tier). On OpenCode fr-spec-reviewer
    is materialised per tier like the phase executor; the flat path dispatches it with `tier: hard` and
    no binding check, so a dead `hard` binding still fails at dispatch. The grouped member''s tier comes
    from `_dispatch_tier(… _effective_tier(member, step) …)`, not `_phase_tier`, which is fail-soft (None
    for an untiered phase). Fix: check the same tier `_open_dispatch` receives, on both paths (or state
    flat tiered steps are a non-goal), and say what happens when the tier is None.

    '
- kind: finding
  id: sr1-f4
  review_scope: in
  title: 'R4 is undefined for the spec''s own motivating case: a dead model with no catalogue entry and
    no snapshot'
  body: 'check: consistency. Evidence: spec §2 (orchestrator `gpt-6-sol` has left the catalogue); R3;
    R4; R1; R5; §A `choose_replacement(tier, dead, bindings, entries, probe)`. Snapshots only start being
    recorded with this change, so every binding already dead and gone (gpt-6-sol) has neither entry nor
    snapshot. R4 says only "no autonomous pick, asking is the only path", but the family rule needs `family`/`release_date`
    and the tier rule ranks by price nearest the dead model''s — so R1, R5 and R7 have nothing defined
    to propose. Same gap when an entry exists but `price` is None. The 2× bound is only for autonomous
    picks, yet `choose_replacement` has no autonomous/proposal flag. Fix: define the proposal for no-entry/no-snapshot
    and unknown-price (e.g. the provider''s "Did you mean" hint, the tier rule without price nearness,
    or explicitly none), and make the 2× bound a parameter or a `Choice` field the caller checks.

    '
- kind: finding
  id: sr1-f5
  review_scope: in
  title: The tier rule's ordering is undefined for the `orchestrator` binding, which R5 and R6 propose
    replacements for
  body: 'check: consistency. Evidence: R4 (tier rule ordering, distinct from `orchestrator`); R5/R6 cover
    `orchestrator`; models_cmd.py:100-102 (orchestrator is never dispatched to). Fix: state what the tier
    rule means for `orchestrator` — family rule only, or distinct from every phase tier with no ordering,
    or no tier-rule proposal.

    '
- kind: finding
  id: sr1-f6
  review_scope: in
  title: '"Run journal" is not a journal scope; the spec records in two different journals, and the operator-decided
    entry lacks R11''s fields'
  body: 'check: decisions. Evidence: decision `record-in-run-journal-only`; R7 (brainstorm decision →
    spec journal); R8 (plan journal); R11 ("the run journal records it"); journal scopes are spec|plan|debug.
    An autonomous substitution goes to the plan journal, an operator choice to the spec journal; R7 does
    not require old, new, reason, decider, rule. Fix: define "run journal" (e.g. spec journal before plan,
    plan journal after) and require R7''s decision body to carry the same five fields with `decider: operator`.

    '
- kind: finding
  id: sr1-f7
  review_scope: in
  title: R3 (probe cache, 6 h TTL, catalogue snapshots) is cited by no acceptance row
  body: 'check: consistency. Evidence: matrix.yaml:7077-7145 rows cite R1, R2, R4–R12, never R3. R3 states
    behaviour the run-integration and replacement rows depend on (TTL, set/check fresh, the snapshot that
    keeps lineage). Fix: add R3 to `model-binding-replacement`''s origin or add a row for it.

    '
- kind: finding
  id: sr1-f8
  review_scope: in
  title: Neither the Test Plan nor `## Verification` names the three candidate rows or their scenarios
  body: 'check: consistency. Evidence: spec `## Test Plan` and `## Verification` (only -live-opencode
    and -run-integration listed); matrix rows model-binding-set-probe/-replacement/-check-report are `verify:
    candidate` with scenarios tests/scenarios/model-binding-{set-probe,replacement,check}.sh (matrix.yaml:7089-7117).
    The section is grammatically valid but never names the rows the walk runs or the scenario files to
    build; the issue''s "a test pins catalogue `status: active` is not treated as live" has no stated
    location. Fix: list the three candidate rows in `## Verification`, name their scenario scripts and
    stub states, and say where the status:active test is pinned.

    '
- kind: finding
  id: sr1-f9
  review_scope: in
  title: 'parity row `opencode: enforced` overclaims for a surface proven only against a stub'
  body: 'check: consistency. Evidence: spec §D; parity.yaml:242-251 and :272-282 (OpenCode interaction
    rows stay `partial` until their post-merge live row runs); Test Plan row `model-binding-live-opencode`.
    Fix: `opencode: partial` with a scope_note citing `model-binding-live-opencode` until it runs live.

    '
- kind: finding
  id: sr1-f10
  review_scope: in
  title: Unproven assumption that a mid-session agent-file rewrite reaches the next OpenCode dispatch
  body: 'check: consistency. Evidence: R8; §C (`materialize_agents` then the brief); issue ("a fallback
    must rewrite the file before dispatch"). R8 rewrites `fr-phase-executor-<tier>.md` while the orchestrating
    OpenCode session runs and assumes the next task dispatch reads the new `model:`; nothing cites evidence
    OpenCode reloads agent files mid-session. If not, the substitution is recorded and announced while
    the old model still runs. Fix: cite a measurement, or add a Risk plus a scenario/live-row step that
    confirms the served model after a mid-session rewrite, and name that as the property the live row
    proves.

    '
- kind: finding
  id: sr1-f11
  review_scope: in
  title: The decision lists `fr models set` as a place to ask; R1 refuses instead
  body: 'check: decisions. Evidence: decision `ask-at-gates-else-decide` ("ask on a terminal (`fr models
    set/check`)"); R1 (dead → exit 2 printing the proposal). Fix: on `is_interactive()` have `set` offer
    the proposal (default yes) like `check`, or record in R1 that refusal-with-proposal plus `check`''s
    prompt is how the decision is met.

    '
- kind: finding
  id: sr1-f12
  review_scope: in
  title: The autonomous substitution writes files outside the repo before the cursor commit, with no rollback
    order
  body: 'check: codebase. Evidence: §C dead+Choice branch; run_cmd.py:186-192 (`_RunWrites.remember`/`note`
    cover repo paths only); run_cmd.py:4203 (`_save_run_state`). Order is user models.yaml + agent files,
    then plan-journal append, then commit; a later failure leaves the binding and agent files changed
    with no journal entry — a silent substitution R11 forbids. Nor does the spec say whether the journal
    path goes through `remember()`. Fix: specify the order that keeps "recorded iff applied", or state
    that an advance failure after the binding write is reported loudly with the old → new pair.

    '
resolves:
- id: sr1-f1
  state: fixed
  body: 'Renamed to `_build_brief` (run_cmd.py:3305); R6/§C state both keys are always present, lists
    only for `gate: operator` on a probed harness, else null, and that the key-set pin at test_run_cli.py:1095
    grows by them.'
- id: sr1-f2
  state: fixed
  body: Background now cites models.py:70 and models_cmd.py:94, and states is_interactive's FR_NON_INTERACTIVE
    condition (trigger.py:295); R5 restates it.
- id: sr1-f3
  state: fixed
  body: R8 now checks the tier `_open_dispatch` receives on BOTH paths (grouped `_dispatch_tier(... _effective_tier
    ...)` and flat `step.tier`, e.g. spec-review's `hard`); a None tier is not checked. §C names one guard
    `_guard_dispatch_binding` called before either path opens or saves anything.
- id: sr1-f4
  state: fixed
  body: R4 adds a third rule, the provider's `Did you mean` hint, for a dead model with no entry and no
    snapshot (gpt-6-sol's case); unknown dead price ranks the tier rule by newest. The 2x bound is now
    a predicate `is_autonomous(choice)` over `Choice.rule` and `price_ratio`; operator proposals are unbounded
    and show their ratio.
- id: sr1-f5
  state: fixed
  body: R4's tier rule is phase tiers only; `orchestrator` gets the family rule and the provider hint.
- id: sr1-f6
  state: fixed
  body: 'R11 defines the run journal: spec journal while the run has no plan artifact, plan journal after.
    R7 and R8 both require the five fields (old, new, reason, decider, rule).'
- id: sr1-f7
  state: fixed
  body: 'New row model-binding-probe-cache cites R3 (verify none, unit tests with an injected clock —
    reason in ## Verification).'
- id: sr1-f8
  state: fixed
  body: '## Verification now names the three candidate rows, their scenario scripts and the stub states
    each covers, and pins the status:active test in tests/unit/test_bindings_probe.py.'
- id: sr1-f9
  state: fixed
  body: 'parity row declared `opencode: partial` with a scope note citing model-binding-live-opencode.'
- id: sr1-f10
  state: fixed
  body: Added a Risk naming the unproven mid-session agent-file pickup; the live Test Plan step and the
    live row's reason name it as the property they prove; parity stays partial until then.
- id: sr1-f11
  state: fixed
  body: R1 now asks on a terminal (proposal, default yes) and refuses off one, matching the decision `ask-at-gates-else-decide`.
- id: sr1-f12
  state: fixed
  body: '§C specifies the write order: remember+append+note the journal entry, then write the binding
    and materialise; a binding-write failure restores models.yaml and the journal bytes and exits 2 loudly,
    so a substitution is recorded iff applied.'
