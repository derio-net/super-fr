journal:
- kind: decision
  id: p1-trusted-claim-authors
  phase: 1
  title: Only trusted authors' claim markers count (R17)
  body: 'Security review (orchestrator scope addition): on a public repo any account can comment, and
    under

    R4 (oldest un-released marker wins, an expired one still holds) a stranger''s back-dated `fr-claim`

    marker would lock every scope out of the issue. So `read_claims`/`claims_from_comments` take

    `trusted` (the repo''s allowed authors, `fr.triage.batch.allowed_authors`: `pr_authors`, default

    `Facts.viewer`, compared case-insensitively) and ignore and count any other author''s marker

    (`ClaimRead.untrusted`). Every claim_writes call takes `trusted` and every re-read applies it; a

    claim whose own posted marker is by an untrusted author withdraws it and raises ClaimError,

    because no reader would count it. Spec gained R17, the Non-goals'' security bullet, and §3.B/§3.D.

    '
- kind: decision
  id: p1-claim-precheck-and-stray-releases
  phase: 1
  title: claim() checks R4 before posting; owed_releases also covers own stray claims
  body: '`claim_writes.claim` reads first and returns Held without writing when another scope already

    holds the issue; R4''s post-then-re-read still decides races (tested by a racing fake). An own

    losing marker found at that read is withdrawn. `claims.owed_releases` takes `own` (this

    scope''s claims facts show) and adds those on keys no batch owes any more: that is how the

    members `batch edit --remove-issue` dropped and a proposed batch whose wave was cleared are

    released by a later `claim sync` when the edit ran without `--yes`. Releases of releasing

    batches stay derived from the batch (only batches that ever owed claims: a wave or a dispatch),

    and a `claims_released` event counts only after the batch''s last other event, so a redispatch

    owes claims (and later releases) again.

    '
