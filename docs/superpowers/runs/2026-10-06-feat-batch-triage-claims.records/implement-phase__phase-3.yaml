journal:
  - kind: decision
    id: p3-publish-through-gitseam
    title: The publish command starts through gitseam, the one place a process starts
    phase: 3
    body: "scope_config.publish_board builds the argv (placeholders substituted inside each word, no shell) and hands it to gitseam.run_publish, which reuses _run. The full suite caught the first draft: fr.triage modules other than gitseam may not import subprocess (test_fr_triage_touches_gh_only_in_collect), and the seam pins its process starts to two."
  - kind: decision
    id: p3-board-claim-view-needs-now
    title: build_board takes me and now; the claim view is absent without them
    phase: 3
    body: "The board stays a pure function (no clock): me (scope id) and now are passed in, and without me there is no Held elsewhere group and no card expiry. write_board computes scope_id(facts.scope); a broken host id adds a page note instead of failing the render."
