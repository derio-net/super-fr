- kind: decision
  id: p1-claim-trust-member
  phase: 1
  title: Claims trust org MEMBER association (accepted residual from a background security review)
  body: 'Trusting authorAssociation MEMBER also trusts an org member with read-only repo access. Kept:
    drivers usually get write access through team membership, which GitHub reports as MEMBER, and dropping
    it reintroduces p1-r1. GitHub computes the association server-side, so it can''t be spoofed; strangers
    on public repos (NONE/CONTRIBUTOR/FIRST_TIME_CONTRIBUTOR) stay excluded, which is R17''s threat. A
    claim coordinates trusted actors and is not a security boundary between them; pr_authors remains for
    repos that want an explicit list.'
