    cancel, schema bumps, host-id exclusivity and R17 coverage. It raised p1-r1..p1-r9 (in) and p1-r10
    (out). The orchestrator verified r1/r2 (model.py trusted_logins), r3 (claim_writes.release ignores
    the batch) and r5 (label removal decided pre-edit) against the code and gh''s comment fields (authorAssociation
    present). All nine in-scope findings were fixed test-first in 66892d334..4be36b54c, and a new row
