schema_version: 8
run: 2026-10-06-feat-batch-triage-claims
step: spec-review
outcome: done
journal:
- kind: finding
  id: sr-1
  title: claim()/holder() weigh live claims only, so an un-released expired foreign claim is silently
    taken over
  body: 'R4''s race rule ranged over live claims only: a scope claiming against an expired, un-released
    foreign claim would win, an automatic take-over the operator ruled out, and contradicting R6.'
  review_scope: in
- kind: finding
  id: sr-2
  title: release drops fr:claimed when no live claim is left, hiding expired claims from collect
  body: collect reads comments only of fr:claimed issues, so dropping the label while an expired un-released
    marker remains hides it from facts, check and R6.
  review_scope: in
- kind: finding
  id: sr-3
  title: claims released at stage merged, before the close-out runs
  body: CLOSED_OUT includes merged (batch.py:59) but the close-out runs after it (batch_drive.py:851-888);
    releasing at merged reopens cross-host duplicate close-outs. The wave-less owed clause also alternated
    with releases.
  review_scope: in
- kind: finding
  id: sr-4
  title: claims on closed members are never in facts, so owed_releases cannot release them
  body: collect reads open issues only; a merged batch's members are closed.
  review_scope: in
- kind: finding
  id: sr-5
  title: own expired claims are never refreshed after a driver outage
  body: R8 refreshed live claims only; a refresh could also resurrect a marker another scope's take released.
  review_scope: in
- kind: finding
  id: sr-6
  title: dispatch must claim before the runner launch
  body: runner.dispatch (:1125) precedes _forge_writes (:1146); a lost race would be found after a session
    started.
  review_scope: in
- kind: finding
  id: sr-7
  title: batch cancel refused for a held batch deadlocks it
  body: A held own batch could never be dispatched, merged or cancelled.
  review_scope: in
- kind: finding
  id: sr-8
  title: deferring the wave-assignment claim to --yes departs from claim-at-wave, and the gap is invisible
  body: create/edit are local-only today.
  review_scope: in
- kind: finding
  id: sr-9
  title: a re-claim posts a new comment, breaking one-marker-per-signer; moving a member between batches
    unspecified
  body: Editing a released marker back to live would keep its old created_at and wrongly win R4.
  review_scope: in
- kind: finding
  id: sr-10
  title: concurrent first use can mint two host ids
  body: Atomic rename does not stop two processes each minting an id.
  review_scope: in
- kind: finding
  id: sr-11
  title: a held batch with a running session is left out of --max-inflight
  body: A backfilled held batch may already be dispatched.
  review_scope: in
- kind: finding
  id: sr-12
  title: Verification row descriptions do not cover several requirements their rows claim
  body: R1 scope show, R3 create/edit, R9 take/release, R12 collect/schema, R14 board --publish and names,
    R15 export exclusion, R16 mirrors were unnamed.
  review_scope: in
- kind: review
  id: spec-review-1
  title: 'independent spec review: 12 findings'
  body: "fr-spec-reviewer checked the six operator decisions against R1-R16 and \xA73, every named file/line\
    \ against the code (all references verified correct), and internal consistency across requirements,\
    \ design, Verification and \xA76. Findings sr-1..sr-12, all in scope, all fixed in the spec. No finding\
    \ on the facts schema bump, harness neutrality of the argv publish hook, privacy of the marker, or\
    \ the gh comment url as the PATCH id source."
resolves:
- id: sr-1
  state: fixed
  body: "R4 and \xA73.B/\xA73.D now range over every un-released claim, live or expired; expiry changes\
    \ only what the operator is offered."
- id: sr-2
  state: fixed
  body: "R10 and \xA73.D remove the label only when no un-released claim, live or expired, remains."
- id: sr-3
  state: fixed
  body: "\xA73.B releasing(): cancelled, abandoned or finished (run archived); merged/partial keep and\
    \ refresh claims. owed_claims bounded to not-releasing batches."
- id: sr-4
  state: fixed
  body: Releases are derived from the batch side and read/written per member at release time, open or
    closed; recorded as a claims_released event (judgements schema 6) so they are not repeated.
- id: sr-5
  state: fixed
  body: R8 refreshes own un-released claims, expired included; refresh re-reads and returns Held without
    writing when the marker was released by a take.
- id: sr-6
  state: fixed
  body: "R3 and \xA73.E: the claim, R4's re-read included, completes after the compare-before-write checks\
    \ and before the runner launch."
- id: sr-7
  state: fixed
  body: "R6 and \xA73.E allow cancel on a held batch: it releases own claims and leaves held members'\
    \ label and comments to their holder; touches_forge now covers a proposed batch with written claims."
- id: sr-8
  state: fixed
  body: "create/edit gain --yes that writes the claims at wave assignment; without it the claims are owed\
    \ and shown in check's and claim list's new `claims owed` set; recorded under \xA72.2 decision 1."
- id: sr-9
  state: fixed
  body: "R2: at most one un-released marker per signer; re-claim posts a new one. R3/\xA73.D: an own un-released\
    \ claim naming another batch is edited in place (continuous hold)."
- id: sr-10
  state: fixed
  body: "\xA73.A: temp file hard-linked into place (fails if it exists), loser re-reads the winner; path\
    \ through fr.isolation.types._home()."
- id: sr-11
  state: fixed
  body: "\xA73.F: held batches in LIVE_STAGES count; only proposed held batches do not."
- id: sr-12
  state: fixed
  body: Every Verification row now names the tests that cover each requirement it maps.
acceptance: []
evidence:
  review: spec-review-1
  reviewer: a9c900028fa8cdbf1
