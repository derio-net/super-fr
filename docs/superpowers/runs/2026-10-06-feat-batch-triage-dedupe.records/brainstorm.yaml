    id: brief-971
    title: "Operator brief: batch triage-dedupe (super-fr#971), verbatim"
    body: |
      /fr-goal Triage owns duplicates: a sweep proposes duplicate open issues, judgements record duplicate_of

      Batch `triage-dedupe` of derio-net/super-fr: 1 issues, delivered as ONE pull request.

      ## super-fr#971: Triage owns duplicates: a sweep that finds duplicate open issues and records them structurally
      No sweep finds duplicate open issues; #781 (check before filing) was closed not planned because a run must not search the backlog. Triage owns it: candidates from the engine, judgement from the skill, `duplicate_of` in judgements.
      Note: Operator 2026-10-05: finding duplicates is our responsibility.

      ## Why these belong together
      Wave 4: operator 2026-10-05, finding duplicates is our job. After state-integrity: both touch the judgement model and keys.

      ## Delivery rules
      - Work on branch `feat/batch-triage-dedupe`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#971
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.
  - kind: decision
    id: q1-surface
    title: "Sweep lives in check sets plus a board section; no new verb"
    body: "Operator chose the recommended option: `check` gains `duplicate candidates` and `duplicates` sets, the board a Possible duplicates section. The refresh loop already runs check, so the sweep runs on every refresh."
  - kind: decision
    id: q2-dismissals
    title: "Dismissals are per-issue distinct_from, read symmetrically"
    body: "Operator chose `distinct_from: [keys]` on a judgement, beside `duplicate_of`."
  - kind: decision
    id: q3-board
    title: "A judged duplicate nests under its original on the board"
    body: "Operator chose nesting: the duplicate leaves its tier and is never unplaced; a closed or missing original keeps it in its tier with a warning tag."
  - kind: decision
    id: q4-close-command
    title: "Print gh issue close --duplicate-of; no --yes executor"
    body: "Operator chose printing GitHub's native duplicate close command and never running it; nothing in this change writes to the forge."
  - kind: decision
    id: q5-driver
    title: "Driver reports candidates once when a wave finishes"
    body: "Operator chose one warn line after a wave's close-out completes (spec §3.E makes it the pass whose archive merge finishes the wave, stateless)."
  - kind: decision
    id: d-no-schema-bump
    title: "duplicate_of/distinct_from are optional on every judgements schema"
    body: "Follows the `kind`/`features` precedent (wave-driver R9): no engine verb writes them, and judgements.yaml is not an artifact kind."
  - kind: decision
    id: d-calibration
    title: "Signal thresholds calibrated on this repo's 438 issues"
    body: "Prototype recovered all three known duplicate groups (4 of 5 pairs directly, the fifth by connectivity) and flags 4 pairs among 61 open issues; spec §2."
