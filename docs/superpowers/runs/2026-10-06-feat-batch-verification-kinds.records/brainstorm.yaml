    id: brief-batch-verification-kinds
    title: Operator brief — batch verification-kinds (#818, #822, #959)
    body: |
      /fr-goal Verification before merge: candidate walks for software repos, issues closed on live evidence, and merge conflicts handed back to the batch session

      Batch `verification-kinds` of derio-net/super-fr: 3 issues, delivered as ONE pull request.

      ## super-fr#818: Verification kinds: a pre-merge candidate walk for software repos, instead of live walks after release
      For software repos a live walk after merge means the first real test happens on main; 18 of 105 recent issues were first defects of shipped features. Proposes a pre-merge candidate walk as a verification kind.
      Note: Design issue; #817 is its evidence (six closed fixes failed or partly failed live).

      ## super-fr#822: Close an issue whose promise is run behaviour on live evidence: deliver refuses Closes #n while its matrix row awaits a live walk
      Proposed rule: deliver refuses Closes #n while a matrix row citing #n awaits a live walk; the live walk names harness and model; waiting issues are kept out of the ranked backlog. Interim until #818.
      Note: After the talk; pairs with #821 (same deliver PR-body gate).

      ## super-fr#959: triage drive: hand real merge conflicts back to the batch's session
      A real merge conflict stops the train with `stopped again at <head>` until the operator nudges the batch session. Hand-delivered twice on 2026-10-05 (#922, #951).
      Note: Seen live 2026-10-05.

      ## Why these belong together
      Wave 7 (operator 2026-10-06). #818: a pre-merge candidate walk replaces post-merge Test Plans for libraries and CLIs, gating deliver; live stays for infrastructure. #822: an issue whose promise is run behaviour closes on its live evidence (same deliver gate). #959: a real merge conflict goes back to the batch's session instead of stalling the train (handed back by hand 6 times on 2026-10-05/06). Starts with a brainstorm: #818's four open questions are the operator's.

      ## Delivery rules
      - Work on branch `feat/batch-verification-kinds`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#818
        Closes derio-net/super-fr#822
        Closes derio-net/super-fr#959
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.
  - {kind: decision, id: q1-strategy-home, title: "Verification is per issue with a shape default, extensible like workflows", body: "Operator: not repo-specific; a default dependent on shape is acceptable; each issue decides its own; per-row override is the right scoping; pre-merge ideal, other sanctioned strategies (client-live without a release, staging rc) when not possible; post-merge live walk is the last resort; client repos can author their own strategies. → R1, R4–R7."}
  - {kind: decision, id: q2-gate-form, title: "A pre-merge agent walk gates deliver as evidence", body: "Deliver evidence `walk`, verified like `tests`; status vocabulary unchanged. → R11."}
  - {kind: decision, id: q3-scenarios, title: "Run's rows plus a baseline smoke", body: "Every walk runs the smoke; then the scenario of each row the run's spec cites. → R9."}
  - {kind: decision, id: q4-prerelease, title: "Pre-release in scope, on demand, if the issue asks", body: "→ R24 (with r2q6)."}
  - {kind: decision, id: q5-ship-scope, title: "Ship candidate + client-live beyond mechanism and live", body: "Staging/preview documented as a repo-authored example. → R3, R4."}
  - {kind: decision, id: q6-row-issues, title: "Rows cite issues through a new issues: field", body: "Matrix shape change. → R13."}
  - {kind: decision, id: q7-close-on-flip, title: "set-status prints the close command; fr never closes", body: "→ R16."}
  - {kind: decision, id: q8-harness-model, title: "Structured walks list with harness and model; harness-wide rows need a pass per harness", body: "→ R14."}
  - {kind: decision, id: q9-awaiting-mark, title: "fr:awaiting-live label; triage lists it separately", body: "→ R17, R18."}
  - {kind: decision, id: q10-retry-bound, title: "Two conflict hand-backs, then needs-you", body: "→ R22."}
  - {kind: decision, id: q11-test-plan, title: "Dogfood: this PR is verified by its own candidate walk", body: "Only the live herdr hand-back stays post-merge. → R25."}
  - {kind: decision, id: r2q1-strategy-def, title: "A strategy is a YAML manifest resolved repo > shipped like workflows", body: "→ R1, R2."}
  - {kind: decision, id: r2q2-default-from, title: "The workflow manifest supplies the default strategy", body: "→ R5."}
  - {kind: decision, id: r2q3-per-issue, title: "Spec ## Verification section, row override via verify:", body: "→ R6, R7."}
  - {kind: decision, id: r2q4-last-resort, title: "A post-merge strategy needs a stated reason", body: "→ R6, R12."}
  - {kind: decision, id: r2q5-operator-walk, title: "An operator pre-merge walk blocks the ready box, not deliver", body: "→ R12."}
  - {kind: decision, id: r2q6-prerelease, title: "Ship a prerelease strategy with an on-demand pre-release workflow", body: "→ R3, R24."}
