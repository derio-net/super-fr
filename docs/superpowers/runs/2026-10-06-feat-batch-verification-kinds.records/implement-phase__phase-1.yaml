journal:
  - kind: decision
    id: p1-shared-shipped-walk
    title: shared shipped-dir walk lives in fr/_shipped.py; workflow keeps its own packaged_shipped_workflows_dir
    phase: 1
    body: "fr/_shipped.py holds packaged_dir(dirname), shipped_dirs, lookup_candidates, listing and MARKETPLACE_ROOT (re-exported from workflow.resolve). workflow.resolve keeps a thin packaged_shipped_workflows_dir wrapper because tests monkeypatch it by that name. The packaged-dir cache moved from two module globals to a per-dirname dict."
  - kind: decision
    id: p1-strategy-template-shape
    title: install/scenario accept a string (shell-split) or a list, stored as tuple; check_workflow takes optional repo_root
    phase: 1
    body: "StrategyManifest.install/scenario normalise to tuple[str,...] | None. check_workflow(manifest, repo_root=None) resolves `verification:` against shipped sources only when repo_root is None; the CLI passes the repo root. resolve_strategy accepts repo_root=None for the same reason. effective_strategy(row_verify, row_id, section, shape_default) and is_post_merge(strategy, repo_root) take plain strings per the plan; is_post_merge raises StrategyError on an unresolvable name. spec_section ignores prose and fenced code, and errors only on a bullet or strategy: line that breaks the grammar; the reason is optional in the grammar (self-review owns 'reason owed')."
  - kind: discovery
    id: p1-no-change-fragment
    title: no .changes fragment added in phase 1
    phase: 1
    body: "This phase touches packages/*/src and plugins/*/workflows, so the PR needs a .changes/<branch-slug>.yaml fragment; none was in this phase's steps. It is owed before delivery."
