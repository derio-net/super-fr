  title: Phase 3 independent code review — 9 findings, all in scope, all fixed
  body: 'Independent reviewer checked 6fa8c9f50 against spec §C/§D and 03.yaml, and confirmed or refuted
    three background security flags: forgeable walk evidence (confirmed, p3-r1), gate field mismatch (partly,
    p3-r2), and parser differential (partly, p3-r4; the keyword-adjacency case is refuted because shared_closing_keywords
    already refuses it). It also raised p3-r3 and p3-r5 through p3-r9. All fixes were made test-first
    by a separate fixer context. Three further background security flags on the new observed.py predicate
    (a parser differential, an incomplete denylist, an allowlist semantic escape) drove the switch to
    the structural allowlist plus binding to the manifest sha, all red-tested. The residual trust boundary,
    a background writer during the window, equals the tests witness''s and is documented beside the predicate.
    Full suite after the fixes: 9254 passed, 105 skipped.'
