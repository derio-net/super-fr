resolves:
- id: spr-f1
  state: fixed
  body: 'Fixed: R4 and §B now rewrite `branch` in every bound session''s index; P1.T2.S1 asserts it.'
- id: spr-f2
  state: fixed
  body: 'Fixed: GitHub docs confirm renaming a PR''s head closes the PR. Operator decision d9: always rename, and
    reopen. §C no longer uses the rename API: it publishes the batch branch, opens a new PR (title, body, draft),
    comments and closes the old one, deletes the old branch. The upstream is set by `git push -u`, so there is no
    async rename or stale origin/<new>.'
