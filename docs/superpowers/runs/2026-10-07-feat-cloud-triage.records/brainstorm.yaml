acceptance:
  - id: cloud-triage-github-rest
    capability: Backlog triage
    acceptance: Where GitHub's GraphQL API is unavailable, an operator can still collect, judge, render, batch, merge and drive a backlog by setting one option, and gets the same records as with GraphQL apart from a listed set of fields
    origin: ["super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R1", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R2", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R3"]
    status: not-implemented
    verify: client-live
  - id: cloud-triage-state-ref
    capability: Backlog triage
    acceptance: A scope's triage state lives in its workspace and survives the loss of the machine through a ref only that scope writes, kept in the repo itself or, for several repos or an org, in a state repo the operator chose with the privacy trade-off spelled out
    origin: ["super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R4", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R5", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R6", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R7"]
    status: not-implemented
  - id: cloud-triage-privacy-guard
    capability: Backlog triage
    acceptance: An issue from a private repo can never reach a public state repo; adding it to a triage, a batch or a wave, or pushing or exporting state that contains it, is refused with the issue and both repos named
    origin: ["super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R8"]
    status: not-implemented
  - id: cloud-triage-driver-lease
    capability: Backlog triage
    acceptance: Only one driver runs per scope across every host and cloud session; a second is refused, and an abandoned lease is reported and taken over only by the operator
    origin: ["super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R9"]
    status: not-implemented
  - id: cloud-triage-driver-end-to-end
    capability: Backlog triage
    acceptance: An operator can run the wave driver as a long-lived cloud session beside a host driver; it dispatches each batch to its own cloud session, shows what a blocked session waits for, hands work back, merges and closes out, keeps going across container restarts, and makes the same decisions the host driver would
    origin: ["super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R10", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R11", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R12", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R13", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R14", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R15", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R18", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R19", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R20", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R21"]
    status: not-implemented
    verify: client-live
  - id: cloud-triage-version-drift
    capability: Backlog triage
    acceptance: A session keeps the plugin and fr versions it started with; when a release makes them incompatible, the driver moves its work to a fresh session on the same branch once, and otherwise leaves it alone
    origin: ["super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R16", "super-fr:docs/superpowers/specs/2026-10-07-cloud-triage-design.md#R17"]
    status: not-implemented
