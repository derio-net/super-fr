resolves:
- id: s1
  state: fixed
  body: 'R3 and §A: `forge.api` resolves from `FR_FORGE_API` or the host''s `scope.yaml` before any client
    exists; the repo-level key is dropped with the reason; both `client_for_backend` and `client_for_url`
    consult it.'
- id: s2
  state: fixed
  body: R1 widened to the run path (deliver, close-out, adopt, isolation, linked PRs); §A routes the direct
    `fr.gh` helpers too, and the REST client raises on 403 instead of a soft empty answer; Test Plan 2
    and 17 cover it.
- id: s3
  state: fixed
  body: §A table adds `workflowName` (Actions runs by head_sha, mapped by check_suite_id; app name otherwise)
    and the `startedAt`/status normalisation; Test Plan 1 asserts them.
- id: s4
  state: fixed
  body: R11 starts the cloud driver with a fixed `FR_HOST_ID` (already supported, scope_config.py:29)
    and its state repo; §B stores `state_repo`/`forge_api` in `scope-durable.yaml` inside the ref; Test
    Plan 6 covers recovery.
- id: s5
  state: fixed
  body: R5 and §B define the ref tree as an explicit list (`REF_FILES`), merge stops, lease and durable
    settings included; Test Plan 5 round-trips every entry.
- id: s6
  state: fixed
  body: R14 and §F define pending requests with stable ids stored in state, pending runner results, replay
    every pass, and idempotent execution via session tags; Test Plan 9 covers a lost result.
- id: s7
  state: fixed
  body: §F adds an optional `SessionNotes` protocol for the text; `SessionStatus` is unchanged, so herdr
    is untouched; Test Plan 10.
- id: s8
  state: fixed
  body: 'R15: completed → idle (messageable), with the reason in §F; a conflict is handed back by message;
    Test Plan 10.'
- id: s9
  state: fixed
  body: 'R18 and §E step 2: the driver compares its `fr` with the latest release before each pass, reinstalls
    and re-execs when older, and re-homes itself on a new major so its skill text is current; R20 updated.'
- id: s10
  state: fixed
  body: '§G: cursors read from each batch branch over REST; incompatibility is a different `fr` major;
    no recorded versions → reported only; artifact readability is left to fr''s own migration gate. R17
    narrowed accordingly; Test Plans 11-12.'
- id: s11
  state: fixed
  body: 'R4 and §B: `.git/info/exclude`, never a tracked file; workspace = git toplevel or `--workspace`
    (required outside a clone); the READ_ONLY_COMMANDS rationale is updated; Test Plan 4.'
- id: s12
  state: fixed
  body: §B names it an owed measurement; Test Plan 16 pushes and fetches the scope's ref through the cloud
    git proxy before merge.
- id: s13
  state: fixed
  body: 'R9 and §D: duration = three wake intervals plus the Routine''s period (90 min default); host
    holder is `host:<host id>`, stable across pid changes; the same holder renews its own expired lease;
    Test Plan 8.'
- id: s14
  state: fixed
  body: Test Plan 2 lists every GraphQL-backed call incl. writes and `issue view --json`; Test Plan 7
    adds the export refusal; Test Plan 11 adds the run kind's stamp, migration, validator and chain.
- id: s15
  state: fixed
  body: '§F: `packages/fr-claude-cloud`, with its version surface, mypy entry, import-direction entry
    and contract test; the ''become optional'' list narrowed to `ADOPT_LIST_RUNNER` and the wave grouping
    (batch_drive.py:457).'
