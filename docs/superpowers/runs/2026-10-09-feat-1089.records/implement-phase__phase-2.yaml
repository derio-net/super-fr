journal:
  - kind: decision
    id: p2-targeted-ci
    phase: 2
    title: Phase 2 uses bounded local checks and CI full-suite evidence
    body: Operator explicitly forbids another local full suite after phase-1 storage and installer I/O failures. Targeted tests use this attempt's host-mounted sandboxes; the existing draft PR's ci-ok gate owns full verification. No client-live walk is claimed.
  - kind: discovery
    id: p2-audit-and-repair-contract
    phase: 2
    title: Replacement audit is separate from dispatch and runner uptake
    body: Schema-7 events retain the original dispatch; lifecycle selectors ignore audit rows, including dispatch repair and cancellation/collection. Scope then independently verified pane ownership spans descriptor preparation, compare-write attempt, fresh source checks, uptake, batch launch/success and activation. Prepared-before-attempt and committed-before-activation windows have explicit input-free repair. Pre-submission/uncertain target kind/model never certifies uptake. Installed synthetic scenario passed both directions/model-only, startup failure and shell repair.
  - kind: decision
    id: p2-explainers-unaffected
    phase: 2
    title: Published explainers do not describe herdr replacement
    body: As established in the phase-1 handoff, published explainers describe neither herdr lifecycle nor restart-idle; the new operator verb does not change their pipeline or named CLI surfaces. Runner README, control-session operator notes, AGENTS schema/runner notes and canonical fr-triage with both generated mirrors document replacement and the owed client-live walk instead.
  - kind: finding
    id: p2-live-instructions-not-evidence
    phase: 2
    state: fixed
    review_scope: in
    title: Printed client-live instructions must not certify a walk
    body: The operator script now exits 3 while the walk is owed; only an interactive explicit verdict backed by a nonempty redacted observation log can report PASS. The instruction-contract test asserts owed/nonpassing output. No client-live walk or Ready completion is claimed.
  - kind: discovery
    id: p2-verification-scope
    phase: 2
    title: Bounded local checks cover replacement and neighbouring lifecycle contracts
    body: The broad targeted group ran 1228 tests; 1224 passed and four stale schema-number assertions failed, then those expectations were upgraded to schema 7 (future schema 8) without weakening backwards reads. Final affected checks passed 324 tests with 104 intentional skill skips; ruff passed and mypy passed 305 source files. The installed replacement/instruction/scenario-registration group passed three checks. Acceptance check passed 457 rows with existing debt warnings; replacement is CI-wired, live walk remains skipped with issue 1089. CI alone owns the full-suite gate.
  - kind: discovery
    id: p2-postcommit-ci-evidence
    phase: 2
    title: Final committed tree passes bounded targeted checks; full suite remains CI-owned
    body: |
      Code b6f757de was committed and pushed to the existing draft before final checks; no code changed afterwards.
      Host scratch logs: 1089-phase2-targeted-final.log (861 passed, 104 skipped; ruff/format check and mypy over 305 source files passed; exit=0) and 1089-phase2-candidate-fresh-final.log (5 installed launch/restart/replacement/instruction/registration checks passed; exit=0).
      The earlier 1089-phase2-candidate-final.log is failed evidence (one import failure, four passed; exit=1): this executor reused its own uv wheel cache after adding ReplacementInspection. A new owned unique cache rebuilt all packages and the installed candidate passed. No shared cache or unowned data was removed.
      Logs are in the approved host opencode temp directory, outside the repository and step records. Own isolated host-mounted test/runtime directories remain; no test, installer or polling process is still running. No local full suite was attempted. evidence.tests is ci; the orchestrator owns ci-ok and the operator owns the still-skipped client-live Ready walk. Acceptance transitions were committed with CLI verbs, not record sections.
  - kind: finding
    id: p2-ci-38010048095-regressions
    phase: 2
    state: fixed
    review_scope: in
    title: CI exposed omitted skill/schema and triage architecture guards
    body: |
      All four unique CI failures were reproduced RED locally with their exact test nodes, without a full-suite attempt. Canonical skill compression had removed the literal batch cancel command; it now spells out dispatch/merge/cancel and both mirrors were regenerated, retaining the 120-line limit.
      The skill example test now checks the actual current writer schema and matching documentation, parses real batches and rejects authored events. A separate historical schema-3 example test verifies unchanged batch/issue compatibility. The CLI refusal fixture uses a schema above every supported reader stamp and still asserts exit 2, judgements.yaml and the unsupported schema diagnostic.
      The real architectural defect was subprocess enforcement probing inside triage/operation_lock.py. The unchanged forge/subprocess guard now passes because verified nonblocking flock ownership and its bounded independent Python probe live in fr/file_lock.py, a shared infrastructure helper with no triage or forge imports. The scope adapter only derives its key/cache path and translates FileLockError. Native independent-process scope exclusion, nested ownership and unenforced-filesystem refusal remain tested; no guard allowlist was weakened. Acceptance CLI added the two new infrastructure test refs to the existing replacement row.
  - kind: discovery
    id: p2-ci-fixes-red-green
    phase: 2
    title: CI regression follow-up is bounded and leaves full verification to ci-ok
    body: All four exact CI failures reproduced locally; the new shared-helper tests also failed RED before implementation. After fixes, affected skill/CLI/collector/lock/replacement/schema/managed/mirror checks passed 350 tests with 104 intentional skips. No local full suite, second worktree, cursor resolve, Ready transition or CI wait was attempted; evidence.tests remains ci for the existing draft PR 1115.
  - kind: discovery
    id: p2-ci-fixes-postcommit-evidence
    phase: 2
    title: Final CI-fix code tree passes targeted regressions and unchanged architecture guards
    body: |
      Code 40f5f300 was committed and pushed to the same draft before final checks; no code changed afterwards. Host log 1089-phase2-ci-fixes-final.log in the approved opencode temp directory ends exit=0: 369 passed, 104 intentional skips; ruff and format checks passed, mypy passed 306 source files. Coverage includes all four reported regression surfaces (the skill schema test now names current-schema semantics), separate schema-3 compatibility, native independent-process scope exclusion, nested/unverified shared locks, replacement checkpoints/repair, both mirror tripwires, skill line budgets, import direction and forge/subprocess guards. The original collector guard and its forbidden-import non-vacuity cases are unchanged. No local full suite was run, no subprocess/polling job remains, and the ci-ok full gate remains orchestrator-owned with evidence.tests ci.
