journal:
  - kind: discovery
    input: true
    id: brief
    title: Operator brief
    body: "I want to create new workflows that wrap Matt Pocock's skills in github mattpocock/skills."
  - kind: decision
    id: d1-wrap-depth
    title: Matt's flow owns the run, tracked by fr
    body: Steps mirror Matt's flow (grill-with-docs → to-spec → to-tickets → implement → pr → retro) rather than swapping disciplines into the fr-goal skeleton. Operator asked how superpowers is wrapped/installed; answered — a self-updating prerequisite named by fr skills and manifests, never installed or copied by super-fr.
  - kind: decision
    id: d2-source
    title: Prerequisite plus read-the-installed-SKILL.md
    body: Operator installs mattpocock-skills (self-updating); fr resolves each named skill's installed SKILL.md per harness and the agent reads the non-invocable ones. No vendoring, no install.sh wiring.
  - kind: decision
    id: d3-flows
    title: Main flow plus diagnosing-bugs
    body: Two shapes, pocock and pocock-bugs. triage, wayfinder, implement-spec deferred.
  - kind: decision
    id: d4-artifacts
    title: fr files are the record
    body: to-spec writes an fr spec (Matt's template + ## Requirements); to-tickets writes an fr plan folder, one phase per ticket, blocking edges → depends_on. No tracker publish, no .scratch/.
  - kind: decision
    id: d5-gates
    title: New workflows with Matt's own gates, fr-enforced
    body: Not fr-goal shapes. Matt's operator checkpoints (grill, to-spec seam check, to-tickets quiz, diagnosing-bugs no-loop stop, retro) become gate:operator steps; fr adds evidence/journal gates where needed.
  - kind: decision
    id: d6-entry
    title: Generic fr-flow driver plus fr-pocock / fr-pocock-bugs aliases
    body: Operator asked whether this exists; answered — the fr run verbs drive any shape, but no driver skill without fr-goal's contract exists. Build both.
  - kind: decision
    id: d7-verification
    title: candidate pre-merge, live row post-merge
    body: Candidate scenarios against a stub mattpocock-skills install; the real end-to-end flow is a post-merge live row.
