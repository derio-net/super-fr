journal:
  - kind: decision
    id: p2-reusable-workspace-takes-ahead
    phase: 2
    title: reusable_workspace takes the caller's ahead count instead of running git
    body: >-
      The spec gives `reusable_workspace(repo_root, branch, session_id)`. It now takes a
      keyword `ahead: int`: the command computes it with the new `Checkout.ahead` (the max
      of the local branch and `origin/<branch>` against `origin/<default>`), so
      `fr.isolation.adopt` runs no git and never imports `fr.triage.gitseam`, and the git
      read stays in the seam the spec names for it.
  - kind: decision
    id: p2-two-extra-seam-reads
    phase: 2
    title: adopt.workspace_path and Checkout.current_branch added beyond the plan's list
    body: >-
      The plan prints the workspace path before `--yes`, so `fr.isolation.adopt` gains
      `workspace_path(repo_root, branch)` (the recorded worktree, else
      `types.default_worktree_path`, which `local.py` now also uses), and
      `_ISOLATION_ALLOWED` admits it with the other three adopt imports. R7's first
      refusal names the branch the base clone is on, read by a new
      `Checkout.current_branch()` (None when detached), which phase 3's listing can reuse.
      Both have unit tests.
  - kind: discovery
    id: p2-default-refusal-test-retired
    phase: 2
    title: the old default-branch refusal test was removed and its matrix anchor re-pointed
    body: >-
      `test_triage_batch_adopt.py::test_the_default_branch_is_refused` pinned the
      behaviour R5 replaces. It is deleted; row `triage-batch-adopt-refusals` now cites
      `test_triage_batch_adopt_default.py#test_the_base_clone_is_left_untouched` (via
      `fr acceptance set-status --drop-level/--level`), and `fr acceptance check` passes.
