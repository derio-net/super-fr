  state: fixed
  body: "Fixed in spec \xA7B 'The isolation seam': a new fr/isolation/adopt.py owns every isolation call; _ISOLATION_ALLOWED grows by exactly its imports with the pinned allowance test updated in the same\
    \ diff; checkout facts become a Checkout classmethod (Checkout.facts) so the gitseam surface stays Checkout/Worktree/GitError."
- id: sr-f2
  state: fixed
  body: "Fixed in \xA7B: enter_workspace uses the same backend selection fr.run.workspace._select_target wraps and ALWAYS calls up() (documented resume), so a container that never started is started on\
    \ re-run; repo_root is main_worktree(); the R8 paragraph now names up's config writes."
- id: sr-f3
  state: fixed
  body: "Fixed in R6 and \xA7A: the default-branch message says publish only with `git push -u origin <new>`, never push <default>; pinned by the held-text test."
- id: sr-f4
  state: fixed
  body: "Fixed in R16 and \xA7D: parse_refs recognises owner/name#n, name#n (resolved to the agent's owner/name when names match, else unresolved `(?)`) and bare #n; resolve_ref specified."
- id: sr-f5
  state: fixed
  body: "Fixed in R17 and \xA7D: Checkout.facts returns the origin URL; make_client built per host inside each row's guard; any per-row git/client/forge failure degrades only that row."
- id: sr-f6
  state: fixed
  body: "Fixed in \xA7D: the pure helpers (parse_refs, resolve_ref, session_state) take plain values; the command unpacks the runner's object."
- id: sr-f7
  state: fixed
  body: 'Fixed in R12: ordered precedence with batch = label contains /run/batch- (adopt''s own test), unknown for unreadable default, a new `detached` state.'
- id: sr-f8
  state: fixed
  body: "Fixed in R15 and \xA7D: OPEN only, isCrossRepository false, newest first, looked up only for adoptable rows (never the default branch)."
- id: sr-f9
  state: fixed
  body: "Fixed in R10 and \xA7C: cwd from foreground_cwd else cwd; harness claude|opencode|hermes else None; the exact-equality herdr test is named as updated."
- id: sr-f10
