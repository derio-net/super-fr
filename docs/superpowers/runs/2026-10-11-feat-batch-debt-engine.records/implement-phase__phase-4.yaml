journal:
  - {kind: decision, id: p4-adapter-surface, phase: 4, title: "glab implements issue ops, create_pr, open_pr_for_head, edit_pr, viewer_login; tea only the issue ops and viewer_login", body: "R26 says an operation the forge has is implemented, else named unsupported. tea's draft PR support is unverified, so create_pr, open_pr_for_head and edit_pr stay UnsupportedForgeOperation on tea (archive-pr then warns and exits 0). Added beyond the spec list: edit_pr (needed to refresh the one draft PR), viewer_login on glab/tea (author trust), ListingCapped (no silent caps). The glab and tea commands are recorded-command doubles, not live captures; a live walk is owed."}
  - {kind: decision, id: p4-trust-model, phase: 4, title: "debt issue edits only issues authored by the viewer or the workflow bot; archive-pr reuses only an open same-repo PR", body: "A body marker alone selects nothing. Marker must be its own line, author in {viewer, github-actions[bot], github-actions, app/github-actions}; others are named in a ::warning:: and left alone. open_pr_for_head now returns same_repo (REST checks head.repo.full_name; glab compares source/target project ids); a fork PR on the same head name is never reused or edited. Identity comes from archive_followups.owed_identity (allow_nested for GitLab subgroups)."}
  - {kind: decision, id: p4-no-published-detail, phase: 4, title: "bodies carry fixed source categories only; all echoed forge text is redacted and control-stripped", body: "render.source_category maps each source to a fixed category (forge error, matrix unreadable, fetch failed, offline, tracking none, partial: listing cap reached); detailed reasons stay in the terminal. render.redact strips URL credentials, ghp_/gho_/github_pat_/glpat- tokens and home paths; debt_cmd._clean also removes control characters. A failed `fr archive` is published as fixed text, its stderr only in the job log."}
  - {kind: discovery, id: p4-refresh-ci-rewrites-whole-file, phase: 4, title: "--refresh-ci replaces an fr-scaffolded file wholesale", body: "Local edits to a recognised GitHub/Gitea file are overwritten (the command says to review the diff). This repo's own workflow, which installs fr from the checkout and pins actions by sha, was therefore edited by hand rather than refreshed."}
  - {kind: discovery, id: p4-push-refusal-warns, phase: 4, title: "a refused push of the sweep branch is a warning, exit 0, like a refused PR", body: "The weekly job must not go red for a token that may not push; both remedies are named in the ::warning::."}
  - {kind: finding, id: p4-ci1-shared-names, phase: 4, state: fixed, review_scope: in, title: "viewer_login, open_pr_for_head and the glab flag gate changed meaning for existing callers", body: "Implementing viewer_login on glab/tea broke triage's unsupported contract, and extending open_pr_for_head's dict broke the CI-evidence readers. Fixed with separate methods (authenticated_login, open_pr_in_repo) and the old ones restored; glab's check_argv now allows --source-branch/--target-branch and the boolean --draft/--yes, which its value-only allow-list would have refused live."}
  - {kind: finding, id: p4-ci2-coverage-tables, phase: 4, state: fixed, review_scope: in, title: "new public glab helper and client methods were missing from the host-trust coverage tables", body: "edit_issue added to test_glab's table and the new RealGlabClient methods to test_forge_host_trust's call list; the two-call close stays in the client so the one-host-per-helper table holds."}
  - {kind: finding, id: p4-ci3-stale-tests, phase: 4, state: fixed, review_scope: in, title: "own tests and the scaffold tests still asserted the old shapes", body: "debt-ops tests updated for author fields and open_pr_in_repo (and now run glab's argv through check_argv); test_acceptance_init asserts the fr debt steps; test_archive_owed sets a git identity via -c because CI has none."}
evidence: {tests: ci}
