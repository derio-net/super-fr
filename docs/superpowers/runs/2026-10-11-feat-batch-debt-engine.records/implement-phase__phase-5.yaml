  - {kind: finding, id: p5-f4-unbounded-figures-decode, title: "parse_figures decoded unbounded forge text", body: "parse_figures (the shared decoder) now refuses a body past 64 KiB or a base64 payload past 8 KiB before decoding, and a decoded value that is not a flat dict (one level of nested count dicts allowed) of ints and short strings.", phase: 5, review_scope: in, state: fixed}
