  body: 'Fixed in the spec: §D steps 1–2 and 5: MatrixV4 frozen/pinned, 3→4 `_is_v4` and output check
    moved to it, chain test from v1 with skipped rows.'
- id: sr1-migration-report-companions
  state: fixed
  body: 'Fixed in the spec: R6 + §D step 3: reports rendered in memory and written with the matrix.'
- id: sr1-effective-strategy-inputs
  state: fixed
  body: 'Fixed in the spec: R6 + §D step 4: the row''s own `verify` only via is_post_merge; StrategyError
    leaves the matrix byte-identical and reported.'
- id: sr1-owed-resolution-fold
  state: fixed
  body: 'Fixed in the spec: R20 + §E: fold distinguishes by target kind (open_finding_ids skips owed ids;
    open_owed_ids sibling); filed_as token on an open record validated by TRACKED_BY_RE; resolve accepts
    owed targets.'
- id: sr1-journal-resolve-syntax
  state: fixed
  body: 'Fixed in the spec: R24 uses the real flags with --note as the evidence; the ''only for owed''
    archived-lookup item dropped.'
- id: sr1-forge-parity
  state: fixed
  body: 'Fixed in the spec: New R26 + §B Adapters: edit_issue, list_open_issues_with_body, create_pr(draft),
    open_pr_for_head, close_issue on GhClient, RealGhRestClient, glab and tea — keeping the operator''s
    all-forges decision.'
- id: sr1-shallow-clone-staleness
  state: fixed
  body: 'Fixed in the spec: R13/§B fetch-depth: 0; §A merge age = last default-ref commit touching the
    plan dir; pr_for_branch gains updatedAt (R26).'
- id: sr1-read-only-exemption
  state: fixed
  body: 'Fixed in the spec: R25 + §A Exemption: the whole group is exempt and argued safe because archive-pr
    mutates only through a nested, independently gated `fr archive`; an unmigrated matrix reports the
    source unavailable (R4).'
- id: sr1-two-debt-definitions
  state: fixed
  body: 'Fixed in the spec: R1/R2: one DEBT_STATUSES in acceptance/model.py shared by open_rows, the nag,
    status, digest and the engine; digest renders the report''s Acceptance section.'
- id: sr1-owed-double-count
  state: fixed
  body: 'Fixed in the spec: R23 + §A Owed keys: one key per item, dedup by key, debt_total counts walk-owed
    rows under acceptance only and manual_open only through owed items.'
- id: sr1-sweep-bypasses-hold
  state: fixed
  body: 'Fixed in the spec: R19 holds every archive mode; §B step 2 skips held plans and lists them in
    the PR body; owed filing runs in the sweep per R21.'
- id: sr1-facts-schema-number
  state: fixed
  body: 'Fixed in the spec: §C: no facts bump (figures parsed from Issue.body at check/render); Snapshot
    1→2 reading 1; the one-time skipped-split trend is called out; AGENTS.md fix listed under Docs.'
- id: sr1-refresh-ci-gitlab
  state: fixed
  body: 'Fixed in the spec: R13 + §B: GitLab is recognised by its `acceptance-report:` job and refused
    with the exact job to paste.'
- id: sr1-test-plan-coverage
  state: fixed
  body: 'Fixed in the spec: New ## Testing section: per-group CI tests and candidate scenarios, including
    closeout-owed.sh (a skipped step is never silently dropped) and this repo''s own matrix migration.'
- id: sr1-test-plan-dispatch-path
  state: fixed
  body: 'Fixed in the spec: R13/§B: workflow_dispatch input `debt`; Test Plan step 1 uses it.'
- id: sr1-body-size-escaping
  state: fixed
  body: 'Fixed in the spec: R11 + §A render: base64 figures only (no free text), tables truncated at 50
