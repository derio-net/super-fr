schema_version: 8
run: 2026-10-11-feat-batch-debt-engine
step: spec-review
outcome: done
journal:
- kind: review
  id: spec-review-r1
  title: 'independent spec review: 21 findings'
  body: 'Checked all 14 operator decisions against R1–R25 and Design A–E; every named file/helper/constant/kind
    version under packages/fr/src/fr/; R1–R25 against Design and the Test Plan; artifact-versioning obligations
    for matrix 4→5, journal 1→2, triage facts and snapshot schemas.


    Findings: sr1-matrix-hop-live-parser, sr1-migration-report-companions, sr1-effective-strategy-inputs,
    sr1-owed-resolution-fold, sr1-journal-resolve-syntax, sr1-forge-parity, sr1-shallow-clone-staleness,
    sr1-read-only-exemption, sr1-two-debt-definitions, sr1-owed-double-count, sr1-sweep-bypasses-hold,
    sr1-facts-schema-number, sr1-refresh-ci-gitlab, sr1-test-plan-coverage, sr1-test-plan-dispatch-path,
    sr1-body-size-escaping, sr1-gh-actions-pr-permission, sr1-skipped-surfaces-missed, sr1-record-kind-impact,
    sr1-consumer-rollout-claim, sr1-outcome-decision-kind.


    No decision contradicted outright; owed-kind, archive-pr (all forges) and gate-reach were undermined
    by the design as written.'
- kind: finding
  id: sr1-matrix-hop-live-parser
  title: Matrix 3→4 hop validates with the live model, so the 4→5 status removal strands every v1–v3 matrix
    with skipped rows
  body: matrix_strategies.py:58-65 `_is_v4` and :90 use live parse_matrix; once `skipped` leaves Status
    a v3 matrix with skipped rows fails the 3→4 hop. Freeze MatrixV4 (superset v1–v4, StatusV4 incl skipped),
    move both checks to it, chain test from v1 with skipped rows.
  review_scope: in
- kind: finding
  id: sr1-migration-report-companions
  title: The 4→5 migration must regenerate the three committed reports as companions
  body: Statuses are rendered (report.py:200,263,313,359); after migrate the committed reports go stale
    and `fr acceptance check` fails. Render render_committed_set before writing, as matrix_anchors.py:113-124.
  review_scope: in
- kind: finding
  id: sr1-effective-strategy-inputs
  title: R6's 'effective strategy is post-merge' has no defined inputs inside a migration, and StrategyError
    is unhandled
  body: A migration has no run/shape default/single spec (effective.py:16-51, rows.py:78-97). Define the
    inputs and the unresolvable-name behaviour.
  review_scope: in
- kind: finding
  id: sr1-owed-resolution-fold
  title: Resolution records on owed entries are kind=finding, so filing an owed entry makes `fr journal
    check` fail
  body: journal/model.py:136-143,552-570,652-665; journal_cmd.py:445-450. The filed_as record (state=open)
    would make the owed id an open finding, contradicting decision owed-kind.
  review_scope: in
- kind: finding
  id: sr1-journal-resolve-syntax
  title: R24's `fr journal resolve <id> --evidence` does not match the real CLI, and the archived lookup
    already exists
  body: journal_cmd.py:349-372 takes --scope/--slug/--id/--state/--note; :397-407 already resolves archived
    journals.
  review_scope: in
- kind: finding
  id: sr1-forge-parity
  title: The forge adapters cannot do what R9/R12/R23 need on GitLab or Gitea, and no adapter can edit
    an issue title
  body: 'ghclient.py:87-461: no edit-title on any client; glab/tea raise UnsupportedForgeOperation for
    list_issues, create_pr, open_pr_for_head, pr_view.'
  review_scope: in
- kind: finding
  id: sr1-shallow-clone-staleness
  title: Staleness and merge age read git history CI does not have, and no source gives a merge date or
    PR updatedAt
  body: acceptance-report.yml checks out depth 1; MergeEvidence has no merge date (archive.py:150-172);
    pr_for_branch has no updatedAt (ghclient.py:352-359).
  review_scope: in
- kind: finding
  id: sr1-read-only-exemption
  title: READ_ONLY_COMMANDS cannot exempt `fr debt` but not its subcommands, and archive-pr does mutate
    artifacts
  body: trigger.py:231 matches the top-level subcommand only; archive-pr runs fr archive/commit/push.
  review_scope: in
- kind: finding
  id: sr1-two-debt-definitions
  title: The digest/status nag set and R2's debt set disagree on `failing`, against R1's one-engine rule
  body: acceptance_cmd.py:915-919 digest derives from open_rows, which would exclude failing.
  review_scope: in
- kind: finding
  id: sr1-owed-double-count
  title: One held manual phase or walk-owed row is counted up to four times in debt_total
  body: R3/R22/R23/R2 surface the same item in several sections.
  review_scope: in
- kind: finding
  id: sr1-sweep-bypasses-hold
  title: The archive-PR sweep runs `fr archive <plan-dir>`, which skips R19's Test Plan outcome hold
  body: archive_cmd.py:612-613 plan-dir mode vs :666-677 --branch path; decision gate-reach.
  review_scope: in
- kind: finding
  id: sr1-facts-schema-number
  title: The triage facts schema is 8, not 3; the snapshot schema change is also unaddressed
  body: triage/model.py:55-56 FACTS_SCHEMA 8, Issue.body :327; snapshot.py:59-65 closed Snapshot schema_version
    1.
  review_scope: in
- kind: finding
  id: sr1-refresh-ci-gitlab
  title: '`--refresh-ci` cannot recognise the GitLab scaffold, and rewriting `.gitlab-ci.yml` would clobber
    other jobs'
  body: 'scaffold.py:247-282: the GitLab template has no `name:` line and is the shared root file.'
  review_scope: in
- kind: finding
  id: sr1-test-plan-coverage
  title: No Test Plan or Verification entry covers R1–R25 before merge, including the brief's never-silently-dropped
    scenario
  body: Only two live rows were named; nothing traced the pre-merge proof of each group.
  review_scope: in
- kind: finding
  id: sr1-test-plan-dispatch-path
  title: Test Plan step 1 dispatches the workflow 'with the schedule path enabled', but nothing designs
    that path
  body: acceptance-report.yml debt step runs only on schedule.
  review_scope: in
- kind: finding
  id: sr1-body-size-escaping
  title: The embedded JSON report needs escaping and a size bound
  body: Free text containing `-->` breaks an HTML comment; GitHub bodies cap at 65,536 chars.
  review_scope: in
- kind: finding
  id: sr1-gh-actions-pr-permission
  title: The GITHUB_TOKEN fallback cannot open a PR unless 'Allow GitHub Actions to create … pull requests'
    is enabled
  body: Default-off repo/org setting refuses PR creation with the workflow token.
  review_scope: in
- kind: finding
  id: sr1-skipped-surfaces-missed
  title: R8's list misses several `skipped` surfaces, and §D does not design the refusal by name
  body: record/apply.py:780; acceptance_cmd.py:279; fr-execute SKILL.md:81; fr-progress SKILL.md:87; fr-acceptance-nag.sh:4;
    check_verify pattern model.py:167-176.
  review_scope: in
- kind: finding
  id: sr1-record-kind-impact
  title: The record kind is affected by the JournalKind and Status changes and is not addressed
  body: record/model.py:29,124 use live JournalKind; record/apply.py:675-683 checks live Status; record
    at 8.
  review_scope: in
- kind: finding
  id: sr1-consumer-rollout-claim
  title: '''Un-refreshed consumer workflows keep working'' is false once the matrix and journal kinds
    move'
  body: Consumers run fr acceptance check (not exempt) non-interactively; it refuses until migrated.
  review_scope: in
- kind: finding
  id: sr1-outcome-decision-kind
  title: Recording ran/n-a Test Plan outcomes as `decision` entries mixes them with the operator's brainstorm
    decisions
  body: Spec-journal decisions are the operator's Q&A answers.
  review_scope: in
resolves:
