    acceptance: "`fr triage batch drive --once --yes` whose pass would dispatch refuses (exit 2) before acting and prints the looping command with the caller's arguments, unless --single-pass is given, which acts and ends with that warning; dry runs and non-dispatching passes are unchanged."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-driver-resilience-design.md#R1"]
    status: not-implemented
    verify: none
  - id: driver-unreadable-visibility-retries
    capability: triage-batch-drive
    acceptance: "A looping driver that cannot read its state repo's visibility skips the pass (nothing pushed), warns once and retries after --interval instead of exiting; --once and the cloud pass still refuse, and a public state repo with a private member is still refused."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-driver-resilience-design.md#R8"]
    status: not-implemented
    verify: none
  - id: rest-rulesets-free-plan-403
    capability: triage-batch-drive
    acceptance: "Under the REST forge, a private repo on GitHub's free plan (rulesets endpoint 403 with the plan-upgrade notice) yields its classic-protection required checks and the drive pass proceeds; any other 403 still fails the read."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-driver-resilience-design.md#R12"]
    status: not-implemented
    verify: none
