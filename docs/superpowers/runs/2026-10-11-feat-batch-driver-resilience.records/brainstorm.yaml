journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: "Batch driver-resilience brief (super-fr#1127, #1134, #1135), verbatim"
    body: |
      /fr-goal Drive loop resilience: no silent single pass, retry transient visibility reads, REST free-plan 403

      Batch `driver-resilience` of derio-net/super-fr: 3 issues, delivered as ONE pull request.

      ## super-fr#1127: drive: refuse --once --yes that dispatches when no looping driver is running
      Observed in this scope on 2026-10-10: two `drive --once --yes` passes dispatched wave 1 and left nothing driving (no merges, stale board) until the loop was started by hand.

      ## super-fr#1134: drive: a transient failure reading the state repo's visibility ends a looping driver (should skip the pass and retry)
      Filed from this scope. `privacy.unreadable()` (`fr/triage/privacy.py:50`) raises on a transient rate-limit read, which ends a looping driver instead of skipping the pass.

      ## super-fr#1135: REST forge: the rulesets endpoint's free-plan 403 on a private repo makes every drive pass fail
      Filed from this scope. `required_check_names` (`fr/real_ghrestclient.py:731`) reads `rules/branches/{b}` unconditionally; the free-plan 403 on a private repo fails every REST drive pass.

      ## Why these belong together
      All three stopped or stalled this scope's wave-1 driver on 2026-10-10.

      ## Delivery rules
      - Work on branch `feat/batch-driver-resilience`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#1127
        Closes derio-net/super-fr#1134
        Closes derio-net/super-fr#1135
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.
  - kind: decision
    id: visibility-no-cache
    title: "#1134: no visibility cache; cloud-triage R8's live read stands"
    body: "Operator chose no cache (recommended). Caching a 'private' answer is the leak direction; skip-and-retry alone fixes the exit, at ~2 REST reads per pass."
  - kind: decision
    id: visibility-skip-any-unreadable
    title: "#1134: loop mode skips the pass on ANY unreadable state-repo visibility"
    body: "Operator chose any cause (recommended) over classifying transient errors. Still fail-closed: nothing is written or pushed. --once, plan mode and the cloud pass keep exit 2."
  - kind: decision
    id: rulesets-403-silent
    title: "#1135: the free-plan rulesets 403 is treated as no rulesets, silently"
    body: "Operator chose silent (recommended): it is a definitive answer, not a degraded read."
  - kind: decision
    id: verification-unit-only
    title: "Verification: unit tests only, rows verify: none, no walk"
    body: "Operator chose unit tests only (recommended). The forge conditions (rate limit, free-plan 403) cannot be produced on demand; fakes are the proof."
  - kind: discovery
    id: once-already-sole-driver
    title: "#1127's 'no looping driver' condition is implied by drive_lock + the lease"
    body: "batch_drive_command takes drive_lock for --once too, and --yes takes the state-ref lease; both refuse a second driver. So a --once --yes pass that reaches its plan is the scope's only driver on this host/lease, and the guard reduces to 'the plan holds a dispatch'."
