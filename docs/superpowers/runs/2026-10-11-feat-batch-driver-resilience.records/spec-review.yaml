schema_version: 8
run: 2026-10-11-feat-batch-driver-resilience
step: spec-review
outcome: done
journal:
  - kind: finding
    id: sr-1
    review_scope: in
    title: "Loop-mode skip after a failed save_pass bypasses restart_to, so the next pass runs on stale code (gh#998)"
    body: "_host_loop's ForgeReadError branch sleeps and continues before the restart_to check; a skipped save_pass after a post_merge that reinstalled fr would run another pass on old code. The spec must return restart_to there, and a test must pin it."
  - kind: finding
    id: sr-2
    review_scope: in
    title: "R9 says plan mode 'keeps refusing' on unreadable visibility, but plan mode never reads it"
    body: "Without --yes there is no lease, take_lease returns early and save_pass never runs, so no guard_state call happens. The requirement is vacuous and untestable."
  - kind: finding
    id: sr-3
    review_scope: in
    title: "--single-pass warning keyed on 'plan holds a dispatch' (R4) vs 'the pass dispatched' (Design); driver state not named"
    body: "A planned dispatch may not start (held claim, preflight refusal, RunnerDispatchError). Pick one condition, and name the build_driver parameter and the memo so 'cloud pass unaffected by construction' can be checked."
  - kind: finding
    id: sr-4
    review_scope: in
    title: "R1 breaks existing --once --yes tests whose plan dispatches; the spec does not say they gain --single-pass"
    body: "Many host tests drive a dispatching --once --yes pass (test_triage_batch_drive_cmd.py and siblings); after R1 they exit 2 unless they pass --single-pass."
  - kind: finding
    id: sr-5
    review_scope: in
    title: "The printed loop command does not pin a single-repo scope's defaulted checkout"
    body: "With no --checkout, a single-repo scope defaults to the cwd's toplevel; a pasted command in another pane would drive a different clone."
  - kind: finding
    id: sr-6
    review_scope: out
    title: "A transient failure reading a member repo's visibility (public state repo) is reported as a leak and still ends a looping driver"
    body: "guard_state's _fill turns a failed member-repo read into None, which counts as not public and raises the plain leak refusal. Pre-existing; R8 and the operator decision are scoped to the state repo's own visibility."
  - kind: review
    id: spec-review-1
    title: "independent spec review: 6 findings (5 in, 1 out)"
    body: "fr-spec-reviewer checked the spec against the four operator decisions (all honoured) and the codebase: build_driver/_Driver callers, ForgeReadError exit codes under --once and the cloud pass, check_or_refuse reachability (inert in the driver), the GhError 403 text (gh.py:194-204), and lease release before _fail (no conflict). Findings sr-1..sr-5 in scope, sr-6 out of scope."
resolves:
  - {id: sr-1, state: fixed, body: "R8 and §B now say: _host_loop's ForgeReadError branch returns driver.restart_to when it is set, instead of sleeping."}
  - {id: sr-2, state: fixed, body: "R9 drops plan mode and states that it never reads the visibility; the §B bullet now names --once only."}
  - {id: sr-3, state: fixed, body: "Both R1 and R4 key on the plan holding a dispatch. Named: build_driver(single_pass: SinglePass(notice, allowed)) and _Driver.planned_dispatch; the cloud pass never passes it."}
  - {id: sr-4, state: fixed, body: "§A now states that the existing dispatching --once --yes host tests add --single-pass, and that non-dispatching tests stay as they are and pin R5."}
  - {id: sr-5, state: fixed, body: "R3 and §A print a single-repo scope's defaulted checkout explicitly as --checkout OWNER/REPO=<abs toplevel>, taken from _checkout_map."}
  - {id: sr-6, state: out-of-scope, body: "Not caused by this change: the member-repo live read and its leak-refusal wording predate it, and the operator scoped #1134 to the state repo's own visibility. To file as its own issue."}
acceptance: []
evidence: {review: spec-review-1, reviewer: a5e03b94c055afaf9}
