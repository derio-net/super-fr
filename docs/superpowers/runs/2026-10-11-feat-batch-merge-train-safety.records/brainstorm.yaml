journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Operator brief (batch merge-train-safety dispatch), verbatim
    body: |
      /fr-goal Merge train safety: required checks or a merge queue on main, recover red updated PRs

      Batch `merge-train-safety` of derio-net/super-fr: 4 issues, delivered as ONE pull request.

      ## super-fr#1062: Merge race: require up-to-date/merge queue on main, release bot bypass via app token, driver enqueues where a merge queue is required
      Confirmed: the only ruleset on main (`protect main`) enforces deletion + non_fast_forward; no required checks, no up-to-date rule, no merge queue. Two green PRs merged back to back broke main and a release on 2026-10-07.

      ## super-fr#1082: Driver: recover a batch PR that goes red after the train updates it (re-update on main moving, else hand back to the session)
      A batch PR the train updated from a broken main stays red forever. Held by scope `s-c8805331` (its driver stopped refreshing 2026-10-09 ~20:05 UTC; operator released these to this scope 2026-10-10) (batch `merge-train-recovery`).

      ## super-fr#1076: batch merge with no ids refuses every queued batch when one is held
      Confirmed: `triage_batch_cmd.py:2184-2185` calls `_refuse_held` per queued batch before merging any, so one held batch refuses the whole default merge. Spec question whether to skip instead.

      ## super-fr#1129: Merge gate: draft→ready is the only human gate and agents share the operator's forge identity (driver merged a ~5,000-line PR unreviewed)
      Confirmed at 1248d439: the batch dispatch brief (`batch_dispatch.py:143`) has no never-mark-ready rule, and `merge_ready` (now `batch_merge.py:387`, issue cites batch_drive.py:1055) merges any non-draft, green PR by an allowed author. One shared forge identity means an agent's `gh pr ready` is the operator's, so the driver merged ~5,000 lines unreviewed.
      Note: Live risk for every running wave: the driver merges whatever a session readies.

      ## Why these belong together
      Two green PRs broke main and a release; the train cannot recover a PR it updated from broken main. Taken over from the inactive scope s-c8805331 at the operator's request, 2026-10-10.

      ## Delivery rules
      - Work on branch `feat/batch-merge-train-safety`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#1062
        Closes derio-net/super-fr#1082
        Closes derio-net/super-fr#1076
        Closes derio-net/super-fr#1129
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.
  - kind: decision
    id: d1-main-protection
    title: super-fr main requires ci-ok + up-to-date (no merge queue)
    body: "Operator (R1·Q1): required `ci-ok` with branches up to date; merge_group triggers added anyway so a queue can be enabled later."
  - kind: decision
    id: d2-agent-applies-forge
    title: The agent applies the forge changes via gh api
    body: "Operator (R1·Q2): agent applies the ruleset/variable changes post-merge; (R2·Q5) operator generates the App key in the UI and sets FR_AUTOMATION_APP_KEY, agent wires the rest, enabling the rule only after a release pushed as the app."
  - kind: decision
    id: d3-driver-queue-now
    title: Build the driver's merge-queue path in this change
    body: "Operator (R1·Q3): detect merge_queue rule, enqueue, tolerate queued PRs, ejection → recovery; opt-in by detection; GitHub only."
  - kind: decision
    id: d4-label-gate
    title: The merge gate is an approved-fr repo label, not a signed approval
    body: "Operator (R1·Q4–Q6): a green `approved-fr` label, created transparently with a warning; signed approvals are a placeholder, not built; 'we need a proper design but … late for a redesign' — the label is the stop-gap."
  - kind: decision
    id: d5-no-bash-guard
    title: No Bash guard for ready/merge
    body: "Operator (R1·Q7): gating on approved-fr is enough; agents may legitimately merge or mark ready. Briefs say never add approved-fr."
  - kind: decision
    id: d6-skip-held
    title: Default batch merge skips held batches
    body: "Operator (R1·Q8): skip held, merge the rest; explicit ids still refuse."
  - kind: decision
    id: d7-verification
    title: candidate strategy plus live post-merge rows
    body: "Operator (R1·Q9): candidate walk over fake-forge scenarios; ruleset/release-identity rows are live post-merge."
  - kind: decision
    id: d8-label-head-bound
    title: The approval is bound to a head; driver updates are exempt
    body: "Operator (R2·Q1): first sighting records the approved head; a non-driver push voids it (label removed, re-label on Needs-you)."
  - kind: decision
    id: d9-label-create-where
    title: fr init scaffold and triage commands create the label
    body: "Operator (R2·Q2): collect, batch dispatch, batch merge, drive, fr init scaffold; no other fr command calls the forge for it."
  - kind: decision
    id: d10-label-alone
    title: The label alone suffices; the driver readies a labelled draft
    body: "Operator (R2·Q3): a green labelled draft is marked ready by fr and merged."
  - kind: decision
    id: d11-every-fr-merge-path
    title: The label gate applies to every fr merge path
    body: "Operator (R2·Q4): driver, batch merge (with or without ids), and the queue enqueue."
acceptance:
  - id: merge-train-label-gate
    capability: triage-batch-merge
    acceptance: "fr merges a batch PR only with a valid approved-fr label bound to its head: an unlabelled green PR is held naming the label, a labelled green draft is readied and merged, a session push after labelling voids the approval and removes the label, and the driver's own update-from-base keeps it."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R1"]
    status: not-implemented
    verify: candidate
  - id: approval-label-created
    capability: triage-batch-merge
    acceptance: "fr init scaffold and the triage commands that touch a repo's PRs create the approved-fr label when it is missing, warning once, and never fail on a forge that cannot."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R4"]
    status: not-implemented
    verify: candidate
  - id: approval-board-and-briefs
    capability: triage-board
    acceptance: "The board asks the operator to label (or re-label) a green unapproved batch PR, and no brief, skill, agent or rule fr ships tells a session to add the approved-fr label."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R5"]
    status: not-implemented
    verify: candidate
  - id: merge-train-red-recovery
    capability: triage-batch-drive
    acceptance: "A batch PR made red by the driver's own update is updated again once the base moves; a PR red at a session commit is handed back to an idle session once per head; repeated passes over the same red head send nothing new; an unreachable session puts it on Needs-you."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R9"]
    status: not-implemented
    verify: candidate
  - id: merge-train-queue
    capability: triage-batch-drive
    acceptance: "Where the base branch requires a merge queue, the driver enqueues approved green batch PRs instead of merging, treats queued PRs as in flight, and re-enqueues or hands back an ejected PR; a repo with no queue keeps its train unchanged."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R12"]
    status: not-implemented
    verify: candidate
  - id: batch-merge-skip-held
    capability: triage-batch-merge
    acceptance: "fr triage batch merge with no ids skips batches another scope holds, naming each, and merges the rest; naming a held batch still refuses."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R7"]
    status: not-implemented
    verify: candidate
  - id: ci-merge-group-trigger
    capability: ci
    acceptance: "super-fr's CI and acceptance workflows report ci-ok for a merge queue's merge group."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R14"]
    status: not-implemented
    verify: none
  - id: release-pushes-as-app
    capability: release
    acceptance: "With the app configured, super-fr's release commit and tag are pushed as derio-fr-automation, CI runs on the release commit, and the follow-up release run is a no-op."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R15"]
    status: not-implemented
    verify: live
  - id: main-requires-ci-ok
    capability: release
    acceptance: "super-fr's main requires ci-ok with up-to-date branches, blocks a behind PR until it is updated, and still accepts the release bot's push through its bypass."
    origin: ["super-fr:docs/superpowers/specs/2026-10-11-merge-train-safety-design.md#R17"]
    status: not-implemented
    verify: live
