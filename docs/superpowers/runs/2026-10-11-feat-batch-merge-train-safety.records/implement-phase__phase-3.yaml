journal:
  - {kind: decision, id: p3-queue-reads-in-snapshot, phase: 3, title: "Queue state and the base are read in the driver's snapshot, and only for batches already enqueued", body: "Snapshot gains queue_repos, queue_versioned, queue_rest, queue_states and bases. _Driver._queue_reads asks base_rules once per repo per pass (the cache merge_ctx also uses), then pr_queue_state and the fetched base only for a batch with an EnqueueEvent. An unreadable base leaves the repo's states out, so the walk decides nothing rather than guessing an ejection."}
  - {kind: decision, id: p3-queue-walk-branch, phase: 3, title: "Queue mode is a separate _walk_queue; _walk_train only branches at its entry", body: "The merge train's loop is renamed _walk_merge_train and untouched, so a repo with no queue keeps its train byte for byte. A queue Train has no head or candidates; it carries enqueue and in_merge_queue, and train_line prints them."}
  - {kind: decision, id: p3-queue-ejected-need-live-only, phase: 3, title: "The queue-ejected Need comes from a driver pass, not the facts-only board", body: "The ejection is a warn action with ejected=True (dedup key per head in Snapshot.warned); views.queue_needs turns it into the queue-ejected Need. The board and drive --plan read no forge, so they leave queue_repos empty and show the ordinary train; the driver prints the line. Likewise a card reads 'in merge queue' only from a plan built with queue state."}
  - {kind: discovery, id: p3-once-warn-dedup-per-process, phase: 3, title: "A warn dedup in Snapshot.warned lasts one driver process, so two --once passes each say the ejection", body: "self.warned is per driver object, as for red-CI warns, so the scenario-level test asserts the line once and the pure walk test pins the per-head dedup."}
  - {kind: discovery, id: p3-merge-queue-rule-not-captured, phase: 3, title: "The merge_queue rule shape in the fake gh is documented, not captured", body: "The repo's ruleset has no merge queue, so the fake adds a rule in the captured rules' key shape with the documented merge_queue parameters, stated in its docstring. The GraphQL isInMergeQueue/autoMergeRequest answers in the unit tests are likewise the documented pullRequest shape."}
  - {kind: discovery, id: p3-queue-read-needs-origin-head, phase: 3, title: "CI red: _queue_reads resolved the default branch through origin/HEAD for every repo with an open PR", body: "The cloud driver's clone has no origin/HEAD, so gitseam.default_branch raised inside the per-pass queue read even for draft or failing PRs with nothing to merge or enqueue (the version-drift scenario passed locally, where origin/HEAD happens to be set). Fixed: rules are read only for a repo with an open, non-failing PR (or one enqueued before), and a GitError/TriageError from the default branch reads as no queue. A unit test pins both."}
