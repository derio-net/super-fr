resolves:
- id: sr-r1-1
  state: fixed
  body: Shared _approved_and_ready gate called by merge_ready and merge_one; batch merge filters unapproved
    before the plan prints, ids path exits 2; labels read live via pr_view (§A Merging).
- id: sr-r1-2
  state: fixed
  body: The walk admits a draft whose verdict is Approved/First; unapproved members go to Train.awaiting
    (§A The walk).
- id: sr-r1-3
  state: fixed
  body: settle_approvals runs every pass for every open batch PR whatever its checks, records First and
    executes Void with label removal; batch merge only under --yes; the residual one-pass window is stated
    in Out of scope.
- id: sr-r1-4
  state: fixed
  body: Decision moved into the command beside _conflict (pure red_decision, impure inputs); target =
    _hand_back's target; separate RED_HANDBACKS_PER_DISPATCH = 2; absent/done → Needs-you, with the reason
    (§C).
- id: sr-r1-5
  state: fixed
  body: needs_you suppresses failing-ci under a delivered red hand-back at the current head; red-pr raised
    from delivered:none; NEED_LABELS gains approve-pr, red-pr, queue-ejected.
- id: sr-r1-6
  state: fixed
  body: New R14 + base_rules.strict_checks (rulesets and classic protection); _land skips _behind_only_routinely
    when strict; new row merge-train-strict-up-to-date.
- id: sr-r1-7
  state: fixed
  body: The check reads the push-event Actions run on the release sha and its triggering_actor (a GITHUB_TOKEN
    push triggers none); Test Plan step 3 corrected.
- id: sr-r1-8
  state: fixed
  body: enqueue is a new ActionKind with a phrase; approval/void is the impure settle step, not an action;
    awaiting approval and in merge queue come from Train.awaiting / Train.in_merge_queue.
- id: sr-r1-9
  state: fixed
  body: MergeContext.on_update callback; base = rev_parse(ctx.main) via a new CheckoutSeam.rev_parse;
