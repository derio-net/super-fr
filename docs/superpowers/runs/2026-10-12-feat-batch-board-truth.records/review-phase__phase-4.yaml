- kind: review
  id: p4-review-1
  phase: 4
  title: Phase 4 code review
  body: 'Dispatched read-only reviewer over e0bcdfbb..cfd50dc9, which rendered org and single-repo state dirs itself and screenshotted them (true 390px via iframe for phone width), raised p4-r1..p4-r9. r1-r7 and r9 (reclassified in: banner added by this PR) fixed in aa5cdccd; r8 out of scope (screenshot artifact). nav-link-each-tab verified from markup: every relative href on all 8 pages resolves to an existing file, one aria-current per page, re-rendering the board left sibling mtimes unchanged.'
resolves:
- id: p4-r1
  state: fixed
  body: All four use write_text_atomic. Tests test_a_render_writes_its_own_page_atomically, test_origins_render_writes_its_page_atomically, test_architecture_render_writes_its_page_atomically.
- id: p4-r2
  state: fixed
  body: Re-read just before writing; skip when changed; docstring documents it. Test test_a_page_changed_between_read_and_write_is_not_overwritten.
- id: p4-r3
  state: fixed
  body: warn_nav says each (page, cause) once per process. Test test_the_no_nav_warning_is_said_once_across_passes.
- id: p4-r4
  state: fixed
  body: Per-page OSError/UnicodeDecodeError caught and warned. Tests test_a_failed_nav_write_warns_naming_the_page_and_never_raises, test_a_render_still_stores_its_snapshot_when_a_nav_cannot_be_written.
- id: p4-r5
  state: fixed
  body: SKILL.md documents the nav-less temp copy that exists only while the command runs; cwd still the state dir. Test test_the_publish_copy_is_gone_once_the_command_returns pins the lifetime.
- id: p4-r6
  state: fixed
  body: '''Open the Batches page'' and ''the Backlog page shows them''. Test test_the_backlog_names_the_batches_page_not_the_board.'
- id: p4-r7
  state: fixed
  body: test_a_page_with_two_nav_blocks_is_treated_alike_by_refresh_and_strip (replace-all and strip-all), test_origins_render_refreshes_the_nav_of_a_sibling_page, test_architecture_render_refreshes_the_nav_of_a_sibling_page, test_the_publish_copy_is_gone_once_the_command_returns.
- id: p4-r8
  state: out-of-scope
  body: 'Not a defect: verified no horizontal scroll at a true 390px; pre-existing board CSS collapses to one column at <=720px.'
- id: p4-r9
  state: fixed
  body: Banner reads 'This page is not the whole truth.'; asserted in test_triage_config_skew.py::test_the_banner_names_ignored_keys_and_skipped_repos_escaped.
