schema_version: 8
run: 2026-10-12-feat-batch-board-truth
step: spec-review
outcome: done
journal:
- kind: finding
  id: spec-r1
  title: "\xA7C/R5: ignored config keys live only in CollectStats, not facts.json"
  body: CollectStats.ignored (collect.py:425-436) is transient; Facts (model.py:520-552) has no field and only facts.to_json() is written (triage_cmd.py:475-477), so skew_banner(facts) and check's config_ignored had nothing to read.
  review_scope: in
- kind: finding
  id: spec-r2
  title: "\xA7C: check JSON has no existing skipped list"
  body: CheckResult.to_json (check.py:188-252) has no skipped key; skipped repos are only printed by collect's _report (triage_cmd.py:378-383).
  review_scope: in
- kind: finding
  id: spec-r3
  title: "\xA7A/R1: batch= guard does not separate releasing-batch from bare own-claim releases"
  body: Every claim_sync release passes batch=op.batch (claim_sync.py:191-199), including own-claim releases for members dropped by batch edit --remove-issue (claims.py:361-364); only cancel unlabels (triage_batch_cmd.py:833).
  review_scope: in
- kind: finding
  id: spec-r4
  title: "\xA7A: claim release and scope retire call release without batch="
  body: triage_claim_cmd.py:308-318 and :376-385 pass no batch; the spec listed claim release as covered and batch merge as a release path, which it is not.
  review_scope: in
- kind: finding
  id: spec-r5
  title: "\xA7A: _remove_label's re-read restores only fr:claimed"
  body: claim_writes.py:67-73 re-adds only FR_CLAIMED after a foreign claim appears; a combined edit could strip a foreign fr:in-progress.
  review_scope: in
- kind: finding
  id: spec-r6
  title: "R2/\xA7B: held defined as fr:claimed present misreports this scope's own pending release"
  body: A closed issue's fr:claimed is often this scope's own claim awaiting release; collect reads no closed issue comments (collect.py:739-745).
  review_scope: in
- kind: finding
  id: spec-r7
  title: "\xA7B: clean-labels acts on cached facts without a re-read"
  body: Facts are always older than the verb's start; a reopened or newly claimed target could lose a live label. claim_writes convention re-reads before writing.
  review_scope: in
- kind: finding
  id: spec-r8
  title: "\xA7B: failure and truncation of the extra closed-issue call unspecified"
  body: 'Inside the per-repo try (collect.py:539-558) a diagnostic read failure would skip the whole repo, which is #1109''s failure; no truncation warning was specified.'
  review_scope: in
- kind: finding
  id: spec-r9
  title: R9 presence rules contradict R11's never-link-absent rule
  body: batches-without-board.html, origins-facts-without-origins.html and History-always would link missing pages.
  review_scope: in
- kind: finding
  id: spec-r10
  title: "\xA7F: current page must count as present on first render; pages_present must not need judgements"
  body: architecture/origins compute keys before writing (triage_architecture_cmd.py:113-124, triage_origins_cmd.py:185-186); origins may render with judgements None.
  review_scope: in
- kind: finding
  id: spec-r11
  title: "\xA7F: nav rewrite must be atomic and skip identical navs"
  body: Driver pass and kanban --watch render every interval (triage_batch_cmd.py:3672-3676, triage_kanban_cmd.py:430-469); pages are written with plain write_text.
  review_scope: in
- kind: finding
  id: spec-r12
  title: "\xA7F/R10: published board.html would carry relative nav links that 404"
  body: publish_board publishes board.html alone (scope_config.py:182-203).
  review_scope: in
- kind: finding
  id: spec-r13
  title: R6 says known, but show_closeout_jump is true for unknown
  body: kanban.py:419-421,456.
  review_scope: in
- kind: finding
  id: spec-r14
  title: Decision q3 'everywhere' vs collect-only; dispatch still strict
  body: _fresh_config(lenient=False) (triage_batch_cmd.py:963-1002), batch_dispatch.py:238-253.
  review_scope: in
- kind: finding
  id: spec-r15
  title: "\xA7C names collect_facts; lenient lives on collect_facts_counted and collect_into"
  body: collect.py:486-499, triage_cmd.py:428,472, driver call triage_batch_cmd.py:2390.
  review_scope: in
- kind: finding
  id: spec-r16
  title: "\xA7B: label filter crosses GhClient protocol and every adapter; closedAt not in ISSUE_LIST_FIELDS"
  body: ghclient.py:315-319,449; gh.py:485-511; real_ghrestclient.py:606-614.
  review_scope: in
- kind: finding
  id: spec-r17
  title: 'R12: fr-triage SKILL.md is at the 120-line cap; mirrors need regenerating'
  body: SKILL.md is 120 lines; sync-opencode.py and sync-hermes.py.
  review_scope: in
- kind: finding
  id: spec-r18
  title: Background line references drifted by a few lines
  body: collect.py:541, kanban_render.py:290-317, collect.py:552-557, components.py:49-64.
  review_scope: out
- kind: review
  id: spec-review-1
  title: Spec review of 2026-10-12-board-truth
  body: '18 findings raised by fr-spec-reviewer: spec-r1..spec-r17 in scope (all fixed in the spec), spec-r18 out of scope (cosmetic line drift).'
resolves:
