  state: fixed
  body: "Added Facts.config_ignored (schema 9) written by collect; \xA7B lists it, \xA7C writes it."
- id: spec-r2
  state: fixed
  body: "check JSON gains skipped and config_ignored (and closed_in_progress) with matching text sections (\xA7B, R5)."
- id: spec-r3
  state: fixed
  body: "release gains unlabel=; claim_sync.execute passes unlabel=True on every release (all are claims no live batch owes, incl. removed members); R1 and \xA7A rewritten, cancel sentence corrected."
- id: spec-r4
  state: fixed
  body: "R1/\xA7A now state claim release and scope retire keep unlabel=False, leaving closed ones to R2/R3 and open ones to the stale-dispatch set; batch merge claim removed."
- id: spec-r5
  state: fixed
  body: "\xA7A: the re-read restores every label it removed when a foreign claim appeared."
- id: spec-r6
  state: fixed
  body: "R2/\xA7B: three states stale | release-pending | held, decided by reading comments of closed hits carrying fr:claimed."
- id: spec-r7
  state: fixed
  body: "R3/\xA7B: clean-labels re-reads each target before writing and skips reopened or newly claimed ones; vacuous freshness warning dropped."
- id: spec-r8
  state: fixed
  body: "\xA7B: the closed-issue list is best-effort outside the skip try (warning + empty set) with a Truncation warning at the limit."
- id: spec-r9
  state: fixed
  body: 'R9 now: present = file exists, or the page being rendered now; no other rule.'
- id: spec-r10
  state: fixed
  body: "\xA7F: pages_present(state_dir, current) always includes current and needs no judgements."
- id: spec-r11
  state: fixed
  body: "R11/\xA7F: rewrite via write_text_atomic, skipped when the nav already matches."
- id: spec-r12
  state: fixed
  body: "R10/\xA7F: the publish step hands a temp copy of board.html with the nav stripped."
- id: spec-r13
  state: fixed
  body: "R6/\xA7D: the front follows the close-out only when its status is set and not absent/unknown, narrower than show_closeout_jump."
- id: spec-r14
  state: fixed
  body: "R4/\xA7C extended to every triage config read: _fresh_config and batch_dispatch default to lenient (the operator's chosen option said every collect; dispatch reads the same file and the same skew refuses it, so lenient there is in the decision's spirit)."
- id: spec-r15
  state: fixed
  body: "\xA7C names collect_facts_counted, collect_into and the driver call site."
- id: spec-r16
  state: fixed
  body: "\xA7B lists the full chain and the closedAt field via ORIGINS_ISSUE_LIST_FIELDS."
- id: spec-r17
  state: fixed
  body: R12 states the 120-line cap and both mirror syncs.
- id: spec-r18
  state: out-of-scope
  body: Cosmetic line-number drift in Background; the code cited is right. The rewritten Background already uses the corrected numbers, but the finding asks for no design change.
evidence:
