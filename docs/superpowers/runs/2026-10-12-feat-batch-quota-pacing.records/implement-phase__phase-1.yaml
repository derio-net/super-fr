journal:
  - kind: decision
    id: p1-pacing-loop-only
    title: Pacing applies to a looping drive and the cloud pass, not --once or plan mode
    body: "`--once` and a plan-only run keep today's behaviour (a rate limit exits with the read error's code); a loop waits, and the cloud pass exits 3. `essential` (below the floor) is decided by `quota.decide` but the loops ignore it until phase 2 builds the essential-only pass, so the quota line never claims a pass that does not exist."
    phase: 1
  - kind: discovery
    id: p1-stale-exhausted-reading
    title: An exhausted /rate_limit reading whose reset has passed must not be waited on
    body: "A wait whose end is already past sleeps 0 s, and the loop would re-read and re-run forever, spending the budget it was meant to spare (found by a test whose clock was the real one). `decide` runs the pass, and `after_rate_limit` backs off as a secondary limit, when the reading's reset plus 30 s is not ahead of now."
    phase: 1
  - kind: discovery
    id: p1-collect-fakes-returned-none
    title: Three existing tests faked collect_into with None for the facts
    body: "recollect now reads facts.skipped and facts.unviewed (R2), so the fakes in test_triage_batch_drive_cmd and test_triage_batch_drive_disruption return the world's facts, as the real function does."
    phase: 1
