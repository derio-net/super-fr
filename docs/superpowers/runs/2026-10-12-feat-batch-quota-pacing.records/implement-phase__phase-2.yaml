journal:
  - kind: discovery
    id: p2-visibility-never-carried
    phase: 2
    title: A partial collect must not carry a repo's visibility (orchestrator correction to R10)
    body: >-
      The privacy guard (fr/triage/privacy.py) trusts facts.visibility and reads a missing
      repo live. A carried, stale "public" would let a repo made private since the last full
      pass pass the leak check for up to 15 minutes. Carried repos are left out of
      facts.visibility; read repos get it exactly as before. Test
      test_a_carried_repo_s_visibility_is_left_out_for_the_guard_to_read_live.
  - kind: discovery
    id: p2-conftest-circular-import
    phase: 2
    title: Phase 1's autouse rate-limit stub errored any test file that never imported the CLI
    body: >-
      tests/conftest.py's stub imports fr.commands.triage_batch_cmd directly, which on its
      own is a circular import (triage_kanban_cmd <-> triage_claim_cmd); test_real_ghclient.py
      alone errored on every test. The fixture now imports fr.cli first. Masked in the full suite.
  - kind: decision
    id: p2-probes-in-run-pass
    phase: 2
    title: Probes run in the drive's run_pass; collect_into owns the facts-then-pacing order
    body: >-
      The pass kind must be known before any collect (a quiet pass collects nothing), so
      the probes run in _Driver._pass_plan through a _probe_forge seam. collect_into takes
      only= and an after_write callback invoked once facts.json is written, in which the
      Pacer promotes pending ETags; the ordering guarantee lives in collect_into. Unpaced
      (--once, plan mode, fr triage collect) passes no new arguments at all.
  - kind: decision
    id: p2-quiet-needs-recorded-summary
    phase: 2
    title: pacing.json records the last planned pass's summary, and a quiet pass reports it
    body: >-
      A quiet pass plans nothing, yet the loop and the cloud exit code read a Summary. The
      planned pass stores its summary counts in pacing.json (new optional `summary`); a quiet
      pass is possible only when one is on record, so a cloud wake (one process each) can be
      quiet too. Below the floor a pass with nothing changed is quiet rather than essential.
      A full pass narrowed by the floor does not move full_at, so the next pass above the
      floor is a real full one.
  - kind: discovery
    id: p2-carried-landed-batches-unverified
    phase: 2
    title: A carried repo's landed batches are marked unverified, so no close-out is planned
    body: >-
      The snapshot skips every live read for a carried repo (queue, merge commit, hand
      close-out, archive PRs, claim and export reads); its landed batches without a close-out
      event go to `unverified`, which drive_pass already treats as closing with no action.
      run_pass additionally drops merge/update/closeout/archive/adopt actions for carried repos.
