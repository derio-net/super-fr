resolves:
- id: p1-r1
  state: fixed
  body: Exponent clamped to 10, backoff count bounded at 32, a negative backoff treated as 0 and rejected
    on load. Tests test_a_huge_backoff_neither_overflows_nor_grows_past_the_cap, test_a_negative_backoff_is_treated_as_zero,
    test_a_negative_backoff_is_not_usable.
- id: p1-r2
  state: fixed
  body: Pacer.limited reads the free /rate_limit after any ForgeReadError and after a failed-write pass;
    text match OR exhausted budget is a rate limit; such a pass is never clean. Tests test_an_unreadable_visibility_on_an_exhausted_budget_is_a_rate_limit,
    test_a_failed_write_on_an_exhausted_budget_is_not_a_clean_pass (+ ample-budget controls).
- id: p1-r3
  state: fixed
  body: Renewal failure warns once and the pass still prints the quota line and exits 3. Test test_a_failed_renewal_while_waiting_warns_and_still_exits_3.
- id: p1-r4
  state: out-of-scope
  body: 'Closed by phase 3 (R12: visibility read over conditional REST, which an exhausted GraphQL budget
    does not touch). Phase 1 alone ships with the GraphQL read; the plan already orders R12 into phase
    3, so no separate change here.'
- id: p1-r5
  state: fixed
  body: Condition now subtracts batch.LEASE_MARGIN. Tests test_the_cloud_pass_renews_a_lease_expiring_just_inside_the_margin,
    test_the_cloud_pass_leaves_a_lease_with_room_to_spare_alone.
- id: p1-r6
  state: fixed
  body: load catches (OSError, ValueError) on the read. Test test_a_binary_file_is_an_empty_state_and_a_warning.
- id: p1-r7
  state: fixed
  body: Conftest stub unconditional; real _Driver/one_pass/_host_loop integration cases (rate limit raised
    from take_lease and from save_pass) assert one reset+30s wait with no forge call in between; real
    _pace_forge wiring reaches ClientForge.rate_limit. Tests in test_triage_quota_loop.py.
