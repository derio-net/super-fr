journal:
- kind: review
  id: sr-review
  title: spec review of 2026-10-12-quota-pacing
  body: '13 findings, all in scope: sr-1 to sr-13. All 11 journal decisions honoured. Codebase anchors
    verified (see finding bodies).'
- kind: finding
  id: sr-1
  title: Quota-held dispatches counted as Summary.held would end the host drive as stalled
  body: '§C counted held-below-floor dispatches as held; Summary.stalled (batch_drive.py:260) reads held
    and _host_loop exits 3 on it. Fix: count them as pending, test the proposed-only below-floor case.'
  review_scope: in
- kind: finding
  id: sr-2
  title: 'Cloud pass: every drive pass is a first pass; facts.json and probes.json are not on the state
    ref'
  body: 'REF_FILES (state_ref.py:53) carries neither file. Fix: state they are local-only; a fresh or
    re-homed cloud session starts full; the full trigger is a missing pacing.json, not the process''s
    first pass.'
  review_scope: in
- kind: finding
  id: sr-3
  title: wait_until has no owner or schema
  body: 'Fix: define pacing.json with wait_until, backoff count and next_pass_at; any loop meeting a rate
    limit writes it; local state dir only.'
  review_scope: in
- kind: finding
  id: sr-4
  title: Lease safety is a timing argument that fails for small --interval; waits never renew
  body: 'lease = 3*interval+60 (lease.py:105), --interval min 1s. Fix: cap each sleep at lease expiry
    minus 5 min and renew; the cloud pass renews before exiting 3 if the lease would lapse.'
  review_scope: in
- kind: finding
  id: sr-5
  title: 15-minute full pass conflicts with essential-only below the floor
  body: 'Fix: below the floor a full pass narrows to live-batch repos; align R7 with R10''s intersection.'
  review_scope: in
- kind: finding
  id: sr-6
  title: Per-repo carry breaks cross-repo PR->issue links
  body: 'invert runs over collected repos'' PRs only (collect.py:586). Fix: keep previous links whose
    PR is in a carried repo; test a cross-repo closing PR both ways.'
  review_scope: in
- kind: finding
  id: sr-7
  title: Quiet-pass gate misses state changes the driver acts on
  body: 'Fix: a quiet pass also requires judgements.yaml unchanged since the last planned pass; probe
    close-out and archive PR heads; list the time-due latencies accepted up to 15 minutes.'
  review_scope: in
- kind: finding
  id: sr-8
  title: ETag source and probe/collect order unspecified
  body: 'Fix: probes always precede the repo''s collect (unconditional on a full pass); keep only successfully
    read repos'' ETags; test a change interleaved between probe and collect.'
  review_scope: in
- kind: finding
  id: sr-9
  title: Rate-limit classification misses GraphQL exhaustion
  body: 'gh.classify needs 403 (gh.py:672); GraphQL reports ''API rate limit exceeded'' with no status.
    Fix: a text rule over ForgeReadError, Skipped and Unviewed text matching ''rate limit'' or RATE_LIMITED.'
  review_scope: in
- kind: finding
  id: sr-10
  title: Visibility ETag per client instance never hits
  body: 'make_visibility_client builds a client per push (triage_cmd.py:326). Fix: module-level ETag map
    keyed by host and repo.'
  review_scope: in
- kind: finding
  id: sr-11
  title: Snapshot live reads for carried repos not accounted; rate-limited collect continues into snapshot
  body: 'Fix: a rate-limited collect ends the pass before snapshot; snapshot skips per-batch live reads
    for carried repos and drops their merge, close-out and archive actions.'
  review_scope: in
- kind: finding
  id: sr-12
  title: Kanban watch probes, function name and cloud stretch unspecified
  body: 'Fix: name _watch (triage_kanban_cmd.py:397), share collect_into probes and pacing.json; the cloud
    honours the stretch via next_pass_at and exit 3.'
  review_scope: in
- kind: finding
  id: sr-13
  title: Verification rows miss R4, R5, R6, R10, R11, R15/R16
  body: 'Fix: add unit rows quota-secondary-backoff, quota-floor-config, quota-partial-carry, quota-etag-consistency,
    quota-lease-safe-wait.'
  review_scope: in
