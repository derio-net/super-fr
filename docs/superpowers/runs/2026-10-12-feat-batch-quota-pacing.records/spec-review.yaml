acceptance:
- id: quota-secondary-backoff
  capability: triage-batch-drive
  acceptance: A secondary rate limit backs off from --interval, doubling to a 15-minute cap and resetting
    after a clean pass; an unreadable /rate_limit fails open, reported once per cause.
  origin:
  - super-fr:docs/superpowers/specs/2026-10-12-quota-pacing-design.md#R4
  status: not-implemented
  verify: none
- id: quota-floor-config
  capability: triage-batch-drive
  acceptance: The budget floor resolves from --quota-floor, else quota_floor in ~/.config/fr/forge.yaml,
    else 0.20, and a value fr cannot use is refused naming its source.
  origin:
  - super-fr:docs/superpowers/specs/2026-10-12-quota-pacing-design.md#R6
  status: not-implemented
  verify: none
- id: quota-partial-carry
  capability: triage-batch-drive
  acceptance: A pass collects only changed repos and carries the rest from the last facts, keeping cross-repo
    PR-to-issue links whichever side was read; carried repos are never reported unread.
  origin:
  - super-fr:docs/superpowers/specs/2026-10-12-quota-pacing-design.md#R10
  status: not-implemented
  verify: none
- id: quota-etag-consistency
  capability: triage-batch-drive
  acceptance: Probes precede each repo's collect, only successfully read repos keep their ETags, written
    after facts.json, so a change between probe and collect is never hidden by a later 304.
  origin:
  - super-fr:docs/superpowers/specs/2026-10-12-quota-pacing-design.md#R11
  status: not-implemented
  verify: none
- id: quota-lease-safe-wait
  capability: triage-batch-drive
  acceptance: A reset wait or stretched interval never lets the drive lease lapse, and the cloud drive
    pass exits 3 while waiting, renewing the lease first when it would lapse.
  origin:
  - super-fr:docs/superpowers/specs/2026-10-12-quota-pacing-design.md#R16
  status: not-implemented
  verify: none
