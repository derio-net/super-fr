schema_version: 9
run: 2026-10-13-feat-batch-exit-gates
step: brainstorm
outcome: done
questions:
  rounds: 2
  trigger: design-risk
  reason: >-
    Round 1 split the gate from the verification kind (Q2) and chose a collected,
    autonomous close-out (Q6/Q8); the cross-examination found the unarchived-plans
    tripwire only warns (Q4 was asked on a wrong premise), that triage reads labels
    only on open PRs and keeps state off main, so the hold point, the per-run gate
    override, the gate ledger and the close-out merge rule needed a second round.
journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Operator brief — batch exit-gates (verbatim)
    body: |
      /fr-goal Declare each PR's exit: verification-kind label, quality gates, board lanes, install channels

      Batch `exit-gates` of derio-net/super-fr: 3 issues, delivered as ONE pull request.

      ## super-fr#1189: Route every batch PR to a declared exit: verification-kind label, quality gates, and no Closes over unfinished asks
      Declare each PR's exit at decision time: a verification:<kind> label, routing by the manifest's driver (agent drives through, operator waits under Needs you now), named quality gates, and deliver refusing Closes over unmet asks. From the 2026-10-13 merged-batch audit (20 of 35 partial).

      ## super-fr#1155: explicit row verify: on a spec with no ## Verification section is never flagged though walk_owed still owes it
      An explicit row `verify:` on a spec with no `## Verification` section is never flagged though walk_owed still owes it (spec-mandated exemption).

      ## super-fr#667: fr triage batch closeout: close a merged batch queue in one session instead of N competing fr pickup closeouts
      N concurrent close-outs collide on archive. The driver now closes out per batch through its runner (skill text); whether the collision remains needs a re-read.

      ## Why these belong together
      Operator priority after the 2026-10-13 audit. Re-created from exit-routing with #1086's design folded into #1189; #1155 (verify kind without a section) and #667 (one close-out for a merged queue) ride the same exit path.

      ## Delivery rules
      - Work on branch `feat/batch-exit-gates`.
      - Open a draft PR as soon as the spec is committed. Its body contains these lines, one per member, so every member closes when it merges:
        Closes derio-net/super-fr#1189
        Closes derio-net/super-fr#1155
        Closes derio-net/super-fr#667
      - Do not name any member issue as a phase `tracking_issue` in the plan: the bridge would then own that issue's `fr:` labels.

      Never add the `approved-fr` label: it is the operator's approval to merge, and fr voids it on your next push.
  - {kind: decision, id: q1-label-per-kind, title: "Q1: one verification:<kind> label per distinct kind", body: "Operator chose one label per kind (not 'longest wait wins'). Spec R7."}
  - {kind: decision, id: q2-gate-separate-from-kind, title: "Q2: the gate is declared separately from the verification kind", body: "Operator: whether a kind is pre- or post-merge is repo-specific (one repo runs candidate in containers, another by hand), so verification and gate are not one-to-one; both are set, e.g. {verification: candidate, gate: tester} or {verification: library, gate: devops}. Spec R1-R6."}
  - {kind: decision, id: q3-config-manifest-and-triage-yaml, title: "Q3: manifest gate: default + .fr/triage.yaml exit: remap", body: "Operator chose the recommended option. Spec R3, R4."}
  - {kind: decision, id: q4-premise-corrected, title: "Q4: asked on a wrong premise, re-asked in round 2", body: "I claimed the unarchived-plans tripwire fails every PR; the operator questioned it and the code shows it only warns since 2026-09-26. Re-asked as round 2 Q1."}
  - {kind: decision, id: q5-gate-pass-both, title: "Q5: a gate passes by rows walked on main OR an explicit command", body: "Operator chose both. Spec R14."}
  - {kind: decision, id: q6-file-at-deliver-autonomous-closeout, title: "Q6: leftover issues are filed at deliver; close-out becomes fully autonomous", body: "Operator: file at deliver, which makes the close-out fully autonomous; the driver may fix merge conflicts and repair tests once before asking the operator. Spec R9, R10, R15."}
  - {kind: decision, id: q7-owner-vocabulary-and-narrowing, title: "Q7: gate vocabulary + operator-answered narrowing rule; Security vocabulary only", body: "Operator chose the recommended option. Spec R2, R11, R12."}
  - {kind: decision, id: q8-collected-closeout, title: "Q8: one close-out session for the merged queue, flipped ready once clean", body: "Operator chose #667's collected close-out; since close-outs carry no decisions, they are collected and the PR is flipped ready once it has no conflicts and no test errors; the driver tries once to reconcile before turning to the operator. Spec R15."}
  - {kind: decision, id: q9-rc-commit-and-tag, title: "Q9: an RC is a release commit with RC versions plus a tag", body: "Operator chose the recommended option. Spec R20."}
  - {kind: decision, id: q10-final-automatic-when-clear, title: "Q10: the final release is cut automatically when nothing awaits a gate", body: "Operator chose the recommended option. Spec R20, R21."}
  - {kind: decision, id: q11-channel-in-bootstrap, title: "Q11: the install channel lives in bootstrap.sh; install.sh installs its checkout", body: "Operator chose the recommended option, keeping the driver's post_merge install of main unchanged. Spec R22, R23."}
  - {kind: decision, id: q12-all-row-checks, title: "Q12 (#1155): every row check runs on a row's own verify: without a section", body: "Operator chose the recommended option. Spec R24."}
  - {kind: decision, id: q13-candidate-plus-live, title: "Q13: run-level candidate, live rows for real forge/driver/release behaviour", body: "Operator chose the recommended option. Spec ## Verification."}
  - {kind: decision, id: r2q1-held-out-of-closeout, title: "Round 2 Q1: a held batch is kept out of close-out until its gate passes", body: "Operator chose the recommended option. Spec R13, R16."}
  - {kind: decision, id: r2q2-spec-gate-line, title: "Round 2 Q2: a spec gate: line (and per-row gate=) overrides the repo mapping", body: "Operator chose the recommended option. Spec R5, R8."}
  - {kind: decision, id: r2q3-pr-labels-ledger, title: "Round 2 Q3: the merged PR's gate labels are the gate ledger", body: "Operator chose the recommended option. Spec R14, R20, R21."}
  - {kind: decision, id: r2q4-closeout-no-approval, title: "Round 2 Q4: the collected close-out PR merges without approved-fr", body: "Operator chose the recommended option. Spec R15."}
  - {kind: decision, id: closes-vs-refs-delivery-rule, title: "Rows carry no issues: refs so the operator's Closes delivery rule holds", body: "The batch's delivery rules require Closes for all three members, while this feature's own rule is Refs for an issue held by a post-merge gate. Followed the operator's explicit delivery rule; no acceptance row cites a member issue. Raised in the PR body."}
resolves: []
acceptance:
  - id: exit-gates-declared-exit
    capability: exit-gates
    acceptance: "A run's exit — the set of verification kinds and the set of gates, from the manifest's gate default, the repo's remap, and the spec's gate line or per-row gate= — is computed once and printed by fr verification exit; a run is held after merge iff a gate is tester or devops."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R1, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R5]
    status: not-implemented
    scenario: tests/scenarios/exit-gates-declared-exit.sh
  - id: exit-gates-set-downgrade
    capability: exit-gates
    acceptance: "fr verification set rewrites the spec's Verification line, journals the reason and re-syncs the labels; after spec-review a change that makes the exit wait less is refused without a verified operator answer."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R8]
    status: not-implemented
    scenario: tests/scenarios/exit-gates-set-downgrade.sh
  - id: exit-gates-verify-without-section
    capability: exit-gates
    acceptance: "A row's own verify: on a spec with no Verification section is checked like any other (unresolvable, unrunnable install, missing scenario, post-merge or none without a reason)."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R24]
    status: not-implemented
    scenario: tests/scenarios/exit-gates-verify-without-section.sh
  - id: exit-gates-deliver-accounting
    capability: exit-gates
    acceptance: "deliver refuses an out-of-scope finding, deferred item or owed row that no post-merge gate holds and no filed issue tracks, and refuses Closes over an issue a post-merge gate holds or an agent-decided narrowing names; fr journal file files the issue and defers the finding in one move."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R9, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R11]
    status: not-implemented
  - id: exit-gates-board-lanes
    capability: exit-gates
    acceptance: "The board shows Needs you · Developer, · Reviewer, · Tester and · DevOps lanes read from the run cursor and the gate labels, and never shows merge ready, nor merges, a CONFLICTING or DIRTY PR."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R17, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R19]
    status: not-implemented
  - id: exit-gates-install-channels
    capability: exit-gates
    acceptance: "bootstrap.sh installs the newest release with no argument, the newest RC with --version RC, an exact release or RC by number, main with --version main, and installs nothing for an unknown version while listing the available ones; install.sh accepts a clean checkout at a v* tag."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R22, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R23]
    status: not-implemented
  - id: exit-gates-pr-labels
    capability: exit-gates
    acceptance: "A run's PR carries one verification:<kind> label per kind and one gate:<gate> label per post-merge gate, kept in sync as the spec changes."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R7]
    status: not-implemented
  - id: exit-gates-driver-routing
    capability: exit-gates
    acceptance: "A merged batch held by a post-merge gate is not closed out and keeps its Refs issues open under its Needs-you lane until its rows are walked on main or fr gate pass records the pass, which swaps the label to gate:<g>-passed."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R13, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R14]
    status: not-implemented
  - id: exit-gates-collected-closeout
    capability: exit-gates
    acceptance: "Every landed, not-held batch of a repo closes out in one session with one housekeeping PR that the driver marks ready and merges once clean, closing passed batches' Refs issues; one reconcile attempt, then the operator."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R15, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R16]
    status: not-implemented
  - id: exit-gates-release-gating
    capability: exit-gates
    acceptance: "A push to main cuts a vX.Y.Z-rc.N pre-release while any change merged since the last final waits on a post-merge gate, and the final vX.Y.Z once none does; fr release status lists what still waits."
    origin: [super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R20, super-fr:docs/superpowers/specs/2026-10-14-exit-gates-design.md#R21]
    status: not-implemented
