journal:
  - kind: decision
    id: p3-narrowing-filing
    phase: 3
    title: Filing a narrowing decision appends a decision with the same narrows= and tracked_by=
    body: >-
      The journal is append-only and a decision has no resolution record, so `fr journal file`
      appends `<id>-filed`: a decision carrying the original's `narrows=` (and `gate=`) plus
      `tracked_by=<issue>`. A narrowing decision is a decision with `narrows=` and no
      `tracked_by=`; it is accounted when a later decision with the same narrows set carries
      `tracked_by=` (fr.journal.file.narrowing_accounted). R11's operator check reads only
      narrowing decisions, never the filing.
  - kind: decision
    id: p3-brainstorm-operator-decisions
    phase: 3
    title: The brainstorm record writes answered_by=operator on its decisions when its gate is cleared by asking
    body: >-
      apply_record marks a record operator_decisions when its step clears an operator gate,
      it is not no_questions, and evidence.answered_by is not agent. Its decisions with no
      answered_by are written answered_by=operator and skip the transcript check (the gate's
      own question-round check verifies it; a refusal restores every byte). An item saying
      agent is kept. Elsewhere a decision claiming operator is verified against the
      transcript since the journal's last entry (an empty journal: the whole session).
  - kind: decision
    id: p3-leftover-rules
    phase: 3
    title: Leftovers gate runs before the PR body; tracking none keeps only the gate route for rows; a walked gated row may close
    body: >-
      `_deliver_leftovers_gate` runs before `_deliver_pr_gate`, so the body renders with the
      deferrals already recorded. An unreadable exit judges no row there (the label sync
      refuses it). Under tracking none the journal kinds are not leftovers and an owed row's
      only fix is `fr verification set --gate`. A gated row stops holding its issue once
      walk-verified (R14's rows-walked pass), as a post-merge row already did.
  - kind: discovery
    id: p3-journal-item-filed-as
    phase: 3
    title: JournalItem also gained filed_as, inside the same record 9 -> 10 hop
    body: >-
      `fr journal file` writes through the record engine, and an owed entry's filing record
      carries filed_as=, which no record field expressed. JournalItem.filed_as rides the same
      kind-10 bump; the engine accepts a `resolves` naming an owed entry only when filed_as
      is set (discharge stays `fr journal resolve`'s).
  - kind: discovery
    id: p3-deliver-fixtures-account
    phase: 3
    title: Deliver test fixtures now account for their leftovers
    body: >-
      The shared `_at_deliver` fixture defers its out-of-scope finding to an issue and gives
      the seeded unwired row an issue (account_seeded_row); the fr-goal shape walk does the
      same before deliver. tests/integration/test_exit_gates_deliver.py keeps the unaccounted
      path end to end.
  - kind: finding
    id: p3-older-fr-refuses-decision-tokens
    phase: 3
    review_scope: in
    title: A released fr refuses answered_by= and tracked_by= on a decision, so spec §C's "an older fr ignores them" holds only for gate= and narrows=
    body: >-
      parse_journal reads tokens by name, so an unknown token (gate=, narrows=) is ignored by
      fr <= 5.26. But answered_by= and tracked_by= are tokens it already knows and validates:
      its JournalEntry refuses answered_by off a resolution record and tracked_by off an open
      one, so a journal holding an operator-answered or filed narrowing decision is a parse
      error for an older fr. Built as the spec and the brief name the tokens; the journal
      stamp was not moved. Options: move the journal kind (migration), or spell the decision
      tokens differently.
