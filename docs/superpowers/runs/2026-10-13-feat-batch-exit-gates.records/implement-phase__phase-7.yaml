journal:
  - kind: decision
    id: p7-release-status-window
    phase: 7
    title: fr release status counts PRs merged after the last final tag's commit time, and fails closed on a forge error
    body: |
      "Merged since the last final tag" is `mergedAt` later than the tag's commit time (`git log -1 --format=%cI`), from one bulk merged-PR list; only those PRs get a `pr_view` for their labels. The tag is the highest `^v\d+\.\d+\.\d+$` among the checkout's tags. A forge failure exits 1 and `release.py` refuses, because an empty `waiting` would cut a final. Owed rows come from `fr.triage.ledger.gated_rows_at` on `origin/<default>` (HEAD when unresolvable); an unreadable exit reports `owed_rows: null`, never "none owed", and never changes whether the PR waits (the labels decide).
  - kind: decision
    id: p7-rc-bump-rule
    phase: 7
    title: An RC of X.Y.Z bumps from the last final it implies, read from its own shape
    body: |
      `Version.bumped` on an RC: X.0.0 implies a major, X.Y.0 a minor, else a patch. A bump no bigger than that lands on the final X.Y.Z; a bigger one moves X.Y.Z by it, which equals moving the last final by it. So `changes.bumped` (and so check-change-fragment's predicted floor at an RC head) needs no tag read and never int-splits the RC string. `release.compute` itself bases the target on the last final TAG plus the pending bump.
  - kind: decision
    id: p7-status-workflow-token
    phase: 7
    title: release.yml reads what waits with the workflow token (pull-requests read), never the app's
    body: |
      Reading merged PRs needs pull-requests read. The app token is minted with contents and issues write only, and asking it for more fails the mint when the installation lacks the permission, which would stop every release. So the workflow gains `pull-requests: read` and passes `FR_RELEASE_STATUS_TOKEN: ${{ github.token }}`, which `_run_release_status` puts in GH_TOKEN for that one subprocess.
  - kind: decision
    id: p7-no-fragment-no-rc
    phase: 7
    title: With no pending fragment on a final head nothing is released and what waits is never asked
    body: |
      An RC previews the final the pending fragments make. With none pending and HEAD a final, there is nothing to preview or finalize, so compute returns before calling `fr release status`, which also keeps the forge read off every no-op push. `--version` stays an ungated final.
  - kind: discovery
    id: p7-release-notes-by-subject
    phase: 7
    title: release_notes now finds its commit by exact subject; -S<version> cannot see an RC to final commit
    body: |
      `git log -S5.27.0` finds commits that change the COUNT of `5.27.0`, and `5.27.0rc1` -> `5.27.0` changes no count, so the final's own commit was invisible and the lookup landed on the RC's (whose subject did not match, so the notes were empty). It now lists `--fixed-strings --grep` matches and keeps the one whose subject is exactly `release: v<semver>`.
