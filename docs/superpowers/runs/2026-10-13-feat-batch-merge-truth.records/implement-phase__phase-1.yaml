journal:
  - kind: decision
    id: p1-settle-drops-release-op
    title: A settle op replaces the release op for the same key
    body: "plan_sync drops the owed release for a key that also has a settle target (a closed member of a releasing batch): settle releases the own marker and unlabels in one pass, and carries the batch so claims_released is still recorded. Otherwise the pass would edit the same issue twice."
    phase: 1
  - kind: decision
    id: p1-settle-closed-needs-now
    title: settle_closed takes now= beside the planned arguments
    body: "The plan's signature (client, repo, number, me, trusted) has no clock; the released marker form needs one, so settle_closed(client, repo, number, *, me, now, trusted) is keyword-only. A label-only settle (no own marker) returns the new Done action 'unlabelled', distinct from 'none' (left alone)."
    phase: 1
  - kind: decision
    id: p1-carried-settle-waits
    title: Settle of a carried repo waits, by the key's repo
    body: "settle is in _LIVE_READ_ACTIONS and read_repo() resolves it by env.owner_repo(key) because a settle may name no batch; a skipped repo's settles are not planned (unread filter, same key repo). facts.json is host-local (not a REF_FILES entry), so retire writes it with write_text_atomic and no state-ref publication is needed."
    phase: 1
  - kind: discovery
    id: p1-fake-forge-closed-filter
    title: FakeForge now filters the closed read by label
    body: "tests/unit/triage_fixtures.py FakeForge.list_issues returned the closed set regardless of the label filter; with two label reads it now filters (gh ANDs labels, one per read), so the single-label tests keep their meaning."
    phase: 1
  - kind: discovery
    id: p1-idle-guard-flake-under-load
    title: test_run_idle_guard hang test fails under the full parallel suite only
    body: "Full suite: 12309 passed, 118 skipped, 1 failed (tests/integration/test_run_idle_guard.py::test_fails_open_when_fr_hangs_and_does_not_hang_with_it). The file passes alone (52 passed); the test is wall-clock bound and touches nothing this phase changed."
    phase: 1
