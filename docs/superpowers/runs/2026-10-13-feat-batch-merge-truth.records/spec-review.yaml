journal:
  - kind: review
    id: spec-review-r1
    title: "independent spec review: 14 findings, all in scope"
    body: |
      Decisions q1–q9 are reflected in R1–R15. q3 drifted on the busy-session case (sr-3), and q5 and q6 could not work as written (sr-6, sr-1).
      Member coverage: #1190 .1–.4 → R1–R3, R12, R5, R6, and #1190 .5 (reconcile #1176/#1178) → R13/R14. #1172 asks → R7–R10, and its draft note → R11. #1161 → R4. #1160 → §G. #1176 → R13. #1178 → R14.
      Every named file, function and line was verified (the reviewer's verified list covers claim_writes, claim_sync, claims, collect, triage_claim_cmd, triage_cmd, triage_batch_cmd, batch_drive, batch_merge, probe, kanban, views, render, check, gitseam, gh, real_ghclient, real_ghrestclient).
  - {kind: finding, id: sr-1, review_scope: in, title: "Retire's facts rewrite sets `released` on IssueClaim, a field that does not exist; no atomic facts writer exists", body: "model.py:315-326 IssueClaim has no released field (extra=forbid), and facts hold only un-released claims (claims.py:213-225). collect writes facts.json with a bare write_text (triage_cmd.py:529-532). Fix: remove the released signer's entries and write through write_text_atomic."}
  - {kind: finding, id: sr-2, review_scope: in, title: "The archive-conflict hand-back cannot reuse ConflictEvent / conflict_decision / _hand_back as written", body: "ConflictEvent.paths has min_length=1 (model.py:741-756). conflict_decision counts every ConflictEvent since dispatch (batch_drive.py:569-598). _hand_back targets the batch items with a MergeConflictError (triage_batch_cmd.py:5233-5271). A held ConflictEvent raises merge-conflict (views.py:316-325), and record_stop is keyed by batch id. Fix: a distinct event and counter, a close-out target, the export source and key, and clear_stop on merge."}
  - {kind: finding, id: sr-3, review_scope: in, title: "R12 starts a fresh close-out item whenever the session is not idle; existing hand-back waits while it is working", body: "triage_batch_cmd.py:5290-5304: idle → message; working/blocked → retry next pass; absent/done → fresh. q3 asked for the batch-PR behaviour."}
  - {kind: finding, id: sr-4, review_scope: in, title: "Dropping the closed-member refresh must not also drop it for a member facts do not hold (issue None)", body: "claim_sync.py:121-124 covers `issue is None or issue.state != open` together. Dropping both would let open members' claims lapse when a read fails."}
  - {kind: finding, id: sr-5, review_scope: in, title: "The driver's settle path is unspecified past plan_sync: Snapshot field, Action kind, carried filter, batch-less ops", body: "claim_sync.py:33 OpKind, :84-88 batch required, :152-153 released counts release only. triage_batch_cmd.py:3838-3852 and :4455 filter by repos.get(op.batch). kanban.py:101-111 phrase map."}
  - {kind: finding, id: sr-6, review_scope: in, title: "R5: a recorded take the forge then refuses (live rival or Held) is never claimed by sync, and the event stays", body: "claim_writes.py:290-296 may_displace raises ClaimError, and claim can return Held. claim_sync.py:126-128 lists a held member and never claims it. Fix: withdraw the event on refusal, keep it on transport failure."}
  - {kind: finding, id: sr-7, review_scope: in, title: "batch_merge.live_checks takes a MergeContext; _archive_prs has none and should not build one", body: "batch_merge.py:254-262. merge_ctx costs a fetch, a config read, merge methods and base rules. Fix: split into pr_checks_verdict(client, repo, number, ci_none)."}
  - {kind: finding, id: sr-8, review_scope: in, title: "DefaultBranchUnknown is raised for every ForgeReadError from merge_ctx, not only a default-branch failure", body: "triage_batch_cmd.py:3493-3508 also raises for a merge-methods read failure. Fix: raise it only from the fetch and default_branch()."}
  - {kind: finding, id: sr-9, review_scope: in, title: "clean-labels' target set is stated two ways, and the existing row triage-closed-in-progress-set contradicts R2", body: "tests/scenarios/triage-closed-in-progress.sh:21-24 and test_triage_clean_labels.py:50 pin the stale-only target set. Fix: pick one set and name the existing row."}
  - {kind: finding, id: sr-10, review_scope: in, title: "triage-closed-issues-unclaimed is verify: candidate but no scenario is named for it", body: "Only the retire scenario was named. A fake REST forge can exercise this row. Fix: name tests/scenarios/triage-closed-settle.sh."}
  - {kind: finding, id: sr-11, review_scope: in, title: "`claims_of` does not exist, and widening the closed query to \"either label\" needs two reads (gh labels AND)", body: "collect.py:917-923 lists with labels=[fr:in-progress], and gh.py:268 ANDs repeated --label flags. The reader is read_claims (claims.py:190)."}
  - {kind: finding, id: sr-12, review_scope: in, title: "R9's reasons do not match §D's rule: drafts get an archive action, and wrong base already emits `blocked`", body: "batch_drive.py:1321-1331 already blocks a wrong-base PR every pass, and §D gave drafts an archive action, so the draft warn would never print."}
  - {kind: finding, id: sr-13, review_scope: in, title: "R8: plan_pass has no batch input, and forcing a read every pass conflicts with quiet and essential passes", body: "probe.py:189-223 receives repos/changed/live only, and pacing.py:127-138 is the caller. Fix: a new closing parameter, with the quiet and essential behaviour stated."}
  - {kind: finding, id: sr-14, review_scope: in, title: "R15's trigger and the post-merge Test Plan check a narrower set than R1/R2 settle", body: "triage_kanban_cmd.py:359-367 counts stale only and names clean-labels only. The post-merge step checked fr:in-progress only."}
resolves:
  - {id: sr-1, state: fixed, body: "§C/R6: retire removes the retired signer's entries from Issue.claims (what a fresh collect writes) and writes facts.json through write_text_atomic, with no schema change. State-ref publication follows collect's path."}
  - {id: sr-2, state: fixed, body: "§E: a new judgements event archive_conflict (schema 9→10) with its own counter since the close-out event and no paths. It gets archive_conflict_decision, a close-out-targeted hand-back with item id archive-conflict-<batch>-<n>, its own Need kind archive-conflict, an export source and stop key export:<repo>, and clear_stop on merge."}
  - {id: sr-3, state: fixed, body: "R12/§E: idle → message; working or blocked → nothing sent, retry next pass; absent or done → a fresh archive-conflict item."}
  - {id: sr-4, state: fixed, body: "R1/§A: only a member the facts show closed drops the refresh. issue None keeps the due-only refresh."}
  - {id: sr-5, state: fixed, body: "§A names OpKind settle, an optional ClaimOp.batch for settle ops only, Snapshot.settles_owed, Action settle, the kanban phrase, and the carried filter by the key's repo. released()/record_releases count settle ops on members."}
  - {id: sr-6, state: fixed, body: "R5/§B: a refusal (ClaimError/Held) withdraws the just-recorded event and exits 2. A transport failure keeps it, and sync claims the member. The row text and verification line cover all three failures."}
  - {id: sr-7, state: fixed, body: "§D: pr_checks_verdict(client, repo, number, *, ci_none) holds the rule, and live_checks delegates to it. _live_head_prs calls pr_checks_verdict."}
  - {id: sr-8, state: fixed, body: "§F/R13: DefaultBranchUnknown is raised only by the fetch and default_branch(). Every other ForgeReadError behaves as today."}
  - {id: sr-9, state: fixed, body: "R2/§A: clean-labels keeps the stale-only target set, so the existing scenario and unit test stand. It now removes both labels. Row triage-closed-in-progress-set is named under Acceptance rows as moving to both labels."}
  - {id: sr-10, state: fixed, body: "§G names tests/scenarios/triage-closed-settle.sh, with a fake REST forge, for triage-closed-issues-unclaimed."}
  - {id: sr-11, state: fixed, body: "§A names read_claims and specifies two closed reads, one per label, deduplicated by number, each warning on truncation. The StaleInProgress docstring and copy name both labels."}
  - {id: sr-12, state: fixed, body: "R9 rewritten: a waiting line for pending or failing checks, the R12 conflict line, the existing blocked line for a wrong base, and the archive action's own 'marked ready, merged' line for drafts. §D emits the warn only when no archive, archive-conflict or blocked action applies."}
  - {id: sr-13, state: fixed, body: "R8/§D: plan_pass gains closing from pacing.py and adds it to only on partial and essential passes. A would-be quiet pass with a non-empty closing becomes a partial pass over closing. live_repos includes closing. The cost is stated."}
  - {id: sr-14, state: fixed, body: "R15: the note fires on stale or release-pending entries and names claim sync or the drive pass, with clean-labels as the stale-only manual route. The Test Plan adds the fr:claimed check."}
