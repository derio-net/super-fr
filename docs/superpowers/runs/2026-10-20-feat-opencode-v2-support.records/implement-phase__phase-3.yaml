  P3.T1: "The spike's throwaway statusline.tsx was replaced outright by the real src/tui/index.tsx; nothing of it survived to clean."
  P3.T2: "segment.ts is new and single-purpose and reuses spawn.ts run(); index.tsx is a 30-line shell over it, so there was no duplication to remove."
