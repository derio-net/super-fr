  capability: fr ops
  acceptance: fr ops apply (one op or a phase) runs in dependency order, confirms, stops on the first
    failure naming the op and its undo, waits for a post-merge op's ready probe, and a second run writes
    nothing and says so
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R4
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R11
  status: not-implemented
  verify: candidate
- id: fr-ops-profile-guard
  capability: fr ops
  acceptance: fr ops apply refuses outside a declared ops profile and names the exec command; status only
    warns
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R6
  status: not-implemented
  verify: ci
- id: fr-ops-evidence-attest
  capability: fr ops
  acceptance: Op evidence and operator attestations are durable journal entries visible to fr ops status
    from any checkout, attested never shown as checked
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R7
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R8
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R17
  status: not-implemented
