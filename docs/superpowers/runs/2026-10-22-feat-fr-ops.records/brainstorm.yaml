- id: fr-ops-testplan-tags
  capability: Test Plan
  acceptance: Test Plan steps tagged [devops] or [tester] route to their gate; an unknown tag is refused
    naming the step
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R12
  status: not-implemented
  verify: ci
- id: fr-ops-deliver-section
  capability: deliver
  acceptance: The delivered PR body carries a Manual operations section rendered from recorded evidence,
    and a plan with pre-merge ops labels the PR gate:devops
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R13
  status: not-implemented
  verify: ci
- id: fr-ops-devops-gate-hold
  capability: gates
  acceptance: An un-passed gate:devops holds the PR from the driver's merge, and fr gate pass --gate devops
    refuses while an op or devops Test Plan step is open
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R14
  status: not-implemented
