  capability: fr ops
  acceptance: A plan's ops are read from ops.yaml and from legacy manual-operation blocks in step text,
    strictly typed, a duplicate id or unknown key refused naming file and line
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R1
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R2
  status: not-implemented
  verify: ci
- id: fr-ops-status
  capability: fr ops
  acceptance: fr ops status reports every op DONE (checked or attested), OPEN with its reason, N/A, UNVERIFIABLE
    or CANNOT-VERIFY, runs checks per declared identity, surfaces a disabled requirement as OPEN with
    its consequence and escalates when the guarded condition already happens
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R3
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R5
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R9
  status: not-implemented
  verify: candidate
