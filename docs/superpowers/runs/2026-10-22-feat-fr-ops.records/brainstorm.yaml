journal:
- kind: discovery
  input: true
  id: input-brief
  title: 'Operator brief: gh#1220 verbatim'
  body: "# gh#1220: fr ops: manual-operation blocks become checkable/runnable (status, idempotent apply,\
    \ pre/post-merge batches) for the devops gate\n\n## Problem\n\nA plan's `# manual-operation` blocks\
    \ are prose. Nothing checks them. At `deliver` and at the post-merge close-out, the operator has to\
    \ work out by hand which ops are done, which are still open, and in what order to run the rest. For\
    \ anything behind a `devops` (or `tester`) gate, that is exactly where runs stall or go wrong.\n\n\
    ## Evidence (derio-net/frank#878, #887)\n\nfrank#875 shipped with eight manual ops, split between\
    \ PRE-MERGE and post-merge. The operator asked for \"a script I can run to either implement them or\
    \ show which ones are still open and verify the ones that are done\". The ad-hoc answer was `scripts/ci-budget-ops.sh`:\n\
    \n- `status` is read-only. It reports every op as DONE / OPEN / N/A with live evidence.\n- `apply\
    \ <op>` is idempotent and confirms before acting.\n- `apply pre-merge` and `apply post-merge` run\
    \ the ops in batches.\n- Its inputs come from the change's own config, not a hard-coded list.\n\n\
    It paid off at once. Its live checks caught five real defects that unit tests, three review rounds\
    \ and CI all missed:\n\n1. A token-permission key that does not exist (`variables` instead of `actions_variables`).\
    \ Token minting would have failed once deployed.\n2. A billing SKU name that the code did not know\
    \ (`Actions macOS 3-core`). The watcher would have errored on every run.\n3. A webhook secret whose\
    \ secret-store value was never seeded. The ExternalSecret existed, but the triggers would have rejected\
    \ every delivery.\n4. A GitOps app stuck \"Synced\" at a revision from five days earlier. The post-merge\
    \ guard caught that the merge had not been applied.\n5. A semantics probe that could not prove what\
    \ it claimed: its branch tip never touched the filtered paths.\n\nWriting it by hand also produced\
    \ its own bugs, which a standard feature would make once and fix once:\n\n- A plaintext secret could\
    \ be left in the checkout if encryption failed.\n- `sops` creation rules match the input path, so\
    \ encrypting a temp file failed.\n- A probe interrupted by Ctrl-C left a scratch repo behind.\n- A\
    \ secret read failing inside `$(…)` under `set -e` exited silently.\n\n## Proposal: manual ops become\
    \ checkable and runnable (`fr ops`)\n\n- **Schema.** Each `# manual-operation` block gains optional,\
    \ machine-runnable fields:\n  - `check:` — a read-only probe; exit 0 = done, otherwise open, with\
    \ a one-line reason.\n  - `apply:` — idempotent automation; omitted when the op is UI-only.\n  - `phase:\
    \ pre-merge|post-merge`, plus `needs: [<op-id>]` for ordering.\n\n  `commands` / `verify` stay as\
    \ human prose. An op with no `check` is reported \"unverifiable — manual\". It is never reported as\
    \ done.\n- **CLI.**\n  - `fr ops status [--plan <dir>] [<op-id>]` lists DONE / OPEN / N/A / UNVERIFIABLE,\
    \ with evidence.\n  - `fr ops apply <op-id>` runs one op.\n  - `fr ops apply --phase pre-merge|post-merge`\
    \ runs a batch in dependency order. It confirms per op, and stops on the first failure, naming that\
    \ op.\n- **Pipeline wiring.**\n  - At `deliver`, the PR body's \"Pre-merge verification owed\" and\
    \ manual-phase sections are rendered from `fr ops status`, not hand-written. A PR with OPEN pre-merge\
    \ ops carries that state, and the ready checklist shows it.\n  - At the close-out brief (`fr pickup\
    \ --run`), the post-merge step becomes `fr ops apply --phase post-merge`, then `fr ops status`.\n\
    \  - The `devops` / `tester` gate's close-out reads `fr ops status`. The gate cannot be marked walked\
    \ while a gated op is OPEN.\n- **Post-merge readiness.** Post-merge ops need a \"merge has landed\"\
    \ precondition that checks a live artifact, not the forge's merge state. Example: a resource that\
    \ only the merged revision creates. The GitOps tool's \"Synced\" status is not enough; see frank's\
    \ stale-revision gotcha.\n- **Helpers, so op authors don't each reinvent the dangerous parts:**\n\
    \  - Read secrets live and never print them.\n  - Hold plaintext only in a 0600 temp file outside\
    \ the repo, removed by an exit trap. Encrypt with `sops --filename-override <target>`, and write the\
    \ tracked file only after encryption succeeds.\n  - Put values on the clipboard instead of stdout\
    \ when a UI paste is unavoidable.\n  - Clean up scratch resources with an exit trap.\n  - Every probe\
    \ states what it would look like if it were vacuous. The paths-filter probe failure above is the model.\n\
    - **Runbook sync.** `/sync-runbook` carries `check` / `apply` into `manual-operations.yaml`, so `fr\
    \ ops status` also works for ops from earlier plans. Example: the pre-existing op behind (3), which\
    \ was still pending from an older plan.\n\n## Acceptance\n\n- `fr ops status` on a plan lists every\
    \ manual op, with live state and a reason for each OPEN.\n- `fr ops apply --phase pre-merge` and `--phase\
    \ post-merge` are idempotent: a second run writes nothing, and reports so.\n- `deliver` renders the\
    \ owed pre-merge ops from `fr ops status`, and the gated close-out refuses while one is OPEN.\n- The\
    \ secret helpers never leave plaintext in the repo when encryption fails. This is tested.\n- The reference\
    \ implementation, frank's `scripts/ci-budget-ops.sh` (in #878 and #887), is replaced by `check` /\
    \ `apply` fields on that plan's ops, as the first consumer.\n\nRefs derio-net/frank#875, derio-net/frank#878,\
    \ derio-net/frank#887.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\
    \n\n---\n## Comment 1\n\n## More evidence from the post-merge close-out (frank#888, #889, #890, #891,\
    \ #892)\n\nThe close-out session for the same run (`fr pickup --run …` followed by `fr-debugging`)\
    \ found more defects while it walked the Test Plan and cleared the `devops` gate. Nearly every one\
    \ is an op that a script or a person called \"done\" which a real `check:` would have shown OPEN.\
    \ They are grouped below by the `fr ops` design point each one supports.\n\n### 1. A `check:` must\
    \ exercise the consumer's identity, not the admin's\n\n- **Grants were missing for identities other\
    \ than the one that ran the op.** The new orgs were provisioned with an admin token, and the admin-run\
    \ `status` showed everything green. Two other identities were still locked out:\n  - The read-only\
    \ delivery checker reads as its own bot user, which was not a member of the new orgs, so it got 404\
    \ on 9 of 10 repos.\n  - The mirror push identity had write access in one new org but not the other,\
    \ so the reconciler failed for every repo in that org.\n\n  An op's `check:` should run *as each consumer\
    \ identity*, by actually reading or writing the resource, rather than inspecting membership as an\
    \ admin. Onboarding a new org should list every identity that touches it.\n- **A grant was applied\
    \ to one of two orgs, and the status check had the same gap.** Per-org loops in `check:` and `apply:`\
    \ should be generated from one list, so they cannot drift apart.\n\n### 2. Failures must keep their\
    \ reason\n\n- **A bare `except` turned every failure into `read-error`, with no HTTP status.** Telling\
    \ \"not a member\" (404) from \"wrong default branch\" (404 on a different path) from \"token scope\"\
    \ (403) took a debugging session. Checks, and the CronJobs they verify, should log the status code,\
    \ but never forge response text, which can leak.\n\n### 3. Don't assume a repository's shape\n\n-\
    \ **A default branch other than `main` broke two CronJobs that hard-coded `main`.** The push-sync\
    \ webhook filters also match only `main`, so that repo's branch is repaired by the 15-minute reconciler\
    \ rather than synced on push. Ops helpers should read `default_branch` everywhere. The ad-hoc script\
    \ already did; the shipped code did not.\n\n### 4. Provisioning side effects need guards, and an undo\
    \ path\n\n- **The mirror backfill pushed every tag.** Gitea then ran the *old, pre-gate* tag-triggered\
    \ release workflows: 8 runs and 54 jobs that queued for hours and starved the shared runner. The backfill\
    \ also ran ungated test workflows on old commits, which left permanent \"status delivery mismatch\"\
    \ noise in the delivery checker.\n  - A backfill `apply:` should disable Actions on the target, push\
    \ only what is needed, then re-enable Actions. Pushing branches first and tags never works too.\n\
    \  - Onboarding order matters: status forwarding should be live before any CI can run on the mirror.\n\
    - **Gitea 1.25 cannot cancel a queued run through its API.** Deleting a queued run returns 400, so\
    \ cleanup needed the admin web UI and a person. `fr ops` should document an undo for each `apply:`,\
    \ and flag any apply whose side effects have no automated undo.\n\n### 5. An optional dependency that\
    \ disables a requirement must show as OPEN\n\n- **The notifier's Secret was declared optional (\"\
    absent means heartbeat-only\").** Nothing created it, and `status` reported 0 open items. So the requirement\
    \ to notify on every flip, would-flip and refusal was silently off: refusals logged before go-live\
    \ were sent nowhere. It was found only by reading the watcher code during the Test Plan.\n  - A `check:`\
    \ must report a disabled requirement as OPEN and name the consequence.\n  - It was fixed by declaring\
    \ the credential as an ExternalSecret from the existing secret store, rather than having a script\
    \ copy it. `fr ops` should prefer declaring a dependency to provisioning it.\n\n### 6. Proofs must\
    \ be durable and shared, not local\n\n- **The one-off semantics proof was stored in a gitignored file\
    \ in one workspace.** The close-out session, working in a different workspace, saw the op as \"not\
    \ proven\" and had to re-run it, creating and deleting a scratch repo again. Proof evidence belongs\
    \ in the run's journal or evidence store, where `fr ops status` from any checkout can read it.\n\n\
    ### 7. State-transition ops and the guards that pin the starting state\n\n- **A tripwire test asserted\
    \ that every org ships `mode: dry-run`.** So the go-live op, a one-line config PR, also had to edit\
    \ the guard. An op that changes a pinned state should ship with the guard's transition rule, for example\
    \ \"dry-run unless listed in a go-live allowlist\". Otherwise every go-live is a surprise test failure.\n\
    \n### 8. Manual-phase ticks and the archive gate should come from `check:`\n\n- **The archive was\
    \ held until Phase 6, the manual ops, had its steps ticked.** The session ticked them by hand, and\
    \ only for steps whose `status` passed. That is the rule `fr ops` should encode: a manual step is\
    \ ticked when its `check:` passes, never by assertion, and the archive gate reads the same source.\n\
    \n### 9. Test Plan steps belong in the same model, with ordering and approvals\n\n- **Of the 10 Test\
    \ Plan rows, several waited on the go-live flip and several needed explicit approval** (suspending\
    \ a CronJob, scaling the runner to 0, creating a GitHub issue). Recorded outcomes cannot be rewritten,\
    \ so later evidence went into a journal entry.\n\n  Each Test Plan row could be an op with these fields:\n\
    \  - `needs:` for ordering, e.g. \"after go-live\";\n  - `mutating: true`, which requires approval;\n\
    \  - `undo:`;\n  - a `check:` that records `--ran` or `--owed` with a reason.\n- **Throwaway artifacts\
    \ created during verification need guaranteed cleanup** (a probe PR and branch, a scratch repo). This\
    \ is the same exit-trap helper as before.\n\n### 10. Status should escalate when reality gets ahead\
    \ of the dry run\n\n- **During the dry run, GitHub was already refusing one org's jobs for its spending\
    \ limit,** while the watcher only reported `would-flip` at 97.7%. Nobody was notified, because the\
    \ notifier was off (point 5). `fr ops status`, or the feature's own status, should escalate when the\
    \ condition a go-live protects against is already happening.\n- **The watcher's dry-run `refused`\
    \ verdict looked like a bug during close-out.** It was correct: gate PRs in other repos had not merged\
    \ yet. A `check:` result should carry its reason (\"refused: N repos have gate-coverage gaps — waiting\
    \ on their PRs\"), so the operator doesn't have to debug a correct state.\n\n### What this means for\
    \ the design\n\nOf the 9 defects in this round, 7 were invisible to tests, review and CI, yet visible\
    \ to a check that runs as the real identity against the live system. The other two were the backfill\
    \ side effects and the missing undo path. That strengthens the core proposal:\n- a manual op counts\
    \ as done only when its `check:` passes;\n- checks run as the consumer identities;\n- every `apply:`\
    \ declares its side effects and its undo.\n\n\U0001F916 Generated with [Claude Code](https://claude.com/claude-code)\n\
    \n\n---\n## Comment 2\n\nthe fr ops should require an `ops` profile with the appropriate permissions.\
    \ This might contain interactive steps (authorizations etc) so it needs to run on the DevOps Gate.\n"
- kind: decision
  id: q1-carrier
  title: 'Op carrier: both ops.yaml and fenced blocks'
  body: 'Round 1 Q1. Operator chose **Both**: `ops.yaml` in the plan folder is canonical; `# manual-operation`
    fenced blocks in step text are read for back-compat (R2).'
- kind: decision
  id: q2-scope
  title: 'Scope: everything, with Test Plan split devops/tester'
  body: 'Round 1 Q2. Operator: "Everything but the Test Plan might need to be split into a DevOps and
    a Tester part ... ops must do the smoke-testing to ensure that the feature basically works but the
    rest might need to be redirected to the Tester Gate". Builds identities, undo/mutating, escalation,
    disables, durable proofs (R1, R5, R9) and the Test Plan split (R12).'
- kind: decision
  id: q3-frank-side
  title: 'Frank migration: follow-up frank issue'
  body: 'Round 1 Q3: "is ci-budget-ops.sh a frank pattern? If so, then (3)". Code check: frank scripts/
    holds no other *-ops.sh, a one-off. Round 2 Q4: operator chose a follow-up frank issue (R18).'
- kind: decision
  id: q4-ops-profile
  title: 'Ops profile: apply needs ops, status warns'
  body: 'Round 1 Q4. `fr ops apply` refuses outside an `ops: true` profile; `fr ops status` runs anywhere,
    warns, and reports missing credentials as CANNOT-VERIFY (R3, R6).'
- kind: decision
  id: q5-evidence
  title: Evidence lives in plan journal entries
  body: Round 1 Q5. Append-only `op` journal entries; status reads live and archived journals for runbook
    ops (R7).
- kind: decision
  id: q6-unverifiable
  title: Unverifiable ops close by operator attestation
  body: Round 1 Q6. `fr ops attest` records answered_by operator; DONE (attested) always shown apart from
    DONE (checked) (R8).
- kind: decision
  id: q7-devops-stage
  title: DevOps gate becomes an interactive pre+post merge stage
  body: 'Round 1 Q7. Operator: "if there is a pre-merge ops stage, they need to run on the DevOps Gate,
    that must run on the ops profile. The delivering agent delivers the PR and the owed pre-merge ops
    and it''s done. The DevOps Gate, an interactive state takes over and handles the pre/post merge ops
    and the merge itself. The DevOps Gate and the delivering agent delegate to the Testing Gate, if testing
    is owed." Deliver renders owed ops from recorded evidence and does not refuse (R13); gate:devops holds
    pre-merge too (R14).'
- kind: decision
  id: q8-helpers
  title: 'Helpers: generic tool-neutral fr subcommands'
  body: 'Round 1 Q8: "I tend towards 1 but wouldn''t we be overfitting for the ops tasks frank gets? super-fr
    is not only about frank". Round 2 Q5: generic primitives (seal/secret/clip/scratch), sops/kubectl
    only in docs examples (R10).'
- kind: decision
  id: q9-verification
  title: 'Verification: candidate plus a live post-merge row'
  body: Round 1 Q9. strategy candidate; one `live` row fr-ops-live-first-run for the first real ops run
    under an ops profile.
- kind: decision
  id: q10-run-gate
  title: 'Run gate: developer; live row gated devops'
  body: 'Round 1 Q10 developer; Round 2 Q6: the live row carries `gate: fr-ops-live-first-run=devops`
    so the DevOps stage dogfoods itself.'
- kind: decision
  id: r2q1-engine
  title: DevOps stage = engine + thin skill
  body: Round 2 Q1. `fr ops gate --run` deterministic engine plus a thin `fr-devops-gate` skill (R15,
    R16).
- kind: decision
  id: r2q2-merge
  title: DevOps session merges on explicit operator confirm
  body: Round 2 Q2. The interactive DevOps session runs the forge merge only after an explicit operator
    confirmation and only when pre-merge shows nothing OPEN and checks pass; the delivering agent never
    merges (R15).
- kind: decision
  id: r2q3-testplan-tag
  title: Test Plan steps tagged [devops]/[tester]
  body: Round 2 Q3. Leading step tag; untagged takes the run's gate (R12).
- kind: decision
  id: model-tiers
  title: No model-tier questions owed
  body: The brainstorm brief listed unbound_tiers [] and dead_bindings/binding_offers null, so no model
    questions were asked.
resolves: []
acceptance:
