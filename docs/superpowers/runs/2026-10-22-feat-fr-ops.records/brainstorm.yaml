  capability: fr ops
  acceptance: fr ops seal never leaves plaintext in the repo or at the target when encryption fails or
    the process is interrupted, and the helpers never print a secret
  origin:
  - super-fr:docs/superpowers/specs/2026-10-22-fr-ops-design.md#R10
  status: not-implemented
