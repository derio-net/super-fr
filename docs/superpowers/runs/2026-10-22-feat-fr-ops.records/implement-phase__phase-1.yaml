journal:
  - kind: decision
    id: p1-refactors-folded-into-green
    phase: 1
    title: The T2-T5 refactor shapes were built in directly, not as a second pass
    body: |
      The shared R1 field mixin (`_OpFields`), the reuse of fr.spec's fence regex
      (now public as `FENCE_RE`), the one `OP_BODY_KEYS` constant and the single
      `StatusRow` renderer were written as the GREEN code rather than duplicated
      first and cleaned after. A later cleanup in phase 1 also folded the loader's
      two YAML-error paths into `_yaml_error` and the journal validator's two
      stamp-floor checks into one loop.
  - kind: decision
    id: p1-op-body-keys-in-journal-model
    phase: 1
    title: OP_BODY_KEYS, op_body and op_fields live in fr.journal.model beside OWED_FIELDS
    body: |
      The writer (`op_body`, used by `fr.ops.evidence.record_op`) and the fold
      (`op_fields`, used by `fr.ops.evidence.fold`) read the one constant. `op_body`
      refuses an unknown key, a missing op/result, an unknown result and any
      multi-line value. Appending an `op` entry stamps an older journal at the
      current version in the same write (`_at_current_stamp`, formerly
      `_at_owed_stamp`).
  - kind: decision
    id: p1-status-semantics
    phase: 1
    title: How fr ops status reads the less obvious cases
    body: |
      `check: proof` reports DONE (proof), a label beside checked/attested/legacy.
      A legacy `status: done` closes the op before any probe runs. `na_if` and
      `escalate` run once with no identity env; `check` runs once per identity.
      An op with `disables` never runs `na_if`. ESCALATE applies to OPEN,
      UNVERIFIABLE and CANNOT-VERIFY, never to N/A. A checkless op is closed only
      by an `attested` entry (a recorded `done` does not close it). Reasons are
      cut to 200 chars and every identity value in them is masked. `status`
      orders ops by `needs` and refuses (exit 2) a cycle or an unknown id.
  - kind: decision
    id: p1-op-kind-refusals
    phase: 1
    title: A record refuses `op` by a field validator; fr journal add refuses --kind op
    body: |
      `JournalItem.kind` keeps the `JournalKind` type and a validator refuses `op`
      (the record kind is unchanged, as R17 says). `fr journal add --kind op` exits 2
      naming `fr ops` before any write: the record-validation path would otherwise
      surface a raw pydantic traceback.
  - kind: discovery
    id: p1-floor-above-installed-unparseable
    phase: 1
    title: A plan floored at 5.28.0 is unparseable by the 5.27.0rc3 in this tree
    body: |
      fr.parser refuses a plan whose fr_version floor is above the installed fr, so
      no plan in this repo can carry ops with the required `>=5.28.0` floor until
      5.28.0 (or an rc of it) is installed. The self-review floor test patches the
      parsed meta instead of writing `_meta.yaml`. Phases 2-4 that dogfood ops on
      a real plan in this repo hit the same wall.
  - kind: discovery
    id: p1-runbook-shape-not-captured
    phase: 1
    title: frank's manual-operations.yaml shape was not captured
    body: |
      frank's checkout is outside this workspace and the isolation guard refuses
      reading it, so the runbook reader accepts a top-level list of operations or a
      mapping holding `ops:` or `operations:`, each item through `LegacyOp`. Capture
      a real frank runbook (redacted) as a fixture before the frank follow-up relies
      on it.
  - kind: discovery
    id: p1-op-entries-untagged-in-handoffs
    phase: 1
    title: record_op writes plan-scope op entries with no phase
    body: |
      An untagged plan-scope entry renders in full in every phase handoff. Phase 2's
      apply/attest will write many of these; either tag them (`phase` on the entry)
      or have compose_handoff collapse `op` entries.
