journal:
  - {kind: discovery, id: p2-trust-exclusion-narrowed, phase: 2, title: "Trust exclusion narrowed to exact file shapes", body: "TRUST_EXCLUDED was prefix-based (runs/**, journals/**/*.md). is_trust_excluded now matches only journals/<specs|plans|debug>/<slug>.md, runs/<run-id>.yaml, runs/<run-id>.records/*.yaml and pr-body.md, and the four acceptance files, and never an entry whose git mode is 120000 or 100755. head_tree uses the ls-tree mode; dirty_paths uses the on-disk lstat mode. Committed as its own fix(ops) commit."}
  - {kind: discovery, id: p2-seal-symlink-refused, phase: 2, title: "seal refuses symlinks and targets outside the repo", body: "seal lstat-walks the target and every parent below the repo root and refuses a symlink, refuses a lexically or really outside target (including ..), before any temp file is created. Tests: symlinked target, symlinked parent dir, absolute outside path, dotdot escape; the scenario plants a symlink too."}
  - {kind: discovery, id: p2-trust-hashes-referenced-files, phase: 2, title: "A probe naming an in-repo file hashes it, so creating it by apply untrusts the set", body: "referenced_files hashes any regular in-repo file a probe token names. A check like test -f made-x passes once apply creates that file, and the new file then reads as added and untrusts the op set. Fixtures and scenarios therefore keep marker files outside the repo (via env_passthrough variables); real ops that create in-repo files they also probe by path will need the same shape."}
  - {kind: decision, id: p2-interactive-apply-path, phase: 2, title: "Interactive apply runs on the operator's /dev/tty via probe.run_interactive", body: "An interactive: true op needs a terminal (refused otherwise, even with --yes). It runs with stdin, stdout and stderr attached to /dev/tty (not this process's streams), no timeout, the minimal env, and its output is not captured so it cannot be masked. Tested with a pty. Non-interactive applies use run_probe (closed stdin, bounded at 10x the probe timeout, masked output). Confirmation: --yes covers non-mutating, --yes-mutating mutating; else the terminal prompt; else a refusal (exit 2) naming the flag."}
  - {kind: decision, id: p2-scenario-trust-seam, phase: 2, title: "Scenarios grant trust through fr.ops.trust.grant_trust", body: "fr ops trust is refused without a terminal by design, so the scenarios seed FR_OPS_TRUST_DIR with a helper that runs the candidate's own python and calls fingerprint/grant_trust (no cleaner seam exists). The ops profile is a fixture fr-profiles.yaml with ops: true plus FR_PROFILE and KUBERNETES_SERVICE_HOST."}
  - {kind: discovery, id: p2-container-evidence-shared, phase: 2, title: "in_ops_profile reuses fr.isolation.where.container_evidence", body: "Three copies of the container-evidence test exist (where.py, external.py, run/workspace.py). profile.py reuses where.container_evidence (injectable); the other two copies were left alone to keep this phase's blast radius small."}
