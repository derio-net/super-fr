journal:
  - kind: discovery
    id: p3-journal-reason-sanitised
    phase: 3
    title: Every printed or recorded op reason goes through one sanitiser
    body: |
      Coordinator-requested security fix (review of phase 2's apply). fr.ops.mask.sanitise_reason
      masks identity values AND env_passthrough values (the same mask rules) and drops a
      body-looking line (JSON, or over 200 chars) whoever the probe ran as, stderr-derived
      reasons included. status, apply and attest call it; record_op calls it again with the
      repo's own env_passthrough values, so no write path can record an unsanitised reason
      (a dropped one is recorded as "reason withheld: it looked like a response body").
      Passthrough values under 6 characters are not treated as secrets (`DEBUG=1` would
      otherwise mask every `1`). A reason with a long `disables:` suffix can now exceed 200
      characters and is recorded as withheld; the live status line still shows it.
  - kind: decision
    id: p3-plan-has-ops-fail-closed
    phase: 3
    title: plan_has_ops counts an unreadable ops carrier as ops, and finds an archived plan
    body: |
      The R13 promotion reads fr.ops.load.plan_has_ops over the run's emitted plan, falling back
      to docs/superpowers/implemented/plans/<name> once archived. An ops.yaml or step block that
      fails to load counts as ops, so a broken carrier holds the run behind devops rather than
      silently dropping the gate. Exit gains ops_promoted for callers that want to say why.
  - kind: decision
    id: p3-merge-hold-as-unapproved
    phase: 3
    title: The pre-merge devops hold reports as an `unapproved` attempt with a reason
    body: |
      batch_merge.pre_merge_hold runs first in _approved_and_ready and returns
      MergeAttempt("unapproved", reason="is held by gate:devops until gate:devops-passed ...").
      Both callers already print `held: PR #n <reason>` for unapproved, so no new
      MergeReadiness literal (and no caller switch) was needed.
  - kind: decision
    id: p3-gate-pass-run-resolution
    phase: 3
    title: fr gate pass --gate devops with no --run and no run on the head ref behaves as before
    body: |
      With --run, an unreadable run is refused. Without it, the one run whose branch is the PR's
      head ref is folded; several are refused (pass --run); none prints "no run here names
      branch ...; no op evidence folded" and passes as today, so a hand pass of a row-level
      devops gate on a repo with no run still works. Tester and every other gate ignore --run.
  - kind: finding
    id: p3-na-not-recordable
    phase: 3
    review_scope: in
    title: An op that is N/A by its na_if probe can never be recorded closed
    body: |
      R14's gate pass folds recorded evidence only, but no `op` entry result means N/A
      (done|open|failed|attested|proof) and apply/status skip an N/A op without writing.
      So a plan op whose na_if passes holds `fr gate pass --gate devops` forever (only a
      legacy `status: n/a` closes one). Phase 4's `fr ops gate` must record an N/A outcome
      (a new result value is a journal-body vocabulary change) or the spec must say N/A ops
      are attested. Not decided here.
  - kind: finding
    id: p3-matrix-testplan-tags-wording
    phase: 3
    review_scope: in
    title: Row fr-ops-testplan-tags says an unknown tag is refused; R12 says it stays text
    body: |
      The row's acceptance text reads "an unknown tag is refused naming the step", but R12
      says any other leading bracket stays text, and the brief required exactly that. The
      implementation follows the spec; the row's acceptance wording needs correcting (no
      set-status flag edits it).
