schema_version: 10
run: 2026-10-22-feat-fr-ops
step: review-phase
item: phase/1
outcome: done
journal:
- kind: finding
  id: p1-r1
  phase: 1
  review_scope: in
  title: OPS_FR_FLOOR=5.28.0 named the wrong release
  body: release.py targets last final 5.26.0 + minor = 5.27.0, and rc1-rc3 exist without fr ops; a 5.28.0
    floor made the shipping release refuse every ops plan, and >=5.27.0 would admit rc1-rc3 via version_floor.admits.
- kind: finding
  id: p1-r2
  phase: 1
  review_scope: in
  title: status --phase refused a post-merge op needing a pre-merge op
  body: '`known` was set only for an id selection, so a cross-phase need read as unknown (exit 2).'
- kind: finding
  id: p1-r3
  phase: 1
  review_scope: in
  title: The runbook reader rejected frank's real runbook
  body: The real runbook is an `operations:` mapping with keys note/notes/done_note/decommissioned, non-string
    commands items, and statuses decommissioned/n/a/deferred/free text.
- kind: finding
  id: p1-r4
  phase: 1
  review_scope: in
  title: Secret masking was whole-value substring replacement
  body: Multi-line secrets, encoded forms and response bodies leaked into reason lines (R5).
- kind: finding
  id: p1-r5
  phase: 1
  review_scope: in
  title: Repo-authored probes ran with the operator's full environment and no trust step
  body: 'Probes and identity `from:` commands got os.environ; a PR author could plant an exfiltrating
    probe. A spec gap (now R19) plus a code gap. Three follow-up automated security reviews hardened the
    trust design: (a) a trust record in a tracked journal is forgeable from a checkout; (b) the fingerprint
    must cover probe-affecting config and files a probe names; (c, d) it must cover indirect dependencies,
    via the whole committed tree minus only fr''s own evidence files, never a prefix.'
- kind: finding
  id: p1-r6
  phase: 1
  review_scope: in
  title: Probes had no timeout and inherited stdin
  body: A prompting or blocking probe hung status.
- kind: finding
  id: p1-r7
  phase: 1
  review_scope: in
  title: op entries rendered in full in every phase handoff
  body: record_op writes phase=None, and compose_handoff renders untagged non-findings in full.
- kind: finding
  id: p1-r8
  phase: 1
  review_scope: in
  title: Identities were re-resolved per op
  body: Secret-reading `from:` commands re-ran for each op x identity.
- kind: finding
  id: p1-r9
  phase: 1
  review_scope: in
  title: The date-pin fix raced at midnight
  body: _today() read the clock after the pass.
- kind: discovery
  id: p1-main-red-date-pin
  phase: 1
  title: main has been red since 2026-10-19 on a date-pinned triage test
  body: 'tests/unit/test_triage_driver_adapter.py pinned closeout-2026-10-14-1 while the driver names
    the collected close-out from the pass clock. It blocked this run''s tests: ci gate, so the fix rides
    in this PR (commit fbac5f14, hardened by p1-r9).'
- kind: review
  id: p1-review-1
  phase: 1
  title: 'Phase 1 review: fr ops read model'
  body: 'Dispatched reviewer (separate context, opus) over bc878999..HEAD against spec R1-R3, R5, R7,
    R9, R17. 9 findings, all in scope, all fixed by the phase executor with tests (p1-r1..p1-r9); none
    refuted. Four automated commit-security reviews fed p1-r5''s trust design (spec R19). Verified: 527/527
    targeted tests pass; ruff, mypy, `fr validate artifacts` and `fr plan self-review` are clean.'
resolves:
- id: p1-r1
  state: fixed
  body: 'Floor is 5.27.0rc4; the check uses version_floor.admits, so >=5.27.0 is refused. Tests: test_the_ops_floor_is_the_predicted_release,
    test_the_ops_floor_is_above_every_cut_release (tag guard), test_the_ops_floor_admits_only_fr_ops_releases,
    test_self_review_refuses_a_floor_that_admits_an_earlier_rc.'
- id: p1-r2
  state: fixed
  body: 'known = every loaded op id whenever a filter narrows the selection. Test: test_status_phase_filter_keeps_a_need_on_an_op_of_the_other_phase.'
- id: p1-r3
  state: fixed
  body: 'LegacyOp keeps unknown keys as prose with a warning, stringifies non-string items, maps done/done...
    to DONE (legacy) and decommissioned/n/a to N/A (legacy); Op stays strict; new fixture runbook-frank/
    (example.com, 192.0.2.x). Tests: test_legacy_status_maps_per_r2, test_frank_runbook_shape_is_read_without_refusal,
    test_self_review_tolerates_frank_keys_in_step_blocks and others.'
- id: p1-r4
  state: fixed
  body: 'fr/ops/mask.py masks each value, its lines and 6+-char tokens in raw, base64, urlsafe-base64
    and URL-encoded forms, and decoded base64 runs; a body-like reason under an identity becomes `exit
    N`. Tests: test_a_secret_line_echoed_alone_is_masked, test_a_base64_echo_of_the_secret_is_masked,
    test_a_url_encoded_secret_is_masked, test_a_token_of_a_secret_is_masked, test_a_body_like_line_as_an_identity_reports_only_the_exit.'
- id: p1-r5
  state: fixed
  body: 'fr/ops/probe.py runs every probe with a minimal env plus env_passthrough plus (check only) identity
    vars; `fr ops trust` stores grants per operator outside the repo (FR_OPS_TRUST_DIR > XDG_STATE_HOME
    > ~/.local/state, 0600, atomic), and the journal decision is audit only. The fingerprint covers the
    ops, .fr/ops.yaml settings, files named by probes, and the whole committed tree minus TRUST_EXCLUDED
    (journals, runs, matrix and its reports). Dirty fingerprinted paths refuse. The ''read-only'' wording
    is gone. Tests: test_status_refuses_an_untrusted_set_and_runs_no_probe, test_a_committed_journal_decision_grants_nothing,
    test_a_new_script_under_docs_superpowers_invalidates_trust, test_frs_evidence_files_do_not_invalidate_trust,
    test_a_dirty_non_excluded_file_refuses, test_a_probe_gets_only_the_minimal_env and others. Spec R19
    amended; P2''s scaffold step mounts the store read-only.'
- id: p1-r6
  state: fixed
  body: 'stdin=DEVNULL plus a timeout (timeout_seconds, default 60); a timeout reads CANNOT-VERIFY ''timed
    out''. Tests: test_stdin_is_closed, test_a_probe_that_hangs_times_out, test_a_timed_out_check_is_cannot_verify,
    test_a_reference_that_hangs_times_out.'
- id: p1-r7
  state: fixed
  body: 'compose_handoff collapses op entries and op-trust decisions to one line. Test: test_a_handoff_collapses_op_and_op_trust_entries.'
- id: p1-r8
  state: fixed
  body: 'Memoised per invocation. Test: test_resolution_is_memoised_per_invocation.'
- id: p1-r9
  state: fixed
  body: Both tests monkeypatch triage_batch_cmd._now to a fixed instant and assert closeout-2026-10-22-1
    (verified that a 2027 instant fails them).
evidence:
  review: p1-review-1
  reviewer: a0421cc94a964991d
