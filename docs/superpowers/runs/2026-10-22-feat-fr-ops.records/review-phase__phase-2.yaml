schema_version: 10
run: 2026-10-22-feat-fr-ops
step: review-phase
item: phase/2
outcome: done
journal:
- kind: finding
  id: p2-r1
  phase: 2
  review_scope: in
  title: '`fr ops apply <unknown-id>` exited 0'
  body: _select/_closure dropped unknown ids; a typo read as success.
- kind: finding
  id: p2-r2
  phase: 2
  review_scope: in
  title: A refusal mid-run hid ops already applied
  body: ApplyRefused printed only the refusal after earlier ops had changed the target and been journaled.
- kind: finding
  id: p2-r3
  phase: 2
  review_scope: in
  title: An apply-only op was re-applied every run and recorded `done`
  body: Status never honoured that `done`; phase 3's PR body and gate fold would have counted it, sidestepping
    attestation.
- kind: finding
  id: p2-r4
  phase: 2
  review_scope: in
  title: A second signal during cleanup aborted it
  body: The handler stayed installed while cleanups ran; SIGHUP was unhandled.
- kind: finding
  id: p2-r5
  phase: 2
  review_scope: in
  title: secret/clip --from ignored env_passthrough and timeout
  body: read_value did not pass .fr/ops.yaml settings, unlike identity from:.
- kind: finding
  id: p2-r6
  phase: 2
  review_scope: in
  title: --yes-mutating alone confirmed a mutating op
  body: R4 says mutating ops also need --yes-mutating.
- kind: finding
  id: p2-r7
  phase: 2
  review_scope: in
  title: Needs outside the selection were neither applied nor checked
  body: A dependant ran without confirming an other-phase or runbook need.
- kind: finding
  id: p2-r8
  phase: 2
  review_scope: in
  title: A multi-line attest --note crashed after confirmation
  body: op_body raised ValueError after the prompt.
- kind: finding
  id: p2-r9
  phase: 2
  review_scope: in
  title: seal with a missing target parent raised a traceback
  body: mkstemp raised FileNotFoundError.
- kind: finding
  id: p2-r10
  phase: 2
  review_scope: in
  title: scaffold --ops baked an absolute host path into a committed devcontainer.json
  body: It leaked the operator's username.
- kind: finding
  id: p2-r11
  phase: 2
  review_scope: in
  title: A re-scaffold without --ops left the two files disagreeing
  body: 'ops: true was kept while FR_PROFILE and the mount were dropped.'
- kind: finding
  id: p2-r12
  phase: 2
  review_scope: in
  title: The refusal route's exec line could not resolve a plan
  body: No run matches chore/ops-<slug>.
- kind: finding
  id: p2-r13
  phase: 2
  review_scope: in
  title: A failed apply lost its stderr
  body: The reason was the last stdout line only.
- kind: finding
  id: p2-r14
  phase: 2
  review_scope: in
  title: The scenarios missed three cases
  body: There was no apply-time identity failure, mutating refusal or no-check apply case.
- kind: discovery
  id: p2-red-first-caveat
  phase: 2
  title: Review fixes were written before their tests
  body: 'The executor wrote the p2-r1..r14 fixes, then stashed the source and re-ran the new tests: 11
    failed and the apply module failed to import. That shows the tests detect the defects, but r2, r3,
    r6, r7 and r13 were not shown red individually. Recorded rather than glossed.'
- kind: review
  id: p2-review-1
  phase: 2
  title: 'Phase 2 review: apply, attest, profile, helpers'
  body: 'Dispatched reviewer (separate context, opus) over 2baae4ae..HEAD against R4, R6, R8, R10, R11
    and R19. It reproduced p2-r1..r3 against the CLI with a throwaway probe test outside the repo. 14
    findings, all in scope, all fixed with tests; none refuted. Mid-phase security fixes (trust exclusion
    narrowed to exact shapes, seal symlink refusal) were reviewed and judged sound. Verified: 913 targeted
    tests pass, scenarios pass, ruff/mypy/validate/self-review/acceptance check clean.'
resolves:
- id: p2-r1
  state: fixed
  body: 'Apply and attest refuse (exit 2) naming each unknown id, hinting --runbook for a runbook-only
    id. Tests: test_p2_r1_an_unknown_op_is_refused_naming_it, test_p2_r1_a_runbook_only_op_says_runbook.'
- id: p2-r2
  state: fixed
  body: 'ApplyRefused carries the partial result, which the CLI prints; a pre-flight refuses before the
    first apply when any remaining op would. Tests: test_p2_r2_a_refusal_after_work_carries_what_already_ran,
    test_p2_r2_preflight_refuses_before_the_first_apply, test_p2_r2_the_cli_prints_what_ran_before_a_refusal.'
- id: p2-r3
  state: fixed
  body: 'Records `result: open` (applied; no check — attest it), reports needs-attestation, and does not
    re-apply silently. Tests: test_p2_r3_an_apply_without_a_check_is_flagged_not_recorded_done, test_p2_r3_a_rerun_does_not_silently_reapply,
    plus a scenario case.'
- id: p2-r4
  state: fixed
  body: 'Cleanup runs with SIGINT/SIGTERM/SIGHUP ignored; clean exits 130/143/129. Tests: test_p2_r4_a_second_signal_during_cleanup_does_not_abort_it,
    test_p2_r4_sighup_is_handled_like_the_others.'
- id: p2-r5
  state: fixed
  body: 'Both are passed. Test: test_p2_r5_from_honours_passthrough_and_timeout.'
- id: p2-r6
  state: fixed
  body: 'Both flags required. Test: test_p2_r6_yes_mutating_alone_does_not_confirm_a_mutating_op, plus
    a scenario case.'
- id: p2-r7
  state: fixed
  body: 'Out-of-selection needs are status-checked before the first apply and must be DONE or N/A. Test:
    test_p2_r7_a_need_outside_the_selection_must_be_done.'
- id: p2-r8
  state: fixed
  body: 'Refused before the prompt. Test: test_p2_r8_a_multiline_note_is_refused_before_the_prompt.'
- id: p2-r9
  state: fixed
  body: 'Clean refusal; symlink state is re-checked before os.replace. Tests: test_p2_r9_a_missing_parent_dir_is_refused_cleanly,
    test_p2_r9_a_link_planted_while_the_command_runs_is_refused.'
- id: p2-r10
  state: fixed
  body: 'The mount source uses ${localEnv:...} forms only. Test: test_p2_r10_the_mount_source_is_never_a_literal_host_path.'
- id: p2-r11
  state: fixed
  body: 'An existing ops profile keeps its shape, with a note; --no-ops removes it. Tests: test_p2_r11_rescaffold_without_ops_keeps_the_ops_shape,
    test_p2_r11_no_ops_removes_the_key_and_the_shape.'
- id: p2-r12
  state: fixed
  body: 'The route names --plan when the slug is known. Test: test_p2_r12_the_route_names_the_plan_when_known.'
- id: p2-r13
  state: fixed
  body: 'Falls back to stderr''s last line, masked. Test: test_p2_r13_the_applier_falls_back_to_stderr.'
- id: p2-r14
  state: fixed
  body: fr-ops-status-apply.sh covers all three, plus an unknown op id.
evidence:
