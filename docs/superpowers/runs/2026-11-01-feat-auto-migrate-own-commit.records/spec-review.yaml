schema_version: 10
run: 2026-11-01-feat-auto-migrate-own-commit
step: spec-review
outcome: done
journal:
- kind: finding
  id: f1
  title: '§B contradicts itself on the detached-HEAD path: workspace validation runs before the git-state refusals'
  body: Validation ran before the git-state refusals, so a detached HEAD read as drift and an in-isolation agent was told to enter isolation; GitRefusal/NoRepo messages were unstated (trigger.py:430-478; hooks/lib/fr-isolation-decision.sh:214-221).
  review_scope: in
- kind: finding
  id: f2
  title: Existing gate tests pin 'CI refuses' and their CI scrub leaves GITHUB_ACTIONS set
  body: ~22 tests drive context via interactive= or patch is_interactive; two assert CI never migrates; _invoke deletes only CI, so GITHUB_ACTIONS on runners would flip classification (test_migration_trigger.py:336-357,414-426,564-578).
  review_scope: in
- kind: finding
  id: f3
  title: A Python marker validator already exists (fr/run/workspace.py); the spec added a third
  body: run/workspace.py:37-134 already implements the checks; 'one reader' claim false; R2 diverged from the hook lib on missing mode/branch.
  review_scope: in
- kind: finding
  id: f4
  title: 'The ::warning:: line on stdout corrupts machine-readable output in CI'
  body: Breaks the gate's stderr-only invariant (trigger.py:336-340); a --json or summary redirect gets a stray line only on stale runs.
  review_scope: in
- kind: finding
  id: f5
  title: The CI in-place path dropped uncommitted_veto
  body: CI=1 is exported in local/agent shells; dropping the veto rewrites edited files and a later git add -A folds the migration into work (commit.py:364-387).
  review_scope: in
- kind: finding
  id: f6
  title: d5's candidate scenarios were missing from the spec
  body: Rows cite two scenarios the spec never described; no Test Plan step or cost line; _common.sh exports CI=true and FR_SKIP_MIGRATION=1.
  review_scope: in
- kind: finding
  id: f7
  title: The SessionStart acceptance nag would make the migration commit silently
  body: fr-acceptance-nag.sh:29 discards stderr on success; it is the first gated command of most sessions.
  review_scope: in
- kind: finding
  id: f8
  title: §E edited a nonexistent AGENTS.md paragraph and omitted the OpenCode mirror
  body: AGENTS.md has no such paragraph; .opencode/instructions/artifact-versioning.md is generated and tripwired.
  review_scope: in
- kind: finding
  id: f9
  title: fr-acceptance-nag.sh claims `fr acceptance status` is gate-exempt; it is not
  body: plugins/super-fr/hooks/fr-acceptance-nag.sh:24-25 vs trigger.py:82-96.
  review_scope: out
- kind: review
  id: spec-review-1
  title: 'independent spec review: 9 findings (8 in scope, 1 out)'
  body: 'Dispatched fr-spec-reviewer (read-only, this workspace). 8 in-scope findings fixed in the spec; f9 out of scope. Verified citations listed in the reviewer return: trigger.py gate sequencing, commit.py, fr_version.py, where.py, scaffold.py, ci.yml, acceptance-report.yml, release.py, the Verification grammar and the five rows.'
resolves:
