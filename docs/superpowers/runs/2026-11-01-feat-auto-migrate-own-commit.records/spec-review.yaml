  state: fixed
  body: '§B now gives the numbered order: git_context → GitRefusal (today''s message) / NoRepo (R3 ''not a git repository'') → wrong-root and detached refusals → valid_workspace → default branch. Detached is never drift (R2).'
- id: f2
  state: fixed
  body: §A names the seam (interactive= → context=, mapping kept), splits the two CI tests, and requires an autouse conftest fixture clearing every CI_ENV_VARS marker and FR_NON_INTERACTIVE.
- id: f3
  state: fixed
  body: §B moves run/workspace.py's helpers into fr.isolation.marker as valid_workspace (one implementation, two callers), drops the one-reader claim, cites the lib; R2 now reads missing mode as worktree and missing branch as not drift.
- id: f4
  state: fixed
  body: §C emits the annotation on stderr; stdout invariant kept; the stderr-processing belief is checked by the live row, with a $GITHUB_STEP_SUMMARY follow-up if it does not render.
- id: f5
  state: fixed
  body: R5 and §C keep uncommitted_veto; the warning says not to commit the files with other work; the rule records the ride-along caveat.
- id: f6
  state: fixed
  body: §F specifies both scenarios (fixture, env contract unsetting CI markers/FR_NON_INTERACTIVE/FR_SKIP_MIGRATION, assertions per R); Test Plan gains a [candidate] step with a cost line; they run in CI via test_scenarios.py.
- id: f7
  state: fixed
  body: 'New R11 + §D: the gate prints ''fr: migrated and committed …''; the hook and nag.ts relay it, and the refused-context nag line names isolation. New row auto-migrate-nag-surfaces-commit.'
- id: f8
  state: fixed
  body: AGENTS.md bullet dropped; §E adds sync-opencode.py (and sync-hermes.py) and keeps the prose test_the_rule_prose_names_every_read_only_command reads.
- id: f9
  state: out-of-scope
  body: The misleading comment predates this change (it was written for review r5-c5); this change does not make it wrong, only more relevant. Left for a later edit of the hook.
