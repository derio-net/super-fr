  state: fixed
  body: publish now runs finish without pushing when origin/main == staged_sha (release.py:983-986), with
    a test (827d486e7).
- id: p3-r2
  state: fixed
  body: A racing-push seam moves the real bare remote between the check and the real push, which returns
    race and is superseded (test_a_race_at_the_push_itself_is_superseded); the override cases assert ==
    EXIT_SUPERSEDED.
- id: p3-r3
  state: fixed
  body: Both take --plan and call check_materialised (HEAD == staged_sha and origin/main pinned to base_sha,
    release.py:948); release.yml passes --plan.
- id: p3-r4
  state: fixed
  body: Added Commands.shard and Commands.collect, with tests through main() for each path.
- id: p3-r5
  state: fixed
  body: parser.error refuses --dry-run with any subcommand and --version with any subcommand but prepare,
    with tests.
- id: p3-r6
  state: fixed
  body: 'Added prepare→publish tests: an RC published as a prerelease, a floor mismatch giving EXIT_FLOOR
    plus an issue, and gate state unknown giving an RC plan.'
- id: p3-r7
  state: fixed
  body: A workflow test pins that publish holds only GH_TOKEN and prepare holds GH_TOKEN, FR_RELEASE_STATUS_TOKEN
    and RELEASE_VERSION.
- id: p3-r8
  state: fixed
  body: release.yml and merge-protection.md reworded (read-only checkout token, never persisted, no forge
    token in the suite env); the daily-cron fallback is stated.
- id: p3-r9
  state: fixed
  body: AGENTS.md 'Release / version bumping' updated to the job graph and both superseded outcomes.
- id: p3-r10
  state: out-of-scope
