step: review-phase
item: phase/3
outcome: done
journal:
- kind: finding
  id: p3-r1
  title: publish rerun after a landed push reported superseded and never tagged
  body: publish compared the tip only with base_sha, so tip == staged_sha after a failed finish read as
    superseded (exit 0, no tag).
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r2
  title: No real non-fast-forward push was tested as race then superseded
  body: The rewritten tests hit only the pre-check or monkeypatched push; the override tests asserted
    'not in (0, EXIT_FLOOR)'.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r3
  title: test-shard and collect did not self-check HEAD == staged_sha
  body: They relied on a separate materialise step; collect took no --plan.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r4
  title: test-shard/collect bypassed the Commands seam
  body: main() wiring (the plan read, the version reaching the probe, a red shard) was untested.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r5
  title: --dry-run and top-level --version were silently ignored with a subcommand
  body: '''--dry-run prepare'' staged a commit; ''--dry-run publish'' pushed.'
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r6
  title: RC, floor and gate-unknown outcomes were untested through the job graph
  body: Only the no-subcommand path covered them.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r7
  title: Least-privilege publish env was unpinned
  body: Nothing asserted that publish lacks FR_RELEASE_STATUS_TOKEN/RELEASE_VERSION.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r8
  title: Docs overstated 'no token at all' and omitted the cron fallback
  body: The suite jobs hold a read-only GITHUB_TOKEN; [skip ci]/GITHUB_TOKEN pushes start no run.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r9
  title: AGENTS.md still described a single-process release
  body: The contract doc did not mention the job graph, superseded exit 0 or the --version re-dispatch.
  review_scope: in
  phase: 3
- kind: finding
  id: p3-r10
  title: A gh release create failure after the tag push leaves a tag with no GitHub Release
  body: Every rerun's finish sees the tag and does nothing (release.py finish/tag path).
  review_scope: out
  phase: 3
- kind: finding
  id: p3-r11
  title: Concurrency cancels a pending workflow_dispatch --version run
  body: GitHub keeps one pending run per group; a queued dispatch is dropped when a push run queues behind
    it.
  review_scope: out
  phase: 3
- kind: review
  id: p3-review
  phase: 3
  title: 'phase 3 adversarial code review: 9 in-scope (fixed), 2 out-of-scope'
  body: Read-only reviewer (opus, separate context) reviewed git diff 3b051d5db..b05d3b76f against spec
    §3.D/§E2, R8-R12 and plan 03.yaml, trying to publish an untested commit, leak a token, skip the shards,
    or lose an R11 outcome. Commit identity, base pin, version probe, token reach and the if/needs chains
    held. Raised p3-r1..p3-r11; the in-scope ones were verified (release.py:948-986 read back) and fixed
    in 827d486e7/c4bc03121; targeted tests 257 passed (log scratchpad/p3-fix-tests.log).
resolves:
