outcome: done
journal:
- kind: finding
  id: sr-1
  title: Existing release-script tests pin the recompute loop the spec removes; spec claimed R11 pinned
    by them unchanged
  review_scope: in
  body: test_release_script.py:322/:344/:594 pin recompute + EXIT_RACE; spec §3.D said R11 is pinned by
    them unchanged.
- kind: finding
  id: sr-2
  title: R14's 600s budget breaks test_release_workflow's >=900 pin; single-job tripwires miss the new
    jobs
  review_scope: in
  body: test_release_workflow.py:138 asserts >=900; :74-127 use next() over flattened steps, so they check
    only the first checkout.
- kind: finding
  id: sr-3
  title: 'R9 ''no forge token'' not met by contents: read alone'
  review_scope: in
  body: 'A contents: read job still has GITHUB_TOKEN, and checkout persists it into .git/config unless
    told not to.'
- kind: finding
  id: sr-4
  title: A superseded --version dispatch silently drops the override; superseded rule stated too broadly
  review_scope: in
  body: Today the override survives retries; the new design exited 0 and the next push-run has no override.
    Also only a race result is superseded, never a protection refusal; concurrency keeps one pending run.
- kind: finding
  id: sr-5
  title: Release split-check has no collect job, no durations source, no timeouts
  review_scope: in
  body: §D referenced a check with no collect or plan step; R12 bounds were incomplete.
- kind: finding
  id: sr-6
  title: Release shards see a different origin/main; publish never gets the staged commit
  review_scope: in
  body: A fresh checkout's origin/main may be past the base; push/finish act on HEAD and the working tree.
- kind: finding
  id: sr-7
  title: Shard and collect commands under-specified
  review_scope: in
  body: Bare collect ran under default addopts; least_duration dropped; the single --durations-path was
    contradictory; workers also register the writer.
- kind: finding
  id: sr-8
  title: Coverage-leg pin selects the first upload step (now the junit upload)
  review_scope: in
  body: test_ci_python_floor.py:63-67 uses next(); the measurement commit's junit upload came first (red
    on this branch only, not main).
- kind: finding
  id: sr-9
  title: Wrong reason given for keeping _StrictLoader pure-Python
  review_scope: in
  body: CSafeLoader = CParser + SafeConstructor, so overriding construct_mapping works.
- kind: finding
  id: sr-10
  title: R2's shared 'immutable' Matrix still has a mutable dict on Row.levels
  review_scope: in
  body: frozen=True blocks reassignment but not item mutation of Row.levels (model.py:232).
- kind: finding
  id: sr-11
  title: Factual slips about the code
  review_scope: in
  body: wall_clock is a span, not a sum; run_once line numbers; prepare is steps 1-3; --dry-run is compute-only;
    the job count is 25.
- kind: review
  id: spec-review-1
  title: 'independent spec review: 11 findings'
  body: 'Reviewer (fr-spec-reviewer, separate context) checked the journal decisions (all honoured), codebase
    reality for every named file/helper/test with file:line, and internal consistency, including the three
    equivalence arguments. Findings raised: sr-1..sr-11, all in scope. No gate weakening found beyond
    the operator-decided coverage-leg move.'
resolves:
- id: sr-1
  state: fixed
  body: §E2 names the three race tests as rewritten to the superseded outcome, plus new per-subcommand
    cases (prepare/materialise/test-shard/publish); §D lists EXIT_RACE, docstring step 5 and the loop
    as removed.
- id: sr-2
  state: fixed
  body: '§E2: budget pin moves to >=600 with rationale; checkout/token assertions become per-job (persist-credentials
    false everywhere; collect/test have no app token, no token env, contents: read).'
- id: sr-3
  state: fixed
  body: 'R9 reworded (no forge token in env, no write-capable token reachable from checkout); §D: persist-credentials
    false on collect/test checkouts, suite through _credential_free_env().'
- id: sr-4
  state: fixed
  body: 'R10 and §D.5: override runs exit non-zero with the re-dispatch command; only a race (or a moved
    base) is superseded and a protection refusal raises as today; the concurrency wording is corrected;
    pushes that start no run are caught by the daily cron.'
- id: sr-5
  state: fixed
  body: '§D lists all six release jobs: prepare also emits durations, collect on the staged sha, test
    x6, split-check, publish, each with a timeout; §B gives timeouts for plan/test/collect/split-check;
    R5 covers the release''s single leg.'
- id: sr-6
  state: fixed
  body: '§D: release.py materialise fetches the bundle, verifies the staged sha against the plan and pins
    refs/remotes/origin/main to the base sha in collect/test; publish materialises before push/finish.'
- id: sr-7
  state: fixed
  body: §B writes the exact single invocation (copy plan, then one --durations-path, least_duration kept,
    addopts cleared the same way for collect), states how -q summary lines are dropped, and requires phase
    1 to check and pin that the controller's file is the uploaded one.
- id: sr-8
  state: fixed
  body: '§E2: the rewritten pin selects by with.name prefix coverage-shard- and asserts --no-cov on the
    3.11 leg''s pytest step; the measurement step is replaced by the durations output.'
- id: sr-9
  state: fixed
  body: §A restates it as a choice (not a hot path, a parallel-run file); moving it is added to follow-up
    §F.1.
- id: sr-10
  state: fixed
  body: 'R2 reworded (no caller can change another''s result); §A: parse_matrix returns cached.model_copy(deep=True),
    so nothing mutable is shared.'
- id: sr-11
  state: fixed
  body: All corrected in §2.5, §D, §E and §4.
