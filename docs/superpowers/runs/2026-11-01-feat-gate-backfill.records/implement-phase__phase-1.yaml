journal:
  - kind: decision
    id: p1-trust-boundary
    title: Only this account's fr:owed-labelled issues are trackers
    body: >-
      Per a security review (R8), trackers are picked only through
      archive_followups.owned_owed_key(issue, viewer_login()); the gate-marker drop of an
      issue: candidate additionally needs the issue to be ours (author + fr:owed label, via
      trackers.is_ours) but not the owed-marker-on-last-line rule, because such an issue's key
      comes from its marker and would never be an issue: candidate. A foreign marker is only
      text, at most a look-alike suggestion.
    phase: 1
  - kind: discovery
    id: p1-agentic-open-phase-source
    title: An open agentic phase of a merged plan cannot come from the plan sweep
    body: >-
      closeout._plan_merged requires every agentic phase landed, so plan_sweep never lists an
      open agentic phase as owed; such a plan:...#pN key arrives only from a journal owed entry
      or an owed-marker issue. gate_for still returns None for it (review).
    phase: 1
  - kind: discovery
    id: p1-spec-slug-includes-date
    title: spec:<slug> keys carry the dated slug
    body: >-
      spec_slug_of drops only a trailing -design, so the key is spec:2026-05-01-thing#step1;
      find_spec matches by that slug over live and implemented specs.
    phase: 1
  - kind: finding
    id: p1-load-flakes
    title: Six wall-clock-sensitive tests failed in a 2h loaded full-suite run, pass alone
    body: >-
      tests/integration/test_run_idle_guard.py::test_it_acts_again_once_the_cursor_has_moved,
      tests/unit/test_records_commit.py::test_a_record_commit_gives_up_on_a_stuck_index_lock_quickly
      (7.15s vs a 5s bound) and four tests in tests/unit/test_run_evidence_visual.py (file mtime
      vs the unit's open time, seconds apart) failed under the shared slot's load. Re-run alone:
      62 passed. No file this phase touches is involved.
    state: open
    review_scope: out
    phase: 1
