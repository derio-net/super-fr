- id: p4-r6
  state: refuted
  body: GitHub's REST issues?labels= filter ANDs its labels, so the single OR query exists only on the
    CLI search path; keeping one read shape across both transports (the cloud driver runs REST-only) beats
    a CLI-only optimisation. The cost stays linear in collected repos either way (2N vs N, same class),
    and paced/partial passes skip carried repos. Revisit if collect quota becomes the bottleneck.
