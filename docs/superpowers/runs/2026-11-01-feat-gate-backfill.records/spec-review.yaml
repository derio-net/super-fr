  body: 'Fixed: §I names GhClient.list_merged_prs_by_label, the keyword-only Forge method, TruncatedList
    gated-prs, Facts.gated_unread/GatedUnread with describe(), the --only carry, and a gated-unread Need.'
- id: sr-6
  state: fixed
  body: 'Fixed: §C reads the merge''s diff locally; a docs/-only PR is planning: true and defaults to
    review (R3).'
- id: sr-7
  state: fixed
  body: 'Fixed: §C.2 reads live and archived cursors through one shared helper (gate_cmd._cursors moved
    onto it), maps row:/spec: candidates via the origin spec and its plans, and reports several merged
    PRs as an ambiguity defaulting to review.'
