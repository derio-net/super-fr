  body: 'Fixed: §I drops a gated_prs entry only when lane_of placed its batch in a lane or its ledger
    is unknown; closed-out batch PRs appear via gated_prs; the row''s verification line names the case.'
- id: sr-4
  state: fixed
  body: 'Fixed: collect dedupes by (repo, number); R13 states one lane, tester first, else devops.'
