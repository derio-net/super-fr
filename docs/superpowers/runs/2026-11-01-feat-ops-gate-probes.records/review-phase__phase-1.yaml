step: review-phase
item: phase/1
outcome: done
journal:
- kind: finding
  id: p1-r1
  title: stage 1 read a merged PR's ops gap from the frozen PR head, so a merged gapped run could never pass (gh#1266 family)
  review_scope: in
  phase: 1
  body: 'evidence: gate.py _refuse_an_ops_gap materialised `head` even when merged; the fake materialise ignored the ref.'
- kind: finding
  id: p1-r2
  title: HostCheckout.materialise ran ls-tree without -z, so non-ASCII paths came back C-quoted and stage 1 aborted
  review_scope: in
  phase: 1
  body: 'evidence: ops_gate_cmd.py materialise, ls-tree --name-only + show per name.'
- kind: finding
  id: p1-r3
  title: materialise leaked its temp dir on GitError, and the caller neither cleaned up nor caught GitError
  review_scope: in
  phase: 1
  body: 'evidence: mkdtemp before ls-tree/show; materialise outside the try in gate.py; GitError missing from the except list.'
- kind: finding
  id: p1-r4
  title: materialise wrote out/rel with no containment check
  review_scope: in
  phase: 1
  body: 'evidence: ops_gate_cmd.py wrote each blob path unchecked.'
- kind: finding
  id: p1-r5
  title: materialise spawned ~2 git processes per blob across all of docs/superpowers/specs
  review_scope: in
  phase: 1
  body: 'evidence: cat-file -e + show per listed blob.'
- kind: review
  id: p1-review-1
  phase: 1
  title: 'phase 1 code review: 5 findings, all in scope, all fixed'
  body: 'Independent read-only reviewer over e397f4f3f..575728bec. Raised p1-r1 (merged-PR deadlock), p1-r2 (non-ASCII paths), p1-r3 (temp-dir leak / GitError escape), p1-r4 (containment), p1-r5 (process count). Confirmed clean: the R2 heuristic, the advisory callers never change an exit code, the `none:` rules and the ops kind 1->2 versioning, and no forbidden file touched. Each finding was verified against the code and fixed with a test.'
resolves:
- id: p1-r1
  state: fixed
  body: 'Stage 1 now materialises `base` (the default branch''s tip once merged, the PR head while open) and the merged refusal says to land the fix on the default branch in a follow-up PR. Tests: test_stage_1_reads_a_merged_prs_gap_from_the_default_branch_tip, test_stage_1_passes_a_merged_pr_once_the_tip_carries_the_fix.'
- id: p1-r2
  state: fixed
  body: 'materialise is now one `git archive --format=tar` read in process; tar keeps names raw. Test: test_the_host_materialises_a_non_ascii_path.'
- id: p1-r3
  state: fixed
  body: 'materialise removes its directory on any exception and re-raises; the caller calls it inside the try, catches GitError and says ''not checked''. Tests: test_the_host_removes_its_scratch_tree_when_git_fails, test_stage_1_reports_a_git_failure_in_the_gap_read_as_not_checked.'
- id: p1-r4
  state: fixed
  body: 'Only regular tar members are written, each resolved and required to be inside the scratch root, else GitError. Test: test_the_host_refuses_an_archive_member_outside_its_tree.'
- id: p1-r5
  state: fixed
  body: One `git archive` per call (plus one cat-file -e per requested top-level path, 4-5 total).
- id: p1-suite-red-outside-the-phase
  state: out-of-scope
  body: 'Not caused by this change: the failures are in timing/lock-sensitive files the phase never touched (run-evidence visual, sentinel liveness, record commit), all pass alone (p1-rerun.log), and appear only under the shared slot''s load average of 350-400. The phase''s suite evidence is CI (`tests: ci`, ci-ok green on PR #1281).'
