  id: sr-6
  title: R1 counts every Test Plan step, including [tester]-tagged ones
  review_scope: in
  body: 'check: codebase/consistency

    target: spec

    evidence: A literal [tester] tag wins (testplan.py:16-29); stage 5 only walks devops steps (holds.py:103-122).'
