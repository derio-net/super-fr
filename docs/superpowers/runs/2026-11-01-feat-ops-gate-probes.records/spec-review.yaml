    target: spec

    evidence: Verification lists four override lines only.'
- kind: finding
  id: sr-11
  title: Recording 2000 chars of probe output as committed evidence widens the third-party leak surface
  review_scope: in
  body: 'check: codebase/consistency

    target: spec

    evidence: mask.py masks secret values only (mask.py:1-8,52-64); stage evidence is committed and pushed (gate.py:417-433).'
