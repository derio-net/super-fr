journal:
  - kind: discovery
    id: settings-policy-source
    phase: 1
    title: "load.py policy source: fully qualified ref by SHA; no HEAD fallback"
    body: "load.py policy source: fully qualified ref by SHA; no HEAD fallback (plan step P1.T3.S1 corrected, security review). Remote default is refs/remotes/<remote>/<name> resolved once to a commit SHA and read with git show <sha>:path; without a remote the local default branch is refs/heads/<init.defaultBranch|main|master>; none found gives defaults with a note. HEAD and the working tree only feed the pending-edit note."
  - kind: discovery
    id: settings-yaml-on-off
    phase: 1
    title: "PyYAML reads bare on/off as booleans"
    body: "The documented values are the words on/off, but yaml.safe_load turns an uncommented `gates: off` into False. The model coerces True/False to on/off before validating, so the init file round-trips."
  - kind: discovery
    id: settings-driven-triage-definition
    phase: 1
    title: "R5 'driven triage scope' is read from .fr/triage.yaml keys"
    body: "TriageConfig has no scope field, so push: ask is refused when the working-tree .fr/triage.yaml sets post_merge, export, version or post_merge_restart (the keys only the unattended batch driver acts on). Rules live in fr.settings.check.RULES as data."
  - kind: discovery
    id: settings-init-comment-convention
    phase: 1
    title: "init prose uses ## so key lines uncomment by dropping one #"
    body: "Prose lines start with ##, key lines with a single # followed by their indent, so removing one # from a key line yields valid YAML and prose stays a comment."
