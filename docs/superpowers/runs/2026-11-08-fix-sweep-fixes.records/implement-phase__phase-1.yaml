journal:
  - kind: discovery
    id: p1-printed-commands-nothing-beyond-r3-r5
    phase: 1
    title: The executing test found no printed command beyond R3-R5 that fails
    body: >-
      With the R3-R5 fixes in place, every `fr` command the backfill dry-run block, the refusal
      hints, the --yes report, `fr gate pass` (dry run, retry line, devops form, discharge lines)
      and the tracker bodies print runs to exit 0 with placeholders filled. Reverting the R5 line
      makes it fail on the discharge command (--walk needs --harness, --model, --strategy), so
      the test bites. `gh issue close` lines are shape-checked only (parsed with shlex, argv
      layout asserted); the scenario runs the link and discharge commands through the installed fr.
  - kind: discovery
    id: p1-shlex-quotes-the-hash
    phase: 1
    title: tracked_rows prints the issue ref shell-quoted
    body: >-
      `shlex.quote` quotes `owner/repo#n` (the `#` is special), so the printed link command is
      `--issue 'example-org/widgets#1'`. That is correct shell, and the test extractor reads it
      with shlex; the R3 unit test pins the quoted form.
  - kind: discovery
    id: p1-error-prefix-false-positive
    phase: 1
    title: Error messages begin with "fr gate backfill:" and are not commands
    body: >-
      The extractor skips a match whose verb or subcommand token ends in a colon (`fr gate
      backfill: spec:...`), because fr prefixes its refusals that way. Without it every
      refusal reads as a command.
  - kind: discovery
    id: p1-retry-line-exit-code
    phase: 1
    title: A failed tracker close still exits 0 from fr gate pass --yes
    body: >-
      `fr gate pass --yes` prints "re-run `fr gate pass ... --yes` to retry the close" when a
      tracker close errors, but exits 0 (only the backfill path raises). The test asserts the
      printed retry line, not an exit code. Not changed here; noted for review.
  - kind: discovery
    id: p1-scenario-gh-double
    phase: 1
    title: printed-commands-run uses its own gh double
    body: >-
      gate-backfill-apply's gh double cannot comment on or read a PR and does not take
      `issue close --comment`; the scenario's double (fixtures/printed-commands-run/bin/gh) is a
      copy extended for those. The acceptance matrix has no row for the scenario yet.
