  phase: 4
  review_scope: in
  title: Repeated scans and reads
  body: Reproduced by the reviewer unless noted in the review entry. One per-run holder index, one journal parse per reader, a --keep pass reuses its reads; the test_p4_r11 tests. debt/engine.py gained an optional journals= for this, with default behaviour unchanged
