  id: p4-yes-beside-a-strangers-marker
  phase: 4
  title: --yes on a plan still at owed files fr's own tracker beside a stranger's marker
  body: The dry run refuses the key (p4-r8), but a plan left at `owed` still files a tracker at --yes. That is the old behaviour for non-issue keys, and the tracker then holds the key, so nothing is lost. Left as is.
