  body: 'p4-keep-on-a-discharged-key: --keep now says the key reads as discharged (p4-r5). p4-another-holders-marker-blocks-the-close: the behaviour stands, and its scan is now the per-run holder index (p4-r11).'
- kind: review
  id: review-phase-4
  phase: 4
  title: 'Phase 4 review: 13 findings, 12 in scope and fixed'
  body: 'A dispatched reviewer ran probe scenarios over real git and the fake client, trying to make fr close what it should not. It could not close a stranger''s issue or act on a forged marker. It did close a tracker on a failing row (p4-r1) and wrote false evidence from another repo''s checkout (p4-r4). p4-r8''s --yes note and p4-r12 were by reading. The executor checked and fixed all twelve test-first; a few tests were not seen failing on the old code, as its return says. Diff size judged justified: about 1270 of 2047 inserted lines at review were tests.'
