journal:
  - {kind: review, id: p5-review-1, title: "Phase 5 review: README front door, reference pages, generated tables", body: "Two separate reviewers: one walked the old README section by section to confirm nothing true was lost and checked the new README, sync-readme.py and its tripwire; the other fact-checked the eight reference pages against install.sh, the code and the CLI help and built the site. The section map held. Twenty-one findings: twenty in scope, all fixed; one out of scope.", phase: 5}
  - {kind: decision, id: p5-skill-summaries-file, title: "The skills table takes its line from a summaries file", body: "A skill's description tells an agent when to load it and reads badly as a table cell. scripts/readme-skill-summaries.yaml holds one line per skill; the sync fails when a skill has none or a line names no skill, and each name links to the explainer that covers it. Spec R21 says so.", phase: 5}
  - {kind: finding, id: p5a-r1, review_scope: in, title: "README says every merge publishes all of docs/", body: "pages.yml publishes only the page sources and only when a merge touches them.", phase: 5}
  - {kind: finding, id: p5a-r2, review_scope: in, title: "sync-readme.py depends on the locale", body: "read_text/write_text with no encoding crash under a C locale.", phase: 5}
  - {kind: finding, id: p5a-r3, review_scope: in, title: "Skill cells read as trigger language", body: "Rows began 'Use when asked...' or were cut mid-clause.", phase: 5}
  - {kind: finding, id: p5a-r4, review_scope: in, title: "CLI rows expose internal wording", body: "A spec id and 'v2 ...' in the Typer help strings.", phase: 5}
  - {kind: finding, id: p5a-r5, review_scope: in, title: "sync-readme.py tracebacks on an unusable skill file", body: "Missing description or front matter raised KeyError/IndexError; split('---') was brittle.", phase: 5}
  - {kind: finding, id: p5a-r6, review_scope: in, title: "README promises a page per skill under Read more", body: "fr-origins, fr-execute and fr-runner are covered inside other pages.", phase: 5}
  - {kind: finding, id: p5a-r7, review_scope: in, title: "README prerequisites omit git, jq, rsync", body: "The installer preflights them.", phase: 5}
  - {kind: finding, id: p5a-r8, review_scope: in, title: "First-run and close-out sentences imprecise", body: "The interview applies only to devcontainer mode without a profile; close-out is a separate session.", phase: 5}
  - {kind: finding, id: p5a-r9, review_scope: in, title: "Small facts dropped with the old README", body: "fr migrate's preview default and flags, fr validate artifacts --kind, two issue pointers.", phase: 5}
  - {kind: finding, id: p5a-r10, review_scope: out, title: "Skill descriptions are trigger-optimised", body: "A design tension in the skills themselves, not caused by this change.", phase: 5}
