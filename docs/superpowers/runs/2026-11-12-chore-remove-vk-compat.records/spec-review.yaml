schema_version: 11
run: 2026-11-12-chore-remove-vk-compat
step: spec-review
outcome: done
journal:
  - kind: finding
    id: sr-1
    review_scope: in
    title: "§3.D: the extra_locators seam does not exist, and the spec does not say which of the runner's four enumerations take it"
    body: |
      `Repair` has no `extra_locators`. `plan_migrations`, `is_stale`, `inspection_failures` and `run_migrations`
      (artifacts/runner.py) each walk `iter_paths_of` (which skips the archive) and funnel through `_actions_for`,
      which stamp-checks first. If `is_stale` does not see the archive the gate never fires for a repo whose only
      carriers are archived, and R11 holds only for a typed `fr migrate artifacts --yes`.
  - kind: finding
    id: sr-2
    review_scope: in
    title: Making the archive visible to the gate lets a frozen file refuse every gated command, and parses every archived _meta.yaml on every invocation
    body: |
      `applies` as specified is one `yaml.safe_load` per archived plan before every non-exempt command. An archived
      file that is invalid YAML or unrewritable becomes a permanent failed action, so `is_stale` is true forever and
      the gate refuses in the refuse and opt-out rows. The spec must state the intended behaviour and the risk.
  - kind: finding
    id: sr-3
    review_scope: in
    title: "R10's rewrite rule corrupts the case it names: a block scalar's header line matches the pattern"
    body: |
      Removing the one column-0 line of `vk_version: >-` leaves the continuation lines behind. Same for a multi-line
      quoted scalar and a duplicated key. Build in memory, re-parse, require equality with the original minus the
      key, raise before writing otherwise; use `read_verbatim`/`split_lines`, not `read_text` (CRLF, BOM).
  - kind: finding
    id: sr-4
    review_scope: in
    title: The spec states its tests nowhere
    body: |
      The tests exist only as one-line reasons under `## Verification`; nothing states the cases R2, R5, R7, R8, R9,
      R13 and R15 are checked by, and sr-3's edge cases have no home. The reviewer asked for a `## Test Plan`.
  - kind: finding
    id: sr-5
    review_scope: in
    title: R2 falsifies a merged acceptance row and has no row of its own
    body: |
      Row `vk-legacy-fallbacks-removed` (status ci) asserts an unmigrated repo fails loudly pointing at
      `fr init migrate`. After R2 the config's env file is simply created. tests/unit/test_isolation.py pins the error.
  - kind: finding
    id: sr-6
    review_scope: in
    title: "R6: dropping `superpowers-for-vk@` from the sibling-repo grep changes installer output, a pinned test seeds that id, and the row's wording is untrue"
    body: |
      Without the grep alternative a machine whose only purged id is `superpowers-for-vk@derio-net` gets a false
      sibling-repo note. The bare-org purge still drops the id, so "performs no purge for them" is not literally
      true. Two comments name it, not one; test_install_marketplace_namespace.py seeds and asserts on the id.
  - kind: finding
    id: sr-7
    review_scope: in
    title: "R3: shipped guidance still tells the user to run bare `fr isolation up`, which will exit 2"
    body: |
      No caller breaks, but remedy messages in isolation_cmd.py, sessions.py, local.py, the two Hermes hooks, the
      OpenCode plugin and the golden fixture guard-verdicts.yaml recommend the bare command.
  - kind: finding
    id: sr-8
    review_scope: in
    title: "R7, R9, R11: tests that pin the old behaviour are not named"
    body: |
      test_plan_validator_wrapper_rename.py's PRE_SWEEP_WRAPPER case; three tests asserting `vk_version` parses and
      an unknown-key test that would pass for the wrong reason; the four archive-exclusion tests stay green only if
      `iter_paths_of` is untouched and CEILING_REPAIR declares no extra locator.
  - kind: finding
    id: sr-9
    review_scope: in
    title: "§2 and §5 say 42 archived plans carry the key; 33 archived `_meta.yaml` files do"
    body: |
      The other archive hits are phase YAML and prose, which the repair does not reach; R12's "carry no vk_version"
      must mean the `_meta.yaml` key.
  - kind: finding
    id: sr-10
    review_scope: in
    title: R14 is garbled, and R14/R15 miss text this change makes false
    body: |
      R14's last clause reads as one more item to change. The "archives are never migrated" claim is also in
      registry.py, runner.py, parser.py and spec.py; render.py names `vk-ready`; types.py says "must update your
      vk_version"; bump-version.py's comment. The fr-vk package's label wording needs a stated disposition.
  - kind: finding
    id: sr-11
    review_scope: in
    title: "R9 changes behaviour for a historical read (`fr status`) and has no acceptance row"
    body: |
      Archived plans are parsed by `compute_status` and gate backfill; both catch the error, so an un-repaired
      archived plan reports as missing, and `fr status` is gate-exempt so it never triggers the repair.
  - kind: review
    id: spec-review
    title: "independent spec review: 11 findings, all in scope"
    body: |
      Decisions d1–d6 are all honoured; the spec decides nothing against them. test_tripwire_artifact_kinds.py does
      not refuse a `Repair.extra_locators` tuple of path globs. Every file, helper and constant the spec names was
      found at a file:line; no other vk-command residue in packages/fr/src, scripts/, plugins/ or .github/ beyond
      sr-6, sr-7 and sr-10. Raised: sr-1 … sr-11.
resolves:
  - {id: sr-1, state: fixed, body: "§3.D now names the helper and a table of what each of the four walks does with archive paths; `iter_paths_of` is untouched; is_stale sees repairable archived carriers."}
  - {id: sr-2, state: fixed, body: "The predicate tests raw bytes before parsing; R12 and §3.D say an unreadable or unrewritable archived file is reported and holds nothing; §5 adds the daemon-checkout and cost risks."}
  - {id: sr-3, state: fixed, body: "R10 and §3.D: read_verbatim/split_lines, exactly one whole top-level line, re-parse and compare before writing, raise otherwise; §6 lists the CRLF, BOM, no-final-newline, block-scalar, multi-line, duplicate-key and flow-mapping cases."}
  - {id: sr-4, state: fixed, body: "Added §6 'Cases the unit tests cover', one line per requirement. Not under the `## Test Plan` heading: fr reads that heading as the operator's post-merge rows, and this run has none (decision d6)."}
  - {id: sr-5, state: fixed, body: "R2 states the file is created; R18 and §3.A amend row vk-legacy-fallbacks-removed and replace the pinned test."}
  - {id: sr-6, state: fixed, body: "R6 reworded to what is true (no code or text naming the retired tool; the generic bare-org purge is unchanged); §3.A states and accepts the note consequence, names both comments and the test edits; the row is reworded."}
  - {id: sr-7, state: fixed, body: "R17 and §3.B: every remedy message names `fr isolation up --branch <branch>`, hooks, plugin and golden fixtures included."}
  - {id: sr-8, state: fixed, body: "§3.A and §3.D name the tests that invert or go; §3.D says CEILING_REPAIR declares no extra locator and iter_paths_of is untouched; §6 adds the counterpart test."}
  - {id: sr-9, state: fixed, body: "§2 and §5 say 33 `_meta.yaml` files; R13 scopes the claim to the `_meta.yaml` key."}
  - {id: sr-10, state: fixed, body: "R15 lists every place; R19 states what stays, the fr-vk package's label wording included."}
  - {id: sr-11, state: fixed, body: "§2 and §3.D state the pre-migration behaviour of `fr status` and gate backfill; R13 requires every archived plan here to parse; new row archived-plans-readable-after-repair."}
