journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: The operator's brief, verbatim
    body: |
      the explainers pages need to be improved. We recently made its creation mechanic and consistent. But it reads as a wiki. I want a front page that can draw users. See this, as inspiration, not to copy: https://www.example.com/product/how-it-works#overview (a third-party product page, address redacted)
  - {kind: decision, id: q1-build-route, title: "Front page built by an own landing template", body: "Operator chose: scripts/build-site.py renders the front page itself from a template in this repo; other pages keep the blog-craft renderer. Rejected: staying in broadsheet Markdown only; a new style in blog-craft."}
  - {kind: decision, id: q2-old-essay, title: "The current essay is kept as its own explainer", body: "Operator chose: the essay moves to its own page, linked from the front page. Rejected: folding it in; deleting it."}
  - {kind: decision, id: q3-audience-cta, title: "Audience evaluators, primary CTA how it works", body: "Operator chose: tech leads deciding whether to trust agents; primary button to the fr-goal explainer, install secondary. Not the recommended option (agent users, Install first)."}
  - {kind: decision, id: q4-structure, title: "Hero plus numbered guarantee sections", body: "Operator chose: hero and CTA, a how-a-run-goes strip, six to eight numbered sections (problem, headline, gain, how, link), all pages, closing CTA."}
  - {kind: decision, id: q5-look, title: "Broadsheet identity at landing scale", body: "Operator chose: reuse the broadsheet fonts, colours and accent; follow the reader's light or dark setting."}
  - {kind: decision, id: q6-scope, title: "Front page plus a shared top bar", body: "Operator chose: the new front page and one small header on every built page; page text is not rewritten."}
  - {kind: decision, id: q7-verification, title: "CI and screenshots, gate developer", body: "Operator chose: unit tests, the CI site build and screenshots pre-merge; one post-merge Test Plan row; gate developer, which holds nothing."}
  - {kind: decision, id: q8-models, title: "Model per tier: haiku, sonnet, opus", body: "old: unbound (mechanical, standard, hard); new: haiku, sonnet, opus on claude-code; reason: unbound; decider: operator; applied with fr models set."}
  - {kind: decision, id: shape-light, title: "Run on fr-goal-light", body: "The asks (landing renderer, essay move, top bar) are one reviewable change to scripts/build-site.py and the front-page source, planned as one agentic phase."}
