journal:
  - kind: discovery
    input: true
    id: brief
    title: Operator brief for the second pass on the front page
    body: |
      "check the published site once the Pages deploy finishes. I'm looking at it but I'm not sure whether the front page is up to date. The DevOps and Tester Gates are relatively new features that are missing. As is the Wave Driver and its pages. I guess that's alright as we didn't discuss further than the one frontpage, which features matter and for whom but I think we could do a better job here. Also, use more diagrams and visualizations. I also find the first page not so catchy, it's pretty generic. I guess that's on me as I confirmed to use the blog-fr's layout but for a front-page we should get a bit more flashy and modern"

      Then: "merged. Let's start with the second pass".
  - {kind: decision, id: q1-audience, title: "Audience: both, in two acts", body: "Act one sells a single trustworthy run to a developer; act two sells running a whole backlog (waves, gates, release) to a lead or operator. decider: operator."}
  - {kind: decision, id: q2-lineup, title: "First-class sections added: exit gates (Tester + DevOps) and the wave driver", body: "Isolation, question round and spec, and independent review stay. Acceptance matrix and cost audit were not picked. decider: operator."}
  - {kind: decision, id: q3-visual, title: "Visual direction: dark, technical, glowing", body: "Near-black canvas, one vivid accent gradient, large tight sans headline, monospace details, terminal-style hero, glassy cards; light variant follows the visitor's setting. Article pages keep broadsheet. decider: operator."}
  - {kind: decision, id: q4-demoted, title: "Acceptance matrix and cost audit move to a compact 'also included' grid", body: "One row of small cards (acceptance matrix, cost audit, debugging, triage board, harnesses), each a line and a link. decider: operator."}
  - {kind: decision, id: q5-motion, title: "Motion: CSS-only animation", body: "Animated diagrams and a typed-out terminal hero in CSS and SVG, off under reduced motion. No JavaScript. decider: operator."}
  - {kind: decision, id: q6-diagrams, title: "Diagrams: run pipeline, gate ledger, wave of batches, isolation boundary", body: "All four, hand-authored inline SVG kept in this repo. decider: operator."}
  - {kind: decision, id: q7-pages, title: "New explainer pages: wave driver and exit gates", body: "Two new pages; the exit-gates page links to the existing DevOps gate page for detail. decider: operator."}
  - {kind: decision, id: q8-headline, title: "Headline kept; the rest of the copy rewritten", body: "Subline, facts and section copy are rewritten for the two-act story. decider: operator."}
  - {kind: decision, id: q9-verification, title: "Verification as in the first pass; gate developer", body: "Unit tests in CI plus browser screenshots (dark, light, phone width, reduced motion) at implement, review and deliver. One post-merge row for the published site. Gate: developer, which holds nothing. decider: operator."}
