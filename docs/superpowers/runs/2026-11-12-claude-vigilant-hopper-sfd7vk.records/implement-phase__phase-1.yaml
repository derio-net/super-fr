journal:
  - kind: decision
    id: landing-no-bar-placeholder
    title: "Landing skeleton has no {{bar}} placeholder"
    body: "The plan listed a {{bar}} placeholder in landing.html, but R8 has insert_bar add the bar to every page including the landing, after the body open tag. A second insertion point would put two bars on the front page, so the skeleton has none; its body carries class landing so bar.css can sit flush there."
    phase: 1
  - kind: discovery
    id: bar-inside-body-padding
    title: "The blog-craft body padding put the bar inside the page margin"
    body: "Blog-craft pages set body padding 3rem 1.25rem, so a plain nav landed inset and crowded the title (seen in the first screenshots). bar.css now uses negative margins to sit flush above the article and a .landing override for the landing, whose body has no padding."
    phase: 1
  - kind: discovery
    id: suite-env-limits
    title: "Full suite not fully runnable here: slow npm installs, seven environment failures"
    body: "tests/integration/test_install*.py, test_scenarios.py and test_bootstrap_sh.py run install.sh, whose npm install of the devcontainers CLI times out in this sandbox (minutes per test, so hours in total); they were excluded from the logged run. The logged run (14663 passed, 132 skipped, 7 failed) fails only tests unrelated to this phase and consistent with the sandbox: four read-only-file or unwritable-cache tests that cannot fail as uid 0 (test_bindings_catalogue, test_bindings_probe, test_artifact_atomic, test_validate_artifacts) and three isolation container verb CLI tests (test_isolation_container_verbs). No file this phase touched is involved; CI is the authority for the excluded and failing tests."
    phase: 1
