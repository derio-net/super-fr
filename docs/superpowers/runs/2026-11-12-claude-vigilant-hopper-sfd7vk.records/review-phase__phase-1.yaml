journal:
  - kind: review
    id: p1-review
    title: "Phase 1 code review: requirements R1-R12 met, two low findings"
    body: "A separate reviewer read the spec, the plan and the diff, ran the focused tests (376 passed) and ruff (clean), built the site with the pinned renderer (29 pages) and took its own screenshots. It found every requirement implemented and tested, the build refusals firing before any file is written, front-matter values escaped, bar links right at each route depth, no script tags, no sideways scroll at 390px, light-scheme contrast above 4.5:1, and the landing copy's spot-checked claims true. It raised p1-r1 and p1-r2, both in scope and both fixed."
    phase: 1
  - kind: finding
    id: p1-r1
    title: "Top bar wraps its last link onto a second row at 390px"
    body: "scripts/site/bar.css: at phone width the GitHub link dropped under the site name, which read as an accident."
    review_scope: in
    phase: 1
  - kind: finding
    id: p1-r2
    title: "The copied palette is only checked for --ink"
    body: "scripts/build-site.py extract_theme_css required only --ink, while the site stylesheets read twelve more properties. A renderer that renamed one would have built a landing with unset colours or fonts instead of failing."
    review_scope: in
    phase: 1
resolves:
  - {id: p1-r1, state: fixed, body: "The phone-width rule tightens the gap and type size; the fresh 390px screenshots of the landing and a guide show all five items on one row, with scrollWidth 390."}
  - {id: p1-r2, state: fixed, body: "THEME_PROPERTIES names every property the stylesheets read; extract_theme_css raises BuildError naming any that are missing. One test refuses a theme missing each of five properties, another pins the tuple to the var() names in scripts/site/*.css."}
