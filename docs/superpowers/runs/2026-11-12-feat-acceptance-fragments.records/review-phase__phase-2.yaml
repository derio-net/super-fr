journal:
  - kind: review
    id: review-phase-2
    phase: 2
    title: "Phase 2 review (migration and cutover): five in-scope findings, all fixed"
    body: |
      Independent reviewer over `git diff ac0a524af..c9d21686f`. Frozen MatrixV5, the
      retiring step, write-once, crash window, edge repos, the chain, and this repo's data
      (617 rows in, 617 out, each placed once by the one-spec rule, every fragment
      `repo: derio-net/super-fr`) all held; no code reader is left on matrix.yaml.
  - {kind: finding, id: p2-r1, phase: 2, review_scope: in, title: "A v4 matrix with a partial committed report set fails the migration commit (4->5 writes reports 5->6 deletes; git add of a vanished path)", body: "Reproduced with only report_local.html tracked."}
  - {kind: finding, id: p2-r2, phase: 2, review_scope: in, title: "The split deletes an untracked report.github.html and lists it as changed, failing the commit", body: "Also silently removed an uncommitted user file."}
  - {kind: finding, id: p2-r3, phase: 2, review_scope: in, title: "The matrix 4->5 hop still validates with the live parse_matrix instead of the frozen MatrixV5", body: "artifact-versioning rule point 2; no tripwire existed for the matrix hops."}
  - {kind: finding, id: p2-r4, phase: 2, review_scope: in, title: "An in-flight branch still editing matrix.yaml has no way forward after this merges", body: "The split refused over existing fragments and the gate then blocked every command; open PRs #1107, #1080, #1079, #476 affected."}
  - {kind: finding, id: p2-r5, phase: 2, review_scope: in, title: "With the archive retarget removed, archived journal path refs dangle and check's warning names a removed fix", body: "Only spec:/plan: refs are logical; the archive-retargets-matrix-refs row text was also false."}
  - kind: decision
    id: matrix-split-carries-in-flight-rows
    phase: 2
    title: An in-flight matrix.yaml is carried over onto existing fragments, never merged silently
    body: |
      When fragments already exist, the 5→6 split adds only the rows whose id their fold lacks,
      each to its spec's fragment (or legacy.yaml) by the one-spec rule, and drops rows the fold
      holds identically. A row the fold holds with different content refuses the matrix,
      byte-identical, naming each id: restore or delete the row, migrate, then re-apply the
      change with `fr acceptance set-status` (later `amend`). The crash window is the same rule:
      nothing to carry, so the matrix is just deleted.
  - kind: decision
    id: archived-refs-resolve-at-read-time
    phase: 2
    title: Path refs under specs/journals/plans resolve at their archived twin at read time
    body: |
      Replaces the removed archive retarget: `check.archived_counterpart` (reusing archive_twin
      and the plans mapping) accepts a same-repo ref whose `implemented/` counterpart exists;
      no fragment is rewritten, so merged rows stay immutable.
