    title: "Phase 3 review (amendments): four in-scope findings, all fixed"
    body: |
      Independent reviewer over `git diff 378340641..4856be6d0`. Amendment bases, --rebase,
      in-place edits of pending rows, the stale-base refusal's network behaviour, the record
      10->11 migration and the scenario held; check on this branch is clean (617 rows).
  - {kind: finding, id: p3-r1, phase: 3, review_scope: in, title: "set-status owner fallback wrote into another feature's merged fragment, contradicting R16 ('its own fragment')", body: "Reintroduced shared-file conflicts (legacy.yaml hotspot); the explainer's 'two different files' sentence became false."}
  - {kind: finding, id: p3-r2, phase: 3, review_scope: in, title: "check compared merged amendments as a multiset, so reordering or inserting above them passed and changed the post-merge fold", body: "Reproduced: walk-owed became unwired, contested after merge."}
  - {kind: finding, id: p3-r3, phase: 3, review_scope: in, title: "branch_refusals silently skipped fetch, immutability and stale checks when the default ref could not be resolved, so CI passed", body: "Contrary to R17 and the CI fail-closed decision."}
  - {kind: finding, id: p3-r4, phase: 3, review_scope: in, title: "Retired-but-contested rows were counted by acceptance status but by no debt reader", body: "status said contested: 1 while fr debt and the digest counted 0."}
  - kind: decision
    id: p3-set-status-feature-required
    phase: 3
    title: "Supersedes p3-set-status-owner-fallback: set-status with no feature refuses; printed post-merge commands name the feature they close"
    body: |
      R16 writes an amendment to the fragment of the feature making it, so the owner fallback
      is gone: `set-status` with no `--feature` and no run refuses, as `amend` does. A
      post-merge walk or issue link belongs to the feature whose gate or delivery it closes,
      so every command fr prints for one carries `--feature` (the run's spec, else the row's
      one origin spec, else a `<spec-slug>` placeholder). legacy.yaml never takes amendments
      by default.
