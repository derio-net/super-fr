journal:
  - kind: review
    id: review-phase-4
    phase: 4
    title: "Phase 4 review (derived reports): seven in-scope findings, all fixed"
    body: |
      Independent reviewer over `git diff 46eead987..f9ed61e76`. Both security fixes held on
      review: GitLab `from_gitlab` maps only confirmed-access-control `private` (and `enabled` on a
      private/internal project) to controlled, everything else unknown, and `pages_allowed` refuses
      every non-controlled answer and exception; `fr acceptance comment` edits only a marker
      comment its own login wrote and posts fresh when the identity is unknown. Tracked-report
      refusal covers new and legacy paths; GitHub Pages jobs gate every later step on the check.
  - {kind: finding, id: p4-r1, phase: 4, review_scope: in, title: "Skipping a Pages deploy leaves the already-published site live; the explainer claimed a repo turned private keeps no public site, and the skip was only a warning", body: "R21's 'no wider than the repo' breaks silently once visibility narrows on a plan whose Pages stay public."}
  - {kind: finding, id: p4-r2, phase: 4, review_scope: in, title: "Scaffolded GitLab pages job ran pages-check with no forge credential, so it could never pass", body: "Fails closed, but the scaffolded feature never works and nothing says why."}
  - {kind: finding, id: p4-r3, phase: 4, review_scope: in, title: "RealGlabClient inferred gitlab.com (Pages access control confirmed) from host=None, which GITLAB_HOST or glab's default host can contradict", body: "A self-managed instance could be assumed to enforce Pages access control without proof."}
  - {kind: finding, id: p4-r4, phase: 4, review_scope: in, title: "GitLab pages job had no needs on acceptance-report, so a failing matrix still published", body: "The GitHub job has needs: matrix."}
  - {kind: finding, id: p4-r5, phase: 4, review_scope: in, title: "pages.yml rendered the folded report from a shallow checkout; the first merged amendment would make every deploy ship the placeholder", body: "fold raises FoldHistoryError on shallow history once a fragment carries amendments."}
  - {kind: finding, id: p4-r6, phase: 4, review_scope: in, title: "Rows describing the removed committed-report behaviour stayed status ci with no retire/reword amendment", body: "Their refs are whole-file, so check could not see the behaviour inside surviving files was gone."}
  - {kind: finding, id: p4-r7, phase: 4, review_scope: in, title: "Leftover committed-report references: .gitattributes LF block, report.py docstrings, stale .test_durations entries", body: "Describes machinery that no longer exists."}
  - kind: discovery
    id: p4-file-level-refs-cannot-go-stale
    phase: 4
    title: "A file-level acceptance ref (no #name anchor) cannot go stale: check only resolves the file"
    body: |
      p4-r6's rows kept `status: ci` after their behaviour was removed because each ref named a
      whole test file that still exists. Name-anchored refs are caught (acceptance-ci-built-reports
      was). Worth a follow-up so a removed behaviour cannot hide behind a surviving file.
resolves:
