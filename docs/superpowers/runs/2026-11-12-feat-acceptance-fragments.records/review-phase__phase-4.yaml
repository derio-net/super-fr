  - {id: p4-r2, state: fixed, body: "d62e056b7: the GitLab pages job sets GITLAB_TOKEN: $FR_PAGES_TOKEN; the init notice names the masked read_api variable and glab-in-image for self-managed hosts; goldens regenerated."}
  - {id: p4-r3, state: fixed, body: "2f32f77ca: access control is confirmed only when the project API answer's web_url host is gitlab.com; GITLAB_HOST/GL_HOST pointing elsewhere, or no web_url, gives unknown. The three new tests were confirmed red on the pre-fix client by the orchestrator."}
  - {id: p4-r4, state: fixed, body: "d62e056b7: needs: [acceptance-report] on the GitLab pages job, asserted in tests."}
  - {id: p4-r5, state: fixed, body: "d62e056b7: fetch-depth: 0 on pages.yml's checkout, asserted in test_pages_workflow."}
  - {id: p4-r6, state: fixed, body: "164a4a006, 0e83725d6, 2186d33b5 reword acceptance-report-formats, acceptance-report-dual, acceptance-report-drift-gate to the derived-report claims; 149b6c80a, db21de751, 221b1ebdb, 4ad379fca retire acceptance-report-dual-gate, acceptance-report-tracked, acceptance-report-cli-regen, acceptance-ci-built-reports; notes cite R20; fr acceptance check passes."}
  - {id: p4-r7, state: fixed, body: "e9fdf227b: .gitattributes removed (it held only the report block), the aggregates=False path removed from report.py with docstrings rewritten, 137 stale .test_durations keys dropped (each verified absent from collection). Path constants and the migration's delete list keep naming the retired files on purpose."}
