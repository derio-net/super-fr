    capability: review lenses
    acceptance: fr ships security, tests, simplicity and errors lenses; a repo's .fr/lenses.yaml can add a lens, replace a shipped lens's text or disable one; fr lenses list, show and check report the effective set and fail a broken config, writing nothing
    origin:
      - spec:2026-11-12-review-lenses#R1
      - spec:2026-11-12-review-lenses#R2
      - spec:2026-11-12-review-lenses#R3
    status: not-implemented
    verify: candidate
    scenario: tests/scenarios/review-lenses-effective-set.sh
  - id: review-lenses-phase-must-declare
    capability: review lenses
    acceptance: A plan fails fr plan self-review when an agentic phase neither applies nor waives every effective lens, or waives one without a reason; a plan written before review lenses, carrying none, passes and is reviewed as before
    origin:
      - spec:2026-11-12-review-lenses#R4
      - spec:2026-11-12-review-lenses#R5
      - spec:2026-11-12-review-lenses#R13
    status: not-implemented
    verify: candidate
    scenario: tests/scenarios/review-lenses-phase-must-declare.sh
  - id: review-lenses-path-rules
    capability: review lenses
    acceptance: Where a repo's path rule requires a lens, a phase planning to touch that path cannot waive it, and a phase review cannot be closed after the phase changed such a path without the lens applied; the refusal names the file, the rule and the lens
    origin:
      - spec:2026-11-12-review-lenses#R6
      - spec:2026-11-12-review-lenses#R7
    status: not-implemented
    verify: candidate
    scenario: tests/scenarios/review-lenses-path-rules.sh
  - id: review-lenses-reviewer-return-checked
    capability: review lenses
    acceptance: The reviewer of a phase is given each applied lens's instruction text and must return, per lens, the changed files it examined and the findings it raised; the review cannot be closed while a lens has no line, a line names no file the phase changed, or a line cites a finding the reviewer did not return, and fr records the outcome itself
    origin:
      - spec:2026-11-12-review-lenses#R8
      - spec:2026-11-12-review-lenses#R9
      - spec:2026-11-12-review-lenses#R10
