  - id: review-lenses-shown-on-pr
    capability: review lenses
    acceptance: The pull request shows, per phase, each applied lens with the files examined and how each finding closed, each waived lens with its reason, and any change the branch made to the repo's lens config; the skills and an operator page tell authors and orchestrators how to use lenses
    origin:
      - spec:2026-11-12-review-lenses#R12
