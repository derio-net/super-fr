schema_version: 12
run: 2026-11-12-feat-code-quality-steps
step: lens-review
outcome: done
journal:
  - kind: review
    id: review-lenses
    global: true
    title: "Lens review (security, errors): three fixed, four refuted with reasons"
    body: |
      One reviewer per lens read the whole diff. Security found that a branch could
      rewrite the brief of a lens its base requires; that is now structural: a feature
      is reviewed under its default branch's lenses. Errors found a silent empty
      shipped set. The rest restate decisions the spec makes on purpose or follow the
      sibling migrations' pattern.
  - kind: finding
    id: l-security-r1
    global: true
    review_scope: in
    title: "a branch's .fr/lenses.yaml can replace the brief of a rule-required lens, or disable an agent-added one"
  - kind: finding
    id: l-security-r2
    global: true
    review_scope: in
    title: "examined: is accepted on any one changed file, and with no remote on any existing path"
  - kind: finding
    id: l-security-r3
    global: true
    review_scope: in
    title: "with unobservable returns the lens return check is skipped, with a weak audit marker"
  - kind: finding
    id: l-errors-r1
    global: true
    review_scope: in
    title: "shipped_lenses() returns {} silently when no shipped lens directory exists"
  - kind: finding
    id: l-errors-r2
    global: true
    review_scope: in
    title: "lens_set silently ignores a missing spec/plan journal or slug"
  - kind: finding
    id: l-errors-r3
    global: true
    review_scope: in
    title: "pr_body._review_lenses turns a LensError into PR-body prose with no refusal"
  - kind: finding
    id: l-errors-r4
    global: true
    review_scope: in
    title: "the journal 3->4 hop reads a parse error as no lens entries"
resolves:
  - id: l-security-r1
    state: fixed
    body: "`fr.lenses.resolve.review_lenses`: a lens effective on the default branch keeps that branch's definition and cannot be disabled by the branch under review; `LensSet.definitions` is what the brief and refusals print; a warning names the lens. Spec 3.A/3.B and the guide amended. Tests in test_lenses_accumulate.py."
  - id: l-security-r2
    state: fixed
    body: "With no remote an examined file must be a git-tracked path of the checkout (test_with_no_remote_an_examined_file_must_be_tracked_here). Accepting a subset of the changed files is the spec's decision (R9): the count is recorded and shown on the PR; fr cannot prove a reading, as the guide says."
  - id: l-security-r3
    state: refuted
    body: "The record already carries `unobserved=reviewer-return` beside `lenses=<lens>=unobserved:...` (test_unreadable_returns_are_noted_and_the_map_still_checked) and the PR section prints \"not observable\". Refusing on a harness that cannot expose returns would make the step unresolvable there; the phase review takes the same posture (spec 3.C)."
  - id: l-errors-r1
    state: fixed
    body: "`shipped_lenses` raises LensError naming where it looked. Test: test_no_shipped_lens_set_is_a_broken_install_not_an_empty_one."
  - id: l-errors-r2
    state: refuted
    body: "A journal that does not exist holds no lens entry: a spec journal is created by its first entry, and `fr lenses status` is legitimately run before a plan exists. A lost plan journal cannot reach the lens review: `journal-check --require-reviews` fails first, and the resolve refuses a missing plan journal."
  - id: l-errors-r3
    state: refuted
    body: "The body states the failure and the LensError's own remedy on the surface a reviewer reads; the same failure already refused `lens-review` and its brief. Raising here would turn a rendering of state into a second, later refusal of `deliver` with a traceback."
  - id: l-errors-r4
    state: refuted
    body: "Identical to the sibling hops `journal_op` and `journal_owed`, by design: an unparseable journal is reported by `fr validate artifacts` (the structure validator), and CI runs it. Changing one hop alone would make the chain inconsistent."
evidence:
  review: review-lenses
  reviewer: "security=aa12fd6dce2d0c01e,errors=a106aa25d32f7f246"
