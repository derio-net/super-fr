schema_version: 11
run: 2026-11-12-feat-code-quality-steps
step: review-phase
item: phase/1
outcome: done
journal:
  - kind: review
    id: review-p1
    phase: 1
    title: "Phase 1 review: R1-R3 met, four small in-scope defects, all fixed"
    body: |
      A separate reviewer read the phase's diff against spec R1-R3. It confirmed the id
      grammar, the config keys, every `check` condition, the read-only exemption, the
      shipped briefs' closing sentence, the wheel copy and its guard, install coverage
      and the scenario. It judged the `_StrictLoader` import acceptable
      (`fr/isolation/scaffold.py` imports the same name). Four findings, all in scope.
  - kind: finding
    id: p1-r1
    phase: 1
    review_scope: in
    title: "shipped_lenses() does not check a manifest's file stem against its lens id"
    body: |
      `fr/lenses/resolve.py`: a copied manifest that kept another lens's id replaced
      that lens in the dict silently. `fr/verification/resolve.py` refuses the same case.
  - kind: finding
    id: p1-r2
    phase: 1
    review_scope: in
    title: "list/show crash on an unreadable config; check crashes on a malformed shipped manifest"
    body: |
      `load_config` and `shipped_lenses` read files bare, so an undecodable
      `.fr/lenses.yaml` gave `list` and `show` a traceback where exit 2 is documented;
      `check_config` read the shipped set outside its `try`.
  - kind: finding
    id: p1-r3
    phase: 1
    review_scope: in
    title: "a config that disables a shipped lens and also defines it passes check"
    body: |
      Contradictory input accepted silently. (The reviewer also said the result is
      labelled `repo`; it is labelled `repo (replaces shipped)`, so that part is wrong.)
  - kind: finding
    id: p1-r4
    phase: 1
    review_scope: in
    title: "PathRule.paths accepts blank glob strings"
    body: |
      An empty or whitespace glob parsed; R6 would consume it in phase 2.
resolves:
  - id: p1-r1
    state: fixed
    body: "`shipped_lenses` raises `LensError` when `path.stem != lens.id`; test `test_a_shipped_manifest_named_for_another_lens_is_refused`."
  - id: p1-r2
    state: fixed
    body: "`fr.lenses.model.read_text` turns OSError/UnicodeDecodeError into `LensError`; `load_config` and `shipped_lenses` use it and `check_config` reads both inside one `try`. Tests: `test_an_undecodable_config_is_a_lens_error`, `test_an_undecodable_file_is_one_problem`, `test_a_malformed_shipped_manifest_is_a_problem_not_a_crash`, `test_an_undecodable_config_makes_list_and_show_exit_2_without_a_traceback`."
  - id: p1-r3
    state: fixed
    body: "`check_config` reports `the file disables and also defines <id>`; covered by a new `test_one_named_problem_each` case."
  - id: p1-r4
    state: fixed
    body: "`PathRule` refuses a blank glob; two new `test_parse_config_refuses` cases."
evidence:
  review: review-p1
  reviewer: a492514b9f1d3b6c9
