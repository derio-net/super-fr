    body: "`_evidence_target` gives the feature target only to a step that declares `lenses`; any other flat journal:plan step keeps the no-target refusal. Test: test_a_flat_plan_journal_step_without_lenses_is_not_a_feature_review."
  - id: p3-r2
    state: fixed
    body: "SKILL.md section 8 names lens-review's resolve as what opens deliver; the light shape's step list includes lens-review; both mirrors re-synced."
  - id: p3-r3
