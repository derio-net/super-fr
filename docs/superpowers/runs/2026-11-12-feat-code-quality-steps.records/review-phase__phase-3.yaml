journal:
  - kind: review
    id: review-p3
    phase: 3
    title: "Phase 3 review: no bypass in the shipped shapes; a custom shape's flat step was weakened, fixed"
    body: |
      A separate reviewer attacked the lens-review gate (R8-R11, R13). Sound on the
      shipped shapes: fewer reviewers than lenses, one id for two lenses, a wrong-lens
      block, a file outside the diff, an early dispatch, a caller-passed `lenses`, an
      unreadable set, adopt/reshape skipping the step. It reproduced the needs cycle
      the executor reported. Seven findings, all in scope, all fixed.
  - kind: finding
    id: p3-r1
    phase: 3
    review_scope: in
    title: "any flat journal:plan step with review evidence got the feature target"
    body: |
      A repo shape's flat step `{emits: [journal:plan], evidence: [findings]}` used to be
      refused (no target) and now resolved with non-lens plan findings open.
  - kind: finding
    id: p3-r2
    phase: 3
    review_scope: in
    title: "fr-goal skill says the last review-phase resolve opens deliver; light list omits lens-review"
  - kind: finding
    id: p3-r3
    phase: 3
    review_scope: in
    title: "spec 3.C still shows needs: [spec, plan, journal:plan], a cycle"
  - kind: finding
