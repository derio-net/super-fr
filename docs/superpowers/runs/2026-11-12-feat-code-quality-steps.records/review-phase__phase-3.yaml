    phase: 3
    review_scope: in
    title: "five refusals or branches of the lens-review gate had no test"
  - kind: finding
    id: p3-r5
    phase: 3
    review_scope: in
    title: "the record template shows reviewer: <id>, not the <lens>=<id> map"
  - kind: finding
