journal:
- kind: review
  id: lens-review-security
  global: true
  title: Security lens review of the whole feature, f90986ffb..HEAD
  body: "Reviewer ab68c1818d5096289 (opus) reviewed the whole diff through the security lens, added by the orchestrator (lens-security-1) because quiet and stealth are privacy guarantees enforced by new hooks, a forge guard and file movers. It found the forge guard, privacy check, hook fr resolution and settings-paths quoting clean, and raised two cross-phase findings (one reproduced) plus a non-security deliver crash under quiet and stealth. All three were fixed at 9f8f44764, 2d50806b5 and 4bb686fdb; the full suite (15923 passed) ran after the last code commit."
- {kind: finding, id: l-security-r1, global: true, review_scope: in, title: "The stealth fr-path push check scanned only the first-parent range", body: "A merged side branch that added then removed an fr file pushed its contents to the target's history (reproduced)."}
- {kind: finding, id: l-security-r2, global: true, review_scope: in, title: "OWNER from the fr branch was printed unvalidated into fr archive --branch suggestions", body: "Whoever can push to fr could plant a shell command in the closeout, debt and status output."}
- {kind: finding, id: lens-pr-body-quiet, global: true, review_scope: in, title: "deliver raised ValueError under quiet and stealth with forge.pr_body minimal", body: "The PR-body path lies outside the product checkout there; no test covered it."}
- kind: decision
  id: lens-push-scan-separate-ranges
  global: true
  title: "The fr-path push scan and the R13/R14 commit checks use separate commit ranges"
  body: "commits_the_push_adds lists every commit the push sends (no --first-parent), excluding the remote's tips read live with ls-remote and refusing when they cannot be read; unpushed stays first-parent for the subject and squash rules. Quiet has no push-time fr-path scan (R23 is enforced where fr commits), so it had no such gap."
- kind: decision
  id: lens-bookkeeping-untrusted
  global: true
  title: "OWNER, BASE, HEADS and stealth state read from fr or tracking are untrusted input"
  body: "Unsafe owners are dropped with a notice that never echoes them, shas must be full hex, and every printed command shell-quotes the branch, since git allows characters a shell interprets."
resolves:
- {id: l-security-r1, state: fixed, body: "9f8f44764: commits_the_push_adds scans every pushed commit against live remote tips; regression tests for the merged add-then-remove, a stale tracking ref and an unreadable remote."}
- {id: l-security-r2, state: fixed, body: "2d50806b5: owner_of validates with unsafe_branch, BASE/HEADS/product_head must be full shas, archive_branch_command shell-quotes; tests in test_placement_bookkeeping_untrusted.py."}
- {id: lens-pr-body-quiet, state: fixed, body: "4bb686fdb: _deliver_pr_gate names the render with _shown_path and commits it through the run-writes seam; tested under quiet and stealth."}
