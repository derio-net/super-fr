journal:
  - kind: review
    id: review-phase-1
    phase: 1
    title: "Phase 1 review (resolver): five in-scope findings, all fixed; one out of scope, filed as #1419"
    body: |
      Independent reviewer over `git diff 0b0585288..9874212ba`. Repo-placement locators are
      byte-identical to the old ones, `fr settings paths` quotes with shlex and exits 2 on bad
      flags and settings refusals, the scenario is wired, docstring exclusion and the stale-entry
      check of the tripwire work, and the change fragment fits the one-PR run. Fixes landed in
      4126c3299, bc85621d4, 9a4b76514, 178adaf56 and 5e7703c67.
  - {kind: finding, id: p1-r1, phase: 1, review_scope: in, title: "Tripwire missed Path(\"docs\") / \"superpowers\", Path(\"docs\", ...), joinpath, segment tuples and \"superpowers/...\" right segments; 7 unlisted modules hardcoded paths and passed", body: "Phase 2's proof (PENDING ends empty) would have gone green with records, usage files and renames still writing into the repo."}
  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "placement-resolver row moved to ci while its acceptance text (all surfaces read the resolver) is not yet true", body: "The report and fr debt would show unpaid debt as paid."}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "space_for took any non-repo placement on any origin/fr as a switch, unvalidated", body: "placement: stealth or foo, or garbage YAML on an unrelated fr branch, made every logical resolve refuse with a misleading message."}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "resolve_logical's absolute return for out-of-repo feature roots made as_path_ref and origin_spec_path emit <repo>:/abs/path refs", body: "Broken refs, and a local home path leaking into derived reports."}
  - {kind: finding, id: p1-r5, phase: 1, review_scope: in, title: "KIND_DIRS lacked directories live code uses (implemented/usage, archived-specs, implemented/audits)", body: "The names fr settings paths prints would have kept moving after phase 6's hooks start reading them."}
  - {kind: finding, id: p1-r6, phase: 1, review_scope: out, title: "branch_slug is not injective (feat/a__b and feat__a/b share a slug), now reused as the quiet/stealth feature id", body: "Pre-existing in isolation's worktree naming; filed as derio-net/super-fr#1419."}
resolves:
  - {id: p1-r1, state: fixed, body: "4126c3299: the tripwire splits every join into segments and flags docs followed by superpowers/acceptance across / chains, Path(), joinpath, os.path.join, other calls and tuples/lists; planted cases for all eight forms; PENDING re-derived 57 -> 64 and every module outside it scanned clean."}
  - {id: p1-r2, state: fixed, body: "bc85621d4: row back to not-implemented with phase 1's unit refs kept; it moves to ci when phase 2 empties PENDING and phase 6 lands the shell side."}
  - {id: placement-resolver-row-ci-ahead-of-shell-side, state: fixed, body: "Same defect as p1-r2, fixed by bc85621d4."}
  - {id: p1-r3, state: fixed, body: "9a4b76514: the switch is parsed by parse_settings_text (servable=False skips only the placement check); quiet is the switch, stealth is refused by R24's rule, unknown values/keys and invalid YAML refuse in the loader's wording, each naming refs/remotes/origin/fr:settings.yaml. An fr branch saying repo, or with no settings.yaml, stays no switch."}
  - {id: p1-r4, state: fixed, body: "178adaf56: a Resolved result (feature root + relative path) and resolve_logical_at; as_path_ref and origin_spec_path always print the relative path; test with a fake out-of-repo feature root asserts no absolute path appears."}
  - {id: p1-r5, state: fixed, body: "5e7703c67: usage-archived, spec-legacy-archived and audit-archived added with shell names; existing values byte-identical; EXPECTED_DIRS updated."}
  - {id: p1-r6, state: out-of-scope, body: "branch_slug predates this plan and its collision already exists for isolation worktrees; tracked as derio-net/super-fr#1419."}
