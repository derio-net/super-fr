journal:
- kind: review
  id: review-phase-3
  phase: 3
  title: Phase 3 (quiet) review, range 42f8384b8..317d6b75e
  body: Reviewer adfe80570b07de75c (opus) raised eleven findings, all in scope. p3-r1 was reproduced end to end (a git add -A commit plus fr push put fr paths on origin's feature branch under quiet). Ten were fixed by the fixer at 79e6272ab..fabd2a27f; p3-r2 is closed by resolving the misclassified implement finding as this plan's debt, fixed in the same range.
- kind: finding
  id: p3-r1
  phase: 3
  review_scope: in
  title: Unconverted writers leak fr files into the product tree under quiet
  body: init_cmd, isolation/scaffold, ops/gate, isolation/rename and ~40 root-joined artifact paths bypassed the resolver, so a git add -A commit and fr push carried fr paths to origin with exit 0.
- kind: finding
  id: p3-r2
  phase: 3
  review_scope: in
  title: quiet-unconverted-writers was misclassified as out of scope
  body: The unconverted writers are this plan's debt (R23), not a pre-existing defect.
- kind: finding
  id: p3-r3
  phase: 3
  review_scope: in
  title: placement-quiet at ci overstated its evidence
  body: The row's acceptance text claimed more than the scenario and unit levels proved.
- kind: finding
  id: p3-r4
  phase: 3
  review_scope: in
  title: registry.iter_paths_of globs only repo_root
  body: Migrate and validate never saw artifacts in the fr worktree.
- kind: finding
  id: p3-r5
  phase: 3
  review_scope: in
  title: A missing placement key skips the sticky check
  body: A marker or state written before quiet existed bypassed the sticky-placement refusal.
- kind: finding
  id: p3-r6
  phase: 3
  review_scope: in
  title: Feature-id collision check compares live branches only
  body: Two branches mapping to one feature id across clones were not caught.
- kind: finding
  id: p3-r7
  phase: 3
  review_scope: in
  title: fr run start lacks --no-fetch and names the wrong remedy
  body: The unreachable-origin refusal named up's flag for a command that had none.
- kind: finding
  id: p3-r8
  phase: 3
  review_scope: in
  title: The shared fr worktree has no lock
  body: Concurrent rerouted commits or pushes from two workspaces could interleave.
- kind: finding
  id: p3-r9
  phase: 3
  review_scope: in
  title: A pre-existing local fr branch is adopted without an ancestry check
  body: An unrelated local fr branch would be used as the artifact branch.
- kind: finding
  id: p3-r10
  phase: 3
  review_scope: in
  title: The apply --to refusal has side effects
  body: It called space_for, creating the fr worktree before refusing.
- kind: finding
  id: p3-r11
  phase: 3
  review_scope: in
  title: The scenario's deletion check is weak
  body: Deleting origin's fr branch was not exercised as the spec's refusal case.
- kind: decision
  id: quiet-placement-bound-vs-repo-config
  phase: 3
  title: "Under quiet, only fr's artifacts move; repo configuration stays on the product branch uncommitted"
  body: Placement-bound means everything under docs/superpowers/** and docs/acceptance/** except the repo-config kinds (workflows, verifications, models.yaml, trackers.yaml, plan-config.yaml). Everything else fr writes (.devcontainer profiles, .claude/agents, .claude/rules, .gitignore, CI workflows, the README badge, .fr/, scripts/validate-plans.sh) is repo configuration; under quiet fr writes it but never commits it, because R23 forbids a chore(fr) commit on a product branch. Commands that can only act on the product branch (fr archive, fr debt archive-pr, fr ops gate, branch rename) refuse with exit 2 before writing.
- kind: decision
  id: quiet-migration-own-feature-only
  phase: 3
  title: "Under quiet, a migration rewrites and commits only the caller's own feature root"
  body: Raised by an automated security review of the p3-r4 fix. The root whose OWNER names the current branch is migrated and committed; other features' stale artifacts are reported and migrate when their own workspace next runs fr. validate artifacts still checks every root. Keeps R23's one-feature-per-commit and never rewrites another live workspace's files (8dca20601).
