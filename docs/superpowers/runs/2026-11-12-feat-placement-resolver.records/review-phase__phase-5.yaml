- {id: p5-r2, state: fixed, body: "b8f366e6e: forge merged-PR read (MergedPrs protocol, ClientMergedPrs over GhClient), merge commit checked on the first-parent line; plain message when unmerged."}
- {id: p5-r3, state: fixed, body: "b8f366e6e: HEADS recorded by fr push; status reads live refs, HEADS and stealth product_head, monotone; archive works for a deleted branch."}
- {id: p5-r4, state: fixed, body: "b8f366e6e: a merged: record supplies no head; a forge-merge record counts offline only when an owned head and the first-parent line corroborate it."}
- {id: p5-r5, state: fixed, body: "b8f366e6e: merged fragments read from the pushed fr commit frozen at the merge; outside_merged_row_edits refuses in-place edits under quiet and stealth."}
- {id: p5-r6, state: fixed, body: "b8f366e6e: heads read from remote_of(default ref)."}
- {id: p5-r7, state: fixed, body: "b8f366e6e: a cache hit with an unpushed record pushes it under the lock, or exits 2 naming it."}
- {id: p5-r8, state: fixed, body: "b8f366e6e: close-out records each plan's resolved directory; debt dates quiet and stealth plans from fr history."}
