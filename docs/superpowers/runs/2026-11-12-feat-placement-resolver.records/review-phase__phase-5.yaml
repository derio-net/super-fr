journal:
- kind: review
  id: review-phase-5
  phase: 5
  title: Phase 5 (merged status) review, range 6bb2acb..f5efed268
  body: Reviewer ad1ee57ed98179b38 (opus) raised eight in-scope findings, four reproduced in scratch repos (a branch fresh from main reading merged, a squash merge never detected, a deleted branch un-merging, a forged record trusted). All eight were fixed at 11a227edb..47b96ff63; the full suite passed (15552 passed) after the last code commit.
- {kind: finding, id: p5-r1, phase: 5, review_scope: in, title: "A feature branch fresh from the default ref read as merged", body: "Its head was an ancestor of main before any work, so its rows entered every matrix and fr archive would record it merged (reproduced)."}
- {kind: finding, id: p5-r2, phase: 5, review_scope: in, title: "Squash and rebase merges were never detected", body: "Only ancestry was tested, so the merge styles this repo and many stealth targets use never read as merged (reproduced)."}
- {kind: finding, id: p5-r3, phase: 5, review_scope: in, title: "Merged status depended on host-local refs and was not monotone", body: "A branch deleted after merge read unmerged on another host, and a commit pushed after the merge un-merged it (reproduced)."}
- {kind: finding, id: p5-r4, phase: 5, review_scope: in, title: "With the branch gone, a merged record's head was trusted", body: "A stale or forged merged: record decided status alone, against R17's cache-is-never-the-truth (reproduced)."}
- {kind: finding, id: p5-r5, phase: 5, review_scope: in, title: "Merged features' fragments were read live from the fr worktree", body: "Later amendments applied at once and in-place edits of merged rows were accepted, so R16 went unenforced under quiet."}
- {kind: finding, id: p5-r6, phase: 5, review_scope: in, title: "Remote branch heads hard-coded origin", body: "A repo whose default ref lives on another remote read no heads."}
- {kind: finding, id: p5-r7, phase: 5, review_scope: in, title: "A quiet archive whose push was refused later reported already recorded with exit 0", body: "The record stayed local and unpushed while the rerun claimed success."}
- {kind: finding, id: p5-r8, phase: 5, review_scope: in, title: "Debt staleness and close-out read plan history from the product branch", body: "Under quiet and stealth the plan lives in fr or tracking history, so every plan read stale. Supersedes p5-debt-stale-quiet-fr-history."}
- kind: decision
  id: merged-base-file
  phase: 5
  title: "BASE is written beside OWNER by a feature root's first fr commit"
  body: Its value is the merge base of HEAD with the default ref, else HEAD, which can only undercount a feature's own commits. A root without BASE is merged only through the forge, with a notice.
- kind: decision
  id: merged-heads-file
  phase: 5
  title: "Under quiet, fr push appends the pushed head to the feature root's HEADS file in the same atomic push"
  body: HEADS is append-only and written only for claimed roots. Stealth keeps product_head in stealth.json as its recorded head and gets no HEADS file. Archive adds the heads it verified, including a forge PR's head.
- kind: decision
  id: merged-status-rule
  phase: 5
  title: "Merged by git when any recorded or live head is on the default ref and past BASE; else the forge's merged PR; else unmerged"
  body: The position is the earliest introducing first-parent commit, and status is monotone. A forge PR counts only when its merge commit is on the default ref's first-parent line and not inside BASE.
- kind: decision
  id: merged-forge-read
  phase: 5
  title: "The merged-PR read is a forge read, reached only from fr archive --branch and fr acceptance status"
  body: "It is allowed under stealth (a read). The fold, close-out and debt never read the forge; a squash merge reaches the fold through archive's pr: record, corroborated by owned HEADS. Fork PRs and PRs with another head name are ignored; a local-path origin has no forge."
- kind: decision
  id: merged-no-git-fallback
  phase: 5
  title: "No patch-id or tree-equivalence fallback for squash detection"
  body: Matching content could mark an unmerged feature merged, so without the forge a squash merge reads unmerged and fr says the forge is needed and why it was not read.
- kind: decision
  id: merged-freeze-by-time
  phase: 5
  title: "A merged feature's fragments are frozen at its last pushed fr commit at or before the merge commit's committer time"
  body: Computed on every read from origin/fr or the tracking upstream, not stored in the record. Clock skew between hosts is a known limit.
resolves:
