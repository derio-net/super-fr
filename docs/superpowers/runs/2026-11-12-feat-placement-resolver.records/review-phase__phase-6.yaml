journal:
- kind: review
  id: review-phase-6
  phase: 6
  title: Phase 6 (hooks, OpenCode plugin, Hermes) review, range 6a400f6..ae7bf18de
  body: "Reviewer ae531c0ff80f9ed22 (opus) returned not ready with nine in-scope findings, four reproduced (a repo-planted fr run by the bash edit hook, a non-canonical quiet switch failing open without fr, a 9x slower plain-repo decision, a hook creating the fr branch and worktree). All nine were fixed at 53d0569a6..77435bb1c; the full suite (15817 passed) and bun test (285 pass) ran after the last code commit. Running the new scenario from the workspace mutated it (HEAD switched to main, a seed commit on local main, a push to origin started); the reviewer killed the push before anything reached the remote and restored every ref, verified by the orchestrator."
- {kind: finding, id: p6-r1, phase: 6, review_scope: in, title: "The bash library spawned fr settings paths, untimed, on every decision in every plain repo", body: "Measured about 70 ms to 610 ms per edit or terminal decision."}
- {kind: finding, id: p6-r2, phase: 6, review_scope: in, title: "The bash fr lookup honoured relative PATH entries; a repo-planted bin/fr ran in the edit hook", body: "Reproduced; a new code-execution path the TypeScript side already refused."}
- {kind: finding, id: p6-r3, phase: 6, review_scope: in, title: "A non-canonical spelling of the quiet switch was not fr-enabled when fr was absent or refused", body: "Quoted, commented, flow or indented placement: quiet let a base-clone edit through (reproduced)."}
- {kind: finding, id: p6-r4, phase: 6, review_scope: in, title: "Hooks called fr settings paths, which under quiet creates the fr branch and worktree", body: "The session-start nag did it for every quiet repo (reproduced)."}
- {kind: finding, id: p6-r5, phase: 6, review_scope: in, title: "placement-fr-enabled.sh mutated whatever repo it ran in", body: "Run from the workspace it committed onto local main and started a push to origin."}
- {kind: finding, id: p6-r6, phase: 6, review_scope: in, title: "The tripwire's fr-paths-fallback exemption was self-asserting and unpinned", body: "Any new hard-coded path passed by carrying the marker; _ts_code stripped // inside strings."}
- {kind: finding, id: p6-r7, phase: 6, review_scope: in, title: "The plans test runs always, not only when fr is absent (spec 3.E)", body: "Safer than the wording; record the deviation."}
- {kind: finding, id: p6-r8, phase: 6, review_scope: in, title: "The nag's no-process-spawn contract became false", body: "placementEnabled spawned git twice before the early exit, in both engines."}
- {kind: finding, id: p6-r9, phase: 6, review_scope: in, title: "The plugin's frPaths inherited FR_REPO_ROOT", body: "fr could answer for another repo than the toplevel judged."}
- {kind: finding, id: p6-relative-path-git-and-bare-fr, phase: 6, review_scope: out, title: "The git lookup and two bare fr spawns still trust relative PATH entries", body: "fr_git_resolve, git.ts onPath, fr-worktree-create.sh and pin.ts predate this branch; tracked by derio-net/super-fr#1429."}
- kind: decision
  id: p6-r3-canonical-word
  phase: 6
  title: "A valid fr-branch switch is one column-0 line placement: <word>; fr refuses any other spelling"
  body: "The hooks read placement: repo, or no placement line, as repo and everything else, stealth included, as fr-enabled, so fr and the hooks agree on what a switch is and the hooks fail closed on the rest."
- kind: decision
  id: p6-r3-text-scan
  phase: 6
  title: "Neither hook engine parses YAML; a live line naming placement counts as naming the key"
  body: "Such a line inside another value gives a harmless false enabled, never a false not-enabled."
- kind: decision
  id: p6-r1-git-kept
  phase: 6
  title: "The filesystem ref check only gates the fr spawn and the nag; the edit gate's switch read still uses git"
  body: "A wrong filesystem answer (a GIT_DIR override, say) can therefore never make a repo not enabled."
- kind: decision
  id: p6-r2-pin-identity
  phase: 6
  title: "FR_HARNESS_FR is used as the fr to run only when it is an absolute path to an executable file"
  body: "It normally holds an identity string; otherwise absolute PATH entries decide."
- kind: decision
  id: p6-r4-no-create
  phase: 6
  title: "fr settings paths --no-create computes paths without creating anything, and every hook uses it"
  body: "Under stealth it also skips the reachability check and sync and does not refuse a missing tracking worktree. validate-plans.sh, a plan validator rather than a hook, keeps the creating form."
- kind: decision
  id: p6-r5-fresh-fixture
  phase: 6
  title: "Placement scenarios refuse unless run at the toplevel of a repo with no commits and no remote"
  body: "That is how test_scenarios.py and fr verification walk hand a scenario its directory."
resolves:
- {id: p6-r1, state: fixed, body: "9c76f07d3, 141a2545d: enabled from direct checks only; fr asked only when an origin/fr ref is on the filesystem, bounded by FR_PATHS_TIMEOUT; a plain repo spawns no fr (tested)."}
- {id: p6-r2, state: fixed, body: "9c76f07d3, 141a2545d: fr resolved from an absolute FR_HARNESS_FR path or absolute PATH entries only, exact path spawned, in the decision library and both nags; planted relative-entry fr ignored (tested in both engines)."}
- {id: p6-r3, state: fixed, body: "53d0569a6 (fr refuses non-canonical switch spellings), 9c76f07d3, 141a2545d (hooks treat anything but placement: repo as enabled); every spelling tested with fr absent."}
- {id: p6-r4, state: fixed, body: "53d0569a6, 9c76f07d3, 141a2545d: fr settings paths --no-create, used by every hook; no branch or worktree created (tested)."}
- {id: p6-r5, state: fixed, body: "2b4f7e481: scenario_require_fresh_repo guards all five placement scenarios (tested)."}
- {id: p6-r6, state: fixed, body: "71285b8f6: exempt lines pinned in FALLBACK_LINES; string-aware _ts_code."}
- {id: p6-r7, state: fixed, body: "2b05e1e92: decision p6-plans-test-always records the safer deviation; code unchanged, spec not edited."}
- {id: p6-r8, state: fixed, body: "9c76f07d3, 141a2545d: both nags look only when a marker or an origin/fr ref is on the filesystem; comments corrected; tested."}
- {id: p6-r9, state: fixed, body: "141a2545d: frPaths spawns with FR_REPO_ROOT set to the toplevel; tested."}
