- kind: review
  id: review-phase-7
  phase: 7
  title: Phase 7 (placement moves and drift) review, range 91fc8ddc9..da9e43d35
  body: "Reviewer a15b49e54527c00f8 (opus) returned not ready with seven in-scope findings and one spec-level one, three reproduced (a resumed move losing a feature merged meanwhile, a move killed between the switch commit and its push stuck for good, drift refusing the move's own PRs and deadlocking quiet to repo). It confirmed no force push, nothing pushed to the default branch, synthesised merged records that cannot mark an unmerged feature merged, and the feature-id and symlink fixes. All seven were fixed at 65b6a59bd..dc8382478 with two automated security follow-ups (case-insensitive and NTFS-stream .git spellings); the full suite (15909 passed) ran after the last code commit."
- {kind: finding, id: p7-r1, phase: 7, review_scope: in, title: "A move resumed after the default ref moved lost the features merged meanwhile", body: "source_sha was pinned at copy and never re-checked (reproduced: a gamma row missing from the quiet fold)."}
- {kind: finding, id: p7-r2, phase: 7, review_scope: in, title: "A step killed between its commit and its push could not be completed by a re-run", body: "The switch re-committed from origin/fr and failed for good; migrate-branch left commits unpushed (reproduced for the switch)."}
- {kind: finding, id: p7-r3, phase: 7, review_scope: in, title: "branch_drift refused the move's own removal and copy-to-repo branches in CI", body: "Deletions counted as drift; the move from quiet to repo deadlocked (reproduced)."}
- {kind: finding, id: p7-r4, phase: 7, review_scope: in, title: "Verify's validation leg compared identical bytes", body: "The destination layout and its synthesised bookkeeping were never validated, against R27."}
- {kind: finding, id: p7-r5, phase: 7, review_scope: in, title: "migrate-branch and --run copied any path from fr or the tracking repo into the product branch", body: "A planted workflow or .gitattributes would be committed and pushed."}
- {kind: finding, id: p7-r6, phase: 7, review_scope: in, title: "A quiet-to-stealth move left live quiet branches to migrate-branch, which pushed their fr files to the target", body: "Against R24; supersedes the executor's out-of-scope p7-quiet-to-stealth-live-branches."}
- {kind: finding, id: p7-r7, phase: 7, review_scope: in, title: "Drift detection failed open silently in a CI checkout without origin/fr or the default ref", body: "A shallow checkout checked nothing."}
- {kind: finding, id: p7-r8, phase: 7, review_scope: out, title: "migrate-branch's own removal commit leaves fr files and chore(fr) commits in branch history", body: "Follows from R28's wording against R23/R24; a spec decision, tracked by derio-net/super-fr#1430."}
resolves:
- {id: p7-r1, state: fixed, body: "65b6a59bd: the copy records its source digest; verify and switch re-copy when it moved (bounded, then refuse naming the re-run); the removal branch covers the final copy."}
- {id: p7-r2, state: fixed, body: "65b6a59bd, b0f803ae2: the switch decides from the local fr and pushes an existing switch commit; migrate-branch pushes pending commits and records repo only when nothing is unpushed; kill tests inside each step."}
- {id: p7-r3, state: fixed, body: "b0f803ae2: --diff-filter=d; the copy branch into repo recognised structurally against the merged features on fr (decision p7-r3-return-copy-structural)."}
- {id: p7-r4, state: fixed, body: "65b6a59bd: verify validates each destination feature root plus a bookkeeping check whose bytes must equal what the move synthesised; a corrupted merged.yaml fails verify."}
- {id: p7-r5, state: fixed, body: "65b6a59bd, b0f803ae2, 016cf4e3f, bb102f5df, 5a8ed3b2c: only placement_bound paths copied, exact and case-sensitive; .git-like components refused as git's verify_path reads them (case, HFS-ignorables, NTFS short names, any colon), in every direction."}
- {id: p7-r6, state: fixed, body: "65b6a59bd, b0f803ae2: quiet-to-stealth refuses while any quiet feature is unmerged (checked before state and at switch); _into_repo refuses a stealth workspace and a move to stealth in progress."}
- {id: p7-r7, state: fixed, body: "b0f803ae2, c6ec70d17: in CI a shallow checkout or a missing default ref refuses naming fetch-depth: 0, elsewhere a warning; the validate-artifacts job fetches full history."}
- {id: p7-r8, state: out-of-scope, body: "Follows from R28's wording, not this code; plan 3 may not change a requirement. Tracked by derio-net/super-fr#1430 for a spec decision."}
