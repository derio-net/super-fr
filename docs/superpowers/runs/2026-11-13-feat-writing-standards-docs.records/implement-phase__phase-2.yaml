- kind: discovery
  id: p2-acc-components-gh-host
  title: 'accuracy: components.md said gh is not pointed at a self-hosted host (corrected)'
  body: 'Claim: components.md:64-65 (merge base) "`gh` and `tea` are not pointed at a self-hosted host
    yet, and fr warns instead of pretending". Code: packages/fr/src/fr/hostclient.py:344-364 passes a
    declared GitHub host to the client and warns only for gitea; packages/fr/src/fr/gh.py:131-152 (`host_env`)
    sets `GH_HOST` and raises GhHostRefusedError for a host gh is not logged into. Correction (4d47e37f3):
    fr passes a declared GitHub Enterprise `host:` to gh as `GH_HOST` and refuses a host gh is not logged
    into; tea is not pointed at a self-hosted host, and fr warns when a Gitea `host:` is declared.'
  phase: 2
- kind: discovery
  id: p2-acc-components-vk-source
  title: 'accuracy: components.md named the BloopAI VK server and npx (corrected to install.sh)'
  body: 'Claim: components.md:46-47 linked github.com/BloopAI/vibe-kanban and `npx vibe-kanban@latest
    --mcp`. Code: scripts/install.sh:116 (`VK_MCP_BINARY=$HOME/bin/vibe-kanban-mcp`), :501-506 (absent
    binary: warning, MCP setup skipped, "see https://github.com/derio-net/vibe-kanban"), :816-822 (registers
    that binary); packages/fr-vk/src/fr_vk/_mcp_client.py:39-47 falls back to `npx -y vibe-kanban@latest
    --mcp` when `vibe-kanban-mcp` is not on PATH. Settled by following install.sh (brief): the link now
    points at derio-net/vibe-kanban, the page names the installer''s binary and keeps the fr-vk npx fallback.
    Commit 4d47e37f3.'
  phase: 2
