    were NOT removed; the marketplace registration and enabledPlugins (:527-551) and the fr CLI stay.
    Correction (cb73793da): names what it removes and that the plugin registration in ~/.claude/settings.json
    and the fr CLI must be removed by hand.'
  phase: 2
