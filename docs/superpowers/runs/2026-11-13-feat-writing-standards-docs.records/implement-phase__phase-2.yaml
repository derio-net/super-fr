  id: p2-acc-dispatch-labels-off
  title: 'accuracy: dispatch-lifecycle.md said fr apply skips label writes under forge.labels: off (corrected)'
  body: 'Claim: dispatch-lifecycle.md:44-47 "neither `fr apply` nor the bridge writes any of these labels".
    Code: packages/fr/src/fr/commands/apply_cmd.py:277-285 calls `require_forge(plan_root, "issues")`
    and `(…, "labels")` (settings/__init__.py:157-163 raises ForgeQuietError, a ServicesError) and returns
    exit 2 under `--yes`; only the bridge skips writes (packages/fr-dispatch/src/fr_dispatch/__init__.py:360-371
    `_quiet_filtered`, :580-591 the fr:synced stamp). Correction (e61091355): the bullets describe the
    bridge only, plus "Under either setting, `fr apply --yes` refuses (exit 2) and names the setting."'
  phase: 2
- kind: discovery
  id: p2-acc-dispatch-repos-save
  title: 'accuracy: dispatch-lifecycle.md said repos sync always saves names to the manifest (corrected)'
  body: 'Claim: dispatch-lifecycle.md:74-75 "Names you pass are appended to that manifest unless you add
    `--no-save`". Code: packages/fr/src/fr/commands/repos_cmd.py:118 `if yes and not no_save:` — a preview
    never saves. Correction (e61091355): "With `--yes`, names you pass are appended…".'
  phase: 2
- kind: discovery
  id: p2-acc-hermes-same-scripts
  title: 'accuracy: hermes.md said the Hermes isolation guards are the Claude Code scripts (corrected)'
  body: 'Claim: hermes.md:50-51 "Hermes runs shell hooks over the same block protocol as Claude Code,
    so the isolation guards are the same scripts." Code: .hermes/config.snippet.yaml:11-21 registers hermes/fr-isolation-required.sh,
    hermes/fr-isolation-guard.sh and hermes/fr-merged-pr-push-guard.sh; plugins/super-fr/hooks/hermes/fr-isolation-required.sh:6,26
    emits `{"decision":"block",…}`; hermes/fr-isolation-guard.sh:2-9 is marker-based, not pipeline-sentinel-based,
    and shares the decision library. Only fr-acceptance-nag.sh is the same script. Correction (a057184df):
    Hermes accepts a Claude-Code-style block decision, super-fr ships Hermes versions that share the decision
    library, and the Hermes shell guard judges by the workspace marker on every git/gh mutation, not only
    while a pipeline is live.'
  phase: 2
