  title: 'accuracy: install.md said --uninstall removes what the installer added (corrected)'
  body: 'Claim: install.md:83 "`scripts/install.sh --uninstall` removes what the installer added for each
    harness". Code: scripts/install.sh:223-296 removes the Claude rules, fr''s WorktreeCreate/WorktreeRemove
    hooks, the vibe_kanban MCP entry, the OpenCode skills/commands/agents/plugin (and its cli.json entry),
