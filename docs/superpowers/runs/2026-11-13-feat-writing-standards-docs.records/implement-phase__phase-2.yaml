    guards". Code: the directory holds fr-isolation-guard.sh, fr-isolation-required.sh and fr-merged-pr-push-guard.sh
    (.hermes/config.snippet.yaml:13-21). Correction (4d47e37f3): "…of the isolation guards and the merged-PR
    push guard".'
  phase: 2
