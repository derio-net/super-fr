  id: p3-acc-cloud-doctor-fix
  title: 'accuracy: cloud-setup.md said fr cloud doctor prints every fix (corrected)'
  body: 'Claim: cloud-setup.md:52 (merge base) "`fr cloud doctor` lists every prerequisite above with
    its state and fix". Code: packages/fr/src/fr/commands/cloud_cmd.py:28-32 prints ok/FAIL, name and
    detail for every check, `fix:` only for a failing one; :37-42 then prints the remedy block in a cloud
    session for the failed items other than merge_method. Correction (542d8890a): prints the fix for each
    one that fails, exits 1 when any fails, and in a cloud session prints the remedy block for the failed
    ones other than the merge method.'
  phase: 3
