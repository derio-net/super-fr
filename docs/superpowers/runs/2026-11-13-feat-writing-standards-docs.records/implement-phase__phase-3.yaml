  id: p3-acc-cloud-remedy-agents
  title: 'accuracy: cloud-setup.md said an fr command blocked on the agents artifact ends with the remedy
    block (corrected)'
  body: 'Claim: cloud-setup.md:54-56 an fr command that fails for a GraphQL 403, a worker blocked on the
    `agents` artifact, or a newer cursor "ends with one block". Code: only gh.py:238 (GraphQL 403) and
    run/model.py:589 (newer cursor) note the remedy that cli.py:142-145 prints at the CLI boundary; the
    agents case is triage/batch_dispatch.py:50-55 (`worker_remedy`) quoted in the worker''s BLOCKED needs_action
    (:110-111). Correction (542d8890a): the 403 and the newer cursor end with the block; a worker blocked
    on the `agents` artifact quotes the same block in its `needs_action`.'
