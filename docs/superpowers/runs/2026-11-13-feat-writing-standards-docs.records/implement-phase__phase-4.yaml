    rows, acceptance/model.py:47,54-57 (a DEBT_STATUSES status or contested); commands/acceptance_cmd.py:393-415
    reads no `verify`. record/pr_body.py:1135-1138 renders separate `## Pre-merge verification owed` and `## Post-merge
    verification owed`; plugins/super-fr/verifications/{candidate,client-live,prerelease}.yaml are `when: pre-merge`,
    only live.yaml is post-merge. Correction (cce064d24): the PR body lists a post-merge (`live`) row under Post-merge
    and a pre-merge one under Pre-merge; `fr acceptance status` lists it only while its status is debt or the row
    is contested.'
  phase: 4
- kind: discovery
  id: p4-acc-acceptance-weekly-issue
  title: 'accuracy: fr-acceptance.md said CI keeps a weekly "Acceptance debt" issue from fr acceptance digest (corrected)'
  body: 'Claim: fr-acceptance.md:218-219 "keeps a weekly ''Acceptance debt'' issue up to date from `fr acceptance
    digest`". Code: .github/workflows/acceptance-report.yml:10-11,86-94 and acceptance/scaffold.py:438-524 (DEBT_STEP_*):
    the weekly job runs `fr debt issue --yes` (one `<repo>: Technical debt` issue) and `fr debt archive-pr --yes`;
    debt/render.py:178-180 `acceptance_section` is the `## Acceptance debt` section `fr acceptance digest` re-renders.
    Correction (cce064d24): a weekly run upserts one `<repo>: Technical debt` issue (`fr debt issue`) whose Acceptance
    debt section is what digest renders, and refreshes a draft PR that archives long-merged plans.'
  phase: 4
- kind: discovery
