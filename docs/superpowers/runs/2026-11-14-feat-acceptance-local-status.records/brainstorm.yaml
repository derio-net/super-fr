journal:
- kind: discovery
  input: true
  id: operator-brief
  title: 'Operator brief: issue #1453 and goal text'
  body: "Goal: Implement derio-net/super-fr#1453: a `local` acceptance status for rows verified by automated\
    \ tests in a repo with no CI. Context: the gap was found on a live quiet-placement walk whose run\
    \ is held at deliver until this ships, so deliver must be able to accept `local` under ci none. Take\
    \ it to a draft PR, wait for CI, report; do not mark it ready or merge.\n\nIssue title: acceptance:\
    \ a `local` status for rows verified by automated tests in a repo with no CI\n\n## Problem\n\nIn a\
    \ repo with no CI (`ci: none` chosen in the question round), a row verified by a passing, automated\
    \ unit test can only be `unwired`. `unwired` is debt, so `deliver` refuses:\n\n```\nrow <id> — unwired,\
    \ neither gated nor tracked\n  fix: fr verification set --run <run> --row <id> --gate tester --reason\
    \ \"<why it waits for a live walk>\"\n```\n\nThe only fix fr offers is a post-merge tester gate with\
    \ a \"live walk\" reason. That reason is false (the row does not wait for a walk; its test exists\
    \ and passes), and it adds a gate the operator did not ask for. Under quiet (`forge.issues: off`)\
    \ tracking the row by an issue is closed too, and `ci` or `manual` would misstate how the row is verified.\
    \ So a repo with no CI cannot deliver even the smallest unit-tested feature honestly.\n\nFound on\
    \ the Quiet walk of spec `2026-11-04-repo-feature-settings` (Test Plan step 1), fr `7.0.0-rc.5`.\n\
    \n## Proposal: a `local` status\n\n`local` means: automated, and runs on demand on any checkout, but\
    \ no CI runs it. It sits beside `walked`:\n\n| | `walked` | `local` (new) | `ci` |\n|---|---|---|---|\n\
    | What it proves | it ran successfully at least once | an automated test anyone can run at any time\
    \ | it runs on every PR |\n| Evidence | a recorded walk | a test level ref, plus a passing suite log\
    \ covering the tree | CI gate checks |\n| Debt? | no | no | no |\n\nRules it needs:\n\n- **Earned,\
    \ not declared.** A row moves to `local` only with a test-level ref and a recorded local suite log\
    \ covering that tree. `deliver`'s `evidence: {tests: <log>}` already checks that the log is newer\
    \ than every code path on a clean committed tree; `deliver` accepts `local` only when that check holds.\n\
    - **The referenced test must exist.** A level ref naming a missing file or test is refused.\n- **It\
    \ goes stale like any evidence.** When later work changes the code with no fresh log, `fr acceptance\
    \ check` flags the row.\n- **CI promotes it.** When the repo gains CI, a `local` row is something\
    \ to promote to `ci`.\n- **`deliver`'s refusal offers it.** Under `ci: none`, the leftover-row refusal\
    \ suggests `local`, not only a tester gate.\n\n`local` is not in `DEBT_STATUSES`. It is a new value\
    \ of a row's status, so the acceptance-fragment kind needs the stamp bump, migration and validator\
    \ the artifact-versioning rule asks for.\n\n## Acceptance\n\nIn a repo with no CI, a feature whose\
    \ rows are covered by passing local tests delivers with those rows `local`, with no tester gate and\
    \ no issue; `fr acceptance status`, `fr debt`, the report and the digest list `local` rows and do\
    \ not count them as debt.\n"
- kind: decision
  id: q1-earning
  title: 'Q1: a row earns local at deliver'
  body: 'Operator chose ''Bound at deliver'': any writer may set local when level refs resolve; deliver
    refuses unless its own tests evidence is a verified local log (or reuse of one) and stamps each row
    with tree and date. decider: operator'
- kind: decision
  id: q2-staleness
  title: 'Q2: stale when its test files change'
  body: 'Operator chose ''Its test files changed'': stale when a file named by the row''s level refs changed
    since the stamp. decider: operator'
- kind: decision
  id: q3-severity
  title: 'Q3: a stale local row counts as debt'
  body: 'Operator chose ''Counts as debt'' (not the recommended warning): debt whatever its status, like
    a contested row, until a fresh stamp. decider: operator'
- kind: decision
  id: q4-with-ci
  title: 'Q4: refuse new local with CI, existing local is debt'
  body: 'Operator chose ''Refuse new, debt existing'': setting local refused while CI exists; existing
    local rows count as debt, listed ''promote to ci''. decider: operator'
- kind: decision
  id: q5-verify
  title: 'Q5: candidate strategy with a scenario'
  body: 'Operator chose ''candidate + scenario'': unit tests in CI plus tests/scenarios/acceptance-local-status.sh.
    decider: operator'
- kind: decision
  id: q6-post-merge
  title: 'Q6: post-merge row gated tester'
  body: 'Operator chose ''Row, gate tester'': a verify: live row for the held quiet walk, gated tester.
    decider: operator'
