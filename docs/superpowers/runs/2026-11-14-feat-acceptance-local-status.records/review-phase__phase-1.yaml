journal:
- kind: review
  id: review-p1
  phase: 1
  title: 'phase 1 review: 2 findings (2 in), both fixed, plus one fold crash found while testing the fix'
  body: 'A code reviewer in a separate context, read-only, checked 616aa8cb3..HEAD (packages/, tests/) against spec R1, R2, R3, R5, R7 and §A-§C, and reproduced p1-r1 on a scratch fixture. Fixes are in edfdd9ade (p1-r1, plus the unhashable stamp the new merged-path test exposed) and c61b989cb (p1-r2). ruff and mypy are clean, and 1649 targeted acceptance/record/fold/debt/triage/gatebackfill/migration tests pass.'
- kind: finding
  id: p1-r1
  phase: 1
  review_scope: in
  title: a status-unchanged write (link-only --issue, note) on a local row drops its stamp and re-runs local_error, so a fresh row becomes unstamped debt and the write is refused once the repo has CI
  body: Raised by the phase 1 reviewer (record/apply.py pending Row rebuild, the merged move() set-status amendment, local_error on every local write).
- kind: finding
  id: p1-r2
  phase: 1
  review_scope: in
  title: no test pins that a git ls-tree failure reads as debt, and the stale reason then names an unchanged file
  body: Raised by the phase 1 reviewer (acceptance/local.py head_blobs).
- kind: finding
  id: p1-fold-stamp-unhashable
  phase: 1
  review_scope: in
  title: a stamped set-status amendment is unhashable (LocalStamp.files is a dict), so the fold's Counter crashes on the first fragment deliver stamps
  body: Found by the orchestrator while writing the merged-path test for p1-r1. Every fr command that folds the matrix would have raised TypeError once phase 2 stamped a merged row's amendment.
- kind: discovery
  id: p1-review-handoff-p2
  phase: 2
  title: 'For phase 2: head_blobs now returns None when git cannot read HEAD; the fold keeps an already-local row''s stamp'
  body: |
    - `fr.acceptance.local.head_blobs(root, paths) -> dict[str, str] | None`: None means git could not read HEAD (not a repo, no commit). `_deliver_local_stamp_plan` must refuse on None, not build a stamp with empty files.
    - `fr.acceptance.fold._stamp_after(row, amendment)`: a set-status carrying a stamp replaces the row's own; one carrying none keeps an already-`local` row's stamp and leaves a row moving into `local` unstamped. `deliver` restamps via `stamp_local` (row block or latest pending set-status amendment), which replaces any kept stamp.
    - `local_error` runs on a move INTO `local` only; an already-`local` row is not re-checked (like `ci`).
    - `LocalStamp` hashes by value.
resolves:
- id: p1-r1
  state: fixed
  body: edfdd9ade. local_error only on a move into local (both record paths); the pending path keeps existing.local while the row stays local; the fold keeps an already-local row's stamp unless the amendment carries one. Spec R5 and §A amended. Tests cover the pending link-only write, the merged link-only write, and link-only after CI appears (promote to ci, not refused).
- id: p1-r2
  state: fixed
  body: "c61b989cb. head_blobs returns None on a git failure, and local_debt reports 'stale: HEAD unreadable' for every stamped row. Tests cover a non-repo dir and a repo with no commit."
- id: p1-fold-stamp-unhashable
  state: fixed
  body: edfdd9ade. LocalStamp.__hash__ hashes by value (files as sorted items). test_a_stamped_amendment_is_hashable plus the merged-path writer test fold a stamped amendment end to end.
- id: p1-local-reset-clears-stamp
  state: fixed
  body: The executor's open finding is the same defect as p1-r1, fixed in edfdd9ade.
