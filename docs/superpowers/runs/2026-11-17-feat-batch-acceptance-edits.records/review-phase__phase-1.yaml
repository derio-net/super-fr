item: phase/1
outcome: done
journal:
  - kind: finding
    id: p1-r1
    phase: 1
    review_scope: in
    title: After the repair merges, -design-sourced amendments take the repair commit's history position
    body: |
      fold.py `_introductions` found history by the current path name, so a renamed `<slug>.yaml` had no history before the repair commit; an interleaved amendment from another feature could then sort before them, fail `stale_base` and mark the row contested. The R15 guard folds texts without history and cannot see it.
  - kind: finding
    id: p1-r2
    phase: 1
    review_scope: in
    title: respell on an empty working set changes owner and order for repos that never ran the repair
    body: |
      fold.py `_fold` respelled every tip `<slug>-design.yaml` not in the working set, so `default_ref_fold` (empty working) read an unrepaired fragment as feature `<slug>`, changing owners, row order and tie-breaks.
  - kind: finding
    id: p1-r3
    phase: 1
    review_scope: in
    title: Restored notes read ".; tracked by" (double punctuation)
    body: Cosmetic; the join follows decision d4.
  - kind: review
    id: review-p1-1
    phase: 1
    title: "phase 1 review: 3 findings (p1-r1, p1-r2 fixed; p1-r3 refuted)"
    body: |
      Independent reviewer over 76fb64aca..HEAD (spec R1-R4, R13-R17, plan 01.yaml). Found sound: the repair builds in memory, checks the fold before any byte moves, writes atomically, declares the companion veto; the origin-only path reads the row's own definition; the 12 note restores match p1-restored-notes / d8 with no status, level or issue change. Findings: p1-r1, p1-r2, p1-r3. The orchestrator verified p1-r1 and p1-r2 against fold.py before fixing.
resolves:
  - id: p1-r1
    state: fixed
    body: "bb8b0e9bb: `_introductions` reads a tip `<slug>.yaml` and the `<slug>-design.yaml` it replaced as one fragment at every commit (merge_spellings order, by-value counting, `--no-renames`). Test test_acceptance_design_spelling_history.py::test_the_repair_commit_keeps_each_amendments_original_position[rename|merge], red before."
  - id: p1-r2
    state: fixed
    body: "58e6fc1ef: one rule, `spelling.renamed_keep`: a `-design` file is respelled only when the branch holds `<slug>.yaml` and no longer the `-design` file; `_fold`, `merged_row_edits` and `outside_merged_row_edits` use it. Test test_an_unrepaired_default_ref_folds_as_before, red before."
  - id: p1-r3
    state: refuted
    body: "Decision d4 restores the pre-sweep note byte-exact and appends `; tracked by …`; the old notes end in a period, so `.;` is the restored text plus the agreed join. Stripping the period would alter the text the restore exists to bring back."
evidence:
  review: review-p1-1
  reviewer: a601522afcf4679d6
  model: claude-opus-5-5
