  - {id: s-r2, state: fixed, body: "R6 now names the matrix stamp read and the retiring split hop (conversions included); design C routes those reads through the named decode."}
  - {id: s-r3, state: fixed, body: "Added R17; design F keys merged_row_edits/outside_merged_row_edits by the one spelling, merging a tip's -design fragment by the repair's rule."}
  - {id: s-r4, state: fixed, body: "Added R16 and the companions declaration; design F states removal staging needs no runner change and a test pins it."}
  - {id: s-r5, state: fixed, body: "Design A now fills from the row's own pending definition; no model or shape change."}
  - {id: s-r6, state: fixed, body: "R12 and design E strip the remote prefix, read fr.git.remote_default_ref directly, and warn nothing without a nameable default ref."}
  - {id: s-r7, state: fixed, body: "R8 and design D give the error contract (-z, exit 0/1 answers, empty set / False otherwise) and pin each site's behaviour in a test."}
