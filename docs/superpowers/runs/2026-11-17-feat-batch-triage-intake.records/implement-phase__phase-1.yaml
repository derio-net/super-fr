journal:
  - kind: decision
    id: p1-intake-admits-bot-logins
    phase: 1
    title: "Intake also admits the debt workflow's bot logins (BOT_LOGINS)"
    body: "R2 names claim_trusted(config, viewer) only. check already trusts fr.debt.render.BOT_LOGINS as a debt-digest author, and collect now clears the body of an ineligible issue, so a bot-authored digest (whose association is not OWNER/MEMBER/COLLABORATOR) would lose the marker in its body and stop being read as a digest. intake_trusted() is claim_trusted | BOT_LOGINS, used by collect, issue_reason and the association-read gate. No second association list; only the login set widens, by the logins check already trusts."
  - kind: decision
    id: p1-create-edit-leave-unjudged-to-save
    phase: 1
    title: "create/edit leave an uncollected AND unjudged member to the save's own refusal"
    body: "rejected_members rejects an absent key as `not collected` (R6). For create and edit, _refuse_rejected passes the judgements and skips an uncollected member that is not judged either, so the existing `members [...] are not judged` refusal (exit 2, nothing written) still names the real cause. dispatch passes no judgements, so it rejects every uncollected member as R6 says."
  - kind: decision
    id: p1-acceptance-record-shape
    phase: 1
    title: "Acceptance moves use the AcceptanceItem shape, not {row, op}"
    body: "The four intake rows are still pending on this branch (not merged on the default ref), so a record entry is a row move ({id, status, notes, levels}), not an amendment; the {row, op, ...} shape the brief gave is for merged rows. Levels are unit refs anchored on test names."
  - kind: discovery
    id: p1-circular-import-batch-intake
    phase: 1
    title: "fr.triage.batch cannot import fr.triage.intake at module level"
    body: "intake -> claims -> batch is a cycle. suggest() imports untrusted_issues inside the function. check.py, collect.py, views.py and triage_batch_cmd.py import intake at module level without a cycle."
  - kind: discovery
    id: p1-rest-list-carries-association-outside-projection
    phase: 1
    title: "REST list_issues returns authorAssociation outside the field projection"
    body: "_project() raises on a field the record lacks and cuts to the requested fields, and `gh issue list --json` has no association field, so collect cannot ask for it. RealGhRestClient.list_issues adds authorAssociation to each projected record (empty string when absent); collect reads the key's presence to skip the extra read."
  - kind: discovery
    id: p1-fixture-churn-from-intake
    phase: 1
    title: "Many fixtures built issues with no author; intake now treats them as untrusted"
    body: "Fixtures gained author_association OWNER (the shared _issue helpers, triage_board_fixtures.issue, the scenario fixture generators, which were regenerated at schema 14), FakeForge.issue_associations answers OWNER for an unscripted repo, and the old `untrusted marker stays ranked` assertion in test_triage_debt_sets now says it is set apart. Facts schema asserts moved 13 -> 14."
  - kind: discovery
    id: p1-ready-fr-also-created-by-init-scaffold
    phase: 1
    title: "init scaffold and merge --yes create ready-fr too"
    body: "They share ensure_approval_label, which now ensures both labels; their tests assert both. Each label is checked and created on its own, so one failure never hides the other."
  - kind: discovery
    id: p1-dispatch-repair-also-refuses
    phase: 1
    title: "dispatch --repair is refused for a batch with a rejected member"
    body: "R6 places the check in dispatch_batch after the repo is resolved and before the tracking gate, which `--repair` shares. A dispatched batch whose member is later edited by an outside author or closed with no association therefore needs ready-fr (or removing the member) before a repair, as the spec's rule reads."
