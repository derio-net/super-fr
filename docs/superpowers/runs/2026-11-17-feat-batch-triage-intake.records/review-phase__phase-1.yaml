outcome: done
journal:
  - kind: review
    id: review-phase-1
    phase: 1
    title: "Phase 1 code review (intake trust R1-R8): boundary holds; 5 in-scope findings, 1 out"
    body: |
      Independent read-only reviewer over 8228c5e..HEAD. Confirmed: body withholding is the single
      final collect step over listed, viewed and carried issues; logins/associations compared
      case-insensitively; unread author/association fails closed; both snapshot builders fill
      `rejected` and the pass checks it before `after` and the cap; create/edit/dispatch refuse
      before any write; schema 13 -> 14 load tested; fr never applies `ready-fr`; `quote_untrusted`
      splits every line break and prefixes each line, so the close marker cannot be forged.
  - kind: finding
    id: p1-r1
    phase: 1
    review_scope: in
    title: "Close-out, red-CI, conflict and archive-conflict briefs and dispatch_comment embed batch.title unquoted"
    body: "batch_dispatch.py:256,290,315,338 and batch_drive.py:821. A batch title written from issue text reached the command line of a new session. Spec R7 covered only the launch brief: spec amended (3b8409ae8)."
  - kind: finding
    id: p1-r2
    phase: 1
    review_scope: in
    title: "view_issue never reads authorAssociation, so a viewed trusted member's issue is rejected"
    body: "gh.py:288 ISSUE_VIEW_FIELDS and collect.py ~825. Fails closed, but blocks a MEMBER's batch past the list limit until ready-fr. Spec R1 amended (3b8409ae8)."
  - kind: finding
    id: p1-r3
    phase: 1
    review_scope: in
    title: "BOT_LOGINS admission makes every github-actions issue eligible, not only the debt digest"
    body: "intake.py:35. A workflow filing issues from untrusted input would yield batchable, body-kept issues with no operator step. Spec R2 amended: the bot is admitted only with the digest marker; merge-protection.md lists the clause."
  - kind: finding
    id: p1-r4
    phase: 1
    review_scope: in
    title: "ready-fr label match is case-sensitive while the forge's labels are not"
    body: "intake.py:46. Spec R2 amended to compare label names case-insensitively."
  - kind: finding
    id: p1-r5
    phase: 1
    review_scope: in
    title: "dispatch --repair refused for an already-dispatched batch with a rejected member"
    body: "triage_batch_cmd.py:1827."
  - kind: finding
    id: p1-r6
    phase: 1
    review_scope: out
    title: "Titles of ineligible issues still reach facts.json and triage check output"
    body: "Per spec R3 (bodies only). Residual injection vector through titles read by the triage agent; a future hardening pass, not caused by this change, which narrows the surface."
resolves:
  - id: p1-r1
    state: fixed
    body: "Fixed in 563a780dc and 23feaa3f4: every batch brief and dispatch_comment names the batch by id; titles sit in the quoted untrusted block (title_block); hostile-title tests in tests/unit/test_batch_brief_titles.py."
  - id: p1-r2
    state: fixed
    body: "Fixed in fead4edbe: viewed issues get their association through the same per-repo issue_associations read (none when login or label admits; None on a failed read)."
  - id: p1-r3
    state: fixed
    body: "Fixed in fead4edbe: intake_reason judges the body; the debt bot is admitted only with the digest marker, judged before withholding; merge-protection.md lists the clause."
  - id: p1-r4
    state: fixed
    body: "Fixed in fead4edbe: ready-fr compared case-insensitively."
  - id: p1-r5
    state: refuted
    body: "Kept on purpose. At a security boundary a batch whose member is now ineligible must be admitted with ready-fr before fr writes to the forge for it again; repair re-posts the dispatch comment and labels derived from member text. The unread-association case the reviewer cited is removed by the p1-r2 fix, so a trusted member's batch is no longer blocked by it."
  - id: p1-r6
    state: out-of-scope
    body: "R3 deliberately clears bodies only; titles are needed to triage at all. Not caused by this change, which removes the body surface; title hardening is a separate decision."
evidence:
