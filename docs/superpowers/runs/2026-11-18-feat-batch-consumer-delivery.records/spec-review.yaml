- id: s-r2
  state: fixed
  body: "R2 and \xA7A now append a rule only when event.system does not already contain its text, which is correct under either semantics; the Test Plan checks a later turn and a child session."
- id: s-r3
  state: fixed
  body: "The same content-presence check (R2, \xA7A) dedupes across plugin copies and against opencode.json's instructions."
- id: s-r4
  state: fixed
  body: "R11 and \xA7D now authenticate every remote git call archive-pr makes (ls-remote and push), with a unit test asserting both."
- id: s-r5
  state: fixed
  body: "R11 and \xA7D call git against origin's URL with user-info stripped, so only the header's token is used."
- id: s-r6
  state: fixed
  body: R11 names the fallback variable per forge (GH_TOKEN, GITLAB_TOKEN, GITEA_TOKEN); R12 names the exact env of each Gitea step.
- id: s-r7
  state: fixed
  body: "\xA7B reuses idle's pure helper on the info each handler already fetches, and states the order per handler (cheap checks first, one lookup)."
- id: s-r8
  state: fixed
  body: "\xA7C states the jump and that the change fragment says so; Gitea keeps v5."
- id: s-r9
  state: fixed
  body: "R12, R13 and \xA7D name isolation/scaffold.py's pin table for both, with a test asserting equality."
- id: s-r10
  state: fixed
  body: "R9 and \xA7C: resolve only when a workflow will be rendered, before any write, so ci none needs no network."
- id: s-r11
  state: fixed
  body: Test Plan step 2 now says paste the printed job, then run a web pipeline with DEBT=true, without and with FR_DEBT_TOKEN.
- id: s-r12
  state: fixed
  body: "R14 defines the sites (every json.loads of _run_tea/_run_glab/tea api/glab api output in the four modules), makes stderr optional, and \xA7E requires one parametrised test over an enumerated list."
- id: s-r13
  state: out-of-scope
