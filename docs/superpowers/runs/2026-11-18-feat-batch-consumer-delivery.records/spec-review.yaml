journal:
- kind: finding
  id: s-r1
  title: A parity marker on src/rules.ts would break fr harness parity; the spec leaves the choice to the plan
  body: 'evidence: observe.py:118-136 accepts a marker only when it names an existing hook script; Claude Code delivers rules as files, so rules.ts has no script to name.'
  review_scope: in
- kind: finding
  id: s-r2
  title: R2 assumes the context hook runs on every model request; nothing in the repo shows it
  body: 'evidence: nag.ts:6-12 and README.md:98-103 document the hook only for the first request; whether event.system is rebuilt or kept is unrecorded.'
  review_scope: in
- kind: finding
  id: s-r3
  title: Rules are injected twice when the plugin loads twice, and in super-fr on an installed machine
  body: 'evidence: nag.ts:85-89: OpenCode 2 can load the delivered plugin twice; a per-process cache does not dedupe across copies or against opencode.json instructions.'
  review_scope: in
- kind: finding
  id: s-r4
  title: archive-pr's ls-remote has no credential once persist-credentials is false
  body: 'evidence: debt_cmd.py:509-516 runs ls-remote --heads origin before push --force-with-lease.'
  review_scope: in
- kind: finding
  id: s-r5
  title: On GitLab, origin carries the job token in its URL; an added header may conflict
  body: 'evidence: GitLab runners clone as https://gitlab-ci-token:<CI_JOB_TOKEN>@host/...; git would send those credentials.'
  review_scope: in
- kind: finding
  id: s-r6
  title: R12 is untestable, and the gitea.token fallback never reaches archive-pr
  body: 'evidence: debt_cmd.py:376-380 reads only FR_DEBT_TOKEN.'
  review_scope: in
- kind: finding
  id: s-r7
  title: The sessionDirectory helper clashes with idle.ts's, cites wrong lines, and doubles session lookups
  body: 'evidence: idle.ts:162-165 is a pure sessionDirectory(info, fallback); nag/bind/claim already call session.get.'
  review_scope: in
- kind: finding
  id: s-r8
  title: R8 silently moves GitHub consumers from setup-uv v5 to v10.3.0
  body: 'evidence: scaffold.py uses setup-uv@v5; super-fr CI pins v10.3.0.'
  review_scope: in
- kind: finding
  id: s-r9
  title: R13's pinned glab has no named source
  body: 'evidence: isolation/scaffold.py:358-394 pins glab 1.107.0 and tea 0.14.2 with sha256.'
  review_scope: in
- kind: finding
  id: s-r10
  title: R9 does not say the pin is resolved only when CI is scaffolded and before init's first write
  body: 'evidence: scaffold.py:858-867 writes .gitkeep and the rule before render_workflow; :841 has_ci.'
  review_scope: in
- kind: finding
  id: s-r11
  title: Test Plan step 2's GitLab half does not match --refresh-ci and the GitLab trigger
  body: 'evidence: scaffold.py:737-741 GitLab refresh prints a job to paste; :519-521 web pipeline with DEBT=true.'
  review_scope: in
- kind: finding
  id: s-r12
  title: R14's 'every read' is unbounded and the helper's stderr is unavailable at most sites
  body: 'evidence: _run_tea gives stdout only; several real_glabclient.py reads lack a JSONDecodeError catch.'
  review_scope: in
- kind: finding
  id: s-r13
  title: The isolation gate and the pipeline sentinel also judge in the plugin's directory
  body: 'evidence: index.ts:281, :287, :291.'
  review_scope: out
- kind: review
  id: spec-review-1
  title: 'independent spec review: 13 findings (12 in scope, 1 out)'
  body: Reviewer (fr-spec-reviewer, separate context) verified decisions q1-q8 are honoured and checked every cited file:line. Findings s-r1..s-r12 in scope, all fixed in the spec; s-r13 out of scope (pre-existing
    gate uses), named in Out of scope for a follow-up.
- kind: lens
  lens: tests
  title: R2's context-hook semantics and R11-R13's push credentials rest on platform behaviour that unit tests mock; check each mock against a measured shape
