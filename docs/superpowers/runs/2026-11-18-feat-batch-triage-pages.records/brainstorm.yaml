journal:
- kind: discovery
  input: true
  id: brief-1544
  title: 'Operator brief: derio-net/super-fr#1544 (batch triage-pages)'
  body: "# triage pages: UX pass — consistent names, collapsible sections, cross-links, filters, and a\
    \ History page that stays current\n\n## Problem\n\nThe five triage pages (`fr triage render`, `board`,\
    \ `origins render`, `architecture render`, `history render`) have grown into long, flat documents.\
    \ They are hard to scan, they do not link to each other or to the PRs they mention, and some of them\
    \ are out of date without saying so.\n\n## Requested changes\n\n### Across all pages\n- **Harmonize\
    \ page names and filenames.** The nav says Backlog, but the file is `triage.html`. The nav says Batches,\
    \ but the file is `board.html`, while the `board/` fragment directory belongs to `triage.html`. A\
    \ page's title, its file, its command and its fragment directory should share one name.\n- **Collapsible\
    \ sections.** This pattern applies to every page: for example Needs you now, the origin groups and\
    \ the snapshot timeline. Use one shared component in `components.py`, the same way `tabs()` works\
    \ today.\n- **Links.** Every PR and issue reference links to the forge. A wave reference links to\
    \ that wave on the page that holds it. For example, \"wave XX\" in Next up jumps to that wave's tab.\n\
    \n### Backlog (`triage.html`)\n- **Too much on one page.** Consider a more sensible split, for example\
    \ sub-pages.\n- **Waves filter.** Allow selecting several kinds at once (defect, feature, parked,\
    \ unkinded) to show or hide them.\n\n### Batches (`board.html`)\n- **Collapsible columns.** Every\
    \ column can be collapsed and expanded interactively, not only the empty ones that are collapsed today.\n\
    - **Optional wave cutoff.** By default, show the waves that were active in the last month.\n\n###\
    \ Origins\n- **Collapsible sections** for each origin group (new-feature, regression, …).\n- **More\
    \ detail for each PR,** not just the reference.\n- **\"Every issue\" filter:** open only, closed only,\
    \ or all.\n\n### Architecture\n- **\"The pipeline and its driver, with open issues on the steps they\
    \ break\"** should go back to being **one graph with dated tabs above it**. Clicking the tabs steps\
    \ through the dates in order.\n\n### History\n- **The snapshot timeline is collapsible.**\n- **Each\
    \ PR shows a short summary** as well as its link.\n- **The page must stay current.** Today it does\
    \ not. See below.\n\n## Does History have a logic behind it? (findings, current main)\n\nIt is generated,\
    \ not hand-written, but it is only regenerated by hand:\n\n- `fr triage history render` (`packages/fr/src/fr/triage/history.py`)\
    \ builds it from two live inputs:\n  - the snapshot timeline: the snapshots `fr triage render` stores,\
    \ keeping the latest `KEEP = 30` (`snapshot.py`);\n  - the finished waves: `views.finished_waves`\
    \ over `judgements.yaml`.\n- After those, it adds the authored fragments that `history/manifest.yaml`\
    \ lists. In this scope those are three hand-written pages, all dated **2026-10-02**: `closing-order.html`,\
    \ `origins-2026-10-02.html` and `history-2026-10-02.html`. Those are the one-off part.\n- **Nothing\
    \ re-renders it.** The wave driver refreshes only `board.html`. In this scope, `history.html` (like\
    \ `triage.html`, `origins.html` and `architecture.html`) was last written on **2026-11-14**. Its finished-wave\
    \ tabs stop at wave 12, while `judgements.yaml` has batches in waves 1–21.\n- **The timeline is also\
    \ thin.** A snapshot is stored only when `fr triage render` (the Backlog) runs. There are 16 snapshots,\
    \ the newest from 2026-11-14, so the driver's own passes leave no history at all.\n\nSo the page has\
    \ a design, but it is fed only by manual renders, and its narrative half is a one-off from October.\
    \ The decision this issue needs: either\n1. **keep it alive.** The driver (or `board --watch`) re-renders\
    \ the pages that depend on judgements, and stores a snapshot when a wave finishes. The dated authored\
    \ fragments move under a clearly labelled \"archived notes\" heading or are retired; or\n2. **retire\
    \ it.** Fold the finished waves into the Batches page's wave cutoff (above) and drop the snapshot\
    \ timeline.\n\nWhichever option is chosen, **every page should state when it was rendered**, so a\
    \ stale page is visibly stale.\n"
- kind: decision
  id: q1-history
  title: Keep History alive
  body: 'Q1 → Keep alive. The driver re-renders every page whose inputs are on disk after each pass that
    collected; it stores a snapshot when a wave finishes; the 2026-10-02 fragments move under an ''Archived
    notes'' fold; every page states when it was rendered. Spec R5–R7, R9.


    decider: operator (round 1)'
- kind: decision
  id: q2-names
  title: Names follow the nav
  body: 'Q2 → Follow the nav: backlog.html/backlog/, batches.html/batches/; new commands `fr triage backlog`
    and `fr triage batches`, with `render`/`board` kept as aliases; a render deletes the old-named file;
    an old board/ dir is read with a note. Spec R1–R3.


    decider: operator (round 1)'
- kind: decision
  id: q3-split
  title: Backlog splits into Backlog and Issues
  body: 'Q3 → Two pages: Backlog keeps the decisions (since, needs, next up, waves, batches); a new Issues
    page holds the lists. Spec R4.


    decider: operator (round 1)'
- kind: decision
  id: q4-pr-detail
  title: PR detail is title, merge date and issues
  body: 'Q4 → Title, date, issues. Origins PRs show title, merge date and the issues that name them; History
    shows each finished batch''s PR with title and merge date. Spec R15, R16.


    decider: operator (round 1)'
- kind: decision
  id: q4-pr-detail-source
  title: PR titles come from facts.json, not a new origins collect
  body: 'The Q4 option text said origins collect would read PR titles. Reading the code showed facts.json
    already lists PRs in every state (collect.py:753, state="all"), so the Origins render reads titles
    and merge dates from facts.json, and a PR it does not hold says ''not in facts.json''. The operator
    chose the same content; only the source changed, and no new forge read is added. decider: agent (code
    check after round 1)'
- kind: decision
  id: q5-cutoff
  title: Wave cutoff is an in-page toggle
  body: 'Q5 → In-page toggle, default last 30 days, remembered per browser together with column collapse.
    Spec R10, R18.


    decider: operator (round 1)'
- kind: decision
  id: q6-verify
  title: 'Verification: CI plus browser checks, gate developer'
  body: 'Q6 → CI unit tests plus fr-goal''s visual checks at review and deliver; every row `none` with
    that reason; gate: developer. Spec ## Verification.


    decider: operator (round 1)'
- kind: lens
  lens: security
  title: 'R11 turns untrusted issue/judgement prose into links: the escaping and URL checks must hold'
resolves: []
