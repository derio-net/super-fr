journal:
  - kind: decision
    id: p2-debt-fold-no-count
    title: the Issues Debt fold shows no count (phase 2)
    phase: 2
    body: "The per-repo debt folds inside it carry the totals; a count of repos on the outer fold read as the debt badge and broke the visible-sum test's meaning."
  - kind: decision
    id: p2-next-up-reason-drops-wave
    title: Next up's reason no longer names the wave or the dependencies (phase 2)
    phase: 2
    body: "NextRow.wave is its own linked tag and the deps tag links each dependency, so the reason keeps only the merge order, or 'the driver starts it next'. test_next_up_carries_tier_size_dependencies_and_the_reason now asserts the field."
  - kind: discovery
    id: p2-sections-are-folds-tests-read-elements
    title: Backlog/Issues sections are folds, so tests read an element by id with depth counting (phase 2)
    phase: 2
    body: "Section ids moved onto the details element. tests/unit/triage_board_fixtures.element_by_id returns the whole element, nested same-tag elements counted; test_triage_board_views and test_triage_render use it."
  - kind: discovery
    id: p2-visual-rows-beyond-owed
    title: History PR column and pipeline tabs were also captured but are not in this record's owed rows (phase 2)
    phase: 2
    body: "triage-history-pr-summary and triage-architecture-pipeline-tabs carry visual states. Shots exist in the scratch dir (architecture-pipeline-*, history-finished-waves-*) and show the PR column dash and ten dated tabs stepping with one panel visible; they are left out of visual: because the brief names three owed rows. Batches columns and Origins groups are phase 3's and were not touched."
