  P3.T1: "the gh#1417 empty-column rule was replaced by the collapsed-state rule in the same edit; nothing left over"
  P3.T2: "one pure helper and one script block; no duplicate of the rule"
  P3.T3: "collect reuses the PR list it already read; no second read or code path to tidy"
  P3.T5: "browser check, docs and suite only: no code"
journal:
  - {kind: decision, id: p3-collect-reuses-the-pr-read, title: "origins collect keeps merged PRs from the one PR list it already reads, not a second merged-state read", body: "collect_origins already lists PRs (state all) once per repo for the closing-PR map; MergedPr rows come from that same read, kept when merged_at is on or after --since. R15 asks for one list read per repo, and a second one would break it. A short page already refuses the whole collect, so no extra truncation warning is needed.", phase: 3}
  - {kind: decision, id: p3-origins-pr-links-use-issues-url, title: "an Origins PR reference the facts do not hold links to the github.com issues route, not pull", body: "Origins' PR links go through the Linker (R11), so an unknown number on a github.com base links to /issues/<n>, which GitHub redirects. A PR in prs links to its own url. test_related_pr_cell asserts the issues route.", phase: 3}
  - {kind: decision, id: p3-terminal-is-the-done-column, title: "the cutoff's terminal is the Done column", body: "Card.terminal is column == done (cancelled, abandoned, merged and archived), the same set finished_waves uses; a merged batch still owed its close-out is not terminal. cutoff_hidden_waves is the Python statement of the rule the script applies.", phase: 3}
  - {kind: discovery, id: p3-scope-key-is-the-scope-name, title: "the storage key carries the scope name, owner--repo", body: "body data-scope is Board.scope, which is the directory-safe name, so keys read fr-triage:example-org--widgets:col:running and fr-triage:example-org--widgets:cutoff.", phase: 3}
  - {kind: discovery, id: p3-column-test-helpers-matched-the-old-class, title: "a kanban cmd test helper and a shell scenario matched the exact column class", body: "test_triage_kanban_cmd._column and tests/scenarios/triage-cancelled-terminal.sh matched class=col; a collapsed column adds a class, so both now allow more classes.", phase: 3}
