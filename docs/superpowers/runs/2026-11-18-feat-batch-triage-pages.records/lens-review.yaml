schema_version: 12
run: 2026-11-18-feat-batch-triage-pages
step: lens-review
outcome: done
journal:
  - kind: review
    id: review-lenses
    global: true
    title: "Lens review: docs-accuracy, security and tests over the whole feature"
    body: |
      Three independent reviewers, one per lens, over cbf001bc..HEAD.
      docs-accuracy: commands, files, the Backlog/Issues split, Batches, Origins, driver page writing, snapshot
      rules and state carriage hold against the code; two findings. security: escaping before linkification,
      https-only hrefs, entity lookbehind, URL-quoted wave/batch targets, no innerHTML or selector injection from
      location.hash, fixed-name state carriage, no new subprocess or dependency all hold, probed with payloads;
      the drive memory's measurement was the gap. tests: markup contracts pinned for tabs, folds, kind filter,
      state filter and the kanban scripts; renamed tests not weakened; gaps in failure paths and two
      script-source greps. Decision: the drive memory no longer carries the Architecture measurement (per-process
      only), which closes l-security-r1, l-security-r2 and l-docs-accuracy-r1; R6/R7 amended to memory-based
      baselining. Two out-of-scope findings filed as derio-net/super-fr#1556 and #1557.
  - {kind: finding, id: l-docs-accuracy-r1, global: true, review_scope: in, title: "A no-clone driver was documented as rendering Architecture unmeasured but reused a remembered measurement", body: "fr-wave-driver.md and docs/triage/README.md against _write_pages' reuse of the drive-pages.json measurement."}
  - {kind: finding, id: l-docs-accuracy-r2, global: true, review_scope: in, title: "The herdr control page's reviewed note misdescribed this feature's change to triage_batch_cmd.py", body: "The stamp said a docstring reword; later phases added the page writer and memory there."}
  - {kind: finding, id: l-security-r1, global: true, review_scope: in, title: "drive-pages.json was loaded without type checks; a planted measurement reached architecture.html unescaped", body: "Measure(**raw) accepted any JSON; _num returned str(n) unescaped; a non-int lines crashed every pass."}
  - {kind: finding, id: l-security-r2, global: true, review_scope: in, title: "drive-pages.json joined the state ref unchecked by the privacy guard", body: "A private scope repo's commit SHAs and line counts could reach a public state repo."}
  - {kind: finding, id: l-security-r3, global: true, review_scope: out, title: "The carried snapshots hold issue keys the privacy guard never reads", body: "Predates this change; unjudged private issue keys can reach a public state repo."}
  - {kind: finding, id: l-tests-r1, global: true, review_scope: in, title: "The driver's reuse of the Architecture measurement was unpinned", body: "The test counted measure calls with a spy whose value rendered like no measurement."}
  - {kind: finding, id: l-tests-r2, global: true, review_scope: in, title: "R7's baseline per drive was implemented per memory file with no test telling them apart", body: "Only an unchanged-board second drive was tested; the spec was not amended."}
  - {kind: finding, id: l-tests-r3, global: true, review_scope: in, title: "Once-per-distinct-cause page warnings were tested with one cause on one writer", body: "No second cause, no reset after success, no other writer, no TriageError."}
  - {kind: finding, id: l-tests-r4, global: true, review_scope: in, title: "Stage-filter and cutoff-choice tests grepped the script source", body: "The href^= to href*= change for backlog.html#batch- links was unpinned."}
  - {kind: finding, id: l-tests-r5, global: true, review_scope: in, title: "remove_legacy raising OSError had no test", body: "triage backlog and triage batches turn it into a warning; nothing pinned that."}
  - {kind: finding, id: l-tests-r6, global: true, review_scope: in, title: "load_memory was tested only for bad JSON and a missing file", body: "Schema mismatch, wrong-typed fields and the driver's first-pass fallback were untested."}
  - {kind: finding, id: l-tests-r7, global: true, review_scope: out, title: "The Issues page filter script throws when its filter bar is absent", body: "Predates this change (carried over from triage.html); no test renders Issues without backlog-by-tier."}
resolves:
  - {id: l-docs-accuracy-r1, state: fixed, body: "0ce1ead4f: the measurement is per-process only; a no-clone driver always renders dashes; both pages updated."}
  - {id: l-docs-accuracy-r2, state: fixed, body: "5f3ad1e9a, 34c08e752: the stamp names the page writer and memory; session control unchanged."}
  - {id: l-security-r1, state: fixed, body: "0ce1ead4f (+534508ef5): drive-pages.json holds only unfinished wave ids and the owed flag, load_memory validates strictly, _num int-coerces; a planted measurement never reaches the page."}
  - {id: l-security-r2, state: fixed, body: "0ce1ead4f: no SHA or line count is persisted, so nothing of the scope repo's code leaves the process."}
  - {id: l-security-r3, state: out-of-scope, body: "Predates this change, which neither adds nor touches snapshot carriage; filed as derio-net/super-fr#1556."}
  - {id: l-tests-r1, state: fixed, body: "0ce1ead4f: a spy returning real numbers shows every pass in one process rendering them with one measure call; no clone renders dashes."}
  - {id: l-tests-r2, state: fixed, body: "a1ab842fc: spec R6/R7 amended to memory-based baselining; a second drive over a changed board stores none unless a wave finished."}
  - {id: l-tests-r3, state: fixed, body: "df98ade1f: second cause, reset after a good write, per-page failure sets for History/Origins/Architecture, and a broken manifest warned and never raised."}
  - {id: l-tests-r4, state: fixed, body: "67dff9951: an attribute-selector checker runs the stage script's selector against the rendered batch links (a ^= revert fails); the cutoff id and scope are checked against the markup."}
  - {id: l-tests-r5, state: fixed, body: "4f98f2aa5: an OSError from remove_legacy is a warning; both commands exit 0 with the page written."}
  - {id: l-tests-r6, state: fixed, body: "0ce1ead4f: each wrong-shaped memory loads as no memory, and the driver then takes the first-pass decisions."}
  - {id: l-tests-r7, state: out-of-scope, body: "Predates this change (the old triage.html had it; the split carried it over); filed as derio-net/super-fr#1557."}
evidence:
  review: review-lenses
  reviewer: "docs-accuracy=a37fc471165ca165e,security=a6af986b48bba15b8,tests=ae9be24d445ca6ea7"
