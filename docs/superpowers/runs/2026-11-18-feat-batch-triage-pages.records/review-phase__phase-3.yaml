outcome: done
journal:
  - kind: review
    id: review-p3
    phase: 3
    title: "Phase 3 review: Batches columns and cutoff, Origins groups, filter and merged PRs"
    body: |
      Independent review of da54b59dc..73ce5d5a1 against R10, R14, R15, R18, design D/G/H, plan 03.yaml
      and the three visual rows, with the reviewer's own browser walk (26 shots, light/dark 1280, light 390,
      a legacy origins file with no prs, storage blocked). Holds: column toggles with aria-expanded and
      remembered state; storage try/catch; the cutoff hides only terminal waves idle past 30 days; Origins
      groups folded in CATEGORIES order with counts, the state filter's counts, a hash opening only its fold;
      merged PRs kept from the one PR read, "not collected" for a missing one; escaping and https-only hrefs;
      reuse of fold, Linker, stamp_text, PAGE_SCRIPT; docs accurate. Five findings, all in scope, all fixed.
  - kind: finding
    id: p3-r1
    phase: 3
    review_scope: in
    title: "Column-toggle and cutoff browser logic tested only by searching script text"
    body: cutoff_hidden_waves was a Python copy no render path called; the JS date rule could drift with tests green.
  - kind: finding
    id: p3-r2
    phase: 3
    review_scope: in
    title: "Card.terminal narrower than R18's merged, archived, cancelled or abandoned"
    body: column == "done" left a merged batch that never archived visible past the cutoff indefinitely.
  - kind: finding
    id: p3-r3
    phase: 3
    review_scope: in
    title: "origins collect silently drops a PR created before --since but merged inside the window"
    body: The PR list is creation-ordered; a long-lived PR beyond the page is lost with no warning.
  - kind: finding
    id: p3-r4
    phase: 3
    review_scope: in
    title: "Origins Ended cell renders closing PRs as bare #n text"
    body: Linker.from_origins holds their URLs; R11 says every PR reference links to the forge.
  - kind: finding
    id: p3-r5
    phase: 3
    review_scope: in
    title: "State filter leaves a header-only table when it hides every row of a group"
    body: A group empty at render shows "No issue."; the filtered-empty state should match.
resolves:
  - {id: p3-r1, state: fixed, body: "f23c85d65: render marks cards of hidden waves with data-cutoff-hidden from cutoff_hidden_waves; the script only applies the marker. Tests pin the boundary and the selectors the script reads."}
  - {id: p3-r2, state: fixed, body: "cbbf53400: Card.terminal reads the engine's stage and close-out state: merged, cancelled, abandoned or archived. One test per terminal kind."}
  - {id: p3-r3, state: fixed, body: "29cc2550d (+2bc8e717a): a full PR list warns, naming the repo, that an older PR merged in the window may show not collected; documented in fr-triage.md."}
  - {id: p3-r4, state: fixed, body: "6ff3c2399: closing PRs in the Ended cell link through the Linker, https only."}
  - {id: p3-r5, state: fixed, body: "6070901a6: each group carries a hidden No issue. row the state filter shows when no row is visible."}
