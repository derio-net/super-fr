journal:
- kind: finding
  id: s1
  review_scope: in
  title: 'R15/Non-goals premise is false: facts.json does not hold PRs in every state'
  body: facts.json keeps open, batch and judged PRs only (collect.py:888-910); the all-state list at collect.py:753
    is used only to link. Most leaderboard PRs would read 'not in facts.json'.
- kind: finding
  id: s2
  review_scope: in
  title: R7's wave-finished test cannot see a wave that finishes by archive
  body: finished_waves counts archived close-outs from judgements (batch_drive.py:1236); a snapshot stores
    only stages (snapshot.py:63), so the set never grows. Reuse the driver's self._unfinished transition
    (triage_batch_cmd.py:5306) and say what a restart does.
- kind: finding
  id: s3
  review_scope: in
  title: R6 narrows Architecture re-rendering below what decision q1 grants
  body: Re-render on every collecting pass, re-measure only on the first pass and on a wave's finish,
    reusing the last measurement.
- kind: finding
  id: s4
  review_scope: in
  title: The write_* shape omits the driver's runner loader and ci_none; write_board does not have the
    claimed shape
  body: write_board takes scope_args/refresh/prefix/loader/ci_none (triage_kanban_cmd.py:390); the backlog
    reads sessions and local_ci_none (triage_cmd.py:1082).
- kind: finding
  id: s5
  review_scope: in
  title: 'No ## Test Plan section, and R13 has no Verification row'
  body: 'test_plan is on but the spec has no ## Test Plan; R13 has no row.'
- kind: finding
  id: s6
  review_scope: in
  title: R18's cutoff hides upcoming waves whose batches have no events
  body: A proposed batch has no events (model.py:1129), so a planned wave would be hidden by default.
- kind: finding
  id: s7
  review_scope: in
  title: R12 never links the wave named in Next up's reason, the brief's own example
  body: The wave is only in the reason string (views.py:596) printed through inline() (render.py:890).
- kind: finding
  id: s8
  review_scope: in
  title: Origins links are hard-wired to github.com, and the Linker's source on Origins is unstated
  body: _pr_link builds github.com URLs for any forge (origins.py:537-543).
- kind: finding
  id: s9
  review_scope: in
  title: The page-name tripwire would fail on constants §A does not move
  body: history/origins/architecture PAGE_FILE and dir constants plus docstrings/help naming triage.html/board.html
    are not listed.
- kind: finding
  id: s10
  review_scope: in
  title: The old board/ manifest fallback covers the Backlog but not Issues
  body: An old board/manifest.yaml orders sections R4 moves to Issues; and what does batches/ hold?
- kind: finding
  id: s11
  review_scope: in
  title: Two different FOLD_SCRIPTs, and the R9 fold lists disagree with R4
  body: One name for two scripts; debt listed as a decision section though R4 moves it to Issues; the
    Batches fold's start state unstated.
- kind: finding
  id: s12
  review_scope: in
  title: R17 adds the tab script to Architecture but not the tab CSS
  body: TABS_SCRIPT relies on TABS_CSS (components.py:186-203), which architecture/origins/board CSS lack.
- kind: finding
  id: s13
  review_scope: in
  title: Smaller codebase mismatches in Background and Design
  body: BOARD_DIR is in triage_cmd.py:104; batch_pr is fr.triage.batch.batch_pr; merged_at is a str (stamp_text,
    not when()); MOVED maps say 'board'.
- kind: finding
  id: s14
  review_scope: in
  title: R6 says every collecting pass, but the design renders only on --yes passes
  body: _write_board runs only on a --yes, non-essential-only pass (triage_batch_cmd.py:5354-5358).
- kind: finding
  id: s15
  review_scope: in
  title: R8 'every collapsible section' conflicts with the raw <details> the design keeps
  body: Per-PR issue lists and stage lists are not folds; Origins nesting unstated.
- kind: finding
