  body: AGENTS.md names triage.html as render's output.
- kind: decision
  id: q4-pr-detail-source-2
  title: PR titles come from origins collect (supersedes q4-pr-detail-source)
  body: 'Spec review (s1) showed facts.json keeps no merged PRs, so the earlier decision rested on a misreading.
    `fr triage origins collect` keeps the PRs merged in its window in origins-facts.json, which is what
    the operator''s Q4 option said. decider: agent (spec review)'
- kind: lens
  lens: tests
  title: 'R8, R10, R12-R14 and R18 are client-side behaviour: unit tests must pin the markup contract
    each script relies on'
- kind: review
  id: spec-review-1
  title: 'independent spec review: 16 findings (15 fixed, 1 refuted)'
  body: Reviewer fr-spec-reviewer raised s1-s16, all tagged in scope. 15 fixed in the spec; s5 refuted
