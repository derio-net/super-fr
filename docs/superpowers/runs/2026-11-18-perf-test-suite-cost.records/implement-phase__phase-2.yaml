- kind: decision
  id: p2-d-build-without-the-tests-patches
  phase: 2
  title: A template is built with the asking test's own patches taken off (only the autouse fixtures'
    stay)
  body: 'The factory builds lazily inside the first test that asks, and that test may already have patched
    fr (a fake label sync, a fake forge) or the environment: built in, every later copy in the worker
    would carry them. `_template_baseline` (autouse) asks for every other autouse fixture, found by lookup
    rather than named, then marks how many monkeypatch entries they made; `_without_the_tests_own_patches`
    undoes every entry after that mark for the build and puts it back. Pinned by `test_a_template_is_built_without_the_patches_of_the_test_that_asked_for_it`,
    which also checks an autouse variable stays in force. HOME, GIT_CONFIG_GLOBAL and the uv paths then
    come from the factory''s own sandbox home. The mechanism reads pytest''s private `MonkeyPatch._setattr/_setitem`
    (pytest 9.0.3 here); that test fails loudly if a pytest upgrade moves them.'
