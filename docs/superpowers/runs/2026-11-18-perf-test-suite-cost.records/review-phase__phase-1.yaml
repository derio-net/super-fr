  state: fixed
  body: 'Fixed in 921f5d788: `git_cache.head_target` reads the loose HEAD symref''s target before git
    runs and adds it to the before-stamp; test with a non-well-known `stable` ref removed mid-answer.'
- id: p1-r5
  state: fixed
  body: 'Fixed in 921f5d788: each of the seven invalidation tests asks again before the change and asserts
