- kind: review
  id: review-p3-1
  title: 'Phase 3 independent review: 7 findings, 6 in scope and fixed, 1 out of scope and filed'
  body: 'Reviewer (general-purpose, hard tier, separate context) reviewed the phase-3 commits 847f8242e..cd2b2d655
    without merges against spec R5-R10 and §3.D-§3.H. It confirmed: scenarios still run in every CI
    and release path, and the command-line pin fails if the override is dropped; the tripwire stays
    unmarked; the agents kind 5 to 6 is complete (sha, migration, re-render, mirrors); the advisory
    refusal is whole-line and covers deliver, the phase unit and tests reuse; an unresolvable base
    fails loudly. Raised p3-r1..p3-r7. Fixes: 01d48582f and 119ed12e3 (p3-r1, r2, r4, r5, r6, with
    spec amendments to R6, R7, R8, R10, §3.E and §3.F); p3-r3 filed as derio-net/super-fr#1574. The
    executor finding p3-f-fr-scope-optional-value is deferred to derio-net/super-fr#1575. CI flakes
    seen during the phase and not caused by it: tests/scenarios/placement-move-and-drift.sh (py3.14
    once, not reproduced locally with or without CI=true) and
    test_hooks_worktree.py::test_two_concurrent_removals_do_not_overlap (py3.11 once, stubbed fr; the
    rerun passed). Assessment: with fixes.'
resolves:
- id: p3-r1
  state: fixed
  body: 'Fixed in 01d48582f/119ed12e3: FAST_TIER_COMMAND is gone. `declared_fast_tier` (ci_evidence.py)
    reads `.fr/ci.yaml` `fast_tier` at HEAD; it must be a string with `{base}` as its only placeholder
    and needs `tests: ci`. The brief carries `{mode: ci}` and adds `fast_tier` only when declared. This
    repo declares its own. The spec (R8, §3.F) says fr ships no fast tier. The agent, fr-goal §5/§8,
    01-fr-goal.md and AGENTS.md were reworded; the agents sha was re-pinned within the unreleased version 6.'
- id: p3-r2
  state: fixed
  body: 'Fixed in 01d48582f: `session_reasons` counts as narrowed any args_source other than TESTPATHS,
    non-empty ignore/ignore_glob/deselect, maxfail > 0 (-x) and an overridden testpaths; spec R7 lists
    them. Red first: a subdirectory `-m ""` collect printed no line at HEAD.'
- id: p3-r3
  state: out-of-scope
  body: 'Predates this change: `_read_suite_log` checked only non-empty, location and (now) the advisory
    line before phase 3. Filed as derio-net/super-fr#1574.'
- id: p3-r4
  state: fixed
  body: 'Fixed in 01d48582f: changed_paths uses `--no-renames`; test_a_renamed_module_keeps_its_old_name_in_the_changed_set
    went red with the flag removed.'
- id: p3-r5
  state: fixed
  body: 'Fixed in 01d48582f: a non-Python changed path selects the tests whose source names its file,
    and `--fr-scope` prints one `fr-scope: no test reaches <n> changed paths: …` line for the rest.'
- id: p3-r6
  state: fixed
  body: 'Fixed in 01d48582f: `declared_tests_mode` refuses `tests: ci` unless the same file''s
    gate_checks validate; three red-first cases (missing, empty, scalar).'
- id: p3-r7
  state: fixed
  body: 'Fixed in the spec (01d48582f): R10 allows the local `-m "" --store-durations` run or merging a
    green CI run''s shard durations with scripts/split_check.py merge, with the reason; AGENTS.md already
    described the merge route.'
- id: p3-f-fr-scope-optional-value
  state: deferred
  tracked_by: derio-net/super-fr#1575
  body: 'Caused by R6''s `--fr-scope [<base>]` form, but it fails loudly (a usage error naming the path),
    and the declared fast_tier always puts the base right after the option. Changing the option shape is
    tracked in derio-net/super-fr#1575.'
