- row: git-answers-cached-per-invocation
  op: reword
  why: 'sr-r6: R1 narrowed to the two default-remote helpers'
  acceptance: While a CLI invocation runs, fr asks git each default-remote and default-branch question
    at most once per repository state, a change inside the invocation makes the next question go to git,
    and a library caller outside a CLI invocation never uses the cache
- id: template-fixture-copies-independent
