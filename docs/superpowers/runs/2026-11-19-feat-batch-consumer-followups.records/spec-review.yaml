journal:
  - kind: finding
    id: s-r1
    review_scope: in
    title: "§C 'Callers already handle a raised forge error' is unverified and wrong for some callers of the six tea sites"
    body: "ops/gate.py:336 Gate.default lets a raised TeaError become a traceback; isolation/local.py:3030/:3167 turn it into a refusal (behaviour change); migrate.py:934 hides it. glab re-raises at only three sites (:402, :428, :465). Fix: list each site's callers, map FORGE_ERRORS to StageFailed in Gate.default, state the isolation change as intended."
  - kind: finding
    id: s-r2
    review_scope: in
    title: "The session lookup on execute.before's hot path has no timeout and is retried on every call while it fails"
    body: "index.ts:278-294 would await session.get on every tool call; a hanging get stalls every call. Fix: bound the lookup; a timeout is the fallback, uncached."
  - kind: finding
    id: s-r3
    review_scope: in
    title: "R2 covers only relative targets; the edit gate's unresolvable-patch probe also moves to the session's repo"
    body: "index.ts:197 normalizeTarget(directory, '.fr-unresolvable-patch-target'). Fix: state it in R2 and test it."
  - kind: finding
    id: s-r4
    review_scope: in
    title: "§B says 'golden files, if any', but two Gitea goldens exist; the new per-run fetch warning is not stated"
    body: "tests/fixtures/acceptance_scaffold/gitea-actions.golden:48 and gitea-actions.published.golden; amend.py:349-358 warning on a private repo."
  - kind: finding
    id: s-r5
    review_scope: out
    title: "In CI, a Gitea checkout with a default branch outside main/master/trunk/develop has no default ref, so the check refuses"
    body: "amend.py:322-336; pre-existing, independent of the credential."
  - kind: finding
    id: s-r6
    review_scope: out
    title: "Child sessions have no sentinel of their own, so the shell and push guards never fire for them in any directory"
    body: "guard.ts:184-190, push.ts:48-53, sentinel.ts:209-228; pre-existing, independent of the directory."
  - kind: review
    id: spec-review-1
    title: "independent spec review: 6 findings (4 in scope, all fixed; 2 out)"
    body: "fr-spec-reviewer (separate context) verified q1-q4 are honoured and checked every cited file:line, plus the callers of the six tea sites. s-r1..s-r4 fixed in the spec (07bcac956, R7 added and the tea row's origins corrected); s-r5, s-r6 out of scope, named in Out of scope."
  - kind: lens
    lens: errors
    title: "R6 turns six fail-soft reads into raises; every caller's handling of a raised TeaError (ops gate, isolation, migrate) needs examining"
