journal:
- kind: discovery
  input: true
  id: brief
  title: 'Operator brief: batch docs-wording (13 issues)'
  body: 'Batch `docs-wording` of derio-net/super-fr: 13 issues, delivered as ONE pull request (branch
    feat/batch-docs-wording). Batch title: Docs, help and skill wording sweep. Members:

    - #1265 docs: `fr init scaffold --ops` hint (fr ops gate + fr-devops-gate SKILL) is incomplete — missing
    required --profile/--purpose, and doesn''t say where to scaffold

    - #1441 ops_cmd.py `fr ops seal --encrypt` help says {target} is the target''s name; it is the shell-quoted
    full path

    - #1445 fr plan rework help says the parent is "(Complete + archived)"; rework_create accepts a live
    or incomplete parent

    - #1440 fr''s CLI help lines are too long for STE, so docs/reference/cli.md''s generated tree cannot
    meet the guides'' standard

    - #1447 fr init scaffold --help prints `<tool>;` - Rich markup eats `[@<version>]`

    - #1446 fr-acceptance.md backfill list already renders broken at the merge base: step 4 merges into
    step 3''s paragraph

    - #1450 fr-exit-gates.md tester bullet''s fenced example renders as inline code, at the merge base
    too

    - #1443 docs-currency.md and merge-protection.md lists already rendered broken at the merge base

    - #1442 scripts/build-site.py fill_pages replaces <!-- site:pages --> even inside inline code

    - #1421 shared top bar is cramped at 390 and wraps at 320, and its left edge differs between article
    pages and the landing

    - #1449 fr-triage SKILL.md says a first run creates judgements with schema: 11; the engine writes
    12

    - #1444 fr-acceptance SKILL.md:116 says a --verify row keeps nagging in fr acceptance status whatever
    its status, under Post-merge owed

    - #1448 fr-progress SKILL.md lists fr status among the commands that preview until --yes

    Why together: regenerates all three mirror sets (sync-opencode, sync-hermes, sync-readme). Delivery:
    draft PR with one `Closes derio-net/super-fr#N` line per member; no member issue as a phase tracking_issue;
    never add approved-fr.'
