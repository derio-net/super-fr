step: brainstorm
outcome: done
questions:
  rounds: 2
  trigger: operator-request
  reason: "the operator's round-1 answer on #1491 asked a question back (why does the driver keep crashing, is there a design defect); answering it from the code (31 _fail sites inside the pass, one ForgeReadError boundary) needed the root-fix and refusal-handling decisions"
journal:
  - kind: discovery
    input: true
    id: brief
    title: Operator brief — batch train-truth (as dispatched)
    body: |
      /fr-goal batch train-truth

      Batch `train-truth` of derio-net/super-fr: 6 issues, delivered as ONE pull request.
      Members: #1491 (a transient refused state-ref push ends the drive loop, and nothing restarts the driver),
      #1492 (red CI on an unapproved draft batch PR is never handed back), #1493 (merge conflicts are found only
      when a PR heads the train, after it was approved), #1540 (_fetched_reader lets GitError escape and does not
      record the failed fetch), #1541 (the swap_issue_labels retry assumes gh resolves all labels before mutating),
      #1543 (batch cancel of a never-dispatched batch still needs --checkout).
      Why together: all in the driver loop (batch_drive.py, triage_batch_cmd.py); #1492 and #1493 share the draft
      non-member filter.
      Delivery rules: branch feat/batch-train-truth; a draft PR as soon as the spec is committed whose body closes
      each member with its own `Closes derio-net/super-fr#<n>` line; no member issue as a phase tracking_issue;
      never add the approved-fr label.
      Mid-brainstorm operator ask: "btw, I would like to watch the driver's actions. Is there a way to make this
      event log easily visible?"
  - kind: decision
    id: d-resident-orchestrator
    title: The driver is owned by a resident orchestrator session
    body: |
      Operator (round 1 clarification): the Wave Driver will eventually be manned by a resident orchestrator agent,
      like the gates. The driver runs beside a persistent agent session that is responsible for it; the agent must
      always know the driver is running; the driver keeps itself alive (itself or via a supervisor) without
      consuming tokens wherever it breaks down; if the agent session is killed, the driver and its supervisor go
      with it.
  - kind: decision
    id: d-1491-shape
    title: "#1491: a session-bound supervisor (drive --supervise), not detached"
    body: Operator chose option 1 (round 1 Q1). The supervisor restarts the driver after a crash with bounded backoff and a crash-loop limit, stays in its caller's session, and dies with it; the background-exit notice is the agent's one wake.
  - kind: decision
    id: d-red-delivered
    title: "#1492/#1493: the existing session-status rule decides when a draft is handed back"
    body: Operator chose the recommended option (round 1 Q2). Only an idle session is handed a red or conflicting draft; a working one is waited on; absent/done is a Needs you now entry. Caps count draft and ready hand-backs together.
  - kind: decision
    id: d-1541
    title: "#1541: make the retry assumption-free (docstring + unit test), no live walk"
    body: Operator chose the recommended option (round 1 Q3).
  - kind: decision
    id: d-1543
    title: "#1543: a never-dispatched cancel has no tracking gate and still releases claims"
    body: Operator chose the recommended option (round 1 Q4).
  - kind: decision
    id: d-verify
    title: "Verification: CI tests with fakes, strategy none, gate developer, no Test Plan"
    body: Operator chose the recommended option (round 1 Q5).
  - kind: decision
    id: d-root-fix
    title: Fix the crash class at its root with a typed pass boundary
    body: Operator chose the recommended option (round 2 Q1). Inside a pass, failures are a DriverRefusal (operator must act) or transient (reported once, capped exponential backoff, next pass re-reads); 10 failed passes in a row stop as a refusal; a tripwire forbids _fail/typer.Exit in the pass.
  - kind: decision
    id: d-refusal-loop
    title: On a refusal the driver exits (the agent wakes), tied to a self-improvement loop
    body: |
      Operator (round 2 Q2): "1. but only if this is tied to a self-improvement loop, in order to driver the real
      refusals to zero". Interpreted as R8-R9: every refusal, transient failure and crash is counted per stable
      cause in a durable ledger, and `fr triage batch drive failures --file --yes` turns each recurring cause into
      a tracked forge issue (commented as it recurs, re-filed if it recurs after closing), named by every refusal's
      exit line and board need. Interpretation recorded for the operator to correct at PR review.
  - kind: decision
    id: d-activity-log
    title: The driver's actions are visible as a persistent activity log (drive.log, drive log -f, board Activity panel)
    body: Operator's mid-brainstorm ask ("I would like to watch the driver's actions"), folded in as R22-R23 before the brainstorm resolved; the operator may veto it at PR review.
  - kind: lens
    lens: errors
    title: The pass boundary reclassifies every failure path of the driver; each must land in the right class
  - kind: lens
    lens: tests
    title: Process-lifetime and backoff behaviour is easy to test vacuously (sleeps, signals, orphaned children)
acceptance:
  - id: drive-pass-boundary
    capability: A looping wave driver survives its own transient failures
    acceptance: In a looping `drive --yes`, a refused state-ref push, a git error or an unexpected exception skips the pass, is reported once per cause, and is retried with a capped, growing backoff; the next pass pushes what was left, losing or duplicating no event; only an operator-only refusal, or 10 failed passes in a row, stops the driver; --once and plan mode keep their exit codes
    origin: [spec:2026-11-19-batch-train-truth#R1, spec:2026-11-19-batch-train-truth#R2, spec:2026-11-19-batch-train-truth#R3, spec:2026-11-19-batch-train-truth#R4, spec:2026-11-19-batch-train-truth#R5, spec:2026-11-19-batch-train-truth#R6]
    status: not-implemented
  - id: drive-failure-ledger
    capability: Driver refusals feed an improvement loop
    acceptance: A refusal is recorded with its cause and resume command and shown under Needs you now; every refusal, transient failure and crash is counted per cause; `drive failures --file --yes` files or updates one issue per cause, so recurring causes become tracked work
    origin: [spec:2026-11-19-batch-train-truth#R7, spec:2026-11-19-batch-train-truth#R8, spec:2026-11-19-batch-train-truth#R9]
    status: not-implemented
  - id: drive-session-supervisor
    capability: A supervised driver restarts after a crash and dies with its owning session
    acceptance: Under `drive --supervise --yes` a SIGKILLed driver is back within the backoff bound and replays nothing; a crash loop stops with its cause recorded; when the supervisor's parent dies the supervisor and its driver exit; `drive status` reports whether a driver holds the scope
    origin: [spec:2026-11-19-batch-train-truth#R10, spec:2026-11-19-batch-train-truth#R11, spec:2026-11-19-batch-train-truth#R12, spec:2026-11-19-batch-train-truth#R13]
    status: not-implemented
  - id: drive-red-drafts
    capability: Red CI on any open batch PR is handed back before approval
    acceptance: An unapproved draft batch PR with failing checks gets the red recovery (idle session handed back once per head, working one waited on, gone one a Needs you now entry) and is never shown as awaiting approval
    origin: [spec:2026-11-19-batch-train-truth#R14, spec:2026-11-19-batch-train-truth#R15]
    status: not-implemented
  - id: drive-conflict-early
    capability: Conflicts on any open batch PR are handed back before approval
    acceptance: An open batch PR the forge reports conflicting, draft or not, approved or not, is trial-merged and a real conflict is handed back with the existing conflict rules; a version-file-only conflict is not handed back; no PR the forge reports clean is trial-merged; a conflicting PR is never asked for approval
    origin: [spec:2026-11-19-batch-train-truth#R16, spec:2026-11-19-batch-train-truth#R17]
    status: not-implemented
  - id: drive-fetch-once
    capability: A pass fetches each repo at most once
    acceptance: Within one pass a repo whose fetch failed is not fetched again, and its later reads fail as a transient failure
    origin: [spec:2026-11-19-batch-train-truth#R18]
    status: not-implemented
  - id: swap-labels-retry-converges
    capability: The label swap retry is correct whatever gh's resolution order
    acceptance: A refused label swap that applied part of its change, followed by the retry, ends with exactly the wanted labels
    origin: [spec:2026-11-19-batch-train-truth#R19]
    status: not-implemented
  - id: cancel-undispatched-no-checkout
    capability: Cancelling a never-dispatched batch needs no clone
    acceptance: "`batch cancel --yes` of a batch with no dispatch event needs no --checkout, writes no label or comment, releases this scope's claims and records the cancel"
    origin: [spec:2026-11-19-batch-train-truth#R20]
    status: not-implemented
  - id: drive-activity-log
    capability: The operator can watch the driver's actions live
    acceptance: Every line a looping driver or its supervisor prints lands, timestamped and kinded, in the scope's drive.log; `drive log -f` follows it across a rotation; the Batches board shows the newest 50 entries
    origin: [spec:2026-11-19-batch-train-truth#R22, spec:2026-11-19-batch-train-truth#R23]
    status: not-implemented
