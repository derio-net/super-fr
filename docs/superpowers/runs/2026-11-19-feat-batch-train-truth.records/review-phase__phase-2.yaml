  body: A dead child with a live, start-matched supervisor reports 'supervisor alive, driver restarting', exit 0; match and mismatch tested. Commits ed163871d, 626857363; targeted run 3910 passed (p2-fix.log).
- id: p2a-r4
  state: fixed
  body: Size check, rotation and write run under fcntl.flock on drive.log.lock with a re-stat under the lock; tail takes a shared lock; concurrent-appender test asserts drive.log.1 is never a near-empty replacement and no line is torn. Commits ed163871d, 626857363; targeted run 3910 passed (p2-fix.log).
