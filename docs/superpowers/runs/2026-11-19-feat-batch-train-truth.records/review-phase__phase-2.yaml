  body: Supervisor records last_refusal via record_refusal(..., as_supervisor=True), renders the board once from disk (on_refusal callback, no forge reads), and prints every line (incl. the resume command and the `fr triage drive failures --file --yes` pointer) to stderr as well as drive.log; the crash-loop integration test asserts all three. Commits ed163871d, 626857363; targeted run 3910 passed (p2-fix.log).
- id: p2a-r2
  state: fixed
  body: 'driver.yaml records pid_start/supervised_start (fr.safe_spawn.process_start); drive status requires the live start time to match, and trusts a record without one only under a live lease of this host. Tests: unrelated live pid with no lease exits 3, matching start exits 0. Commits ed163871d, 626857363; targeted run 3910 passed (p2-fix.log).'
