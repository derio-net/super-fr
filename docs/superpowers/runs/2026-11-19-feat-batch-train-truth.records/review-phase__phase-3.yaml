resolves:
- id: p3a-r1
  state: fixed
  body: New _fetch_once records success and failure; merge_ctx and _fetched_reader both go through it, so a recorded failure re-raises the same GitError without fetching. Tests cover both orders. Commit 26a9a9231; scoped run 7785 passed (p3-fix.log).
- id: p3a-r2
  state: fixed
  body: '_recover reads through self._fetched_reader(repo).rev_parse(ctx.main); test: a red pass fetches the repo once. _base_now''s fetch predates this branch (unchanged against origin/main) and is left as is. Commit 26a9a9231; scoped run 7785 passed (p3-fix.log).'
- id: p3a-r3
  state: fixed
  body: _session_target takes the runner from the dispatch event, else adapter.runner_for(batch), else batch.launch.runner, and never resolves a launch; no runner reads as absent (red) or held (probe). Unit-tested directly. Commit 26a9a9231; scoped run 7785 passed (p3-fix.log).
- id: p3a-r4
  state: fixed
  body: New _probe_said dedupes by batch, head and cause; two-pass loop tests show each line once. Commit 26a9a9231; scoped run 7785 passed (p3-fix.log).
- id: p3a-r5
  state: fixed
  body: Cleanup GitError suppressed, temp root always removed, a leftover probe-<head12> force-removed (rmtree fallback) before the probe; tests for KeyboardInterrupt mid-merge, merge GitError, failing cleanup, leftover dir, and a said-once uncached retry. Commit 26a9a9231; scoped run 7785 passed (p3-fix.log).
- id: p3a-r6
  state: fixed
  body: Added each as a test. Commit 26a9a9231; scoped run 7785 passed (p3-fix.log).
- id: p3-orch-r12-parent-race
  state: fixed
  body: Supervisor takes the parent explicitly and stops before starting a driver when it already ended; the rig names its parent and the supervisor names itself; a new test (parent ended before run) and the repaired race both failed before the fix and pass after. Commit c28d94e42.
