journal:
  - {kind: finding, id: sr-1, review_scope: in, title: "`drive status|failures|log` cannot be subcommands: `fr triage batch drive` is a command with variadic batch ids", body: "triage_batch_cmd.py:7311-7316 (`drive` leaf command, positional `batch_ids`); loop command argv :3337; gh#998 re-exec :7425. Put the verbs on the existing `fr triage drive` group (triage_drive_cmd.py:64-69) and name that shape in R9, R13, R22 and §B, §C, §E."}
  - {kind: finding, id: sr-2, review_scope: in, title: "R6's tripwire forbids what §A puts in `_host_loop`, and what `_host_loop` already does", body: "`_host_loop` has `_fail` :7262, `raise typer.Exit` :7294 (--once) and :7304 (stalled). Say how --once, plan mode and a stall leave the loop (a typed result that `batch_drive_command` converts), or narrow the tripwire."}
  - {kind: finding, id: sr-3, review_scope: in, title: "The boundary misclassifies refusals raised by module-level helpers the pass calls; typer.Exit is not SystemExit", body: "`_act` calls `dispatch_batch` (:5555, defined :1817), which `_fail`s for the tracking gate (:1857) and runner refusals (:1970-:1975). `typer.Exit` is click's `Exit(RuntimeError)` (triage_kanban_cmd.py:93-95), so `except Exception` would retry it as transient. Classify it explicitly."}
  - {kind: finding, id: sr-4, review_scope: in, title: "Lease renewals during budget waits are outside the boundary", body: "Only `one_pass` is in the `try` (:7258-7276); `before_pass`/`wait_out` (:7249-7252, :7268, :7284, :7306) call `take_lease` (:3527), which `_fail`s (:3998-3999). After §A that is an uncaught exception with no ledger entry. Cover the waits."}
  - {kind: finding, id: sr-5, review_scope: in, title: "The cloud entry `fr triage drive pass` catches only ForgeReadError, so the new exceptions escape it", body: "triage_drive_cmd.py:581-600. Give `drive_pass_command` its own mapping (refusal 2, transient today's code, outbox still written) and a test."}
  - {kind: finding, id: sr-6, review_scope: in, title: "R5 says today's exit codes stay, but the new exceptions carry no code", body: "Codes come from each `_fail(..., code=)` site, e.g. code=1 for a failed dispatch (:6307). Carry a `code` on the exceptions."}
  - {kind: finding, id: sr-7, review_scope: in, title: "LeaseHeld and LeaseExpired are missing from R2's refusal list, so they become transient", body: "lease.py:77-90, :166-177 (`LeaseExpired` needs `fr triage lease take --yes`); `take_lease` `_fail` :3998-3999. Add both to R2 with cause ids and resume commands."}
  - {kind: finding, id: sr-8, review_scope: in, title: "The R7 stopped-driver need cannot show: a refusing driver keeps its lease, and no pass renders the board after it", body: "Code 2 keeps the lease (:7411-7413), live up to ~75 min (lease.py:105-110). Treat a refusal newer than the lease's last pass as stopped, and render the board once before exit 2."}
  - {kind: finding, id: sr-9, review_scope: in, title: "\"Carried by the state ref\" needs a REF_FILES change, and the ref's contract excludes host-local identity", body: "state_ref.py:53-69 (`REF_FILES`), :7-8 (host-only files never ride). `driver.yaml` holds a pid and host id; a shared ledger adds a CAS conflict surface. Decide what rides and say so."}
  - {kind: finding, id: sr-10, review_scope: in, title: "Reusing `_conflict` for a draft starts a fresh conflict session, against d-red-delivered and R16's \"idle sessions only\"", body: "`_hand_back` falls through to `_fresh_conflict` for absent/done (:6224-6229); `_conflict` records a merge stop (:5953); the error text says the worktree is kept (batch_merge.py:640-642). Give the probe its own delivery (idle hand-back, working wait, absent/done to Needs you), say whether it writes merge-stops.json, fix the worktree text."}
  - {kind: finding, id: sr-11, review_scope: in, title: "Trial merges repeat every pass with no memo, and draft-only repos add forge reads beyond the one `pr_view`", body: "A DIRTY PR whose conflicts are all resolvable records no event (batch_drive.py:877-878) and is trial-merged every pass. Memoise per (PR, head, base sha); the merge context build reads merge methods/rules (:4087-4107, :4120-4124) — avoid or allow those reads."}
  - {kind: finding, id: sr-12, review_scope: in, title: "R18's design raises a non-TriageError, which skips every caller's existing degradation", body: "`GitError(TriageError)` (gitseam.py:35); callers degrade on TriageError (`_ci_none` :4842-4847, :4491, :4545, :4693, :4862, :4875). Re-raise the recorded `GitError`."}
  - {kind: finding, id: sr-13, review_scope: in, title: "R15's train line cannot list stepped-over drafts: the walks return no Train when there are no members", body: "batch_drive.py:1537-1538, :1672-1673; `stepped` only for members (:1556, :1642). Put non-member red PRs in `stepped` and build a Train when only non-members exist, or drop the clause."}
  - {kind: finding, id: sr-14, review_scope: in, title: "The supervisor is underspecified: argv, lock and lease, a child stopped by signal, and the crash-loop exit code", body: "Child argv must be the interpreter (`fr_argv`, safe_spawn.py:18-20) less `--supervise`; the supervisor must not take `drive.lock` (:3585-3592) or the lease; a signal to the child is a clean stop today (`_sigterm_interrupts` :7215-7234, :7405-7407) and must not be restarted; R12 needs a crash-loop exit code."}
  - {kind: finding, id: sr-15, review_scope: in, title: "R9 does not say which repo a driver-failure issue is filed in, or how private detail stays out of it", body: "Org/group scopes span many repos; the last message carries repo names, heads and paths (privacy guard fr/triage/privacy.py). Name the target repo and whose settings gate it; keep the message out of the issue."}
  - {kind: finding, id: sr-16, review_scope: in, title: "Stale or wrong names in the spec", body: "`views.needs` is `needs_you` (views.py:277); a `merge-conflict` need exists (views.py:405-414); `conflicting()` is used elsewhere too (kanban.py:516, render.py:612, views.py:434); `_host_loop` is at :7237; `_sleep`/`wait_out` are module-level (:3465, :3516)."}
  - kind: review
    id: spec-review-1
    title: "independent spec review: 16 findings, all in scope, all fixed in the spec"
    body: |
      Reviewer fr-spec-reviewer raised sr-1..sr-16, every one tagged in scope. All are fixed in the
      rewritten spec (requirements renumbered R1-R24; the pending rows' origins corrected with
      `fr acceptance amend --origin`). Decisions honoured; d-red-delivered now honoured for conflicting
      drafts too (R17: absent/done is a held conflict, never a fresh session). The reviewer's suggested
      `simplicity` lens is added.
  - kind: lens
    lens: simplicity
    title: One PR adds a pass boundary, a supervisor, a ledger with issue filing, an activity log and three verbs; each must earn its place
resolves:
  - {id: sr-1, state: fixed, body: "Verbs moved to the existing `fr triage drive` group: `fr triage drive status|failures|log` (R10, R14, R22, §B, §C, §E)."}
  - {id: sr-2, state: fixed, body: "R7: deliberate ends leave `_host_loop` as a returned `LoopEnd` that `batch_drive_command` converts; the tripwire covers `_Driver`, `one_pass`, `_host_loop`, `wait_out` (§A)."}
  - {id: sr-3, state: fixed, body: "R4: a click `Exit` reaching the boundary is classified by code (2 refusal with cause `exit:<function>`, else transient); a behavioural test covers `dispatch_batch` (§A)."}
  - {id: sr-4, state: fixed, body: "R1 and §A: one `try` wraps the whole iteration, pacing waits and renewals included."}
  - {id: sr-5, state: fixed, body: "R6 and §A: `drive_pass_command` classifies the same way, writes its outbox and exits with the carried code."}
  - {id: sr-6, state: fixed, body: "R2/R3: both exception types carry `code` (refusal 2; transient 2, or 1 where the site used code=1)."}
  - {id: sr-7, state: fixed, body: "R2 lists `LeaseHeld` and `LeaseExpired` (resume `fr triage lease take --yes`)."}
  - {id: sr-8, state: fixed, body: "R8: the board renders once before exit 2 and the need shows while the recorded refusal is newer than the lease's last pass; the lease rule is unchanged."}
  - {id: sr-9, state: fixed, body: "R9 and §B: both files are host-local, not in `REF_FILES`; the state_ref docstring names them."}
  - {id: sr-10, state: fixed, body: "R17 and §D: the probe's own delivery (idle hand-back via the message path only, working/unknown wait, absent/done a `held` conflict event), no merge stop, no 'worktree kept' text (scratch always removed)."}
  - {id: sr-11, state: fixed, body: "R17 and §D: memo per (PR, head, base sha) per process; `trial_conflicts` needs only the fetched clone and version config, so no merge-methods or rules read."}
  - {id: sr-12, state: fixed, body: "R19 and §F: the recorded `GitError` is re-raised, so each caller's handler decides."}
  - {id: sr-13, state: fixed, body: "R16 and §D: red non-members go into `stepped`; a Train is returned when the repo has a member or a red or conflicting non-member."}
  - {id: sr-14, state: fixed, body: "R11/R13 and §C: child via `fr_argv` less `--supervise`; supervisor takes no lock or lease; the child's own clean stop on SIGINT/SIGTERM/SIGHUP is deliberate; crash-loop exits 2."}
  - {id: sr-15, state: fixed, body: "R10: target is the scope's state repo, else the single-repo scope's repo, refused otherwise; that repo's settings gate it; the issue never carries the message text."}
  - {id: sr-16, state: fixed, body: "Names corrected (`needs_you`, `_host_loop` :7237, module-level `_sleep`/`wait_out`, `conflicting()` scoped to batch_drive.py); R18 reuses the existing `merge-conflict` need for held conflicts so one PR has one row."}
