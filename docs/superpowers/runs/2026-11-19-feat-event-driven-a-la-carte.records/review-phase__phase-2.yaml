    title: Phase 2 adversarial review (configuration branch, the switch, the edit gate on three harnesses)
    body: |
      Independent adversarial reviewer read e297636..HEAD against §B, R5, R6, R8 and R13, attacked the
      edit gate with structural forgeries (wrong branch, wrong path, fr at fr-config's path, primary
      checkout, same-basename foreign worktree, differing switches, symlinked allowlist): all held, bash and
      TS identical. Reproduced three real defects in scratch repos (legacy-push race lockout, foreign
      fr-config adoption, allowlist self-unlock). Seven in-scope findings, all fixed in 6a01ea762..aa5c5c255,
      plus three automated security-review revisions (marker protection and file identity; no auto-sync of
      the legacy copy; second-parent labelling and --expect on fr settings sync) and the configuration PR
      honouring git.pr. Targeted selection 3009 passed / 9 skipped, bun 399/0, tsc, ruff, mypy, parity clean.
  - {kind: finding, id: p2-r1, phase: 2, review_scope: in, title: "the legacy fr push lost a race with any artifact push, leaving differing switches on origin and a permanent lockout"}
  - {kind: finding, id: p2-r2, phase: 2, review_scope: in, title: "a fetching up adopted a foreign origin or local fr-config, committed onto product history and pushed it; the gate then treated that checkout as a write target"}
  - {kind: finding, id: p2-r3, phase: 2, review_scope: in, title: "fetching up / run start / stealth enter pushed a new branch to origin, which spec §B does not provide for"}
  - {kind: finding, id: p2-r4, phase: 2, review_scope: in, title: "under stealth up --no-fetch still pushed"}
  - {kind: finding, id: p2-r5, phase: 2, review_scope: in, title: "the moved allowlist could unlock itself through an old .fr/** glob"}
  - {kind: finding, id: p2-r6, phase: 2, review_scope: in, title: "the bash/TS parity drift test pinned only the switch location strings, not the decision logic"}
  - {kind: finding, id: p2-r7, phase: 2, review_scope: in, title: "later changes to fr-config were direct pushes, not the pull request spec §B requires"}
