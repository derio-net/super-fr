  P7.T1: "defer, requeue and queue-retry share one find, one write and one wording helper (_leavable, _wave_name); nothing was duplicated to fold"
  P7.T2: "the queue line, the board section and the pass all read one QueueView (queue_view), so the first cut had no second copy to merge"
