resolves:
  - id: p3-r1
    state: fixed
    body: _land records queue_halt on held/stopped; the planner's live_halt/_halted turn the plan into one queue-need (Needs you) and nothing builds or lands until queue.land changes or main moves; tests in test_queue_resume.py and test_wave_queue_planner.py.
  - id: p3-r2
    state: fixed
    body: queue_refusal refuses land:merge with a version block, naming both and suggesting queue.land push; spec R11 says so; test_queue_exec.py.
  - id: p3-r3
    state: fixed
    body: _resume_landing records the deepest recorded combination that is an ancestor of main (push) or reads the PRs back from the forge (merge), halting on an untested tree; tests for a foreign move after an unrecorded push and kills mid and after forge merges.
  - id: p3-r4
    state: fixed
    body: queue_landed gives the landed batches; settle_approvals and pr_open_queue skip them; tests in test_triage_approval.py and test_queue_drive_cmd.py (fails without the wiring).
  - id: p3-r5
    state: fixed
    body: new tests/integration/test_queue_drive_cmd.py drives the real command over a real bare origin; build, one-push landing, post_merge once, resume after a killed driver, the failure mapping and no-post_merge landing.
  - id: p3-r6
    state: fixed
    body: test_tripwire_product_push.py pins every push_leased caller by module and function and atomic=True only in land_push, with a scanner self-test.
  - id: p3-r7
    state: fixed
    body: land_push holds unless the bottom parent is the base and base is an ancestor of the tip, persisted as a halt; tests in test_queue_land.py.
  - id: p3-r8
    state: fixed
    body: slot_leases gives the last recorded sha per slot; builds lease on it; a lost lease is recorded as queue_slot_lost and resume never re-pushes over it; tests in test_queue_resume.py, test_queue_build.py and the planner.
  - id: p3-r9
    state: fixed
    body: _keeps_merge_content compares the replayed tree with a plain merge and ejects with "rebase would drop content from its merge commits"; real evil-merge test in test_queue_build.py.
  - id: p3-r10
    state: refuted
    body: origins.py:311 compares against origins.py's own FACTS_SCHEMA = 1 (line 74, the origins-facts.json stamp), not fr.triage.model.FACTS_SCHEMA, which origins never imports; the bump to 16 leaves cached origins facts readable.
