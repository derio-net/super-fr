resolves:
  - id: p4-r1
    state: fixed
    body: hold writes are merge commits via Checkout.ref_commit(previous=) (driver and release.py), readers take the first parent; a refused write is a queue_halt ("hold write refused") that stops landing with a Need until a write succeeds, and refused drained/cleared writes are Needs; spec R17/§G updated; tests under a no-force-push hook in test_queue_hold.py, planner and release-script tests.
  - id: p4-r2
    state: fixed
    body: "prepare's if runs an fr-hold push only when its head commit starts 'fr-hold: drained'; deletion guard kept; test_release_workflow.py evaluates the expression per case."
  - id: p4-r3
    state: fixed
    body: publish re-runs check_hold before push; held prints nothing is pushed and clears nothing; test_release_script.py.
  - id: p4-r4
    state: fixed
    body: _finish_and_clear clears only on EXIT_OK; docstring fixed; test_a_run_the_floor_check_fails_clears_nothing.
  - id: p4-r5
    state: fixed
    body: _hold_facts returns the unread reason; status reports hold_unknown and "no final can be confirmed"; tests in test_release_status.py.
  - id: p4-r6
    state: fixed
    body: AGENTS.md, release.py's docstring and docs/merge-protection.md name the leased cleared-hold push as a third authenticated push; the hold fetch stays credential-free.
  - id: p4-r7
    state: fixed
    body: hold_verdict treats a naive or unparseable stamp as an unreadable hold that holds, with a warning; tests in test_release_status.py.
  - id: p4-r8
    state: fixed
    body: test_queue_hold.py covers a remote refusing hold pushes and a writer taking the hold between the check and the lease (lease fails, nothing lands, reported as queue-held naming the other scope).
