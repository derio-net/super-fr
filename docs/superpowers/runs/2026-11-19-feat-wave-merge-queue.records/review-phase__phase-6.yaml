journal:
  - kind: review
    id: p6-review-1
    phase: 6
    title: Phase 6 review — ten in-scope findings and one out-of-scope, the ten fixed
    body: |
      An independent reviewer read the gates and close-out diff against R1–R36. It confirmed the planner's
      barrier (no admission without a release, nothing lands behind an open barrier, no drain while one is
      open), the DevOps stage's rerun and resume, --path's refusals before any write, and the workflow
      triggers. It raised p6-r1..p6-r9 and p6-r11 (in) and p6-r10 (out). Fixes are d2c45a1a8..78e3dc52d;
      full suite after them: 17032 passed, 122 skipped, exit 0. Two deviations: the strict post_merge
      gate is host-only (the cloud driver runs no post_merge, R20), and the --allow-migratable trial copies
      the artifacts' own root rather than reproducing the placement.
  - {kind: finding, id: p6-r1, phase: 6, review_scope: in, title: "a release with an unreadable patch-id stayed valid at any head"}
  - {kind: finding, id: p6-r2, phase: 6, review_scope: in, title: "the release bound to the head the driver read, not the head stage 2 checked"}
  - {kind: finding, id: p6-r3, phase: 6, review_scope: in, title: "stage 4 never finished under forge labels off, even with the label added by hand"}
  - {kind: finding, id: p6-r4, phase: 6, review_scope: in, title: "stage 2 stopped merging in repos no wave driver serves, with no hand-merge instruction"}
  - {kind: finding, id: p6-r5, phase: 6, review_scope: in, title: "the change summary did not name the fr ops gate --method removal or that the DevOps stage no longer merges"}
  - {kind: finding, id: p6-r6, phase: 6, review_scope: in, title: "a wave close-out could start before its last landing's post_merge, giving two close-outs"}
  - {kind: finding, id: p6-r7, phase: 6, review_scope: in, title: "the close-out chose files to migrate by name, catching the acceptance fragment and missing the spec"}
  - {kind: finding, id: p6-r8, phase: 6, review_scope: in, title: "--allow-migratable passed untried refusals under quiet and crashed under stealth"}
  - {kind: finding, id: p6-r9, phase: 6, review_scope: in, title: "an empty patch-id meant both a voided release and a release at an empty diff"}
  - {kind: finding, id: p6-r10, phase: 6, review_scope: out, title: "anyone with triage permission can add the two fr-queue labels"}
  - {kind: finding, id: p6-r11, phase: 6, review_scope: in, title: "three texts said the barrier lands alone, and a docstring misnamed the commits past the base"}
resolves:
  - {id: p6-r1, state: fixed, body: "settle_release keeps an unreadable-patch-id release only at its recorded head (test_queue_gate_labels.py)."}
  - {id: p6-r2, state: fixed, body: "stage 2 writes the fr-queue:release marker naming head and patch-id; the driver releases only at that patch-id, from a trusted commenter."}
  - {id: p6-r3, state: fixed, body: "stage 4 adds the label only when it is absent, then finishes."}
  - {id: p6-r4, state: fixed, body: "with no queue config stage 2 tells the operator to merge by hand and a hand merge completes it; the gate never merges."}
  - {id: p6-r5, state: fixed, body: "the fragment summary names both removals; check-change-fragment passes."}
  - {id: p6-r6, state: fixed, body: "the strict gate is restored: the close-out waits for every host-run member's post_merge and starts once."}
  - {id: p6-r7, state: fixed, body: "owned_stale takes the archive's own move set (Worktree.archive_moves); real-git test added."}
  - {id: p6-r8, state: fixed, body: "the trial copies artifact_root, excludes .fr-isolation, and any trial error fails the stale artifact."}
  - {id: p6-r9, state: fixed, body: "QueueReleaseEvent.voided is explicit (decision p6-release-void-explicit); barrier_keys counts only live releases."}
  - {id: p6-r10, state: out-of-scope, body: "copies the approved-fr trust model the spec chose; not caused by this phase's shape beyond what the spec decided."}
  - {id: p6-r11, state: fixed, body: "the docstring and the three texts now say the barrier lands as the last entry of its push."}
