schema_version: 12
run: 2026-11-20-feat-ci-single-python
step: brainstorm
outcome: done
questions:
  rounds: 2
  trigger: design-risk
  reason: >-
    Round 1's free-text answer moved the whole base to Python 3.14, which the brief listed as out
    of scope (requires-python); that reopened the floor, the scaffolded consumer CI image, the
    meaning of "Nowhere but for 3.11", and the shard count chosen under the 3.11-coverage premise.
journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: Operator brief, verbatim
    body: |
      /fr-goal Implement derio-net/super-fr#1589: run the PR test suite in .github/workflows/ci.yml on a single Python version instead of 3.11 and 3.14. Context: ci.yml's collect and test jobs have a python axis [3.11, 3.14] x 7 shards; release.yml already runs only 3.11 (UV_PYTHON). The second leg was added on purpose in #940/#945 so a version-specific break shows from either end, so decide in the spec which version stays (default: the declared floor 3.11, which requires-python and tests/unit/test_ci_python_floor.py pin) and whether any cheaper check of the newest Python survives (release only, or main only). Touch points the issue lists: coverage is measured on the 3.14 leg only (cov_args, the coverage upload step), split-check merges the 3.14 leg's durations-py3.14-shard-* files on main, tests/unit/test_ci_split_workflow.py asserts [3.11, 3.14] and py3.14, test_ci_shards.py, test_ci_python_floor.py, .github/ci-budget.yaml and the CI notes in AGENTS.md. Out of scope: changing requires-python, and the hook flake in #1586 (draft PR #1588, already open). The host is loaded: run single test files only, never the full suite; CI is the suite evidence. Reference #1589 in the PR so it closes. Deliver a draft PR; never mark it ready or merge.
  - kind: decision
    id: d-python-version
    title: The whole base moves to Python 3.14; no 3.11 anywhere
    body: >-
      Round 1 Q1, operator free text: "we move the whole base to 3.14, no python 3.11 anywhere".
      This overrides the brief's out-of-scope note on requires-python. Round 2 Q1 confirmed:
      requires-python >=3.14 in all six pyproject.toml files, ruff py314, mypy 3.14.
  - kind: decision
    id: d-major-bump
    title: Released as a major bump
    body: >-
      Round 2 Q1: "Yes, >=3.14, major bump". The operator asked whether uv handles it; answered
      from the code: install.sh and the scaffolded CI use `uv tool install` with no --python, so uv
      downloads a managed 3.14; only download-disabled hosts and plain-pip installs break. The
      operator's choice (major) stands.
  - kind: decision
    id: d-no-second-leg
    title: No second interpreter is tested anywhere
    body: >-
      Round 1 Q2 answer "Nowhere but for 3.11", clarified in round 2 Q3: 3.14 only, no second leg,
      no main-only leg, no scheduled run.
  - kind: decision
    id: d-shards
    title: The test job keeps 7 shards
    body: >-
      Round 1 Q3 chose 9 shards under the 3.11-coverage premise; round 2 Q4, with coverage on 3.14,
      chose to keep 7.
  - kind: decision
    id: d-scaffold-image
    title: Scaffolded consumer CI moves to python:3.14
    body: Round 2 Q2. scaffold.py:290,391,548 and the golden fixtures.
  - kind: decision
    id: d-verification
    title: Verified by this PR's CI plus one post-merge row; no gate holds the close-out
    body: >-
      Round 1 Q4: strategy none before merge (pinned unit tests and the PR's own CI); one Test Plan
      row for the first main push (durations merge, release suite on 3.14); gate developer.
