    id: setup-script-require-waits-exit-0
    title: "require step: a missing variable that step 4 already reported as waiting exits 0"
    body: "R14 exits 0 only for the release check. The Test Plan's pre-merge run reaches require with the variable still waiting for the merge, so that case prints the wait and exits 0. A missing environment secret, or a variable missing with no reported wait, still refuses (exit 1). With no key at hand the installation-repositories check is a printed settings URL rather than a blocking prompt, so a rerun with no stdin stays a no-op."
    phase: 1
