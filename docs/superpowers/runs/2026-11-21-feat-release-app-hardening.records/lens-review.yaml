- id: l-tests-r3
  state: fixed
  body: test_other_environment_drift_is_corrected covers a wait timer and a protected-branches policy.
- id: l-tests-r4
  state: fixed
  body: test_a_signal_mid_run_revokes_the_token_and_removes_the_temp_dir sends SIGTERM while the installation
    token is live.
- id: l-tests-r5
  state: out-of-scope
  body: The style of the existing P3-R8 header tests; the structural R1 invariant is pinned by the environment
    and secret tripwires, so the header test adds wording only.
- id: l-tests-r6
  state: fixed
  body: The script filters vX.Y.Z and vX.Y.Z-rc.N and ranks a final above its RCs; test_the_newest_release_tag_ignores_other_tags_and_ranks_a_final_above_its_rcs.
- id: l-errors-r1
  state: fixed
  body: Explicit exits on a failed tags or runs read; test_a_failing_tags_read_stops_and_is_never_read_as_no_release.
- id: l-errors-r2
  state: fixed
  body: Refusals now show GitHub's message field (never any other field, never a success body) and openssl's
    first error line, plus a hint for 401; test_the_refusal_names_github_s_message_and_never_a_token and
    the BODYSECRET check.
- id: l-errors-r3
  state: fixed
  body: A non-204 revoke warns that the token stays valid until it expires; test_a_failed_revoke_is_reported.
- id: l-errors-r4
  state: fixed
  body: --paginate with per_page=100, merged pages; a 404 refuses with 'organisation-owned repos only';
    two tests.
- id: l-errors-r5
  state: fixed
  body: EOF says 'no answer (stdin closed)'; a failed write names itself and says earlier writes stay
    applied and a rerun reads state first; two tests. It also exposed a test that passed only because
    the half-done offer consumed its answer, now fixed.
- id: l-errors-r6
  state: out-of-scope
  body: GitHub's behaviour, not a defect of the diff; docs/merge-protection.md now explains both cases
    (l-docs-accuracy-r1).
- id: l-security-r1
  state: fixed
  body: Declining that offer now ends the run 'incomplete' with exit 1; test_a_kept_repository_secret_leaves_the_setup_incomplete
    and test_a_declined_offer_continues.
- id: l-security-r2
  state: refuted
  body: 'Spec R8 (reworded after phase review p1-r2) decides this: gh''s OAuth token cannot read the list,
    and only the key can. Every key this script stores is proven before it is stored, and --rotate-key
    proves it again. The run now says in its summary that the list was not proven (test_a_run_without_the_key_says_the_repository_list_was_not_proven).'
- id: l-security-r3
  state: out-of-scope
  body: 'A read-equivalent proof: the token is scoped to this repo and revoked at once; minting it is
    part of the check R8 requires, not a settings write.'
- id: l-docs-accuracy-r1
  state: fixed
  body: 'New paragraph: both jobs declare the environment in both modes; a main-only environment limits
    GITHUB_TOKEN-mode runs too; a missing environment is auto-created without a policy.'
- id: l-docs-accuracy-r2
  state: fixed
  body: Step 4 now names the deferral while protect main holds the old ci-ok rule.
- id: l-docs-accuracy-r3
  state: fixed
  body: The App ID note says the script reads it; the .pem prompt is conditional on no env secret or --rotate-key.
