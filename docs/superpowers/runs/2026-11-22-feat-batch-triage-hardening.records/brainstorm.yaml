  - {kind: decision, id: d-claim-warning, title: "Ignored claim markers become recorded warnings plus skill text", body: "Operator chose: record ignored-untrusted claim markers in facts, check prints them with the pr_authors fix; the fr-triage skill tells operators to list every driving account in pr_authors. Rejected: skill text only. decider: operator."}
  - {kind: decision, id: d-verification, title: "Verified by CI tests, gate developer, no Test Plan", body: "Operator chose strategy none per row (fakes in CI prove every requirement), gate developer, no Test Plan. decider: operator."}
