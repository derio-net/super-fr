journal:
  - kind: decision
    id: p1-admit-marker-json
    phase: 1
    title: "parse_admit does not share a JSON-in-comment helper with the claim marker"
    body: >-
      claims.parse_marker parses its JSON inline (prefix, suffix, pydantic model, MarkerError), and
      no shared helper exists to reuse. parse_admit reuses claims._created for ordering and
      claims.trusted_author for trust instead (P1.T2.S3).
  - kind: decision
    id: p1-admit-module
    phase: 1
    title: "fr triage admit lives in commands/triage_admit_cmd.py, registered on triage_app"
    body: >-
      The plan named commands/triage_cmd.py; the verb is in its own module, imported at the end of
      triage_cmd.py like the other triage subcommand modules, so triage_cmd.py does not grow. The
      CLI path is still `fr triage admit`.
  - kind: discovery
    id: p1-docs-merge-protection
    phase: 1
    title: "docs/merge-protection.md covers intake.py and described the label-only admission"
    body: >-
      Its Issue intake section now describes the admit marker, withheld titles and the confirmed
      digest. The ready-fr label description (fr.labels) now names fr triage admit, which made
      docs/reference/dispatch-lifecycle.md stale; its stamp was bumped. Two older acceptance rows
      (intake-trust-eligibility, intake-batch-refuses-untrusted) named renamed tests and were
      amended in this feature's fragment.
  - kind: finding
    id: p1-sec-claim-advice
    phase: 1
    review_scope: in
    state: fixed
    title: "check's ignored-claims line told the operator to add any commenter to pr_authors"
    body: >-
      Anyone can post a claim-shaped marker, and pr_authors also grants intake trust. The line now
      reads `<key>  <login>: claim marker ignored (not a trusted login or member). If <login> is
      one of your driving accounts, add it to pr_authors in <repo>'s .fr/triage.yaml (this also
      admits its issues to batches); otherwise ignore it.` The check test pins it, and the skill
      says the same.
  - kind: finding
    id: p1-sec-admit-toctou
    phase: 1
    review_scope: in
    state: fixed
    title: "fr triage admit could pin text the author edited after the operator read it"
    body: >-
      Per amended R2 the preview quotes the title and body as untrusted text
      (batch_dispatch.quote_untrusted) and prints the digest; --yes needs --digest and re-reads the
      issue just before writing, refusing (exit 2, nothing written, current digest printed) on a
      missing or different digest. Tests: --yes without --digest, a wrong digest, an edit between
      preview and write, and the matching digest writing. They were written after the change and
      then proven red against the previous command (5 failed).
  - kind: finding
    id: p1-sec-admit-escapes
    phase: 1
    review_scope: in
    state: fixed
    title: "the admit preview printed hidden characters that could hide what the operator admits"
    body: >-
      quote_untrusted did not neutralise them. A new pure helper,
      fr.triage.batch_dispatch.visible, beside quote_untrusted, replaces with a visible escape
      (backslash-x or backslash-u hex) every character whose unicodedata category is Cc, Cf, Co,
      Cn, Zl or Zp (newline and tab kept), plus the variation selectors (U+FE00-FE0F,
      U+E0100-E01EF) and the Hangul fillers (U+115F, U+1160, U+3164, U+FFA0). A first denylist
      regex missed tag characters, U+2060, U+200E and variation selectors (a follow-up review),
      so the rule is by category; letters, CJK and emoji bases stay unescaped
      (test_visible_keeps_letters_cjk_and_emoji_bases).
      The admit preview applies it to the
      title and body lines only and prints one warning when anything was escaped; the digest stays
      over the raw text. Tests: test_the_preview_shows_hidden_characters_as_visible_escapes and
      test_visible_keeps_newlines_and_tabs_and_escapes_the_rest (red first, 2 failed).
