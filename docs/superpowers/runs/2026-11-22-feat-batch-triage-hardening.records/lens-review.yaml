schema_version: 12
run: 2026-11-22-feat-batch-triage-hardening
step: lens-review
outcome: done
journal:
  - kind: review
    id: lens-review-1
    title: "Lens review: docs-accuracy, security and tests over the whole feature diff"
    global: true
    body: |
      Three separate read-only reviewers, one per lens, over 0bca17ec3..031bc27b8. docs-accuracy: 2
      findings; security: 4 in, 3 out; tests: 7 in. Each verified against the code before fixing;
      fixes in 031bc27b8 and f3a179dea..1e93a0598.
  # --- docs-accuracy
  - {kind: finding, id: l-docs-accuracy-r1, review_scope: in, global: true,
     title: "labels.py READY_FR comment still said 'Never applied by fr'; fr triage admit applies it"}
  - {kind: finding, id: l-docs-accuracy-r2, review_scope: in, global: true,
     title: "fr-triage explainer's check list omitted ignored claims, obsolete batches and stale members"}
  # --- security
  - {kind: finding, id: l-security-r1, review_scope: in, global: true,
     title: "fr triage admit hardcoded github.com: the glab/tea refusal never fired and a same-named github.com repo was read and written"}
  - {kind: finding, id: l-security-r2, review_scope: in, global: true,
     title: "admission was checked only at collect; batch dispatch judged stored or carried facts, so an edit since the last collect dispatched"}
  - {kind: finding, id: l-security-r3, review_scope: in, global: true,
     title: "privacy guard parsed only top-level snapshots/*.json while the state ref carries all of snapshots/"}
  - {kind: finding, id: l-security-r4, review_scope: in, global: true,
     title: "an outside author closing all their admitted members makes a batch obsolete, which meets after-dependencies"}
  - {kind: finding, id: l-security-r5, review_scope: out, global: true,
     title: "outside-author PR titles are never withheld (prs, gated_prs, batch_prs, judged_prs)"}
  - {kind: finding, id: l-security-r6, review_scope: out, global: true,
     title: "the admit digest pins title and body only; later outsider comments reach a worker reading the thread"}
  - {kind: finding, id: l-security-r7, review_scope: out, global: true,
     title: "the privacy guard ignores other state-ref entries (merge-stops.json, history/, issues/, requests/sessions yaml)"}
  # --- tests
  - {kind: finding, id: l-tests-r1, review_scope: in, global: true,
     title: "privacy snapshot tests asserted only refusals; an over-refusing guard stayed green"}
  - {kind: finding, id: l-tests-r2, review_scope: in, global: true,
     title: "obsolete cancel with a wave and claims, the drive's held exclusion and its wave finish were untested"}
  - {kind: finding, id: l-tests-r3, review_scope: in, global: true,
     title: "no test that dispatch/adopt refuses an obsolete batch; its refusal text spoke of a prior dispatch"}
  - {kind: finding, id: l-tests-r4, review_scope: in, global: true,
     title: "the Issues page's obsolete exclusion from batch tags was untested"}
  - {kind: finding, id: l-tests-r5, review_scope: in, global: true,
     title: "malformed admit-marker cases all failed the digest regex, so the version/extra-key checks were not isolated"}
  - {kind: finding, id: l-tests-r6, review_scope: in, global: true,
     title: "admit failure paths untested; a label-then-comment failure said 'admission not written'"}
  - {kind: finding, id: l-tests-r7, review_scope: in, global: true,
     title: "the executing filter-script test was skipped wherever node was missing, CI included"}
resolves:
  - {id: l-docs-accuracy-r1, state: fixed, body: "031bc27b8: the comment says fr applies it only through fr triage admit --yes, with a trusted fr-admit marker."}
  - {id: l-docs-accuracy-r2, state: fixed, body: "031bc27b8: the list gains the three sets, the cancel command and the pr_authors caution; reviewed stamp names it."}
  - id: l-security-r1
    state: fixed
    body: |
      f3a179dea: admit takes an issue URL (its host; GitLab's /-/issues/ path keeps the GitLab adapter, which
      refuses before any read) or --host; a URL that disagrees with --host refuses; the preview prints the
      host. A bare owner/repo#n still means github.com, the convention _host_of and collect already follow,
      and the preview now says so. Tests test_admit_on_a_gitlab_host_refuses_before_any_read and four more.
  - id: l-security-r2
    state: fixed
    body: |
      41ca88d6f: fr/triage/admit_recheck.recheck_admitted re-reads each member admitted by its marker alone and
      recomputes the digest in dispatch_batch, after the stage gate and before any forge write or event (the
      driver dispatches through it). A mismatch or a failed read refuses. Spec R2 and §B amended.
      test_dispatch_yes_refuses_an_admitted_member_edited_or_unreadable_since_collect fails with the call removed.
  - {id: l-security-r3, state: fixed, body: "5bb13b9f1: strict_snapshots refuses any snapshots/ entry that is not a top-level .json file; test_a_snapshots_entry_the_strict_reader_does_not_parse_refuses[json.bak|old/a.json]."}
  - id: l-security-r4
    state: refuted
    body: |
      The operator's recorded round-1 decision (d-obsolete-stage) is that an obsolete batch meets its
      dependencies. A batch whose members are all closed has no work left to wait for: the dependent batch's
      ordering is about that work, and fr triage check lists every obsolete batch for the operator.
  - {id: l-security-r5, state: out-of-scope, body: "PR titles were never withheld before this change; the intake trust boundary this spec moves is issues'. Needs its own design."}
  - {id: l-security-r6, state: out-of-scope, body: "Comments were never pinned; the spec pins the issue's content (title and body) by decision. A separate design question."}
  - {id: l-security-r7, state: out-of-scope, body: "Those ref entries were unchecked before this change; R12 named snapshots only."}
  - {id: l-tests-r1, state: fixed, body: "5bb13b9f1: test_a_snapshot_naming_only_public_repos_passes_a_public_state_repo and test_a_private_state_repo_passes_a_snapshot_naming_private_repos."}
  - {id: l-tests-r2, state: fixed, body: "b2182e1e9: test_cancelling_an_obsolete_waved_batch_releases_its_written_claims, test_a_foreign_held_obsolete_batch_emits_no_held_action (with a proposed control), test_a_wave_of_an_obsolete_and_a_cancelled_batch_reports_its_duplicates_once_finished."}
  - {id: l-tests-r3, state: fixed, body: "c0a318308: batch_dispatch.obsolete_refusal for dispatch and adopt names the cancel command; two tests pin it."}
  - {id: l-tests-r4, state: fixed, body: "b4b04955c: test_a_member_of_an_obsolete_batch_is_not_tagged_in_batch, with a proposed control."}
  - {id: l-tests-r5, state: fixed, body: "f98d35bfa: each malformed case fails for one reason (valid 64-hex elsewhere), plus upper-case, extra-key and length cases and test_latest_admit_skips_a_marker_with_no_created_at."}
  - {id: l-tests-r6, state: fixed, body: "6fda19416: a failed read exits 2 writing nothing; a comment failure after the label exits 1 saying the label is on, the issue is not admitted, and the exact re-run."}
  - {id: l-tests-r7, state: fixed, body: "e4a318589: skipped only when node is missing and CI is unset; with CI=1 and no node it fails."}
evidence:
  review: lens-review-1
  reviewer: "docs-accuracy=aeee697015e40755b,security=ad314f7c944567fb4,tests=a9e7efc5c62634ba5"
