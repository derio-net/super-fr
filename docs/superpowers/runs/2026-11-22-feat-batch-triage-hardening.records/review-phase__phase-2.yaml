outcome: done
journal:
  - kind: review
    id: p2-review
    title: "Phase 2 review: no blocking bug; four in-scope findings, one spec sentence"
    phase: 2
    body: |
      Separate reviewer (read-only) over 795a43043..4aa4fca42 against R6, R8-R10. Confirmed: a
      dispatched batch never derives obsolete; a member missing from facts keeps it proposed;
      every stage reader handles obsolete. Findings p2-r1..p2-r5 below; each verified against the code.
  - kind: finding
    id: p2-r1
    review_scope: in
    phase: 2
    title: "kanban: obsolete is not a terminal stage, so an all-obsolete wave is never hidden by the cutoff"
    body: kanban.py _TERMINAL_STAGES / Card.terminal omit obsolete while finished_waves counts it finished.
  - kind: finding
    id: p2-r2
    review_scope: in
    phase: 2
    title: "kanban: an Obsolete-column card falls through to the 'finished' hint"
    body: fallback_hint had no obsolete branch; the card read "finished" with no pointer to batch cancel.
  - kind: finding
    id: p2-r3
    review_scope: in
    phase: 2
    title: "batch._all_closed's awaiting-live test duplicates sets.is_awaiting_live with no test pinning them"
    body: The import cycle keeps the copy; nothing failed if the two drifted.
  - kind: finding
    id: p2-r4
    review_scope: in
    phase: 2
    title: "claims.releasing / owed_claims treating obsolete like cancelled had no test"
    body: Dropping "obsolete" from releasing left the suite green.
  - kind: finding
    id: p2-r5
    review_scope: out
    phase: 2
    title: "Spec §E says the awaiting-live hold still applies to a batch with a lifecycle event; the code never reaches it"
    body: The drive only dispatches stage proposed, and any batch with a lifecycle event derives another stage.
resolves:
  - id: p2-r1
    state: fixed
    body: |
      Kept obsolete non-terminal on purpose: R9 wants the operator to see it and run batch cancel, and a
      cutoff would hide exactly that card. Card.terminal's docstring now says so, and
      test_an_obsolete_card_points_at_batch_cancel_and_is_never_cut_off pins that an obsolete wave
      card is never cut off a year later.
  - id: p2-r2
    state: fixed
    body: |
      New HINT_OBSOLETE ("obsolete: every member closed, retire it with batch cancel") for the
      obsolete column; the same test fails without it.
  - id: p2-r3
    state: fixed
    body: test_all_closed_agrees_with_the_set_apart_awaiting_live_predicate checks _all_closed against "closed or sets.is_awaiting_live" over five issue shapes.
  - id: p2-r4
    state: fixed
    body: test_an_obsolete_wave_batch_releases_its_claims pins releasing() and owed_claims() for an obsolete wave batch against a proposed one.
  - id: p2-r5
    state: fixed
    body: The spec sentence now says the hold applies to a never-dispatched batch with a member missing from the facts, and why a batch with a lifecycle event needs none.
evidence:
