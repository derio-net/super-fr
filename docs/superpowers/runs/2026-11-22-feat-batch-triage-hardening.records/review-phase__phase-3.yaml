journal:
  - kind: review
    id: p3-review
    title: "Phase 3 review: no blocking defect; four in-scope findings, one out"
    phase: 3
    body: |
      Separate reviewer (read-only) over 3cf55f53c..682755ad4 against R11-R13. Confirmed: an OPEN
      judged PR is re-viewed, never carried; no PR is viewed in a skipped repo; a failed view_pr is
      recorded unviewed; an unreadable snapshot raises, a missing snapshots dir reads empty; the
      key_repos full-name path and the debt key never fail open. Each finding verified against the code.
  - kind: finding
    id: p3-r1
    review_scope: in
    phase: 3
    title: "A debt-only privacy refusal reads '<repo>#debt is an issue of <repo>'"
    body: privacy.refusal worded the synthetic debt key as an issue that does not exist.
  - kind: finding
    id: p3-r2
    review_scope: in
    phase: 3
    title: "The R13 test only string-checks the guard and never runs the script"
    body: A guard that no longer returns early, or a DOM read moved above it, would stay green.
  - kind: finding
    id: p3-r3
    review_scope: in
    phase: 3
    title: "Thin R12 tests: no out-of-scope full PR key, no missing snapshots dir"
    body: |
      The member-repo PR key is already covered (the existing PR test uses a member repo). Missing:
      a full key of a repo outside the scope, and a state dir with no snapshots/. A malformed debt key
      reaches client_for, which is the pre-existing path for every repo and still refuses.
  - kind: finding
    id: p3-r4
    review_scope: in
    phase: 3
    title: "CollectStats.viewed counts a past-limit PR once though it costs two single reads"
    body: The stat is documented as what a collect cost in single reads; view_pr was not counted.
  - kind: finding
    id: p3-r5
    review_scope: out
    phase: 3
    title: "A carried CLOSED judged PR that is later reopened stays carried as closed"
    body: The same holds for carried closed issues before this change; the spec chose the carry.
resolves:
  - id: p3-r1
    state: fixed
    body: |
      privacy.DEBT_KEY_SUFFIX names the synthetic key, and refusal() words it as "a carried snapshot
      holds debt figures of <repo>". test_a_debt_only_leak_is_worded_as_debt_not_as_an_issue.
  - id: p3-r2
    state: fixed
    body: |
      test_the_issues_filter_script_runs_without_throwing_when_the_filter_bar_is_absent runs SCRIPT
      under node against a document whose every other DOM read throws; it fails with the guard
      removed. Skipped where node is absent (GitHub's runners have it).
  - id: p3-r3
    state: fixed
    body: |
      Added test_a_snapshot_pr_key_of_a_repo_outside_the_scope_is_read_not_skipped and
      test_no_snapshots_directory_adds_no_key_and_no_repo. The malformed debt key keeps the old
      client_for path, which refuses (not fail-open).
  - id: p3-r4
    state: fixed
    body: collect now counts the view_pr read too; the CollectStats docstring and the count test say three reads.
  - id: p3-r5
    state: out-of-scope
    body: Not caused by this change; a carried closed issue already behaved this way, and R11 asks for the carry.
