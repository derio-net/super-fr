journal:
  - kind: discovery
    input: true
    id: brief
    title: Operator brief — batch merge-readiness (super-fr#1578, super-fr#1581)
    body: |
      /fr-goal batch merge-readiness. Batch `merge-readiness` of derio-net/super-fr: 2 issues, delivered as ONE pull request.
      Batch title: Merge only what delivered: the driver reads deliver from the cursor, and the Batches page shows one readiness verdict per PR.
      super-fr#1578: Wave driver merges an approved draft batch PR before its run resolved deliver. Observed 2026-11-19 (#1560): the driver readies and merges an approved green draft whose run is still at `deliver: running`; gc then reaped the workspace under the running suite. Expected: merge only after the run resolved deliver (cursor at PR head); approved green undelivered draft held as "approved, not delivered"; gc should not reap a workspace whose run step is running.
      super-fr#1581: Batches page: a readiness verdict per PR (delivered, CI at head, mergeable, approval, whose move), from the same function the driver merges by; also close-out and export PRs.
      Delivery rules: branch feat/batch-merge-readiness; draft PR once the spec is committed with "Closes derio-net/super-fr#1578" and "Closes derio-net/super-fr#1581"; no member issue as a phase tracking_issue; the wave driver owns mergeability and CI (no fr pr settle loop); never add approved-fr.
  - kind: decision
    id: d1-delivered-rule
    title: Delivered is read from the run cursor only; fr-debugging gets a cursor
    body: "Q1 answer: 'Cursor. And add cursor to fr-debugging (see #1655)'. Delivered iff the cursor at the live head records deliver done; no cursor or an unreadable head is not delivered. Decider: operator."
  - kind: decision
    id: d2-early-approval
    title: Approval stays pinned; an approval before delivery is voided by the deliver commit
    body: "Q2 answer: keep it voided (recommended). The page tells the operator to re-label once Ready for approval. Decider: operator."
  - kind: decision
    id: d3-gc-guard
    title: gc guard for a running run is in scope
    body: "Q3 answer: in scope (recommended). gc keeps a merged workspace whose worktree cursor has a step or unit running. Decider: operator."
  - kind: decision
    id: d4-coverage
    title: Verdict covers batch, close-out, archive and export PRs
    body: "Q4 answer: batch, close-out, export (recommended). Decider: operator."
  - kind: decision
    id: d5-verification
    title: CI tests verify; gate reviewer (holds nothing)
    body: "Q5 answer: CI tests, gate reviewer (recommended). Strategy candidate (smoke walk), every row none (CI), one live post-merge observation gated reviewer. Decider: operator."
  - kind: decision
    id: d6-debug-cursor-scope
    title: Minimal fr-debugging workflow now; stations and staffing stay with #1655
    body: "Round 2 answer: minimal cursor now (recommended): a shipped fr-debugging manifest (debug, review, deliver) the skill starts and resolves; #1655 referenced, not closed. Decider: operator."
  - kind: lens
    lens: security
    title: The change moves the gate that decides what the driver lands on main
  - kind: lens
    lens: tests
    title: One readiness function must be proven to drive both the queue and the page
