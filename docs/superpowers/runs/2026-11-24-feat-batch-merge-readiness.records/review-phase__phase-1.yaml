    body: |
      Reviewer checked R2 (no bypass of batch_readiness: _ready, _entries re-filter, _queue_entry pr_ready, queue_exec pr_merge, foreground batch merge), R1 (fold_positions fails closed, distinct reasons, live pr_view head vs facts head_oid), R5 order and admits = old _ready + delivered, R3 voiding sha from ApprovalEvent.voided_at, R12 wording, FACTS_READS 3-17 with cursor_read None reading unread, and readiness.py purity. All held. Findings p1-r1..p1-r7 below.
  - {kind: finding, id: p1-r1, phase: 1, review_scope: in, title: "`fr triage batch merge <id>` refuses an approved-but-undelivered batch as \"not approved\", because approved-not-delivered now lands in Pass.awaiting"}
  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "_member_reports no longer reports a gated approved PR as held/awaiting while CI is pending or the queue is held (reads r.kind, not the gate)"}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "in_queue_order leaves an admitted batch absent from the plan's order (e.g. ejected) reading \"Approved, merges next\""}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "_voided_sha reads a stale voided_at for a Held verdict, so a re-labelled PR still says \"Approval voided ... re-label\""}
  - {kind: finding, id: p1-r5, phase: 1, review_scope: in, title: "no driver-level test that facts head_oid != live pr_view head holds the PR"}
  - {kind: finding, id: p1-r6, phase: 1, review_scope: in, title: "no test that an old-facts PR (deliver-done cursor, cursor_read None) reads not delivered"}
  - {kind: finding, id: p1-r7, phase: 1, review_scope: in, title: "the approve-pr Need still asks to label a green PR approved-fr while its run has not delivered (contradicts R4, invites an approval R3 voids)"}
