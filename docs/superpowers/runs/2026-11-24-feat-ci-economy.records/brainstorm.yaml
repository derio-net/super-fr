  - {id: ci-cancelled-reads-pending, capability: triage-queue, acceptance: "The wave driver, the queue, fr pr settle and triage collect read a cancelled check as pending (superseded), never as failing; timed-out and failed checks stay failing", origin: ["spec:2026-11-24-ci-economy#R3", "spec:2026-11-24-ci-economy#R4"], status: not-implemented, verify: none}
  - {id: ci-landed-skip, capability: ci, acceptance: "A push to main of a sha that already carries a successful ci-ok from its fr-queue run runs no suite and reports a green ci-ok naming that run; any other push to main runs full CI, and the release's pre-publish suite is unchanged", origin: ["spec:2026-11-24-ci-economy#R5", "spec:2026-11-24-ci-economy#R6", "spec:2026-11-24-ci-economy#R7"], status: not-implemented, verify: live}
