  - {id: ci-light-lane, capability: ci, acceptance: "A pull request that changes only non-installable paths outside tests/ and .github/ runs the light lane (no shards, collect, split-check or coverage, plus scoped tests) and ci-ok reads the skipped jobs as passing only for that lane", origin: ["spec:2026-11-24-ci-economy#R15", "spec:2026-11-24-ci-economy#R16", "spec:2026-11-24-ci-economy#R17"], status: not-implemented, verify: live}
