resolves:
  - id: p3-r1
    state: fixed
    body: _is_marked now reads only a module-level pytestmark assignment. test_a_mark_on_one_test_does_not_cover_the_module pins that a module with one marked test and one unmarked root reader is flagged. No module in tests/ relied on a per-test mark, and the real-repo tripwire stays green.
  - id: p3-r2
    state: fixed
    body: _climbs treats X.parents as one above X, so a name holding .parents and indexed later counts (test_a_name_holding_parents_then_indexed_is_flagged). parents[-1] is the filesystem root, not the checkout, so it is correctly not a root climb. No test module in tests/ joins "../..", and the docstring already says the tripwire is not sound against every spelling.
  - id: p3-r3
    state: refuted
    body: The alias list only covers names a module uses without binding them (star imports from conftest). A new alias a helper defines by climbing from __file__ is caught through the helper-import path whatever its name, and an alias a module binds is judged by what it is bound to. A new unbound name would need a new star-imported constant in conftest, which is the case the dated list documents.
