item: phase/4
outcome: done
journal:
  - kind: review
    id: review-p4
    phase: 4
    title: Phase 4 review (generated-file and stamp conflict resolution, git-less mirror run)
    body: |
      Independent reviewer read 1fdc627..HEAD against R8-R14 and decision p4-mirror-export. Ours/theirs
      per strategy, the stamp rule, block classification, index-stage checks, the mirror env allowlist,
      killpg, the copy-back and the R13 config all check out; no path pushes a bad combination unhanded.
      Four in-scope findings (three fixed, one refuted), two out of scope.
  - {kind: finding, id: p4-r1, phase: 4, review_scope: in, title: "Worktree.read/write_resolved translated CRLF to LF, rewriting a hunk-resolved CRLF file whole"}
  - {kind: finding, id: p4-r2, phase: 4, review_scope: in, title: "An unclosed generated-block open marker let later hunks resolve as ours and hid the file tail from _skeleton"}
  - {kind: finding, id: p4-r3, phase: 4, review_scope: in, title: "An OSError from export_tracked/snapshot_export was not caught, so no abort and no clean hand-back"}
  - {kind: finding, id: p4-r4, phase: 4, review_scope: in, title: "A mirror's mode-only change is invisible to the stray check and the copy-back"}
  - {kind: finding, id: p4-r5, phase: 4, review_scope: out, title: "The mirror shares the operator's uv cache and python installs, which queued code could poison"}
  - {kind: finding, id: p4-r6, phase: 4, review_scope: out, title: "Mirror timeout is per command, output is uncapped, killpg after reap has a pid-reuse window"}
resolves:
  - {id: p4-r1, state: fixed, body: "read and write_resolved use newline=''; test_the_worktree_reads_and_writes_crlf_unchanged and test_a_crlf_file_keeps_its_line_endings_through_a_resolution pin it."}
  - {id: p4-r2, state: fixed, body: "_resolve returns None when a block is still open at EOF, and _skeleton compares an unbalanced file whole; two tests pin it."}
  - {id: p4-r3, state: fixed, body: "_regenerate catches (GitError, OSError) around the export, both snapshots, the mirror runs and the copy-back, so an I/O error aborts and hands back as MirrorFailedError."}
  - {id: p4-r4, state: refuted, body: "Git tracks only the executable bit, the five declared mirrors write Markdown and YAML outputs and never chmod, and a mode-only change kept at the old mode loses no generated content: the combination's text is what CI tests and what lands."}
  - {id: p4-r5, state: out-of-scope, body: "Same trust boundary as p4-s6: entries are approved before the queue runs them, and the spec makes the mirror run defence in depth, not a sandbox; a private cold uv cache per run is a cost trade-off for a later issue."}
  - {id: p4-r6, state: out-of-scope, body: "R11 fixes the timeout per command; the pid-reuse window needs the whole group gone and the id recycled between wait and killpg, and output size is bounded by the declared repo scripts."}
evidence:
  review: review-p4
  reviewer: a1f83ba73e53af0e2
