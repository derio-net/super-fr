resolves:
- id: s-r1-1
  state: fixed
  body: 'R9-R11/R13 add a generated-block kind: hunks inside <!-- generated:NAME --> markers take ours and are regenerated; cli.md and README.md are covered by blocks, not whole-file globs, and a mirror
    changing a block of a non-glob file is not overreach.'
- id: s-r1-2
  state: fixed
  body: "R11 adds a 10-minute timeout and names a missing program as a hand-back; R13 runs each mirror via `uv run --frozen`; Design \xA7C says the .venv lives in the git-ignored scratch worktree."
- id: s-r1-3
  state: fixed
  body: 'R2 now keeps ci-ok `if: always()`: a superseded run''s red ci-ok sits on the superseded sha, which no reader or ruleset judges a PR by; ci-ok is never skipped, so a hand-cancelled head cannot read
    green.'
- id: s-r1-4
  state: fixed
  body: "R4 and Design \xA7A: slot_check counts a cancelled required check as not reported for `late`, in both branches; a Test Plan line covers it."
- id: s-r1-5
  state: fixed
  body: R3 adds ops.gate._checks_green and verify_ci (cancelled = waiting, exit 75); the tripwire is scoped to check-state sets; GitLab/Gitea named out of scope.
- id: s-r1-6
  state: fixed
  body: "Design \xA7A exempts the GraphQL aggregate rollup state explicitly, with the reason (display-only, GitHub folds CANCELLED)."
- id: s-r1-7
  state: fixed
  body: 'R7 rewritten: no new save; hand merges and the release commit''s full run still save on main, and PR restores keep the entry from expiring.'
- id: s-r1-8
  state: fixed
  body: 'R5/R17: validate-artifacts (strict) runs in the landed lane too.'
- id: s-r1-9
  state: fixed
  body: "Design \xA7B matches a workflow run: path ci.yml, head_branch fr-queue/*, event push, conclusion success, not this run; permissions contents+actions read."
- id: s-r1-10
  state: fixed
  body: 'New R18: a light-lane ci-ok stays valid tests: ci evidence, with the reason; verify_ci does not read the lane.'
- id: s-r1-11
  state: fixed
  body: R20 widens the tripwire to any module resolving the checkout root (constant, Path(__file__).parents, tests/ helper) and states what it misses.
- id: s-r1-12
  state: fixed
  body: "R15/R16 and Design \xA7D require full history for classify and scoped-tests; a workflow-shape test pins fetch-depth: 0."
- id: s-r1-13
  state: fixed
  body: Test Plan gains pre-merge lines for every row, R4 and R14 included.
- id: s-r1-14
  state: fixed
  body: "Design \xA7C names the new Worktree.run_argv and snapshot_tracked and threads mirrors/generated through QueuePorts, build, _combine, _merged_tree, _keeps_merge_content and _resolve."
- id: s-r1-15
  state: fixed
  body: R3 lists STALE and status-context error/failure as failing.
