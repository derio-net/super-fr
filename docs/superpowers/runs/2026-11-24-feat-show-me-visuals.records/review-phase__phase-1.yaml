outcome: done
journal:
  - kind: finding
    id: p1-r1
    phase: 1
    review_scope: in
    title: "fr.shape's path display duplicated run_cmd._shown_path without resolving"
    body: |
      `shape.py` `_shown` took `relative_to` on unresolved paths, unlike `run_cmd._shown_path`, so on a
      symlinked checkout (macOS /var) the deliver shape refusal could print an absolute path while the
      PR-body refusal printed a relative one.
  - kind: finding
    id: p1-r2
    phase: 1
    review_scope: in
    title: "test_fr_shape_imports only asserted the module imports"
    body: Every other test in tests/unit/test_shape.py already imports fr.shape; the smoke test added nothing once they existed.
  - kind: finding
    id: p1-r3
    phase: 1
    review_scope: in
    title: "an already-archived cursor left its live shape file behind"
    body: |
      `archive_run_cursor`'s early-return branch (cursor archived, usage file live) moved only the usage
      file, so a re-run after a partial archive left `<run-id>.shape.md` (and `.pr-body.md`) in runs/.
  - kind: review
    id: p1-review-r1
    phase: 1
    title: "phase 1 review: 3 findings in scope, all fixed"
    body: |
      An independent reviewer read the phase 1 diff against R6–R12, R16–R18. It found no correctness bug in
      the requirement surfaces and three low-severity findings, all in scope and fixed in one commit.
      No lens suggested.
resolves:
  - id: p1-r1
    state: fixed
    body: "`fr.shape.shown_path` resolves both sides and is the one helper; `run_cmd._shown_path` aliases it."
  - id: p1-r2
    state: fixed
    body: Deleted the import-only test; the rest of the file still exercises the module.
  - id: p1-r3
    state: fixed
    body: The early-return branch also moves the PR body render and the shape file; tests/unit/test_archive_cmd.py::test_an_already_archived_cursor_carries_its_live_shape_file (red without the fix).
evidence:
  review: p1-review-r1
  reviewer: a0e1d39354a910aba
