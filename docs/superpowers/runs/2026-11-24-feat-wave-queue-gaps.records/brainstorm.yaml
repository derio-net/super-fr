    one PR that Refs #1677; do not label it.


    ## Issue #1677


    # Queue: hand-backs merge the slot ahead, waves composed by file overlap, and the operator can queue
    any PR


    ## Problem


    The wave merge queue (#1602) avoids merging `main` into waiting PRs only when git can stack them on
    its own. Three gaps remain after #1647 (CI economy: cancel superseded runs, skip landed combinations,
    regenerate generated files in the combination, light lane; PR #1669):


    - a real conflict between entries is handed back with a brief to merge `origin/main`, so the PR conflicts
    again when the entries ahead land;

    - waves are composed without looking at which files their batches change, so overlapping batches share
    a wave and serialise through hand-backs;

    - a PR outside the open wave (an fr-arch feature, a hand-started fix) cannot join the queue: it is
    merged by hand, which re-conflicts every queued PR, or waits as a between-waves entry until no waved
    batch is unfinished.


    ## Asks


    1. **A hand-back merges the combination ahead of the PR, not `origin/main`.** Today a real conflict
    found while building a combination is handed back with a brief to merge `origin/main`. When entries
    ahead of the PR are still in the queue, the session resolves against a main that is about to move,
    and the PR conflicts again as soon as they land (a second hand-back, budget spent). The brief names
    the slot commit the PR was being stacked on (`fr-queue/<scope>/slot-<k-1>`, the exact sha `land: push`
    will fast-forward `main` to) and tells the session to merge that commit. Once the entries ahead land,
    the PR already contains `main`''s head: no further merge, and its patch-id against `main` is its own
    change only, so an approval given after those landings stays valid. If an entry ahead is ejected,
    the slot is rebuilt and the brief is re-issued against the new slot. Seen on 2026-11-24 with #1628
    (in the queue) and #1630 (same wave, same 11 files): merging the slot commit `24130aa17` by hand made
    #1630 land-ready the moment #1628 landed at that very sha.

    2. **Compose waves by file overlap.** `fr triage batch suggest`, `batch create --wave` and `batch
    edit --wave` report pairs of batches in one wave whose expected change sets overlap outside generated
    files (by the issues'' named paths, or, once PRs exist, by the PRs'' changed files), and suggest either
    one batch or different waves. Batches that do not overlap stack in the queue and land together; batches
    that do are serialised by conflict hand-backs whatever the queue does.

    3. **The operator (the orchestrating session) can put any PR into the queue.** Today the queue takes
    only the open wave''s batch PRs, and a stray PR (an fr-arch feature, a hand-started fix) can join
    only by being merged by hand, which re-conflicts every queued PR (as on 2026-11-24 morning), or as
    a between-waves entry, which waits until no waved batch is unfinished. Add a verb, e.g. `fr triage
    queue add --pr <n> [--repo R]`, that admits any open PR of the repo into the open queue (or opens
    a between-waves queue for it when none is open) as an entry of the current queue, stacked and tested
    like any other, under the same approval rule (`approved-fr` pinned to the patch-id) and the same trust
    rules (same-repo branch, allowed author). It records a queue event naming who added it; `fr triage
    queue remove --pr <n>` takes it out. The wave''s drain and release then include it, so a stray change
    ships in the next release without a hand merge.


    Tests per ask: a hand-back brief names the slot commit and is re-issued after an ejection; `suggest`/`--wave`
    report an overlapping pair; `queue add` admits a non-wave PR under the approval and trust rules, records
    who added it, and the wave''s drain waits for it.


    Refs #1602, #1647, #1669. Moved here from #1647 so that PR #1669 stays scoped to CI economy.


