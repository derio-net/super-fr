  id: q1-stale-slot
  title: An entry carrying a stale slot commit is held; its brief resets and force-with-lease pushes
  body: 'Operator chose: structural guard (head reaches a recorded combination commit outside the lineage
    → never built), re-issued brief: reset to the pre-merge head, push --force-with-lease, merge the new
    slot commit. Spec R4.'
- kind: decision
  id: q2-reissue-free
  title: A re-issued brief does not spend the hand-back budget
  body: 'Operator chose: free; recorded as a conflict event marked reissue. Spec R3.'
- kind: decision
  id: q3-overlap-warn
  title: Overlap at create/edit --wave warns and writes; the later batch's session is told to watch for
    the hand-back
  body: 'Operator answered: warn and write anyway, and instruct the batch session that comes second to
    watch for conflicts and repair (or the orchestrator watches, per the queue''s mechanics). Spec R8,
    R9: the queue''s conflict hand-back is the orchestrator''s watch; the later batch''s dispatch brief
    names the overlap.'
- kind: decision
  id: q4-idle-add-opens
  title: An added PR opens a between-waves queue at once when the lowest unfinished wave has nothing ready
  body: 'Operator chose: open now. Spec R14.'
- kind: decision
  id: q5-drain-waits-preapproved
  title: The drain waits for an added PR (stall Need); --preapproved lets the driver add approved-fr
  body: 'Operator answered: the drain waits with a stall Need, and any PR can be declared preapproved
    to the orchestrator, which then adds the approved-fr label when the PR is on the queue with no conflicts
    or CI errors. Spec R13, R15.'
