journal:
  - {kind: finding, id: p1-r1, phase: 1, review_scope: in, title: "The carry brief's rev-list lists the dead slot commit, so the cherry-pick reapplies what R4 drops", body: "queue_handback.carry_brief step 2 ran `git rev-list --no-merges --reverse <reset>..origin/<branch>`: a squash slot commit (single parent) and, under merge, the ejected entry's second-parent commits are listed. Fix: `--first-parent --no-merges`; an integration test runs the brief's commands over the queue_git World."}
  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "A budget-held conflict event is re-issued free when its onto stops leading", body: "reissue_due and reissue_actions ignored `delivered`, so a ConflictEvent(delivered=held) whose onto stopped leading reached _queue_hand_back(reissue=True) and was briefed to the session for free. Fix: no re-issue when delivered == held."}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "With no slot standing, the carry brief and merge_clause fetch `origin/origin/<default>`", body: "carry_brief step 2 and merge_clause emitted `git fetch origin origin/<default>` when handback_onto / target_ref returned `origin/<default>`. Fix: fetch the bare branch name."}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "OtherEntry keys never get queue_carries, so a carrying non-batch PR is built and landed", body: "lineage_reads looped only over the batch live map; close-out, archive, export and housekeeping entries are admitted later in the pure pass. Fix: read each open non-batch PR head's carry into Snapshot.queue_head_carries, and queue_snapshot gives each admitted entry the carry of the head it is built at."}
  - {kind: finding, id: p1-r5, phase: 1, review_scope: in, title: "The rebuild-on-moved-main branch builds carrying entries", body: "wave_queue._plan_open returned from the R14 rebuild branch before hold_lineage ran. Fix: hold_lineage runs first, the rebuild window is built from what remains, and the held entries' carry actions are planned on that pass."}
  - {kind: finding, id: p1-r6, phase: 1, review_scope: in, title: "An unreadable reset candidate writes a durable held ConflictEvent (violates R5)", body: "carry_hand_back treated a GitError on a reset candidate as not free and, with no clean head, wrote a held conflict event: a transient error became a permanent Need. Fix: when no candidate is clean and one raised, hold for the pass with a line and write no event."}
  - {kind: finding, id: p1-r7, phase: 1, review_scope: in, title: "lineage_reads has no test, and no drive test lets the planner emit queue-reissue/queue-carry", body: "Driver tests scripted planner actions and DriveCheckout.leads always returned True. Fix: direct lineage_reads tests over a fake driver/clone, and drive tests where the real planner plans the carry and the re-issue."}
  - {kind: finding, id: p1-r8, phase: 1, review_scope: in, title: "fr-triage SKILL.md still describes the pre-R1 conflict hand-back", body: "SKILL.md said the brief merges origin/main, never hands a head back twice, never force-pushes, at most two hand-backs. Fix: describe the stack target, the free re-issue, the carry brief and the R5 hold, matching the fr-wave-driver explainer; mirrors regenerated."}
  - {kind: review, id: review-p1-1, phase: 1, title: "independent code review of phase 1: 8 findings, all in scope", body: "Independent reviewer read phase 1 (910c0b9..cb22ff3) against R1-R6, R16 and spec sections A, D, E. Eight in-scope findings: the carry brief's rev-list and fetch ref, a held hand-back re-issued free, non-batch entries never lineage-checked, the moved-main rebuild skipping the carry hold, a transient GitError turned into a durable Need, missing lineage_reads and end-to-end planner tests, and stale skill prose. All eight fixed with tests."}
resolves:
