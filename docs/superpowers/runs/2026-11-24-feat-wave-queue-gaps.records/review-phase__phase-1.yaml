  - {id: p1-r2, state: fixed, body: "reissue_due returns False for delivered == held and reissue_actions skips a held event (no warning either); tests test_a_held_handback_is_never_reissued_free (unit) and test_a_budget_held_handback_is_not_reissued_when_its_onto_stops_leading (planner)."}
  - {id: p1-r3, state: fixed, body: "target_ref returns the bare default branch and carry_brief fetches fetch_name(onto_ref) (origin/ stripped); tests test_the_carry_brief_with_no_slot_fetches_the_bare_default_branch, test_the_merge_clause_with_no_slot_fetches_the_bare_default_branch, and the integration test's no-slot case runs the fetch."}
  - {id: p1-r4, state: fixed, body: "lineage_reads returns queue_head_carries (repo -> open non-batch PR head -> carry, GitError None); batch_drive._carries merges it into QueueSnapshot.carries by each admitted entry's built head. Tests test_a_non_batch_prs_head_is_read_by_head, test_an_admitted_entry_takes_its_carry_by_the_head_it_is_built_at and the drive test test_a_non_batch_entrys_head_has_its_carry_read."}
  - {id: p1-r5, state: fixed, body: "_plan_open runs hold_lineage before the R14 branch; the rebuild window is drawn from the remaining entries and the held entries' lineage_actions are planned on the moved base. Test test_a_carrying_entry_is_not_rebuilt_when_main_moved."}
  - {id: p1-r6, state: fixed, body: "carry_hand_back remembers a candidate that raised; with none clean it returns a 'held this pass: git could not read' line and writes no event. Test test_an_unreadable_reset_candidate_holds_the_carry_this_pass_only."}
  - {id: p1-r7, state: fixed, body: "tests/unit/test_operator_entries_lineage.py covers the land/method filter, the built set from every record of the scope, the target (last standing, main when the record base is stale), the per-(sha, target) cache and GitError -> None never cached; the fake DriveCheckout now scripts leads/carries/GitError, and test_the_planner_holds_a_carrying_head_with_one_queue_carry / test_the_planner_reissues_a_handback_whose_onto_stopped_leading drive the real planner."}
  - {id: p1-r8, state: fixed, body: "plugins/super-fr/skills/fr-triage/SKILL.md's conflict hand-back sentence now names the stack target and onto, the free re-issue (never for a held one), the carry brief and its force-push, the non-batch Need and the R5 pass hold; sync-opencode.py and sync-hermes.py regenerated the mirrors."}
