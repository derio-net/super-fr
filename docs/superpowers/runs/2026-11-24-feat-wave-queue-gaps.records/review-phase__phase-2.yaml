outcome: done
journal:
  - kind: finding
    id: p2-r1
    phase: 2
    review_scope: in
    title: "R13: a preapproval could be recorded approved at a head the driver never checked or commented on"
    body: >-
      `_preapprove` returned early when approved-fr was already on, and added the label before
      the audit comment; `settle_approvals`/`settle_entry_approval` read a label with no live
      approval as `First` at the live head. For a batch PR `_preapprove` only labelled, and the
      batch's approval was recorded at the start of the NEXT pass, so a session push between
      passes was recorded approved at an unvetted H2 while the audit comment named H1. For an
      operator PR a failed `comment_pr` after `edit_issue_labels` left a label the next pass
      recorded as First at the live head with no audit comment. Fix: comment, then record the
      approval at the vetted head and patch-id, then label.
  - kind: finding
    id: p2-r2
    phase: 2
    review_scope: in
    title: "R14/R15: the drive loop counted no operator work and ended over an undrained queue"
    body: >-
      Operator entries counted toward none of the Summary figures and `_operator_stall` returns
      nothing before stall_hours, so once every batch finished `Summary.done` was true and the
      loop exited, leaving a wave queue undrained with its hold open, or a between-waves queue
      built but never landed. Fix: count each pending operator entry (added, not removed, open,
      unlanded) as `pending` unless its stall Need is reported this pass (that Need is already
      counted blocked).
  - kind: finding
    id: p2-r3
    phase: 2
    review_scope: in
    title: "R11/R12: `queue add` to a repo with no batch was silently inert"
    body: >-
      `queue add` accepts any repo in facts.repos, but the driver's repos map is built from
      batches only, and operator_reads / _wave_queue_reads (and the housekeeping, barrier,
      lineage and placement reads) loop only over it. Fix: the queue readers get the batch map
      plus every collected repo a queue request of the scope names (unread/carried still
      skipped), so R14's between-waves queue works in a repo with no batch.
  - kind: decision
    id: p2-d1
    phase: 2
    title: "p2-r1: preapproval records its own approval before the label, rather than trusting a label-only First beside an audit marker"
    body: >-
      Of the two sound options, recording the approval in the preapproval itself is the
      simpler: it uses the existing settle rule unchanged (a push changing the diff voids by
      patch-id) and needs no comment read. Order is audit comment, then the approval event (a
      batch PR's `ApprovalEvent` through the one batch event writer, an operator PR's queue
      `approval`), then the label: any failure before the label leaves no label, so nothing is
      approved; a recorded approval without its label is `Unlabelled`. A label already on with
      no live approval still settles as First: that is a person's label, as for any PR. Spec
      R13 and §C amended to state the order; the plan's "batch PR gets the label alone" is
      superseded.
  - kind: decision
    id: p2-d2
    phase: 2
    title: "p2-r3: the driver reads queue requests' repos rather than `queue add` refusing a repo with no batch"
    body: >-
      R14's between-waves queue must work in a scope with no batch in that repo, so `queue add`
      keeps accepting any collected repo and the driver reads it (`queue_requests.reader_repos`,
      keys no batch id can take; the Snapshot's own `repos` stays the batches').
  - kind: review
    id: review-p2-1
    phase: 2
    title: "independent code review of phase 2: 3 findings, all in scope"
    body: >-
      Independent review of phase 2 (R11-R15, §C, §F) raised p2-r1 (preapproval at an
      unvetted head), p2-r2 (the loop counted no operator work) and p2-r3 (a request repo with
      no batch was never read); all three in scope and fixed with failing-first tests at the
      command-layer seam. The merge resolution on the branch was verified lossless.
resolves:
  - id: p2-r1
    state: fixed
    body: >-
      operator_entries._preapprove now comments, records the approval (via `_approver`: the
      batch event writer for a batch PR, the queue writer for an operator PR), then labels.
      Tests: test_operator_reads.py::test_a_preapproved_batch_pr_records_the_batch_approval_at_the_vetted_head,
      ::test_a_push_between_the_preapproval_and_the_next_settle_voids_a_batch_approval (two
      passes, H2 pushed between the label and the settle: voided, label off),
      ::test_a_failed_audit_comment_leaves_no_label_and_no_approval,
      ::test_a_preapproved_operator_pr_is_recorded_before_it_is_labelled.
  - id: p2-r2
    state: fixed
    body: >-
      wave_queue.operator_work counts pending operator entries minus those whose stall Need is
      reported (the Need now carries `entries=(key,)`); drive_pass adds it to `pending`.
      Tests: test_triage_batch_drive_cmd.py::test_an_added_operator_entry_keeps_a_finished_drive_from_reading_done,
      ::test_a_removed_or_landed_operator_entry_lets_the_drive_read_done,
      ::test_the_loop_waits_on_an_added_entry_and_ends_once_it_is_removed;
      test_wave_queue_operator_planner.py::test_a_pending_entry_is_the_drivers_work_until_its_stall_need_makes_it_the_operators.
  - id: p2-r3
    state: fixed
    body: >-
      queue_requests.reader_repos adds every collected repo a request of the scope names to the
      map the snapshot's queue readers (wave queue, housekeeping, operator, barrier, lineage,
      placements, post_merge repos) loop over. Test:
      test_triage_batch_drive_cmd.py::test_an_added_pr_in_a_repo_with_no_batch_is_read_and_lands_between_waves.
