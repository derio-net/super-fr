  - {kind: finding, id: p3-r1, phase: 3, review_scope: in, title: "wave_overlaps pairs batches of different repos, which the per-repo queue can never conflict", body: "wave_overlap.py paired any two open batches of one wave whatever their repo, so an org or group scope reported and briefed an overlap the queue cannot produce. Fix: skip pairs whose Batch.repo_name differs. Tests: test_batches_of_different_repos_never_overlap_though_they_cite_one_path (pure) and test_suggest_reports_no_overlap_between_batches_of_two_repos (command seam)."}
  - {kind: finding, id: p3-r2, phase: 3, review_scope: in, title: "preapproval's forge-comments-off gate is untested, mislabelled and undocumented", body: "_preapprove's _comments_off gate (operator_entries.py) had no test though test_tripwire_forge_writes.py's GATED entry claims it, both gates reported under the key preapprove-repo-labels, and the docs said preapproval always comments first. Fix: each gate reports under its own key (labels, comments); test_preapproval_does_nothing_while_forge_comments_are_off proves no comment, label or approval record and one report; the fr-triage skill and the fr-wave-driver explainer now say preapproval does nothing while forge comments or labels are off."}
  - {kind: finding, id: p3-r3, phase: 3, review_scope: in, title: "docs overstate or omit the overlap report", body: "fr-wave-driver.md said same-file batches will conflict (now may conflict); the batch suggest docstring (and so docs/reference/cli.md) and fr-triage.md did not mention the overlap pairs suggest prints. Updated both, regenerated README/cli.md and the OpenCode and Hermes skill mirrors, bumped fr-triage.md's reviewed stamp."}
  - {kind: review, id: review-p3-1, phase: 3, title: "independent code review of phase 3: 3 findings, all in scope", body: "Reviewed phase 3 (R7-R10, R13 preapproval). Three findings, all in scope and fixed with tests. The #1669 merge resolution was verified to keep both features."}
