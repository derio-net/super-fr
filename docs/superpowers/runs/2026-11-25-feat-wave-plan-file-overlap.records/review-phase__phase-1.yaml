  - {kind: finding, id: p1-r1, phase: 1, review_scope: in, title: "A branch YAML with a bad-date scalar raises ValueError and crashes fr triage check", body: "plan_overlap._load caught only TriageError/YAMLError; yaml.safe_load('a: 2020-13-45') raises ValueError (reproduced), and check_command had no guard, so check exited non-zero against R6."}
  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "_is_glob treats `[` as a glob, so identical bracketed literal paths never overlap", body: "A literal such as app/[id]/page.tsx was moved to the glob set and never compared literal-to-literal: a false negative."}
  - {kind: finding, id: p1-r3, phase: 1, review_scope: in, title: "fr-triage.md does not say check reads only the cwd clone's repo", body: "R9: a reader running check from another repo sees every batch not compared; the page did not say so."}
  - {kind: finding, id: p1-r4, phase: 1, review_scope: in, title: "The board re-reads every batch's plan with git subprocesses on every driver pass", body: "About 3 + phases git calls per dispatched batch per pass, with no cache."}
  - {kind: finding, id: p1-r5, phase: 1, review_scope: out, title: "overlaps() compares repo names case-sensitively", body: "Relies on batch_repo's single spelling; the casing rule predates this change."}
