resolves:
  - {id: p1-r1, state: fixed, body: "_load also catches ValueError and RecursionError; check_command uses the new checked_report, which turns any unexpected exception into one not-compared line. Tests: test_a_yaml_scalar_that_is_not_a_real_date_is_unreadable_never_raised, test_check_exits_zero_when_the_overlap_read_raises."}
  - {id: p1-r2, state: fixed, body: "_is_glob counts only `*` and `?`; test_a_bracketed_literal_path_is_a_literal_not_a_glob pins both the literal-literal and the glob-literal case."}
  - {id: p1-r3, state: fixed, body: "fr-triage.md's plan overlap bullet now says check reads only the clone it runs in (its repo's batches), the driver's page reads every clone it was given, and an empty set means nothing overlaps, not nothing read."}
  - {id: p1-r4, state: refuted, body: "The cost is bounded by the in-flight batches (the driver's max_inflight cap) at a few local git plumbing calls each (cat-file, ls-tree, show on refs the pass already fetched), beside the much larger per-pass work the driver already does (fetches, trial merges, cursor reads). A cross-pass cache would add process-global state keyed on ref commits for no measured cost; the board is a view the driver renders once per pass."}
  - {id: p1-r5, state: out-of-scope, body: "batch_repo and Facts.config_for already decide the repo spelling for every triage reader; this change adds no new casing rule, and source_for_clones lowercases where it matches a clone."}
