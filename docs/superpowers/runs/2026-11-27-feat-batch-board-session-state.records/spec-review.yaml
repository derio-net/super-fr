journal:
- kind: finding
  id: s1
  review_scope: in
  title: Wait rule 1 hides the wait on Tester/DevOps lane, Closing-out and Obsolete cards
  body: Row 1 (terminal) was checked before needs_you, so merged lane cards, close-out cards and obsolete
    cards showed no wait.
- kind: finding
  id: s2
  review_scope: in
  title: Background rule checks the batch's item id though the front may be the close-out
  body: Row 5 read the batch's own item id even when Card.front is the close-out.
- kind: finding
  id: s3
  review_scope: in
  title: Row 7 maps awaiting and unselected proposed batches to queue
  body: Awaiting waits for the operator's approved-fr; an unselected proposed batch is never driven.
- kind: finding
  id: s4
  review_scope: in
  title: Precedence table leaves done/absent/None statuses, dead dependencies and None checks undecided
  body: done/absent/None fell to queue implicitly; dependency rule used 'merged'; checks may be None.
- kind: finding
  id: s5
  review_scope: in
  title: The dwell ledger has no single writer and an unpushed dwell.json makes fetches refuse
  body: One-shot renders could overwrite the driver's ledger; a local dwell.json would clash on fetch.
- kind: finding
  id: s6
  review_scope: in
  title: '''The driver writes the page every pass'' is false'
  body: Essential-only passes and non-collecting watch iterations do not render.
- kind: finding
  id: s7
  review_scope: in
  title: Ledger semantics underspecified
  body: Interval start, first-seen reset, closed-interval first-seen, cap in R5, wave-less batches.
- kind: finding
  id: s8
  review_scope: in
  title: No docs pages named though four pages cover touched paths
  body: fr docs check would fail at deliver.
- kind: finding
  id: s9
  review_scope: in
  title: lane_owners guarded status unstated; strict refusal of a display-only key costs the whole config
  body: A typo would refuse the repo's triage config.
- kind: review
  id: spec-review
  title: 'independent spec review: 9 findings, all in scope'
  body: fr-spec-reviewer checked the spec against decisions q1-q5 and the code (file:line for every cited
    symbol); 9 in-scope findings s1-s9, each fixed in the spec.
- kind: lens
  lens: errors
  title: the ledger's unreadable, concurrent-writer and state-ref paths and per-pane read failures can
    fail quietly
resolves:
- id: s1
  state: fixed
  body: R1 now says only a Done-column card has no wait; §A row 1 is column done, obsolete maps to you
    (row 3).
- id: s2
  state: fixed
  body: §A now names the front session's item id (closeout_item_id when the front is the close-out) and
    requires close-out-front tests.
- id: s3
  state: fixed
  body: §A rows 4 (awaiting → you, reviewer) and 7 (unselected proposed → you).
- id: s4
  state: fixed
  body: §A gives explicit rows 5/6 in dependency_state terms (dead → you), 12 (idle/done → agent), 13
    (absent/unknown/None → queue), and a null-safe checks read.
- id: s5
  state: fixed
  body: 'R5 and §D: one writer (no live drive.lock, or the driver itself with writer=True); others observe
    in memory; fetch_state adopts the ref''s dwell.json and never counts it as a clash.'
- id: s6
  state: fixed
  body: §D states the real cadence with file:line and Risks names late dating under pacing.
- id: s7
  state: fixed
  body: R5/R7 and §D define start = max(since), cleared first-seen on restart, per-interval first_seen,
    truncated flag, the 200 cap, ≥ totals and a no-wave block.
- id: s8
  state: fixed
  body: Design shape now names fr-triage.md, fr-dispatch.md, dispatch-lifecycle.md and herdr-control-sessions.md
    with what each says.
- id: s9
  state: fixed
  body: 'R4/§C: display-only, not in GUARDED_TRIAGE_KEYS; unknown lane keys go to `ignored` and a page
    note, never a refusal.'
acceptance:
- row: batch-card-waits-for
  op: reword
  why: 'spec-review s1: only a Done card has no wait'
  acceptance: Every card on the Batches page outside the Done column names the one party it waits for
    (you with the lane role, agent, background, ci, queue, dependency), decided by a fixed precedence
    after the column, which it never changes.
- row: batch-lane-owners
  op: reword
  why: 'spec-review s9: an unknown lane key is ignored, never refused'
  acceptance: A repo's .fr/triage.yaml lane_owners names owners per Needs-you lane; each Needs-you column
    header shows them or 'owner unassigned', per repo when they differ, and a lane card names them; an
    unknown lane key is ignored and named in a page note, never refusing the config.
- row: batch-dwell-ledger
  op: reword
  why: 'spec-review s5, s7: one writer, defined interval semantics'
  acceptance: Every Batches page observation records, in a dwell ledger carried by the state ref and stored
    only by its one writer, when each batch entered its current column and wait, closing the previous
    interval; first sightings and truncation are marked, a departed batch is dropped, a fetch adopts the
    ref's ledger, and an unreadable ledger is an empty one plus a note.
