acceptance:
  - id: ci-workflows-pin-the-python-floor
    capability: CI interpreter pin
    acceptance: Every workflow that installs uv runs on the declared requires-python floor (UV_PYTHON at workflow level), so no run downloads or drifts to another interpreter.
    origin: ["spec:2026-11-27-ci-hygiene#R4"]
    status: not-implemented
  - id: ci-workflows-least-privilege-token
    capability: CI token scope
    acceptance: Every workflow declares its token permissions at workflow level, and ci.yml's default is read-only contents, so no job silently takes the repository's default token scope.
    origin: ["spec:2026-11-27-ci-hygiene#R5"]
