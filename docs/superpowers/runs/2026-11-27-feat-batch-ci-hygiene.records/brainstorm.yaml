    body: |
      Batch `ci-hygiene` of derio-net/super-fr: 6 issues, one PR on `feat/batch-ci-hygiene`.
      - #1594 fr-spec-status.yml pins setup-python 3.12 and pip-installs fr v3.0.0; bump or retire.
