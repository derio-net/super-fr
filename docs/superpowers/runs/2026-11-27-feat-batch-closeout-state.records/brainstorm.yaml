    id: takeback-keep-driving
    title: "A failed take-back keeps the driver running and is reported once"
    body: "Operator chose 'Keep driving, report once' over stopping the driver: both errors in one line, counted as a failed write (`--once` exits 1), no board Need; the existing closeout-abandoned rule re-owes the marker."
  - kind: decision
