    title: "A batch whose repo left the scope has a derived `left-scope` stage"
    body: "Operator chose a derived, never-stored `left-scope` stage (closed out, Done column with a pill, no Jump) over the last recorded state or a stored collect event."
  - kind: decision
    id: cancel-orphaned
    title: "`batch cancel --orphaned` retires a left-scope batch"
    body: "Operator chose an explicit `--orphaned` flag: only the cancel event, no forge writes; cancel without it refuses on a left-scope batch and names the flag."
  - kind: decision
