resolves:
  - {id: l-security-r1, state: fixed, body: "`shown`/`shown_argv` print every argument shell-quoted and printable: a name with a control or non-printable character is ANSI-C quoted (`$'...'`), which bash and zsh read back to the same name. drift_text and drift_stop_text use them. Test: test_a_control_character_in_a_drifted_name_never_reaches_the_text_raw (round trip through bash)."}
  - {id: l-docs-accuracy-r1, state: fixed, body: "Both explainers now say a damaged record (or, on the driver page, an unreadable file) stops the export the same way, naming the record or file with its remedy (mend or remove it, or --force, which rewrites a damaged record)."}
  - {id: l-errors-r1, state: fixed, body: "`clear_drift_stop` returns a warning instead of raising; the driver prints it as a warn line and the export goes on. Test: test_a_stop_file_that_cannot_be_written_keeps_the_refusal."}
  - {id: l-errors-r2, state: fixed, body: "New base `ExportBlocked` (BadRecord and ExportDrift derive from it) for every refusal only the operator can mend in the repo copy; `_refuse_non_regular` and an unreadable file in `find_drift` raise it, and the driver's one `except TriageError` hands it to `stop_on`, which records the export-drift stop and Need. The foreign-stamp refusal is not this change's and stays a message-only refusal. Tests: test_a_non_regular_record_or_unreadable_file_is_an_export_blocked, test_stop_on_records_a_stop_only_for_an_export_blocked."}
