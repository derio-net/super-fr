  - {kind: finding, id: p1-r5, phase: 1, review_scope: in, title: "rev_parse/record_stop failures inside the driver's except handler escape the export's error handling", body: "triage_batch_cmd.py `_Driver._export`, the `except (ExportDrift, BadRecord)` handler."}
  - {kind: finding, id: p1-r6, phase: 1, review_scope: in, title: "Every export hashes or compares each durable file about 4 times; the digests could be reused", body: "state_sync.py `_record_bytes`, `find_drift`. Linear; efficiency only."}
