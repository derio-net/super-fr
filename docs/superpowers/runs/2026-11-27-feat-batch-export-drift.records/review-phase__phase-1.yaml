  - {kind: finding, id: p1-r2, phase: 1, review_scope: in, title: "A directory at exported-files makes --force fail with 'Is a directory', though the BadRecord text promises --force rewrites it", body: "state_sync.py `_write_root_file`, `BadRecord` (reproduced by the reviewer)."}
