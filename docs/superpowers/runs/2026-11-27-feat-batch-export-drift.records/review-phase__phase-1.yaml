  - {kind: finding, id: p1-r8, phase: 1, review_scope: out, title: "The stop's reason embeds the moving default sha, rewriting merge-stops.json each pass", body: "triage_batch_cmd.py `_export` with merge_stops.py `record_stop`. Cosmetic."}
  - kind: review
    id: review-p1-1
    phase: 1
    title: "phase 1 independent code review: 8 findings (7 in scope, 1 out)"
    body: |
      Independent reviewer (separate context, not the implementer) reviewed spec R1-R6, the plan and the diff from the merge-base. Raised p1-r1 … p1-r8. Received: p1-r1, p1-r2, p1-r3, p1-r4, p1-r5 and p1-r7 verified against the code and fixed with tests; p1-r6 refuted (linear, and the second hash is deliberate); p1-r8 refuted (intended). The executor's own open finding p1-bootstrap-repo-only-files-drift-forever was fixed before the review (the record names every durable file the root holds), and the reviewer confirmed it.
resolves:
  - {id: p1-bootstrap-repo-only-files-drift-forever, state: fixed, body: "`_record_bytes` records every durable regular file the root holds after the export, repo-only ones included, so a first or forced export settles them; spec R1 says so. Test: test_a_repo_only_file_at_the_first_export_is_recorded_not_drift_forever."}
  - {id: p1-r1, state: fixed, body: "`_record_path` refuses a key holding a NUL; `_hash` turns a ValueError into a TriageError. Test: test_a_hostile_record_key_is_a_bad_record_never_a_path (NUL, .., absolute, non-durable)."}
  - {id: p1-r2, state: fixed, body: "A non-regular record is a BadRecord with forceable=False, and its text says to remove it by hand; export_state refuses a non-regular stamp or record before any copy (`_refuse_non_regular`), so a forced run writes nothing. Test: test_a_directory_record_is_refused_and_force_names_the_hand_fix."}
  - {id: p1-r3, state: fixed, body: "export_command re-renders ExportDrift/BadRecord through drift_stop_text with its own scope_args. Test: test_the_export_verbs_remedy_carries_its_own_scope_options."}
  - {id: p1-r4, state: fixed, body: "The removal loop reports Skipped(rel, SYMLINK) for a selected state-only path under a repo-side symlink. Test: test_only_reports_a_state_only_path_under_a_repo_side_symlinked_dir."}
  - {id: p1-r5, state: fixed, body: "The default sha is read with the worktree setup, whose failures are export failures; an OSError writing the stop keeps the refusal and says the Need was not recorded."}
  - {id: p1-r6, state: refuted, body: "Each read is linear in the durable tree; nothing is asymptotically worse. The second hash after the copy is deliberate: the record must name the bytes on disk, read through the same O_NOFOLLOW descriptors, not digests computed before a copy that a racing path swap could have skipped. Reusing digests would trade that for a constant factor on small text trees."}
  - {id: p1-r7, state: fixed, body: "Added the hostile-key, record-named-symlink, directory-record, symlinked-dir --only and end-to-end recovery tests; the driver test now has a `delete` case and mends `edit`/`delete` through `import --only`, the remedy the stop prints."}
  - {id: p1-r8, state: refuted, body: "Intended: the stop records the default-branch sha the operator's checkout must be at or after, so it must move when main moves; record_stop writes only when head or reason changed, and that is the case."}
