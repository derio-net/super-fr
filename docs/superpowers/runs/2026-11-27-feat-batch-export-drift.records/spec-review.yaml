run: 2026-11-27-feat-batch-export-drift
step: spec-review
outcome: done
journal:
  - kind: finding
    id: s1-r1
    review_scope: in
    title: "A path deleted in the repo can never be fixed by the remedy: R5 refuses an --only path the repo-side root does not have"
    body: |
      R2's `deleted` kind names a path absent from `<dir>/<scope>/`, so the `--only <path>` R3/R4 print for it is refused by R5 (state_sync.py:131, `durable_entries` lists only existing files); the driver never forces, so the Need stands for good. State the remedy per kind, and how to keep the state's version from a driver stop.
  - kind: finding
    id: s1-r2
    review_scope: in
    title: "The motivating case is fixed only halfway: a repo-only durable file (decomposition.html) is never reported"
    body: |
      R2 requires the state to have the path, and `find_drift` walks only the state (state_sync.py:245-271, `_sync` never deletes), so importing `architecture/manifest.yaml` alone leaves the state's manifest naming a fragment it does not hold. Report repo-only files the record does not name too.
  - kind: finding
    id: s1-r3
    review_scope: in
    title: "The new Need kind `export-drift` has no NEED_LABELS entry: the Batches page render raises KeyError"
    body: |
      views.py:255 `NEED_LABELS`, render.py:1000 `NEED_LABELS[r.kind]` (plain subscript), views.py:235-249 the kind list. Add the label, the comment entry and a test.
  - kind: finding
    id: s1-r4
    review_scope: in
    title: "The Need reads its paths back out of a free-text stop reason, and its import command can point at the wrong directory and state"
    body: |
      merge_stops.py:29-35 (`MergeStop` is head/reason/at), triage_state_cmd.py:196-219 (`--from` relative to cwd). Parsing paths out of `reason` breaks on odd names; `--from docs/triage` must be run in a default-branch checkout at or after the stop's head; the `else docs/triage` fallback cannot occur while exporting and would print a wrong path; a `--dir` driver targets a state a plain `--repo` import does not reach.
  - kind: finding
    id: s1-r5
    review_scope: in
    title: "Symlink handling on the repo side of the drift check and the record read is unspecified (security lens)"
    body: |
      state_sync.py:150-157, 171-183, 209-242, 253-255. Say `read_record` and `find_drift` read through O_NOFOLLOW descriptors, what a repo-side symlink at a durable path is for drift, and what an `--only` path matching a symlink does; test each.
  - kind: finding
    id: s1-r6
    review_scope: in
    title: "An unreadable or unparseable record has no remedy, and the driver shows only a generic refusal"
    body: |
      triage_batch_cmd.py:7896-7898 (a plain TriageError is a refusal with no stop and no Need). Say whether `--force` rewrites a bad record, and give the driver its own stop and Need for it.
  - kind: finding
    id: s1-r7
    review_scope: in
    title: "The record's line format cannot represent every path a durable file may have"
    body: |
      state_sync.py:112-128 (`_walk` yields any file name). A newline or backslash in a name breaks `<sha256>  <path>` lines; define an escape or refuse, and pin the round trip.
  - kind: finding
    id: s1-r8
    review_scope: in
    title: "The Verification rows do not cover several requirements: --force, the --only refusals, the stop clearing, and the record kept out of import"
    body: |
      Widen the three rows' reasons or add rows so every requirement is covered; state that a hand `fr triage state export` never touches the driver's stops.
  - kind: finding
    id: s1-r9
    review_scope: out
    title: "A targeted import writes the state directory under a running driver with no drive.lock check"
    body: |
      triage_state_cmd.py:196-223 (import takes no lock), triage_batch_cmd.py:7893. Import was lock-free before this change; worth a follow-up, not a blocker.
  - kind: review
    id: spec-review-1
    title: "independent spec review: 9 findings (8 in scope, 1 out)"
    body: |
      Findings s1-r1 … s1-r8 (in scope) and s1-r9 (out of scope). The five operator decisions (d-record-location, d-bootstrap, d-hand-export, d-only-semantics, d-verification) are honoured. Named code verified at file:line by the reviewer (state_sync.py, merge_stops.py, views.py, render.py, model.py, triage_state_cmd.py, triage_batch_cmd.py, the fr-triage skill and the three docs pages).
  - kind: lens
    lens: errors
    title: new refusal paths (drift, a bad record, --only refusals, the driver stop) each need an operator-facing remedy that actually works
resolves:
  - {id: s1-r1, state: fixed, body: "R5 now removes from the state a named path the repo lacks (reported `removed`), so `deleted` drift is taken in; R3/R4 name `export --force` to keep the state's version."}
  - {id: s1-r2, state: fixed, body: "R2's `added` kind now covers a repo file the record does not name whether or not the state has it; find_drift walks the union of state, repo and record."}
  - {id: s1-r3, state: fixed, body: "R4 and the Design add NEED_LABELS['export-drift'], the Need kind comment and a render test."}
  - {id: s1-r4, state: fixed, body: "The stop's reason is now the whole operator text, built in _export from the config it holds (shell-quoted args, the sha to be at or after, --dir when overridden); the Need shows it, parsing nothing."}
  - {id: s1-r5, state: fixed, body: "R2/R5 and the Design: the record and repo files are read through O_NOFOLLOW descriptors; a repo-side symlink is never drift, skipped as SYMLINK_DEST; a named symlink is skipped, never followed or removed."}
  - {id: s1-r6, state: fixed, body: "R3: a bad record is refused naming the file and --force rewrites it; R4: the driver records the same export-drift stop and Need for it (BadRecord)."}
  - {id: s1-r7, state: fixed, body: "R1: the record is JSON, which escapes any file-name character; the Verification row names the round trip."}
  - {id: s1-r8, state: fixed, body: "The three Verification reasons now name every behaviour of R1-R5; R4 states a hand export never reads or writes the driver's stops."}
  - {id: s1-r9, state: out-of-scope, body: "fr triage state import has never taken drive.lock; this change adds a selector, not the lock-free write. It is a separate hazard of the existing command."}
acceptance:
  - row: targeted-import-only
    op: reword
    why: spec review s1-r1 — a named path the repo lacks is now removed from the state
    acceptance: "`fr triage state import --only <path>` changes only the named files or directories: copied from the repo even over a newer state copy, or removed from the state when the repo lacks them; every other state file is left alone, and a path naming no durable file on either side is refused before anything changes."
  - row: export-drift-refused
    op: reword
    why: spec review s1-r2, s1-r6 — repo-only files are drift too, and a bad record is refused
    acceptance: "An export over a repo-side root whose durable files changed, were deleted or were added since the last export (per its committed exported-files record), or whose record is unreadable, writes nothing and names every drifted path and the remedy; `fr triage state export --force` overwrites them and rewrites the record; every export writes the record."
