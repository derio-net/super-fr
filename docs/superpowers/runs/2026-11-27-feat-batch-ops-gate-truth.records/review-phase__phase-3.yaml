- kind: decision
  id: p3-head-manual-tick-rule
  phase: 3
  title: A manual phase counts as ticked by the PR head when the head's copy is ticked with the same state
    block
  body: The plan does not exist on the base, so ticks cannot be compared with it. A tick or re-tick on
    the ops branch changes the state block and counts; one identical to the head's copy proves nothing
    inside the stage.
