resolves:
- id: sr-1
  state: fixed
  body: R2 now waits only while a ConflictEvent the probe recorded names the live head (a conflict the queue cannot resolve); a queue-resolvable conflict is recorded First and the queue's build resolves it.
- id: sr-2
  state: fixed
  body: R1 states an ended approval is no fr removal (no facts rewrite, no comment); Design splits board/readiness wording on voided_at == approved head; the voided set counts only fr's removals.
- id: sr-3
  state: fixed
  body: R2 uses a new Waiting verdict with its own readiness fact; the approve-pr Need skips it; said once per head, not a warning.
- id: sr-4
  state: fixed
  body: Design names _comments_off beside _labels_off in approval.py (client_policy(...).block('comments'), unreadable blocks), re-exported by operator_entries; R3 says an unreadable policy posts nothing.
- id: sr-5
  state: fixed
  body: Design uses wave_queue.queue_landed over the repo's records for both the pass and the command's due list; landed_keys dropped.
- id: sr-6
  state: fixed
  body: R5 states the post_merge action shares the due value and that this is intended (the hold blocks a release; the landing normally runs post_merge itself).
- id: sr-7
  state: fixed
  body: R6 names the blocking members (not due, unverified, ledger-unread), the ones that do not block (verb-held, unselected), and emits a held action naming them.
- id: sr-8
  state: fixed
  body: pacing.py added to Design and shape; planned_at joins _TIMES and is parsed on its own so a bad value is None without resetting the state.
- id: sr-9
  state: fixed
  body: 'R7: a landed batch with no readable merged_at reads its repo (fail open); queue-landed batches have no deadline (R5).'
- id: sr-10
  state: fixed
  body: R4 reworded to the queue's classification for a merge onto the default branch, and names what it does not model.
- id: sr-11
  state: fixed
  body: R2 states the trade-off (a label read before mergeability is computed or the probe ran is recorded as today).
- id: sr-12
  state: fixed
  body: queue-approval-waits-conflict-free retired into queue-approval-label-lifecycle, which now cites R1-R3; spec Verification updated.
