  - {id: sr-2, state: fixed, body: "New R8 and §C: once ended, an old-only quiet switch keeps the repo fr-enabled (gated), never quiet placement, never a write target; same in marker.ts."}
  - {id: sr-3, state: fixed, body: "R5: sync stays listed with a gate-independent help line; R10 adds a test rendering the CLI tree with the version forced into 9.2."}
  - {id: sr-4, state: fixed, body: "Background and §B name quiet._read and fr.settings.load._stealth as the gated readers; switch_texts/target_settings_texts/_read_legacy stay ungated for the movers; settings/load.py added to the shape."}
  - {id: sr-5, state: fixed, body: "§B names quiet.write_switch and stealth.write_target_settings; Background cites call and definition lines; R4 covers the docstrings and stderr text."}
  - {id: sr-6, state: fixed, body: "R4 covers the differing, lagging, absent and half-written refusals and every message naming fr settings sync (config_migration.py included); R3 keeps _create_from_old_switch a mover."}
  - {id: sr-7, state: fixed, body: "R3 lists fr repos sync and fr repair as movers; §B gives them fr.config.space.old_path(), which never refuses."}
  - {id: sr-8, state: fixed, body: "R10 defines how each test kind picks its side: monkeypatch in process, a fixture version source for shell/TS, FR_OLD_PATHS=refuse for subprocess/scenarios with the open side run only below 9.2."}
  - {id: sr-9, state: fixed, body: "R14 defines 'sets' (assignment, export, setenv, env-mapping key; unset/delenv allowed), lists the three allowed files; R6 makes no message offer a per-kind variable, so the lens message and its test change."}
  - {id: sr-10, state: fixed, body: "R11/R12 and §D: a .fr/ path segment anywhere in the rendered string or element; absolute paths under the repo or worktree root are resolved; other embedded forms refuse; no shell parsing claimed."}
  - {id: sr-11, state: fixed, body: "R6/§B: LegacyEnvRefused (a TransitionError) mapped by each resolver to its own error type; exit 2 tested through one CLI per kind."}
  - {id: sr-12, state: out-of-scope, body: "Tagged out of scope by the reviewer (wording). R1's last clause was rewritten as part of sr-1's fix, which scopes it to Python and points at R7."}
