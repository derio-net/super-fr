journal:
  - kind: finding
    id: sr-1
    review_scope: in
    title: "R7's version files are absent where two of the shell readers actually run, so 'unreadable -> ended' ends the transition on day one"
    body: "scripts/deliver-opencode-plugin.sh:138-140 copies only .ts files (no package.json); fr hermes install copies the hook tree to ~/.hermes/super-fr-hooks/ (hermes.py:360), away from plugin.json; fr validate plans runs the wheel copy of validate-plans.sh with no plugin.json beside it. Fix: a version source beside every delivered copy, a test per location."
  - kind: finding
    id: sr-2
    review_scope: in
    title: "Once ended, the edit gate stops seeing an unmigrated quiet repo as fr-enabled (fails open)"
    body: "_fr_placement_enabled (fr-isolation-decision.sh:443-468) decides fr-enabled from _fr_read_switch; reading only FR_SWITCH_NEW drops an old-only quiet repo, and _fr_paths_enabled's fr would refuse. Same in marker.ts:211-241. Fix: an old-only switch stays fr-enabled (gated), never quiet, never a write target."
  - kind: finding
    id: sr-3
    review_scope: in
    title: "Hiding `fr settings sync` by version breaks the generated CLI tree in the 9.2.0 release's own suite"
    body: "scripts/sync-readme.py:180 omits hidden commands and docs/reference/cli.md:236 lists fr settings sync; at prepare's 9.2.0 suite test_tripwire_readme_sync.py would see drift. Fix: keep it listed with a gate-independent help line; test the tree with the version forced into 9.2."
  - kind: finding
    id: sr-4
    review_scope: in
    title: "§B gates the wrong functions: the old-switch readers are `quiet._read` and `settings.load._stealth`, and the text readers are shared with the migration"
    body: "quiet._read (quiet.py:191-217) and fr.settings.load._stealth (load.py:324-375) are the fallback readers; switch_texts/target_settings_texts are read by fr.config.migrate (migrate.py:363,433-435) and must stay ungated for R3; settings/load.py was missing from the shape."
  - kind: finding
    id: sr-5
    review_scope: in
    title: "The write functions are `write_switch`/`write_target_settings`, not `write_settings`; the stealth line cited is the call site"
    body: "fr.config.space.write_settings (space.py:273-303) dispatches to quiet.write_switch (:1251, write_legacy at :1304) and stealth.write_target_settings (:862, write_legacy_target at :906, def :1006). Docstrings/stderr at quiet.py:1291-1295, stealth.py:899-904 promise the old copy follows."
  - kind: finding
    id: sr-6
    review_scope: in
    title: "`fr settings init` and other messages still offer the half-written old-copy refusal and `fr settings sync` once the transition has ended"
    body: "settings_cmd.py:145-149,216-229,254-266,441-447, quiet.py:274-290,420-436 and config_migration.py:216-219 fire on an absent old copy or name fr settings sync. R4 must cover the absent/half-written refusals and every SYNC_COMMAND message, and say _create_from_old_switch stays a mover."
  - kind: finding
    id: sr-7
    review_scope: in
    title: "R2's refusal in `located` also reaches `fr repos sync` and `fr repair`, which move or rewrite the old plan-config themselves"
    body: "repos_cmd.py:65-97 (located at :83, writes new and unlinks old at :93-96) and repair.py:337 are movers; §B exempted only fr.config.migrate. Fix: say they keep reading the old path, and test it."
  - kind: finding
    id: sr-8
    review_scope: in
    title: "R9 has no way for subprocess, shell and TypeScript tests to force the not-ended side, so they still go red at 9.2"
    body: "Shell-library cases (test_isolation_decision_cases.py), validate-plans tests, bun tests and CLI subprocess tests can only force the ended side. Fix: a defined mechanism per test kind (fixture version source; ended side forced; open side run only below 9.2)."
  - kind: finding
    id: sr-9
    review_scope: in
    title: "R13's tripwire allowlist (one file) contradicts config-homes.sh, test_lenses_resolve.py and the lens resolver's own message"
    body: "config-homes.sh:42,116-119 sets and unsets the variables; test_lenses_resolve.py:46,71 sets FR_SHIPPED_LENSES_DIR and asserts the lens message (lenses/resolve.py:46) offers it. Fix: define 'sets', list every allowed file, gate the lens message."
  - kind: finding
    id: sr-10
    review_scope: in
    title: "R10/R11's `.fr/` detection misses absolute and embedded forms; R11 overclaims what `shlex` proves"
    body: "in_space (space.py:84-86) is a prefix test, so {repo}/.fr/x and --config=.fr/x escape; shlex.split tokens for a;.fr/x, <.fr/x, --opt=.fr/x neither are nor start with .fr/. Fix: fail closed on any .fr/ path segment in the rendered string or element."
  - kind: finding
    id: sr-11
    review_scope: in
    title: "R6 does not name the exception, and 'callers already surface resolver errors as exit 2' is unverified"
    body: "_shipped (_shipped.py:128-153,170) has no error type; workflow/resolve.py:96, verification/resolve.py:47, lenses/resolve.py:30 catch their own errors. Fix: raise and map to each kind's own error, test exit 2 through one CLI per kind."
  - kind: finding
    id: sr-12
    review_scope: out
    title: "R1 says nothing else compares a version, while R7/R8 add three more comparisons"
    body: "Wording only: R1's last clause read as global while R7/R8 add shell and TypeScript comparisons."
  - kind: review
    id: spec-review-1
    title: "independent spec review: 12 findings (sr-1..sr-12; 11 in scope, 1 out)"
    body: "findings: sr-1..sr-12. Decisions q1-q5 reflected in R1-R16. All named files/helpers verified with file:line by the reviewer."
  - kind: lens
    lens: tests
    title: "R10's promise that no test turns red at 9.2 needs a check of every transition test's gate side, shell, TypeScript and the release suite included"
  - kind: lens
    lens: errors
    title: "New exit-2 refusals across readers that catch different exception types"
resolves:
