journal:
  - kind: discovery
    input: true
    id: operator-brief
    title: "Batch s2-alacarte-settings: issue #1654 as dispatched"
    body: |
      Batch `s2-alacarte-settings` of derio-net/super-fr, one issue, one PR.

      #1654 — S2: à la carte .fr/settings.yaml — available workflows, PR-body sections, modes, stealth code-push confirmation.

      Part of the event-driven, à la carte epic (#1652). Depends on: S1.

      Composable `.fr/settings.yaml`:
      - which workflows are available in the repo;
      - which PR-body sections are required (today `fr.record.pr_body.REQUIRED_SECTIONS` is fixed — e.g. a repo may drop Proportionality or Cost);
      - mode choices, including stealth settings read from its own file in the tracking space;
      - stealth: code reaches the target (`fr push`, `fr pr create`) only after explicit operator confirmation, regardless of `git.push`; state keeps being pushed to the tracking repo on every write. fr-goal's push at `deliver` open becomes a confirmation gate under stealth.

      Delivery rules from the dispatch: branch feat/batch-s2-alacarte-settings; draft PR once the spec is committed with `Closes derio-net/super-fr#1654`; `fr run start --issue 1654`; no member issue as a phase tracking_issue; the wave driver owns mergeability and CI (no `fr pr settle` loop); never add `approved-fr`.
  - kind: decision
    id: q1-workflows-denylist
    title: "Available workflows are a denylist: workflows.disabled"
    body: "Operator chose a denylist (`workflows.disabled: [...]`) over the recommended allowlist and an on/off map. Everything not listed stays available; runs already started keep going (spec R1-R3)."
    answered_by: operator
  - kind: decision
    id: q2-sections-informational
    title: "Only informational PR-body sections are configurable"
    body: "Operator chose: Proportionality, Cost and PR settle may be turned off; Findings, Out-of-scope, Shape, Pre/Post-merge owed, Manual operations and Owed actions discharged stay fixed (spec R4)."
    answered_by: operator
  - kind: decision
    id: q3-off-not-rendered
    title: "An off section is rendered nowhere"
    body: "Operator chose: dropped from the live PR body and the durable pr-body.md; figures stay reachable through their own commands (spec R5)."
    answered_by: operator
  - kind: decision
    id: q4-modes-fix-document
    title: "Modes: nothing new; fix the placement text and document"
    body: "Operator chose: S1's stealth settings read is the delivered half; S2 corrects the `placement` key's stale description and documents where each mode's settings live. No allowed-placements key, no retirement of the key (spec R6)."
    answered_by: operator
  - kind: decision
    id: q5-stealth-every-push-asks
    title: "D7: every stealth push and PR creation asks"
    body: "Operator chose: under stealth `fr push` and `fr pr create` always take the `ask` path, one verified approval each; fr-goal under stealth skips per-phase pushes, its one code push is the deliver-open gate (spec R7-R9)."
    answered_by: operator
  - kind: decision
    id: q6-verify-candidate-developer
    title: "Verification: candidate, gate developer"
    body: "Operator chose the candidate strategy with a scenario walk and gate developer; nothing is held after merge."
    answered_by: operator
  - kind: lens
    lens: security
    title: "D7 is a control on code leaving for a stealth target without the operator's confirmation"
