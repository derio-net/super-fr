journal:
  - kind: decision
    id: p1-schema-line-at-current
    phase: 1
    title: fr settings init renders the schema line at the current schema (3)
    body: >-
      `#schema: 1` uncommented with every other line would name `workflows` and
      `forge.pr_sections` under schema 1, which R1 refuses. The init file's schema line now
      shows SCHEMA_VERSION, so a file uncommented whole still parses; the model default
      stays 1 (a file naming no schema-3 key may stay at 1).
  - kind: decision
    id: p1-push-checks-before-ask
    phase: 1
    title: fr push runs the stealth content scan and the subject check before the ask
    body: >-
      Under stealth every code push now asks. Asking the operator to approve a push fr then
      refuses (an fr path in the range, a subject off the template) wastes the approval, so
      `refuse_stealth_content` and `check_subjects` moved before `require_approval`; the squash
      and the pusher still run after it, and the pusher scans again.
  - kind: decision
    id: p1-driven-triage-message
    phase: 1
    title: one push-ask-with-driven-triage rule, its message chosen by placement
    body: >-
      A settings-check rule's message may now be a callable of the settings
      (`fr.settings.check.Message`), so the stealth wording (stealth forces git.push ask, remove
      the driven .fr/triage.yaml keys) keeps the rule's single id. Under stealth a tracking
      configuration space not created yet holds no triage file, so the rule reads nothing then
      instead of refusing every stealth check.
  - kind: discovery
    id: p1-stealth-walks-need-approval
    phase: 1
    title: forcing git.push/git.pr ask under stealth broke the stealth placement walks
    body: >-
      tests/scenarios/placement-stealth.sh and _placement_walk.sh pushed code with `fr push`
      and delivered a PR the record emitted. Both now refuse under stealth (R7, R9). A
      scenario has no operator or harness, so `tests/scenarios/_ask_approve.sh` approves a
      request the way a session does: the request's own `fr journal add` line plus an answer
      in a Claude Code transcript built from the captured AskUserQuestion exchange
      (FR_TRANSCRIPT_ROOT). The walk's local-path origin names no forge repository, so `fr pr
      create` cannot reach the forge there; the walk asserts deliver's refusal and then records
      the PR on the cursor exactly as `fr pr create` does after the forge answers. The stealth
      content unit tests take the ask as approved (`approved_asks` in stealth_repo.py); the
      approval itself stays pinned in test_git_policy_push.py and test_settings_stealth.py.
  - kind: discovery
    id: p1-fast-tier-not-finished
    phase: 1
    title: the fast tier was stopped at 2% (no failure yet) on a host at load ~50
    body: >-
      `uv run pytest --fr-scope origin/main -n 2 -q --no-cov` selected most of the suite
      (this change reaches fr.settings, run_cmd and the PR body) and ran about 1% per four
      minutes on a host other sessions held at load ~50: hours. It was stopped with no failure
      or error in its output. What ran in full instead, all green: every tests/unit/test_settings_*,
      test_workflow_available, test_workflow_check, test_pr_body_* (sections, cost, settle),
      test_deliver_pr_body, the stealth/placement/config/push/pr/git_policy units (192 + 472
      tests), test_skill_stealth_push and the mirror tripwires, and the scenarios
      alacarte-settings, placement-stealth and placement-quiet on the installed candidate.
      ruff format, ruff check and mypy are clean. CI (`tests: ci`) is the suite evidence.
