- kind: review
  id: l-review
  global: true
  title: 'lens review (docs-accuracy, errors, security, tests): 24 findings, 20 in scope, 4 out of scope'
  body: |
    One dispatched reviewer per lens over the whole feature diff. Security found no way for code to reach a stealth target without a verified approval. In scope: 19 fixed and 1 refuted (l-errors-r7). Out of scope: l-docs-accuracy-r4, l-security-r4 and l-security-r5, each filed at deliver. l-security-r2 and r3 duplicate l-errors-r6 and r8.
resolves:
- {id: l-docs-accuracy-r1, state: fixed, body: "01-fr-goal.md and the fr-goal skill (and mirrors) now say no phase uses tests: ci as its own evidence. A phase's evidence is a local log, or under a declared tests: ci its fast tier with tests_log: none."}
- {id: l-docs-accuracy-r2, state: fixed, body: "The row now gives .fr/settings.yaml on fr-config (quiet) and <target-dir>/.fr/settings.yaml on <branch>-config (stealth). Lines 1505 and 1600 are corrected too."}
- {id: l-docs-accuracy-r3, state: fixed, body: The shape file names Workflows.disabled and Forge.pr_sections (PrSections).}
- {id: l-docs-accuracy-r4, state: out-of-scope, body: "The policy-key lines (1505, 1600) are fixed here. The quiet switch passage (init --quiet and the origin/fr switch) describes S1's switch move, which this change did not touch and which needs its own check against config/space.py."}
- {id: l-errors-r1, state: fixed, body: "Under stealth, an unfetched tracking config branch now prints a notice naming git fetch origin <branch>-config. It still reads no driven scope, because a first stealth run's branch may not exist yet. Pinned in test_settings_stealth.py."}
- {id: l-errors-r2, state: fixed, body: "refuse_disabled now names --workflow and an available shape (fr run adopt <plan> --workflow <s>, fr run start <s>). Migrate's adopt prints that message per plan."}
- {id: l-errors-r3, state: fixed, body: "The message names where workflows.disabled is read for the placement. Under stealth that is the tracking repo's settings file, not the target's."}
- {id: l-errors-r4, state: fixed, body: "fr run start's disabled refusal adds the line: a run already on this branch keeps going: fr run status, fr run advance <id>."}
- {id: l-errors-r5, state: fixed, body: "fr push uses git_policy.push.push_moves_remote, so a branch absent on the remote whose HEAD adds no commit is nothing to push. Pinned in tests/unit/test_push_moves_remote.py."}
- {id: l-errors-r6, state: fixed, body: The shape file's diagram follows the code's order.}
- {id: l-errors-r7, state: refuted, body: "The fallback renders every section (a superset of what settings could switch off), so it fails toward more required sections, never fewer. deliver loads the settings itself and refuses an unreadable file with its cause, so no cause is hidden."}
- {id: l-errors-r8, state: fixed, body: The docstrings are back under their constants.}
- {id: l-security-r1, state: fixed, body: "push_moves_remote reads the remote live (commits_the_push_adds and ls-remote of the branch). A stale or hand-made remote-tracking ref no longer reads as nothing to push. Pinned in test_push_moves_remote.py (stale ref, fast-forward onto main)."}
- {id: l-security-r2, state: fixed, body: Same fix as l-errors-r6.}
- {id: l-security-r3, state: fixed, body: Same fix as l-errors-r8.}
- {id: l-security-r4, state: out-of-scope, body: "The transcript reader and its environment overrides predate this change, and protecting them needs a design of its own (where fr may trust a transcript)."}
- {id: l-security-r5, state: out-of-scope, body: "These writers predate this change, each needs an operator --yes, and none is reachable from fr-goal's stealth path. Making them read the git policy is its own change."}
- {id: l-tests-r1, state: fixed, body: "Added test_stealth_pr_create_asks_and_stores_a_pr_request (no stub). The approved_asks docstring names where the request and the approval are pinned."}
- {id: l-tests-r2, state: fixed, body: alacarte-settings.sh now starts fr-goal on another branch after the refusal and checks its cursor was written.}
- {id: l-tests-r3, state: fixed, body: "s2-stealth-confirm gains the placement-stealth scenario (which walks fr pr create's ask) and unit levels for the pr-create ask, pr auto and push_moves_remote."}
- {id: l-tests-r4, state: fixed, body: The stealth init test asserts push and pr render at ask.}
- {id: l-tests-r5, state: fixed, body: An explicit git.pr auto is pinned as stealth-forge-explicit.}
- {id: l-tests-r6, state: fixed, body: A stealth push refused by its subject check leaves no request and prints no ask.}
- {id: l-tests-r7, state: fixed, body: The test disables fr-goal-light in real schema-3 settings on origin's default branch and checks the setting is in force first.}
- {id: l-tests-r8, state: fixed, body: "Renamed to ..._on_the_live_pr. The durable copy is asserted by test_the_durable_render_lacks_an_off_section."}
