schema_version: 12
run: 2026-11-28-feat-batch-silent-failures
step: brainstorm
outcome: done
questions: {rounds: 1}
journal:
  - kind: discovery
    input: true
    id: brief
    title: "Operator brief: triage batch silent-failures (#1682, #1668, #1592, #1689)"
    body: |
      /fr-goal batch silent-failures

      Batch `silent-failures` of derio-net/super-fr: 4 issues, delivered as ONE pull request.
      Batch title: Silent failures: errors that report success or lose their reason

      - super-fr#1682: install.sh hides fr's refusals: `fr models apply ... || true` turns a named
        exit-2 into a missing model: line. Batches with #1668.
      - super-fr#1668: Flaky test_the_refusal_lists_installable_tags_in_version_order drops a tag
        (bootstrap's installable_tags skips a failed git show silently). Batches with #1682.
      - super-fr#1592: adopt.py and push_cmd.py swallow forge errors silently, so a login page is
        never named there. Fail-open stays, add a log or warning line.
      - super-fr#1689: fr debt: an unsupported forge operation is reported as 'forge error', and
        the reason never reaches the CI log.

      Delivery rules: branch feat/batch-silent-failures; draft PR as soon as the spec is
      committed, with one `Closes derio-net/super-fr#<n>` line per member; no member issue as a
      phase tracking_issue; the wave driver owns mergeability and CI (no `fr pr settle` loop);
      never add the `approved-fr` label.
  - kind: decision
    id: d1-install-warn
    title: "install.sh warns and continues when fr models apply fails, and repeats every warning at the end with the fr version"
    body: |
      Q: When fr models apply exits non-zero, what should the install do?
      A (operator): warn and keep going; "the warnings should be shown again at the bottom (as well
      as the fr version), otherwise they might be missed by the user." Spec R1, R2.
  - kind: decision
    id: d2-bootstrap-refuse
    title: "bootstrap refuses, naming the tag and git's message, when a tag's install.sh cannot be read"
    body: |
      Q: When reading a tag's install.sh fails for a reason other than 'absent', what should
      bootstrap do? A (operator): Refuse, naming it (recommended). Spec R3, R4.
  - kind: decision
    id: d3-every-swallowed-error
    title: "adopt and push warn on every swallowed forge error, not only login pages"
    body: |
      Q: Which swallowed errors print a one-line warning? A (operator): every swallowed error
      (recommended). Both sites stay fail-open. Spec R5, R6.
  - kind: decision
    id: d4-debt-stderr
    title: "fr debt issue prints each unavailable source's reason as a plain stderr line"
    body: |
      Q: Where should fr debt issue print the detailed reason? A (operator): plain stderr line
      (recommended), not a ::warning:: annotation. Spec R8.
  - kind: decision
    id: d5-verification
    title: "Verification: strategy candidate, rows none (CI tests), gate developer, no Test Plan"
    body: |
      Q: How is this batch verified before it merges? A (operator): candidate, rows by CI
      (recommended). Spec ## Verification.
  - kind: lens
    lens: errors
    title: "The batch is about error paths: every new warning and refusal must carry its real reason"
resolves: []
acceptance:
  - id: install-warns-on-fr-refusal
    capability: Installer
    acceptance: "When fr models apply refuses during install, the install continues, prints a WARNING naming fr's exit code, message and remedy, and repeats every warning of the install at its end beside the installed fr version"
    origin: ["spec:2026-11-28-batch-silent-failures#R1", "spec:2026-11-28-batch-silent-failures#R2"]
    status: not-implemented
    verify: none
  - id: bootstrap-unreadable-tag-refuses
    capability: Installer
    acceptance: "bootstrap.sh never drops a release tag silently: a tag whose install.sh git cannot read stops bootstrap with an ERROR naming the tag and git's message, while an absent or unmarked install.sh is still skipped"
    origin: ["spec:2026-11-28-batch-silent-failures#R3", "spec:2026-11-28-batch-silent-failures#R4"]
    status: not-implemented
    verify: none
  - id: forge-read-failure-named
    capability: Forge adapters
    acceptance: "fr run adopt and fr push still fail open when a PR's state cannot be read, and print one redacted stderr line naming the PR and the reason (a login page included)"
    origin: ["spec:2026-11-28-batch-silent-failures#R5", "spec:2026-11-28-batch-silent-failures#R6"]
    status: not-implemented
    verify: none
  - id: debt-unsupported-forge-named
    capability: Debt report
    acceptance: "fr debt publishes a forge operation the backend does not support as 'not supported on <backend> (<issue>)', never 'forge error', and fr debt issue prints each unavailable source's reason on stderr"
    origin: ["spec:2026-11-28-batch-silent-failures#R7", "spec:2026-11-28-batch-silent-failures#R8"]
    status: not-implemented
    verify: none
