schema_version: 12
run: 2026-11-28-feat-batch-tester-gate-auto-pass
step: lens-review
outcome: done
journal:
  - {kind: finding, id: l-docs-accuracy-r1, global: true, review_scope: in, title: "fr-exit-gates.md said 'outside any batch' and 'exactly one run cursor'", body: "loose_prs also takes a closed-out batch's PR, and _run_text counts one run (live + archived copies), not one cursor file."}
  - {kind: finding, id: l-errors-r1, global: true, review_scope: in, title: "A cursor naming another PR silently yielded NO_RUN; a non-string pr skipped the check", body: "ledger._run_text returned None for a mismatching pr, with no report; isinstance(recorded, str) let a non-string pr through."}
  - {kind: finding, id: l-errors-r2, global: true, review_scope: in, title: "A repo-level failure was reported once per loose PR under a key with no repo", body: "triage_drive_loose._read re-raised the cached repo error per PR keyed 'ledger\\0PR #n\\0exc': floods output and can drop another repo's same-number warning."}
  - {kind: finding, id: l-errors-r3, global: true, review_scope: out, title: "read_cursors drops malformed run cursors silently, and R5's two-run check now depends on it", body: "The yaml.YAMLError swallow predates this change (moved unchanged from _run_text)."}
  - {kind: finding, id: l-security-r1, global: true, review_scope: in, title: "Loose PRs bound to a cursor by branch name alone; url check ignored owner/repo; forks not excluded", body: "_run_text accepted any cursor with no pr, compared only the url's /<n> suffix, and loose_prs ignored cross_repo."}
  - {kind: finding, id: l-tests-r1, global: true, review_scope: in, title: "The copy of run_gate/run_gate_inherited/ops_promoted into the loose ledger was untested", body: "Driver fakes always returned defaults."}
  - {kind: finding, id: l-tests-r2, global: true, review_scope: in, title: "LooseWorld left batch PRs out of gated_prs, unlike collect", body: "No driver test of a landed gated batch whose PR is also in gated_prs, nor of R8 through the real _ledgers skip."}
  - {kind: finding, id: l-tests-r3, global: true, review_scope: in, title: "test_a_cursor_naming_another_pr_means_no_rows... never exercised the cursor rule", body: "It stubbed gated_rows_at to NO_RUN."}
  - {kind: finding, id: l-tests-r4, global: true, review_scope: in, title: "R4's tracker closure and labels-off were not asserted for a loose gate-pass", body: "repo now comes from action.repo."}
  - {kind: finding, id: l-tests-r5, global: true, review_scope: in, title: "The once-only report key named 'PR #n' without the repo", body: "Same-number PRs of two repos with the same error were reported once in all."}
  - kind: decision
    id: no-pr-cursor-kept
    global: true
    title: "A loose PR's cursor that records no pr is still accepted (R5), after l-security-r1"
    body: "On origin/main 95 of 144 run cursors (live 1 of 11, archived 95 of 133) record no pr: they predate `fr pr create` recording it (run v11). Refusing them would leave most of the Needs you · Tester cards this batch exists to clear stuck. The binding is tightened instead: fork PRs and PRs of unknown origin are never loose, exactly one run may name the branch, a recorded pr must match owner/repo and number, and the rows must read walked on the default branch, behind a gate label only triage rights can set."
  - {kind: review, id: lens-review, global: true, title: "lens review: docs-accuracy, errors, security, tests — 11 findings", body: "docs-accuracy 1 (in), errors 3 (2 in, 1 out), security 1 (in), tests 5 (in). All in-scope fixed with tests; l-errors-r3 out of scope (predates the change)."}
resolves:
  - {id: l-docs-accuracy-r1, state: fixed, body: "fr-exit-gates.md: 'a merged pull request that no open batch covers: one outside every batch, or one whose batch has closed out', 'exactly one run ... (live and archived cursors count as one)', plus the fork rule."}
  - {id: l-errors-r1, state: fixed, body: "_run_text raises TriageError 'the run cursor <run> on branch <b> records PR <x>, not <repo>#<n>' for a mismatching or non-url pr; reported once, nothing planned. Spec R5 amended. Tests test_a_cursor_naming_another_pr_is_unreadable, test_a_cursor_whose_pr_is_not_a_url_is_unreadable, test_loose_ledgers_reports_a_cursor_naming_another_pr_and_reads_nothing."}
  - {id: l-errors-r2, state: fixed, body: "A repo-level failure is reported once per repo and cause (key ledger\\0<repo>\\0<exc>); a PR's own failure names <owner>/<repo>#<n>. Spec R6 amended. Test test_a_repo_failure_is_reported_once_per_repo_and_a_pr_failure_names_its_repo."}
  - {id: l-errors-r3, state: out-of-scope, body: "The silent YAMLError skip in reading run cursors predates this change (moved verbatim from _run_text); it affects the batch route equally. Filed as a follow-up at deliver."}
  - {id: l-security-r1, state: fixed, body: "loose_prs skips cross_repo True or None (fail closed); a recorded pr must end in /<owner>/<repo>/pull/<n> (case-insensitive) or the read is refused; a non-string pr is refused. The no-pr leg is kept by decision no-pr-cursor-kept (95 of 144 cursors predate the pr field). Tests: fork/unknown-origin, another repo's same number, non-url pr."}
  - {id: l-tests-r1, state: fixed, body: "test_r2_a_loose_prs_run_gate_no_row_inherits_is_never_passed_by_walked_rows and test_r2_a_loose_prs_ops_promoted_devops_gate_is_never_passed_by_walked_rows drive the real loose_ledgers copy."}
  - {id: l-tests-r2, state: fixed, body: "LooseWorld now lists every gated merged PR, batch PRs included; test_a_landed_gated_batchs_pr_in_gated_prs_is_passed_once_by_its_batch and test_r8_a_closed_out_batchs_gated_pr_is_passed_once_through_the_loose_route."}
  - {id: l-tests-r3, state: fixed, body: "Renamed to test_no_run_rows_plan_nothing_and_write_nothing; the real cursor rule is driven by the loose_ledgers tests over a real clone."}
  - {id: l-tests-r4, state: fixed, body: "test_r4_a_loose_gate_pass_closes_the_prs_trackers and test_r4_labels_off_writes_no_gate_pass_for_a_loose_pr."}
  - {id: l-tests-r5, state: fixed, body: "Per-PR label is <owner>/<repo>#<n>; repo failures keyed by repo; covered by test_a_repo_failure_is_reported_once_per_repo_and_a_pr_failure_names_its_repo."}
