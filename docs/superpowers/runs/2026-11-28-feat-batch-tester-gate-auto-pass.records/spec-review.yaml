run: 2026-11-28-feat-batch-tester-gate-auto-pass
step: spec-review
outcome: done
journal:
  - kind: finding
    id: s1
    review_scope: in
    title: "Closed-out batches' gated PRs fall through both routes; the spec's 'keeps going through its batch' is false"
    body: "batch_drive.py:1484 skips a batch with a close-out before is_gated; _ledgers skips it too (triage_batch_cmd.py:4783); lanes.unlisted_gated_prs lists its PR outside its batch. loose_prs must take it."
  - kind: finding
    id: s2
    review_scope: in
    title: "Matching a run cursor on head_ref alone can pass a gate with another run's walked rows"
    body: "find_run (batch_drive.py:817) takes the first cursor whose branch matches; RunState.pr (run/model.py:397) records the PR url. Require it to name this PR when set; >1 cursor is unreadable."
  - kind: finding
    id: s3
    review_scope: in
    title: "Design shape and Design disagree on the LooseLedger shape and on how gate_actions can set Action.repo"
    body: "Shape returned 2-tuples, Design a 3-field LooseLedger; gate_actions had no repo argument."
  - kind: finding
    id: s4
    review_scope: in
    title: "pr_gates <-> batch_drive import cycle: GateLedger lives in batch_drive.py"
    body: "GatedRow/GateLedger at batch_drive.py:166/177; pr_gates must not import batch_drive, which calls it."
  - kind: finding
    id: s5
    review_scope: in
    title: "_gated_rows takes a Batch; the spec says loose PRs reuse it unchanged"
    body: "triage_batch_cmd.py:4798 derives the branch from recorded_branch(batch) and names batch.id in its warning."
  - kind: finding
    id: s6
    review_scope: in
    title: "R5 says 'reported once per pass'; the reused reporter reports once per drive"
    body: "_report_once (triage_batch_cmd.py:5503) keys self.warned, which persists across passes."
  - kind: finding
    id: s7
    review_scope: in
    title: "R2's guards have no acceptance row or named test for loose PRs"
    body: "batch_drive.py:1239-1244 guards; no row covered them on the new route."
  - kind: finding
    id: s8
    review_scope: in
    title: "The board hint stays false for gated PRs with no run cursor"
    body: "lanes.py:82-84 still says 'walk its gated rows' for a gated PR no fr run delivered; the spec left it implied."
  - kind: review
    id: spec-review
    title: "independent spec review (fr-spec-reviewer): 8 findings"
    body: "Verified every named file:line (lanes.py:33/68/83/91, batch_drive.py:136/177/222/240/254/1222/1410/1479/1533, batch_drive_types.py:105, ledger.py:60/104, triage_batch_cmd.py:4762/4798/6051/6162/6180, gate_cmd.py:303, test_tripwire_module_budget.py:33/40, model.py:834, run/model.py:397). Decisions q1-q4 honoured. Findings s1-s8."
  - kind: lens
    lens: security
    title: "a new automated path swaps gate labels on merged PRs no batch delivered, matched by branch and cursor (s2)"
  - kind: lens
    lens: tests
    title: "R2's no-pass guards, the cursor-mismatch refusal and the closed-out-batch case need explicit negative tests on the new route"
resolves:
  - {id: s1, state: fixed, body: "R1 now defines a loose PR as any gated PR not the merged PR of a batch without a close-out event; new R8 and row closed-out-batch-gated-pr-pass."}
  - {id: s2, state: fixed, body: "New R5: the cursor's recorded pr must name this PR when set; a cursor naming another PR is no rows; >1 cursor on the branch is unreadable. gated_rows_at gains pr; row 3 reworded to cover both."}
  - {id: s3, state: fixed, body: "One LooseLedger(repo, number, head_ref, ledger) in batch_drive_types.py; gate_actions(owner, repo, ledger, ...)."}
  - {id: s4, state: fixed, body: "GatedRow/GateLedger move to batch_drive_types.py, re-exported from batch_drive; pr_gates imports only batch_drive_types and fr.labels."}
  - {id: s5, state: fixed, body: "_gated_rows(repo, branch, label, pr=None); the batch caller passes recorded_branch(batch); counted in the budget paragraph."}
  - {id: s6, state: fixed, body: "R6 now says 'reports it once, as it does for a batch'; the Design says once per drive process per read and error."}
  - {id: s7, state: fixed, body: "New row loose-gated-pr-batch-guards (origin R2) with its own CI tests line in ## Verification."}
  - {id: s8, state: out-of-scope, body: "The hint on a gated PR no fr run delivered (gate-backfill adoptions, hand-labelled PRs) was wrong before this change and is not made worse by it; fixing it needs a new facts-level cursor signal. The spec now says so explicitly under 'What does not change', and deliver files it as a follow-up."}
acceptance:
