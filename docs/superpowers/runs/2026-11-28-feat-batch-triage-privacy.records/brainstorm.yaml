    capability: triage-intake
    acceptance: An admission pins the issue's untrusted comments with its title and body; an untrusted comment added or edited after admission, or a version-1 marker, leaves the issue ineligible until a maintainer re-admits it
    origin: [spec:2026-11-28-triage-privacy#R1, spec:2026-11-28-triage-privacy#R2, spec:2026-11-28-triage-privacy#R3, spec:2026-11-28-triage-privacy#R4, spec:2026-11-28-triage-privacy#R5]
    status: not-implemented
    verify: none
  - id: triage-pr-title-withheld
    capability: triage-intake
    acceptance: A PR whose author is not in the claim-trust set reaches facts, check and the pages with no title, in every PR list facts carry
    origin: [spec:2026-11-28-triage-privacy#R6, spec:2026-11-28-triage-privacy#R7]
    status: not-implemented
    verify: none
  - id: triage-state-scan-guard
    capability: triage-privacy
    acceptance: A push or export to a public state repo is refused when any carried file names a non-public repo of the scope, and a scope with nothing non-public reads no file for it
    origin: [spec:2026-11-28-triage-privacy#R8, spec:2026-11-28-triage-privacy#R9]
    status: not-implemented
    verify: none
  - id: triage-reopened-pr-uncarried
    capability: triage-collect
    acceptance: A judged PR that was closed and is reopened shows as open after the next collect, even when the repo's open-PR list is cut at its limit
    origin: [spec:2026-11-28-triage-privacy#R10]
    status: not-implemented
    verify: none
