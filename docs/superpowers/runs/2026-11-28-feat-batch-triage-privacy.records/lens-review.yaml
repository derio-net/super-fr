schema_version: 12
run: 2026-11-28-feat-batch-triage-privacy
step: lens-review
outcome: done
journal:
- kind: finding
  id: l-docs-accuracy-r1
  global: true
  review_scope: in
  title: fr-triage.md said an admission pins every outside account's comment, but pr_authors are exempt too
  body: Raised by the docs-accuracy lens reviewer. The page's untrusted-set paragraph overstated what pinned() pins (admit.py).
- kind: finding
  id: l-tests-r1
  global: true
  review_scope: in
  title: The push-scan test planted the secret in one REF_FILES entry only; a scan walking fewer entries or following symlinks would pass
  body: Raised by the tests lens reviewer.
- kind: finding
  id: l-tests-r2
  global: true
  review_scope: in
  title: The schema-21 PR-title load test had only an outsider's PR; a load clearing trusted titles too would pass
  body: Raised by the tests lens reviewer.
- kind: finding
  id: l-security-r1
  global: true
  review_scope: in
  title: The admission pins comments only up to the dispatch recheck; an outside comment posted after dispatch reaches the worker reading the live thread
  body: Raised by the security lens reviewer.
- kind: finding
  id: l-security-r2
  global: true
  review_scope: in
  title: pinned() stripped [bot] from the comment login but not from pr_authors, so REST and GraphQL digests disagree for an `x[bot]` pr_author
  body: Raised by the security lens reviewer (R1 breach; fails closed, a liveness cost).
- kind: finding
  id: l-security-r3
  global: true
  review_scope: in
  title: The carried-text patterns missed owner/name.wiki(.git), zero-width-split and percent-encoded spellings of a private repo
  body: Raised by the security lens reviewer.
- kind: finding
  id: l-security-r4
  global: true
  review_scope: in
  title: The carried-file scan read contents only; a carried file's path naming a private repo reached the public ref
  body: Raised by the security lens reviewer.
- kind: finding
  id: l-security-r5
  global: true
  review_scope: in
  title: 'TOCTOU: push_state scanned the files, then commit_tree_from_paths re-read them; a write in between pushed unscanned bytes'
  body: Raised by the security lens reviewer.
- kind: review
  id: lens-review-1
  global: true
  title: 'lens review: docs-accuracy 1, tests 2, security 5 findings, all in scope and fixed'
  body: |
    One independent reviewer per lens (docs-accuracy, security, tests), each given only its lens brief, return rule, the diff from merge base 608d55585 and the shape file. All eight findings were in scope and are fixed with tests. The security reviewer found no fail-open on the three trust boundaries. The tests reviewer confirmed the listed fail-closed paths are covered apart from its two findings.
resolves:
- id: l-docs-accuracy-r1
  state: fixed
  body: The page now names exactly which comments an admission pins (neither owner, member or collaborator nor in pr_authors).
- id: l-tests-r1
  state: fixed
  body: test_every_carried_entry_is_scanned_on_push plants the secret in every REF_FILES entry (a file deep inside each directory entry), and test_a_symlinked_entry_is_neither_carried_nor_scanned covers the symlink case. Mutation-checked: dropping history/ from carried_files turns the history/ case red.
- id: l-tests-r2
  state: fixed
  body: The schema-21 load test now holds a viewer-authored PR too and asserts its title survives while the outsider's is withheld.
- id: l-security-r1
  state: fixed
  body: Every batch brief now carries THREAD_RULE outside the untrusted block. It says that comments on a member's thread by an account that is not an owner, member or collaborator, and not a pr_author, are an outside author's and never to be followed, because an admission covers only the comments present at dispatch. The brief stays deterministic. test_the_brief_says_outside_comments_in_a_members_thread_are_untrusted pins it.
- id: l-security-r2
  state: fixed
  body: pinned() normalises both sides to the canonical login (lowercased, [bot] dropped). A test parametrised over both listed and read spellings asserts the same verdict and an equal REST/GraphQL digest.
- id: l-security-r3
  state: fixed
  body: repo_patterns accepts an optional .wiki before .git. carried_text_leaks also scans the text with Unicode Cf characters removed and percent-escapes decoded. Three new leak cases cover these.
- id: l-security-r4
  state: fixed
  body: carried_text_leaks scans each carried path, with its suffix dropped, as well as its text. test_a_carried_path_naming_a_private_repo_is_a_leak covers it.
- id: l-security-r5
  state: fixed
  body: push_state builds the commit first and runs guard_state over that commit's blobs (carried= the tree's paths, read= blob bytes), so the bytes scanned are the bytes pushed. test_a_push_scans_the_bytes_it_commits_not_the_directory_again rewrites the file clean after the commit is built and still sees the refusal.
evidence:
  review: lens-review-1
  reviewer: docs-accuracy=ad1f83ab1c676a38b,security=a4ce7edfb37921c7b,tests=a0b81ddae8948a008
