schema: 5
ranked_at: '2026-10-06'
tiers:
- n: 1
  title: Work can be lost
  description: A normal command can archive or replace unshipped work.
- n: 2
  title: Success can be false
  description: The tool reports trustworthy state while operating on or linking to the wrong thing.
- n: 3
  title: Supported work is blocked
  description: A documented command or integration fails for valid inputs or environments.
- n: 4
  title: Improve or investigate
  description: Friction, observability, compatibility, or work needing new live evidence.
