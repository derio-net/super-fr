  - super-fr#662
  rationale: 'Operator-flagged fix-now. #673: gate _skeleton_issues on two or more agentic phases, and
    rewrite the fr-plan/fr-goal prose (size phases to the change) in both mirrors (sync-opencode.py AND
    sync-hermes.py). #662 is one assertion in the same plan_ops tests. Plan this batch as ONE agentic
    phase. Until this fix lands, the installed gate refuses that, so the operator authorizes the override
    for this batch''s own plan: log fr journal add --scope spec --kind decision --id skeleton-override-<plan-slug>
    citing this batch before fr plan self-review.'
