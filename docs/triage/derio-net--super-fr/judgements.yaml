- id: tests-gate
  title: 'deliver tests= gate: accept a backgrounded suite, refuse an unobserved log, and keep resolve''s
    evidence honest'
  ids:
  - super-fr#594
  - super-fr#638
  - super-fr#587
  - super-fr#632
  rationale: 'One gate, one surface. #594 (canonical for #607 and #631, both duplicates: fold #607''s
    fix direction of ending the window at the background task-notification): the tests= window must accept
    a suite run in the background, which the long_commands rule mandates, and a log path held in a shell
    variable. #638: on OpenCode the window is None and any log passes; refuse or flag unobserved=tests
    in the PR body, add a tests-evidence parity row, and stop .records/*.log reaching main (record/apply.py
    deletes only the step record). #587 and #632: resolve must not accept a gated step as done without
    its declared emits, must record operator answers as the operator''s, and must persist unobserved for
    a cli-step gate. Files: commands/run_cmd.py, run/telemetry.py, harness/long_commands.py, parity.yaml,
    record/apply.py. Size phases to the change.'
  order: 1
  launch:
    runner: herdr
    harness: claude
    model: claude-sonnet-5
  events:
  - kind: dispatch
    at: '2026-09-26T10:05:20.482361Z'
    runner: herdr
    handle: w2:p2B
    branch: feat/batch-tests-gate
  - kind: cancel
    at: '2026-09-26T10:32:56.801075Z'
- id: runner-provisioning
  title: 'Installed fr is the fr the tests run: fr-herdr installed, runner packages in the devcontainer,
    fr''s commits work in the container'
  ids:
  - super-fr#650
  - super-fr#645
  - super-fr#626
  - super-fr#644
  rationale: 'Pattern: install.sh and the scaffold POST_CREATE provision a narrower env than the uv workspace
    the tests use, by hand-kept lists. #650: install.sh never installs fr-herdr, so triage batch dispatch
    --to herdr fails on every installed fr (seen live 09-26). #645: the container''s uv-tool fr cannot
    import fr_vk.bridge. #626: add safe.directory for the bind-mounted worktree in POST_CREATE (and -c
    safe.directory on fr''s own commits) so fr commits its records inside the devcontainer. #644: fr apply
    --to herdr must refuse a runner that does not take unit=phase before touching the forge. Derive the
    runner package list once and test both installers against it. Files: scripts/install.sh, isolation/scaffold.py,
    both regenerated profiles, fr apply''s runner check.'
  order: 1
  launch:
    runner: herdr
    harness: claude
    model: claude-sonnet-5
  events:
  - kind: dispatch
    at: '2026-09-26T10:05:41.480567Z'
    runner: herdr
    handle: w2:p2C
    branch: feat/batch-runner-provisioning
  - kind: cancel
    at: '2026-09-26T10:33:10.468106Z'
- id: release-scripts
  title: 'Release scripts: TOML rewrite anchored to [project], fragment rule covers plugins/*/skills,
    CI runs uv-managed python'
  ids:
  - super-fr#669
  - super-fr#671
  - super-fr#670
  rationale: 'The release bot now rewrites version surfaces on main unattended (4.24.0, #666). #669: _TOML_VERSION_RE
    in scripts/version_surfaces.py rewrites the first version = in any table; anchor it to [project].
    #671: check-change-fragment.py requires_bump matches only plugins/super-fr/{skills,rules}/ while AGENTS.md
    documents plugins/*/skills/**; widen the code to match the docs (an unreleased skill change is the
