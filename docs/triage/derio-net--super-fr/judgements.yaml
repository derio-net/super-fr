    tier: 2
    theme: isolation-scaffold
    cx: S
    verified: true
    detail: '`KNOWN_TOOL_FEATURES` (`isolation/scaffold.py:54`) has no `java`/`maven`. Unknown tools (`:160`) are **not wholly silent**, contrary to the issue: `_update_profiles_yaml` writes a `notes` entry into `fr-profiles.yaml` (`:273-277`). But the CLI prints only `scaffolded: <path>` (`commands/init_cmd.py:73`) and exits 0, so nobody sees the note during the interview.'
    note: '**Scaffold batch** with super-fr#576 and super-fr#569 (same `exec` failure path). Refuse an unknown `--tool` (exit non-zero, list the known set) rather than only adding java/maven. The note-in-a-file is the silent-success shape. This was the root cause of super-fr#575''s run.'
