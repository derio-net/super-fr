    note: 'No live failure shown yet: Docker Desktop on Apple silicon can run amd64 binaries under emulation. Promote to tier 3 if `glab --version` fails in a real arm64 container. **Scaffold batch** with super-fr#574 and super-fr#569: per-arch asset plus `checksums.txt`. Also verify live alongside super-fr#490 and super-fr#469 (self-hosted forge).'
