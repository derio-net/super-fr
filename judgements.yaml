  rationale: 'Wave 2. OpenCode''s long-command rule (fr/run/long_commands.py) tells the executor to detach
    a suite longer than 10 minutes: ''(cmd; echo "exit=$?") > log 2>&1 & echo $! > log.pid''. That call
    returns at once, so _opencode_wrote_since (fr/run/telemetry.py) sees a zero-length window and the
    deliver tests= gate refuses the log the detached suite really wrote. #693/#702 fixed Claude Code''s
    run_in_background by ending the window at the harness''s completion notice; OpenCode has no such event.
    Give the gate a completion signal it can verify (the pid file plus the exit= marker the rule already
    writes, or a later foreground command that waits on the pid), or change the rule to a form the gate
    can window. Must not accept a log nothing of the orchestrator''s wrote. Red-first test with the rule''s
