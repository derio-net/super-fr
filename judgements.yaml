    detail: Filed from this triage. `restart` is `docker restart` only (`isolation/local.py:430`); `up` calls `devcontainer up` without `--remove-existing-container` (`:392`). No verb recreates a container while keeping the worktree, so applying a fixed profile requires `down --force`.
