schema: 12
ranked_at: '2026-11-14'
tiers:
- n: 1
  title: Work can be lost
  description: A normal command can archive or replace unshipped work.
- n: 2
  title: Success can be false
  description: The tool reports trustworthy state while operating on or linking to the wrong thing.
- n: 3
  title: Supported work is blocked
  description: A documented command or integration fails for valid inputs or environments.
- n: 4
  title: Improve or investigate
  description: Friction, observability, compatibility, or work needing new live evidence.
issues:
  super-fr#1086:
    tier: 2
    theme: triage-board
    cx: L
    verified: true
    kind: defect
    severity: high
    detail: 'The board hides both moments a batch waits on the operator (a finished draft PR reads the same as one in progress; an agent stopped on a question reads idle/done) and shows **merge ready** on a `CONFLICTING` PR, because `kanban.py` columns derive from stage only. Proposal: two Needs-you columns read from the run cursor, mergeable-aware merge ready, driver relays conflicts and red CI to the session.'
    note: Operator priority 2026-10-07. Part D (relay red CI) is the same work as super-fr#1082, so they ship in one batch. Card-pill fix super-fr#1065 and skill column count super-fr#1066 ride along.
    distinct_from:
    - super-fr#1065
    - super-fr#1081
  super-fr#1085:
    tier: 4
    theme: triage-batches
    cx: S
    verified: true
    kind: defect
    severity: med
    detail: '`fr:in-progress` is added at dispatch (`triage_batch_cmd.py:988`) and removed only by `batch cancel` (`:747`); a merged batch''s members close with it still on, so **197 closed issues** say an agent is working on them and the forge label stops being a signal.'
    note: 'Remove it where the driver releases `fr:claimed` (same R6 rule), plus a `check` set for closed-but-labelled. One-off cleanup is the operator''s (unrun): `gh issue list -R derio-net/super-fr --state closed --label fr:in-progress --limit 500 --json number --jq ''.[].number'' | xargs -I{} gh issue edit {} -R derio-net/super-fr --remove-label fr:in-progress`.'
