    checks'
  ids:
  - super-fr#707
  - super-fr#706
  rationale: 'Wave 3 chore, one phase. #707 (security): every workflow under .github/workflows pins third-party
    actions by mutable tag; release.yml pushes to main and tags releases with a write token, and acceptance-report.yml
    and ci-budget.yml have issues: write. Pin every uses: to a full commit SHA with the tag in a trailing
    comment, add Dependabot for the github-actions ecosystem so pins do not rot, and add a tripwire test
    that fails on any third-party uses: not pinned by SHA. Resolve each SHA from the tag you replace,
    and verify it; do not guess. #706: since #703 the test job is a 4-way matrix (contexts test (1)..test
    (4)) and main requires no checks; add an aggregating job (e.g. test-all, needs: test) so a future
    required-check rule has one stable name. Do NOT change main''s ruleset; that is the operator''s call,
    and the release bot would need a bypass actor. The new job must be covered by ci-budget (see AGENTS.md:
    a new workflow file fails CI until watched or excluded). Other running batches own packages/ source
    files; do not edit them.'
