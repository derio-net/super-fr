  super-fr#575:
    tier: 1
    theme: isolation-lifecycle
    cx: M
    verified: true
    detail: '**Still live** on main. `fr run start` writes the cursor uncommitted (`fr/run/model.py` `write_text`; `commands/run_cmd.py` never commits). A plain `down` does refuse, but `_reap_hazard` (`isolation/local.py:650`) lists the cursor as one more dirty path under "Commit or stash them", never naming the run. `--force` skips the guard entirely (`local.py:845`), and afterwards `load_run_state` (`run/model.py:629`) says only `no run state at <path>`, which reads like a typo''d id.'
    note: '**Lifecycle batch** with super-fr#577 (no rebuild verb: the reason `down --force` was the only way out), super-fr#471 and super-fr#438. Do in tier 1 next to super-fr#544. Cheapest safe cut is the issue''s options 1+3: name the run in the hazard, and tell apart never-existed from torn-down in the error. Option 2 (copy the cursor to `~/.cache/fr/runs/`) is the real fix. Triggered by super-fr#574 in the same live run.'
  super-fr#574:
    tier: 2
    theme: isolation-scaffold
    cx: S
    verified: true
    detail: '`KNOWN_TOOL_FEATURES` (`isolation/scaffold.py:54`) has no `java`/`maven`. Unknown tools (`:160`) are **not wholly silent**, contrary to the issue: `_update_profiles_yaml` writes a `notes` entry into `fr-profiles.yaml` (`:273-277`). But the CLI prints only `scaffolded: <path>` (`commands/init_cmd.py:73`) and exits 0, so nobody sees the note during the interview.'
    note: '**Scaffold batch** with super-fr#576 and super-fr#569 (same `exec` failure path). Refuse an unknown `--tool` (exit non-zero, list the known set) rather than only adding java/maven. The note-in-a-file is the silent-success shape. This was the root cause of super-fr#575''s run.'
  super-fr#576:
    tier: 4
    theme: isolation-scaffold
    cx: S-M
    verified: true
    detail: '`HOST_CLI_POST_CREATE` (`isolation/scaffold.py:79-101`) hardcodes `glab_1.107.0_linux_amd64` and `tea-0.14.2-linux-amd64` with single-arch checksums; the source comment at `:79` already names the arm64 gap. GitHub is unaffected (`github-cli` feature).'
    note: 'No live failure shown yet: Docker Desktop on Apple silicon can run amd64 binaries under emulation. Promote to tier 3 if `glab --version` fails in a real arm64 container. **Scaffold batch** with super-fr#574 and super-fr#569: per-arch asset plus `checksums.txt`. Also verify live alongside super-fr#490 and super-fr#469 (self-hosted forge).'
  super-fr#550:
    tier: 2
    theme: isolation-enforcement
    cx: M
    verified: true
    detail: 'Both fail-open paths the issue names are **still live** on main: `EDIT_TOOLS` (`packages/fr-opencode-plugin/src/index.ts:26`) skips any other writing tool id (e.g. `apply_patch`), and `:51` allows any call without an absolute `filePath`/`path`. `parity.yaml` declares the gate `partial` and `fr harness parity --check` stays green. Sibling on the Claude side: `fr-isolation-required.sh:35` reads only `file_path`, so `NotebookEdit` (`notebook_path`) is also an empty target, which `fr_isolation_decide_edit` allows (`lib/fr-isolation-decision.sh:363`).'
    note: 'Do first in tier 2, ahead of the OpenCode dispatch batch: the enforcement boundary reports coverage it does not have. Root-cause the live tool id, then fail closed in fr-enabled repos. Fold in the `NotebookEdit` path fix; related to super-fr#510 (declared vs observed behaviour).'
