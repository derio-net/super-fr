    detail: 'Still live: `packages/fr/src/fr/git_policy/product.py:105` calls `_record_pushed_head` (:109). That commits the head to `HEADS` on local `fr` before `atomic_push`. `atomic_push` (`git_policy/push.py:400`) does not roll the record back when the push is refused, so a head that never reached the remote can be published by the next `fr` push. The reviewer found no false merged verdict today, so the harm is a wrong record, not a wrong answer.'
    note: 'Possible fix: roll back the `HEADS` commit under the fr worktree lock when the push fails.'
  super-fr#1421:
    tier: 4
    theme: docs-site
    cx: S
    severity: low
    kind: defect
    verified: true
    detail: 'Probably still live: `scripts/site/bar.css` has not changed since #1411. Its only phone rule is `@media (max-width:480px)` (:9), which shrinks the gap and font, and `flex-wrap:wrap` (:3) still lets the bar wrap at 320 px. Checking the left-edge offset between article pages and the landing needs a render.'
    note: Batch with super-fr#1442.
  super-fr#1402:
    tier: 3
    theme: opencode-plugin
    cx: M
    severity: med
    kind: defect
    verified: true
    detail: 'Still live: `scripts/install.sh` copies rules only to `~/.claude/rules/` (:773-781). It installs no OpenCode instructions (the word does not appear in `install.sh` or `deliver-opencode-plugin.sh`). Consumers on OpenCode therefore never load `fr-isolation-required`, `docs-currency` or the other shipped rules. Only this repo''s own `opencode.json` loads them.'
    note: The fix also needs an `install.sh` drift tripwire, like `test_install_copies_rules.py`.
  super-fr#1393:
    tier: 4
    theme: release
    cx: S
    severity: low
    kind: defect
    verified: true
    detail: 'Still live: `scripts/release.py:506` `_rcs_above` reads every RC tag, not `--merged HEAD`. `since = rcs[-1][1]` (:666) can then pick a tag on a sibling commit whose tree always differs, so every run cuts another RC. This needs a hand-pushed tag; the normal flow cannot produce it.'
    note: 'One-line fix: pass `--merged HEAD` to the RC tag listing. Batch with super-fr#1291 and super-fr#1238 (release).'
  super-fr#1378:
    tier: 4
    theme: ops-gate
    cx: XS
    severity: low
    kind: parked
    verified: true
    detail: This is an observation, not a defect. `packages/fr/src/fr/ops/gate.py:130` does force-push with `--force-with-lease`. The spec journal resolved sr1-23 as already-existing behaviour and made §2.3 say so. Nothing here can be acted on.
    note: '`gh issue close 1378 --repo derio-net/super-fr --reason "not planned"`'
  super-fr#1308:
    tier: 2
    theme: ci
    cx: M
    severity: med
    kind: feature
    verified: true
    detail: 'Still live: `packages/fr/src/fr/acceptance/scaffold.py` still emits `astral-sh/setup-uv@v5` and `uv tool install "git+...super-fr@main#..."` (:148, :232, :289, :339, :471). The `debt` job holds `contents/issues/pull-requests: write`, and its checkout keeps the default `persist-credentials` while it uses `FR_DEBT_TOKEN` (:465-468). The matrix and comment jobs now set `persist-credentials: false`. Each pin needs a `# vX.Y.Z` version comment, per the operator.'
    note: The issue asks for an assessment first. `fr@main` means a consumer's CI runs unreleased code.
  super-fr#1298:
    tier: 4
    theme: stale-fixed
    cx: XS
    severity: low
    kind: parked
    verified: true
    detail: 'Obsolete: the plan is archived (`docs/superpowers/implemented/plans/2026-11-01-gate-backfill/02.yaml:90`), and archived plans are frozen and never re-run. The wrong `-k gate-backfill` selector can no longer cost anything.'
    note: '`gh issue close 1298 --repo derio-net/super-fr --reason "not planned"`'
  super-fr#1291:
    tier: 3
    theme: release
    cx: S
    severity: low
    kind: defect
    verified: true
    detail: 'Still live: `.github/workflows/release.yml:78-80` sets `concurrency: group: release, cancel-in-progress: false`. GitHub keeps one pending run per group, so a push run that queues behind a pending `workflow_dispatch --version` run silently drops it.'
    note: 'Possible fix: a separate group for `workflow_dispatch`, or the run id in the group name. Batch with super-fr#1393 and super-fr#1238.'
  super-fr#1286:
    tier: 4
    theme: ci
    cx: M
    severity: low
    kind: feature
    verified: true
    detail: 'Still open: `fr/yamlio.py` exists, but there are still 123 bare `yaml.safe_load(` calls in `packages/*/src`. `fr.artifacts.structure._StrictLoader` (:46) is still based on the pure-Python `yaml.SafeLoader`. No tripwire exists.'
    note: Mechanical work. The tripwire is the part that keeps it fixed.
  super-fr#1275:
    tier: 3
    theme: ops-gate
    cx: S
    severity: med
    kind: defect
    verified: true
    detail: Both halves are still live. `packages/fr/src/fr/ops/gate.py:1004-1015` `stage_7` records "no tester step remains" and never removes or passes `gate:tester`. `packages/fr/src/fr/run/closeout.py:636` `devops_brief` checks only that `deliver` is done, so `fr pickup --run` prints the DevOps brief after stage 8. The stray label also holds `fr release status` (it waits on `gate:tester`), so the fix may be worth more than tier 4.
    note: 'Raised to tier 3 in triage 2026-11-14: the stray `gate:tester` label holds `fr release status`, so finals wait on a gate nobody owes. Also check why deliver applies `gate:tester` when the spec''s effective gates are only `devops`.'
  super-fr#1260:
    tier: 4
    theme: run-evidence-gates
    cx: L
    severity: med
    kind: feature
    verified: true
    detail: 'Not implemented: there is no "first real use" path anywhere under `packages/` or `plugins/`, and spec review has no Test Plan cost-line rule. This is a process and design feature (cost lines, a first-use walk status, a non-circularity check, timeboxed walks) that needs a spec.'
    note: Related to the release-gating cost in super-fr#1238.
  super-fr#1238:
    tier: 4
    theme: release
    cx: M
    severity: low
    kind: parked
    verified: true
    detail: '**Mostly fixed on main**: the release became a job graph (ci-speed §3.D). `release.yml` jobs now carry `timeout-minutes` (:98, :172, :213, :262, :290). The suite runs as sharded jobs instead of a captured `_run_staged_tests`. A race now supersedes the run and exits 0, with no `MAX_ATTEMPTS` retry loop. What remains is the merge-queue question, which needs a decision.'
    note: 'Release job graph, timeouts and supersede-on-race shipped; only the merge-queue question remains, which is super-fr#1287. Close (unrun): `gh issue close 1238 --repo derio-net/super-fr --reason completed --comment ''Remaining merge-queue decision tracked in #1287.''`'
  super-fr#1219:
    tier: 3
    theme: artifact-migration
    cx: S-M
    severity: med
    kind: defect
    verified: true
    detail: 'Still live: `packages/fr/src/fr/run/adopt.py:864` sets `resolved_branch = branch or current_branch(repo_root)`, and :921 derives the id with `derive_run_id(resolved_branch)`. Every plan adopted on one branch therefore gets the same `<date>-<branch>` id, and every plan after the first is refused at :929.'
    note: 'Same binding as #1191 item 4.'
  super-fr#1210:
    tier: 4
    theme: triage
    cx: S
    severity: low
    kind: defect
    verified: true
    detail: 'Still live: `scope_retire_command` (`packages/fr/src/fr/commands/triage_claim_cmd.py:369`) keeps only `i.state == "open"` issues (about :395). Closed issues still held by a retired scope keep their claim and are never settled.'
    note: Sibling journal finding p1-r8 (a closed issue with an own unreleased marker) may need the same fix.
  super-fr#1197:
    tier: 4
    theme: triage-board
    cx: XS
    severity: low
    kind: defect
    verified: true
    detail: 'Still live, and the line drifted (was :610, now :611): `packages/fr/src/fr/triage/render.py:611` has `conflict = merge in {"DIRTY", "BLOCKED"} ...`. `triage/mergeability.py`''s `conflicting()` already excludes `BLOCKED`, and its docstring says `render.py` was left alone. The fix is to call `conflicting()` there.'
    note: One-line fix.
  super-fr#1185:
    tier: 4
    theme: stale-fixed
    cx: XS
    severity: low
    kind: parked
    verified: true
    detail: '**Fixed on main**: the debt steps moved to a separate `debt` job with no `needs:` on the matrix job (`.github/workflows/acceptance-report.yml:67-71`; scaffold `DEBT_STEP_GITHUB` in `acceptance/scaffold.py`). A week with failing rows now still updates the issue.'
    note: '`gh issue close 1185 --repo derio-net/super-fr --reason completed`'
  super-fr#1179:
    tier: 4
    theme: triage-drive
    cx: S
    severity: low
    kind: defect
    verified: true
    detail: 'Still live: the `board --watch` loop (`packages/fr/src/fr/commands/triage_kanban_cmd.py:543-555`) checks `live_driver(lock_at)` only at the top of each iteration. A drive that starts mid-pass races one collect and render. The watch holds no lease and dispatches nothing, so the worst case is one duplicate collect.'
  super-fr#1162:
    tier: 4
    theme: triage-board
    cx: XS
    severity: low
    kind: parked
    verified: false
    detail: 'This records a test-harness finding, not a defect: headless Chrome''s `--window-size=390` lays out at a 500 px minimum. At a true 390 px the cards fit. There is no code to change.'
    note: '`gh issue close 1162 --repo derio-net/super-fr --reason "not planned"`'
  super-fr#1142:
    tier: 4
    theme: live-evidence
    cx: S
    severity: med
    kind: parked
    verified: true
    detail: 'Not reproducible from code: verify-merge (`isolation/local.py` `_pr_from` uses `client_for(cwd).pr_for_branch`, about :3128) and pickup (`run/closeout.py:491` uses `client_for(repo_root).pr_body`) both go through `hostclient.client_for`, which honours `forge.api: rest`. It needs the cloud-session capture the issue lists.'
    note: Wait for live evidence from a cloud walk.
  super-fr#1103:
    tier: 4
    theme: triage-drive
    cx: M
    severity: med
    kind: defect
    verified: true
    detail: 'Still live by design: `packages/fr/src/fr/triage/scope_config.py:80-85` hashes `name` and `host_id()` into `scope_id`. Two hosts driving one scope therefore use different `refs/heads/fr-triage/<scope-id>` refs, and the lease cannot arbitrate between them. `FR_HOST_ID` is the only workaround today, and nothing documents it for this case.'
    note: Needs a design decision (a shared scope id per state repo). Related to the cloud-triage lease work.
  super-fr#1250:
    tier: 4
    theme: ci
    cx: XS
    severity: low
    kind: defect
    verified: true
    detail: Dependabot bump of setup-uv and setup-python across 7 workflows; mergeable but `docs-check` and `ci-ok` fail.
    note: Needs the covering docs page re-stamped (`fr docs check`) or a rebase; then merge.
    delivery: partial
    delivery_note: Dependabot bump from setup-uv 10.3.0 to 10.3.3 plus setup-python, across 7 workflow files. It is mergeable, but `docs-check` and `ci-ok` fail. The likely cause is that `fr docs check` wants a page covering `.github/workflows/` touched or re-stamped. It needs a stamp bump or a rebase, not a code change.
  super-fr#1107:
    tier: 4
    theme: triage-board
    cx: M
    severity: low
    kind: parked
    verified: true
    detail: Draft backup PR for closed super-fr#1086; DIRTY, untouched since 2026-10-09, edits the retired `docs/acceptance/matrix.yaml`. Main already has the Needs-you lanes.
    note: 'Close as superseded (unrun): `gh pr close 1107 --repo derio-net/super-fr --comment ''Superseded: board Needs-you lanes shipped on main.''`'
    delivery: drift
    delivery_note: 'Draft backup PR (refs #1086, now CLOSED). It conflicts (DIRTY) and has been untouched since 2026-10-09. It edits the retired `docs/acceptance/matrix.yaml` and committed reports that `fr acceptance check` now refuses. Main''s board already has Needs-you lanes (`views.needs_you`, `mergeability.py`). It looks superseded: close it once anything worth keeping has been salvaged.'
  super-fr#1454:
    tier: 2
    theme: run-evidence-gates
    cx: S-M
    severity: high
    kind: defect
    verified: true
    detail: '`_verify_tests_log` (`commands/run_cmd.py:3170`) checks the log''s writer and time, never the code tree it ran on. A commit after the suite and before `deliver` leaves a clean tree, and the log is accepted as covering HEAD. Since #1453 this also reaches `local` stamps. **Still live** on main.'
    note: 'Bind the fresh log to `fr.run.code_tree` at write time; batch with super-fr#1456 (same deliver path).'
  super-fr#1456:
    tier: 2
    theme: run-evidence-gates
    cx: S
    severity: high
    kind: defect
    verified: true
    detail: '`_local_stamp_plan` (`commands/run_cmd.py:7340`) reads only `<fragment_slug_for_spec(spec)>.yaml` and returns `None` when it is not a file (:7358), so a fragment named before #1451 (`…-design.yaml`) is skipped and `deliver` passes with `local` rows unstamped, which is debt. **Still live** on main.'
    note: 'Stamp wherever the fold finds the row, or refuse naming it; the refusal should also say to fix the pending record. Batch with super-fr#1454.'
  super-fr#1458:
    tier: 4
    theme: live-evidence
    cx: XS
    severity: low
    kind: feature
    verified: true
    detail: 'Records the quiet and stealth live walks of spec `2026-11-04-repo-feature-settings`: its acceptance fragment and the archived spec journal only.'
    note: 'Merge when the 2 pending checks are green.'
    delivery: delivers
    delivery_note: 'Unanchored by the engine, but it is the walk record for spec `2026-11-04-repo-feature-settings` (the walks #1432 and #1380 wait on). Touches only that fragment and the archived journal; 24 checks pass, 2 pending.'
  super-fr#1457:
    tier: 4
    theme: closeout
    cx: XS
    severity: low
    kind: feature
    verified: true
    detail: 'Archive PR for `2026-11-14-acceptance-local-status`; merged as 581853312.'
    delivery: delivers
    delivery_note: 'Pure archive move of the #1453 run (plan, spec, journals, run cursor, usage). Merged.'
  super-fr#1463:
    tier: 3
    theme: test-flake
    cx: S
    severity: med
    kind: defect
    verified: true
    detail: 'Two lock tests in `tests/unit/test_hooks_worktree.py` (:463, :499) failed once each on 2026-11-14 and passed on rerun; the second blocked the v7.0.0 release until shard 3 was rerun (a red shard publishes nothing). Either the worktree lock races or the tests are timing-tight under `-n auto`.'
    note: 'Batch suite-health (wave 15). Decide race vs timing before marking flaky.'
  super-fr#1462:
    tier: 2
    theme: run-evidence-gates
    cx: S
    severity: high
    kind: defect
    verified: true
    detail: '`_feature_local_ids` (`commands/run_cmd.py:7352`) counts merged `local` rows too, and `stamp_local` (`acceptance/edit.py:456`) writes into the row block: an in-place edit of a merged row. The fold keeps the merged definition (row still unstamped) and `fr acceptance check` fails "edited in place", while deliver exits 0. From #1455, widened by #1460. **Still live** on main.'
    note: 'A merged row must be stamped by an amendment, never in place. Batch deliver-evidence.'
  super-fr#1461:
    tier: 4
    theme: artifact-migration
    cx: S-M
    severity: low
    kind: defect
    verified: true
    detail: 'Fragments created before #1451 are `<slug>-design.yaml` with `feature: <slug>-design`; writers since create `<slug>.yaml`, so a feature can end up with two fragments. Wanted: a `Repair` on `acceptance-fragment` renaming it, merging or refusing by row id.'
    note: 'Repair under the artifact-versioning rule. Batch acceptance-edits.'
  super-fr#1459:
    tier: 4
    theme: dispatch
    cx: L
    severity: med
    kind: feature
    verified: true
    detail: 'Decision recorded: drop VibeKanban (its only deployment retired 2026-11-13). Removes `packages/fr-vk/` (16 modules), ~78 test and fixture files (117 `.test_durations` entries), the `super-fr-dispatch` VK wording and the `fr-runner` skill''s VK operations.'
    note: 'Touches packaging, install.sh, tests and skill mirrors, so it conflicts with most batches: run it as its own wave. It also shrinks the suite, which helps #1428.'
patterns:
- title: Archive must not infer delivery
  ids:
  - super-fr#544
  - super-fr#526
  - super-fr#528
  body: Local completion, remote reachability, and archival side effects are separate facts. The safety fix comes before archive hygiene.
- title: OpenCode truth needs explicit identity
  ids:
  - super-fr#537
  - super-fr#538
  - super-fr#530
  - super-fr#509
  body: Ambient parent-harness state cannot identify an OpenCode child. Fix explicit identity first, then use it for model gates, claiming, and telemetry.
- title: Clean stale issue debt
  ids:
  - super-fr#491
  - super-fr#489
  - super-fr#463
  - super-fr#441
  body: Current main contains fixes or removes the claimed root cause; close after operator confirmation.
- title: Declared coverage is not observed enforcement
  ids:
  - super-fr#550
  - super-fr#510
  - super-fr#563
  - super-fr#561
  - super-fr#553
  - super-fr#568
  body: Parity checks prove a surface is registered, not that it blocks what it claims. super-fr#550 is the live instance; super-fr#510 is the general fix.
- title: Delivered, but the issue never closed
  ids:
  - super-fr#558
  - super-fr#555
  body: 'Work shipped (or is in an open PR) without a closing reference, so the issue sits open and re-enters every triage. Put `Closes #n` in the delivering PR.'
- title: No container lifecycle short of deleting the worktree
  ids:
  - super-fr#577
  - super-fr#575
  - super-fr#471
  - super-fr#438
  body: Rebuild, stop and re-up all route through `down`, so repairing an environment costs the worktree, the run cursor and the branch base. Separate container lifecycle from worktree lifecycle; super-fr#577 first.
- title: The record states a claim, not an observation
  ids:
  - super-fr#637
  - super-fr#636
  - super-fr#638
  - super-fr#632
  body: Tier binding recorded as the model that ran, an empty session list as a capture, a prose log as passing tests, a gate without its unobserved note. Record what fr observed, or that it could not.
- title: Installed fr is not the fr the tests run
  ids:
  - super-fr#650
  - super-fr#645
  - super-fr#626
  body: Tests use `uv run fr` over the whole workspace; install.sh and scaffold POST_CREATE provision a narrower env by hand-kept lists. Derive the runner list once and test both installers against it.
- title: One tests= gate, four issues
  ids:
  - super-fr#594
  - super-fr#607
  - super-fr#631
  - super-fr#638
  body: All are `_verify_tests_log`. Fix in one batch; close super-fr#607 and super-fr#631 as duplicates of super-fr#594.
- title: The input layer was the wrong place to fix it
  body: 'Waves 5 to 9 grew four derived gates, a reviewer agent and three journal tokens around the raw brief. Take 10 showed they still passed on OpenCode with a made-up reviewer. 5.0.0 removed the layer (#851): the spec is the contract, and a requirement the spec omits is a spec defect. #764, #773 to #778, #808, #810, #829, #830, #846 and #847 closed with it.'
  ids:
  - super-fr#851
  - super-fr#777
  - super-fr#778
  - super-fr#773
  - super-fr#810
- title: On OpenCode the record is still the orchestrator's word
  body: 'Reviewer identity, question answers and file reads are not observed by fr on OpenCode. #823 is re-scoped to the parts that never touched the input: session identity, cost, question answers and screenshot reads, salvaged from draft PR #837.'
  ids:
  - super-fr#823
  - super-fr#816
  - super-fr#809
  - super-fr#797
  - super-fr#848
- title: The herdr runner assumes a ready, interactive pane
  ids:
  - super-fr#956
  - super-fr#931
  - super-fr#878
  - super-fr#964
  body: 'Dispatch succeeds or fails on the state of one pane: a busy pane refuses, a pasted brief is not submitted, no herdr session means no dispatch, and a running session never reloads. The driver treats each dispatch as fire-and-forget.'
- title: A guard that is off reads the same as a guard that passed
  ids:
  - super-fr#1277
  - super-fr#1389
  - super-fr#1201
  - super-fr#1438
  body: An edit gate keyed on a directory that archive empties, an exit 0 after a failed close, a version parse that returns None and then counts as ok, a placement fallback with no degraded mark. Each fails open and silent.
- title: Spawned processes trust the caller's PATH or cwd
  ids:
  - super-fr#1429
  - super-fr#1230
  - super-fr#1375
  body: Hooks resolve `git`/`fr` through relative PATH entries, `python -c` runs without `-P`, plugin handlers run `fr` in the plugin's directory rather than the session's.
