    detail: '`_walk_train` (`batch_drive.py:885-891`) steps over a failing PR and warns once per head, nothing else: a PR turned red by the driver''s own `update from main` is never updated again once main is fixed, and the session is never told, so a wave can stall for hours (#1052, 2026-10-07).'
    note: 'Recovery path beside the #959 conflict hand-back: re-update once per new main sha when the red head is a driver merge, else hand back once per (PR, sha). Pairs with super-fr#1062, which removes most case-1 reds at the source.'
