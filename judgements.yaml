    verified: true
    detail: '**Fixed on main by #592** (`a5b83567`): `render.archive_gate` (`render.py:256`) takes a required `landed` keyword, and an undispatched agentic phase must be complete on `origin/<default>`. It stayed open because the PR body read "Closes #526 and #544", which closes only the first.'
