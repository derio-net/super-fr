[project]
name = "fr-conformance"
version = "4.15.0"
description = "Live conformance probes for harness gate verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["probes"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
