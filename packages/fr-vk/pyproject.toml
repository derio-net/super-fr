[project]
name = "fr-vk"
version = "2.6.1"
description = "super-fr VK adapter: VibeKanban runner (MCP client, card/workspace dispatch, bridge daemon)"
requires-python = ">=3.11"
dependencies = ["fr-dispatch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_vk"]

[tool.uv.sources]
fr-dispatch = { workspace = true }
