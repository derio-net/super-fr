[project]
name = "fr"
version = "2.6.1"
description = "super-fr base: superpowers wrapper + plan-as-folder + GH tracking (render → observe → diff → apply)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "rich>=13",
    "pydantic>=2",
    "packaging>=24",
]

[project.scripts]
# Transitional: the console script keeps the `vk` name until the Phase 3
# rebrand flips it to `fr`.
vk = "fr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr"]
