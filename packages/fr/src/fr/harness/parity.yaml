# The declared harness-parity matrix — 2026-09-18 harness-parity-matrix
# spec §3.A/§3.E. States are filled from the ACTUAL registration files, not
# from issue #436's table (already stale — it lists fr-acceptance-nag as
# absent on Hermes; .hermes/config.snippet.yaml registers it on
# pre_llm_call):
#   - claude-code: plugins/super-fr/hooks/hooks.json
#   - hermes:      .hermes/config.snippet.yaml
#   - opencode:    packages/fr-opencode-plugin/src/index.ts
#
# Every codex/copilot-cli cell is `unsupported` (spec non-goals — neither
# harness is supported yet). Every `partial`/`advisory` cell carries a
# `scope_note`. Phase 2 (`fr.harness.observe`/`check`) is what mechanically
# re-derives the claude-code/hermes/opencode cells from these files and
# fails CI on drift — this file is the DECLARATION, not self-checking yet.
schema: 1
surfaces:
  # --- hook rows: one per shipped plugins/super-fr/hooks/*.sh ---------------

  - id: fr-acceptance-nag
    kind: hook
    script: fr-acceptance-nag.sh
    summary: Nags the operator toward `fr acceptance status` at session start.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: enforced}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-isolation-guard
    kind: hook
    script: fr-isolation-guard.sh
    summary: Gates Bash commands to keep a live pipeline inside its own repo/worktree.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes:
        state: partial
        scope_note: >-
          git/gh MUTATIONS only — read-only and unknown commands pass, where the
          Claude hook denies every base-repo-cwd command. Also marker-based
          rather than pipeline-sentinel-based (Hermes has no Skill PostToolUse
          to write a sentinel).
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-isolation-required
    kind: hook
    script: fr-isolation-required.sh
    summary: Edits to tracked source must happen inside an fr-isolation workspace.
    harnesses:
      claude-code: {state: enforced}
      opencode:
        state: partial
        scope_note: >-
          All file-writing tools, including nested arguments and patch-body
          targets, are gated (index.test.ts); bash remains ungated (#436).
          Delivered to consumers by install.sh
          (scripts/deliver-opencode-plugin.sh, gh#563); the real opencode
          binary loads the delivered copy and that copy refuses a base-clone
          edit (tests/integration/test_opencode_plugin_live.py, CI). A
          model-driven session's tool call reaching the hook was shown live
          on 1.18.32 through the project-local copy (acceptance row
          opencode-isolation-enforcement); the delivered copy is the same
          module, and only its load path is new.
      hermes: {state: enforced}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-merged-pr-push-guard
    kind: hook
    script: fr-merged-pr-push-guard.sh
    summary: Refuses a push/commit against a branch whose PR already merged.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: enforced}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-phase-executor-guard
    kind: hook
    script: fr-phase-executor-guard.sh
    summary: Refuses dispatching fr-phase-executor into its own fresh worktree (super-fr#420).
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: absent}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-pipeline-sentinel
    kind: hook
    script: fr-pipeline-sentinel.sh
    summary: Marks a session as running an fr pipeline after a Skill invocation.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: absent}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-run-idle-guard
    kind: hook
    script: fr-run-idle-guard.sh
    summary: >-
      Keeps an fr run going: ending a turn on a run that is advanceable with
      nobody working on it hands back the next command (gh#518). The predicate
      is `fr run check --idle`; each adapter is as strong as its harness allows.
    harnesses:
      claude-code: {state: enforced}
      opencode:
        state: partial
        scope_note: >-
          CONTINUES rather than blocks — OpenCode cannot refuse a stop, so on
          `session.idle` the plugin sends the next command back into the
          session (`/session/{id}/prompt_async`). The event and the endpoint
          were verified in `@opencode-ai/sdk` type definitions on the authoring
          machine — versions 1.17.15, 1.1.27 and 1.0.23, all three carrying
          both. 1.18.31 is the opencode BINARY's version, not an SDK copy on
          disk here; this note said "the installed 1.18.31 SDK types" until
          phase 6 went looking. That a plugin-originated prompt on idle
          actually EXECUTES is NOT live-proven (the gh#494 standard) — a green
          `bun test` does not show it. Delivered to consumers by install.sh
          since gh#563, as the same module as the edit gate.
      hermes:
        state: absent
        scope_note: >-
          Hermes' stop events are reportedly observe-only (non-blocking). NOT
          verified — Hermes is not installed on the authoring machine. With no
          adapter, fr-goal's prose is all there is on Hermes.
      codex:
        state: unsupported
        scope_note: >-
          Reportedly has a block-capable stop hook; not installed on the
          authoring machine, unverified. A block-tier adapter is small once the
          harness is onboarded — it only has to call `fr run check --idle`.
      copilot-cli:
        state: unsupported
        scope_note: >-
          Reportedly blocks on `agentStop`. Copilot CLI 1.0.84's hooks system
          WAS verified installed on the authoring machine; `agentStop`'s
          blocking semantics were not. A block-tier adapter is small once the
          harness is onboarded.

  - id: fr-session-bind
    kind: hook
    script: fr-session-bind.sh
    summary: Binds a harness session id to the isolation workspace it is using, on `fr isolation up|exec` and on `fr run start`.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: absent}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-session-unbind
    kind: hook
    script: fr-session-unbind.sh
    summary: Releases a session's isolation-workspace binding at session end.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: absent}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-worktree-create
    kind: hook
    script: fr-worktree-create.sh
    summary: Routes a harness's own worktree-creation flow through fr-isolation.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: absent}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: fr-worktree-remove
    kind: hook
    script: fr-worktree-remove.sh
    summary: Cleans up fr-isolation state when a harness removes its worktree.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: absent}
      hermes: {state: absent}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  # --- interaction rows (spec §3.E) ------------------------------------------

  - id: operator-gate
    kind: interaction
    summary: A `gate operator` run step blocks until a human answers via the harness's own question tool. On claude-code `fr run resolve` VERIFIES it — an answered AskUserQuestion in the session transcript since the gate blocked, else refused (bypass only via `--no-questions --reason`, recorded); with no readable transcript `fr run advance` degrades loudly instead (debug journal 2026-09-21 C1).
    harnesses:
      claude-code: {state: enforced}
      opencode:
        state: advisory
        scope_note: "no operator-question tool exists on OpenCode — the gate cannot mechanically block; the measured failure of #436 instance 2"
      hermes:
        state: advisory
        scope_note: delegate_task has no operator-question primitive — the gate is prose only
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: out-of-scope-operator-guard
    kind: interaction
    summary: A finding resolved `out-of-scope` may be moved to `fixed` only by the operator — the `fixed` record must carry `answered_by=operator`, else `fr journal check` and the review-phase findings gate report an unauthorized fix (the rule is in the journal fold, so it holds on every harness and for both `fr journal resolve` and `fr journal add --resolves`). What differs is the CLAIM. On claude-code `--answered-by operator` is verified against the session transcript — no answered question since the out-of-scope record, and the write is refused; an unreadable transcript records it with a warning (spec 2026-09-24 §A).
    harnesses:
      claude-code: {state: enforced}
      opencode:
        state: advisory
        scope_note: "no operator-question tool fr can read on OpenCode — `--answered-by operator` is recorded as stated; the fold still refuses a fix that does not carry it"
      hermes:
        state: advisory
        scope_note: delegate_task has no operator-question primitive — `--answered-by operator` is recorded as stated; the fold still refuses a fix that does not carry it
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: phase-sequence
    kind: interaction
    summary: fr run enforces spec/plan before implementation (`implement` declares `needs [spec, plan]`).
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: enforced}
      hermes: {state: enforced}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: subagent-dispatch
    kind: interaction
    summary: The pipeline's ability to hand a phase to a subagent for isolated execution. Dispatch is the default wherever a harness has a primitive, at roughly 7x the cost of running the phase inline; fr-goal §5's dispatch clause is the one home for the measured figures and the rule. Every dispatch is now recorded fr-side per unit — `fr run advance` opens a DispatchRecord carrying the agent type, the resolved model and the harness that resolved it, `fr run claim --agent <id>` names the holder in that harness's own id vocabulary, `fr run resolve` closes it — so this row points at observable state in the run cursor (`fr run status`, `fr run check`) instead of resting entirely on the skill prose being followed, and a still-held unit is refused a second dispatch identically on every harness (gh-503, gh-499). WHEN that holder can be named is not identical — see `dispatch-holder-identity`.
    harnesses:
      claude-code: {state: enforced}
      opencode: {state: enforced}
      hermes: {state: enforced}
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: dispatch-holder-identity
    kind: interaction
    summary: WHEN the agent holding a dispatched unit becomes nameable (`fr run claim --agent <id>`). Separate from subagent-dispatch on purpose — dispatch is enforced wherever a primitive exists, but the moment its holder can be named depends on whether the harness's dispatch call returns at once or blocks. What does NOT vary — fr opens the record at `fr run advance` with the harness it detected and the tier's model, and that open record refuses a second dispatch whether or not anyone has claimed it.
    harnesses:
      claude-code:
        state: advisory
        scope_note: >-
          the holder is NAMEABLE in flight — the Agent call returns a task id at
          once and the child runs in the background, observed live 2026-09-21 —
          but nothing blocks an unclaimed dispatch: claiming is skill prose, and
          `fr run check` reports an unclaimed record as debt, never as a failure
      opencode:
        state: partial
        scope_note: >-
          the task tool BLOCKS and returns the child session id only with the
          result, so the holder is claimed when the call returns and is not
          nameable while the unit is held — live 2026-09-21, status from inside
          the child read "HELD BY an unclaimed agent (opencode, <model>)". The
          unclaimed record still refuses a second dispatch, and harness and
          model are recorded at dispatch. A plugin-side claim on the child's
          first tool call would close this; not built.
      hermes:
        state: partial
        scope_note: >-
          the record and the refusal are the same harness-neutral CLI, but when
          `delegate_task` yields its handle has not been observed live, so
          nothing here claims the holder is nameable in flight
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: status-line
    kind: interaction
    summary: A harness status line surfaces fr session/branch/isolation state via fr-statusline-segment.sh.
    harnesses:
      claude-code: {state: enforced}
      opencode:
        state: partial
        scope_note: fr-statusline-segment.sh is harness-neutral (stdin or --cwd) and callable today; no renderer/registration ships for OpenCode
      hermes:
        state: partial
        scope_note: same segment script callable; no renderer/registration ships for Hermes
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: main-session-cost
    kind: interaction
    summary: The main session's own token usage per top-level run step (spec 2026-09-24-fr-goal-scope-proportion-cost §D, gh#593 option 0). `_complete_step` writes `StepRecord.main_session` on every `done` path from the harness's own session store — never zero when unobservable, never a partial sum across sessions — and `fr run cost` prints it beside the subagent total.
    harnesses:
      claude-code: {state: enforced}
      opencode:
        state: partial
        scope_note: >-
          not live-proven — read-only from the SQLite session store; sessions
          come from `fr isolation attach --harness opencode` bindings, else the
          unique top-level session in the workspace or base clone with
          messages in the window (two or more records nothing). Dispatched
          units are still unmeasured (V1 estimates).
      hermes:
        state: absent
        scope_note: no reader — Hermes' session store is not read, so nothing is recorded
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}
