  - id: usage-capture
    kind: interaction
    summary: A run's cost is persisted in `docs/superpowers/usage/<run-id>.yaml` (spec 2026-09-25-lean-cost-aware-process §5.B) — one capture per host, taken at `fr run resolve --step deliver`, at the first resolve on a host with no capture yet, and at `fr archive`, each committed with the cursor and never failing its step. Read on any checkout by `fr run cost`. Captures read the harness's own session store, so `fr run` / `fr usage` execute on the harness host (§5.B.6); the per-mode cells below say where that is. Replaces `main-session-cost` (run 7 removed `StepRecord.main_session`).
    harnesses:
      claude-code:
        state: partial
        scope_note: >-
          implemented and unit-tested over captured transcripts; the live
          walk that verifies it is owed (phase 4 of the plan)
        modes:
          host-worktree: {state: partial, scope_note: "harness and fr share the host; live walk owed (phase 4)"}
          devcontainer:
            state: partial
            scope_note: >-
              fr run executes on the host, where the transcripts are — refused
              inside the container (bridge + in-process check); live walk owed
          external:
            state: partial
            scope_note: >-
              harness and fr both run in the container; an ephemeral pod loses
              its transcripts at teardown, so capture-before-teardown (deliver,
              a new host's first resolve, archive) is what keeps its figures
      opencode:
        state: partial
        scope_note: >-
          implemented; $0 for free models, estimated for Copilot-routed ones;
          the live walk that verifies it is owed (phase 4). The session fr
          records for a run is now the top-level run session
          (`run-session-identity`), so the usage window follows the same
          session the gates read
        modes:
          host-worktree: {state: partial, scope_note: "read from the host's SQLite session store; live walk owed"}
          devcontainer:
            state: partial
            scope_note: >-
              fr run executes on the host, where opencode.db is — refused
              inside the container; live walk owed
          external:
            state: partial
            scope_note: >-
              the store is inside the pod and lost at teardown; capture-before-
              teardown (deliver, a new host's first resolve, archive) keeps it
      hermes:
        state: partial
        scope_note: >-
          implemented, not live-verified (pod-only, no walk scheduled);
          per-message attribution is coarse (one token count per message);
          ACP sessions report zero tokens (hermes-agent#6775)
        modes:
          host-worktree: {state: partial, scope_note: "implemented, not live-verified"}
          devcontainer: {state: partial, scope_note: "implemented, not live-verified; fr run on the host"}
          external:
            state: partial
            scope_note: >-
              the usual Hermes shape (a prepared pod); state.db is lost at
              teardown, so capture-before-teardown is what keeps its figures
      codex: {state: unsupported}
      copilot-cli: {state: unsupported}

  - id: model-binding-probe
    kind: interaction
    summary: A tier binding is probed live with the provider (`fr models set`/`check`, `fr run start`, and before every tiered dispatch in `fr run advance`); a dead one is replaced by fixed rules — asked of the operator on a terminal or at fr-goal's question gate, decided and journalled by fr mid-run within R4's autonomous bound, refused otherwise (spec 2026-10-06-model-binding-churn).
    harnesses:
      claude-code:
        state: absent
        scope_note: >-
          not probed: `claude -p` is forbidden in package source
          (no-claude-p-batch), and the Agent tool takes family aliases, so
          bindings report `unprobed` and are never substituted
      opencode:
        state: partial
        scope_note: >-
          verified against a stub `opencode` and a scripted prober only
