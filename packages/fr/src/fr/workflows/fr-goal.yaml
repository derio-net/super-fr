# The shipped `fr-goal` shape — spec §4.A, fleshed out in Phase 11 of
# docs/superpowers/plans/2026-08-14-workflow-shapes-and-workitem-dispatch.
# `fr-goal` (or `/fr-goal`/`/goal`) with no shape argument resolves this
# manifest; `plugins/super-fr/skills/fr-goal/SKILL.md` narrates it step by
# step and drives the cursor via `fr run start/advance/resolve`. A repo may
# override this wholesale with `docs/superpowers/workflows/fr-goal.yaml`.
#
# Two divergences from spec §4.A's illustration, reconciled against what
# the code actually does:
#
# 1. `deliver` is `kind: agent`, not `kind: cli` running a nonexistent
#    `fr run deliver` command — no such subcommand exists (`fr run` is
#    start/adopt/status/advance/resolve/check/cost). Composing the PR body from
#    the journal is judgment work the orchestrating agent does itself (a bare
#    `agent` step, no subagent dispatch). Marking it ready is not: the review
#    ok and the ready transition are the operator's (#814).
# 2. There is NO `isolate` step (spec §4.B, review fix r2-f5). A run is
#    born in its workspace: `fr run start` ensures isolation itself and
#    writes the run file inside the worktree. As a step it moved the
#    ground out from under the run — the run file stayed in the base
#    clone while every later step ran in the worktree.
#
# `implement` is a GROUPED `for_each`: `implement-phase` + `review-phase`
# run inside every phase iteration, so review-and-fix is enforced per phase
# by the cursor, not by prose. There is deliberately NO trailing single
# `review` step — it is what the loop replaces. Runs started against the
# flat shape hit manifest drift (by design) and start a new run.
#
# `journal-check` (spec §C, decision D3) is the ONLY machine check that a
# completed phase was reviewed — not a second one, and not a backstop. Read
# the loop above literally: `review-phase` dispatches a review, but it is a
# `kind: agent` step, so it completes on `fr run resolve --state done` and
# leaves no artifact by itself. An agent that skipped the review entirely
# resolves it identically to one that did the work. That is #430 exactly.
# The `kind=review` journal entry is written by the skill prose (SKILL.md
# §6), and this step is what makes forgetting it FAIL rather than pass
# silently. It is a `cli` step rather than a line in `deliver`'s prose for
# the same reason the prose alone was never enough: an obligation enforced
# by an instruction gets absorbed under load. It sits strictly between
# `implement` and `deliver` — after `deliver` the PR already exists, so
# checking there would be too late to matter. Adding this step drifts every
# run started against the pre-existing shape (`_check_step_drift`, by design
# — see run_cmd.py). Recovering a stranded run is NOT the one-liner it
# looks like, verified on this repo's own run: `fr run adopt` REFUSES while
# a run file exists for the same shape+branch, which is precisely the
# stranded case. Recover with `fr run reshape <run-id>` (it inserts the new
# step pending and keeps every unit), or, when reshape refuses, with
# `fr run adopt <plan-dir> --supersede`: it replaces the run, carrying gate
# provenance, units and evidence forward, and marks a phase whose plan
# journal already holds its review `reviewer=historical` instead of
# re-dispatching it. Never move the run file aside by hand.
workflow: fr-goal
schema: 1
description: TDD feature delivery, goal to reviewed PR.

unit: run
requires: [git, tests, scm]
verification: candidate

steps:
  - id: brainstorm
    kind: agent
    skill: super-fr:fr-brainstorming
    gate: operator
    emits: [spec, journal:spec, acceptance]

  - id: spec-review
    kind: agent
    # gh#593 option 2 (2026-09-24 spec §E): the spec is reviewed by a
    # dispatched, read-only `fr-spec-reviewer` — a context separate from the
    # orchestrator that wrote it — not by the orchestrator re-reading its own
    # work. The evidence gate verifies it against the SPEC journal (this step
    # emits `journal:spec`): `review` is a `kind=review` spec entry created
    # after the step opened; `reviewer` is the reviewer's dispatch id (on
    # Claude Code, one this session dispatched after the step opened — the
    # orchestrator has no agent id, so it can never pass); `findings` is
    # DERIVED — refused while any spec finding is effectively open, or was
    # fixed out of `out-of-scope` without the operator.
    #
    # The spec is the contract (2026-09-29 spec-is-the-contract): the review
    # checks it against the operator's recorded decisions, the codebase, and
    # itself — never against the raw input, which only brainstorm reads.
    # `acceptance` is emitted because a fix to the spec may add or reword the
    # rows citing it, and they ride the same record.
    agent: super-fr:fr-spec-reviewer
    tier: hard
    needs: [spec]
    emits: [journal:spec, acceptance]
    evidence: [review, reviewer, findings]

  - id: plan
    kind: agent
    skill: super-fr:fr-plan
    needs: [spec]
    emits: [plan, journal:plan]

  - id: plan-review
    kind: cli
    run: fr plan self-review {{ artifacts.plan }}

  - id: implement
    kind: agent
    agent: super-fr:fr-phase-executor
    needs: [spec, plan]
    for_each: phase
    tier: from_phase
    emits: [journal:plan]
    steps:
      - id: implement-phase
        kind: agent
        agent: super-fr:fr-phase-executor
        needs: [spec, plan]
        tier: from_phase
        emits: [journal:plan, plan:ticks]
        # `visual` (spec 2026-09-28-ui-visual-evidence §C) is DERIVED from the
        # record's `visual:` section: for each `visual` acceptance row the phase
        # header links (no `verify: live`), shots covering every named
        # state/interaction, each opened — and any named capture script re-run —
        # in the holder's transcript (the orchestrator's when inline) since the
        # unit opened. No such row: `visual=none`.
        evidence: [visual]
      - id: review-phase
        kind: agent
        # Two disciplines, in order — a review is REQUESTED and then RECEIVED.
        # Naming only the first left what happens to a review's findings
        # (verify each; fix it with a test or refute it with reasoning; never
        # drop it) in one parenthesis of skill prose, i.e. at the implementing
        # agent's discretion. A list on this step rather than a third member,
        # because drift compares member IDS: a new one strands every cursor in
        # flight, which is what adding `journal-check` did.
        skill:
          - superpowers:requesting-code-review
          - superpowers:receiving-code-review
        needs: [spec, plan, journal:plan]
        emits: [journal:plan]
        # The evidence gate (unit-record-unification spec §4.E), and the
        # structural half of #430. This step is `kind: agent` and leaves no
        # artifact of its own, so before this an agent that SKIPPED the review
        # resolved it identically to one that did the work. Now `fr run
        # resolve --state done` refuses without
        # `--evidence review=<journal-entry-id>` and verifies that id against
        # the plan journal by the same rule `journal-check` below applies — a
        # `kind=review` entry carrying this phase's `phase=N`. Two gates, one
        # rule, one verifier: `journal-check` remains the gate for a plan with
        # no cursor, this one for a plan that has one.
        #
        # `findings` is the enforceable half of the second skill, and it is
        # DERIVED — never passed. Naming a skill cannot prove the skill was
        # used; what fr can observe is its outcome. So `--state done` is also
        # refused while any finding filed against this phase is effectively
        # open in the plan journal (the fold `fr journal check` uses), and fr
        # records the ids it saw closed, or `none`. It is `journal-check`'s own
        # rule, moved from once-before-`deliver` to the moment a finding is
        # cheapest to act on. A finding that belongs to a later phase is filed
        # against THAT phase and gates its review instead.
        #
        # `reviewer` (2026-09-21 debug journal C6): the review names the
        # dispatched reviewer SUBAGENT by the id its dispatch returned. fr refuses
        # the phase's own implementer and, where the transcript is readable, an id
        # this session never dispatched after the review opened. The #497 run's
        # review was an entry the orchestrator typed about work nobody reviewed.
        #
        # The reviewer tags every finding (2026-09-24 spec §A, gh#597): in
        # scope — this change is wrong, incomplete, or worse than it needs to be
        # (an asymptotically worse algorithm than necessary is in scope); out of
        # scope — true, but not caused by this change. The orchestrator journals
        # the tag as `--review-scope`, fixes every in-scope finding, and files
        # the rest with `fr journal resolve --state out-of-scope`.
        # `visual` (spec 2026-09-28-ui-visual-evidence §C): the REVIEWER's own
        # fresh screenshots, opened in the reviewer's transcript — never the
        # executor's.
        #
        # `review_findings` (spec 2026-10-02-opencode-observe-2 §E): this
        # step's brief carries the exact text the reviewer must be given, with
        # the phase's N filled in — fr-goal §6 puts it into the reviewer's
        # prompt verbatim. The reviewer ends its return with a fenced
        # `review-findings` block (`p<N>-r<k> | in|out | summary`, or `none`;
        # `p<N>a-r<k>` ... with several reviewers). The fence is not the
        # DERIVED `findings` evidence above. Wherever fr can read the return,
        # `done` is refused while a named reviewer's block is missing or
        # malformed, an id repeats across reviewers, or a returned id is not a
        # plan-journal finding against phase N or later (where the convention above files it) with the reviewer's scope tag; where it
        # cannot, the check is skipped as `unobserved=reviewer-return`.
        evidence: [review, reviewer, findings, visual]

  - id: journal-check
    kind: cli
    # `journal:plan` as well as `plan`: the gate reads the plan for which
    # phases are complete AND the plan journal for which were reviewed.
    # Declaring only `plan` understated it (review r-p3-f6). Reachability is
    # unaffected — `journal:*` is not a repo-tracked artifact — so this is
    # about the manifest telling the truth about its own inputs.
    needs: [plan, journal:plan]
    run: fr journal check --scope plan --plan-dir {{ artifacts.plan }} --require-reviews

  - id: lens-review
    kind: agent
    # Review lenses (spec 2026-11-12-review-lenses §3.C, R8-R11): one review of
    # the feature's WHOLE diff per lens in its set — every lens an agent added
    # (`kind: lens` journal entries, `fr lenses status`) plus every lens a path
    # rule in `.fr/lenses.yaml` requires for a file the feature changed. Run
    # once, here, after every phase review's check: a phase reviewer is given
    # no lens text, so concrete lenses never narrow its attention.
    #
    # The brief's `lens_review` key lists the set, each lens with its
    # instruction text, why it is there and the exact return rule. The
    # orchestrator dispatches one reviewer per lens, each given only its own
    # lens; each ends its return with a fenced `review-lens` block (its lens and
    # the changed files it examined) and a `review-findings` block with ids
    # `l-<lens>-r<k>`. An EMPTY set dispatches nobody: resolve at once with a
    # record that names no review and no reviewer.
    #
    # Evidence, verified against the plan journal with no phase (the feature):
    # `review` a global `kind=review` entry created after the step opened;
    # `reviewer` one `<lens>=<dispatch-id>` per lens, comma-separated, each an
    # agent this session dispatched after the step opened (neither owed when
    # the set is empty); `findings` DERIVED, refused while a lens finding is
    # open; `lenses` DERIVED, never passed — per lens the files examined and
    # the findings raised (`security=2:l-security-r1;tests=5:none`), `none`
    # for an empty set. The set is computed again at resolve, so a lens added
    # during the review is owed before the step closes. Where fr can read a
    # return it refuses one with no block for its lens, a file the feature did
    # not change, or a finding missing from the plan journal or tagged there
    # with another scope; where it cannot, those checks are noted
    # `unobserved=reviewer-return`.
    skill:
      - superpowers:requesting-code-review
      - superpowers:receiving-code-review
    tier: standard
    # Not `journal:plan` in `needs`, though the step reads the plan journal's
    # lens entries: `review-phase` also needs and emits it, so the checker sees
    # `lens-review -> review-phase -> lens-review` as a cycle. `spec-review` is
    # the precedent: it emits `journal:spec` and needs only `[spec]`.
    needs: [spec, plan]
    emits: [journal:plan]
    evidence: [lenses, review, reviewer, findings]

  - id: deliver
    kind: agent
    skill: superpowers:verification-before-completion
    needs: [spec, plan]
    emits: [pr, acceptance]
    # `tests` (debug journal C5): the log of the full suite the ORCHESTRATOR ran
    # during delivery — `--evidence tests=<log>`, hashed onto the cursor. On the
    # #497 run `deliver` resolved in 28s on a PR url and the executor's word.
    # `proportionality` (2026-09-24 spec §C) is DERIVED, never passed: resolve
    # runs `fr plan proportionality` and stores `<merge-base>:<sha256>` of the
    # report the orchestrator pastes into the PR body. Report-first — it gates
    # nothing but its own witness.
    # `docs` (2026-11-11-docs-currency R9) is DERIVED too: resolve runs the
    # `fr docs check` gate against proportionality's base and refuses while a
    # page covering a changed path is unchanged; `none` with no `.fr/docs.yaml`.
    # `visual` (spec 2026-09-28-ui-visual-evidence §C): for the rows citing the
    # run's spec, screenshots captured and opened by the orchestrator itself
    # during delivery, on the delivered branch.
    # `walk` (2026-10-06-verification-strategies §C): the log `fr verification walk`
    # wrote on this code tree; owed only when the spec asks for a pre-merge walk.
    evidence: [tests, proportionality, docs, visual, walk]
