# Workspace root — the three packages live under packages/.
# Lockstep versioning: scripts/bump-version.py writes every member +
# both plugin manifests; the version-sync CI job checks the set.
[project]
name = "super-fr-workspace"
version = "2.6.1"
description = "super-fr workspace root (fr / fr-dispatch / fr-vk)"
requires-python = ">=3.11"
dependencies = ["fr"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fr = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=fr --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
omit = ["packages/fr/src/fr/__main__.py"]

[tool.mypy]
strict = true
python_version = "3.11"
