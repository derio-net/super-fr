[project]
name = "vk"
version = "0.3.0"
description = "VK toolchain: phase-structured plans, GitHub Issue dispatch, progress tracking"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "rich>=13",
]

[project.scripts]
vk = "vk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vk"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=vk --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["src/vk/__main__.py"]

[tool.mypy]
strict = true
python_version = "3.11"
