<svg viewBox="0 0 960 330" role="img" aria-labelledby="run-pipeline--t">
<title id="run-pipeline--t">The run pipeline, in nine steps: your goal; the run moves into an isolated worktree; one question round with you; a spec and a plan, both reviewed; build and review one phase at a time; one pull request, never self-merged; the manual phase, which is yours; the merge, which is yours; then the Test Plan, which is yours. The steps you act on are drawn with a dashed outline.</title>
<defs>
<marker id="run-pipeline--arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ink"/></marker>
