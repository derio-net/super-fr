<svg viewBox="0 0 960 440" role="img" aria-labelledby="wave-of-batches--t">
<title id="wave-of-batches--t">A wave of batches: a ranked backlog is grouped into batches, batches are placed in waves, and a batch can wait for another with after. Each batch ends in one pull request, and at most four batches are in flight at once. One driver pass merges what is ready, closes out what merged and dispatches the next batches.</title>
<defs>
<marker id="wave-of-batches--arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="fig-ink"/></marker>
</defs>
<text x="20" y="26" class="fig-muted fig-small">RANKED BACKLOG</text>
<rect x="20" y="40" width="150" height="30" rx="6" class="fig-panel"/>
<text x="32" y="60" class="fig-ink fig-small">1 · issue</text>
<rect x="20" y="78" width="150" height="30" rx="6" class="fig-panel"/>
<text x="32" y="98" class="fig-ink fig-small">2 · issue</text>
<rect x="20" y="116" width="150" height="30" rx="6" class="fig-panel"/>
<text x="32" y="136" class="fig-ink fig-small">3 · issue</text>
<rect x="20" y="154" width="150" height="30" rx="6" class="fig-panel"/>
<text x="32" y="174" class="fig-ink fig-small">4 · issue</text>
<rect x="20" y="192" width="150" height="30" rx="6" class="fig-panel"/>
<text x="32" y="212" class="fig-ink fig-small">5 · issue</text>
<path d="M170 125 H225" class="fig-line" marker-end="url(#wave-of-batches--arrow)"/>
<text x="200" y="112" text-anchor="middle" class="fig-muted fig-small">group</text>
<text x="240" y="26" class="fig-muted fig-small">WAVE 1</text>
<rect x="230" y="36" width="320" height="196" rx="10" class="fig-panel"/>
<rect x="250" y="56" width="280" height="72" rx="8" class="fig-panel"/>
<text x="266" y="84" class="fig-ink fig-text">batch A</text>
<text x="266" y="108" class="fig-muted fig-small">issues 1, 2 → one pull request</text>
<rect x="250" y="140" width="280" height="72" rx="8" class="fig-panel"/>
<text x="266" y="168" class="fig-ink fig-text">batch B</text>
<text x="266" y="192" class="fig-muted fig-small">issues 3, 4 → one pull request</text>
<text x="610" y="26" class="fig-muted fig-small">WAVE 2</text>
<rect x="600" y="36" width="340" height="196" rx="10" class="fig-panel"/>
<rect x="620" y="56" width="300" height="72" rx="8" class="fig-panel"/>
<text x="636" y="84" class="fig-ink fig-text">batch C</text>
<text x="636" y="108" class="fig-accent fig-small">after: A</text>
<text x="710" y="108" class="fig-muted fig-small">→ one pull request</text>
<rect x="620" y="140" width="300" height="72" rx="8" class="fig-panel"/>
<text x="636" y="168" class="fig-ink fig-text">batch D</text>
<text x="636" y="192" class="fig-accent fig-small">after: B</text>
<text x="710" y="192" class="fig-muted fig-small">→ one pull request</text>
<path d="M530 92 H620" class="fig-accent-line fig-flow" marker-end="url(#wave-of-batches--arrow)"/>
<path d="M530 176 H620" class="fig-accent-line fig-flow" marker-end="url(#wave-of-batches--arrow)"/>
<text x="575" y="258" text-anchor="middle" class="fig-muted fig-small">only a merged batch meets an after</text>
<text x="20" y="258" class="fig-muted fig-small">in flight: at most 4 batches</text>
<text x="20" y="316" class="fig-muted fig-small">ONE DRIVER PASS, REPEATED UNTIL NOTHING IS LEFT</text>
<rect x="20" y="332" width="200" height="64" rx="8" class="fig-panel"/>
<text x="34" y="359" class="fig-ink fig-text">merge what is ready</text>
<text x="34" y="381" class="fig-muted fig-small">green and approved</text>
<path d="M220 364 H280" class="fig-line" marker-end="url(#wave-of-batches--arrow)"/>
<rect x="260" y="332" width="200" height="64" rx="8" class="fig-panel"/>
<text x="274" y="359" class="fig-ink fig-text">close out merged</text>
<text x="274" y="381" class="fig-muted fig-small">post_merge, archive</text>
<path d="M460 364 H520" class="fig-line" marker-end="url(#wave-of-batches--arrow)"/>
<rect x="500" y="332" width="200" height="64" rx="8" class="fig-panel"/>
<text x="514" y="359" class="fig-ink fig-text">dispatch the next</text>
<text x="514" y="381" class="fig-muted fig-small">by wave, under the cap</text>
<path d="M700 364 H760" class="fig-line" marker-end="url(#wave-of-batches--arrow)"/>
<rect x="740" y="332" width="200" height="64" rx="8" class="fig-panel"/>
<text x="754" y="359" class="fig-ink fig-text">sleep, then repeat</text>
<text x="754" y="381" class="fig-muted fig-small">state is read, not kept</text>
<text x="20" y="424" class="fig-you fig-small">you: label a green batch pull request approved-fr</text>
</svg>
